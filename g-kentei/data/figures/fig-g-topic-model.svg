<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 438" role="img" aria-labelledby="fig-g-topic-model-t fig-g-topic-model-d">
<title id="fig-g-topic-model-t">トピックモデル（LDA）の考え方</title>
<desc id="fig-g-topic-model-d">上に文書3つ、中にトピック3つ（政治・スポーツ・経済）、下に各トピックの単語。各文書は、いくつかのトピックの混合として表される。線の太さが割合で、文書1は政治が6割、スポーツが3割、経済が1割、のように考える。各トピックは、単語の確率分布で、政治なら選挙や法案、スポーツなら試合や優勝といった単語が出やすい。数値は架空の例。1つの文書が複数の話題を持てる点が、1つのグループに分けるクラスタリングとの違い。</desc>
<text x="12" y="20" class="tb">文書 → トピック → 単語（数値は架空の例）</text>
<line x1="58" y1="80" x2="58" y2="166" class="l sa w3"/>
<line x1="58" y1="80" x2="160" y2="166" class="l swn w2"/>
<line x1="58" y1="80" x2="262" y2="166" class="l sok w1"/>
<line x1="160" y1="80" x2="58" y2="166" class="l sa w1"/>
<line x1="160" y1="80" x2="160" y2="166" class="l swn w1"/>
<line x1="160" y1="80" x2="262" y2="166" class="l sok w3"/>
<line x1="262" y1="80" x2="58" y2="166" class="l sa"/>
<line x1="262" y1="80" x2="160" y2="166" class="l swn w3"/>
<line x1="262" y1="80" x2="262" y2="166" class="l sok w1"/>
<rect x="18" y="44" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="58" y="67" class="tb" text-anchor="middle">文書1</text>
<rect x="120" y="44" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="67" class="tb" text-anchor="middle">文書2</text>
<rect x="222" y="44" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="262" y="67" class="tb" text-anchor="middle">文書3</text>
<rect x="12" y="166" width="92" height="36" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="58" y="189" class="tb" text-anchor="middle">政治</text>
<rect x="114" y="166" width="92" height="36" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="160" y="189" class="tb" text-anchor="middle">スポーツ</text>
<rect x="216" y="166" width="92" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="262" y="189" class="tb" text-anchor="middle">経済</text>
<text x="14" y="230">選挙</text>
<rect x="44" y="218" width="30" height="12" class="fs sa" stroke-width="1.5"/>
<text x="14" y="256">法案</text>
<rect x="44" y="244" width="18" height="12" class="fs sa" stroke-width="1.5"/>
<text x="14" y="282">首相</text>
<rect x="44" y="270" width="12" height="12" class="fs sa" stroke-width="1.5"/>
<text x="116" y="230">試合</text>
<rect x="146" y="218" width="30" height="12" class="fs swn" stroke-width="1.5"/>
<text x="116" y="256">優勝</text>
<rect x="146" y="244" width="18" height="12" class="fs swn" stroke-width="1.5"/>
<text x="116" y="282">選手</text>
<rect x="146" y="270" width="12" height="12" class="fs swn" stroke-width="1.5"/>
<text x="218" y="230">株価</text>
<rect x="248" y="218" width="30" height="12" class="fs sok" stroke-width="1.5"/>
<text x="218" y="256">金利</text>
<rect x="248" y="244" width="18" height="12" class="fs sok" stroke-width="1.5"/>
<text x="218" y="282">企業</text>
<rect x="248" y="270" width="12" height="12" class="fs sok" stroke-width="1.5"/>
<text x="12" y="320" class="tm">線の太さ＝割合。棒＝単語の出やすさ</text>
<line x1="12" y1="336" x2="308" y2="336" class="l sb w1"/>
<text x="12" y="360" class="tb">各文書は、トピックの混合</text>
<text x="12" y="380">　例：文書1 ＝ 政治 6割・スポーツ 3割・経済 1割</text>
<text x="12" y="406" class="tb tok">1つの文書が複数の話題を持てる</text>
<text x="12" y="426" class="tm">　（クラスタリングは 1 文書 1 グループ）</text>
</svg>
