<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" role="img" aria-labelledby="fig-g-cutmix-calc-t fig-g-cutmix-calc-d">
<title id="fig-g-cutmix-calc-t">CutMix のラベル：縦100×横100の犬の画像に、縦20×横30の猫を貼ると、犬0.94・猫0.06</title>
<desc id="fig-g-cutmix-calc-d">何のための図か：縦100×横100画素の犬の画像に、猫の画像から切った縦20×横30画素を貼ったとき、ラベルがなぜ犬0.94・猫0.06になるかを、問題と同じ数で見る。CutMix の論文は、ラベルを貼った部分の面積（画素の数）に比例して混ぜる。①絵：犬の画像（青）の右上に、猫の部分（茶）を貼る。各画素は犬か猫のどちらか一方のまま。②画素の数で数える：猫の部分は20×30＝600画素、画像全体は100×100＝10,000画素。猫の割合は600÷10,000＝0.06、犬の割合は1−0.06＝0.94。③取り違えやすい数：縦の長さだけで20÷100＝0.2とすると犬0.8・猫0.2、横の長さだけで30÷100＝0.3とすると犬0.7・猫0.3になるが、どちらも長さの比で、面積の比ではない。ラベルを犬1.0のまま変えないのは、貼らずに隠すだけの Cutout や Random Erasing の扱い。</desc>
<text x="12" y="20" class="tb">CutMix のラベル＝貼った面積の割合</text>
<text x="12" y="42" class="tm">何のための図か：犬 0.94・猫 0.06 になる</text>
<text x="12" y="60" class="tm">理由を、問題と同じ数で見る</text>
<line x1="12" y1="72" x2="308" y2="72" class="l sb w1"/>
<text x="12" y="94" class="tb">① 犬の画像に、猫の一部を貼る</text>
<text x="145" y="116" class="tm" text-anchor="middle">横 100 画素</text>
<text x="62" y="195" class="tm" text-anchor="end">縦</text>
<text x="62" y="213" class="tm" text-anchor="end">100</text>
<rect x="70" y="124" width="150" height="150" class="fas sa" stroke-width="1.5"/>
<text x="120" y="219" class="tb" text-anchor="middle">犬</text>
<rect x="160" y="139" width="45" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="182.5" y="159" class="tb" text-anchor="middle">猫</text>
<line x1="205" y1="154" x2="230" y2="154" class="l sm w1"/>
<text x="234" y="150" class="tm">縦20×</text>
<text x="234" y="168" class="tm">横30</text>
<text x="12" y="296" class="tm">どの画素も、犬か猫のどちらか一方のまま</text>
<line x1="12" y1="308" x2="308" y2="308" class="l sb w1"/>
<text x="12" y="330" class="tb">② 長さではなく、画素の数で数える</text>
<text x="12" y="348" class="tm">猫の部分：20 × 30 ＝ 600 画素</text>
<text x="12" y="366" class="tm">画像全体：100 × 100 ＝ 10,000 画素</text>
<text x="12" y="384" class="tm">猫の割合：600 ÷ 10,000 ＝ 0.06</text>
<text x="12" y="402" class="tm">犬の割合：1 − 0.06 ＝ 0.94</text>
<rect x="12" y="412" width="296" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="432" class="tb tok" text-anchor="middle">ラベル：犬 0.94・猫 0.06</text>
<text x="12" y="464" class="tm">画像の94%が犬、6%が猫なので、ラベルも同じ割合</text>
<line x1="12" y1="476" x2="308" y2="476" class="l sb w1"/>
<text x="12" y="498" class="tb">③ 取り違えやすい数</text>
<text x="12" y="516" class="tng">犬0.8・猫0.2：縦の長さだけ 20÷100</text>
<text x="12" y="534" class="tng">犬0.7・猫0.3：横の長さだけ 30÷100</text>
<text x="12" y="552" class="tm">　どちらも長さの比。面積の比ではない</text>
<text x="12" y="570" class="tng">犬1.0・猫0.0：ラベルを変えない</text>
<text x="12" y="588" class="tm">　貼らずに隠すだけの Cutout・Random Erasing</text>
<text x="12" y="606" class="tm">　の扱い。CutMix は猫を貼った分だけ混ぜる</text>
</svg>
