<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 376" role="img" aria-labelledby="fig-g-dqn-t fig-g-dqn-d">
<title id="fig-g-dqn-t">DQN：ゲーム画面から行動ごとの Q 値を出し、経験再生とターゲットネットワークで学習を安定させる</title>
<desc id="fig-g-dqn-d">DQN は、ゲーム画面を畳み込みネットワークに入れ、行動ごとの Q 値を出す。学習を安定させる工夫が2つある。経験再生は、経験をためておき、ランダムに取り出して学習し、続けて得た経験どうしの強い相関を断つ。ターゲットネットワークは、目標値を計算するネットワークを一定の回数ごとに複製し、その間は固定して、目標値が学習のたびに動く不安定さを減らす。</desc>
<text x="12" y="20" class="tb">DQN：画面から、行動ごとの Q 値</text>
<rect x="12" y="40" width="70" height="44" class="fs sb" stroke-width="1.5"/>
<text x="47" y="57.5" text-anchor="middle">ゲーム</text>
<text x="47" y="75.5" text-anchor="middle">画面</text>
<line x1="82" y1="62" x2="98" y2="62" class="l w2"/>
<polyline points="91,65.85 98,62 91,58.15" class="l w2"/>
<rect x="100" y="40" width="110" height="44" class="fas sa" stroke-width="1.5"/>
<text x="155" y="57.5" text-anchor="middle">畳み込み</text>
<text x="155" y="75.5" text-anchor="middle">ネットワーク</text>
<line x1="210" y1="62" x2="226" y2="62" class="l w2"/>
<polyline points="219,65.85 226,62 219,58.15" class="l w2"/>
<rect x="232" y="58" width="18" height="26" class="fok sok" stroke-width="1.5"/>
<rect x="256" y="70" width="18" height="14" class="fok sok" stroke-width="1.5"/>
<rect x="280" y="50" width="18" height="34" class="fok sok" stroke-width="1.5"/>
<line x1="228" y1="84" x2="306" y2="84" class="l sb w1"/>
<text x="268" y="104" class="tm" text-anchor="middle">行動ごとの Q 値</text>
<line x1="12" y1="120" x2="308" y2="120" class="l sb w1"/>
<text x="12" y="144" class="tb">学習を安定させる2つの工夫</text>
<text x="12" y="168" class="tb ta">経験再生</text>
<rect x="12" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="34" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="56" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="78" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="100" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="122" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<line x1="150" y1="194" x2="176" y2="194" class="l w2"/>
<polyline points="169,197.85 176,194 169,190.15" class="l w2"/>
<rect x="180" y="176" width="18" height="18" class="fok sok" stroke-width="1.5"/>
<rect x="202" y="176" width="18" height="18" class="fok sok" stroke-width="1.5"/>
<text x="12" y="218">経験をためて、ランダムに取り出す</text>
<text x="12" y="238" class="tm">→ 続けて得た経験どうしの強い相関を断つ</text>
<text x="12" y="266" class="tb ta">ターゲットネットワーク</text>
<rect x="12" y="278" width="112" height="40" class="fas sa" stroke-width="1.5"/>
<text x="68" y="293.5" text-anchor="middle">学習中の</text>
<text x="68" y="311.5" text-anchor="middle">ネットワーク</text>
<line x1="124" y1="298" x2="176" y2="298" class="l swn w2"/>
<polyline points="169,301.85 176,298 169,294.15" class="l swn w2"/>
<text x="150" y="290" class="tm" text-anchor="middle">複製</text>
<rect x="178" y="278" width="130" height="40" class="fs sb" stroke-width="1.5"/>
<text x="243" y="293.5" text-anchor="middle">目標値を計算する</text>
<text x="243" y="311.5" text-anchor="middle">ネットワーク（固定）</text>
<text x="12" y="342">一定の回数ごとに複製し、その間は固定する</text>
<text x="12" y="362" class="tm">→ 目標値が学習のたびに動く不安定さを減らす</text>
</svg>