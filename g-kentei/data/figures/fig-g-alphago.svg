<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 666" role="img" aria-labelledby="fig-g-alphago-t fig-g-alphago-d">
<title id="fig-g-alphago-t">AlphaGo の構成と、AlphaGo Zero の違い</title>
<desc id="fig-g-alphago-d">AlphaGoは3つの部品でできている。方策ネットワークが次の手を選び、価値ネットワークが勝敗を予測し、この2つをモンテカルロ木探索と組み合わせる。木探索では、局面から終局までランダムに打つプレイアウトの勝率も手の評価に使う。2つのネットワークは、人間の棋譜からの教師あり学習と、自己対局の強化学習で鍛えた。後継のAlphaGo Zeroは、人間の棋譜を使わず、ルール以外の囲碁の知識も使わず、自己対局の強化学習だけで学んだ。1つのネットワークが自分の次の手と勝者の両方を予測し、それで木探索を強くし、さらに強い自己対局をする、をくり返した。従来のAlphaGoに100勝0敗した。</desc>
<text x="12" y="20" class="tb">① AlphaGo の3つの部品</text>
<rect x="12" y="34" width="142" height="56" class="fas sa" stroke-width="1.5"/>
<text x="83" y="57" class="tb" text-anchor="middle">方策ネットワーク</text>
<text x="83" y="76" text-anchor="middle">次の手を選ぶ</text>
<rect x="166" y="34" width="142" height="56" class="fas sa" stroke-width="1.5"/>
<text x="237" y="57" class="tb" text-anchor="middle">価値ネットワーク</text>
<text x="237" y="76" text-anchor="middle">勝敗を予測する</text>
<line x1="83" y1="92" x2="120" y2="124" class="l sa w2"/>
<polyline points="112.19,122.33 120,124 117.22,116.51" class="l sa w2"/>
<line x1="237" y1="92" x2="200" y2="124" class="l sa w2"/>
<polyline points="202.78,116.51 200,124 207.81,122.33" class="l sa w2"/>
<rect x="12" y="128" width="296" height="56" class="fa" stroke-width="1.5"/>
<text x="160" y="151" class="tb ton" text-anchor="middle">モンテカルロ木探索</text>
<text x="160" y="170" class="ton" text-anchor="middle">先の手を読む</text>
<line x1="160" y1="224" x2="160" y2="186" class="l swn w2"/>
<polyline points="163.85,193 160,186 156.15,193" class="l swn w2"/>
<rect x="12" y="226" width="296" height="56" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="249" class="tb" text-anchor="middle">プレイアウト</text>
<text x="160" y="268" text-anchor="middle">終局までランダムに打った勝率</text>
<text x="12" y="308" class="tb">ネットワークの学び方</text>
<text x="12" y="330">人間の棋譜（教師あり学習）</text>
<text x="12" y="350">＋自己対局（強化学習）</text>
<line x1="12" y1="374" x2="308" y2="374" class="l sb w1"/>
<text x="12" y="402" class="tb">② AlphaGo Zero（後継）</text>
<text x="12" y="424">人間の棋譜なし。ルール以外の</text>
<text x="12" y="444">囲碁の知識もなし。自己対局だけ</text>
<rect x="12" y="458" width="250" height="52" class="fas sa" stroke-width="1.5"/>
<text x="137" y="479.5" text-anchor="middle">1つのネットワークが</text>
<text x="137" y="497.5" text-anchor="middle">次の手と勝者の両方を予測</text>
<line x1="137" y1="512" x2="137" y2="532" class="l sm w2"/>
<polyline points="133.15,525 137,532 140.85,525" class="l sm w2"/>
<rect x="12" y="534" width="250" height="34" class="fas sa" stroke-width="1.5"/>
<text x="137" y="555.5" text-anchor="middle">木探索を強くする</text>
<line x1="137" y1="570" x2="137" y2="590" class="l sm w2"/>
<polyline points="133.15,583 137,590 140.85,583" class="l sm w2"/>
<rect x="12" y="592" width="250" height="34" class="fas sa" stroke-width="1.5"/>
<text x="137" y="613.5" text-anchor="middle">さらに強い自己対局をする</text>
<path d="M262 609 L292 609 L292 484 L264 484" class="l sa w2 dsh"/>
<polyline points="272,478 263,484 272,490" class="l sa w2"/>
<text x="300" y="504"></text>
<text x="12" y="654" class="tb">従来の AlphaGo に 100 勝 0 敗</text>
</svg>
