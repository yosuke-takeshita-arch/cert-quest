<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-g-nist-ai-rmf-t fig-g-nist-ai-rmf-d">
<title id="fig-g-nist-ai-rmf-t">NIST AI RMF の4つの機能：GOVERN が全体を包み、MAP・MEASURE・MANAGE を回す（病院の例）</title>
<desc id="fig-g-nist-ai-rmf-d">例は、病院が診断支援AIを導入する架空の場面。外側の大きな枠がGOVERN（統治）で、責任者と方針を決める。GOVERNはほかの3つの機能の全体にしみわたる、横断の機能。枠の中に3つの機能が上から順に並ぶ。MAP（把握）は、誰が使い、誤るとどんな害が出るかを洗い出す。MEASURE（測定）は、年齢や性別ごとの見逃しの割合を測る。MANAGE（対処）は、見逃しが多い患者層では医師の確認を必ず入れ、問題が出たら止める手順を決める。MANAGEからMAPへ戻る矢印は、必要に応じて行き来しながら繰り返すことを表す。下の注記：統治の仕組みを置いた後、多くの利用者はMAPから始めるが、順番は固定ではない。AI RMFは規制ではなく、組織が任意で使う道具で、罰則は無い。</desc>
<text x="12" y="20" class="tb">NIST AI RMF の4つの機能（病院の例）</text>
<rect x="8" y="32" width="304" height="384" class="fas sa" stroke-width="1.5" rx="8"/>
<text x="20" y="54" class="tb ta">GOVERN（統治）＝全体を包む</text>
<text x="20" y="74">例：責任者と方針を決める</text>
<text x="20" y="92" class="tm">ほかの3つの全部にしみわたる</text>
<rect x="22" y="104" width="248" height="72" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="34" y="124" class="tb">① MAP（把握）</text>
<text x="34" y="144">誰が使い、誤ると</text>
<text x="34" y="162">どんな害が出るかを洗い出す</text>
<line x1="146" y1="176" x2="146" y2="194.4" class="l sm w1"/>
<polygon points="146,200 142.5,194.4 149.5,194.4" class="fm"/>
<rect x="22" y="202" width="248" height="72" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="34" y="222" class="tb">② MEASURE（測定）</text>
<text x="34" y="242">年齢・性別ごとの</text>
<text x="34" y="260">見逃しの割合を測る</text>
<line x1="146" y1="274" x2="146" y2="292.4" class="l sm w1"/>
<polygon points="146,298 142.5,292.4 149.5,292.4" class="fm"/>
<rect x="22" y="300" width="248" height="100" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="34" y="320" class="tb">③ MANAGE（対処）</text>
<text x="34" y="340">見逃しが多い患者層は</text>
<text x="34" y="358">医師の確認を必ず入れる。</text>
<text x="34" y="376">問題が出たら止める手順を</text>
<text x="34" y="394">決めておく</text>
<path d="M 270 350 L 292 350 L 292 140 L 276 140" class="l sa w1" fill="none"/>
<polygon points="270,140 276,136.5 276,143.5" class="fa"/>
<text x="300" y="250" class="ta tb" text-anchor="middle" writing-mode="vertical-rl">繰り返す</text>
<text x="12" y="440" class="tm">多くは①MAPから始めるが、</text>
<text x="12" y="458" class="tm">順番は固定ではなく、行き来する</text>
<text x="12" y="484">規制ではなく、組織が任意で使う道具</text>
<text x="12" y="504">（罰則は無い）</text>
</svg>
