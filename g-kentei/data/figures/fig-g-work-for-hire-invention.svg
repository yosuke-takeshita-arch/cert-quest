<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 578" role="img" aria-labelledby="fig-g-work-for-hire-invention-t fig-g-work-for-hire-invention-d">
<title id="fig-g-work-for-hire-invention-t">職務著作と職務発明：会社が作者になるか、権利だけが会社へ移るか</title>
<desc id="fig-g-work-for-hire-invention-d">①職務著作（著作権法第15条）。社員が仕事として前処理のプログラムを書くと、著作者は会社になり、社員は著作者にならない。条件は、会社の発意・職務上の作成・別の定めが無いこと。プログラム以外は会社名義で公表するものであることも要る。権利は書いた時に手続なしで発生する。②職務発明（特許法第35条）。研究員が仕事として不良品検出の新しい手法を発明する。就業規則などであらかじめ定めていれば、権利は発明した時から会社のもので、研究員は相当の利益を受ける権利を持つ。定めが無ければ、権利は研究員にあり、会社は通常実施権（その発明を使う権利）を持つ。どちらでも発明者は研究員のまま。見分け方：著作は会社そのものが作者になり、発明は作者は社員のままで権利が会社へ移る。</desc>
<text x="12" y="20" class="tb">職務著作と職務発明：作者は誰か</text>
<text x="12" y="44" class="tb ta">① 職務著作（著作権法 第15条）</text>
<rect x="12" y="56" width="84" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="54" y="78" class="tb" text-anchor="middle">社員</text>
<text x="112" y="66" class="tm" text-anchor="middle">書く</text>
<line x1="96" y1="73" x2="124.4" y2="73" class="l sm w1"/>
<polygon points="130,73 124.4,69.5 124.4,76.5" class="fm"/>
<rect x="130" y="56" width="178" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="219" y="78" text-anchor="middle">前処理のプログラム</text>
<line x1="219" y1="90" x2="219" y2="104.4" class="l sm w1"/>
<polygon points="219,110 215.5,104.4 222.5,104.4" class="fm"/>
<rect x="130" y="110" width="178" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="219" y="133" class="tb tok" text-anchor="middle">著作者＝会社</text>
<text x="54" y="122" class="tng" text-anchor="middle">社員は</text>
<text x="54" y="140" class="tng" text-anchor="middle">著作者でない</text>
<text x="12" y="170" class="tm">条件：会社の発意・職務上・別の定めが無い</text>
<text x="12" y="190" class="tm">プログラム以外は、会社名義の公表も要る</text>
<text x="12" y="210" class="tm">権利は書いた時に、手続なしで発生</text>
<line x1="12" y1="226" x2="308" y2="226" class="l sb w1"/>
<text x="12" y="250" class="tb ta">② 職務発明（特許法 第35条）</text>
<rect x="12" y="262" width="84" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="54" y="284" class="tb" text-anchor="middle">研究員</text>
<text x="112" y="272" class="tm" text-anchor="middle">発明</text>
<line x1="96" y1="279" x2="124.4" y2="279" class="l sm w1"/>
<polygon points="130,279 124.4,275.5 124.4,282.5" class="fm"/>
<rect x="130" y="262" width="178" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="219" y="284" text-anchor="middle">不良品検出の新しい手法</text>
<line x1="219" y1="296" x2="219" y2="306" class="l sm w1"/>
<line x1="84" y1="306" x2="236" y2="306" class="l sm w1"/>
<line x1="84" y1="306" x2="84" y2="316.4" class="l sm w1"/>
<polygon points="84,322 80.5,316.4 87.5,316.4" class="fm"/>
<line x1="236" y1="306" x2="236" y2="316.4" class="l sm w1"/>
<polygon points="236,322 232.5,316.4 239.5,316.4" class="fm"/>
<rect x="12" y="322" width="144" height="82" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="84" y="342" class="tb tok" text-anchor="middle">前もって定めあり</text>
<text x="84" y="364" text-anchor="middle">権利は最初から</text>
<text x="84" y="384" class="tb" text-anchor="middle">会社のもの</text>
<rect x="164" y="322" width="144" height="82" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="236" y="342" class="tb" text-anchor="middle">定めなし</text>
<text x="236" y="364" text-anchor="middle">権利は研究員</text>
<text x="236" y="384" text-anchor="middle">会社は通常実施権</text>
<text x="236" y="400" class="tm" text-anchor="middle">（使う権利）</text>
<line x1="84" y1="404" x2="84" y2="414.4" class="l sm w1"/>
<polygon points="84,420 80.5,414.4 87.5,414.4" class="fm"/>
<rect x="12" y="420" width="144" height="48" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="84" y="440" class="twn" text-anchor="middle">研究員は</text>
<text x="84" y="458" class="tb twn" text-anchor="middle">相当の利益を受ける</text>
<text x="12" y="490" class="tb">発明者は、どちらでも研究員のまま</text>
<line x1="12" y1="506" x2="308" y2="506" class="l sb w1"/>
<text x="12" y="530" class="tb">見分け方</text>
<text x="12" y="550">著作：会社そのものが作者になる</text>
<text x="12" y="570">発明：作者は社員のまま、権利が会社へ</text>
</svg>
