<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 522" role="img" aria-labelledby="fig-g-rlhf-t fig-g-rlhf-d">
<title id="fig-g-rlhf-t">RLHF の3段階（InstructGPT）</title>
<desc id="fig-g-rlhf-d">RLHF（人間のフィードバックによる強化学習）は3つの段階で進む。1つ目は、人が書いた手本で言語モデルを教師ありファインチューニング（SFT）する。2つ目は、同じ入力に対するモデルの出力を人が良い順に並べ、そのデータから、どの出力が好まれるかを予測する報酬モデル（RM）を学習する。3つ目は、報酬モデルの点数を報酬として、PPO で強化学習して言語モデルを調整する。報酬そのものを人の評価から学ぶ。</desc>
<text x="12" y="20" class="tb">① 手本で、教師ありファインチューニング</text>
<rect x="12" y="36" width="90" height="40" class="fs sb" stroke-width="1.5"/>
<text x="57" y="51.5" text-anchor="middle">人が書いた</text>
<text x="57" y="69.5" text-anchor="middle">手本</text>
<line x1="102" y1="56" x2="118" y2="56" class="l w2"/>
<polyline points="111,59.85 118,56 111,52.15" class="l w2"/>
<rect x="120" y="36" width="90" height="40" class="fas sa" stroke-width="1.5"/>
<text x="165" y="60.5" text-anchor="middle">言語モデル</text>
<line x1="210" y1="56" x2="226" y2="56" class="l w2"/>
<polyline points="219,59.85 226,56 219,52.15" class="l w2"/>
<rect x="228" y="36" width="80" height="40" class="fok sok" stroke-width="1.5"/>
<text x="268" y="51.5" class="tb" text-anchor="middle">SFT</text>
<text x="268" y="69.5" class="tb" text-anchor="middle">モデル</text>
<line x1="12" y1="96" x2="308" y2="96" class="l sb w1"/>
<text x="12" y="120" class="tb">② 人の順位から、報酬モデルを学ぶ</text>
<text x="12" y="144">同じ入力に対する出力を、人が良い順に並べる</text>
<rect x="12" y="156" width="70" height="28" class="fs sb" stroke-width="1.5"/>
<text x="47" y="174.5" text-anchor="middle">出力 B</text>
<text x="47" y="204" class="tb ta" text-anchor="middle">1位</text>
<rect x="88" y="156" width="70" height="28" class="fs sb" stroke-width="1.5"/>
<text x="123" y="174.5" text-anchor="middle">出力 A</text>
<text x="123" y="204" class="tb ta" text-anchor="middle">2位</text>
<rect x="164" y="156" width="70" height="28" class="fs sb" stroke-width="1.5"/>
<text x="199" y="174.5" text-anchor="middle">出力 C</text>
<text x="199" y="204" class="tb ta" text-anchor="middle">3位</text>
<line x1="160" y1="214" x2="160" y2="238" class="l w2"/>
<polyline points="156.15,231 160,238 163.85,231" class="l w2"/>
<rect x="40" y="240" width="240" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="255.5" text-anchor="middle">報酬モデル（RM）</text>
<text x="160" y="273.5" text-anchor="middle">どの出力が好まれるかを予測</text>
<line x1="12" y1="300" x2="308" y2="300" class="l sb w1"/>
<text x="12" y="324" class="tb">③ 報酬モデルの点数で、強化学習（PPO）</text>
<rect x="12" y="342" width="90" height="40" class="fas sa" stroke-width="1.5"/>
<text x="57" y="366.5" text-anchor="middle">言語モデル</text>
<line x1="102" y1="362" x2="122" y2="362" class="l w2"/>
<polyline points="115,365.85 122,362 115,358.15" class="l w2"/>
<rect x="124" y="342" width="70" height="40" class="fs sb" stroke-width="1.5"/>
<text x="159" y="366.5" text-anchor="middle">出力</text>
<line x1="194" y1="362" x2="214" y2="362" class="l w2"/>
<polyline points="207,365.85 214,362 207,358.15" class="l w2"/>
<rect x="216" y="342" width="92" height="40" class="fok sok" stroke-width="1.5"/>
<text x="262" y="357.5" text-anchor="middle">報酬モデル</text>
<text x="262" y="375.5" text-anchor="middle">（点数）</text>
<polyline points="262,384 262,408 57,408 57,384" class="l swn w2"/>
<polyline points="51,392 57,384 63,392" class="l swn w2"/>
<text x="160" y="428" class="tb twn" text-anchor="middle">点数を報酬にして、PPO で言語モデルを調整</text>
<text x="12" y="466" class="tb">人の評価が使われる場所</text>
<text x="12" y="488">・手本（①）　・出力の順位（②）</text>
<text x="12" y="510" class="tb tok">報酬そのものを、人の評価から学ぶ</text>
</svg>
