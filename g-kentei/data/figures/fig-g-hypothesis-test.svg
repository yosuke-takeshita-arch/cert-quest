<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1118" role="img" aria-labelledby="fig-g-hypothesis-test-t fig-g-hypothesis-test-d">
<title id="fig-g-hypothesis-test-t">仮説検定：棄却域・p値と、第一種・第二種の過誤</title>
<desc id="fig-g-hypothesis-test-d">上の図は、帰無仮説が正しいときの検定統計量の分布。両側5%なら臨界値は±1.96で、その外側が棄却域（面積の合計が有意水準α）。観測値は z=2.5。z は、測った平均と仮定した平均のずれを、平均のばらつきで割った値で、ずれがばらつき何個分かを表す。部品の例では (52.5−50)÷(4÷√16)＝2.5÷1＝2.5。観測値の外側の面積の合計がp値で約0.012。p値がα以下なので帰無仮説を棄却する。中の図は帰無仮説と対立仮説の2つの分布を重ね、しきい値の右の帰無側の面積がα（第一種の過誤）、左の対立側の面積がβ（第二種の過誤）、右の対立側の面積が検出力1−β。下の表は、真実と判断の組み合わせ4通り。</desc>
