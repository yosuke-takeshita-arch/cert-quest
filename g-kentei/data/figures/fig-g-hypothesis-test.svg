<title id="fig-g-hypothesis-test-t">仮説検定：棄却域・p値と、第一種・第二種の過誤</title>
<desc id="fig-g-hypothesis-test-d">上の図は、帰無仮説が正しいときの検定統計量の分布。両側5%なら臨界値は±1.96で、その外側が棄却域（面積の合計が有意水準α）。観測値z=2.3の外側の面積の合計がp値で約0.021。p値がα以下なので帰無仮説を棄却する。中の図は帰無仮説と対立仮説の2つの分布を重ね、しきい値の右の帰無側の面積がα（第一種の過誤）、左の対立側の面積がβ（第二種の過誤）、右の対立側の面積が検出力1−β。下の表は、真実と判断の組み合わせ4通り。</desc>
