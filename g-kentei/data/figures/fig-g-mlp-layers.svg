<text x="12" y="298" class="tb">入力層：データを受け取る</text>
<text x="12" y="316" class="tm">　画素の値 28×28＝784 個をそのまま入れる</text>
<text x="12" y="340" class="tb ta">隠れ層：別の数の並びに作り変える</text>
<text x="12" y="358" class="tm">　中身は人が決めず、学習で決まる</text>
<text x="12" y="376" class="tm">　入力でも出力でもなく、外から直接</text>
<text x="12" y="394" class="tm">　見えないので「隠れ」と呼ぶ</text>
<text x="12" y="418" class="tb">出力層：予測の結果を出す</text>
<text x="12" y="436" class="tm">　0〜9 の10個のうち、いちばん大きい</text>
<text x="12" y="454" class="tm">　「3」を答える（例）</text>
<text x="12" y="476">計算は 入力層 → 隠れ層 → 出力層 の順</text>
