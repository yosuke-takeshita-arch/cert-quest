<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 482" role="img" aria-labelledby="fig-g-mlp-layers-t fig-g-mlp-layers-d">
<title id="fig-g-mlp-layers-t">入力層・隠れ層・出力層：手書き数字の画像から 0〜9 を当てる例</title>
<desc id="fig-g-mlp-layers-d">例は手書き数字の画像から0〜9を当てること。左から入力層・隠れ層・出力層の3列に丸（ユニット）が並び、隣り合う列の丸どうしが線でつながる。入力層は画素の値を受け取り、28×28＝784個ある（図では一部だけ描く）。隠れ層は、それを別の数の並びに作り変える。個数は設計で決める。中身は人が決めず学習で決まる。入力でも出力でもなく、外から直接見えないので「隠れ」と呼ぶ。出力層は0〜9の10個で、いちばん大きい3を答える（例）。計算は入力層、隠れ層、出力層の順に進む。</desc>
<text x="12" y="20" class="tb">入力層・隠れ層・出力層</text>
<text x="12" y="38" class="tm">例：手書き数字の画像から 0〜9 を当てる</text>
<text x="50" y="62" class="tb" text-anchor="middle">入力層</text>
<text x="50" y="80" class="tm" text-anchor="middle">画素の値</text>
<text x="160" y="62" class="tb" text-anchor="middle">隠れ層</text>
<text x="160" y="80" class="tm" text-anchor="middle">作り変える</text>
<text x="262" y="62" class="tb" text-anchor="middle">出力層</text>
<text x="262" y="80" class="tm" text-anchor="middle">答え</text>
