<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 602" role="img" aria-labelledby="fig-g-bert-gpt-t fig-g-bert-gpt-d">
<title id="fig-g-bert-gpt-t">BERT（双方向・エンコーダ）と GPT（左から右・デコーダ）</title>
<desc id="fig-g-bert-gpt-d">5つの語の列で、各位置がどこまで見えるかを表で比べる。BERT は Transformer のエンコーダを使い、各位置が左右すべての位置を見る双方向。事前学習は、入力の一部を隠して当てる Masked Language Model と、2文が連続するかを当てる Next Sentence Prediction。GPT 系はデコーダを使い、各位置は自分より左だけを見て、次の単語を予測する。BERT は事前学習のあと出力層を足してファインチューニングする。GPT-3 は重みを更新せず、例を数個示す Few-shot でタスクをこなす。</desc>
