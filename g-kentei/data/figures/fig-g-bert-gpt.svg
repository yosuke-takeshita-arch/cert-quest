<text x="255" y="226" text-anchor="middle">自分より左だけ</text>
<line x1="12" y1="246" x2="308" y2="246" class="l sb w1"/>
<text x="12" y="270" class="tb">BERT：エンコーダ（理解向け）</text>
<text x="12" y="292">事前学習の課題が2つ</text>
<text x="12" y="314" class="tb ta">・Masked Language Model</text>
<text x="12" y="334">　入力の一部を隠して当てる</text>
<text x="12" y="358" class="tb ta">・Next Sentence Prediction</text>
<text x="12" y="378">　2文が連続するかを当てる</text>
<line x1="12" y1="396" x2="308" y2="396" class="l sb w1"/>
<text x="12" y="420" class="tb">GPT 系：デコーダ（生成向け）</text>
<text x="12" y="442">左から右へ、次の単語を予測する</text>
<line x1="12" y1="460" x2="308" y2="460" class="l sb w1"/>
<text x="12" y="484" class="tb">使い方のちがい</text>
<rect x="12" y="496" width="296" height="44" class="fas sa" stroke-width="1.5"/>
<text x="160" y="513.5" text-anchor="middle">BERT：事前学習のあと、出力層を足して</text>
<text x="160" y="531.5" text-anchor="middle">ファインチューニング</text>
<rect x="12" y="550" width="296" height="44" class="fok sok" stroke-width="1.5"/>
<text x="160" y="567.5" text-anchor="middle">GPT-3：重みを更新せず、</text>
<text x="160" y="585.5" text-anchor="middle">例を数個示す（Few-shot）</text>
</svg>
