<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 622" role="img" aria-labelledby="fig-g-crisp-dm-t fig-g-crisp-dm-d">
<title id="fig-g-crisp-dm-t">CRISP-DM と CRISP-ML の工程</title>
<desc id="fig-g-crisp-dm-d">左がCRISP-DMの6フェーズ：ビジネス理解、データ理解、データ準備、モデリング、評価、展開。前の段階に戻ることがある。右がCRISP-MLの工程：ビジネス理解とデータ理解を1つにまとめ（データがあるかが実現可能性を左右するため）、データ準備、モデリング、評価、展開に続き、最後に監視・保守を加えた（環境が変わるとモデルの性能が劣化するため）。違う箇所は色を変えて示す。見出しの下に略語の元の英語を添える：CRISP-DM は CRoss-Industry Standard Process for Data Mining、CRISP-ML（CRISP-ML(Q)）は CRoss-Industry Standard Process model for the development of Machine Learning applications with Quality assurance methodology の略。</desc>
<text x="12" y="20" class="tb">CRISP-DM</text>
<text x="188" y="20" class="tb">CRISP-ML</text>
<text x="12" y="38" class="tm">CRoss-Industry</text>
<text x="12" y="54" class="tm">Standard Process</text>
<text x="12" y="70" class="tm">for Data Mining</text>
<text x="188" y="38" class="tm">CRISP：左と同じ</text>
<text x="188" y="54" class="tm">Machine Learning</text>
<text x="188" y="70" class="tm">with Quality</text>
<text x="188" y="86" class="tm">assurance</text>
