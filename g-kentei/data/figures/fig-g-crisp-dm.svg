<text x="12" y="522" class="tb">橙の箱が CRISP-ML で変わった所</text>
<text x="12" y="546">・ビジネスとデータの理解を1つに</text>
<text x="12" y="566" class="tm">　（データの有無が実現可能性を左右）</text>
<text x="12" y="590">・最後に監視・保守を追加</text>
<text x="12" y="610" class="tm">　（環境が変わるとモデルが劣化）</text>
