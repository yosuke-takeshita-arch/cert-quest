<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 556" role="img" aria-labelledby="fig-g-crisp-dm-t fig-g-crisp-dm-d">
<title id="fig-g-crisp-dm-t">CRISP-DM と CRISP-ML の工程</title>
<desc id="fig-g-crisp-dm-d">左がCRISP-DMの6フェーズ：ビジネス理解、データ理解、データ準備、モデリング、評価、展開。前の段階に戻ることがある。右がCRISP-MLの工程：ビジネス理解とデータ理解を1つにまとめ（データがあるかが実現可能性を左右するため）、データ準備、モデリング、評価、展開に続き、最後に監視・保守を加えた（環境が変わるとモデルの性能が劣化するため）。違う箇所は色を変えて示す。</desc>
