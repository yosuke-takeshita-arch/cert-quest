<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 328" role="img" aria-labelledby="fig-g-docker-t fig-g-docker-d">
<title id="fig-g-docker-t">Docker：1つのイメージから、同じコンテナをいくつでも作る</title>
<desc id="fig-g-docker-d">上に1つのイメージ。コンテナを作るための指示を含む読み取り専用のひな形。そこから矢印が3本出て、3つのコンテナを作る。コンテナは、イメージを実行した実体。1つは開発者のPCで、2つは本番サーバで動く。どちらの場所でも、同じイメージから作ったので同じ環境で同じように動く。</desc>
<text x="12" y="20" class="tb">① イメージ（ひな形）</text>
<rect x="12" y="34" width="296" height="54" class="fas sa" stroke-width="1.5"/>
<text x="160" y="55.5" class="tb" text-anchor="middle">イメージ</text>
<text x="160" y="75.5" text-anchor="middle">コンテナを作るための読み取り専用のひな形</text>
<rect x="12" y="114" width="140" height="100" class="fs sb" stroke-width="1.5"/>
<text x="82" y="206" class="tb" text-anchor="middle">開発者のPC</text>
<rect x="168" y="114" width="140" height="100" class="fs sb" stroke-width="1.5"/>
<text x="238" y="206" class="tb" text-anchor="middle">本番サーバ</text>
<rect x="52" y="140" width="60" height="40" class="fok sok" stroke-width="1.5"/>
<text x="82" y="164.5" class="tb" text-anchor="middle">コンテナ</text>
<rect x="176" y="140" width="60" height="40" class="fok sok" stroke-width="1.5"/>
<text x="206" y="164.5" class="tb" text-anchor="middle">コンテナ</text>
<rect x="244" y="140" width="60" height="40" class="fok sok" stroke-width="1.5"/>
<text x="274" y="164.5" class="tb" text-anchor="middle">コンテナ</text>
<line x1="82" y1="90" x2="82" y2="138" class="l sok w2"/>
<polyline points="78.15,131 82,138 85.85,131" class="l sok w2"/>
<line x1="206" y1="90" x2="206" y2="138" class="l sok w2"/>
<polyline points="202.15,131 206,138 209.85,131" class="l sok w2"/>
<line x1="274" y1="90" x2="274" y2="138" class="l sok w2"/>
<polyline points="270.15,131 274,138 277.85,131" class="l sok w2"/>
<text x="12" y="246" class="tb">② イメージを実行したものがコンテナ</text>
<text x="12" y="274" class="tb">どちらでも、同じ環境で同じように動く</text>
<text x="12" y="296" class="tm">「開発のPCでは動くのに本番では動かない」</text>
<text x="12" y="316" class="tm">を防げる</text>
</svg>
