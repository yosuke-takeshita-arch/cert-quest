<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 552" role="img" aria-labelledby="fig-g-sigmoid-gradient-t fig-g-sigmoid-gradient-d">
<title id="fig-g-sigmoid-gradient-t">シグモイド関数の傾き：いちばん急な所でも 0.25</title>
<desc id="fig-g-sigmoid-gradient-d">上はシグモイド関数の曲線に、その点での傾きを短い直線（接線）で描いたもの。x＝0でいちばん急で傾き0.25、x＝4ではほぼ平らで傾き0.018。下は傾きだけを縦に拡大して描いたもので山の形になり、頂上はx＝0の0.25、x＝2で0.10、x＝4で0.02。傾きはσ×(1−σ)で、σは0から1なので、σ＝0.5のとき0.5×0.5＝0.25が最大。入力が大きい・小さいと傾きはほぼ0（飽和）。例：x＝3では0.953×0.047でおよそ0.045。隠れ層に重ねると、誤差逆伝播で1層戻るごとにこの傾きが掛かり、0.25を4回掛けると0.25×0.25×0.25×0.25でおよそ0.004になる（勾配消失）。言葉：勾配は、重みを少し動かしたとき、損失がどれだけ変わるか（坂の傾き）。0に近いと、重みがほとんど直らない。</desc>
<text x="12" y="20" class="tb">シグモイドの傾き：いちばん急でも 0.25</text>
<rect x="40" y="32" width="264" height="100" class="sb fs" stroke-width="1"/>
<line x1="40" y1="127" x2="304" y2="127" class="l sm w1"/>
<line x1="172" y1="32" x2="172" y2="132" class="l sm w1"/>
<text x="35" y="131.5" class="tm" text-anchor="end">0</text>
<text x="35" y="86.5" class="tm" text-anchor="end">0.5</text>
<text x="35" y="41.5" class="tm" text-anchor="end">1</text>
<polyline points="40,126.78 43.3,126.74 46.6,126.7 49.9,126.65 53.2,126.6 56.5,126.53 59.8,126.45 63.1,126.37 66.4,126.27 69.7,126.15 73,126.01 76.3,125.85 79.6,125.67 82.9,125.46 86.2,125.21 89.5,124.93 92.8,124.61 96.1,124.23 99.4,123.8 102.7,123.3 106,122.73 109.3,122.08 112.6,121.33 115.9,120.48 119.2,119.51 122.5,118.42 125.8,117.18 129.1,115.79 132.4,114.23 135.7,112.5 139,110.58 142.3,108.47 145.6,106.17 148.9,103.67 152.2,100.99 155.5,98.13 158.8,95.11 162.1,91.96 165.4,88.7 168.7,85.37 172,82 175.3,78.63 178.6,75.3 181.9,72.04 185.2,68.89 188.5,65.87 191.8,63.01 195.1,60.33 198.4,57.83 201.7,55.53 205,53.42 208.3,51.5 211.6,49.77 214.9,48.21 218.2,46.82 221.5,45.58 224.8,44.49 228.1,43.52 231.4,42.67 234.7,41.92 238,41.27 241.3,40.7 244.6,40.2 247.9,39.77 251.2,39.39 254.5,39.07 257.8,38.79 261.1,38.54 264.4,38.33 267.7,38.15 271,37.99 274.3,37.85 277.6,37.73 280.9,37.63 284.2,37.55 287.5,37.47 290.8,37.4 294.1,37.35 297.4,37.3 300.7,37.26 304,37.22" class="l sa w2"/>
<line x1="136.8" y1="118" x2="207.2" y2="46" class="l swn w2"/>
<circle cx="172" cy="82" r="3.5" class="fa"/>
<line x1="238" y1="40.21" x2="282" y2="37.03" class="l swn w2"/>
<circle cx="260" cy="38.62" r="3.5" class="fa"/>
<text x="44" y="50" class="tb twn">いちばん急 0.25</text>
<line x1="260" y1="44.62" x2="260" y2="60" class="l sm w1"/>
<text x="302" y="74" class="tb twn" text-anchor="end">ほぼ平ら 0.018</text>
<text x="40" y="150" class="tm" text-anchor="middle">−6</text>
<text x="172" y="150" class="tm" text-anchor="middle">0</text>
<text x="304" y="150" class="tm" text-anchor="middle">6</text>
<text x="12" y="168" class="tm">曲線がシグモイド σ(x)。短い直線がその点の傾き</text>
<text x="12" y="194">傾きだけを縦に拡大して描くと、頂上が 0.25</text>
<rect x="40" y="204" width="264" height="80" class="sb fs" stroke-width="1"/>
<line x1="40" y1="279" x2="304" y2="279" class="l sm w1"/>
<line x1="172" y1="204" x2="172" y2="284" class="l sm w1"/>
<text x="35" y="283.5" class="tm" text-anchor="end">0</text>
<text x="35" y="213.5" class="tm" text-anchor="end">0.25</text>
<polyline points="40,278.31 43.3,278.2 46.6,278.07 49.9,277.92 53.2,277.75 56.5,277.55 59.8,277.31 63.1,277.04 66.4,276.73 69.7,276.37 73,275.96 76.3,275.48 79.6,274.92 82.9,274.29 86.2,273.55 89.5,272.71 92.8,271.75 96.1,270.65 99.4,269.39 102.7,267.97 106,266.35 109.3,264.53 112.6,262.48 115.9,260.19 119.2,257.65 122.5,254.85 125.8,251.79 129.1,248.47 132.4,244.92 135.7,241.16 139,237.24 142.3,233.22 145.6,229.19 148.9,225.23 152.2,221.46 155.5,217.99 158.8,214.94 162.1,212.43 165.4,210.55 168.7,209.39 172,209 175.3,209.39 178.6,210.55 181.9,212.43 185.2,214.94 188.5,217.99 191.8,221.46 195.1,225.23 198.4,229.19 201.7,233.22 205,237.24 208.3,241.16 211.6,244.92 214.9,248.47 218.2,251.79 221.5,254.85 224.8,257.65 228.1,260.19 231.4,262.48 234.7,264.53 238,266.35 241.3,267.97 244.6,269.39 247.9,270.65 251.2,271.75 254.5,272.71 257.8,273.55 261.1,274.29 264.4,274.92 267.7,275.48 271,275.96 274.3,276.37 277.6,276.73 280.9,277.04 284.2,277.31 287.5,277.55 290.8,277.75 294.1,277.92 297.4,278.07 300.7,278.2 304,278.31" class="l swn w2 dsh"/>
<line x1="40" y1="209" x2="304" y2="209" class="l sm w1 dot"/>
<circle cx="216" cy="249.6" r="3.5" class="fa"/>
<text x="224" y="243.6" class="tb twn">0.10</text>
<circle cx="260" cy="274.05" r="3.5" class="fa"/>
<text x="268" y="268.05" class="tb twn">0.02</text>
<text x="40" y="302" class="tm" text-anchor="middle">−6</text>
<text x="172" y="302" class="tm" text-anchor="middle">0</text>
<text x="304" y="302" class="tm" text-anchor="middle">6</text>
<text x="12" y="320">傾き ＝ σ×(1−σ)。σ は 0〜1 なので</text>
<text x="12" y="338">σ＝0.5（x＝0）のとき 0.5×0.5＝0.25 が最大</text>
<text x="12" y="358" class="tb">→ 傾きはいつも 0.25 以下</text>
<text x="12" y="376" class="tm">入力が大きい・小さいと、傾きはほぼ 0（飽和）</text>
<text x="12" y="398">例：x＝3 では 0.953×0.047≈0.045</text>
<text x="12" y="422" class="tb">隠れ層に重ねると、1層戻るごとにこれが掛かる</text>
<text x="12" y="442" class="tb twn">0.25×0.25×0.25×0.25≈0.004（勾配消失）</text>
<rect x="12" y="452" width="296" height="88" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="475" class="tb">言葉：勾配</text>
<text x="22" y="493">勾配：重みを少し動かしたとき、損失</text>
<text x="22" y="511">　がどれだけ変わるか（坂の傾き）。</text>
<text x="22" y="529">　0 に近いと、重みがほとんど直らない</text>
</svg>