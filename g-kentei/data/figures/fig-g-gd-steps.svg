<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 606" role="img" aria-labelledby="fig-g-gd-steps-t fig-g-gd-steps-d">
<title id="fig-g-gd-steps-t">勾配降下法：傾きの逆向きへ、学習率×傾きずつ進む</title>
<desc id="fig-g-gd-steps-d">グラフの横軸は重みw、縦軸は誤差で、誤差＝w²の例。U字の曲線の右側を、w＝3から谷底のw＝0へ下る。傾きは、wを少し増やしたとき誤差が何倍で増えるかで、w²なら2×w。1回目：w＝3で傾きは2×3＝6、学習率0.1を掛けた一歩は0.1×6＝0.6、3−0.6＝2.4へ進み、誤差は9から2.4×2.4＝5.76に下がる。2回目：傾き2×2.4＝4.8、一歩0.1×4.8＝0.48、2.4−0.48＝1.92へ進み、誤差は1.92×1.92≈3.69。傾きが小さくなるほど一歩も小さくなり、誤差が最小のw＝0に近づく。傾きを引くのは、傾きが正のときwを増やすと誤差が増えるので、その逆の向きへ進むため。</desc>
<text x="12" y="22" class="tb">① 誤差の坂を、一歩ずつ下る（例）</text>
<text x="12" y="42" class="tm">グラフ：横＝重み w、縦＝誤差（例：誤差＝w²）</text>
<line x1="40" y1="230" x2="305" y2="230" class="l sm w1"/>
<line x1="72.5" y1="60" x2="72.5" y2="230" class="l sm w1 dsh"/>
<text x="72.5" y="246" class="tm" text-anchor="middle">0（谷底）</text>
<text x="267.5" y="246" class="tm" text-anchor="middle">3</text>
<polyline points="40,227 46.5,228.1 53,228.9 59.5,229.5 66,229.9 72.5,230 79,229.9 85.5,229.5 92,228.9 98.5,228.1 105,227 111.5,225.7 118,224.1 124.5,222.3 131,220.3 137.5,218 144,215.5 150.5,212.7 157,209.7 163.5,206.5 170,203 176.5,199.3 183,195.3 189.5,191.1 196,186.7 202.5,182 209,177.1 215.5,171.9 222,166.5 228.5,160.9 235,155 241.5,148.9 248,142.5 254.5,135.9 261,129.1 267.5,122 274,114.7 280.5,107.1 287,99.3 293.5,91.3 300,83" class="l sm w2"/>
<line x1="238.3" y1="154.4" x2="296.8" y2="89.6" class="l swn w2 dsh"/>
<line x1="267.5" y1="122" x2="239.1" y2="150.3" class="l sa w2"/>
<polygon points="232.7,156.6 235.9,147.1 242.3,153.5" class="fa"/>
<line x1="228.5" y1="160.9" x2="209" y2="176.4" class="l sa w2"/>
<polygon points="202,182 206.2,172.9 211.8,179.9" class="fa"/>
<line x1="197.3" y1="185.8" x2="185" y2="193.6" class="l sa w2"/>
<polygon points="177.4,198.5 182.6,189.8 187.4,197.4" class="fa"/>
<circle cx="267.5" cy="122" r="5" class="fwn swn"/>
<circle cx="228.5" cy="160.9" r="4" class="fs sa"/>
<circle cx="197.3" cy="185.8" r="4" class="fs sa"/>
<circle cx="172.3" cy="201.7" r="4" class="fs sa"/>
<text x="257.5" y="110" class="tb" text-anchor="end">w＝3（誤差 9）</text>
<text x="281.5" y="142" class="tb twn">傾き 6</text>
<text x="238.5" y="178.9" class="tm">2.4（5.76）</text>
<text x="191.3" y="211.7" class="tm">1.92（3.69）</text>
<text x="12" y="270" class="tm">傾き＝w を少し増やすと、誤差が何倍で増えるか</text>
<text x="12" y="290" class="tm">（w² なら 2×w。黄色の点線＝w＝3 での傾き）</text>
<line x1="12" y1="304" x2="308" y2="304" class="l sb w1"/>
<text x="12" y="328" class="tb">② 計算（学習率 0.1）</text>
<text x="12" y="350" class="tm">新しい w＝いまの w−学習率×傾き</text>
<text x="12" y="376" class="tb">1回目 w＝3</text>
<text x="24" y="398">傾き 2×3＝6、一歩 0.1×6＝0.6</text>
<text x="24" y="420">3−0.6＝2.4、誤差 9 → 5.76</text>
<text x="12" y="446" class="tb">2回目 w＝2.4</text>
<text x="24" y="468">傾き 2×2.4＝4.8、一歩 0.1×4.8＝0.48</text>
<text x="24" y="490">2.4−0.48＝1.92、誤差 5.76 → 3.69</text>
<rect x="12" y="504" width="296" height="48" class="fok l sok w1" rx="4"/>
<text x="160" y="524" class="tb tok" text-anchor="middle">坂がゆるむほど一歩も小さくなり、</text>
<text x="160" y="543" class="tb tok" text-anchor="middle">誤差が最小の w＝0 に近づく</text>
<text x="12" y="574" class="tm">なぜ引くか：傾きが＋なら、w を増やすと誤差が</text>
<text x="12" y="594" class="tm">増える。だから逆（w を減らす向き）へ進む</text>
</svg>
