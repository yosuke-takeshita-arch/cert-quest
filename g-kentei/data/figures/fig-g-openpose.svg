<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 850" role="img" aria-labelledby="fig-g-openpose-t fig-g-openpose-d">
<title id="fig-g-openpose-t">OpenPose：関節点を先に全部見つけ、PAF で人ごとに組み立てるボトムアップ型の姿勢推定</title>
<desc id="fig-g-openpose-d">姿勢推定は、人の関節点（肩・肘・膝など）の位置を当てるタスク。複数人が写っていると、どの関節がどの人のものかを決める必要がある。①2つのやり方（例：10人写っている画像）。トップダウン型は人を検出してから1人ずつ推定するので、1人分の推定を10回くり返し、人数に比例して遅くなる。人の検出に失敗すると、その人の姿勢は立て直せない。ボトムアップ型の OpenPose は、画像全体から関節点を一度に見つけ、あとで人ごとに組み立てる。②人数と計算時間のグラフ：トップダウン型は人数とともに右上がり、OpenPose の CNN の部分は人数によらず一定。③組み立て方の例：2人の肩（丸）と肘（四角）が見つかった。青い矢印は PAF（Part Affinity Fields）で、肩と肘を結ぶ上腕のような部位の位置と向きを画素ごとの矢印（2次元ベクトル）で表した地図。CNN が画像から推定する。緑の線は、線に沿って矢印の向きがそろうので同じ人の肩と肘として結ぶ。破線は矢印の無い所を横切るので、別の人どうしとして結ばない。混同しやすい点：Mask R-CNN の姿勢推定は人を先に検出するトップダウン型。</desc>
<text x="12" y="20" class="tb">OpenPose：関節点を先に全部見つけ、</text>
<text x="12" y="40" class="tb">あとで人ごとに組み立てる</text>
<text x="12" y="62" class="tm">姿勢推定＝人の関節点（肩・肘・膝など）の</text>
<text x="12" y="80" class="tm">位置を当てる。複数人だと「どの関節が</text>
<text x="12" y="98" class="tm">どの人のものか」を決める必要がある</text>
<rect x="12" y="110" width="296" height="128" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="130" class="tb">① 2つのやり方（例：10人写っている）</text>
<text x="24" y="154" class="tb twn">トップダウン型：人を検出→1人ずつ推定</text>
<text x="24" y="172">1人分の推定を10回。人数に比例して遅くなる</text>
<text x="24" y="190" class="tm">人の検出に失敗すると、その人は立て直せない</text>
<text x="24" y="212" class="tb tok">ボトムアップ型（OpenPose）：画像全体から</text>
<text x="24" y="230">関節点を一度に見つけ、あとで人ごとに組む</text>
<rect x="12" y="246" width="296" height="150" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="266" class="tb">② 人数と計算時間（CNN の部分）</text>
<line x1="60" y1="370" x2="260" y2="370" class="l sm w1"/>
<line x1="60" y1="370" x2="60" y2="284" class="l sm w1"/>
<text x="160" y="388" class="tm" text-anchor="middle">人数 →</text>
<text x="54" y="292" class="tm" text-anchor="end">時間</text>
<text x="80" y="388" class="tm" text-anchor="middle">1人</text>
<text x="240" y="388" class="tm" text-anchor="middle">10人</text>
<line x1="80" y1="350" x2="240" y2="290" class="l swn w2"/>
<line x1="80" y1="350" x2="240" y2="350" class="l sok w2"/>
<text x="170" y="314" class="tb twn" text-anchor="end">トップダウン</text>
<text x="244" y="342" class="tb tok" text-anchor="end">OpenPose：一定</text>
<line x1="160" y1="396" x2="160.0" y2="404.4" class="l sm w1"/>
<polygon points="160,410 156.5,404.4 163.5,404.4" class="fm"/>
<rect x="12" y="416" width="296" height="344" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="436" class="tb">③ どの関節どうしが同じ人かを決める</text>
<text x="24" y="456" class="tm">例：2人の肩（●）と肘（■）が見つかった</text>
<line x1="80" y1="488" x2="196" y2="564" class="l sm w1 dsh"/>
<line x1="220" y1="488" x2="110" y2="564" class="l sm w1 dsh"/>
<line x1="73" y1="503" x2="77.6" y2="514.6" class="l sa w1"/>
<polygon points="79.6,519.8 74.3,515.9 80.8,513.3" class="fa"/>
<line x1="80.5" y1="522" x2="85.1" y2="533.6" class="l sa w1"/>
<polygon points="87.1,538.8 81.8,534.9 88.3,532.3" class="fa"/>
<line x1="88" y1="541" x2="92.6" y2="552.6" class="l sa w1"/>
<polygon points="94.6,557.8 89.3,553.9 95.8,551.3" class="fa"/>
<line x1="80" y1="488" x2="110" y2="564" class="l sok w2"/>
<line x1="205.3" y1="494.8" x2="201.5" y2="506.7" class="l sa w1"/>
<polygon points="199.8,512 198.2,505.6 204.8,507.7" class="fa"/>
<line x1="199.3" y1="513.8" x2="195.5" y2="525.7" class="l sa w1"/>
<polygon points="193.8,531 192.2,524.6 198.8,526.7" class="fa"/>
<line x1="193.3" y1="532.8" x2="189.5" y2="544.7" class="l sa w1"/>
<polygon points="187.8,550 186.2,543.6 192.8,545.7" class="fa"/>
<line x1="220" y1="488" x2="196" y2="564" class="l sok w2"/>
<circle cx="80" cy="488" r="7" class="ft"/>
<circle cx="220" cy="488" r="7" class="ft"/>
<rect x="104" y="558" width="12" height="12" class="ft"/>
<rect x="190" y="558" width="12" height="12" class="ft"/>
<text x="80" y="476" class="tm" text-anchor="middle">肩</text>
<text x="220" y="476" class="tm" text-anchor="middle">肩</text>
<text x="110" y="588" class="tm" text-anchor="middle">肘</text>
<text x="196" y="588" class="tm" text-anchor="middle">肘</text>
<text x="160" y="498" class="tb" text-anchor="middle">？</text>
<text x="24" y="612" class="tb ta">青い矢印＝PAF（Part Affinity Fields）</text>
<text x="24" y="630">肩と肘を結ぶ上腕のような部位の、位置と</text>
<text x="24" y="648">向きを、画素ごとの矢印（2次元ベクトル）</text>
<text x="24" y="666">で表した地図。CNN が画像から推定する</text>
<text x="24" y="690" class="tok">緑の線：線に沿って矢印の向きがそろう</text>
<text x="24" y="708" class="tb tok">　→ 同じ人の肩と肘として結ぶ</text>
<text x="24" y="728" class="tm">破線：矢印の無い所を横切る</text>
<text x="24" y="746" class="tm">　→ 別の人どうしなので結ばない</text>
<rect x="12" y="772" width="296" height="66" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="792" class="tb">混同しやすい点</text>
<text x="24" y="812">Mask R-CNN の姿勢推定は、人を先に</text>
<text x="24" y="830">検出するトップダウン型</text>
</svg>
