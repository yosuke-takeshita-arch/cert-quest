<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 558" role="img" aria-labelledby="fig-g-validation-t fig-g-validation-d">
<title id="fig-g-validation-t">ホールドアウト検証とk-分割交差検証</title>
<desc id="fig-g-validation-d">上はホールドアウト検証。データを訓練用・検証用・テスト用に一度だけ分ける。訓練用で学習し、検証用でモデルやハイパーパラメータを選び、テスト用は最後に一度だけ汎化性能の確認に使う。下はk-分割交差検証（k=5）。テスト用を取り分けたうえで、残りを5つに分け、評価用の1区画を毎回ずらして5回学習と評価を繰り返す。どの区画も1回は評価に使われ、5回のスコアの平均を結果とする。テストデータはモデル選びに使わない。</desc>
<text x="12" y="20" class="tb">① ホールドアウト：一度だけ分ける</text>
<rect x="12" y="34" width="160" height="40" class="fas sa" stroke-width="1.5"/>
<text x="92" y="59" class="tb" text-anchor="middle">訓練</text>
<rect x="172" y="34" width="70" height="40" class="fwn swn" stroke-width="1.5"/>
<text x="207" y="59" class="tb" text-anchor="middle">検証</text>
<rect x="246" y="34" width="62" height="40" class="fng sng" stroke-width="1.5"/>
<text x="277" y="59" class="tb" text-anchor="middle">テスト</text>
<text x="12" y="98" class="ta">訓練：学習する</text>
<text x="12" y="118" class="twn">検証：モデルやハイパーパラメータを選ぶ</text>
<text x="12" y="138" class="tng">テスト：最後に一度だけ確かめる</text>
<text x="12" y="160" class="tm">（割合は一例）</text>
<line x1="12" y1="176" x2="308" y2="176" class="l sb w1"/>
<text x="12" y="202" class="tb">② k-分割交差検証（k＝5）</text>
<text x="12" y="240" class="tm">1回</text>
<rect x="52" y="216" width="38" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="71" y="238" class="tb twn" text-anchor="middle">0.81</text>
<rect x="90" y="216" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="128" y="216" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="166" y="216" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="204" y="216" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="246" y="216" width="62" height="34" class="fng sng" stroke-width="1.5"/>
<text x="277" y="238" class="tm" text-anchor="middle">テスト</text>
<text x="12" y="284" class="tm">2回</text>
<rect x="52" y="260" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="90" y="260" width="38" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="109" y="282" class="tb twn" text-anchor="middle">0.84</text>
<rect x="128" y="260" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="166" y="260" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="204" y="260" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="246" y="260" width="62" height="34" class="fng sng" stroke-width="1.5"/>
<text x="277" y="282" class="tm" text-anchor="middle">テスト</text>
<text x="12" y="328" class="tm">3回</text>
<rect x="52" y="304" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="90" y="304" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="128" y="304" width="38" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="147" y="326" class="tb twn" text-anchor="middle">0.79</text>
<rect x="166" y="304" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="204" y="304" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="246" y="304" width="62" height="34" class="fng sng" stroke-width="1.5"/>
<text x="277" y="326" class="tm" text-anchor="middle">テスト</text>
<text x="12" y="372" class="tm">4回</text>
<rect x="52" y="348" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="90" y="348" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="128" y="348" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="166" y="348" width="38" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="185" y="370" class="tb twn" text-anchor="middle">0.83</text>
<rect x="204" y="348" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="246" y="348" width="62" height="34" class="fng sng" stroke-width="1.5"/>
<text x="277" y="370" class="tm" text-anchor="middle">テスト</text>
<text x="12" y="416" class="tm">5回</text>
<rect x="52" y="392" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="90" y="392" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="128" y="392" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="166" y="392" width="38" height="34" class="fas sa" stroke-width="1.5"/>
<rect x="204" y="392" width="38" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="223" y="414" class="tb twn" text-anchor="middle">0.85</text>
<rect x="246" y="392" width="62" height="34" class="fng sng" stroke-width="1.5"/>
<text x="277" y="414" class="tm" text-anchor="middle">テスト</text>
<text x="12" y="456">数字の区画が評価用。残りで学習</text>
<text x="12" y="476">どの区画も1回は評価に使われる</text>
<text x="12" y="502" class="tb">5回のスコアの平均 ＝ 0.82</text>
<line x1="12" y1="520" x2="308" y2="520" class="l sb w1"/>
<text x="12" y="546" class="tb tng">テストデータは、モデル選びに使わない</text>
</svg>
