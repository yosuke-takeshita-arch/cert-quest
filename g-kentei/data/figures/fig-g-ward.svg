<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1612" role="img" aria-labelledby="fig-g-ward-t fig-g-ward-d">
<title id="fig-g-ward-t">ウォード法：結んだときのばらつきの増え方がいちばん小さい組から結ぶ</title>
<desc id="fig-g-ward-d">ウォード法は、階層的クラスタリングで次にどの2つのまとまりを結ぶかを、距離ではなく、結んだときのばらつきの増え方で決める。ばらつきは各点と中心（平均）の差を2乗して足した値。例は数直線上の4点1・2・3・10で、いまのまとまりは{1,2}（青）・{3}（緑）・{10}（茶）。①まとめる前のばらつきは、{1,2}が中心1.5で差0.5と0.5なので0.25＋0.25＝0.5、{3}と{10}は1点だけなので0。②結ぶ候補を全部試す。増え方＝まとめた後のばらつき−まとめる前の合計。候補A {1,2}＋{3}は中心2、差1・0・1でまとめた後2、増え方は2−0.5＝1.5。候補B {3}＋{10}は中心6.5、差3.5と3.5でまとめた後12.25＋12.25＝24.5、増え方24.5。候補C {1,2}＋{10}は中心13/3（約4.3）、差は約3.3・2.3・5.7でまとめた後約48.7、増え方は約48.7−0.5＝約48.2。③増え方を棒で比べ、いちばん小さいA（{1,2}と{3}）を結ぶ。次は{1,2,3}と{10}を同じように比べ、1つになるまでくり返す。④距離で選ぶ方法とは結ぶ組が変わる例。{1,2,3,4}・{6}・{9}では、最短距離法（いちばん近い2点の距離）は{1,2,3,4}と{6}が2、{6}と{9}が3、{1,2,3,4}と{9}が5なので{1,2,3,4}＋{6}を結ぶ。ウォード法では、{1,2,3,4}のばらつきは中心2.5で2.25＋0.25＋0.25＋2.25＝5、{1,2,3,4}＋{6}は中心3.2でまとめた後14.8、増え方9.8。{6}＋{9}は中心7.5で2.25＋2.25＝4.5、増え方4.5。{1,2,3,4}＋{9}は増え方33.8。だから{6}＋{9}を結び、最短距離法と逆になる。点の多いまとまりに足すと中心が動いて中の全部の点の差が広がるので増え方が大きく、大きさのそろったまとまりになりやすい。</desc>
<text x="12" y="20" class="tb">ウォード法：ばらつきの増え方で選ぶ</text>
<text x="12" y="42" class="tm">例：数直線上の4点 1・2・3・10</text>
<text x="12" y="62" class="tm">いまのまとまり：{1,2}（青）・{3}（緑）・</text>
<text x="12" y="80" class="tm">　{10}（茶）。次にどの2つを結ぶか？</text>
<text x="12" y="102" class="tm">ばらつき＝各点と中心（平均）の差を</text>
<text x="12" y="120" class="tm">　2乗して足した値（◆＝中心）</text>
<rect x="12" y="132" width="296" height="134" class="fs sb" stroke-width="1.5" rx="6"/>
