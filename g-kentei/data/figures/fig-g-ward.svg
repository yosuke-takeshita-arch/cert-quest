<text x="146.64359861591697" y="966" class="tb">24.5</text>
<text x="24" y="991" class="tb">C</text>
<rect x="44" y="978" width="190.0" height="18" class="fwn swn" stroke-width="1.5"/>
<text x="240" y="992" class="tb">48.2</text>
<text x="24" y="1024" class="tb tok">→ A（{1,2}と{3}）を結ぶ</text>
<text x="12" y="1056" class="tm">次は {1,2,3} と {10} を同じように比べる</text>
