<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1314" role="img" aria-labelledby="fig-g-batch-norm-t fig-g-batch-norm-d">
<title id="fig-g-batch-norm-t">バッチ正規化：層に届く数の範囲を毎回そろえる。同じ特徴を、ミニバッチの何件ものデータで縦にそろえる</title>
<desc id="fig-g-batch-norm-d">バッチ正規化が何のためで、なぜ数をそろえるかを示してから、計算のしかたを描いた図。何をするものか：ニューラルネットワークは層を何段も重ね、前の層が出した数を次の層が受け取って計算する。バッチ正規化は、層と層のあいだで数の範囲をそろえる係。困りごと：学習中は前の層の重みが毎回直されるので、次の層に届く数の範囲も毎回変わる。例：ある回は2、4、6、8、前の層が直された次の回は20、40、60、80。次の層は前の範囲に合わせて覚えたことが合わなくなり、動く的を追い続けるので、学習率を小さくするなど慎重に進めるしかなく、学習が遅い。どう解決するか：届いた数を毎回、平均0・ばらつき1にそろえてから次の層へ渡す。2、4、6、8も20、40、60、80も、−1.34、−0.45、0.45、1.34になる（平均は5と50、ばらつきの大きさは2.24と22.4で、割ると同じ並びになる）。前の層が変わっても、次の層に届く数の平均とばらつきは毎回0と1なので、学習が速く安定し、大きな学習率も使える。層に届く数の分布が学習中に前の層の変化で動くことを、原論文は内部共変量シフトと呼んだ。計算のしかた：4-1 ミニバッチ4件の表。行がデータ1〜4、列が特徴Aと特徴B。特徴Aの値は2、4、6、8。バッチ正規化は、同じ特徴を4件のデータで縦にまとめて計算する。4-2 特徴Aの計算。平均は(2＋4＋6＋8)÷4＝5。平均からのずれは−3、−1、1、3。分散はずれの2乗の平均で(9＋1＋1＋9)÷4＝5。標準偏差は√5≈2.24。ずれを2.24で割ると、−1.34、−0.45、0.45、1.34になり、平均0・分散1にそろう。4-3 学習で決まるスケール2を掛け、シフト1を足すと、−1.68、0.10、1.90、3.68。特徴Bも同じ計算を別に行う。推論時は、学習中に集めた全体の平均と分散を使う。</desc>
<text x="12" y="20" class="tb">バッチ正規化：層に届く数の範囲を、毎回そろえる</text>
<text x="12" y="48" class="tb">① 何をするものか</text>
<text x="12" y="68" class="tm">ニューラルネットワークは層を何段も重ね、</text>
<text x="12" y="88" class="tm">前の層が出した数を、次の層が受け取って</text>
<text x="12" y="108" class="tm">計算する。バッチ正規化は、層と層のあいだで</text>
<text x="12" y="128" class="tm">数の範囲をそろえる係</text>
<line x1="12" y1="142" x2="308" y2="142" class="l sb w1"/>
<text x="12" y="166" class="tb">② 困りごと</text>
<text x="12" y="186" class="tm">学習中は、前の層の重みが毎回直される。</text>
<text x="12" y="206" class="tm">すると、次の層に届く数の範囲も毎回変わる</text>
<text x="12" y="230" class="tb">例：ある回は 2, 4, 6, 8</text>
<text x="12" y="250" class="tb">前の層が直された次の回は 20, 40, 60, 80</text>
<text x="12" y="270" class="tm">次の層は、前の範囲に合わせて覚えたことが</text>
<text x="12" y="290" class="tm">合わなくなり、動く的を追い続ける</text>
<text x="12" y="310" class="tm">→ 学習率を小さくするなど、慎重に進める</text>
<text x="12" y="330" class="tm">しかなく、学習が遅い</text>
<line x1="12" y1="344" x2="308" y2="344" class="l sb w1"/>
<text x="12" y="368" class="tb">③ どう解決するか</text>
<text x="12" y="388" class="tm">届いた数を、毎回『平均 0・ばらつき 1』に</text>
<text x="12" y="408" class="tm">そろえてから、次の層へ渡す</text>
<text x="12" y="434" class="tb">2, 4, 6, 8</text>
<text x="110" y="434" class="tb tok">→ −1.34、−0.45、0.45、1.34</text>
<text x="12" y="456" class="tb">20, 40, 60, 80</text>
<text x="110" y="456" class="tb tok">→ −1.34、−0.45、0.45、1.34</text>
<text x="12" y="478" class="tm">（平均は 5 と 50、ばらつきの大きさは</text>
<text x="12" y="500" class="tm">2.24 と 22.4。割ると同じ並びになる）</text>
<text x="12" y="522" class="tb ta">→ 前の層が変わっても、次の層に届く数の</text>
<text x="12" y="544" class="tb ta">　 平均とばらつきは毎回 0 と 1</text>
<text x="12" y="566" class="tb ta">→ 学習が速く安定し、大きな学習率も使える</text>
<text x="12" y="588" class="tm">層に届く数の分布が、学習中に前の層の</text>
<text x="12" y="610" class="tm">変化で動くこと＝内部共変量シフト</text>
<text x="12" y="632" class="tm">（原論文の呼び名。原論文の考え方）</text>
<line x1="12" y1="646" x2="308" y2="646" class="l sb w1"/>
<text x="12" y="670" class="tb">④ 計算のしかた（2, 4, 6, 8 の場合）</text>
<text x="12" y="690" class="tm">2, 4, 6, 8 は、一度にまとめて学習する4件</text>
<text x="12" y="710" class="tm">（ミニバッチ）の、同じ特徴の値</text>
<line x1="12" y1="720" x2="308" y2="720" class="l sb w1"/>
<g transform="translate(0,724)">
<text x="12" y="22" class="tb">4-1 ミニバッチ4件の表（例）</text>
<rect x="104" y="34" width="80" height="128" class="fas l sa w2" rx="4"/>
<text x="144" y="52" class="tb ta" text-anchor="middle">特徴A</text>
<text x="230" y="52" class="tb" text-anchor="middle">特徴B</text>
<line x1="12" y1="60" x2="276" y2="60" class="l sb w1"/>
<text x="20" y="80">データ1</text>
<text x="144" y="80" class="tb" text-anchor="middle">2</text>
<text x="230" y="80" class="tm" text-anchor="middle">10</text>
<text x="20" y="104">データ2</text>
<text x="144" y="104" class="tb" text-anchor="middle">4</text>
<text x="230" y="104" class="tm" text-anchor="middle">30</text>
<text x="20" y="128">データ3</text>
<text x="144" y="128" class="tb" text-anchor="middle">6</text>
<text x="230" y="128" class="tm" text-anchor="middle">20</text>
<text x="20" y="152">データ4</text>
<text x="144" y="152" class="tb" text-anchor="middle">8</text>
<text x="230" y="152" class="tm" text-anchor="middle">40</text>
<text x="12" y="184" class="tb ta">同じ特徴を、4件のデータで縦にまとめる</text>
<text x="12" y="204" class="tm">（特徴Bは、特徴Bの縦だけで別に計算）</text>
<line x1="12" y1="218" x2="308" y2="218" class="l sb w1"/>
<text x="12" y="242" class="tb">4-2 特徴Aを平均0・分散1にそろえる</text>
<text x="12" y="266">平均＝(2＋4＋6＋8)÷4＝5</text>
<text x="12" y="290">ずれ（値−平均）＝−3、−1、1、3</text>
<text x="12" y="314">分散＝ずれの2乗の平均</text>
<text x="12" y="336">　＝(9＋1＋1＋9)÷4＝5</text>
<text x="12" y="360">標準偏差＝√5≈2.24（ばらつきの大きさ）</text>
<text x="12" y="384">ずれ÷2.24 →</text>
<rect x="12" y="394" width="296" height="30" class="fok l sok w1" rx="4"/>
<text x="160" y="414" class="tb tok" text-anchor="middle">−1.34、−0.45、0.45、1.34</text>
<text x="12" y="446" class="tm">中心が0、ばらつきが1にそろった</text>
<line x1="12" y1="460" x2="308" y2="460" class="l sb w1"/>
<text x="12" y="484" class="tb">4-3 学習で決まるスケール2・シフト1（例）</text>
<text x="12" y="508">×2＋1 → −1.68、0.10、1.90、3.68</text>
<text x="12" y="530" class="tm">（例 −1.34×2＋1＝−1.68）</text>
<text x="12" y="556" class="tm">0・1 のままでは表せる値が狭まるので、</text>
<text x="12" y="576" class="tm">必要なら元に戻せるように2つを学習する</text>
</g>
</svg>
