<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 934" role="img" aria-labelledby="fig-g-activation-t fig-g-activation-d">
<title id="fig-g-activation-t">活性化関数のグラフと微分（シグモイド・tanh・ReLU・Leaky ReLU）</title>
<desc id="fig-g-activation-d">横軸を同じ（−5から5）にして、4つの活性化関数を縦に並べたグラフ。実線が関数、破線がその微分。シグモイドは1を(1＋eのマイナスx乗)で割った値で、xが0なら1を2で割って0.5。0から1までのS字で、微分の最大は0.25。tanhは−1から1までで原点対称で、xが0なら0、1なら約0.76、3なら約0.995。微分の最大は1。ReLUは0とxの大きいほうを出すので、−2なら0、3なら3。微分は0か1。Leaky ReLUは負の側でxに0.01を掛けるので、−3なら−0.03。微分は0.01か1。</desc>
<line x1="12" y1="14" x2="40" y2="14" class="l sa w2"/>
<text x="46" y="19" class="tb">関数</text>
<line x1="100" y1="14" x2="128" y2="14" class="l swn w2 dsh"/>
<text x="134" y="19" class="tb">微分（その点での傾き）</text>
<text x="12" y="40" class="tm">横軸はどのグラフも入力 x（−5〜5）</text>
<text x="12" y="68" class="tb">① シグモイド</text>
<text x="12" y="87" class="tm">1÷(1＋e^(−x))：x＝0 なら 1÷(1＋1)＝0.5</text>
<rect x="40" y="98" width="264" height="100" class="sb fs" stroke-width="1"/>
<line x1="40" y1="189.67" x2="304" y2="189.67" class="l sm w1"/>
<line x1="172" y1="98" x2="172" y2="198" class="l sm w1"/>
<text x="35" y="194.17" class="tm" text-anchor="end">0</text>
<text x="35" y="152.5" class="tm" text-anchor="end">0.5</text>
<text x="35" y="110.83" class="tm" text-anchor="end">1</text>
<text x="40" y="213" class="tm" text-anchor="middle">−5</text>
<text x="172" y="213" class="tm" text-anchor="middle">0</text>
<text x="304" y="213" class="tm" text-anchor="middle">5</text>
<polyline points="40,189.11 43.3,189.04 46.6,188.96 49.9,188.87 53.2,188.76 56.5,188.64 59.8,188.51 63.1,188.36 66.4,188.19 69.7,188.01 73,187.8 76.3,187.56 79.6,187.3 82.9,187 86.2,186.67 89.5,186.31 92.8,185.9 96.1,185.45 99.4,184.96 102.7,184.42 106,183.82 109.3,183.18 112.6,182.48 115.9,181.72 119.2,180.92 122.5,180.06 125.8,179.16 129.1,178.21 132.4,177.24 135.7,176.24 139,175.24 142.3,174.25 145.6,173.28 148.9,172.36 152.2,171.51 155.5,170.74 158.8,170.08 162.1,169.55 165.4,169.16 168.7,168.91 172,168.83 175.3,168.91 178.6,169.16 181.9,169.55 185.2,170.08 188.5,170.74 191.8,171.51 195.1,172.36 198.4,173.28 201.7,174.25 205,175.24 208.3,176.24 211.6,177.24 214.9,178.21 218.2,179.16 221.5,180.06 224.8,180.92 228.1,181.72 231.4,182.48 234.7,183.18 238,183.82 241.3,184.42 244.6,184.96 247.9,185.45 251.2,185.9 254.5,186.31 257.8,186.67 261.1,187 264.4,187.3 267.7,187.56 271,187.8 274.3,188.01 277.6,188.19 280.9,188.36 284.2,188.51 287.5,188.64 290.8,188.76 294.1,188.87 297.4,188.96 300.7,189.04 304,189.11" class="l swn w2 dsh"/>
<polyline points="40,189.11 43.3,189.04 46.6,188.95 49.9,188.86 53.2,188.75 56.5,188.63 59.8,188.49 63.1,188.34 66.4,188.17 69.7,187.97 73,187.75 76.3,187.5 79.6,187.22 82.9,186.91 86.2,186.56 89.5,186.16 92.8,185.71 96.1,185.22 99.4,184.66 102.7,184.04 106,183.35 109.3,182.58 112.6,181.72 115.9,180.78 119.2,179.73 122.5,178.59 125.8,177.33 129.1,175.96 132.4,174.46 135.7,172.85 139,171.11 142.3,169.24 145.6,167.25 148.9,165.15 152.2,162.93 155.5,160.61 158.8,158.2 162.1,155.72 165.4,153.18 168.7,150.6 172,148 175.3,145.4 178.6,142.82 181.9,140.28 185.2,137.8 188.5,135.39 191.8,133.07 195.1,130.85 198.4,128.75 201.7,126.76 205,124.89 208.3,123.15 211.6,121.54 214.9,120.04 218.2,118.67 221.5,117.41 224.8,116.27 228.1,115.22 231.4,114.28 234.7,113.42 238,112.65 241.3,111.96 244.6,111.34 247.9,110.78 251.2,110.29 254.5,109.84 257.8,109.44 261.1,109.09 264.4,108.78 267.7,108.5 271,108.25 274.3,108.03 277.6,107.83 280.9,107.66 284.2,107.51 287.5,107.37 290.8,107.25 294.1,107.14 297.4,107.05 300.7,106.96 304,106.89" class="l sa w2"/>
<circle cx="172" cy="168.83" r="3.5" class="fa"/>
<text x="182" y="160.83" class="twn tb">微分の最大 0.25</text>
<text x="12" y="234">出力は 0〜1（確率として使える）</text>
<text x="12" y="253" class="tm">弱点: 微分が小さく、深い層で勾配消失</text>
<text x="12" y="291" class="tb">② tanh</text>
<text x="12" y="310" class="tm">例：x＝0 で 0、x＝1 で約 0.76、x＝3 で約 0.995</text>
<rect x="40" y="321" width="264" height="100" class="sb fs" stroke-width="1"/>
<line x1="40" y1="371" x2="304" y2="371" class="l sm w1"/>
<line x1="172" y1="321" x2="172" y2="421" class="l sm w1"/>
<text x="35" y="415.5" class="tm" text-anchor="end">−1</text>
<text x="35" y="375.5" class="tm" text-anchor="end">0</text>
<text x="35" y="335.5" class="tm" text-anchor="end">1</text>
<text x="40" y="436" class="tm" text-anchor="middle">−5</text>
<text x="172" y="436" class="tm" text-anchor="middle">0</text>
<text x="304" y="436" class="tm" text-anchor="middle">5</text>
<polyline points="40,370.99 43.3,370.99 46.6,370.99 49.9,370.98 53.2,370.98 56.5,370.97 59.8,370.97 63.1,370.96 66.4,370.95 69.7,370.93 73,370.91 76.3,370.89 79.6,370.85 82.9,370.81 86.2,370.76 89.5,370.69 92.8,370.61 96.1,370.49 99.4,370.35 102.7,370.17 106,369.94 109.3,369.64 112.6,369.26 115.9,368.78 119.2,368.17 122.5,367.41 125.8,366.45 129.1,365.25 132.4,363.77 135.7,361.96 139,359.78 142.3,357.2 145.6,354.2 148.9,350.82 152.2,347.14 155.5,343.3 158.8,339.54 162.1,336.14 165.4,333.4 168.7,331.62 172,331 175.3,331.62 178.6,333.4 181.9,336.14 185.2,339.54 188.5,343.3 191.8,347.14 195.1,350.82 198.4,354.2 201.7,357.2 205,359.78 208.3,361.96 211.6,363.77 214.9,365.25 218.2,366.45 221.5,367.41 224.8,368.17 228.1,368.78 231.4,369.26 234.7,369.64 238,369.94 241.3,370.17 244.6,370.35 247.9,370.49 251.2,370.61 254.5,370.69 257.8,370.76 261.1,370.81 264.4,370.85 267.7,370.89 271,370.91 274.3,370.93 277.6,370.95 280.9,370.96 284.2,370.97 287.5,370.97 290.8,370.98 294.1,370.98 297.4,370.99 300.7,370.99 304,370.99" class="l swn w2 dsh"/>
<polyline points="40,411 43.3,411 46.6,410.99 49.9,410.99 53.2,410.99 56.5,410.99 59.8,410.98 63.1,410.98 66.4,410.97 69.7,410.97 73,410.96 76.3,410.94 79.6,410.93 82.9,410.91 86.2,410.88 89.5,410.85 92.8,410.8 96.1,410.75 99.4,410.67 102.7,410.58 106,410.46 109.3,410.31 112.6,410.12 115.9,409.87 119.2,409.56 122.5,409.16 125.8,408.66 129.1,408.01 132.4,407.21 135.7,406.19 139,404.93 142.3,403.37 145.6,401.46 148.9,399.16 152.2,396.41 155.5,393.18 158.8,389.48 162.1,385.33 165.4,380.8 168.7,375.97 172,371 175.3,366.03 178.6,361.2 181.9,356.67 185.2,352.52 188.5,348.82 191.8,345.59 195.1,342.84 198.4,340.54 201.7,338.63 205,337.07 208.3,335.81 211.6,334.79 214.9,333.99 218.2,333.34 221.5,332.84 224.8,332.44 228.1,332.13 231.4,331.88 234.7,331.69 238,331.54 241.3,331.42 244.6,331.33 247.9,331.25 251.2,331.2 254.5,331.15 257.8,331.12 261.1,331.09 264.4,331.07 267.7,331.06 271,331.04 274.3,331.03 277.6,331.03 280.9,331.02 284.2,331.02 287.5,331.01 290.8,331.01 294.1,331.01 297.4,331.01 300.7,331 304,331" class="l sa w2"/>
<circle cx="172" cy="331" r="3.5" class="fa"/>
<text x="158" y="336" class="twn tb" text-anchor="end">微分の最大 1</text>
<text x="12" y="457">出力は −1〜1、原点を中心に対称</text>
<text x="12" y="476" class="tm">弱点: 入力が大きいと平ら（飽和）</text>
<text x="12" y="514" class="tb">③ ReLU</text>
<text x="12" y="533" class="tm">max(0, x)＝0 と x の大きいほう（−2→0、3→3）</text>
<rect x="40" y="544" width="264" height="100" class="sb fs" stroke-width="1"/>
<line x1="40" y1="634.32" x2="304" y2="634.32" class="l sm w1"/>
<line x1="172" y1="544" x2="172" y2="644" class="l sm w1"/>
<text x="35" y="638.82" class="tm" text-anchor="end">0</text>
<text x="35" y="622.69" class="tm" text-anchor="end">1</text>
<text x="35" y="558.18" class="tm" text-anchor="end">5</text>
<text x="40" y="659" class="tm" text-anchor="middle">−5</text>
<text x="172" y="659" class="tm" text-anchor="middle">0</text>
<text x="304" y="659" class="tm" text-anchor="middle">5</text>
<line x1="40" y1="634.32" x2="171" y2="634.32" class="l swn w2 dsh"/>
<line x1="173" y1="618.19" x2="304" y2="618.19" class="l swn w2 dsh"/>
<polyline points="40,634.32 172,634.32 304,553.68" class="l sa w2"/>
<text x="256.48" y="632.19" class="twn tb">微分 1</text>
<text x="50.56" y="626.32" class="twn tb">微分 0</text>
<text x="12" y="680">正の側は微分が 1 で、勾配が小さくなりにくい</text>
<text x="12" y="699" class="tm">弱点: 負の側は微分 0（学習しなくなることも）</text>
<text x="12" y="737" class="tb">④ Leaky ReLU</text>
<text x="12" y="756" class="tm">x≥0 で x、x&lt;0 で 0.01×x（−3→−0.03）</text>
<rect x="40" y="767" width="264" height="100" class="sb fs" stroke-width="1"/>
<line x1="40" y1="857.32" x2="304" y2="857.32" class="l sm w1"/>
<line x1="172" y1="767" x2="172" y2="867" class="l sm w1"/>
<text x="35" y="861.82" class="tm" text-anchor="end">0</text>
<text x="35" y="845.69" class="tm" text-anchor="end">1</text>
<text x="35" y="781.18" class="tm" text-anchor="end">5</text>
<text x="40" y="882" class="tm" text-anchor="middle">−5</text>
<text x="172" y="882" class="tm" text-anchor="middle">0</text>
<text x="304" y="882" class="tm" text-anchor="middle">5</text>
<line x1="40" y1="857.16" x2="171" y2="857.16" class="l swn w2 dsh"/>
<line x1="173" y1="841.19" x2="304" y2="841.19" class="l swn w2 dsh"/>
<polyline points="40,858.13 172,857.32 304,776.68" class="l sa w2"/>
<text x="50.56" y="849.32" class="twn tb">負の側の傾き 0.01</text>
<text x="50.56" y="808.94" class="tm">ReLU とほぼ重なる</text>
<text x="256.48" y="855.19" class="twn tb">微分 1</text>
<text x="12" y="903">負の側にも小さな傾き（0.01）がある</text>
<text x="12" y="922" class="tm">全域で微分が 0 にならない</text>
</svg>
