<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" role="img" aria-labelledby="fig-g-l1-shrink-t fig-g-l1-shrink-d">
<title id="fig-g-l1-shrink-t">L1 正則化：縮める力は重みの大きさによらず同じ</title>
<desc id="fig-g-l1-shrink-d">重みが3と0.1の2つある例。L1の罰則は重みの絶対値なので、重みを1減らすと罰則も1減る。だから罰則が重みを0のほうへ押す力は、重み3にも0.1にも同じ1。矢印の長さが力を表し、2本は同じ長さ。L2の図と同じ縮尺。次に、1回で縮む量を0.05掛ける縮める力とした例で、くり返し縮める。どちらの重みも1回に0.05ずつ減る。重み3は2.95、2.90、2.85とほとんど縮まない。重み0.1は0.05になり、2回目でちょうど0に着く。0を越えると罰則が逆向きに押し戻すので、0で止まる。結果、予測に要らない特徴量の重みが0になり、使わない特徴量が決まる（特徴量の選択）。実際は誤差を減らす力が重みを引き戻すので、予測に効く重みは残り、効かない重みが0に残る。</desc>
<text x="12" y="20" class="tb">L1：縮める力は重みの大きさによらず同じ</text>
<text x="12" y="46" class="tb">① 罰則が重みを 0 のほうへ押す力（例）</text>
<text x="12" y="66" class="tm">罰則は |w|。w を 1 減らすと 1 減る → 力は 1</text>
<text x="296" y="88" class="tb ta" text-anchor="end">縮める力 1</text>
<line x1="296" y1="98" x2="272" y2="98" class="l sa w2"/>
<polygon points="266,98 273,93 273,103" class="fa"/>
<text x="12" y="103" class="tb">重み 3</text>
<text x="296" y="126" class="tb ta" text-anchor="end">縮める力 1（3 と同じ）</text>
<line x1="296" y1="136" x2="272" y2="136" class="l sa w2"/>
<polygon points="266,136 273,131 273,141" class="fa"/>
<text x="12" y="141" class="tb">重み 0.1</text>
<text x="12" y="166" class="tm">矢印の長さ＝力（L2 の図と同じ縮尺）</text>
<line x1="12" y1="180" x2="308" y2="180" class="l sb w1"/>
<text x="12" y="204" class="tb">② くり返し縮める（例）</text>
<text x="12" y="224" class="tm">1回で縮む量＝0.05×縮める力</text>
<text x="12" y="244" class="tm">＝0.05×1＝0.05（どちらの重みも同じ）</text>
<text x="145" y="272" class="tb" text-anchor="middle">重み 3</text>
<text x="255" y="272" class="tb" text-anchor="middle">重み 0.1</text>
<line x1="12" y1="280" x2="308" y2="280" class="l sb w1"/>
<text x="12" y="300" class="tm">最初</text>
<text x="145" y="300" text-anchor="middle">3</text>
<text x="255" y="300" text-anchor="middle">0.1</text>
<text x="12" y="326" class="tm">1回後</text>
<text x="145" y="326" text-anchor="middle">2.95（−0.05）</text>
<text x="255" y="326" text-anchor="middle">0.05（−0.05）</text>
<text x="12" y="352" class="tm">2回後</text>
<text x="145" y="352" text-anchor="middle">2.90（−0.05）</text>
<rect x="204" y="336" width="102" height="22" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="255" y="352" class="tb tok" text-anchor="middle">0（着いた）</text>
<text x="12" y="378" class="tm">3回後</text>
<text x="145" y="378" text-anchor="middle">2.85（−0.05）</text>
<rect x="204" y="362" width="102" height="22" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="255" y="378" class="tb tok" text-anchor="middle">0（止まる）</text>
<text x="12" y="408" class="tm">3 も同じ 0.05 ずつで、ほとんど縮まない</text>
<text x="12" y="428" class="tm">0 を越えると罰則が逆向きに押し戻すので、</text>
<text x="12" y="448" class="tm">0.1 は 0 で止まる（ちょうど 0 になる）</text>
<rect x="12" y="460" width="296" height="48" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="480" class="tb tok" text-anchor="middle">③ 要らない特徴量の重みが 0</text>
<text x="160" y="499" class="tb tok" text-anchor="middle">→ 使わない特徴量が決まる（特徴量の選択）</text>
<text x="12" y="524" class="tm">実際は誤差を減らす力が重みを引き戻す。</text>
<text x="12" y="542" class="tm">予測に効く重みは残り、効かない重みが 0 に残る</text>
</svg>
