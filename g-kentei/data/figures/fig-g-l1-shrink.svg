<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1010" role="img" aria-labelledby="fig-g-l1-shrink-t fig-g-l1-shrink-d">
<title id="fig-g-l1-shrink-t">L1 正則化：割に合わない項目は重みがちょうど0になる</title>
<desc id="fig-g-l1-shrink-d">家の値段を、値段＝広さ×○＋駅までの距離×○＋玄関マットの色×○で予想する。○は重みで、その項目を予想にどれくらい効かせるかの目盛り。学習は、過去に売れた家のデータを見て、値段がよく当たるように○を決めること。困りごと：玄関マットの色は値段に関係ないはずなのに、データがたまたまそう見えると重みが少し付き、過去の家には当たるが新しい家で外れる。そこで重みが大きいほど減点という決まりを足す。これが正則化。コンピュータは外れ（予想と実際の値段のずれ）と減点を足していちばん小さくなる○を探すので、重みを付けるなら、減点を取り返せるだけ外れが減らないと損。L1の減点は重みの大きさそのまま。例：マットの色に重み0.1を付けると外れが0.05減るが、減点は0.1なので差し引き0.05の損。重みを0.05にしても外れの減りは0.025、減点は0.05で0.025の損。重み0なら外れの減りも減点も0で損なし。この例では減点がいつも外れの減りの2倍なので、重みはちょうど0が一番得で、玄関マットの色は式から消える。広さのように値段に効く項目は、外れが減点より大きく減るので重みが残る。使う項目が絞られることを特徴量の選択、0の重みが多いことをスパースと言う。線形回帰にL1正則化を加えたものがラッソ回帰。減点は罰則項・正則化項とも呼ぶ。L2なら減点は0.1×0.1＝0.01で外れの減り0.05より小さく、マットの色は小さく残る。数は説明のための例で、減点の強さを1とした。</desc>
<text x="12" y="20" class="tb">L1：割に合わない項目は、重みがちょうど 0</text>
<text x="12" y="48" class="tb">① 家の値段を、こう予想する</text>
<rect x="12" y="58" width="296" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="78">値段 ＝ 広さ × <tspan class="tb ta">○</tspan></text>
<text x="66" y="98">＋ 駅までの距離 × <tspan class="tb ta">○</tspan></text>
<text x="66" y="118">＋ 玄関マットの色 × <tspan class="tb ta">○</tspan></text>
<text x="12" y="148" class="tm"><tspan class="tb ta">○</tspan>＝重み。その項目を予想にどれくらい</text>
<text x="12" y="166" class="tm">効かせるかの目盛り</text>
<text x="12" y="186" class="tm">学習＝過去に売れた家のデータを見て、</text>
<text x="12" y="204" class="tm">値段がよく当たるように <tspan class="tb ta">○</tspan> を決めること</text>
<line x1="12" y1="218" x2="308" y2="218" class="l sb w1"/>
<text x="12" y="240" class="tb">② 困りごと</text>
<text x="12" y="260" class="tm">玄関マットの色は値段に関係ないはずなのに、</text>
<text x="12" y="278" class="tm">データがたまたまそう見えると、重みが少し付く</text>
<text x="12" y="298" class="tng">→ 過去の家には当たるが、新しい家で外れる</text>
<line x1="12" y1="312" x2="308" y2="312" class="l sb w1"/>
<text x="12" y="334" class="tb">③ そこで『重みが大きいほど減点』を足す</text>
<text x="12" y="354" class="tm">これが正則化。外れ（予想と実際の値段のずれ）</text>
<text x="12" y="372" class="tm">と減点を足して、いちばん小さくなる <tspan class="tb ta">○</tspan> を探す</text>
<text x="12" y="392" class="tb">→ 重みを付けるなら、減点を取り返せる</text>
<text x="12" y="410" class="tb">　 だけ外れが減らないと損</text>
<line x1="12" y1="424" x2="308" y2="424" class="l sb w1"/>
<text x="12" y="446" class="tb">④ L1 の減点＝重みの大きさそのまま</text>
<text x="12" y="466" class="tm">例：マットの色に重み 0.1 を付けると、</text>
<text x="12" y="484" class="tm">外れが 0.05 減る。L1 の減点は 0.1</text>
<text x="12" y="508" class="tb tok">外れが減る 0.05</text>
<rect x="150" y="497" width="75" height="14" class="fok sok" stroke-width="1.5"/>
<text x="12" y="532" class="tb tng">L1 の減点 0.1</text>
<rect x="150" y="521" width="150" height="14" class="fng sng" stroke-width="1.5"/>
<text x="12" y="556" class="tb tng">→ 差し引き 0.05 の損</text>
<text x="12" y="580" class="tm">重みを小さくしても、損は消えない：</text>
<text x="44" y="602" class="tm" text-anchor="middle">重み</text>
<text x="120" y="602" class="tm" text-anchor="middle">外れが減る</text>
<text x="194" y="602" class="tm" text-anchor="middle">減点</text>
<text x="266" y="602" class="tm" text-anchor="middle">差し引き</text>
<line x1="12" y1="609" x2="308" y2="609" class="l sb w1"/>
<text x="44" y="628" text-anchor="middle">0.1</text>
<text x="120" y="628" text-anchor="middle">0.05</text>
<text x="194" y="628" text-anchor="middle">0.1</text>
<text x="266" y="628" class="tng" text-anchor="middle">0.05 の損</text>
<text x="44" y="652" text-anchor="middle">0.05</text>
<text x="120" y="652" text-anchor="middle">0.025</text>
<text x="194" y="652" text-anchor="middle">0.05</text>
<text x="266" y="652" class="tng" text-anchor="middle">0.025 の損</text>
<rect x="12" y="660" width="296" height="24" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="44" y="677" class="tb tok" text-anchor="middle">0</text>
<text x="120" y="677" class="tb tok" text-anchor="middle">0</text>
<text x="194" y="677" class="tb tok" text-anchor="middle">0</text>
<text x="266" y="677" class="tb tok" text-anchor="middle">損なし</text>
<text x="12" y="706" class="tm">この例では、減点がいつも外れの減りの 2 倍</text>
<text x="12" y="726" class="tb tok">→ 重みはちょうど 0 が一番得</text>
<rect x="12" y="738" width="296" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="758">値段 ＝ 広さ × <tspan class="tb ta">○</tspan></text>
<text x="66" y="778">＋ 駅までの距離 × <tspan class="tb ta">○</tspan></text>
<text x="66" y="798" class="tm">＋ 玄関マットの色 × 0</text>
<line x1="64" y1="794" x2="214" y2="794" class="l sng w2"/>
<text x="222" y="798" class="tb tng">← 消える</text>
<text x="12" y="830" class="tm">広さのように値段に効く項目は、外れが減点</text>
<text x="12" y="848" class="tm">より大きく減るので、重みが残る</text>
<line x1="12" y1="862" x2="308" y2="862" class="l sb w1"/>
<text x="12" y="884" class="tb ta">使う項目が絞られる（特徴量の選択）</text>
<text x="12" y="904" class="tm">0 の重みが多い＝スパース（まばら）</text>
<text x="12" y="922" class="tm">線形回帰＋L1 正則化＝ラッソ回帰</text>
<text x="12" y="940" class="tm">減点は、罰則項・正則化項とも呼ぶ</text>
<line x1="12" y1="954" x2="308" y2="954" class="l sb w1"/>
<text x="12" y="976" class="tm">L2 なら減点は 0.1×0.1＝0.01 で割に合い、</text>
<text x="12" y="994" class="tm">マットの色は小さく残る（数は説明のための例）</text>
</svg>
