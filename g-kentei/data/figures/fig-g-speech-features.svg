<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 628" role="img" aria-labelledby="fig-g-speech-features-t fig-g-speech-features-d">
<title id="fig-g-speech-features-t">音声の特徴量：スペクトル・スペクトル包絡・フォルマント・MFCC</title>
<desc id="fig-g-speech-features-d">音声の波形を FFT で周波数成分に分解すると、細かいぎざぎざのある周波数スペクトルになる。スペクトルの大まかな山と谷の形がスペクトル包絡で、声の音色を表す。包絡の山の位置がフォルマント（図の F1・F2）で、母音の聞き分けに効く。メル尺度は人の耳に合わせた周波数の尺度で、低い音ほど細かく区別する。メル尺度で重み付けしたスペクトルから、包絡を少数の係数で表したものが MFCC で、音声認識の入力に使われてきた。</desc>
