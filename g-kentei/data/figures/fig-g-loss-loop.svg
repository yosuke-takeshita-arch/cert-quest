<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-g-loss-loop-t fig-g-loss-loop-d">
<title id="fig-g-loss-loop-t">誤差関数：予測と正解のずれを1つの数にし、それを小さくする向きに重みを動かす</title>
<desc id="fig-g-loss-loop-d">家の価格を予測する例。①予測2,800万円、正解3,000万円を誤差関数に入れると、ずれは200という1つの数になる。②重みを少し動かして予測し直すと2,900万円になり、ずれは100に減った。減ったので、この向きに動かすのがよいと分かる。③これをくり返して、ずれを小さくしていくのが学習。測り方は課題で選ぶ。回帰でよく使う二乗誤差なら、ずれを2乗して200×200＝40,000とし、大きく外れた予測ほど強く罰する。分類では交差エントロピーを使う。</desc>
<text x="12" y="22" class="tb">① ずれを1つの数にする（例：家の価格）</text>
<rect x="12" y="36" width="130" height="44" class="fs l sm w1" rx="4"/>
<text x="77" y="54" class="tm" text-anchor="middle">モデルの予測</text>
<text x="77" y="72" class="tb" text-anchor="middle">2,800万円</text>
<rect x="12" y="88" width="130" height="44" class="fs l sm w1" rx="4"/>
<text x="77" y="106" class="tm" text-anchor="middle">正解</text>
<text x="77" y="124" class="tb" text-anchor="middle">3,000万円</text>
<line x1="146" y1="84" x2="168" y2="84" class="l sa w2"/>
<polygon points="174,84 167,79 167,89" class="fa"/>
<rect x="178" y="60" width="130" height="48" class="fas l sa w1" rx="4"/>
<text x="243" y="80" class="tm" text-anchor="middle">誤差関数</text>
<text x="243" y="99" class="tb ta" text-anchor="middle">ずれ 200</text>
<text x="12" y="156" class="tm">予測のよさが、1つの数（200）で分かる</text>
<line x1="12" y1="170" x2="308" y2="170" class="l sb w1"/>
<text x="12" y="194" class="tb">② 重みを少し動かして、また測る</text>
<text x="12" y="218">予測 2,800 → 2,900万円</text>
<text x="12" y="240">ずれ 200 → 100</text>
<text x="12" y="266" class="tb">ずれの大きさ</text>
<rect x="12" y="276" width="160" height="20" class="fng l sng w1"/>
<text x="180" y="291" class="tb tng">200（動かす前）</text>
<rect x="12" y="302" width="80" height="20" class="fok l sok w1"/>
<text x="100" y="317" class="tb tok">100（動かした後）</text>
<text x="12" y="344" class="tm">減った → この向きに動かすのがよい</text>
<rect x="12" y="356" width="296" height="48" class="fok l sok w1" rx="4"/>
<text x="160" y="376" class="tb tok" text-anchor="middle">③ くり返して、ずれを小さくしていく</text>
<text x="160" y="395" class="tb tok" text-anchor="middle">＝ 学習（向きの決め方は勾配降下法）</text>
<line x1="12" y1="418" x2="308" y2="418" class="l sb w1"/>
<text x="12" y="442" class="tb">測り方は課題で選ぶ</text>
<text x="12" y="464">回帰：二乗誤差（例 200×200＝40,000。</text>
<text x="12" y="484">　大きく外れた予測ほど強く罰する）</text>
<text x="12" y="508">分類：交差エントロピー</text>
</svg>
