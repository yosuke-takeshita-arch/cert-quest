<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="fig-g-stacking-t fig-g-stacking-d">
<title id="fig-g-stacking-t">スタッキング：1段目の3つのモデルの予測を、2段目のメタモデルが重みを付けてまとめる（家賃の例）</title>
<desc id="fig-g-stacking-d">例はある部屋の家賃の予測で、数は説明のための例。1段目に性質の違う3つのモデルを並べる。決定木は8万円、k近傍法は9万円、線形回帰は10万円と予測した。3つの予測を2段目のメタモデルに入れる。メタモデルは、このデータでは線形回帰がよく当たると学習しており、決定木に0.2、k近傍法に0.2、線形回帰に0.6の重みを掛けて足す。0.2×8＋0.2×9＋0.6×10＝1.6＋1.8＋6.0＝9.4で、最終の予測は9.4万円。単純な平均なら、どのモデルも同じ重さで、（8＋9＋10）÷3＝9万円。下は押さえどころ。2段目の学習に使う1段目の予測は、1段目が学習に使ったデータでの予測そのままではなく、交差検証で作った、学習に使っていないデータでの予測にする。学習に使ったデータの予測は当たりすぎていて、2段目が1段目を信じすぎる（過学習）ため。最後に3つの手法の違い。バギングは同じ種類のモデルを並列に作って平均や多数決。ブースティングは前のモデルの誤りを次が補うよう順に作る。スタッキングは、まとめ方そのものをモデルに学習させる。</desc>
<text x="12" y="20" class="tb">スタッキング：まとめ方を学習する</text>
<text x="12" y="40" class="tm">例：ある部屋の家賃の予測（数は例）</text>
<text x="12" y="66" class="tb">1段目：性質の違う3つのモデル</text>
<rect x="12" y="76" width="92" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="58" y="96" text-anchor="middle">決定木</text>
<text x="58" y="118" class="tb" text-anchor="middle">8万円</text>
<rect x="114" y="76" width="92" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="96" text-anchor="middle">k近傍法</text>
<text x="160" y="118" class="tb" text-anchor="middle">9万円</text>
<rect x="216" y="76" width="92" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="262" y="96" text-anchor="middle">線形回帰</text>
<text x="262" y="118" class="tb" text-anchor="middle">10万円</text>
<line x1="58" y1="128" x2="58" y2="160.4" class="l sm w1"/>
<polygon points="58,166 54.5,160.4 61.5,160.4" class="fm"/>
<text x="66" y="152" class="ta tb">×0.2</text>
<line x1="160" y1="128" x2="160" y2="160.4" class="l sm w1"/>
<polygon points="160,166 156.5,160.4 163.5,160.4" class="fm"/>
<text x="168" y="152" class="ta tb">×0.2</text>
<line x1="262" y1="128" x2="262" y2="160.4" class="l sa w2"/>
<polygon points="262,166 258.5,160.4 265.5,160.4" class="fa"/>
<text x="270" y="152" class="ta tb">×0.6</text>
<rect x="12" y="168" width="296" height="72" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="24" y="190" class="tb ta">2段目：メタモデル</text>
<text x="24" y="210">「どれをどれだけ信じるか」を学習済み</text>
<text x="24" y="230" class="tm">×の数＝重み。よく当たる線形回帰を厚く</text>
<line x1="160" y1="240" x2="160" y2="254.4" class="l sm w1"/>
<polygon points="160,260 156.5,254.4 163.5,254.4" class="fm"/>
<rect x="12" y="262" width="296" height="68" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="282" class="tok">0.2×8＋0.2×9＋0.6×10</text>
<text x="24" y="302" class="tok">＝1.6＋1.8＋6.0</text>
<text x="24" y="322" class="tb tok">＝9.4万円（最終の予測）</text>
<text x="12" y="354" class="tm">比べると：単純な平均（どれも同じ重さ）</text>
<text x="12" y="372" class="tm">（8＋9＋10）÷3＝9万円</text>
<line x1="12" y1="390" x2="308" y2="390" class="l sb w1"/>
<text x="12" y="414" class="tb">2段目の学習に使う、1段目の予測</text>
<text x="12" y="438" class="tng tb">× 1段目が学習に使ったデータでの予測</text>
<text x="28" y="456" class="tm">当たりすぎ→2段目が信じすぎる（過学習）</text>
<text x="12" y="480" class="tok tb">○ 交差検証で作った予測</text>
<text x="28" y="498" class="tm">学習に使っていないデータでの予測</text>
<line x1="12" y1="516" x2="308" y2="516" class="l sb w1"/>
<text x="12" y="540" class="tb">ほかのアンサンブルとの違い</text>
<text x="12" y="562">バギング：同じ種類を並列→平均・多数決</text>
<text x="12" y="584">ブースティング：前の誤りを次が補う</text>
<text x="12" y="606">スタッキング：まとめ方をモデルが学ぶ</text>
<text x="12" y="630" class="tm">メタモデル＝予測をまとめる2段目のモデル</text>
</svg>
