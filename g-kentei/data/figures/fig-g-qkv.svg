<rect x="262" y="73" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="88.5" class="tb" text-anchor="middle">k3</text>
<text x="12" y="118.5">バリュー v</text>
<rect x="154" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="172" y="118.5" class="tb" text-anchor="middle">v1</text>
<rect x="208" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="226" y="118.5" class="tb" text-anchor="middle">v2</text>
<rect x="262" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="118.5" class="tb" text-anchor="middle">v3</text>
