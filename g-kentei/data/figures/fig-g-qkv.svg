<polyline points="222.15,299 226,306 229.85,299" class="l w2"/>
<rect x="40" y="308" width="240" height="44" class="fas sa" stroke-width="1.5"/>
<text x="160" y="325.5" text-anchor="middle">新しい表現（単語1）</text>
<text x="160" y="343.5" text-anchor="middle">＝ 重み × v を足し合わせる</text>
<text x="12" y="376" class="tm">実際はスコアを √dk で割って整える</text>
<rect x="12" y="392" width="296" height="78" class="fs sb" stroke-width="1"/>
<text x="24" y="414" class="tb">検索にたとえると</text>
<text x="24" y="434">q＝検索語　k＝記事のタイトル</text>
<text x="24" y="454">v＝記事の本文</text>
<line x1="12" y1="488" x2="308" y2="488" class="l sb w1"/>
