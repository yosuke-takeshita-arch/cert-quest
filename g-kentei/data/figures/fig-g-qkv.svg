<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 836" role="img" aria-labelledby="fig-g-qkv-t fig-g-qkv-d">
<title id="fig-g-qkv-t">Attention の計算（クエリ・キー・バリュー）と、デコーダのマスク</title>
<desc id="fig-g-qkv-d">上は3単語の文での Attention の計算。単語1のクエリと各単語のキーの内積（類似度）をスコアとし、ソフトマックスで合計1の重みにして、その重みで各バリューを足し合わせ、単語1の新しい表現にする。ソフトマックスは2段で、スコア2.0、0.7、0.0をそれぞれeのx乗にして7.39、2.01、1.00（どれも正）とし、合計10.40で割って0.71、0.19、0.10にする。実際はスコアをキーの次元数の平方根で割ってからソフトマックスをとり、64次元なら8で割る。検索にたとえると、クエリが検索語、キーが記事のタイトル、バリューが記事の本文。下はデコーダの Self-Attention のマスク。4×4のスコアの表で、各位置から見て後ろの位置（右上の三角）のスコアを マイナス無限大 にすると、ソフトマックスのあと重みが0になり、未来の位置を見ない。</desc>
<text x="12" y="20" class="tb">① 重みを求めて、バリューを足す</text>
<rect x="150" y="34" width="44" height="26" class="fs sb" stroke-width="1.5"/>
<text x="172" y="51.5" class="tb" text-anchor="middle">猫</text>
<rect x="204" y="34" width="44" height="26" class="fs sb" stroke-width="1.5"/>
<text x="226" y="51.5" class="tb" text-anchor="middle">が</text>
<rect x="258" y="34" width="44" height="26" class="fs sb" stroke-width="1.5"/>
<text x="280" y="51.5" class="tb" text-anchor="middle">好き</text>
<text x="12" y="88.5">キー k</text>
<rect x="154" y="73" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="172" y="88.5" class="tb" text-anchor="middle">k1</text>
<rect x="208" y="73" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="226" y="88.5" class="tb" text-anchor="middle">k2</text>
<rect x="262" y="73" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="88.5" class="tb" text-anchor="middle">k3</text>
<text x="12" y="118.5">バリュー v</text>
<rect x="154" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="172" y="118.5" class="tb" text-anchor="middle">v1</text>
<rect x="208" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="226" y="118.5" class="tb" text-anchor="middle">v2</text>
<rect x="262" y="103" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="118.5" class="tb" text-anchor="middle">v3</text>
<text x="12" y="152" class="tb ta">単語1のクエリ</text>
<rect x="104" y="141" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="122" y="156" class="tb ta" text-anchor="middle">q1</text>
<text x="12" y="194.5">q1・k の内積</text>
<text x="172" y="194.5" class="tb" text-anchor="middle">2.0</text>
<text x="226" y="194.5" class="tb" text-anchor="middle">0.7</text>
<text x="280" y="194.5" class="tb" text-anchor="middle">0.0</text>
<text x="12" y="212" class="tm">（類似度のスコア）</text>
<text x="12" y="248.5">eˣ にする</text>
<text x="172" y="248.5" class="tb" text-anchor="middle">7.39</text>
<text x="226" y="248.5" class="tb" text-anchor="middle">2.01</text>
<text x="280" y="248.5" class="tb" text-anchor="middle">1.00</text>
<text x="12" y="266" class="tm">（どれも正）→ 合計 10.40 で割る</text>
<text x="12" y="292.5">ソフトマックス</text>
<text x="172" y="292.5" class="tb ta" text-anchor="middle">0.71</text>
<rect x="158" y="300" width="28" height="6" class="fa"/>
<text x="226" y="292.5" class="tb ta" text-anchor="middle">0.19</text>
<rect x="212" y="300" width="7.49" height="6" class="fa"/>
<text x="280" y="292.5" class="tb ta" text-anchor="middle">0.10</text>
<rect x="266" y="300" width="3.94" height="6" class="fa"/>
<text x="12" y="310" class="tm">＝重み（合計1）</text>
<line x1="226" y1="334" x2="226" y2="350" class="l w2"/>
<polyline points="222.15,343 226,350 229.85,343" class="l w2"/>
<rect x="40" y="352" width="240" height="44" class="fas sa" stroke-width="1.5"/>
<text x="160" y="369.5" text-anchor="middle">新しい表現（単語1）</text>
<text x="160" y="387.5" text-anchor="middle">＝ 重み × v を足し合わせる</text>
<text x="12" y="420" class="tm">実際はスコアを √(キーの次元数) で割る</text>
<text x="12" y="438" class="tm">（64次元なら √64＝8 で割る）</text>
<rect x="12" y="454" width="296" height="78" class="fs sb" stroke-width="1"/>
<text x="24" y="476" class="tb">検索にたとえると</text>
<text x="24" y="496">q＝検索語　k＝記事のタイトル</text>
<text x="24" y="516">v＝記事の本文</text>
<line x1="12" y1="550" x2="308" y2="550" class="l sb w1"/>
<text x="12" y="574" class="tb">② デコーダでは、後ろの位置を隠す</text>
<text x="12" y="594" class="tm">行＝今の位置　列＝見る位置</text>
