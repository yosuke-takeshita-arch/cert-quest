<text x="226" y="194.5" class="tb" text-anchor="middle">0.7</text>
<text x="280" y="194.5" class="tb" text-anchor="middle">0.0</text>
<text x="12" y="212" class="tm">（類似度のスコア）</text>
<text x="12" y="248.5">ソフトマックス</text>
<text x="172" y="248.5" class="tb ta" text-anchor="middle">0.71</text>
<rect x="158" y="256" width="28" height="6" class="fa"/>
