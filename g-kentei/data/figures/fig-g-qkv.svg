<rect x="170" y="664" width="33" height="30" class="fas sb" stroke-width="1"/>
<text x="186.5" y="683.5" class="tb" text-anchor="middle">0.27</text>
<rect x="57" y="664" width="33" height="30" class="fas sb" stroke-width="1"/>
<text x="73.5" y="683.5" class="tb" text-anchor="middle">1.5</text>
<rect x="203" y="664" width="33" height="30" class="fas sb" stroke-width="1"/>
<text x="219.5" y="683.5" class="tb" text-anchor="middle">0.73</text>
<rect x="90" y="664" width="33" height="30" class="fbg sb" stroke-width="1"/>
<text x="106.5" y="683.5" class="tm" text-anchor="middle">−∞</text>
