<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1092" role="img" aria-labelledby="fig-g-qkv-t fig-g-qkv-d">
<title id="fig-g-qkv-t">Attention の計算（クエリ・キー・バリュー）と、デコーダのマスク</title>
<desc id="fig-g-qkv-d">上は Self-Attention の重みの計算。検索にたとえると、クエリ q は探しているもの（検索語）、キー k は各語の見出し（タイトル）、バリュー v は各語の中身（本文）。文の各語（例は動物・道・それの3語）から、学習で決まる3種類の変換で q・k・v の3つを作る。「それ」のクエリ q3 と各語のキーの内積（似ている度合い。大きいほど似ている）が 2.0、0.7、0.0。ソフトマックスは2段で、それぞれ e の x 乗にして 7.39、2.01、1.00（どれも正）とし、合計 10.40 で割って 0.71、0.19、0.10（合計1の重み）にする。バリューを1つの数とした例で 10、20、30 なら、「それ」の新しい中身は 0.71×10＋0.19×20＋0.10×30＝7.1＋3.8＋3.0＝13.9。同じ割合で混ぜれば20なので、13.9 は動物の10に寄っている。実際は内積をキーの次元数の平方根で割ってからソフトマックスに通して重みに直し、64次元なら8で割る（図の2.0などは割ったあとの値として読む）。Source-Target Attention では q だけを別の文（出力側）から作る。下はデコーダの Self-Attention のマスク。4×4のスコアの表で、各位置から見て後ろの位置（右上の三角）のスコアを マイナス無限大 にすると、ソフトマックスのあと重みが0になり、未来の位置を見ない。言葉：内積は、2つの数の並びの同じ位置どうしを掛けて全部足した数（qもkも数の並び）。次元数はその並びの数の個数。</desc>
<text x="12" y="20" class="tb">① 重みを求めて、中身を混ぜる</text>
<rect x="12" y="32" width="296" height="96" class="fs sb" stroke-width="1"/>
<text x="24" y="52" class="tb">検索にたとえると</text>
<text x="24" y="72">クエリ q＝探しているもの（検索語）</text>
<text x="24" y="92">キー k＝各語の見出し（タイトル）</text>
<text x="24" y="112">バリュー v＝各語の中身（本文）</text>
<text x="12" y="150" class="tm">文の各語から q・k・v の3つを作る</text>
<text x="12" y="168" class="tm">（学習で決まる3種類の変換で作る）</text>
<text x="12" y="197.5">語（例の文）</text>
<rect x="150" y="180" width="44" height="26" class="fas sa" stroke-width="1.5"/>
<text x="172" y="197.5" class="tb" text-anchor="middle">動物</text>
<rect x="204" y="180" width="44" height="26" class="fs sb" stroke-width="1.5"/>
<text x="226" y="197.5" class="tb" text-anchor="middle">道</text>
<rect x="258" y="180" width="44" height="26" class="fs sb" stroke-width="1.5"/>
<text x="280" y="197.5" class="tb" text-anchor="middle">それ</text>
<text x="12" y="229.5">キー k</text>
<rect x="154" y="214" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="172" y="229.5" class="tb" text-anchor="middle">k1</text>
<rect x="208" y="214" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="226" y="229.5" class="tb" text-anchor="middle">k2</text>
<rect x="262" y="214" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="229.5" class="tb" text-anchor="middle">k3</text>
<text x="12" y="259.5">バリュー v</text>
<rect x="154" y="244" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="172" y="259.5" class="tb" text-anchor="middle">v1</text>
<rect x="208" y="244" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="226" y="259.5" class="tb" text-anchor="middle">v2</text>
<rect x="262" y="244" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="280" y="259.5" class="tb" text-anchor="middle">v3</text>
<text x="12" y="295.5" class="tb ta">「それ」のクエリ</text>
<rect x="262" y="280" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="280" y="295.5" class="tb ta" text-anchor="middle">q3</text>
<rect x="12" y="309.5" width="296" height="88" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="332.5" class="tb">言葉：内積・次元</text>
<text x="22" y="350.5">内積：2つの数の並びの、同じ位置どうし</text>
<text x="22" y="368.5">　を掛けて全部足した数（q・k は数の並び）</text>
<text x="22" y="386.5">次元数：その並びの数の個数</text>
<g transform="translate(0,100)">
<text x="12" y="332">q3・k の内積</text>
<text x="172" y="332" class="tb" text-anchor="middle">2.0</text>
<text x="226" y="332" class="tb" text-anchor="middle">0.7</text>
<text x="280" y="332" class="tb" text-anchor="middle">0.0</text>
<text x="12" y="350" class="tm">＝似ている度合い（大きいほど似ている）</text>
<text x="12" y="380">eˣ にする</text>
<text x="172" y="380" class="tb" text-anchor="middle">7.39</text>
<text x="226" y="380" class="tb" text-anchor="middle">2.01</text>
<text x="280" y="380" class="tb" text-anchor="middle">1.00</text>
<text x="12" y="398" class="tm">（どれも正になる）→ 合計 10.40 で割る</text>
<text x="12" y="426">ソフトマックス</text>
<text x="172" y="426" class="tb ta" text-anchor="middle">0.71</text>
<rect x="158" y="434" width="28" height="6" class="fa"/>
<text x="226" y="426" class="tb ta" text-anchor="middle">0.19</text>
<rect x="212" y="434" width="7.49" height="6" class="fa"/>
<text x="280" y="426" class="tb ta" text-anchor="middle">0.10</text>
<rect x="266" y="434" width="3.94" height="6" class="fa"/>
<text x="12" y="446" class="tm">＝重み（合計1）</text>
<text x="12" y="476">v（1つの数の例）</text>
<text x="172" y="476" class="tb" text-anchor="middle">10</text>
<text x="226" y="476" class="tb" text-anchor="middle">20</text>
<text x="280" y="476" class="tb" text-anchor="middle">30</text>
<line x1="160" y1="484" x2="160" y2="490" class="l w2"/>
<polyline points="156.15,489 160,496 163.85,489" class="l w2"/>
<rect x="24" y="500" width="272" height="62" class="fas sa" stroke-width="1.5"/>
<text x="160" y="519" class="tb" text-anchor="middle">「それ」の新しい中身＝重み×v の合計</text>
<text x="160" y="537" text-anchor="middle">0.71×10＋0.19×20＋0.10×30</text>
<text x="160" y="555" class="tb ta" text-anchor="middle">＝7.1＋3.8＋3.0＝13.9</text>
<text x="12" y="582" class="tm">→ 同じ割合で混ぜれば 20。13.9 は</text>
<text x="12" y="600" class="tm">　「動物」の 10 に寄っている</text>
<text x="12" y="626" class="tm">実際は内積を √(キーの次元数) で割ってから</text>
<text x="12" y="644" class="tm">ソフトマックスに通す（64次元なら8で割る）</text>
<text x="12" y="662" class="tm">（上の 2.0 などは割ったあとの値として読む）</text>
<text x="12" y="684" class="tm">Source-Target Attention では、q だけを</text>
<text x="12" y="702" class="tm">別の文（出力側）から作る</text>
<line x1="12" y1="706" x2="308" y2="706" class="l sb w1"/>
<text x="12" y="730" class="tb">② デコーダでは、後ろの位置を隠す</text>
<text x="12" y="750" class="tm">行＝今の位置　列＝見る位置</text>
<text x="90" y="770" class="tb" text-anchor="middle">スコア</text>
<text x="236" y="770" class="tb" text-anchor="middle">ソフトマックス後</text>
<text x="40.5" y="786" class="tm" text-anchor="middle">1</text>
<text x="73.5" y="786" class="tm" text-anchor="middle">2</text>
<text x="106.5" y="786" class="tm" text-anchor="middle">3</text>
<text x="139.5" y="786" class="tm" text-anchor="middle">4</text>
<text x="12" y="809.5" class="tm">1</text>
<rect x="24" y="790" width="33" height="30" class="fas sb" stroke-width="1"/>
