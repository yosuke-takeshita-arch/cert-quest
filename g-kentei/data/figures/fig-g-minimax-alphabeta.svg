<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 818" role="img" aria-labelledby="fig-g-minimax-alphabeta-t fig-g-minimax-alphabeta-d">
<title id="fig-g-minimax-alphabeta-t">Mini-Max法とαβ法の枝刈り</title>
<desc id="fig-g-minimax-alphabeta-d">3段のゲーム木の例。根は自分の手番（最大を選ぶ▲）、2段目は相手の手番（最小を選ぶ▼）が3つ、葉は各3つで合計9個。葉の評価値は左から5、9、4、3、7、8、6、2、10。Mini-Max法では9個の葉をすべて評価し、3つの相手の節点は下の最小値4、3、2をとり、根はその最大の4を選ぶ。αβ法でも選ぶ手は同じ。最初の相手の節点で4を確保した後、2つ目の相手の節点で3を見た時点で、この節点は3以下に決まって4を上回れないので残りの7と8は調べない。3つ目の相手の節点でも6の次に2を見て、2は4より小さいので残りの10は調べない。調べた葉は9個から6個に減る。</desc>
<text x="12" y="20" class="tb">凡例</text>
<polygon points="66,9 58,23 74,23" class="fa"/>
<text x="80" y="20">自分の手番（最大を選ぶ）</text>
<polygon points="16,33 32,33 24,47" class="fs sa"/>
<text x="38" y="44">相手の手番（最小を選ぶ）</text>
<line x1="12" y1="58" x2="308" y2="58" class="l sb w1"/>
<text x="12" y="84" class="tb">① Mini-Max法：葉をすべて評価する</text>
