<polygon points="160,435 141,469 179,469" class="fa"/>
<text x="160" y="462" class="tb ton" text-anchor="middle">4</text>
<polygon points="42,497 80,497 61,531" class="fas sa"/>
<text x="61" y="513" class="tb" text-anchor="middle">4</text>
<polygon points="141,497 179,497 160,531" class="fs sb"/>
<text x="160" y="513" class="tb" text-anchor="middle">≤3</text>
<polygon points="240,497 278,497 259,531" class="fs sb"/>
<text x="259" y="513" class="tb" text-anchor="middle">≤2</text>
<rect x="15" y="567" width="26" height="26" class="fs sb" stroke-width="1.5"/>
