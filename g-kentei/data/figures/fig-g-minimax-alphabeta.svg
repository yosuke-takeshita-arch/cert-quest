<text x="160" y="585" class="tb tm" text-anchor="middle">7</text>
<line x1="152" y1="549" x2="168" y2="561" class="l sng w2"/>
<line x1="152" y1="561" x2="168" y2="549" class="l sng w2"/>
<rect x="180" y="567" width="26" height="26" class="fng sng" stroke-width="1.5"/>
<text x="193" y="585" class="tb tm" text-anchor="middle">8</text>
<line x1="185" y1="549" x2="201" y2="561" class="l sng w2"/>
<line x1="185" y1="561" x2="201" y2="549" class="l sng w2"/>
<rect x="213" y="567" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="226" y="585" class="tb" text-anchor="middle">6</text>
<rect x="246" y="567" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="259" y="585" class="tb" text-anchor="middle">2</text>
<rect x="279" y="567" width="26" height="26" class="fng sng" stroke-width="1.5"/>
<text x="292" y="585" class="tb tm" text-anchor="middle">10</text>
<line x1="284" y1="549" x2="300" y2="561" class="l sng w2"/>
<line x1="284" y1="561" x2="300" y2="549" class="l sng w2"/>
<text x="12" y="616" class="tm">赤の点線と×＝調べずに打ち切った枝</text>
<text x="12" y="642">α＝自分が確保できる下限</text>
<text x="12" y="662">β＝相手が確保できる上限</text>
<text x="12" y="690" class="tb">2つ目の相手の節点：3 を見た</text>
<text x="12" y="710">→ 3 以下に決まる。β 3 ＜ α 4 なので</text>
<text x="12" y="730">　7 と 8 は調べない</text>
<text x="12" y="758" class="tb">3つ目の相手の節点：6 の次に 2 を見た</text>
<text x="12" y="778">→ 2 ＜ α 4 なので、10 は調べない</text>
<text x="12" y="806" class="tb">選ぶ手は同じ。調べた葉は 9 個 → 6 個</text>
</svg>
