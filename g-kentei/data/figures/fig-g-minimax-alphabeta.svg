<text x="22" y="834" class="tb">αカット（真ん中）：3 を見た時点で</text>
<text x="22" y="854">相手はここで 3 を選べる</text>
<text x="22" y="874">→ 真ん中は 3点以下（3 ≦ α＝4）</text>
<text x="22" y="894">→ 左の 4点 には勝てない</text>
<text x="22" y="914">→ 残りの 7・8 は何点でも関係ない</text>
<polygon points="292,944 285,954 299,954" class="fng sng w1"/>
<rect x="12" y="954" width="296" height="118" rx="6" class="fng sng w1"/>
<text x="22" y="976" class="tb">αカット（右）：6 の次に 2 を見た時点で</text>
<text x="22" y="996">相手はここで 2 を選べる</text>
<text x="22" y="1016">→ 右は 2点以下（2 ≦ α＝4）</text>
<text x="22" y="1036">→ 左の 4点 には勝てない</text>
<text x="22" y="1056">→ 残りの 10 は見ない</text>
<text x="12" y="1094" class="tb">選ぶ手は同じ（左・4点）</text>
<text x="12" y="1116" class="tb">調べた葉は 9 個 → 6 個</text>
<line x1="12" y1="1132" x2="308" y2="1132" class="l sb w1"/>
<text x="12" y="1156" class="tb">補足：αカットとβカット</text>
<text x="12" y="1180">α ＝ 自分が確保済みの値（ここでは 4点）</text>
<text x="12" y="1210" class="tb ta">αカット ＝ 相手（最小）の節点で</text>
<text x="12" y="1230">　子の値が α 以下と決まったら、</text>
<text x="12" y="1250">　その節点の残りの子を調べない</text>
<text x="12" y="1270">→ この木の「見ない」2か所は、どちらも</text>
<text x="12" y="1290">　αカット（真ん中 3≦4、右 2≦4）</text>
<text x="12" y="1320" class="tb twn">βカット ＝ αカットの向きを入れ替えたもの</text>
<text x="12" y="1340">　自分（最大）の節点で、子の値が、上の</text>
<text x="12" y="1360">　相手が抑え込める値 β 以上と決まったら、</text>
<text x="12" y="1380">　残りの子を調べない</text>
<text x="12" y="1400">→ この3段の木には出てこない</text>
<text x="12" y="1436" class="tb">節点の側で覚える</text>
<text x="12" y="1458">αカット ＝ 相手（最小）の節点</text>
<text x="12" y="1478">βカット ＝ 自分（最大）の節点</text>
