<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1500" role="img" aria-labelledby="fig-g-minimax-alphabeta-t fig-g-minimax-alphabeta-d">
<title id="fig-g-minimax-alphabeta-t">Mini-Max法とαβ法の枝刈り</title>
<desc id="fig-g-minimax-alphabeta-d">3段のゲーム木の例。自分と相手が交互に打つゲームで、根は自分の手番（最大を選ぶ）、2段目は相手の手番（最小を選ぶ）が3つ、葉は各3つで合計9個。葉は一番下の数字で、そこまで進んだときの自分の点数。左から5、9、4、3、7、8、6、2、10。Mini-Max法では9個の葉をすべて調べる。相手は自分に一番不利な最小の値を選ぶので、左は4点、真ん中は3点、右は2点で、自分は最大の4点の左を選ぶ。αβ法では葉を左から順に調べる。左を全部調べて、左なら4点は確実と分かる。真ん中は3を見た時点で、相手が3を選べるので3点以下に決まり、左の4点に勝てないので、残りの7と8はどんな数でも結果が変わらず調べない。右は6の次に2を見た時点で2点以下に決まり、4点に勝てないので10は調べない。選ぶ手は同じ左で、調べた葉は9個から6個に減る。自分が確保した4点をαと呼ぶ。相手（最小）の節点で、子の値がα以下と決まったら残りを調べない枝刈りがαカットで、この木で調べない2か所（真ん中は3≦4、右は2≦4）はどちらもαカット。向きを入れ替えたβカットは、自分（最大）の節点で、子の値が、上の相手が抑え込める値β以上と決まったら残りを調べない枝刈りで、この3段の木には出てこない。αカットは相手の節点、βカットは自分の節点で起きる。</desc>
<text x="12" y="20" class="tb">まず、ゲームの前提</text>
<text x="12" y="44">自分と相手が交互に打つゲームです。</text>
<text x="12" y="64">自分が打てる手は3つ。打った後、相手は</text>
<text x="12" y="84">自分の点が一番低くなる手を選びます。</text>
