<polygon points="160,105 141,139 179,139" class="fa"/>
<text x="160" y="132" class="tb ton" text-anchor="middle">4</text>
<polygon points="42,167 80,167 61,201" class="fas sa"/>
<text x="61" y="183" class="tb" text-anchor="middle">4</text>
<polygon points="141,167 179,167 160,201" class="fs sb"/>
<text x="160" y="183" class="tb" text-anchor="middle">3</text>
<polygon points="240,167 278,167 259,201" class="fs sb"/>
<text x="259" y="183" class="tb" text-anchor="middle">2</text>
<rect x="15" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="28" y="255" class="tb" text-anchor="middle">5</text>
<rect x="48" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="61" y="255" class="tb" text-anchor="middle">9</text>
<rect x="81" y="237" width="26" height="26" class="fas sa" stroke-width="1.5"/>
<text x="94" y="255" class="tb" text-anchor="middle">4</text>
<rect x="114" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="127" y="255" class="tb" text-anchor="middle">3</text>
<rect x="147" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="160" y="255" class="tb" text-anchor="middle">7</text>
<rect x="180" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="193" y="255" class="tb" text-anchor="middle">8</text>
<rect x="213" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="226" y="255" class="tb" text-anchor="middle">6</text>
<rect x="246" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="259" y="255" class="tb" text-anchor="middle">2</text>
<rect x="279" y="237" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="292" y="255" class="tb" text-anchor="middle">10</text>
<text x="12" y="286" class="tm">葉の評価値から、1段ずつさかのぼる</text>
<text x="12" y="308">相手の節点は子の最小：4、3、2</text>
<text x="12" y="330">自分の節点は子の最大：4 を選ぶ</text>
<text x="12" y="354" class="tb">太線＝選ばれた道筋。調べた葉は 9 個</text>
<line x1="12" y1="374" x2="308" y2="374" class="l sb w1"/>
<text x="12" y="402" class="tb">② αβ法：結果に影響しない枝は見ない</text>
<line x1="160" y1="466" x2="61" y2="500" class="l sa w3"/>
<line x1="61" y1="528" x2="28" y2="567" class="l sm w1"/>
