<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" role="img" aria-labelledby="fig-g-expected-value-t fig-g-expected-value-d">
<title id="fig-g-expected-value-t">期待値：とる値に確率を掛けて足す</title>
<desc id="fig-g-expected-value-d">①公平なサイコロ。1から6の目に、同じ高さの棒（どれも確率1/6）を立てた棒グラフ。期待値は、目に確率を掛けて足した 1×1/6＋2×1/6＋3×1/6＋4×1/6＋5×1/6＋6×1/6 で、まとめると (1＋2＋3＋4＋5＋6)×1/6＝21÷6＝3.5。棒グラフの3と4の真ん中に三角の印を付け、3.5の目は無いが、何度も振ると平均が3.5に近づくと書く。②1本100円のくじ。表にして、1000円が当たる確率0.01で1000×0.01＝10円、100円が当たる確率0.1で100×0.1＝10円、はずれ（0円）の確率0.89で0×0.89＝0円。確率は足すと1。値×確率を足すと20円で、払う100円より80円少ない。</desc>
<text x="12" y="20" class="tb">期待値：値×確率を、全部足す</text>
<text x="12" y="44" class="tb">① 公平なサイコロ（どの目も確率1/6）</text>
<rect x="26" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<rect x="74" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<rect x="122" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<rect x="170" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<rect x="218" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<rect x="266" y="80" width="28" height="70" class="fas sa" stroke-width="1.5"/>
<text x="40" y="72" class="tm" text-anchor="middle">1/6</text>
<text x="88" y="72" class="tm" text-anchor="middle">1/6</text>
<text x="136" y="72" class="tm" text-anchor="middle">1/6</text>
<text x="184" y="72" class="tm" text-anchor="middle">1/6</text>
<text x="232" y="72" class="tm" text-anchor="middle">1/6</text>
<text x="280" y="72" class="tm" text-anchor="middle">1/6</text>
<line x1="14" y1="150" x2="306" y2="150" class="l"/>
<text x="40" y="168" class="tb" text-anchor="middle">1</text>
<text x="88" y="168" class="tb" text-anchor="middle">2</text>
<text x="136" y="168" class="tb" text-anchor="middle">3</text>
<text x="184" y="168" class="tb" text-anchor="middle">4</text>
<text x="232" y="168" class="tb" text-anchor="middle">5</text>
<text x="280" y="168" class="tb" text-anchor="middle">6</text>
<polygon points="160,154 152,168 168,168" class="fa"/>
<text x="160" y="188" class="tb ta" text-anchor="middle">期待値 3.5</text>
<text x="160" y="206" class="tm" text-anchor="middle">3.5の目は無い。何度も振ったときの平均</text>
<text x="12" y="234">目×確率を足す：</text>
<text x="12" y="254">1×1/6＋2×1/6＋3×1/6</text>
<text x="12" y="274">＋4×1/6＋5×1/6＋6×1/6</text>
<text x="12" y="294">＝(1＋2＋3＋4＋5＋6)×1/6</text>
<text x="12" y="314" class="tb ta">＝21÷6＝3.5</text>
<line x1="12" y1="332" x2="308" y2="332" class="l sb w1"/>
<text x="12" y="356" class="tb">② 1本100円のくじ</text>
<rect x="12" y="368" width="296" height="150" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="368" width="296" height="28" class="fas"/>
<line x1="112" y1="368" x2="112" y2="518" class="l sb w1"/>
<line x1="192" y1="368" x2="192" y2="518" class="l sb w1"/>
<line x1="12" y1="396" x2="308" y2="396" class="l sb w1"/>
<line x1="12" y1="424" x2="308" y2="424" class="l sb w1"/>
<line x1="12" y1="452" x2="308" y2="452" class="l sb w1"/>
<line x1="12" y1="480" x2="308" y2="480" class="l sm w1"/>
<text x="62" y="387" class="tb" text-anchor="middle">当たる額</text>
<text x="152" y="387" class="tb" text-anchor="middle">確率</text>
<text x="250" y="387" class="tb" text-anchor="middle">額×確率</text>
<text x="62" y="415" text-anchor="middle">1000円</text>
<text x="152" y="415" text-anchor="middle">0.01</text>
<text x="250" y="415" text-anchor="middle">1000×0.01＝10円</text>
<text x="62" y="443" text-anchor="middle">100円</text>
<text x="152" y="443" text-anchor="middle">0.1</text>
<text x="250" y="443" text-anchor="middle">100×0.1＝10円</text>
<text x="62" y="471" text-anchor="middle">0円</text>
<text x="152" y="471" text-anchor="middle">0.89</text>
<text x="250" y="471" text-anchor="middle">0×0.89＝0円</text>
<text x="62" y="504" class="tb" text-anchor="middle">足す</text>
<text x="152" y="504" class="tm" text-anchor="middle">合計 1</text>
<text x="250" y="504" class="tb ta" text-anchor="middle">期待値 20円</text>
<text x="12" y="546" class="tb">期待値20円 ＜ 払う100円</text>
<text x="12" y="566" class="tm">何度も買うと、平均で1本あたり80円の損</text>
<text x="12" y="588" class="tm">はずれの確率 1−0.01−0.1＝0.89</text>
</svg>
