<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 712" role="img" aria-labelledby="fig-g-conditional-probability-t fig-g-conditional-probability-d">
<title id="fig-g-conditional-probability-t">条件付き確率：分かった条件の中だけを新しい全体にする</title>
<desc id="fig-g-conditional-probability-d">点1つを社員1人として、社員100人を10行10列の点で描く。塗った点は英語が話せる人で20人、緑の枠で囲んだ3列は営業部で30人、営業部で英語も話せる人は12人。全体100人の中で両方に当たる割合は12÷100＝0.12で、これは同時確率。②営業部の人だと分かったら、営業部の30人だけを新しい全体として並べ直す。その中で英語が話せる人は12人なので、P(英語｜営業)＝12÷30＝0.4。③英語が話せる人だと分かったら、英語が話せる20人だけを新しい全体にする。その中で営業部の人は12人なので、P(営業｜英語)＝12÷20＝0.6。条件付き確率は、AとBが両方起きる人数を、条件Bに当たる人数で割る。条件を入れ替えると、割る相手が30人か20人かで変わるので、値も変わる。</desc>
<text x="12" y="20" class="tb">条件付き確率：条件の中だけで割合を見る</text>
<text x="12" y="44" class="tb">① 社員100人（点1つ＝1人）</text>
