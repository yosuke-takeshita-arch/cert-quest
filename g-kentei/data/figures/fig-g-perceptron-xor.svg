<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 492" role="img" aria-labelledby="fig-g-perceptron-xor-t fig-g-perceptron-xor-d">
<title id="fig-g-perceptron-xor-t">単純パーセプトロンの限界：XOR は直線で分けられない</title>
<desc id="fig-g-perceptron-xor-d">入力x1、x2がそれぞれ0か1の4点を、出力が1の点（塗りつぶし）と0の点（白抜き）に分ける。ANDとORは、直線1本で2つに分けられる。XORは、対角の2点が同じ値になり、直線1本では分けられない。隠れ層を1つ持つ多層パーセプトロン（入力2、隠れ2、出力1）なら、2本の直線で挟む形で分けられる。単純パーセプトロンは直線でしか分けられないので、XORは解けない。</desc>
<text x="12" y="20" class="tb">① 直線1本で分けられるか</text>
<text x="56" y="50" class="tb" text-anchor="middle">AND</text>
<rect x="12" y="58" width="88" height="88" class="sb" stroke-width="1"/>
<line x1="42" y1="60" x2="98" y2="116" class="l sok w2"/>
<circle cx="28" cy="130" r="7" class="fs sa" stroke-width="2"/>
<circle cx="28" cy="74" r="7" class="fs sa" stroke-width="2"/>
<circle cx="84" cy="130" r="7" class="fs sa" stroke-width="2"/>
<circle cx="84" cy="74" r="7" class="fa sa" stroke-width="2"/>
<text x="56" y="166" class="tb tok" text-anchor="middle">分けられる</text>
<text x="160" y="50" class="tb" text-anchor="middle">OR</text>
<rect x="116" y="58" width="88" height="88" class="sb" stroke-width="1"/>
<line x1="118" y1="88" x2="174" y2="144" class="l sok w2"/>
<circle cx="132" cy="130" r="7" class="fs sa" stroke-width="2"/>
<circle cx="132" cy="74" r="7" class="fa sa" stroke-width="2"/>
<circle cx="188" cy="130" r="7" class="fa sa" stroke-width="2"/>
<circle cx="188" cy="74" r="7" class="fa sa" stroke-width="2"/>
<text x="160" y="166" class="tb tok" text-anchor="middle">分けられる</text>
<text x="264" y="50" class="tb" text-anchor="middle">XOR</text>
<rect x="220" y="58" width="88" height="88" class="sb" stroke-width="1"/>
<circle cx="236" cy="130" r="7" class="fs sa" stroke-width="2"/>
<circle cx="236" cy="74" r="7" class="fa sa" stroke-width="2"/>
<circle cx="292" cy="130" r="7" class="fa sa" stroke-width="2"/>
<circle cx="292" cy="74" r="7" class="fs sa" stroke-width="2"/>
<text x="264" y="166" class="tb tng" text-anchor="middle">分けられない</text>
<text x="12" y="190" class="tm">塗りつぶし＝出力 1、白抜き＝出力 0</text>
<text x="12" y="210" class="tm">軸：横が入力 x1、縦が入力 x2（0 か 1）</text>
<line x1="12" y1="226" x2="308" y2="226" class="l sb w1"/>
<text x="12" y="250" class="tb">② 隠れ層を足すと分けられる</text>
<line x1="52" y1="296" x2="96" y2="296" class="l sm w1"/>
<line x1="52" y1="296" x2="96" y2="344" class="l sm w1"/>
<line x1="52" y1="344" x2="96" y2="296" class="l sm w1"/>
<line x1="52" y1="344" x2="96" y2="344" class="l sm w1"/>
<line x1="120" y1="296" x2="164" y2="320" class="l sm w1"/>
<line x1="120" y1="344" x2="164" y2="320" class="l sm w1"/>
<circle cx="40" cy="296" r="12" class="fs sb" stroke-width="2"/>
<circle cx="40" cy="344" r="12" class="fs sb" stroke-width="2"/>
<circle cx="108" cy="296" r="12" class="fas sa" stroke-width="2"/>
<circle cx="108" cy="344" r="12" class="fas sa" stroke-width="2"/>
<circle cx="176" cy="320" r="12" class="fs sb" stroke-width="2"/>
<text x="40" y="380" class="tm" text-anchor="middle">入力</text>
<text x="108" y="380" class="tm" text-anchor="middle">隠れ</text>
<text x="176" y="380" class="tm" text-anchor="middle">出力</text>
<text x="264" y="264" class="tb" text-anchor="middle">XOR</text>
<rect x="220" y="272" width="88" height="88" class="sb" stroke-width="1"/>
<line x1="222" y1="302" x2="278" y2="358" class="l sok w2"/>
<line x1="250" y1="274" x2="306" y2="330" class="l sok w2"/>
<circle cx="236" cy="344" r="7" class="fs sa" stroke-width="2"/>
<circle cx="236" cy="288" r="7" class="fa sa" stroke-width="2"/>
<circle cx="292" cy="344" r="7" class="fa sa" stroke-width="2"/>
<circle cx="292" cy="288" r="7" class="fs sa" stroke-width="2"/>
<text x="264" y="380" class="tb tok" text-anchor="middle">2本で挟める</text>
<text x="12" y="418">入力2・隠れ2・出力1の多層パーセプトロン</text>
<line x1="12" y1="434" x2="308" y2="434" class="l sb w1"/>
<text x="12" y="460" class="tb">単純パーセプトロン：直線でしか分けられない</text>
<text x="12" y="480" class="tb tng">→ XOR は解けない</text>
</svg>
