<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 926" role="img" aria-labelledby="fig-g-frequency-table-t fig-g-frequency-table-d">
<title id="fig-g-frequency-table-t">度数分布表：点数を区間（階級）に分け、区間ごとの人数（度数）を数えた表</title>
<desc id="fig-g-frequency-table-d">階級はデータを区切った区間、度数はその階級に入る個数（ここでは人数）。度数分布表は、階級ごとの度数をまとめた表。①何に困っていたか：10人の点数35、42、48、51、55、57、63、66、74、92をそのまま並べても、どのあたりに多いかがすぐには見えない。区間に分けて人数を数える。②度数分布表（10点刻み）：30〜39点が1人、40〜49点が2人、50〜59点が3人、60〜69点が2人、70〜79点が1人、80〜89点が0人、90〜99点が1人、合計10人。いちばん多いのは50点台の3人。③表の度数を棒の高さにしたのがヒストグラム。横軸は点数の区間、縦軸は人数。④似た語との違い：散布図は2つの変数を1人1点で描いた図。確率密度関数は連続した値の出やすさを表す式で、グラフの面積が確率。共分散行列は、変数ごとの分散と変数どうしの共分散を並べた表。点数は説明のための例。</desc>
<text x="12" y="20" class="tb">度数分布表：区間ごとに何人かを数えた表</text>
<text x="12" y="42" class="tm">階級：データを区切った区間（例：30〜39点）</text>
<text x="12" y="60" class="tm">度数：その階級に入る個数（ここでは人数）</text>
<line x1="12" y1="74" x2="308" y2="74" class="l sb w1"/>
<text x="12" y="96" class="tb">① 何に困っていたか</text>
<text x="12" y="118">10人の点数をそのまま並べても</text>
<text x="12" y="136" class="tm">35, 42, 48, 51, 55, 57, 63, 66, 74, 92</text>
<text x="12" y="154">どのあたりに多いかが、すぐには見えない</text>
<text x="12" y="172" class="tb ta">→ 区間（階級）に分けて、人数を数える</text>
<line x1="12" y1="186" x2="308" y2="186" class="l sb w1"/>
<text x="12" y="208" class="tb">② 度数分布表（10点刻み）</text>
<text x="12" y="226" class="tm">表の1行＝1つの階級（点数は説明のための例）</text>
<rect x="12" y="238" width="110" height="24" class="fbg sb" stroke-width="1"/><text x="67" y="255" class="tb tm" text-anchor="middle">階級（点）</text>
<rect x="122" y="238" width="80" height="24" class="fbg sb" stroke-width="1"/><text x="162" y="255" class="tb tm" text-anchor="middle">度数（人）</text>
<rect x="202" y="238" width="106" height="24" class="fbg sb" stroke-width="1"/><text x="255" y="255" class="tb tm" text-anchor="middle">入った点数</text>
<rect x="12" y="262" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="279" text-anchor="middle">30〜39</text>
<rect x="122" y="262" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="279" text-anchor="middle" class="tb">1</text>
<rect x="202" y="262" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="279" text-anchor="middle" class="tm">35</text>
<rect x="12" y="286" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="303" text-anchor="middle">40〜49</text>
<rect x="122" y="286" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="303" text-anchor="middle" class="tb">2</text>
<rect x="202" y="286" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="303" text-anchor="middle" class="tm">42, 48</text>
<rect x="12" y="310" width="110" height="24" class="fas sa" stroke-width="1"/><text x="67" y="327" text-anchor="middle" class="tb ta">50〜59</text>
<rect x="122" y="310" width="80" height="24" class="fas sa" stroke-width="1"/><text x="162" y="327" text-anchor="middle" class="tb ta">3</text>
<rect x="202" y="310" width="106" height="24" class="fas sa" stroke-width="1"/><text x="255" y="327" text-anchor="middle" class="tm">51, 55, 57</text>
<rect x="12" y="334" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="351" text-anchor="middle">60〜69</text>
<rect x="122" y="334" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="351" text-anchor="middle" class="tb">2</text>
<rect x="202" y="334" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="351" text-anchor="middle" class="tm">63, 66</text>
<rect x="12" y="358" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="375" text-anchor="middle">70〜79</text>
<rect x="122" y="358" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="375" text-anchor="middle" class="tb">1</text>
<rect x="202" y="358" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="375" text-anchor="middle" class="tm">74</text>
<rect x="12" y="382" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="399" text-anchor="middle">80〜89</text>
<rect x="122" y="382" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="399" text-anchor="middle" class="tb">0</text>
<rect x="202" y="382" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="399" text-anchor="middle" class="tm">—</text>
<rect x="12" y="406" width="110" height="24" class="fs sb" stroke-width="1"/><text x="67" y="423" text-anchor="middle">90〜99</text>
<rect x="122" y="406" width="80" height="24" class="fs sb" stroke-width="1"/><text x="162" y="423" text-anchor="middle" class="tb">1</text>
<rect x="202" y="406" width="106" height="24" class="fs sb" stroke-width="1"/><text x="255" y="423" text-anchor="middle" class="tm">92</text>
<rect x="12" y="430" width="110" height="24" class="fbg sb" stroke-width="1"/><text x="67" y="447" class="tb" text-anchor="middle">合計</text>
<rect x="122" y="430" width="80" height="24" class="fbg sb" stroke-width="1"/><text x="162" y="447" class="tb" text-anchor="middle">10</text>
<rect x="202" y="430" width="106" height="24" class="fbg sb" stroke-width="1"/>
<text x="12" y="474" class="tb ta">いちばん多いのは 50点台（3人）</text>
<line x1="12" y1="488" x2="308" y2="488" class="l sb w1"/>
<text x="12" y="510" class="tb">③ 表の度数を棒にするとヒストグラム</text>
<text x="12" y="528" class="tm">（ヒストグラム。横：点数の区間、縦：人数）</text>
<text x="12" y="560" class="tm">人数</text>
<line x1="60" y1="640" x2="304" y2="640" class="l w1"/>
<line x1="60" y1="640" x2="60" y2="552" class="l w1"/>
<text x="54" y="644" class="tm" text-anchor="end">0</text>
<text x="54" y="618" class="tm" text-anchor="end">1</text>
<text x="54" y="592" class="tm" text-anchor="end">2</text>
<text x="54" y="566" class="tm" text-anchor="end">3</text>
<rect x="60" y="614" width="34" height="26" class="fas sa" stroke-width="1"/>
<text x="60" y="656" class="tm" text-anchor="middle">30</text>
<rect x="94" y="588" width="34" height="52" class="fas sa" stroke-width="1"/>
<text x="94" y="656" class="tm" text-anchor="middle">40</text>
<rect x="128" y="562" width="34" height="78" class="fa sa" stroke-width="1"/>
<text x="128" y="656" class="tm" text-anchor="middle">50</text>
<rect x="162" y="588" width="34" height="52" class="fas sa" stroke-width="1"/>
<text x="162" y="656" class="tm" text-anchor="middle">60</text>
<rect x="196" y="614" width="34" height="26" class="fas sa" stroke-width="1"/>
<text x="196" y="656" class="tm" text-anchor="middle">70</text>
<text x="230" y="656" class="tm" text-anchor="middle">80</text>
<rect x="264" y="614" width="34" height="26" class="fas sa" stroke-width="1"/>
<text x="264" y="656" class="tm" text-anchor="middle">90</text>
<text x="298" y="656" class="tm" text-anchor="middle">100</text>
<text x="12" y="684">表は数で、ヒストグラムは棒の高さで、</text>
<text x="12" y="702">同じ数え方の結果を見せる</text>
<line x1="12" y1="716" x2="308" y2="716" class="l sb w1"/>
<text x="12" y="738" class="tb">④ 似た語との違い</text>
<text x="12" y="760"><tspan class="tb">散布図</tspan>：2つの変数を、1人1点で描いた図</text>
<text x="12" y="778" class="tm">　（例：勉強時間と点数）。数えた表ではない</text>
<text x="12" y="800"><tspan class="tb">確率密度関数</tspan>：連続した値の出やすさを</text>
<text x="12" y="818" class="tm">　表す式（グラフの面積が確率）</text>
<text x="12" y="840"><tspan class="tb">共分散行列</tspan>：変数ごとの分散と、変数</text>
<text x="12" y="858" class="tm">　どうしの共分散を並べた表</text>
<rect x="12" y="872" width="296" height="44" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="890" class="tb tok" text-anchor="middle">1つの変数を区間ごとに数えた表</text>
<text x="160" y="908" class="tb tok" text-anchor="middle">＝ 度数分布表</text>
</svg>
