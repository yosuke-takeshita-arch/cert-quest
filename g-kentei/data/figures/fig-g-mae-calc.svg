<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 556" role="img" aria-labelledby="fig-g-mae-calc-t fig-g-mae-calc-d">
<title id="fig-g-mae-calc-t">MAE（平均絶対値誤差）の計算：外れが +1・−1・+4 のとき</title>
<desc id="fig-g-mae-calc-d">何のための図か：予測と実測の差が +1、−1、+4 の3つのとき、MAE が2になる理由を、問題と同じ数で見る。①3つの外れを棒で描く（上向きがプラス、下向きがマイナス）。②向き（プラスとマイナス）を外して、大きさ1、1、4にする。外れの大きさの合計÷件数で、(1＋1＋4)÷3＝6÷3＝2。1件あたり平均で2ずれている。③取り違えやすい数：符号をつけたまま足すと1−1＋4＝4、4÷3≒1.33で、プラスとマイナスが打ち消し合い、ずれが小さく見える。二乗して平均すると(1＋1＋16)÷3＝6でこれはMSE、その平方根√6≒2.45はRMSE。二乗は大きな外れ（+4）を重く数える。</desc>
<text x="12" y="20" class="tb">MAE＝外れの大きさの平均</text>
<text x="12" y="42" class="tm">何のための図か：外れが +1・−1・+4 のとき、</text>
<text x="12" y="60" class="tm">MAE がなぜ 2 になるかを、問題の数で見る</text>
<text x="12" y="88" class="tb">① 3つの外れ（予測と実測の差）</text>
<line x1="34" y1="170" x2="300" y2="170" class="l sm w1"/>
<text x="12" y="174" class="tm">0</text>
<rect x="60" y="156" width="40" height="14" class="fas sa" stroke-width="1.5"/>
<text x="80" y="150" class="tb" text-anchor="middle">＋1</text>
<rect x="140" y="170" width="40" height="14" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="200" class="tb" text-anchor="middle">−1</text>
<rect x="220" y="114" width="40" height="56" class="fas sa" stroke-width="1.5"/>
<text x="240" y="108" class="tb" text-anchor="middle">＋4</text>
<line x1="12" y1="214" x2="308" y2="214" class="l sb w1"/>
<text x="12" y="236" class="tb">② 向き（＋−）を外して、大きさにする</text>
<rect x="12" y="248" width="30" height="18" class="fas sa" stroke-width="1.5"/>
<text x="50" y="262" class="tb">1</text>
<rect x="12" y="274" width="30" height="18" class="fas sa" stroke-width="1.5"/>
<text x="50" y="288" class="tb">1（−1 の − を外す）</text>
<rect x="12" y="300" width="120" height="18" class="fas sa" stroke-width="1.5"/>
<text x="140" y="314" class="tb">4</text>
<text x="12" y="342">外れの大きさの合計 ÷ 件数</text>
<rect x="12" y="352" width="296" height="30" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="372" class="tb tok" text-anchor="middle">(1＋1＋4) ÷ 3 ＝ 6 ÷ 3 ＝ 2</text>
<text x="12" y="402" class="tm">1件あたり、平均で 2 ずれている</text>
<line x1="12" y1="416" x2="308" y2="416" class="l sb w1"/>
<text x="12" y="438" class="tb">③ 取り違えやすい数</text>
<text x="12" y="460" class="tng">符号のまま：1−1＋4＝4、4÷3≒1.33</text>
<text x="12" y="478" class="tm">　＋1 と −1 が消し合い、ずれが小さく見える</text>
<text x="12" y="504" class="twn">二乗して平均：(1＋1＋16)÷3＝6（MSE）</text>
<text x="12" y="522" class="tm">　その平方根 √6≒2.45 が RMSE</text>
<text x="12" y="540" class="tm">　二乗は大きな外れ（＋4）を重く数える</text>
</svg>
