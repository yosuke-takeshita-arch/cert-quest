<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 524" role="img" aria-labelledby="fig-g-normalization-t fig-g-normalization-d">
<title id="fig-g-normalization-t">正規化の4種類：平均と分散をとる範囲のちがい</title>
<desc id="fig-g-normalization-d">1枚のシートが1つのデータ、縦がチャネル、横が画像上の位置を表す。バッチ正規化は、同じチャネルを全データ・全位置でまとめて平均と分散を求める。レイヤー正規化は、1つのデータの全チャネル・全位置で求める。インスタンス正規化は、1つのデータの1チャネルだけで求める。グループ正規化は、1つのデータでチャネルをいくつかの束に分け、束ごとに求める。レイヤー・インスタンス・グループはバッチの方向には計算しないので、バッチの大きさに依存しない。グループが1つならレイヤー正規化、1チャネルずつならインスタンス正規化と同じになる。</desc>
