<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 844" role="img" aria-labelledby="fig-g-dall-e-t fig-g-dall-e-d">
<title id="fig-g-dall-e-t">DALL-E：文のトークンの続きとして画像のトークンを1つずつ当てて、文から画像を作る（Text-To-Image）</title>
<desc id="fig-g-dall-e-d">Text-To-Imageは文から画像を作るタスクの名前で、DALL-EはそれをOpenAIが2021年に示したモデル。①画像も記号（トークン）の列にする。256×256画素×3色の画像を圧縮して32×32＝1024マスにし、1マスが1トークンで8192種類の記号のどれか1つ。数の量は256×256×3＝196,608個から1,024個へ、196,608÷1,024＝192分の1に減り、Transformerが一度に読める長さに収まる。②文（最大256個）と画像（1,024個）のトークンを1本の列につなげ、前のトークンをすべて見て次の1つを当てる（自己回帰）。1つ当てたら列に足して次へ進み、画像の1,024個までくり返す。Transformerは120億パラメータで、ネットから集めた文と画像2億5000万組で学習した。③作るときは、1で文（説明用の例：夕焼けの海辺を走る白い犬）を入れ、2で続きの画像トークンを1つずつ1,024個書き、3で圧縮の逆で256×256の画像に戻し、4で512枚作ってCLIPで文に合う順に並べ、よいものを選ぶ。逆向き（画像→文）はImage Captioning。CLIPは画像と文の合い方を測るだけで画像は作らず、DALL-Eでは選ぶ役。</desc>
<text x="12" y="20" class="tb">DALL-E：文の続きとして画像を書く</text>
<text x="12" y="42" class="tm">Text-To-Image＝文から画像を作るタスクの名前</text>
<text x="12" y="60" class="tm">DALL-E＝それを行う OpenAI のモデル（2021年）</text>
<text x="12" y="88" class="tb">① 画像も記号（トークン）の列にする</text>
