<line x1="44" y1="172" x2="44.0" y2="153.6" class="l sm w1"/>
<polygon points="44,148 47.5,153.6 40.5,153.6" class="fm"/>
<line x1="62" y1="179" x2="78.4" y2="179.0" class="l sa w1"/>
<polygon points="84,179 78.4,182.5 78.4,175.5" class="fa"/>
<line x1="84" y1="189" x2="63" y2="189" class="l sng w2"/>
<polyline points="70,185.2 63,189 70,192.8" class="l sng w2"/>
<text x="73" y="172" class="ta" text-anchor="middle">W</text>
<text x="102" y="116" class="tm" text-anchor="middle">時刻2</text>
<rect x="84" y="124" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="102" y="139.5" text-anchor="middle">y2</text>
<rect x="84" y="172" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="102" y="187.5" text-anchor="middle">h2</text>
<rect x="84" y="220" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="102" y="235.5" text-anchor="middle">x2</text>
<line x1="102" y1="220" x2="102.0" y2="201.6" class="l sm w1"/>
<polygon points="102,196 105.5,201.6 98.5,201.6" class="fm"/>
<line x1="102" y1="172" x2="102.0" y2="153.6" class="l sm w1"/>
<polygon points="102,148 105.5,153.6 98.5,153.6" class="fm"/>
<line x1="120" y1="179" x2="136.4" y2="179.0" class="l sa w1"/>
<polygon points="142,179 136.4,182.5 136.4,175.5" class="fa"/>
<line x1="142" y1="189" x2="121" y2="189" class="l sng w2"/>
<polyline points="128,185.2 121,189 128,192.8" class="l sng w2"/>
<text x="131" y="172" class="ta" text-anchor="middle">W</text>
<text x="160" y="116" class="tm" text-anchor="middle">時刻3</text>
<rect x="142" y="124" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="160" y="139.5" text-anchor="middle">y3</text>
<rect x="142" y="172" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="160" y="187.5" text-anchor="middle">h3</text>
<rect x="142" y="220" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="160" y="235.5" text-anchor="middle">x3</text>
<line x1="160" y1="220" x2="160.0" y2="201.6" class="l sm w1"/>
<polygon points="160,196 163.5,201.6 156.5,201.6" class="fm"/>
<line x1="160" y1="172" x2="160.0" y2="153.6" class="l sm w1"/>
<polygon points="160,148 163.5,153.6 156.5,153.6" class="fm"/>
<line x1="178" y1="179" x2="194.4" y2="179.0" class="l sa w1"/>
<polygon points="200,179 194.4,182.5 194.4,175.5" class="fa"/>
<line x1="200" y1="189" x2="179" y2="189" class="l sng w2"/>
<polyline points="186,185.2 179,189 186,192.8" class="l sng w2"/>
<text x="189" y="172" class="ta" text-anchor="middle">W</text>
<text x="218" y="116" class="tm" text-anchor="middle">時刻4</text>
<rect x="200" y="124" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="218" y="139.5" text-anchor="middle">y4</text>
<rect x="200" y="172" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="218" y="187.5" text-anchor="middle">h4</text>
<rect x="200" y="220" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="218" y="235.5" text-anchor="middle">x4</text>
<line x1="218" y1="220" x2="218.0" y2="201.6" class="l sm w1"/>
<polygon points="218,196 221.5,201.6 214.5,201.6" class="fm"/>
<line x1="218" y1="172" x2="218.0" y2="153.6" class="l sm w1"/>
<polygon points="218,148 221.5,153.6 214.5,153.6" class="fm"/>
<line x1="236" y1="179" x2="252.4" y2="179.0" class="l sa w1"/>
<polygon points="258,179 252.4,182.5 252.4,175.5" class="fa"/>
<line x1="258" y1="189" x2="237" y2="189" class="l sng w2"/>
<polyline points="244,185.2 237,189 244,192.8" class="l sng w2"/>
<text x="247" y="172" class="ta" text-anchor="middle">W</text>
<text x="276" y="116" class="tm" text-anchor="middle">時刻5</text>
<rect x="258" y="124" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="276" y="139.5" text-anchor="middle">y5</text>
<rect x="258" y="172" width="36" height="22" class="fas sa" stroke-width="1.5"/>
<text x="276" y="187.5" text-anchor="middle">h5</text>
<rect x="258" y="220" width="36" height="22" class="fs sb" stroke-width="1.5"/>
<text x="276" y="235.5" text-anchor="middle">x5</text>
<line x1="276" y1="220" x2="276.0" y2="201.6" class="l sm w1"/>
<polygon points="276,196 279.5,201.6 272.5,201.6" class="fm"/>
<line x1="276" y1="172" x2="276.0" y2="153.6" class="l sm w1"/>
<polygon points="276,148 279.5,153.6 272.5,153.6" class="fm"/>
<text x="24" y="266">青い矢印：状態を次の時刻へ運ぶ。</text>
<text x="24" y="284" class="tm">　どこでも同じ重み W を使う</text>
<text x="24" y="308" class="tb">② 赤い矢印：誤差を最後の時刻5から</text>
<text x="24" y="326" class="tb">　時刻1へ、順にさかのぼって伝える</text>
<text x="24" y="350" class="tm">→ 同じ重みを共有する5層の網と同じ扱い</text>
<rect x="12" y="384" width="296" height="166" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="404" class="tb">③ 時刻ごとの勾配を、W について足す</text>
<text x="24" y="424" class="tm">勾配＝W をどちらへどれだけ直すかの量</text>
<rect x="20" y="436" width="48" height="24" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="44" y="453" text-anchor="middle">0.1</text>
<text x="44" y="476" class="tm" text-anchor="middle">時刻1</text>
<rect x="78" y="436" width="48" height="24" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="102" y="453" text-anchor="middle">0.2</text>
<text x="102" y="476" class="tm" text-anchor="middle">時刻2</text>
<rect x="136" y="436" width="48" height="24" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="160" y="453" text-anchor="middle">−0.1</text>
<text x="160" y="476" class="tm" text-anchor="middle">時刻3</text>
<rect x="194" y="436" width="48" height="24" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="218" y="453" text-anchor="middle">0.3</text>
<text x="218" y="476" class="tm" text-anchor="middle">時刻4</text>
<rect x="252" y="436" width="48" height="24" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="276" y="453" text-anchor="middle">0.2</text>
<text x="276" y="476" class="tm" text-anchor="middle">時刻5</text>
<text x="24" y="502">0.1＋0.2−0.1＋0.3＋0.2＝0.7</text>
<text x="24" y="522" class="tb">→ この合計 0.7 で、共有している W を</text>
<text x="24" y="540" class="tb">　1回だけ直す</text>
<rect x="12" y="562" width="296" height="196" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="582" class="tb">④ 欠点：長い系列は掛け算が重なる</text>
<text x="24" y="602">100時刻なら100段さかのぼり、1段ごとに</text>
<text x="24" y="620">同じくらいの数が勾配に掛かる</text>
<text x="24" y="646" class="tb">0.9 を100回掛けると 約0.00003</text>
<text x="24" y="664">→ 勾配がほぼ0。昔の時刻を学べない</text>
<text x="24" y="682" class="tm">　（勾配消失）</text>
<text x="24" y="708" class="tb">1.1 を100回掛けると 約13781</text>
<text x="24" y="726">→ 勾配が巨大。W を直しすぎて発散</text>
<text x="24" y="744" class="tm">　（勾配爆発）</text>
<text x="12" y="782" class="tm">教師強制は、次の入力に何を入れるかの</text>
<text x="12" y="800" class="tm">工夫で、勾配の計算のしかた（BPTT）とは別</text>
</svg>
