<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 812" role="img" aria-labelledby="fig-g-bptt-t fig-g-bptt-d">
<title id="fig-g-bptt-t">BPTT：RNN を時刻ごとに横へ展開し、誤差を最後の時刻から過去へさかのぼらせる</title>
<desc id="fig-g-bptt-d">BPTT は Backpropagation Through Time の略。例は5時刻の系列で、数はすべて例。①時刻1から5まで、入力x・隠れ層h・出力yを横に並べる（展開）。青い矢印は状態hを次の時刻へ運ぶもので、どこでも同じ重みWを使う。②赤い矢印は誤差で、最後の時刻5から時刻1へ順にさかのぼって伝える。同じ重みを共有する5層のネットワークと同じ扱いになる。③勾配はWをどちらへどれだけ直すかの量。時刻ごとに出た勾配0.1・0.2・−0.1・0.3・0.2を足して0.7とし、この合計で共有しているWを1回だけ直す。④欠点：100時刻なら100段さかのぼり、1段ごとに同じくらいの数が勾配に掛かる。0.9を100回掛けると約0.00003で、勾配がほぼ0になり昔の時刻を学べない（勾配消失）。1.1を100回掛けると約13781で、勾配が巨大になりWを直しすぎて発散する（勾配爆発）。教師強制は次の入力に何を入れるかの工夫で、勾配の計算のしかたであるBPTTとは別。</desc>
<text x="12" y="20" class="tb">BPTT：展開して、誤差を過去へさかのぼらせる</text>
<text x="12" y="42" class="tm">Backpropagation Through Time の略</text>
<text x="12" y="60" class="tm">例：5時刻の系列（数はすべて例）</text>
<rect x="12" y="72" width="296" height="300" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="92" class="tb">① 時刻ごとに横へ並べる（展開）</text>
<text x="44" y="116" class="tm" text-anchor="middle">時刻1</text>
