<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 916" role="img" aria-labelledby="fig-g-ai-guideline-principles-t fig-g-ai-guideline-principles-d">
<title id="fig-g-ai-guideline-principles-t">AI事業者ガイドラインの段：基本理念（どんな社会を目指すか）から、原則・共通の指針（何に取り組むか）へ</title>
<desc id="fig-g-ai-guideline-principles-d">AI事業者ガイドラインは、総務省と経済産業省が、AIを作る・提供する・使う事業者向けに出す指針（第1.2版は2026年3月）。第2部は段に分かれる。A 基本理念は、AIでどんな社会を目指すか（why）。①人間の尊厳が尊重される社会（Dignity）②多様な背景を持つ人々が多様な幸せを追求できる社会（Diversity and Inclusion）③持続可能な社会（Sustainability）の3つ。2019年の人間中心のAI社会原則がもと。B 原則と C 共通の指針は、基本理念を実現するために何に取り組むか（what）。共通の指針は10項目：1）人間中心 2）安全性 3）公平性 4）プライバシー保護 5）セキュリティ確保 6）透明性 7）アカウンタビリティ 8）教育・リテラシー 9）公正競争確保 10）イノベーション。その下に、AI開発者・AI提供者・AI利用者の立場ごとに重要となる事項がある。取り違えやすい点：人間中心・安全性・公平性は共通の指針の最初の3つで、基本理念ではない。基本理念は目指す社会の姿、指針はそのための取り組み。</desc>
<text x="12" y="20" class="tb">AI事業者ガイドライン：基本理念と指針</text>
<text x="12" y="42" class="tm">総務省・経済産業省が、AIを作る・提供する・</text>
<text x="12" y="60" class="tm">使う事業者向けに出す指針（第1.2版 2026年3月）</text>
<line x1="12" y1="74" x2="308" y2="74" class="l sb w1"/>
<text x="12" y="96" class="tb">① 段に分かれている（上から下へ）</text>
<rect x="12" y="108" width="296" height="212" class="fas sa" stroke-width="2" rx="6"/>
<text x="20" y="130" class="tb ta">A 基本理念（why）</text>
<text x="20" y="148" class="tm">AIで、どんな社会を目指すか</text>
<rect x="20" y="158" width="280" height="40" class="fs sa" stroke-width="1" rx="4"/>
<text x="28" y="175" class="tb">① 人間の尊厳が尊重される社会</text>
<text x="28" y="191" class="tm">　Dignity</text>
<rect x="20" y="202" width="280" height="56" class="fs sa" stroke-width="1" rx="4"/>
<text x="28" y="219" class="tb">② 多様な背景を持つ人々が多様な</text>
<text x="28" y="235" class="tb">　幸せを追求できる社会</text>
<text x="28" y="251" class="tm">　Diversity and Inclusion</text>
<rect x="20" y="262" width="280" height="40" class="fs sa" stroke-width="1" rx="4"/>
<text x="28" y="279" class="tb">③ 持続可能な社会</text>
<text x="28" y="295" class="tm">　Sustainability</text>
<line x1="160" y1="320" x2="160" y2="346" class="l w1"/>
<polygon points="160,352 156.5,346 163.5,346" class="ft"/>
<text x="170" y="340" class="tm">実現するために</text>
<rect x="12" y="354" width="296" height="202" class="fs sm" stroke-width="1.5" rx="6"/>
<text x="20" y="376" class="tb">B 原則 → C 共通の指針（what）</text>
<text x="20" y="394" class="tm">何に取り組むか（10項目）</text>
<rect x="20" y="404" width="136" height="24" class="fok sok" stroke-width="1"/>
<text x="28" y="421" class="tb tok">1）人間中心</text>
<rect x="164" y="404" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="172" y="421">6）透明性</text>
<rect x="20" y="430" width="136" height="24" class="fok sok" stroke-width="1"/>
<text x="28" y="447" class="tb tok">2）安全性</text>
<rect x="164" y="430" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="172" y="447">7）アカウンタビリティ</text>
<rect x="20" y="456" width="136" height="24" class="fok sok" stroke-width="1"/>
<text x="28" y="473" class="tb tok">3）公平性</text>
<rect x="164" y="456" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="172" y="473">8）教育・リテラシー</text>
<rect x="20" y="482" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="28" y="499">4）プライバシー保護</text>
<rect x="164" y="482" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="172" y="499">9）公正競争確保</text>
<rect x="20" y="508" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="28" y="525">5）セキュリティ確保</text>
<rect x="164" y="508" width="136" height="24" class="fs sb" stroke-width="1"/>
<text x="172" y="525">10）イノベーション</text>
<text x="20" y="546" class="tm">緑の3つ＝指針の最初の3つ</text>
<line x1="160" y1="556" x2="160" y2="571" class="l w1"/>
<polygon points="160,576 156.5,570 163.5,570" class="ft"/>
<rect x="12" y="578" width="296" height="64" class="fs sm" stroke-width="1" rx="6"/>
<text x="20" y="600" class="tb">立場ごとに重要となる事項</text>
<text x="20" y="620" class="tm">AI開発者・AI提供者・AI利用者の</text>
<text x="20" y="636" class="tm">それぞれで、取り組むことを示す</text>
<line x1="12" y1="658" x2="308" y2="658" class="l sb w1"/>
<text x="12" y="680" class="tb">② 取り違えやすい所</text>
<text x="12" y="702">人間中心・安全性・公平性は、共通の指針の</text>
<text x="12" y="720">最初の3つ（緑）。基本理念ではない</text>
<rect x="12" y="734" width="144" height="64" class="fas sa" stroke-width="1.5" rx="4"/>
<text x="84" y="756" class="tb ta" text-anchor="middle">基本理念</text>
<text x="84" y="774" class="tm" text-anchor="middle">目指す社会の姿</text>
<text x="84" y="790" class="tm" text-anchor="middle">（〜な社会）</text>
<rect x="164" y="734" width="144" height="64" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="236" y="756" class="tb tok" text-anchor="middle">共通の指針</text>
<text x="236" y="774" class="tm" text-anchor="middle">そのための取り組み</text>
<text x="236" y="790" class="tm" text-anchor="middle">（人間中心 など）</text>
<text x="12" y="822" class="tm">基本理念のもと：2019年に政府が決めた</text>
<text x="12" y="840" class="tm">「人間中心の AI 社会原則」</text>
<rect x="12" y="856" width="296" height="48" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="876" class="tb tok" text-anchor="middle">基本理念＝尊厳・多様な幸せ・持続可能</text>
<text x="160" y="894" class="tb tok" text-anchor="middle">の3つの社会</text>
</svg>
