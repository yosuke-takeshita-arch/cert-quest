<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 568" role="img" aria-labelledby="fig-g-cov-unit-t fig-g-cov-unit-d">
<title id="fig-g-cov-unit-t">単位を変えると、共分散は変わり、相関係数は変わらない</title>
<desc id="fig-g-cov-unit-d">同じ5人の身長と体重を、身長をcmで測った場合とmで測った場合で比べる。散布図の点の並び方は同じ。平均との差どうしを掛けて平均した共分散は、cmでは56、mでは0.56で、100分の1に変わる。相関係数は共分散を身長と体重の標準偏差の積で割った値で、cmでは56÷（10×5.97）、mでは0.56÷（0.1×5.97）で、どちらも約0.94。割られる数も割る数も100分の1になって打ち消し合うので、相関係数は変わらない。数は説明のための例。</desc>
<text x="12" y="20" class="tb">①同じ5人を、cmとmで測る</text>
<text x="12" y="40" class="tm">点の並び方は、どちらもまったく同じ</text>
<rect x="24" y="52" width="120" height="96" class="sb w1"/>
<circle cx="34.0" cy="127.6" r="3.6" class="fa"/>
<circle cx="67.3" cy="103.5" r="3.6" class="fa"/>
<circle cx="84.0" cy="113.8" r="3.6" class="fa"/>
<circle cx="100.7" cy="86.2" r="3.6" class="fa"/>
<circle cx="134.0" cy="68.9" r="3.6" class="fa"/>
<text x="34" y="164" class="tm" text-anchor="middle">150</text>
<text x="134" y="164" class="tm" text-anchor="middle">180</text>
<text x="84" y="182" text-anchor="middle">身長（cm）</text>
<text x="14" y="100" class="tm" text-anchor="middle" transform="rotate(-90 14 100)">体重</text>
<rect x="180" y="52" width="120" height="96" class="sb w1"/>
<circle cx="190.0" cy="127.6" r="3.6" class="fa"/>
<circle cx="223.3" cy="103.5" r="3.6" class="fa"/>
<circle cx="240.0" cy="113.8" r="3.6" class="fa"/>
<circle cx="256.7" cy="86.2" r="3.6" class="fa"/>
<circle cx="290.0" cy="68.9" r="3.6" class="fa"/>
<text x="190" y="164" class="tm" text-anchor="middle">1.50</text>
<text x="290" y="164" class="tm" text-anchor="middle">1.80</text>
<text x="240" y="182" text-anchor="middle">身長（m）</text>
<text x="170" y="100" class="tm" text-anchor="middle" transform="rotate(-90 170 100)">体重</text>
<text x="12" y="212" class="tb">②共分散＝「平均との差」どうしを掛けて平均</text>
<text x="12" y="232" class="tm">平均：身長165cm（1.65m）、体重56kg</text>
<text x="12" y="256" class="tm">身長の差（cm）</text>
<text x="140" y="256" text-anchor="end">-15</text>
<text x="180" y="256" text-anchor="end">-5</text>
<text x="220" y="256" text-anchor="end">0</text>
<text x="260" y="256" text-anchor="end">5</text>
<text x="300" y="256" text-anchor="end">15</text>
<rect x="8" y="263" width="304" height="21" rx="4" class="fwn"/>
<text x="12" y="278" class="tm">身長の差（m）</text>
<text x="140" y="278" text-anchor="end">-0.15</text>
<text x="180" y="278" text-anchor="end">-0.05</text>
<text x="220" y="278" text-anchor="end">0</text>
<text x="260" y="278" text-anchor="end">0.05</text>
<text x="300" y="278" text-anchor="end">0.15</text>
<text x="12" y="300" class="tm">体重の差（kg）</text>
<text x="140" y="300" text-anchor="end">-8</text>
<text x="180" y="300" text-anchor="end">-1</text>
<text x="220" y="300" text-anchor="end">-4</text>
<text x="260" y="300" text-anchor="end">4</text>
<text x="300" y="300" text-anchor="end">9</text>
<text x="12" y="330">cm：掛けて足すと280、5で割って 56</text>
<text x="12" y="350">m ：掛けて足すと2.8、5で割って 0.56</text>
<text x="12" y="370" class="tb tng">→ 共分散は100分の1に変わる</text>
<text x="12" y="404" class="tb">③相関係数＝共分散 ÷（2つの標準偏差の積）</text>
<text x="12" y="424" class="tm">標準偏差：身長10cm（0.1m）、体重5.97kg</text>
<text x="12" y="448">cm：56 ÷（10×5.97）≒ 0.94</text>
<text x="12" y="468">m ：0.56 ÷（0.1×5.97）≒ 0.94</text>
<text x="12" y="488" class="tm">割られる数も割る数も100分の1になり、</text>
<text x="12" y="506" class="tm">打ち消し合う</text>
<text x="12" y="526" class="tb tok">→ 相関係数は変わらない（-1〜1のまま）</text>
<text x="12" y="556" class="tm">数は説明のための例</text>
</svg>
