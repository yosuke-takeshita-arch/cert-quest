<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 590" role="img" aria-labelledby="fig-g-ai-ml-dl-t fig-g-ai-ml-dl-d">
<title id="fig-g-ai-ml-dl-t">AI・機械学習・ディープラーニングの包含関係と、特徴量を作る人の違い</title>
<desc id="fig-g-ai-ml-dl-d">入れ子の3つの楕円。外側が人工知能（AI）で、知的な機械・プログラムを作る科学と技術。その中に機械学習があり、データから知識（ルールやパターン）を獲得する手法。さらにその中にディープラーニングがあり、多層のニューラルネットワークで特徴量までデータから学ぶ手法。下は流れの比較。従来の機械学習は、データから人が設計した特徴量を取り出して学習する。ディープラーニングは、データから特徴量づくりも含めて学習する。違いは、特徴量を誰が作るか。</desc>
<text x="12" y="20" class="tb">① 入れ子の関係</text>
<ellipse cx="160" cy="130" rx="150" ry="104" class="fs sb" stroke-width="1.5"/>
<text x="160" y="52" class="tb" text-anchor="middle">人工知能（AI）</text>
<ellipse cx="160" cy="158" rx="108" ry="68" class="fas sa" stroke-width="1.5"/>
<text x="160" y="118" class="tb" text-anchor="middle">機械学習</text>
<ellipse cx="160" cy="170" rx="66" ry="36" class="fa"/>
<text x="160" y="166" class="tb ton" text-anchor="middle">ディープ</text>
<text x="160" y="184" class="tb ton" text-anchor="middle">ラーニング</text>
<text x="12" y="262">AI：知的なプログラムを作る科学と技術</text>
<text x="12" y="282">機械学習：データから知識を獲得する</text>
<text x="12" y="302">ディープラーニング：多層のニューラル</text>
<text x="12" y="322">ネットワークで、特徴量まで学ぶ</text>
<line x1="12" y1="342" x2="308" y2="342" class="l sb w1"/>
<text x="12" y="370" class="tb">② 特徴量を、誰が作るか</text>
<text x="12" y="396" class="tb">従来の機械学習</text>
<rect x="12" y="408" width="56" height="50" class="fs sb" stroke-width="1.5"/>
<text x="40" y="437.5" text-anchor="middle">データ</text>
<line x1="70" y1="433" x2="82" y2="433" class="l sm w1"/>
<polyline points="76,436.3 82,433 76,429.7" class="l sm w1"/>
<rect x="84" y="408" width="90" height="50" class="fwn swn" stroke-width="1.5"/>
<text x="129" y="429" text-anchor="middle">特徴量</text>
<text x="129" y="446" text-anchor="middle">人が設計</text>
<line x1="176" y1="433" x2="188" y2="433" class="l sm w1"/>
<polyline points="182,436.3 188,433 182,429.7" class="l sm w1"/>
<rect x="190" y="408" width="56" height="50" class="fas sa" stroke-width="1.5"/>
<text x="218" y="437.5" text-anchor="middle">学習</text>
<line x1="248" y1="433" x2="256" y2="433" class="l sm w1"/>
<polyline points="251,435.75 256,433 251,430.25" class="l sm w1"/>
<rect x="258" y="408" width="50" height="50" class="fs sb" stroke-width="1.5"/>
<text x="283" y="437.5" text-anchor="middle">結果</text>
<text x="12" y="488" class="tb">ディープラーニング</text>
<rect x="12" y="500" width="56" height="50" class="fs sb" stroke-width="1.5"/>
<text x="40" y="529.5" text-anchor="middle">データ</text>
<line x1="70" y1="525" x2="82" y2="525" class="l sm w1"/>
<polyline points="76,528.3 82,525 76,521.7" class="l sm w1"/>
<rect x="84" y="500" width="162" height="50" class="fas sa" stroke-width="1.5"/>
<text x="165" y="521" text-anchor="middle">特徴量づくりも</text>
<text x="165" y="538" text-anchor="middle">データから学ぶ</text>
<line x1="248" y1="525" x2="256" y2="525" class="l sm w1"/>
<polyline points="251,527.75 256,525 251,522.25" class="l sm w1"/>
<rect x="258" y="500" width="50" height="50" class="fs sb" stroke-width="1.5"/>
<text x="283" y="529.5" text-anchor="middle">結果</text>
<text x="12" y="578" class="tb ta">違いは、特徴量を誰が作るか</text>
</svg>
