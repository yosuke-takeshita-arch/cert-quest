<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 832" role="img" aria-labelledby="fig-g-search-bfs-dfs-t fig-g-search-bfs-dfs-d">
<title id="fig-g-search-bfs-dfs-t">幅優先探索と深さ優先探索：訪問の順番</title>
<desc id="fig-g-search-bfs-dfs-d">同じ探索木（根A、子BとC、BにDとE、CにFとG）をたどる順番の比較。幅優先探索は同じ深さを横に調べてから次の深さへ進み、順番はA、B、C、D、E、F、Gで、先入れ先出しのキューで実装する。深さ優先探索は行き止まりまで進んでから戻り、順番はA、B、D、E、C、F、Gで、今たどっている道筋だけを覚えればよいので再帰やスタックで実装しやすい。幅優先は手数の少ない解を必ず先に見つけるがメモリを多く使う。深さ優先はメモリが少ないが、最初に見つかる解が最短とは限らない。</desc>
<text x="12" y="20" class="tb">① 幅優先探索：横に全部見てから下へ</text>
