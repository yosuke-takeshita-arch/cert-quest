<circle cx="230" cy="122" r="14" class="fs sa"/>
<text x="230" y="126.5" class="tb" text-anchor="middle">C</text>
<circle cx="55" cy="178" r="14" class="fs sa"/>
<text x="55" y="182.5" class="tb" text-anchor="middle">D</text>
