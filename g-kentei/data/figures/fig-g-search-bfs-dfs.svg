<text x="12" y="580" class="tm">点線の矢印＝戻る（Dは行き止まり → Bへ）</text>
<text x="12" y="610" class="tb">実装は再帰（またはスタック）</text>
<text x="12" y="640" class="tm">Dまで進んだとき</text>
<rect x="150" y="622" width="34" height="26" class="fas sa" stroke-width="1.5"/>
<text x="167" y="640" class="tb" text-anchor="middle">A</text>
