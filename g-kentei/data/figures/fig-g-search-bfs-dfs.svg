<text x="12" y="214" class="tm">青い丸の数字＝調べる順。同じ深さを左から右へ</text>
<text x="12" y="244" class="tb">実装はキュー（先入れ先出し）</text>
<text x="12" y="274" class="tm">Aを調べた後</text>
<rect x="150" y="256" width="34" height="26" class="fas sa" stroke-width="1.5"/>
<text x="167" y="274" class="tb" text-anchor="middle">B</text>
