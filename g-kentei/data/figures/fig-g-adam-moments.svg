<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 710" role="img" aria-labelledby="fig-g-adam-moments-t fig-g-adam-moments-d">
<title id="fig-g-adam-moments-t">Adam が見積もる2つの値：勾配の平均（向き）と勾配の2乗の平均（歩幅）</title>
<desc id="fig-g-adam-moments-d">何のための図か：Adamがパラメータごとに見積もる2つの値が、それぞれ何をするかを、2つのパラメータの例で見る（数は説明のための例。簡単のため、古い値を薄める移動平均ではなく、ふつうの平均で計算した）。パラメータPは勾配が+1、+1、+1と同じ向きに続く。パラメータQは勾配が+2、−2、+2と揺れる。①勾配の平均（1次モーメント）は進む向きと勢い。Pは(1＋1＋1)÷3＝1で勢いがつく。Qは(2−2＋2)÷3≒0.67でプラスとマイナスが打ち消し合い、勢いがつきにくい。モーメンタムと同じ考え。②勾配の2乗の平均（2次モーメント）は揺れの大きさで、その平方根で割って歩幅を決める。Pは2乗が1、1、1で平均1、√1＝1で割るので歩幅はそのまま。Qは2乗が4、4、4で平均4、√4＝2で割るので歩幅は半分。2乗するとプラスとマイナスの区別が消えるので、向きには使えない。RMSpropと同じ考え。③一歩＝学習率×勾配の平均÷√勾配の2乗の平均。Pは1÷1＝1、Qは0.67÷2≒0.33。同じ向きに続くPは大きく、揺れるQは小さく進む。④Adamはモーメンタムと RMSprop を合わせたもの。学習率の上限と下限はAdaBoundの工夫で、Adamは持たない。AdaGradは2乗を平均せず足し続ける。</desc>
<text x="12" y="20" class="tb">Adam が覚える2つの値</text>
<text x="12" y="42" class="tm">何のための図か：勾配の平均と、勾配の2乗の</text>
<text x="12" y="60" class="tm">平均が、それぞれ何をするかを例で見る</text>
<text x="12" y="84" class="tm">（簡単のため、ふつうの平均で計算した例）</text>
<text x="12" y="110" class="tb">2つのパラメータの、3回分の勾配</text>
<text x="12" y="134">P：同じ向きに続く</text>
<line x1="170" y1="138" x2="300" y2="138" class="l sm w1"/>
<rect x="180" y="126" width="22" height="12" class="fas sa" stroke-width="1.5"/>
<rect x="220" y="126" width="22" height="12" class="fas sa" stroke-width="1.5"/>
<rect x="260" y="126" width="22" height="12" class="fas sa" stroke-width="1.5"/>
<text x="12" y="200">Q：向きが揺れる</text>
<line x1="170" y1="200" x2="300" y2="200" class="l sm w1"/>
<rect x="180" y="176" width="22" height="24" class="fwn swn" stroke-width="1.5"/>
<rect x="220" y="200" width="22" height="24" class="fwn swn" stroke-width="1.5"/>
<rect x="260" y="176" width="22" height="24" class="fwn swn" stroke-width="1.5"/>
<text x="191" y="120" class="tm" text-anchor="middle">+1</text>
<text x="231" y="120" class="tm" text-anchor="middle">+1</text>
<text x="271" y="120" class="tm" text-anchor="middle">+1</text>
<text x="191" y="170" class="tm" text-anchor="middle">+2</text>
<text x="231" y="238" class="tm" text-anchor="middle">−2</text>
<text x="271" y="170" class="tm" text-anchor="middle">+2</text>
<g transform="translate(0,20)">
<line x1="12" y1="230" x2="308" y2="230" class="l sb w1"/>
<text x="12" y="252" class="tb ta">① 勾配の平均（1次モーメント）＝向き</text>
<text x="12" y="274">P：(1＋1＋1)÷3 ＝ 1 → 勢いがつく</text>
<text x="12" y="296">Q：(2−2＋2)÷3 ≒ 0.67</text>
<text x="12" y="314" class="tm">　＋と−が打ち消し合い、勢いがつきにくい</text>
<text x="12" y="334" class="tm">モーメンタムと同じ考え</text>
<line x1="12" y1="348" x2="308" y2="348" class="l sb w1"/>
<text x="12" y="370" class="tb twn">② 勾配の2乗の平均（2次モーメント）</text>
<text x="12" y="388" class="tb twn">　＝揺れの大きさ → √ で割って歩幅に</text>
<text x="12" y="410">P：2乗 1・1・1、平均 1、√1＝1 で割る</text>
<text x="12" y="428" class="tm">　→ 歩幅はそのまま</text>
<text x="12" y="450">Q：2乗 4・4・4、平均 4、√4＝2 で割る</text>
<text x="12" y="468" class="tm">　→ 歩幅は半分</text>
<text x="12" y="488" class="tm">2乗すると＋−が消えるので、向きには使えない</text>
<text x="12" y="506" class="tm">RMSprop と同じ考え</text>
<line x1="12" y1="520" x2="308" y2="520" class="l sb w1"/>
<text x="12" y="542" class="tb">③ 一歩 ＝ 学習率 × ① ÷ √②</text>
<rect x="12" y="552" width="296" height="48" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="572" class="tb tok" text-anchor="middle">P：1 ÷ 1 ＝ 1（大きく進む）</text>
<text x="160" y="591" class="tb tok" text-anchor="middle">Q：0.67 ÷ 2 ≒ 0.33（小さく進む）</text>
<line x1="12" y1="616" x2="308" y2="616" class="l sb w1"/>
<text x="12" y="638" class="tm">Adam ＝ モーメンタム（①）＋ RMSprop（②）</text>
<text x="12" y="656" class="tm">学習率の上限・下限は AdaBound の工夫</text>
<text x="12" y="674" class="tm">AdaGrad は2乗を平均せず、足し続ける</text>
</g>
</svg>
