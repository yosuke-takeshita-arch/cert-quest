<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 486" role="img" aria-labelledby="fig-g-society50-t fig-g-society50-d">
<title id="fig-g-society50-t">Society 5.0：サイバー空間とフィジカル空間の融合</title>
<desc id="fig-g-society50-d">上にサイバー空間、下にフィジカル空間（現実社会）。社会のあらゆる要素をサイバー空間でデジタルツインとして構築し、再構成したうえで、フィジカル空間に反映して社会を変革する。基盤となる技術は、サイバーセキュリティ、IoTシステム構築、ビッグデータ解析、AI、デバイスなど。Society 5.0は、狩猟社会（1.0）、農耕社会（2.0）、工業社会（3.0）、情報社会（4.0）に続く社会。</desc>
<text x="12" y="20" class="tb">① 2つの空間を行き来する</text>
<rect x="12" y="34" width="296" height="52" class="fas sa" stroke-width="1.5"/>
<text x="160" y="54.5" class="tb" text-anchor="middle">サイバー空間</text>
<text x="160" y="74.5" text-anchor="middle">デジタルツインとして構築・再構成</text>
<line x1="26" y1="148" x2="26" y2="88" class="l sa w2"/>
<polyline points="30.4,96 26,88 21.6,96" class="l sa w2"/>
<text x="38" y="114" class="tb ta">現実の要素を</text>
<text x="38" y="132" class="tb ta">データとして構築</text>
<line x1="294" y1="88" x2="294" y2="148" class="l sok w2"/>
<polyline points="289.6,140 294,148 298.4,140" class="l sok w2"/>
<text x="282" y="114" class="tb tok" text-anchor="end">反映して</text>
<text x="282" y="132" class="tb tok" text-anchor="end">社会を変革</text>
<rect x="12" y="150" width="296" height="52" class="fok sok" stroke-width="1.5"/>
<text x="160" y="170.5" class="tb" text-anchor="middle">フィジカル空間</text>
<text x="160" y="190.5" text-anchor="middle">現実社会</text>
<text x="12" y="228" class="tb">基盤となる技術</text>
<text x="12" y="248">サイバーセキュリティ・IoTシステム構築</text>
<text x="12" y="268">ビッグデータ解析・AI・デバイスなど</text>
<line x1="12" y1="288" x2="308" y2="288" class="l sb w1"/>
<text x="12" y="316" class="tb">② 5番目の社会</text>
<rect x="12" y="328" width="296" height="30" class="fs sb" stroke-width="1"/>
<text x="20" y="348">Society 1.0　狩猟社会</text>
<rect x="12" y="358" width="296" height="30" class="fs sb" stroke-width="1"/>
<text x="20" y="378">Society 2.0　農耕社会</text>
<rect x="12" y="388" width="296" height="30" class="fs sb" stroke-width="1"/>
<text x="20" y="408">Society 3.0　工業社会</text>
<rect x="12" y="418" width="296" height="30" class="fs sb" stroke-width="1"/>
<text x="20" y="438">Society 4.0　情報社会</text>
<rect x="12" y="448" width="296" height="30" class="fa" stroke-width="1"/>
<text x="20" y="468" class="tb ton">Society 5.0　サイバーとフィジカルの融合</text>
</svg>
