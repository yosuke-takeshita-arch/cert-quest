<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 432" role="img" aria-labelledby="fig-g-roc-auc-t fig-g-roc-auc-d">
<title id="fig-g-roc-auc-t">ROC 曲線と AUC</title>
<desc id="fig-g-roc-auc-d">横軸が偽陽性率、縦軸が真陽性率（再現率）のグラフ。しきい値を変えながら点を打って結んだのがROC曲線。左上にふくらむほど良いモデル。対角線はランダムと同じで、曲線の下の面積AUCは0.5。左上の角を通る線は完全なモデルで、AUCは1。曲線上でしきい値を下げると、陽性と判定するものが増えるので、右上へ動く。曲線の下の面積がAUCで、1に近いほど良い。</desc>
<text x="12" y="20" class="tb">真陽性率（再現率）↑</text>
