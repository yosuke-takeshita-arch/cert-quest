<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1046" role="img" aria-labelledby="fig-g-roc-auc-t fig-g-roc-auc-d">
<title id="fig-g-roc-auc-t">ROC 曲線と AUC</title>
<desc id="fig-g-roc-auc-d">上は病気の検査の例。点数が基準（しきい値）以上なら陽性と判定する。基準が厳しい①は病気の人10人中5人を見つけ、健康な人10人中1人を誤検知する。ふつうの②は8人を見つけ3人を誤検知、甘い③は9人を見つけ6人を誤検知する。基準を甘くするほど、見つかる病気も誤検知も増える。下はその3つの基準を点にして結んだROC曲線で、縦軸は病気の人のうち見つけた割合（真陽性率）、横軸は健康な人のうち誤検知した割合（偽陽性率）。点の番号は上の番号と同じで、基準を甘くすると点は右上へ動く。左上の角は見逃しも誤検知もない理想で、AUCは1。点線は当てずっぽう（コイン投げと同じ）で、AUCは0.5。曲線の下の面積がAUCで、1に近いほど良い。いちばん下は名前のもとの英語。ROCは Receiver Operating Characteristic（受信機の動作特性。第二次世界大戦のレーダーの用語の名残）、AUCは Area Under the Curve（曲線の下の面積）の略。</desc>
<text x="12" y="20" class="tb">① 基準（しきい値）を変えると</text>
<text x="12" y="40" class="tm">病気の検査。点数が基準以上なら「陽性」</text>
<rect x="12" y="52" width="296" height="196" class="sb" stroke-width="1"/>
<circle cx="32" cy="74" r="11" class="fs sa" stroke-width="2.5"/>
<text x="32" y="79" class="tb" text-anchor="middle">1</text>
<text x="52" y="76" class="tb">厳しい基準</text>
<text x="52" y="94">病気10人中 5人を発見 ＝ 0.5</text>
<text x="52" y="112">健康10人中 1人を誤検知 ＝ 0.1</text>
<circle cx="32" cy="136" r="11" class="fs sa" stroke-width="2.5"/>
<text x="32" y="141" class="tb" text-anchor="middle">2</text>
<text x="52" y="138" class="tb">ふつうの基準</text>
<text x="52" y="156">病気10人中 8人を発見 ＝ 0.8</text>
<text x="52" y="174">健康10人中 3人を誤検知 ＝ 0.3</text>
<circle cx="32" cy="198" r="11" class="fs sa" stroke-width="2.5"/>
<text x="32" y="203" class="tb" text-anchor="middle">3</text>
<text x="52" y="200" class="tb">甘い基準</text>
<text x="52" y="218">病気10人中 9人を発見 ＝ 0.9</text>
<text x="52" y="236">健康10人中 6人を誤検知 ＝ 0.6</text>
<text x="12" y="272" class="tb tng">基準を甘くするほど</text>
<text x="12" y="292" class="tb tng">見つかる病気も誤検知も増える</text>
<line x1="12" y1="308" x2="308" y2="308" class="l sb w1"/>
<text x="12" y="332" class="tb">② ①の3つを点にして結ぶ（ROC 曲線）</text>
<text x="12" y="352" class="tm">点の番号は①と同じ。赤い矢印は</text>
<text x="12" y="370" class="tm">基準を甘くする向き（右上へ動く）</text>
<text x="12" y="396" class="tb">↑ 病気の人のうち見つけた割合</text>
<polygon points="56,630 56,630 59.67,610.78 63.33,590.48 67,570.19 70.67,550.96 74.33,533.88 78,520 81.67,508.94 85.33,499.49 89,491.47 92.67,484.69 96.33,478.98 100,474.17 103.67,470.06 107.33,466.49 111,463.28 114.67,460.25 118.33,457.21 122,454 125.67,450.86 129.33,448.15 133,445.81 136.67,443.83 140.33,442.16 144,440.76 147.67,439.6 151.33,438.64 155,437.84 158.67,437.18 162.33,436.6 166,436.07 169.67,435.57 173.33,435.04 177,434.46 180.67,433.78 184.33,432.97 188,432 191.67,430.94 195.33,429.91 199,428.9 202.67,427.91 206.33,426.94 210,425.98 213.67,425.05 217.33,424.12 221,423.21 224.67,422.31 228.33,421.42 232,420.54 235.67,419.67 239.33,418.8 243,417.93 246.67,417.06 250.33,416.2 254,415.33 257.67,414.46 261.33,413.58 265,412.7 268.67,411.81 272.33,410.91 276,410 276,630" class="fas"/>
<rect x="56" y="410" width="220" height="220" class="sb" stroke-width="1"/>
<line x1="56" y1="630" x2="276" y2="410" class="l sm w2 dsh"/>
<polyline points="56,630 56,410 276,410" class="l sok w2"/>
<polyline points="56,630 59.67,610.78 63.33,590.48 67,570.19 70.67,550.96 74.33,533.88 78,520 81.67,508.94 85.33,499.49 89,491.47 92.67,484.69 96.33,478.98 100,474.17 103.67,470.06 107.33,466.49 111,463.28 114.67,460.25 118.33,457.21 122,454 125.67,450.86 129.33,448.15 133,445.81 136.67,443.83 140.33,442.16 144,440.76 147.67,439.6 151.33,438.64 155,437.84 158.67,437.18 162.33,436.6 166,436.07 169.67,435.57 173.33,435.04 177,434.46 180.67,433.78 184.33,432.97 188,432 191.67,430.94 195.33,429.91 199,428.9 202.67,427.91 206.33,426.94 210,425.98 213.67,425.05 217.33,424.12 221,423.21 224.67,422.31 228.33,421.42 232,420.54 235.67,419.67 239.33,418.8 243,417.93 246.67,417.06 250.33,416.2 254,415.33 257.67,414.46 261.33,413.58 265,412.7 268.67,411.81 272.33,410.91 276,410" class="l sa w3"/>
<polygon points="105.09,468.00 100.81,482.62 91.55,474.98" class="fs sng" stroke-width="2"/>
<polygon points="162.85,436.28 150.28,444.89 147.95,433.12" class="fs sng" stroke-width="2"/>
<circle cx="78" cy="520" r="11" class="fs sa" stroke-width="2.5"/>
<text x="78" y="525" class="tb" text-anchor="middle">1</text>
<circle cx="122" cy="454" r="11" class="fs sa" stroke-width="2.5"/>
<text x="122" y="459" class="tb" text-anchor="middle">2</text>
<circle cx="188" cy="432" r="11" class="fs sa" stroke-width="2.5"/>
<text x="188" y="437" class="tb" text-anchor="middle">3</text>
<text x="94" y="538" class="tb">厳しい</text>
<text x="138" y="476" class="tb">ふつう</text>
<text x="202" y="456" class="tb">甘い</text>
<text x="63" y="429" class="tb tok">理想</text>
<text x="44" y="415" class="tm" text-anchor="end">1</text>
<text x="44" y="635" class="tm" text-anchor="end">0</text>
<text x="56" y="650" class="tm" text-anchor="middle">0</text>
<text x="276" y="650" class="tm" text-anchor="middle">1</text>
<text x="276" y="672" class="tb" text-anchor="end">健康な人のうち誤検知した割合 →</text>
<text x="12" y="694" class="tm">縦＝真陽性率 TP÷(TP＋FN)</text>
<text x="12" y="712" class="tm">横＝偽陽性率 FP÷(FP＋TN)</text>
<text x="272" y="590" class="tb ta" text-anchor="end">AUC＝青い面積</text>
<line x1="12" y1="743" x2="36" y2="743" class="l sok w2"/>
<text x="44" y="748" class="tb">左上の角＝理想（AUC＝1）</text>
<text x="44" y="766" class="tm">見逃しも誤検知もない</text>
<line x1="12" y1="787" x2="36" y2="787" class="l sm w2 dsh"/>
<text x="44" y="792" class="tb">点線＝当てずっぽう</text>
<text x="44" y="810" class="tm">コイン投げと同じ（AUC＝0.5）</text>
<line x1="12" y1="831" x2="36" y2="831" class="l sa w3"/>
<text x="44" y="836" class="tb">青い線＝この検査</text>
<text x="44" y="854" class="tm">左上ほど、見つけが多く誤検知は少ない</text>
<line x1="12" y1="866" x2="308" y2="866" class="l sb w1"/>
<text x="12" y="890" class="tb ta">AUC＝曲線の下の面積</text>
<text x="12" y="910" class="tb">1に近いほど良く、0.5は当てずっぽう</text>
<line x1="12" y1="926" x2="308" y2="926" class="l sb w1"/>
<text x="12" y="950" class="tb">名前のもとの英語</text>
<text x="12" y="972" class="tb">ROC＝Receiver Operating Characteristic</text>
<text x="12" y="990" class="tm">受信機の動作特性（レーダーの用語の名残）</text>
<text x="12" y="1014" class="tb">AUC＝Area Under the Curve</text>
<text x="12" y="1032" class="tm">曲線の下の面積</text>
</svg>
