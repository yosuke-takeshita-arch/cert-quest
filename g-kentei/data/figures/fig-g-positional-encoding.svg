<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 624" role="img" aria-labelledby="fig-g-positional-encoding-t fig-g-positional-encoding-d">
<title id="fig-g-positional-encoding-t">位置エンコーディング：埋め込みに位置のベクトルを足す</title>
<desc id="fig-g-positional-encoding-d">①足さないと：文A「犬 が 人 を 噛んだ」と文B「人 が 犬 を 噛んだ」で、「犬」のベクトルはどちらも同じ。Self-Attention は語の組を比べるだけで並び順を見ないので、2つの「犬」を区別できない。②位置のベクトルを足す：文Aの「犬」は1番目なので、犬の埋め込みに1番目の位置のベクトルを足す。文Bの「犬」は3番目なので、3番目の位置のベクトルを足す。足した結果の棒の形が違うので、同じ「犬」でも何番目かが分かる。③位置のベクトルの作り方：速く変わる波と、ゆっくり変わる波の値を、何番目かの位置で読み取って並べる。1番目では速い波が高く遅い波は中くらい、3番目では速い波が低く遅い波が高い。この2つの値が②の緑の棒1と棒2の高さになる。元の論文は sin と cos を次元ごとに周期を変えて使う。棒の高さと波は2つに減らした作り例。</desc>
<text x="12" y="20" class="tb">位置エンコーディング：語順を足す</text>
<text x="12" y="46" class="tb">① 足さないと、順番が分からない</text>
<text x="12" y="75">文A</text>
<rect x="48" y="56" width="40" height="26" class="fas sa" stroke-width="2" rx="4"/>
<text x="68" y="74" class="tb ta" text-anchor="middle">犬</text>
<rect x="92" y="56" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="112" y="74" text-anchor="middle">が</text>
<rect x="136" y="56" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="156" y="74" text-anchor="middle">人</text>
<rect x="180" y="56" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="200" y="74" text-anchor="middle">を</text>
<rect x="224" y="56" width="60" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="254" y="74" text-anchor="middle">噛んだ</text>
<text x="12" y="111">文B</text>
<rect x="48" y="92" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="68" y="110" text-anchor="middle">人</text>
<rect x="92" y="92" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="112" y="110" text-anchor="middle">が</text>
<rect x="136" y="92" width="40" height="26" class="fas sa" stroke-width="2" rx="4"/>
<text x="156" y="110" class="tb ta" text-anchor="middle">犬</text>
<rect x="180" y="92" width="40" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="200" y="110" text-anchor="middle">を</text>
<rect x="224" y="92" width="60" height="26" class="fs sb" stroke-width="1" rx="4"/>
<text x="254" y="110" text-anchor="middle">噛んだ</text>
<text x="12" y="142" class="tng">2つの「犬」は同じベクトル。Self-Attention</text>
<text x="12" y="160" class="tng">は語の組を比べるだけで並び順を見ない</text>
<text x="12" y="178" class="tng">→ 2つの「犬」を区別できない</text>
<text x="12" y="212" class="tb">② 位置のベクトルを足す</text>
<text x="42" y="236" class="tm" text-anchor="middle">埋め込み</text>
<text x="130" y="236" class="tm" text-anchor="middle">位置</text>
<text x="218" y="236" class="tm" text-anchor="middle">足した結果</text>
<text x="12" y="256">文Aの「犬」</text>
<rect x="12" y="262" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="26" y="286" width="12" height="16" class="fas sa" stroke-width="1"/>
<rect x="46" y="292" width="12" height="10" class="fas sa" stroke-width="1"/>
<text x="86" y="289" class="tb" text-anchor="middle">＋</text>
<rect x="100" y="262" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="114" y="282" width="12" height="20" class="fok sok" stroke-width="1"/>
<rect x="134" y="287" width="12" height="15" class="fok sok" stroke-width="1"/>
<text x="174" y="289" class="tb" text-anchor="middle">＝</text>
<rect x="188" y="262" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="202" y="286" width="12" height="16" class="fas sa" stroke-width="1"/>
<rect x="202" y="266" width="12" height="20" class="fok sok" stroke-width="1"/>
<rect x="222" y="292" width="12" height="10" class="fas sa" stroke-width="1"/>
<rect x="222" y="277" width="12" height="15" class="fok sok" stroke-width="1"/>
<text x="258" y="289" class="tok">1番目</text>
<text x="12" y="332">文Bの「犬」</text>
<rect x="12" y="338" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="26" y="362" width="12" height="16" class="fas sa" stroke-width="1"/>
<rect x="46" y="368" width="12" height="10" class="fas sa" stroke-width="1"/>
<text x="86" y="365" class="tb" text-anchor="middle">＋</text>
<rect x="100" y="338" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="114" y="372" width="12" height="6" class="fok sok" stroke-width="1"/>
<rect x="134" y="359" width="12" height="19" class="fok sok" stroke-width="1"/>
<text x="174" y="365" class="tb" text-anchor="middle">＝</text>
<rect x="188" y="338" width="60" height="44" class="fs sb" stroke-width="1" rx="4"/>
<rect x="202" y="362" width="12" height="16" class="fas sa" stroke-width="1"/>
<rect x="202" y="356" width="12" height="6" class="fok sok" stroke-width="1"/>
<rect x="222" y="368" width="12" height="10" class="fas sa" stroke-width="1"/>
<rect x="222" y="349" width="12" height="19" class="fok sok" stroke-width="1"/>
<text x="258" y="365" class="tok">3番目</text>
<text x="12" y="406" class="tok">足した結果の形が違う → 何番目かが分かる</text>
<text x="12" y="438" class="tb">③ 位置のベクトルの作り方</text>
<text x="12" y="466" class="tm">速い波</text>
