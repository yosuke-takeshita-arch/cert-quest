<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 438" role="img" aria-labelledby="fig-g-sampling-t fig-g-sampling-d">
<title id="fig-g-sampling-t">無作為抽出と層化抽出</title>
<desc id="fig-g-sampling-d">母集団は3つの地域A、B、Cに分かれた36個の点。Aは16個、Bは12個、Cは8個。左は単純無作為抽出で、全体からくじ引きのように9個を選ぶ。偶然、ある地域に偏ることがあり、この例ではCから1個も選ばれていない。右は層化抽出で、地域（層）ごとに同じ割合（4分の1）で選ぶ。Aから4個、Bから3個、Cから2個の計9個で、どの地域も入る。</desc>
