<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 666" role="img" aria-labelledby="fig-g-mixup-cutmix-t fig-g-mixup-cutmix-d">
<title id="fig-g-mixup-cutmix-t">Mixup と CutMix：2枚の画像を混ぜ、ラベルも同じ割合で混ぜる。Cutout はラベルを混ぜない</title>
<desc id="fig-g-mixup-cutmix-d">例は犬の画像（青）と猫の画像（茶）で、1マスは画素のかたまり、4×4で描く。①Mixup：画像全体を重ね、どの画素も犬0.7・猫0.3の割合で重ねる。画素の値が犬200・猫100なら0.7×200＋0.3×100＝140＋30＝170。ラベルも犬0.7・猫0.3にする。割合は毎回ベータ分布から取り出す（数は例）。②CutMix：犬の画像の右上の4マスに、猫の画像の同じ場所を切って貼る。16マスのうち猫は4マス（4分の1）なので、ラベルは犬12÷16＝0.75・猫4÷16＝0.25と面積の比で混ぜる。各画素はどちらか1枚のままで、半透明の重ね写真にならない。③比べる：Cutout は右上の4マスを塗りつぶすだけで、ラベルは犬1.0のまま。Random Erasing も同じ。貼らないので、その部分の情報は捨てる。</desc>
<text x="12" y="20" class="tb">Mixup と CutMix：2枚を混ぜ、ラベルも混ぜる</text>
<text x="12" y="42" class="tm">例：犬の画像（青）と猫の画像（茶）</text>
<text x="12" y="60" class="tm">1マス＝画素のかたまり。4×4で描く</text>
