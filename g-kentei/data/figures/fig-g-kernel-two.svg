<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 648" role="img" aria-labelledby="fig-g-kernel-two-t fig-g-kernel-two-d">
<title id="fig-g-kernel-two-t">CNN のカーネルと SVM のカーネル関数は別物</title>
<desc id="fig-g-kernel-two-d">名前は同じカーネルでも、指すものが違う。①CNN のカーネルは重みの格子。例：3×3 のカーネル（各行が −1、0、1）を、画像の3×3の部分（各行が 1、1、5）に重ね、重なった9マスを掛けて足す。1行は −1×1＋0×1＋1×5＝4 で、3行で 4×3＝12。この12が特徴マップの1マスになる。カーネルの値は学習で決まる。②SVM のカーネル関数は、2つのデータの似ている度合いを返す関数。例：データ x＝3 と x′＝0.8 をカーネル関数 K(x, x′)＝x×x′＋(x×x′)² に入れると、x×x′＝2.4 から 2.4＋2.4×2.4＝2.4＋5.76＝8.16。写した先の内積（似ている度合い）を、写さずに直接求める。カーネル法の図と同じ例。③並べて比べる。正体：CNN は数の格子、SVM は関数（式）。入るもの：CNN は画像の一部、SVM はデータ2つ。出るもの：CNN は特徴マップの値、SVM は似ている度合い。決め方：CNN は学習で決まる、SVM は式の形を使う人が選ぶ。よくある思い違い『CNN のカーネルも、SVM のカーネル関数と同じく類似度を計算する』は、2つを取り違えている。数は説明のための例。</desc>
<text x="12" y="22" class="tl">2つの『カーネル』は別物</text>
<text x="12" y="42" class="tm">名前は同じでも、指すものが違う</text>
<text x="12" y="68" class="tb">①CNN のカーネル＝重みの格子</text>
<text x="51" y="86" class="tm" text-anchor="middle">カーネル</text>
<text x="159" y="86" class="tm" text-anchor="middle">画像の一部</text>
<rect x="12" y="94" width="78" height="78" class="fas sa" stroke-width="1"/>
<line x1="38" y1="94" x2="38" y2="172" class="l sa w1"/>
<line x1="64" y1="94" x2="64" y2="172" class="l sa w1"/>
<line x1="12" y1="120" x2="90" y2="120" class="l sa w1"/>
<line x1="12" y1="146" x2="90" y2="146" class="l sa w1"/>
<text x="25" y="112" class="ta" text-anchor="middle">−1</text>
<text x="51" y="112" class="ta" text-anchor="middle">0</text>
<text x="77" y="112" class="ta" text-anchor="middle">1</text>
<text x="25" y="138" class="ta" text-anchor="middle">−1</text>
<text x="51" y="138" class="ta" text-anchor="middle">0</text>
<text x="77" y="138" class="ta" text-anchor="middle">1</text>
<text x="25" y="164" class="ta" text-anchor="middle">−1</text>
<text x="51" y="164" class="ta" text-anchor="middle">0</text>
<text x="77" y="164" class="ta" text-anchor="middle">1</text>
<text x="105" y="138" class="tb" text-anchor="middle">×</text>
<rect x="120" y="94" width="78" height="78" class="fs sm" stroke-width="1"/>
<line x1="146" y1="94" x2="146" y2="172" class="l sm w1"/>
<line x1="172" y1="94" x2="172" y2="172" class="l sm w1"/>
<line x1="120" y1="120" x2="198" y2="120" class="l sm w1"/>
<line x1="120" y1="146" x2="198" y2="146" class="l sm w1"/>
<text x="133" y="112" text-anchor="middle">1</text>
<text x="159" y="112" text-anchor="middle">1</text>
<text x="185" y="112" text-anchor="middle">5</text>
<text x="133" y="138" text-anchor="middle">1</text>
<text x="159" y="138" text-anchor="middle">1</text>
<text x="185" y="138" text-anchor="middle">5</text>
<text x="133" y="164" text-anchor="middle">1</text>
<text x="159" y="164" text-anchor="middle">1</text>
<text x="185" y="164" text-anchor="middle">5</text>
<line x1="206" y1="133" x2="232" y2="133" class="l sm w1"/>
<polyline points="227,129 232,133 227,137" class="l sm w1"/>
<rect x="238" y="114" width="62" height="38" rx="4" class="fok sok" stroke-width="1"/>
<text x="269" y="139" class="tb tok" text-anchor="middle">12</text>
<text x="12" y="196">重なった9マスを掛けて足す</text>
<text x="12" y="216">1行：−1×1＋0×1＋1×5＝4、3行で 4×3＝12</text>
<text x="12" y="236" class="tm">12 は特徴マップの1マス。値は学習で決まる</text>
<line x1="12" y1="252" x2="308" y2="252" class="l sb w1"/>
<text x="12" y="276" class="tb">②SVM のカーネル関数＝似ている度合い</text>
<rect x="12" y="290" width="84" height="26" rx="4" class="fwn swn" stroke-width="1"/>
<text x="54" y="308" class="twn" text-anchor="middle">x＝3</text>
<rect x="12" y="324" width="84" height="26" rx="4" class="fwn swn" stroke-width="1"/>
<text x="54" y="342" class="twn" text-anchor="middle">x'＝0.8</text>
<line x1="98" y1="303" x2="118" y2="316" class="l sm w1"/>
<line x1="98" y1="337" x2="118" y2="324" class="l sm w1"/>
<rect x="120" y="304" width="90" height="32" rx="4" class="fwn swn" stroke-width="1"/>
<text x="165" y="325" class="tb twn" text-anchor="middle">K(x, x')</text>
<line x1="212" y1="320" x2="232" y2="320" class="l sm w1"/>
<polyline points="227,316 232,320 227,324" class="l sm w1"/>
<rect x="238" y="301" width="62" height="38" rx="4" class="fok sok" stroke-width="1"/>
<text x="269" y="326" class="tb tok" text-anchor="middle">8.16</text>
<text x="12" y="374">K＝x×x'＋(x×x')²　（x×x'＝2.4）</text>
<text x="12" y="394">＝2.4＋2.4×2.4＝2.4＋5.76＝8.16</text>
<text x="12" y="414" class="tm">写した先の内積（似ている度合い）を、写さず</text>
<text x="12" y="432" class="tm">に直接求める（カーネル法の図と同じ例）</text>
<line x1="12" y1="448" x2="308" y2="448" class="l sb w1"/>
<text x="12" y="472" class="tb">③並べて比べる</text>
<text x="96" y="494" class="tb ta">CNN</text>
<text x="204" y="494" class="tb twn">SVM</text>
<line x1="12" y1="502" x2="308" y2="502" class="l sb w1"/>
<text x="12" y="522" class="tm">正体</text>
<text x="96" y="522">数の格子</text>
<text x="204" y="522">関数（式）</text>
<text x="12" y="544" class="tm">入るもの</text>
<text x="96" y="544">画像の一部</text>
<text x="204" y="544">データ2つ</text>
<text x="12" y="566" class="tm">出るもの</text>
<text x="96" y="566">特徴マップの値</text>
<text x="204" y="566">似ている度合い</text>
<text x="12" y="588" class="tm">決め方</text>
<text x="96" y="588">学習で決まる</text>
<text x="204" y="588">式の形を選ぶ</text>
<text x="12" y="614" class="tb tng">思い違い：『CNN のカーネルも、SVM</text>
<text x="12" y="634" class="tb tng">と同じく類似度を計算する』</text>
</svg>
