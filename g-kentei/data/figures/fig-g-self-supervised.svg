<text x="285" y="49" class="tb ta" text-anchor="middle">正</text>
<text x="12" y="82" class="tm">すべてのデータに、人が付けた正解</text>
<line x1="12" y1="98" x2="308" y2="98" class="l sb w1"/>
<text x="12" y="122" class="tb">半教師あり：少しのラベル＋大量のラベルなし</text>
<rect x="12" y="134" width="24" height="24" class="fas sa" stroke-width="1.5"/>
<text x="24" y="151" class="tb ta" text-anchor="middle">正</text>
<rect x="41" y="134" width="24" height="24" class="fas sa" stroke-width="1.5"/>
<text x="53" y="151" class="tb ta" text-anchor="middle">正</text>
<rect x="70" y="134" width="24" height="24" class="fs sb" stroke-width="1.5"/>
<text x="82" y="151" class="tm" text-anchor="middle">？</text>
<rect x="99" y="134" width="24" height="24" class="fs sb" stroke-width="1.5"/>
<text x="111" y="151" class="tm" text-anchor="middle">？</text>
<rect x="128" y="134" width="24" height="24" class="fs sb" stroke-width="1.5"/>
<text x="140" y="151" class="tm" text-anchor="middle">？</text>
