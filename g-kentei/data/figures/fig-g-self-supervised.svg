<rect x="157" y="32" width="24" height="24" class="fas sa" stroke-width="1.5"/>
<text x="169" y="49" class="tb ta" text-anchor="middle">正</text>
<rect x="186" y="32" width="24" height="24" class="fas sa" stroke-width="1.5"/>
<text x="198" y="49" class="tb ta" text-anchor="middle">正</text>
<rect x="215" y="32" width="24" height="24" class="fas sa" stroke-width="1.5"/>
<text x="227" y="49" class="tb ta" text-anchor="middle">正</text>
<rect x="244" y="32" width="24" height="24" class="fas sa" stroke-width="1.5"/>
