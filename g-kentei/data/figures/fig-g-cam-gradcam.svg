<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 642" role="img" aria-labelledby="fig-g-cam-gradcam-t fig-g-cam-gradcam-d">
<title id="fig-g-cam-gradcam-t">CAM と Grad-CAM：判断の根拠のヒートマップ</title>
<desc id="fig-g-cam-gradcam-d">CAM は、最後の畳み込みの特徴マップを、グローバルアベレージプーリング（GAP）につなぐ構造で、クラスごとの重みを使って特徴マップを重み付けして足し、ヒートマップにする。GAP を持つ構造でないと使えない。Grad-CAM は、対象クラスの予測値の勾配を最後の畳み込み層まで逆向きに流し、その勾配で特徴マップを重み付けして足し、ヒートマップにする。構造の変更や再学習なしで、全結合層を持つ CNN など幅広いモデルに使える。Grad-CAM のヒートマップはクラスを区別できるが粗い。Guided Backpropagation のような画素単位の可視化は細かいがクラスを区別できない。両者を要素ごとの積で組み合わせたのが Guided Grad-CAM。</desc>
<text x="12" y="20" class="tb">CAM：GAP と、学習した重みを使う</text>
<rect x="24" y="36" width="30" height="30" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="41" width="30" height="30" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="46" width="30" height="30" class="fas sa" stroke-width="1.5"/>
<text x="40" y="98" class="tm" text-anchor="middle">特徴マップ</text>
<line x1="68" y1="62" x2="88" y2="62" class="l w2"/>
<polyline points="81,65.85 88,62 81,58.15" class="l w2"/>
<rect x="90" y="44" width="56" height="36" class="fs sb" stroke-width="1.5"/>
<text x="118" y="66.5" class="tb" text-anchor="middle">GAP</text>
<line x1="146" y1="62" x2="166" y2="62" class="l w2"/>
<polyline points="159,65.85 166,62 159,58.15" class="l w2"/>
<rect x="168" y="44" width="140" height="36" class="fas sa" stroke-width="1.5"/>
<text x="238" y="57.5" text-anchor="middle">クラスごとの重み w</text>
<text x="238" y="75.5" text-anchor="middle">（学習した重み）</text>
<text x="12" y="124">特徴マップを w で重み付けして足す→ヒートマップ</text>
<text x="12" y="146" class="tb tng">GAP を使う構造でないと使えない</text>
<line x1="12" y1="164" x2="308" y2="164" class="l sb w1"/>
<text x="12" y="188" class="tb">Grad-CAM：勾配を重みにする</text>
<rect x="12" y="204" width="96" height="36" class="fs sb" stroke-width="1.5"/>
<text x="60" y="217.5" text-anchor="middle">対象クラスの</text>
<text x="60" y="235.5" text-anchor="middle">予測値</text>
<line x1="108" y1="222" x2="128" y2="222" class="l sng w2"/>
<polyline points="121,225.85 128,222 121,218.15" class="l sng w2"/>
<rect x="130" y="204" width="90" height="36" class="fas sa" stroke-width="1.5"/>
<text x="175" y="217.5" text-anchor="middle">最後の</text>
<text x="175" y="235.5" text-anchor="middle">畳み込み層</text>
<text x="156" y="256" class="tb tng">勾配を</text>
<text x="156" y="276" class="tb tng">逆向きに流す</text>
<line x1="220" y1="222" x2="236" y2="222" class="l w2"/>
<polyline points="229,225.85 236,222 229,218.15" class="l w2"/>
<rect x="238" y="204" width="70" height="36" class="fok sok" stroke-width="1.5"/>
<text x="273" y="217.5" text-anchor="middle">勾配で</text>
<text x="273" y="235.5" text-anchor="middle">重み付け</text>
<text x="12" y="306">重み付けして足す → ヒートマップ</text>
<text x="12" y="328" class="tb tok">構造の変更・再学習なしで、</text>
<text x="12" y="350" class="tb tok">全結合層を持つ CNN などにも使える</text>
<line x1="12" y1="368" x2="308" y2="368" class="l sb w1"/>
<text x="12" y="392" class="tb">ヒートマップを画像に重ねる</text>
<rect x="12" y="408" width="120" height="96" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="468" width="120" height="36" class="fm sb" stroke-width="1" fill-opacity="0.4"/>
<rect x="24" y="448" width="28" height="20" class="fs sm" stroke-width="1.5"/>
<circle cx="98" cy="452" r="12" class="fs sm"/>
<circle cx="98" cy="452" r="24" class="fng sng"/>
<circle cx="98" cy="452" r="12" class="fng sng"/>
<text x="144" y="440" class="tb tng">赤い所＝</text>
<text x="144" y="460">判断で重視した領域</text>
<text x="144" y="484" class="tm">背景で判断して</text>
<text x="144" y="502" class="tm">いないかの確認に使う</text>
<line x1="12" y1="524" x2="308" y2="524" class="l sb w1"/>
<text x="12" y="548" class="tb">Guided Grad-CAM</text>
<rect x="12" y="562" width="120" height="40" class="fas sa" stroke-width="1.5"/>
<text x="72" y="577.5" text-anchor="middle">Grad-CAM</text>
<text x="72" y="595.5" text-anchor="middle">粗い・クラスを区別</text>
<text x="142" y="588" class="tb" text-anchor="middle">×</text>
<rect x="152" y="562" width="156" height="40" class="fs sb" stroke-width="1.5"/>
<text x="230" y="577.5" text-anchor="middle">Guided Backprop</text>
<text x="230" y="595.5" text-anchor="middle">細かい・クラスは区別せず</text>
<text x="12" y="630" class="tb">要素ごとの積で、高解像度でクラスを区別</text>
</svg>
