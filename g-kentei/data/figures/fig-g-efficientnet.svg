<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 708" role="img" aria-labelledby="fig-g-efficientnet-t fig-g-efficientnet-d">
<title id="fig-g-efficientnet-t">EfficientNet：深さ・幅・解像度をまとめて拡大する（複合スケーリング）</title>
<desc id="fig-g-efficientnet-d">基準のネットワークを、入力画像の大きさ（解像度）と、層の数（深さ）と、各層の幅（チャネル数）で表す。幅だけ広げる、深さだけ増やす、解像度だけ上げる、のはどれも1方向だけの拡大。EfficientNet は、1つの複合係数で、深さ・幅・解像度の3つを釣り合わせて同時に少しずつ拡大する。Wide ResNet は幅だけを広げる。</desc>
<rect x="40" y="38" width="24" height="24" class="fs sm" stroke-width="1.5"/>
<rect x="34" y="68" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="75" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="82" width="36" height="5" class="fs sm" stroke-width="1"/>
<text x="112" y="64" class="tb">基準のネットワーク</text>
<text x="112" y="86" class="tm">解像度・深さ・幅の3つで表す</text>
<line x1="12" y1="130" x2="308" y2="130" class="l sb w1"/>
<rect x="40" y="162" width="24" height="24" class="fs sm" stroke-width="1.5"/>
<rect x="17" y="192" width="70" height="5" class="fas sa" stroke-width="1"/>
<rect x="17" y="199" width="70" height="5" class="fas sa" stroke-width="1"/>
<rect x="17" y="206" width="70" height="5" class="fas sa" stroke-width="1"/>
<text x="112" y="188" class="tb">幅だけ広げる</text>
<text x="112" y="210" class="tm">（Wide ResNet はこの方向）</text>
<line x1="12" y1="254" x2="308" y2="254" class="l sb w1"/>
<rect x="40" y="286" width="24" height="24" class="fs sm" stroke-width="1.5"/>
<rect x="34" y="316" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="323" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="330" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="337" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="344" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="351" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="358" width="36" height="5" class="fs sm" stroke-width="1"/>
<line x1="76" y1="316" x2="76" y2="363" class="l sng w2"/>
<text x="112" y="312" class="tb">深さだけ増やす</text>
<text x="112" y="334" class="tm">層の数を増やす</text>
<line x1="12" y1="378" x2="308" y2="378" class="l sb w1"/>
<rect x="28" y="386" width="48" height="48" class="fok sok" stroke-width="1.5"/>
<rect x="34" y="440" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="447" width="36" height="5" class="fs sm" stroke-width="1"/>
<rect x="34" y="454" width="36" height="5" class="fs sm" stroke-width="1"/>
<text x="112" y="436" class="tb">解像度だけ上げる</text>
<text x="112" y="458" class="tm">入力画像を大きくする</text>
<line x1="12" y1="502" x2="308" y2="502" class="l sb w1"/>
<rect x="35" y="524" width="34" height="34" class="fok sok" stroke-width="1.5"/>
<rect x="26" y="564" width="52" height="5" class="fas sa" stroke-width="1"/>
<rect x="26" y="571" width="52" height="5" class="fas sa" stroke-width="1"/>
<rect x="26" y="578" width="52" height="5" class="fas sa" stroke-width="1"/>
<rect x="26" y="585" width="52" height="5" class="fas sa" stroke-width="1"/>
<rect x="26" y="592" width="52" height="5" class="fas sa" stroke-width="1"/>
<line x1="84" y1="564" x2="84" y2="597" class="l sng w2"/>
<text x="112" y="560" class="tb ta">3つを1つの係数で同時に</text>
<text x="112" y="582" class="tb ta">（複合スケーリング）</text>
<line x1="12" y1="626" x2="308" y2="626" class="l sb w1"/>
<text x="12" y="650">複合係数 φ をひとつ決めると、</text>
<text x="12" y="672" class="tb">深さ＝α^φ　幅＝β^φ　解像度＝γ^φ</text>
<text x="12" y="696" class="tm">少ない計算量で高精度を出す</text>
</svg>
