<rect x="275" y="126" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="284" y="155" class="tm" text-anchor="middle">C</text>
<line x1="168" y1="138" x2="308" y2="138" class="l sm w1"/>
<text x="12" y="180" class="tb">手2 中 A→B</text>
<line x1="36" y1="198" x2="36" y2="246" class="l sm w2"/>
<rect x="15" y="234" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<text x="36" y="263" class="tm" text-anchor="middle">A</text>
<line x1="82" y1="198" x2="82" y2="246" class="l sm w2"/>
<rect x="67" y="234" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<text x="82" y="263" class="tm" text-anchor="middle">B</text>
<line x1="128" y1="198" x2="128" y2="246" class="l sm w2"/>
<rect x="119" y="234" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="128" y="263" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="246" x2="152" y2="246" class="l sm w1"/>
<text x="168" y="180" class="tb">手3 小 C→B</text>
<line x1="192" y1="198" x2="192" y2="246" class="l sm w2"/>
<rect x="171" y="234" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<text x="192" y="263" class="tm" text-anchor="middle">A</text>
<line x1="238" y1="198" x2="238" y2="246" class="l sm w2"/>
<rect x="223" y="234" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<rect x="229" y="222" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="238" y="263" class="tm" text-anchor="middle">B</text>
<line x1="284" y1="198" x2="284" y2="246" class="l sm w2"/>
<text x="284" y="263" class="tm" text-anchor="middle">C</text>
<line x1="168" y1="246" x2="308" y2="246" class="l sm w1"/>
<text x="12" y="288" class="tb">手4 大 A→C</text>
<line x1="36" y1="306" x2="36" y2="354" class="l sm w2"/>
<text x="36" y="371" class="tm" text-anchor="middle">A</text>
<line x1="82" y1="306" x2="82" y2="354" class="l sm w2"/>
<rect x="67" y="342" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<rect x="73" y="330" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="82" y="371" class="tm" text-anchor="middle">B</text>
<line x1="128" y1="306" x2="128" y2="354" class="l sm w2"/>
<rect x="107" y="342" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<text x="128" y="371" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="354" x2="152" y2="354" class="l sm w1"/>
<text x="168" y="288" class="tb">手5 小 B→A</text>
<line x1="192" y1="306" x2="192" y2="354" class="l sm w2"/>
<rect x="183" y="342" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="192" y="371" class="tm" text-anchor="middle">A</text>
<line x1="238" y1="306" x2="238" y2="354" class="l sm w2"/>
<rect x="223" y="342" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<text x="238" y="371" class="tm" text-anchor="middle">B</text>
<line x1="284" y1="306" x2="284" y2="354" class="l sm w2"/>
<rect x="263" y="342" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<text x="284" y="371" class="tm" text-anchor="middle">C</text>
<line x1="168" y1="354" x2="308" y2="354" class="l sm w1"/>
<text x="12" y="396" class="tb">手6 中 B→C</text>
<line x1="36" y1="414" x2="36" y2="462" class="l sm w2"/>
<rect x="27" y="450" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="36" y="479" class="tm" text-anchor="middle">A</text>
<line x1="82" y1="414" x2="82" y2="462" class="l sm w2"/>
<text x="82" y="479" class="tm" text-anchor="middle">B</text>
<line x1="128" y1="414" x2="128" y2="462" class="l sm w2"/>
<rect x="107" y="450" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="113" y="438" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<text x="128" y="479" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="462" x2="152" y2="462" class="l sm w1"/>
<text x="168" y="396" class="tb">手7 小 A→C</text>
<line x1="192" y1="414" x2="192" y2="462" class="l sm w2"/>
<text x="192" y="479" class="tm" text-anchor="middle">A</text>
<line x1="238" y1="414" x2="238" y2="462" class="l sm w2"/>
<text x="238" y="479" class="tm" text-anchor="middle">B</text>
<line x1="284" y1="414" x2="284" y2="462" class="l sm w2"/>
<rect x="263" y="450" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="269" y="438" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<rect x="275" y="426" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="284" y="479" class="tm" text-anchor="middle">C</text>
<line x1="168" y1="462" x2="308" y2="462" class="l sm w1"/>
<line x1="12" y1="510" x2="308" y2="510" class="l sb w1"/>
<text x="12" y="538" class="tb">② 円盤の枚数と最少手数</text>
<rect x="12" y="554" width="296" height="30" class="fas sb" stroke-width="1"/>
<rect x="12" y="584" width="296" height="30" class="fs sb" stroke-width="1"/>
<text x="20" y="575" class="tb">枚数 n</text>
<text x="20" y="605" class="tb">最少手数</text>
<text x="130" y="575" class="tb" text-anchor="middle">1</text>
<text x="130" y="605" class="tb ta" text-anchor="middle">1</text>
<text x="182" y="575" class="tb" text-anchor="middle">2</text>
<text x="182" y="605" class="tb ta" text-anchor="middle">3</text>
<text x="234" y="575" class="tb" text-anchor="middle">3</text>
<text x="234" y="605" class="tb ta" text-anchor="middle">7</text>
<text x="286" y="575" class="tb" text-anchor="middle">4</text>
<text x="286" y="605" class="tb ta" text-anchor="middle">15</text>
<text x="12" y="640" class="tm">1枚少ない手数を2倍して、1を足す</text>
<line x1="12" y1="654" x2="308" y2="654" class="l sb w1"/>
<text x="12" y="682" class="tb">③ n枚の移し方は3段</text>
<line x1="28" y1="702" x2="28" y2="744" class="l sm w2"/>
<text x="28" y="760" class="tm" text-anchor="middle">A</text>
<line x1="72" y1="702" x2="72" y2="744" class="l sm w2"/>
<text x="72" y="760" class="tm" text-anchor="middle">B</text>
<line x1="116" y1="702" x2="116" y2="744" class="l sm w2"/>
<text x="116" y="760" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="744" x2="130" y2="744" class="l sm w1"/>
<rect x="8" y="732" width="40" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="57" y="728" width="30" height="15" class="fas sa" stroke-width="1.5"/>
<text x="72" y="740" class="tb" text-anchor="middle">n−1</text>
<text x="144" y="716" class="tb">① 上の n−1 枚を</text>
<text x="144" y="736">B へ退避</text>
<text x="12" y="766"></text>
<line x1="28" y1="780" x2="28" y2="822" class="l sm w2"/>
<text x="28" y="838" class="tm" text-anchor="middle">A</text>
<line x1="72" y1="780" x2="72" y2="822" class="l sm w2"/>
<text x="72" y="838" class="tm" text-anchor="middle">B</text>
<line x1="116" y1="780" x2="116" y2="822" class="l sm w2"/>
<text x="116" y="838" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="822" x2="130" y2="822" class="l sm w1"/>
<rect x="96" y="810" width="40" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="57" y="806" width="30" height="15" class="fas sa" stroke-width="1.5"/>
<text x="72" y="818" class="tb" text-anchor="middle">n−1</text>
<text x="144" y="794" class="tb">② 大きい1枚を</text>
<text x="144" y="814">C へ（1手）</text>
<line x1="28" y1="858" x2="28" y2="900" class="l sm w2"/>
<text x="28" y="916" class="tm" text-anchor="middle">A</text>
<line x1="72" y1="858" x2="72" y2="900" class="l sm w2"/>
<text x="72" y="916" class="tm" text-anchor="middle">B</text>
<line x1="116" y1="858" x2="116" y2="900" class="l sm w2"/>
<text x="116" y="916" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="900" x2="130" y2="900" class="l sm w1"/>
<rect x="96" y="888" width="40" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="101" y="872" width="30" height="15" class="fas sa" stroke-width="1.5"/>
<text x="116" y="884" class="tb" text-anchor="middle">n−1</text>
<text x="144" y="872" class="tb">③ n−1 枚を</text>
<text x="144" y="892">B から C へ戻す</text>
<line x1="12" y1="918" x2="308" y2="918" class="l sb w1"/>
<text x="12" y="950" class="tb">手数 T(n)＝T(n−1)＋1＋T(n−1)</text>
<text x="12" y="974" class="tb">　　　　＝2T(n−1)＋1</text>
<text x="12" y="998" class="tb ta">→ 最少手数は 2のn乗−1</text>
</svg>
