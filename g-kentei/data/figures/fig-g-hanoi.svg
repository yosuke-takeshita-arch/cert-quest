<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1010" role="img" aria-labelledby="fig-g-hanoi-t fig-g-hanoi-d">
<title id="fig-g-hanoi-t">ハノイの塔：円盤3枚の7手と、最少手数の考え方</title>
<desc id="fig-g-hanoi-d">3本の柱AとBとCと大きさの違う円盤3枚（小・中・大）。小さい円盤の上に大きい円盤を置かずに、Aの3枚をCへ移す7手：手1 小をAからC、手2 中をAからB、手3 小をCからB、手4 大をAからC、手5 小をBからA、手6 中をBからC、手7 小をAからC。円盤n枚の移し方は、上のn−1枚を別の柱へ退避、いちばん大きい1枚を移す、n−1枚を戻す、の3段。手数Tは T(n)＝2T(n−1)＋1 となり、最少手数は2のn乗−1。n＝1、2、3、4のとき手数は1、3、7、15。</desc>
<text x="12" y="20" class="tb">① 3枚をAからCへ移す7手</text>
<text x="12" y="42" class="tm">小・中・大の円盤。小の上に大は置けない</text>
<text x="12" y="72" class="tb">はじめ</text>
<line x1="36" y1="90" x2="36" y2="138" class="l sm w2"/>
<rect x="15" y="126" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="21" y="114" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<rect x="27" y="102" width="18" height="11" class="fa" stroke-width="1.5"/>
<text x="36" y="155" class="tm" text-anchor="middle">A</text>
<line x1="82" y1="90" x2="82" y2="138" class="l sm w2"/>
<text x="82" y="155" class="tm" text-anchor="middle">B</text>
<line x1="128" y1="90" x2="128" y2="138" class="l sm w2"/>
<text x="128" y="155" class="tm" text-anchor="middle">C</text>
<line x1="12" y1="138" x2="152" y2="138" class="l sm w1"/>
<text x="168" y="72" class="tb">手1 小 A→C</text>
<line x1="192" y1="90" x2="192" y2="138" class="l sm w2"/>
<rect x="171" y="126" width="42" height="11" class="fwn swn" stroke-width="1.5"/>
<rect x="177" y="114" width="30" height="11" class="fas sa" stroke-width="1.5"/>
<text x="192" y="155" class="tm" text-anchor="middle">A</text>
<line x1="238" y1="90" x2="238" y2="138" class="l sm w2"/>
<text x="238" y="155" class="tm" text-anchor="middle">B</text>
