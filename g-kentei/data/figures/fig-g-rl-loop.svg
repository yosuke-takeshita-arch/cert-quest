<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 670" role="img" aria-labelledby="fig-g-rl-loop-t fig-g-rl-loop-d">
<title id="fig-g-rl-loop-t">強化学習の枠組みと、割引累積報酬</title>
<desc id="fig-g-rl-loop-d">上は、エージェントと環境のやり取り。エージェントが環境に行動を送り、環境が次の状態と報酬をエージェントに返す。次の状態は今の状態と行動だけで決まる（マルコフ性）。下は割引。毎回の報酬が同じでも、割引率γを掛けると遠い将来の報酬ほど小さく数える。何歩先かの回数だけγを掛けてから足す。γが0.9の例で、掛ける係数は今が1、1歩先が0.9、2歩先が0.9×0.9＝0.81、3歩先が0.81×0.9＝0.729と小さくなり、報酬10はそれぞれ10、9、8.1、7.29として数える。γが1に近いと遠い将来も重視し、0に近いと目先を重視する。</desc>
<text x="12" y="20" class="tb">① エージェントと環境のやり取り</text>
<rect x="96" y="36" width="128" height="38" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="60" class="tb" text-anchor="middle">エージェント</text>
<rect x="96" y="152" width="128" height="38" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="176" class="tb" text-anchor="middle">環境</text>
<line x1="214" y1="76" x2="214" y2="142.8" class="l sa w2"/>
<polygon points="214,150 209.5,142.8 218.5,142.8" class="fa"/>
<text x="222" y="108" class="tb ta">行動 a</text>
<line x1="106" y1="150" x2="106" y2="83.2" class="l sok w2"/>
<polygon points="106,76 110.5,83.2 101.5,83.2" class="ft"/>
<text x="12" y="106" class="tb tok">状態 s′</text>
<text x="12" y="128" class="tb tok">報酬 r</text>
<text x="12" y="218">マルコフ性：次の状態は、今の状態と</text>
<text x="12" y="238">行動だけで決まる（過去は関係しない）</text>
<line x1="12" y1="256" x2="308" y2="256" class="l sb w1"/>
<text x="12" y="280" class="tb">② 将来の報酬を割り引く（γ＝0.9の例）</text>
<text x="12" y="306" class="tm">毎回もらえる報酬（すべて10）</text>
<rect x="34" y="320" width="44" height="40" class="fas sa" stroke-width="1.5"/>
<text x="56" y="345" class="tb" text-anchor="middle">10</text>
<rect x="100" y="320" width="44" height="40" class="fas sa" stroke-width="1.5"/>
<text x="122" y="345" class="tb" text-anchor="middle">10</text>
<rect x="166" y="320" width="44" height="40" class="fas sa" stroke-width="1.5"/>
<text x="188" y="345" class="tb" text-anchor="middle">10</text>
<rect x="232" y="320" width="44" height="40" class="fas sa" stroke-width="1.5"/>
<text x="254" y="345" class="tb" text-anchor="middle">10</text>
<text x="56" y="378" class="tm" text-anchor="middle">今</text>
<text x="122" y="378" class="tm" text-anchor="middle">1歩先</text>
<text x="188" y="378" class="tm" text-anchor="middle">2歩先</text>
<text x="254" y="378" class="tm" text-anchor="middle">3歩先</text>
<text x="12" y="400" class="tm">何歩先かの回数だけ γ を掛けてから足す</text>
<rect x="34" y="428" width="44" height="40" class="fok sok" stroke-width="1.5"/>
<text x="56" y="422" class="tb tok" text-anchor="middle">10.0</text>
<text x="56" y="488" class="tm" text-anchor="middle">×1</text>
<rect x="100" y="432" width="44" height="36" class="fok sok" stroke-width="1.5"/>
<text x="122" y="426" class="tb tok" text-anchor="middle">9.0</text>
<text x="122" y="488" class="tm" text-anchor="middle">×0.9</text>
<rect x="166" y="435.6" width="44" height="32.4" class="fok sok" stroke-width="1.5"/>
<text x="188" y="429.6" class="tb tok" text-anchor="middle">8.1</text>
<text x="188" y="488" class="tm" text-anchor="middle">×0.81</text>
<rect x="232" y="438.84" width="44" height="29.16" class="fok sok" stroke-width="1.5"/>
<text x="254" y="432.84" class="tb tok" text-anchor="middle">7.29</text>
<text x="254" y="488" class="tm" text-anchor="middle">×0.729</text>
<text x="188" y="506" class="tm" text-anchor="middle">0.9×0.9</text>
<text x="254" y="506" class="tm" text-anchor="middle">0.81×0.9</text>
<text x="12" y="536" class="tb">遠い報酬ほど小さく数える</text>
<text x="12" y="556">今の値打ち ＝ 報酬 ×</text>
<text x="12" y="574">　（γ を何歩先かの回数だけ掛けた数）</text>
<text x="12" y="594" class="ta">例：2歩先 0.9×0.9＝0.81、10×0.81＝8.1</text>
<text x="12" y="612" class="tm">記号 γ⁰ γ¹ γ² γ³ の右上の数＝掛ける回数</text>
<text x="12" y="638">γ が 1 に近い：遠い将来も重視</text>
<text x="12" y="658">γ が 0 に近い：目先を重視</text>
</svg>
