<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1152" role="img" aria-labelledby="fig-g-alexnet-t fig-g-alexnet-d">
<title id="fig-g-alexnet-t">AlexNet：8層のCNNを2つのGPUに分けて学習し、ReLUとドロップアウトで速く・過学習少なく</title>
<desc id="fig-g-alexnet-d">AlexNetは画素を入れると8層を通って1000クラスのどれかを答えるCNN。①8層の中身：入力224×224×3の画素、畳み込み1（11×11のフィルタ96枚を48枚ずつ）、畳み込み2（5×5を256枚、128枚ずつ）、畳み込み3（3×3を384枚、192枚ずつ）、畳み込み4（3×3を384枚、192枚ずつ）、畳み込み5（3×3を256枚、128枚ずつ）、全結合6と全結合7（4096個を2048個ずつ、ドロップアウトつき）、全結合8（1000クラスの確率）。各層を2つのGPUに半分ずつ載せ、GPUどうしがやり取りするのは畳み込み3と全結合の層だけ。どの層の出力にもReLUを通す。②ReLUは負なら0、正ならそのまま。入力−2、0.5、3は0、0.5、3になる。原論文の4層の例ではtanhの6倍の速さで誤差25%に届いた。③重みは約6000万個で、GPU1つのメモリ3GBに収まらないので2つに分けた。④ドロップアウトは学習中に各ニューロンを確率0.5で休ませる。2048個なら毎回およそ1024個が休み、過学習が減る。⑤ILSVRC 2012のtop-5誤り率（上位5つの答えに正解が無い割合）はAlexNetが15.3%、2位が26.2%。100枚なら外すのは約15枚と約26枚で、差は10.9ポイント。</desc>
<text x="12" y="20" class="tb">AlexNet：8層の CNN を2つの GPU で学ぶ</text>
<text x="12" y="42" class="tm">画素を入れると、8層を通って 1000 クラスの</text>
<text x="12" y="60" class="tm">どれかを答える（2012年の画像分類の大会で優勝）</text>
<text x="12" y="88" class="tb">① 8層の中身（上から下へ流れる）</text>
