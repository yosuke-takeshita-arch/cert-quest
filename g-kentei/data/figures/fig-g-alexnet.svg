<text x="12" y="500" class="tb">全結合8</text>
<text x="12" y="517" class="tm">答え</text>
<rect x="110" y="488" width="194" height="26" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="207" y="506" text-anchor="middle">1000 クラスの確率</text>
<line x1="156" y1="468" x2="172.0" y2="484.0" class="l sa w1"/>
<polygon points="176,488 169.6,486.5 174.5,481.6" class="fa"/>
<line x1="258" y1="468" x2="242.0" y2="484.0" class="l sa w1"/>
<polygon points="238,488 239.5,481.6 244.4,486.5" class="fa"/>
<text x="12" y="546" class="tm">数＝その層のフィルタ（畳み込み）やニューロン</text>
<text x="12" y="564" class="tm">　（全結合）の数。2つの GPU に半分ずつ載せた</text>
<text x="12" y="584" class="ta">斜めの矢印（青）＝GPU どうしがやり取りする所</text>
<text x="12" y="602" class="tm">　（畳み込み3と全結合の層だけ。ほかは自分の側だけ）</text>
<text x="12" y="622" class="tm">どの層の出力にも ReLU を通す</text>
<line x1="12" y1="638" x2="308" y2="638" class="l sb w1"/>
<text x="12" y="662" class="tb">② 工夫1：ReLU（負なら0、正ならそのまま）</text>
<text x="12" y="686" class="tm">入力</text>
<text x="150" y="686" text-anchor="middle">−2</text>
<text x="210" y="686" text-anchor="middle">0.5</text>
<text x="270" y="686" text-anchor="middle">3</text>
<text x="12" y="708" class="tm">ReLU の出力</text>
<text x="150" y="708" class="tb ta" text-anchor="middle">0</text>
<text x="210" y="708" class="tb ta" text-anchor="middle">0.5</text>
<text x="270" y="708" class="tb ta" text-anchor="middle">3</text>
<text x="12" y="732" class="tm">計算が軽く、正の側で勾配（重みを直す量）が</text>
<text x="12" y="750" class="tm">小さくならない。原論文の4層の例では、tanh の</text>
<text x="12" y="768" class="tm">6倍の速さで目標の誤差 25% に届いた</text>
<line x1="12" y1="784" x2="308" y2="784" class="l sb w1"/>
<text x="12" y="808" class="tb">③ 工夫2：2つの GPU に分ける</text>
<text x="12" y="828" class="tm">重みは約 6000 万個。GPU 1つのメモリ（3GB）に</text>
<text x="12" y="846" class="tm">収まらないので、各層を半分ずつ2つに載せた</text>
<line x1="12" y1="862" x2="308" y2="862" class="l sb w1"/>
<text x="12" y="886" class="tng tb">④ 工夫3：ドロップアウト（赤の2層）</text>
<text x="12" y="906" class="tm">学習中、各ニューロンを確率 0.5 で休ませる</text>
<text x="12" y="924" class="tm">例：2048 個のうち、毎回およそ 1024 個が休む</text>
<text x="12" y="942" class="tm">→ 特定の仲間に頼れず、過学習が減る</text>
<line x1="12" y1="958" x2="308" y2="958" class="l sb w1"/>
<text x="12" y="982" class="tb">⑤ 結果：ILSVRC 2012（1000 クラスの分類）</text>
<text x="12" y="1002" class="tm">top-5 誤り率＝上位5つの答えに正解が無い割合</text>
<text x="12" y="1030" class="tb tok">AlexNet</text>
<rect x="80" y="1016" width="122.4" height="20" class="fok sok" stroke-width="1.5"/>
<text x="208.4" y="1031" class="tb tok">15.3%</text>
<text x="12" y="1068" class="tb">2位</text>
<rect x="80" y="1054" width="209.6" height="20" class="fs sb" stroke-width="1.5"/>
<text x="283.6" y="1069" class="tb" text-anchor="end">26.2%</text>
<text x="12" y="1098" class="tm">100 枚なら外すのは約 15 枚と約 26 枚</text>
<text x="12" y="1116" class="tb ta">差は 26.2−15.3＝10.9 ポイント</text>
<text x="12" y="1136" class="tm">→ 人が作った特徴に頼る方法を大きく上回った</text>
</svg>
