<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 438" role="img" aria-labelledby="fig-g-patent-vs-trade-secret-t fig-g-patent-vs-trade-secret-d">
<title id="fig-g-patent-vs-trade-secret-t">特許と営業秘密：公開するか、どれだけ守れるか</title>
<desc id="fig-g-patent-vs-trade-secret-d">何のための図か：AIの学習データの前処理のノウハウを守る2つの方法、特許と営業秘密を比べる。特許：出願から1年6月で出願公開され、中身が世の中に知られる。権利は原則として出願から20年で終わり、その後は誰でも使える。特許庁の審査を経て登録されると独占権が生まれる。営業秘密：公開しない。秘密として管理する・事業に役立つ・知られていないの3つの要件を満たす限り、期限なく守られる。登録は要らない。盗まれたり不正に持ち出されたりすれば止められるが、他社が自分で同じノウハウを開発した場合は止められない。結論：他社に知られずに長く守りたいなら、営業秘密としての管理が合いやすい。</desc>
<text x="12" y="20" class="tb">特許と営業秘密を比べる</text>
<text x="12" y="42" class="tm">前処理のノウハウを守りたい場合</text>
<text x="125" y="62" class="tb" text-anchor="middle">特許</text>
<text x="249" y="62" class="tb ta" text-anchor="middle">営業秘密</text>
<text x="12" y="90" class="tb">中身</text>
<rect x="66" y="70" width="118" height="48" class="fs sb" stroke-width="1.5" rx="5"/>
<rect x="190" y="70" width="118" height="48" class="fok sok" stroke-width="1.5" rx="5"/>
<text x="74" y="90">出願から1年6月で</text>
<text x="74" y="108">公開される</text>
<text x="198" y="90">公開しない</text>
<text x="12" y="146" class="tb">期間</text>
<rect x="66" y="126" width="118" height="48" class="fs sb" stroke-width="1.5" rx="5"/>
<rect x="190" y="126" width="118" height="48" class="fok sok" stroke-width="1.5" rx="5"/>
<text x="74" y="146">原則、出願から</text>
<text x="74" y="164">20年で終わる</text>
<text x="198" y="146">秘密である限り</text>
<text x="198" y="164">期限なし</text>
<text x="12" y="202" class="tb">手続</text>
<rect x="66" y="182" width="118" height="48" class="fs sb" stroke-width="1.5" rx="5"/>
<rect x="190" y="182" width="118" height="48" class="fok sok" stroke-width="1.5" rx="5"/>
<text x="74" y="202">特許庁の審査を</text>
<text x="74" y="220">経て登録</text>
<text x="198" y="202">登録は要らない</text>
<text x="198" y="220">（3つの要件）</text>
<text x="12" y="258" class="tb">守り方</text>
<rect x="66" y="238" width="118" height="84" class="fs sb" stroke-width="1.5" rx="5"/>
<rect x="190" y="238" width="118" height="84" class="fok sok" stroke-width="1.5" rx="5"/>
<text x="74" y="258">登録で独占権が</text>
<text x="74" y="276">生まれる</text>
<text x="198" y="258">盗まれたら止める</text>
<text x="198" y="276">他社が自分で</text>
<text x="198" y="294">開発したら</text>
<text x="198" y="312" class="tng">止められない</text>
<text x="12" y="348" class="tm">3つの要件：秘密として管理・事業に役立つ・</text>
<text x="12" y="366" class="tm">知られていない（不正競争防止法）</text>
<rect x="12" y="374" width="296" height="50" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="394" class="tb tok">知られずに長く守るなら、営業秘密が</text>
<text x="24" y="412" class="tok">合いやすい（ただし独自開発は止められない）</text>
</svg>
