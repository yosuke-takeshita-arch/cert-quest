<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 586" role="img" aria-labelledby="fig-g-logistic-regression-t fig-g-logistic-regression-d">
<title id="fig-g-logistic-regression-t">ロジスティック回帰：重み付き和からシグモイドで確率にして分類する</title>
<desc id="fig-g-logistic-regression-d">入力x1、x2に重みをかけて足し、切片を足した値zを求める。ことばの式は z＝重み1×入力1＋重み2×入力2＋切片。例として重み0.5・入力2、重み1・入力1.5、切片−0.5なら、0.5×2＋1×1.5＋（−0.5）＝1＋1.5−0.5＝2。zをシグモイド関数に通すと0から1の確率pになる。zが0のときpは0.5、例のzが2のときpは約0.88で、zが大きいほど1に、小さいほど0に近づく。pがしきい値0.5以上なら陽性、未満なら陰性と判定する。名前は回帰だが、使い道は分類である。</desc>
<text x="12" y="20" class="tb">① 重み付き和 z を出す</text>
<rect x="12" y="32" width="44" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="34" y="52" class="tb" text-anchor="middle">x1</text>
<rect x="62" y="32" width="44" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="84" y="52" class="tb" text-anchor="middle">x2</text>
<line x1="110" y1="47" x2="123.6" y2="47" class="l sm w2"/>
<polygon points="130,47 123.6,51 123.6,43" class="fm"/>
<rect x="134" y="32" width="174" height="30" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="221" y="52" class="tb" text-anchor="middle">重み付き和 z</text>
<text x="12" y="86">入力ごとに重みを掛けて足し、切片を足す</text>
<text x="12" y="104" class="tb">z ＝ 重み1×入力1 ＋ 重み2×入力2 ＋ 切片</text>
<text x="12" y="124" class="ta">例：0.5×2 ＋ 1×1.5 ＋（−0.5）</text>
<text x="12" y="142" class="ta">　＝ 1 ＋ 1.5 − 0.5 ＝ 2</text>
<text x="12" y="160" class="tm">記号：z＝w1x1＋w2x2＋b（w＝重み、b＝切片）</text>
<g transform="translate(0,108)">
<line x1="160" y1="66" x2="160" y2="83.6" class="l sm w2"/>
<polygon points="160,90 156,83.6 164,83.6" class="fm"/>
<text x="12" y="112" class="tb">② シグモイドで確率 p にする</text>
<rect x="40" y="130" width="256" height="150" class="sb" stroke-width="1"/>
<rect x="168" y="130" width="128" height="150" class="fok"/>
<rect x="40" y="130" width="128" height="150" class="fs"/>
<line x1="40" y1="206" x2="296" y2="206" class="l sm w1 dsh"/>
<line x1="168" y1="130" x2="168" y2="280" class="l sm w1 dsh"/>
<polyline points="40,275.65 42.13,275.62 44.27,275.58 46.4,275.53 48.53,275.48 50.67,275.43 52.8,275.37 54.93,275.3 57.07,275.23 59.2,275.15 61.33,275.06 63.47,274.97 65.6,274.86 67.73,274.74 69.87,274.61 72,274.46 74.13,274.3 76.27,274.13 78.4,273.93 80.53,273.72 82.67,273.48 84.8,273.22 86.93,272.94 89.07,272.62 91.2,272.28 93.33,271.9 95.47,271.48 97.6,271.02 99.73,270.52 101.87,269.96 104,269.36 106.13,268.7 108.27,267.97 110.4,267.18 112.53,266.32 114.67,265.38 116.8,264.36 118.93,263.24 121.07,262.03 123.2,260.73 125.33,259.31 127.47,257.78 129.6,256.14 131.73,254.37 133.87,252.48 136,250.46 138.13,248.31 140.27,246.02 142.4,243.59 144.53,241.04 146.67,238.35 148.8,235.53 150.93,232.6 153.07,229.55 155.2,226.39 157.33,223.14 159.47,219.82 161.6,216.42 163.73,212.98 165.87,209.5 168,206 170.13,202.5 172.27,199.02 174.4,195.58 176.53,192.18 178.67,188.86 180.8,185.61 182.93,182.45 185.07,179.4 187.2,176.47 189.33,173.65 191.47,170.96 193.6,168.41 195.73,165.98 197.87,163.69 200,161.54 202.13,159.52 204.27,157.63 206.4,155.86 208.53,154.22 210.67,152.69 212.8,151.27 214.93,149.97 217.07,148.76 219.2,147.64 221.33,146.62 223.47,145.68 225.6,144.82 227.73,144.03 229.87,143.3 232,142.64 234.13,142.04 236.27,141.48 238.4,140.98 240.53,140.52 242.67,140.1 244.8,139.72 246.93,139.38 249.07,139.06 251.2,138.78 253.33,138.52 255.47,138.28 257.6,138.07 259.73,137.87 261.87,137.7 264,137.54 266.13,137.39 268.27,137.26 270.4,137.14 272.53,137.03 274.67,136.94 276.8,136.85 278.93,136.77 281.07,136.7 283.2,136.63 285.33,136.57 287.47,136.52 289.6,136.47 291.73,136.42 293.87,136.38 296,136.35" class="l sa w3"/>
<circle cx="168" cy="206" r="5" class="fs sng"/>
<text x="35" y="140" class="tm" text-anchor="end">1</text>
<text x="35" y="210" class="tm" text-anchor="end">0.5</text>
<text x="35" y="280" class="tm" text-anchor="end">0</text>
<text x="296" y="300" class="tm" text-anchor="end">z →</text>
<text x="168" y="300" class="tm" text-anchor="middle">0</text>
<text x="48" y="150" class="tb">陰性側</text>
<text x="288" y="150" class="tb tok" text-anchor="end">陽性側</text>
<text x="14" y="142" class="tb">p</text>
<text x="12" y="322" class="tm">z＝0 のとき p＝0.5、例の z＝2 なら p≒0.88</text>
<line x1="160" y1="334" x2="160" y2="347.6" class="l sm w2"/>
<polygon points="160,354 156,347.6 164,347.6" class="fm"/>
<text x="12" y="378" class="tb">③ しきい値 0.5 で分ける</text>
<rect x="12" y="390" width="140" height="34" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="82" y="412" class="tb tok" text-anchor="middle">p ≥ 0.5 → 陽性</text>
<rect x="168" y="390" width="140" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="238" y="412" class="tb" text-anchor="middle">p ＜ 0.5 → 陰性</text>
<line x1="12" y1="442" x2="308" y2="442" class="l sb w1"/>
<text x="12" y="466" class="tb">名前は「回帰」、使い道は分類</text>
</g>
</svg>
