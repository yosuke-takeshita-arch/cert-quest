<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-g-basic-tensor-t fig-g-basic-tensor-d">
<title id="fig-g-basic-tensor-t">スカラー・ベクトル・行列・テンソル</title>
<desc id="fig-g-basic-tensor-d">数の並べ方を、並べる向きの数で4つに分けた図。並べる向きが0のスカラーは数1個だけ（例 7）。向きが1つのベクトルは横1列（例［3, 2, 5］）。向きが2つの行列は縦と横の表（例 3行3列）。向きが3つのテンソルは表を重ねた束で、カラー画像なら縦の画素×横の画素×色3枚（赤・緑・青）。テンソルは、これらすべてをまとめて呼ぶ名前でもあり、スカラーは0階、ベクトルは1階、行列は2階、カラー画像は3階のテンソル。32枚の画像をまとめて扱うと、枚数×縦×横×色の4階のテンソルになる。数は説明のための例。</desc>
<text x="12" y="22" class="tl">数の並べ方は4段階</text>
<text x="12" y="44" class="tm">並べる向きの数（階）で呼び名が変わる</text>
<rect x="24" y="64" width="28" height="28" class="fas sa" stroke-width="1.5"/>
<text x="38" y="83" class="tb" text-anchor="middle">7</text>
<text x="76" y="76" class="tb">スカラー（0階）</text>
<text x="76" y="96" class="tm">数1個だけ。向きは無い</text>
<line x1="12" y1="112" x2="308" y2="112" class="l sb w1"/>
<rect x="24" y="128" width="84" height="28" class="fas sa" stroke-width="1.5"/>
<line x1="52" y1="128" x2="52" y2="156" class="l sa w1"/>
<line x1="80" y1="128" x2="80" y2="156" class="l sa w1"/>
<text x="38" y="147" class="tb" text-anchor="middle">3</text>
<text x="66" y="147" class="tb" text-anchor="middle">2</text>
<text x="94" y="147" class="tb" text-anchor="middle">5</text>
<text x="124" y="140" class="tb">ベクトル（1階）</text>
<text x="124" y="160" class="tm">横1列に並べる</text>
<line x1="12" y1="176" x2="308" y2="176" class="l sb w1"/>
<rect x="24" y="192" width="84" height="84" class="fas sa" stroke-width="1.5"/>
<line x1="52" y1="192" x2="52" y2="276" class="l sa w1"/>
<line x1="80" y1="192" x2="80" y2="276" class="l sa w1"/>
<line x1="24" y1="220" x2="108" y2="220" class="l sa w1"/>
<line x1="24" y1="248" x2="108" y2="248" class="l sa w1"/>
<text x="124" y="222" class="tb">行列（2階）</text>
<text x="124" y="242" class="tm">縦と横の表に並べる</text>
<text x="124" y="262" class="tm">例：白黒画像（縦×横）</text>
<line x1="12" y1="292" x2="308" y2="292" class="l sb w1"/>
<rect x="48" y="308" width="72" height="72" class="fs sm" stroke-width="1.5"/>
<rect x="36" y="320" width="72" height="72" class="fs sm" stroke-width="1.5"/>
<rect x="24" y="332" width="72" height="72" class="fas sa" stroke-width="1.5"/>
<text x="60" y="373" class="tb" text-anchor="middle">赤</text>
<text x="136" y="340" class="tb">テンソル（3階）</text>
<text x="136" y="360" class="tm">表を重ねた束（赤・緑・青）</text>
<text x="136" y="380" class="tm">例：カラー画像</text>
<text x="136" y="400" class="tm">（縦×横×色3枚）</text>
<line x1="12" y1="420" x2="308" y2="420" class="l sb w1"/>
<text x="12" y="444">テンソルは、これら全部をまとめた呼び名</text>
<text x="12" y="466">でもある（スカラー＝0階のテンソル）</text>
<text x="12" y="496" class="tb ta">32枚の画像をまとめる → 4階</text>
<text x="12" y="516" class="tm">（枚数×縦×横×色）</text>
</svg>
