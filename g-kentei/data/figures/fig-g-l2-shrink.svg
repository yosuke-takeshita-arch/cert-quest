<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" role="img" aria-labelledby="fig-g-l2-shrink-t fig-g-l2-shrink-d">
<title id="fig-g-l2-shrink-t">L2 正則化：縮める力は重みに比例する</title>
<desc id="fig-g-l2-shrink-d">重みが3と0.1の2つある例。L2の罰則は重みの2乗で、w掛けるwの傾きは2掛けるwなので、罰則が重みを0のほうへ押す力は2掛けるw。重み3には2掛ける3で6、重み0.1には2掛ける0.1で0.2の力がかかる。矢印の長さが力を表し、L1の図と同じ縮尺。重み3の矢印は長く、0.1の矢印はほとんど無い。次に、1回で縮む量を0.05掛ける縮める力とした例で、くり返し縮める。重み3は1回目に0.3減って2.70、続けて2.43、2.19と大きく縮む。重み0.1は1回目に0.01減って0.090、続けて0.081、0.073とほとんど動かない。力はそのときの重みで計算し直すので、毎回いまの重みの1割ずつ減り、0に近づくほど遅くなって、0には着かない。結果、重み全体がなめらかに小さくなる（0にはなりにくい）。大きすぎる重みほど強く抑えられる。</desc>
<text x="12" y="20" class="tb">L2：縮める力は重みに比例する</text>
<text x="12" y="46" class="tb">① 罰則が重みを 0 のほうへ押す力（例）</text>
<text x="12" y="66" class="tm">罰則は w×w。傾きは 2×w → 力は 2×w</text>
<text x="296" y="88" class="tb ta" text-anchor="end">縮める力 2×3＝6</text>
<line x1="296" y1="98" x2="122" y2="98" class="l sa w2"/>
<polygon points="116,98 123,93 123,103" class="fa"/>
<text x="12" y="103" class="tb">重み 3</text>
<text x="296" y="126" class="tb ta" text-anchor="end">縮める力 2×0.1＝0.2（ほぼ押さない）</text>
<polygon points="290,136 297,131 297,141" class="fa"/>
<text x="12" y="141" class="tb">重み 0.1</text>
<text x="12" y="166" class="tm">矢印の長さ＝力（L1 の図と同じ縮尺）</text>
<line x1="12" y1="180" x2="308" y2="180" class="l sb w1"/>
<text x="12" y="204" class="tb">② くり返し縮める（例）</text>
<text x="12" y="224" class="tm">1回で縮む量＝0.05×縮める力</text>
<text x="12" y="244" class="tm">3 は 0.05×6＝0.3、0.1 は 0.05×0.2＝0.01</text>
<text x="145" y="272" class="tb" text-anchor="middle">重み 3</text>
<text x="255" y="272" class="tb" text-anchor="middle">重み 0.1</text>
<line x1="12" y1="280" x2="308" y2="280" class="l sb w1"/>
<text x="12" y="300" class="tm">最初</text>
<text x="145" y="300" text-anchor="middle">3</text>
<text x="255" y="300" text-anchor="middle">0.1</text>
<text x="12" y="326" class="tm">1回後</text>
<text x="145" y="326" text-anchor="middle">2.70（−0.30）</text>
<text x="255" y="326" text-anchor="middle">0.090（−0.010）</text>
<text x="12" y="352" class="tm">2回後</text>
<text x="145" y="352" text-anchor="middle">2.43（−0.27）</text>
<text x="255" y="352" text-anchor="middle">0.081（−0.009）</text>
<text x="12" y="378" class="tm">3回後</text>
<text x="145" y="378" text-anchor="middle">2.19（−0.24）</text>
<rect x="198" y="362" width="110" height="22" class="fwn swn" stroke-width="1.5" rx="4"/>
<text x="253" y="378" class="tb twn" text-anchor="middle">0.073（0 でない）</text>
<text x="12" y="408" class="tm">力はそのときの重みで計算し直す（2.7 なら 5.4）</text>
<text x="12" y="428" class="tm">→ 毎回いまの重みの1割ずつ減り、0 に近づく</text>
<text x="12" y="448" class="tm">ほど遅くなる。0.1 は 0 に着かない</text>
<rect x="12" y="460" width="296" height="48" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="480" class="tb ta" text-anchor="middle">③ 重み全体がなめらかに小さくなる</text>
<text x="160" y="499" class="tb ta" text-anchor="middle">（0 にはなりにくい）</text>
<text x="12" y="524" class="tm">実際は誤差を減らす力と釣り合う所で止まる。</text>
<text x="12" y="542" class="tm">大きすぎる重みほど強く抑えられる</text>
</svg>
