<text x="274" y="556" class="tb tok" text-anchor="middle">LSTM</text>
<line x1="76" y1="551" x2="82" y2="551" class="l w1"/>
<polygon points="88,551 82,547.5 82,554.5" class="ft"/>
<line x1="152" y1="551" x2="158" y2="551" class="l w1"/>
<polygon points="164,551 158,547.5 158,554.5" class="ft"/>
<line x1="228" y1="551" x2="234" y2="551" class="l w1"/>
<polygon points="240,551 234,547.5 234,554.5" class="ft"/>
<text x="120" y="526" class="tb" text-anchor="middle">犬が</text>
<text x="196" y="526" class="tb" text-anchor="middle">走る</text>
<text x="274" y="526" class="tb" text-anchor="middle">〈終了〉</text>
<text x="120" y="586" class="tm" text-anchor="middle">〈開始〉</text>
<text x="196" y="586" class="tm" text-anchor="middle">犬が</text>
<text x="274" y="586" class="tm" text-anchor="middle">走る</text>
<text x="12" y="610">箱の上の行：その回に LSTM が出す語</text>
<text x="12" y="628">箱の下の行：その回に入れる語</text>
<text x="12" y="646" class="tm">前に出した語を次の回に入れ、1語ずつ書く。</text>
<text x="12" y="664" class="tm">〈終了〉を出したら、文ができあがり</text>
<line x1="12" y1="678" x2="308" y2="678" class="l sb w1"/>
<text x="12" y="700" class="tb">③ 似たものとの違い（入力 → 出力）</text>
<rect x="12" y="710" width="132" height="40" class="fas sa" stroke-width="1"/>
<text x="78" y="735" class="tb ta" text-anchor="middle">NIC</text>
<rect x="144" y="710" width="164" height="40" class="fas sa" stroke-width="1"/>
<text x="152" y="727">画像 → 文</text>
<text x="152" y="743" class="tm">CNN で読み LSTM で書く</text>
