<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 900" role="img" aria-labelledby="fig-g-show-and-tell-t fig-g-show-and-tell-d">
<title id="fig-g-show-and-tell-t">Show and Tell（NIC）：CNN が画像を読み、LSTM が説明文を1語ずつ書く</title>
<desc id="fig-g-show-and-tell-d">NIC は Neural Image Caption の略で、Vinyals ら（2014）の Show and Tell の論文のモデル。画像を見て説明文を作る画像キャプション生成を行う。エンコーダは入力を読んで数の並び（ベクトル）にする部品、デコーダはその数の並びから出力を作る部品。①考え方：機械翻訳では、エンコーダの RNN が元の文を読んで決まった長さのベクトルにし、デコーダの RNN が訳文を作る。NIC は元の文の代わりに画像を入れ、読む部品を CNN に替えた。画像を文に訳すと考える。②流れ：画像分類で事前学習した CNN が画像を読み、最後の隠れ層の数の並びを LSTM に渡す。画像は最初に1回だけ入れる。LSTM は開始の印から始め、前に出した語を次の入力にして、犬が、走る、終了の印と1語ずつ出す。文は説明のための例。③似たものとの違い：NIC は画像から文。Text-to-Image（DALL-E など）は文から画像で向きが逆。VQA は画像と質問から答え。ViT の画像分類は画像をパッチに分けて Transformer に入れ、クラスを出す。</desc>
<text x="12" y="20" class="tb">Show and Tell（NIC）：画像を文に訳す</text>
<text x="12" y="42" class="tm">NIC＝Neural Image Caption（Vinyals ら 2014）</text>
<text x="12" y="60" class="tm">画像を見て、その説明文を作るモデル</text>
<text x="12" y="78" class="tm">エンコーダ：入力を読み、数の並びにする部品</text>
<text x="12" y="96" class="tm">デコーダ：数の並びから出力を作る部品</text>
<line x1="12" y1="110" x2="308" y2="110" class="l sb w1"/>
<text x="12" y="132" class="tb">① 考え方：機械翻訳の型を借りる</text>
<text x="12" y="154" class="tm">機械翻訳（元の文 → 訳文）</text>
<rect x="12" y="164" width="60" height="40" class="fs sm" stroke-width="1"/>
