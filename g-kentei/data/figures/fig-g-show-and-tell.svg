<polygon points="86,184 80,180.5 80,187.5" class="ft"/>
<line x1="158" y1="184" x2="166" y2="184" class="l w1"/>
<polygon points="172,184 166,180.5 166,187.5" class="ft"/>
<line x1="244" y1="184" x2="252" y2="184" class="l w1"/>
<polygon points="258,184 252,180.5 252,187.5" class="ft"/>
<text x="12" y="230" class="tb ta">NIC（画像 → 説明文）</text>
<rect x="12" y="240" width="60" height="40" class="fs sm" stroke-width="1"/>
<text x="42" y="265" text-anchor="middle">画像</text>
<rect x="86" y="240" width="72" height="40" class="fas sa" stroke-width="1.5"/>
<text x="122" y="257" class="tb ta" text-anchor="middle">CNN</text>
<text x="122" y="274" class="tm" text-anchor="middle">読む</text>
<rect x="172" y="240" width="72" height="40" class="fok sok" stroke-width="1.5"/>
<text x="208" y="257" class="tb tok" text-anchor="middle">LSTM</text>
<text x="208" y="274" class="tm" text-anchor="middle">書く</text>
<rect x="258" y="240" width="50" height="40" class="fs sm" stroke-width="1"/>
<text x="283" y="265" text-anchor="middle">文</text>
<line x1="72" y1="260" x2="80" y2="260" class="l w1"/>
<polygon points="86,260 80,256.5 80,263.5" class="ft"/>
<line x1="158" y1="260" x2="166" y2="260" class="l w1"/>
<polygon points="172,260 166,256.5 166,263.5" class="ft"/>
<line x1="244" y1="260" x2="252" y2="260" class="l w1"/>
<polygon points="258,260 252,256.5 252,263.5" class="ft"/>
<text x="12" y="304">元の文の代わりに画像を入れ、読む部品</text>
<text x="12" y="322">（エンコーダ）を CNN に替えた</text>
<text x="12" y="340" class="tm">LSTM：長い並びも覚えやすくした RNN</text>
<line x1="12" y1="354" x2="308" y2="354" class="l sb w1"/>
<text x="12" y="376" class="tb">② 流れ（文は説明のための例）</text>
<rect x="12" y="388" width="296" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="405" class="tb ta" text-anchor="middle">CNN（画像分類で事前学習したもの）</text>
<text x="160" y="421" class="tm" text-anchor="middle">犬が走る写真を読み、数の並びにする</text>
