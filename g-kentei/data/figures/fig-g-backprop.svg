<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1394" role="img" aria-labelledby="fig-g-backprop-t fig-g-backprop-d">
<title id="fig-g-backprop-t">誤差逆伝播法と連鎖律：誤差から逆向きに、重みの効き目を求める</title>
<desc id="fig-g-backprop-d">誤差逆伝播法が何のためで、なぜ速いかを示してから、計算の例を描いた図。何をするものか：学習は、出力の外れ（誤差）が小さくなるよう重みを少しずつ直すこと。直すには、重みを少し動かすと誤差が何倍動くか（勾配。その重みの効き目）を、重みごとに知りたい。困りごと：重みが100万個あるとき、1つずつ少し動かして誤差を計算し直すと、計算を100万回やり直すことになる（数は例）。どう解決するか：誤差から出発して、出口側から1段ずつ逆にたどり、段ごとの倍率を掛けていく（連鎖律）。手前の段までの掛け算は次の段でそのまま使い回せるので、前向き1回と逆向き1回で全部の重みの効き目がそろう。下の図の読み方：下向きの矢印が順伝播（値を計算して誤差を出す）、上向きの矢印が逆伝播（倍率を掛けながら戻る）。∂○/∂△は、△を少し動かすと○が何倍動くか。重みwから誤差Lまでの計算を、u（wとxの積）、y（uの二乗）、L（yと目標の差の二乗）と順に並べた計算グラフ。下向きの矢印が順伝播で、値を前向きに計算して誤差を出す。上向きの矢印が逆伝播で、出力側から順に局所的な微分を掛けながら戻る。誤差Lを重みwで微分した値は、3つの局所的な微分の積になる（連鎖律）。これが、重みが誤差にどれだけ効いたかを表す。例の数値はx＝2、w＝0.5、目標3で、積は−16。下は3つの微分の求め方。微分は「入力を少し動かすと、出力が何倍動くか」。uはwの2倍なので2。yはuの二乗で、傾きは2×uなので2×1で2。Lは(y−3)の二乗で、傾きは2×(y−3)なので2×(1−3)で−4。二乗の傾きが2×uになるのは、uを1から1.01にするとuの二乗が1から1.0201になり、増えた0.02が0.01の2倍だから。確かめ：wを0.5から0.51にすると、u＝1.02、y＝1.0404、L＝(1.0404−3)²≈3.84で、誤差は4から3.84へ0.16減り、−16×0.01と合う。マイナスは、wを増やすと誤差が減るという意味で、勾配降下法はwを増やす向きに直す。</desc>
<text x="12" y="20" class="tb">誤差逆伝播法：逆向きに、重みの効き目を求める</text>
<text x="12" y="48" class="tb">① 何をするものか</text>
<text x="12" y="68" class="tm">学習＝出力の外れ（誤差）が小さくなるよう、</text>
<text x="12" y="88" class="tm">重みを少しずつ直すこと。直すには、重みを</text>
<text x="12" y="108" class="tm">少し動かすと誤差が何倍動くか（勾配。その</text>
<text x="12" y="128" class="tm">重みの効き目）を、重みごとに知りたい</text>
<line x1="12" y1="142" x2="308" y2="142" class="l sb w1"/>
<text x="12" y="166" class="tb">② 困りごと</text>
<text x="12" y="186" class="tm">重みが 100万個あるとき、1つずつ少し動かして</text>
<text x="12" y="206" class="tm">誤差を計算し直すと、計算を 100万回やり直す</text>
<text x="12" y="226" class="tm">ことになる（数は例）</text>
<line x1="12" y1="240" x2="308" y2="240" class="l sb w1"/>
<text x="12" y="264" class="tb">③ どう解決するか</text>
<text x="12" y="284" class="tm">誤差から出発して、出口側から1段ずつ逆に</text>
<text x="12" y="304" class="tm">たどり、段ごとの倍率を掛けていく（連鎖律）。</text>
<text x="12" y="324" class="tm">手前の段までの掛け算は、次の段でそのまま</text>
<text x="12" y="344" class="tm">使い回せる</text>
<text x="12" y="366" class="tb ta">→ 前向き1回＋逆向き1回で、</text>
<text x="12" y="386" class="tb ta">　 全部の重みの効き目がそろう</text>
<line x1="12" y1="400" x2="308" y2="400" class="l sb w1"/>
<text x="12" y="424" class="tb">④ 下の図の読み方</text>
<text x="12" y="444" class="tm">下向きの矢印＝順伝播（値を計算して誤差を出す）</text>
<text x="12" y="464" class="tm">上向きの矢印＝逆伝播（倍率を掛けながら戻る）</text>
<text x="12" y="484" class="tm">∂○/∂△＝△を少し動かすと、○が何倍動くか</text>
<line x1="12" y1="498" x2="308" y2="498" class="l sb w1"/>
<g transform="translate(0,506)">
<text x="12" y="20" class="tb">下へ：順伝播　上へ：逆伝播</text>
<rect x="105" y="40" width="110" height="34" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="62" class="tb" text-anchor="middle">w＝0.5</text>
<rect x="105" y="138" width="110" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="160" class="tb" text-anchor="middle">u＝w×x＝1</text>
<rect x="105" y="236" width="110" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="258" class="tb" text-anchor="middle">y＝u²＝1</text>
<rect x="105" y="334" width="110" height="34" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="160" y="356" class="tb" text-anchor="middle">L＝(y−3)²＝4</text>
<line x1="124" y1="76" x2="124" y2="128.8" class="l sm w2"/>
<polygon points="124,136 119.5,128.8 128.5,128.8" class="fm"/>
<text x="12" y="111" class="tm">× x（x＝2）</text>
<line x1="196" y1="136" x2="196" y2="84" class="l sa w3"/>
<polygon points="196,76 201,84 191,84" class="ft"/>
<line x1="124" y1="174" x2="124" y2="226.8" class="l sm w2"/>
<polygon points="124,234 119.5,226.8 128.5,226.8" class="fm"/>
<text x="12" y="209" class="tm">f ＝ 二乗</text>
<line x1="196" y1="234" x2="196" y2="182" class="l sok w3"/>
<polygon points="196,174 201,182 191,182" class="ft"/>
<line x1="124" y1="272" x2="124" y2="324.8" class="l sm w2"/>
<polygon points="124,332 119.5,324.8 128.5,324.8" class="fm"/>
<text x="12" y="307" class="tm">誤差（目標 3）</text>
<line x1="196" y1="332" x2="196" y2="280" class="l swn w3"/>
<polygon points="196,272 201,280 191,280" class="ft"/>
<text x="206" y="111" class="tb ta">∂u/∂w＝2</text>
<text x="206" y="209" class="tb tok">∂y/∂u＝2</text>
<text x="206" y="307" class="tb twn">∂L/∂y＝−4</text>
<text x="12" y="420" class="tb">連鎖律：3つの微分を掛ける</text>
<text x="12" y="440" class="tb">∂L/∂w ＝</text>
<text x="89.14" y="440" class="tb twn">∂L/∂y</text>
<text x="147.68" y="440" class="tb">×</text>
<text x="168.46" y="440" class="tb tok">∂y/∂u</text>
<text x="226.17" y="440" class="tb">×</text>
<text x="246.95" y="440" class="tb ta">∂u/∂w</text>
<text x="12" y="468" class="tb">　　　 ＝</text>
<text x="78.94" y="468" class="tb twn">(−4)</text>
<text x="117.91" y="468" class="tb">×</text>
<text x="138.69" y="468" class="tb tok">2</text>
<text x="154.24" y="468" class="tb">×</text>
<text x="175.02" y="468" class="tb ta">2</text>
<text x="190.56" y="468" class="tb">＝ −16</text>
<line x1="12" y1="484" x2="308" y2="484" class="l sb w1"/>
<text x="12" y="508">∂L/∂w ＝ 重み w が誤差にどれだけ効いたか</text>
<text x="12" y="528" class="tm">　→ 誤差の責任を重みに割り当てる</text>
<line x1="12" y1="544" x2="308" y2="544" class="l sb w1"/>
<text x="12" y="568" class="tb">3つの微分はどう求めたか</text>
<text x="12" y="588">∂○/∂△ ＝ △を少し動かすと、○が何倍動くか</text>
<text x="12" y="612" class="tb ta">∂u/∂w：u＝w×2 なので 2倍</text>
<text x="12" y="634" class="tb tok">∂y/∂u：u² の傾きは 2×u</text>
<text x="12" y="652" class="tb tok">　　　＝2×1＝2</text>
<text x="12" y="674" class="tb twn">∂L/∂y：(y−3)² の傾きは 2×(y−3)</text>
<text x="12" y="692" class="tb twn">　　　＝2×(1−3)＝−4</text>
<text x="12" y="716" class="tm">なぜ 2×u か：u を1→1.01 にすると u² は</text>
<text x="12" y="734" class="tm">1→1.0201。0.02 増えて、0.01 の2倍（＝2×1）</text>
</g>
<line x1="12" y1="1254" x2="308" y2="1254" class="l sb w1"/>
<text x="12" y="1278" class="tb">確かめ：−16 は何を言っているか</text>
<text x="12" y="1298">w を 0.5→0.51 にすると、u＝1.02、</text>
<text x="12" y="1318">y＝1.0404、L＝(1.0404−3)²≈3.84</text>
<text x="12" y="1338">誤差は 4→3.84 で 0.16 減る＝−16×0.01</text>
<text x="12" y="1358" class="tm">マイナス＝w を増やすと誤差が減る。だから</text>
<text x="12" y="1378" class="tm">勾配降下法は w を増やす向きに直す</text>
</svg>
