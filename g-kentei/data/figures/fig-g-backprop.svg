<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 540" role="img" aria-labelledby="fig-g-backprop-t fig-g-backprop-d">
<title id="fig-g-backprop-t">誤差逆伝播法と連鎖律：計算グラフ</title>
<desc id="fig-g-backprop-d">重みwから誤差Lまでの計算を、u（wとxの積）、y（uの二乗）、L（yと目標の差の二乗）と順に並べた計算グラフ。下向きの矢印が順伝播で、値を前向きに計算して誤差を出す。上向きの矢印が逆伝播で、出力側から順に局所的な微分をかけながら戻る。誤差Lを重みwで微分した値は、3つの局所的な微分の積になる（連鎖律）。これが、重みが誤差にどれだけ効いたかを表す。例の数値はx＝2、w＝0.5、目標3で、積は−16。</desc>
<text x="12" y="20" class="tb">下へ：順伝播　上へ：逆伝播</text>
<rect x="105" y="40" width="110" height="34" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="62" class="tb" text-anchor="middle">w＝0.5</text>
<rect x="105" y="138" width="110" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="160" class="tb" text-anchor="middle">u＝w×x＝1</text>
<rect x="105" y="236" width="110" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="258" class="tb" text-anchor="middle">y＝u²＝1</text>
<rect x="105" y="334" width="110" height="34" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="160" y="356" class="tb" text-anchor="middle">L＝(y−3)²＝4</text>
<line x1="124" y1="76" x2="124" y2="128.8" class="l sm w2"/>
<polygon points="124,136 119.5,128.8 128.5,128.8" class="fm"/>
<text x="12" y="111" class="tm">× x（x＝2）</text>
<line x1="196" y1="136" x2="196" y2="84" class="l sa w3"/>
<polygon points="196,76 201,84 191,84" class="ft"/>
<line x1="124" y1="174" x2="124" y2="226.8" class="l sm w2"/>
<polygon points="124,234 119.5,226.8 128.5,226.8" class="fm"/>
<text x="12" y="209" class="tm">f ＝ 二乗</text>
<line x1="196" y1="234" x2="196" y2="182" class="l sok w3"/>
<polygon points="196,174 201,182 191,182" class="ft"/>
<line x1="124" y1="272" x2="124" y2="324.8" class="l sm w2"/>
<polygon points="124,332 119.5,324.8 128.5,324.8" class="fm"/>
<text x="12" y="307" class="tm">誤差（目標 3）</text>
<line x1="196" y1="332" x2="196" y2="280" class="l swn w3"/>
<polygon points="196,272 201,280 191,280" class="ft"/>
<text x="206" y="111" class="tb ta">∂u/∂w＝2</text>
<text x="206" y="209" class="tb tok">∂y/∂u＝2</text>
<text x="206" y="307" class="tb twn">∂L/∂y＝−4</text>
<text x="12" y="420" class="tb">連鎖律：3つの微分を掛ける</text>
<text x="12" y="440" class="tb">∂L/∂w ＝</text>
<text x="89.14" y="440" class="tb twn">∂L/∂y</text>
<text x="147.68" y="440" class="tb">×</text>
<text x="168.46" y="440" class="tb tok">∂y/∂u</text>
<text x="226.17" y="440" class="tb">×</text>
<text x="246.95" y="440" class="tb ta">∂u/∂w</text>
<text x="12" y="468" class="tb">　　　 ＝</text>
<text x="78.94" y="468" class="tb twn">(−4)</text>
<text x="117.91" y="468" class="tb">×</text>
<text x="138.69" y="468" class="tb tok">2</text>
<text x="154.24" y="468" class="tb">×</text>
<text x="175.02" y="468" class="tb ta">2</text>
<text x="190.56" y="468" class="tb">＝ −16</text>
<line x1="12" y1="484" x2="308" y2="484" class="l sb w1"/>
<text x="12" y="508">∂L/∂w ＝ 重み w が誤差にどれだけ効いたか</text>
<text x="12" y="528" class="tm">　→ 誤差の責任を重みに割り当てる</text>
</svg>
