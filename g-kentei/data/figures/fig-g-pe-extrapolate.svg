<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 722" role="img" aria-labelledby="fig-g-pe-extrapolate-t fig-g-pe-extrapolate-d">
<title id="fig-g-pe-extrapolate-t">正弦波の位置エンコーディングは、学習より長い系列の位置にも値が出せる</title>
<desc id="fig-g-pe-extrapolate-d">①位置のベクトルの1つの次元を、位置ごとに描いたグラフ（説明のための例）。横軸は位置（何番目の語か、0から100）、縦軸はその位置の値（−1から1）。周期40の正弦波。0から50番目は学習で出会った位置（色付きの帯）で、実線。51番目より先は学習で出会っていない位置だが、同じ式で計算できるので破線で続く。例：70番目の値は −1。②原論文は、学習で求める位置の埋め込みも試し、結果はほぼ同じだった（表3の行(E)）。それでも正弦波を選んだ理由は、学習のときに出会った長さより長い系列にも外挿できる（延長して使える）かもしれないから。よくある思い違い『学習のときより短い系列に限って使えるので、過学習を防ぎやすいから』は、理由の向きが逆。原論文の式は、次元ごとに周期を変えた sin(pos / 10000^(2i/d)) と cos。言葉：ベクトルは数を1列に並べたもの。次元は並べた数の個数で、1つの次元とは並びの中の数1つのこと。埋め込みは、ここでは位置を表す数の並び。</desc>
<text x="12" y="22" class="tl">正弦波なら、長い文の位置も値が出る</text>
<text x="12" y="42" class="tm">位置のベクトルの1つの次元を、位置ごとに描く</text>
<rect x="12" y="56" width="296" height="106" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="79" class="tb">言葉：ベクトル・次元・埋め込み</text>
<text x="22" y="97">ベクトル：数を1列に並べたもの</text>
<text x="22" y="115">次元：並べた数の個数。1つの次元＝</text>
<text x="22" y="133">　並びの中の数1つ</text>
<text x="22" y="151">埋め込み：ここでは位置を表す数の並び</text>
<g transform="translate(0,118)">
<text x="12" y="68" class="tb">①位置と値のグラフ（説明のための例）</text>
<text x="12" y="90" class="tm">縦：その位置の値（−1〜1）</text>
<g transform="translate(0,22)">
<rect x="40" y="84" width="130" height="112" class="fas"/>
<line x1="40" y1="84" x2="40" y2="196" class="l sm w1"/>
<line x1="40" y1="140" x2="300" y2="140" class="l sb w1"/>
<line x1="40" y1="196" x2="300" y2="196" class="l sm w1"/>
<text x="34" y="94" class="tm" text-anchor="end">1</text>
<text x="34" y="144" class="tm" text-anchor="end">0</text>
<text x="34" y="194" class="tm" text-anchor="end">−1</text>
<polyline points="40.0,140.0 42.6,132.2 45.2,124.5 47.8,117.3 50.4,110.6 53.0,104.6 55.6,99.5 58.2,95.4 60.8,92.4 63.4,90.6 66.0,90.0 68.6,90.6 71.2,92.4 73.8,95.4 76.4,99.5 79.0,104.6 81.6,110.6 84.2,117.3 86.8,124.5 89.4,132.2 92.0,140.0 94.6,147.8 97.2,155.5 99.8,162.7 102.4,169.4 105.0,175.4 107.6,180.5 110.2,184.6 112.8,187.6 115.4,189.4 118.0,190.0 120.6,189.4 123.2,187.6 125.8,184.6 128.4,180.5 131.0,175.4 133.6,169.4 136.2,162.7 138.8,155.5 141.4,147.8 144.0,140.0 146.6,132.2 149.2,124.5 151.8,117.3 154.4,110.6 157.0,104.6 159.6,99.5 162.2,95.4 164.8,92.4 167.4,90.6 170.0,90.0" class="l sa w2"/>
<polyline points="170.0,90.0 172.6,90.6 175.2,92.4 177.8,95.4 180.4,99.5 183.0,104.6 185.6,110.6 188.2,117.3 190.8,124.5 193.4,132.2 196.0,140.0 198.6,147.8 201.2,155.5 203.8,162.7 206.4,169.4 209.0,175.4 211.6,180.5 214.2,184.6 216.8,187.6 219.4,189.4 222.0,190.0 224.6,189.4 227.2,187.6 229.8,184.6 232.4,180.5 235.0,175.4 237.6,169.4 240.2,162.7 242.8,155.5 245.4,147.8 248.0,140.0 250.6,132.2 253.2,124.5 255.8,117.3 258.4,110.6 261.0,104.6 263.6,99.5 266.2,95.4 268.8,92.4 271.4,90.6 274.0,90.0 276.6,90.6 279.2,92.4 281.8,95.4 284.4,99.5 287.0,104.6 289.6,110.6 292.2,117.3 294.8,124.5 297.4,132.2 300.0,140.0" class="l swn w2 dsh"/>
<circle cx="222" cy="190" r="5" class="fng sng" stroke-width="2"/>
<text x="40" y="212" class="tm" text-anchor="middle">0</text>
<text x="170" y="212" class="tm" text-anchor="middle">50</text>
<text x="222" y="212" class="tb tng" text-anchor="middle">70</text>
<text x="300" y="212" class="tm" text-anchor="middle">100</text>
</g>
<text x="170" y="256" class="tb" text-anchor="middle">横：位置（何番目の語か）</text>
<rect x="12" y="268" width="22" height="12" class="fas sa" stroke-width="1"/>
<text x="42" y="279">学習で出会った位置（例：50番目まで）</text>
<line x1="12" y1="294" x2="34" y2="294" class="l swn w2 dsh"/>
<text x="42" y="299">出会っていない位置も、同じ式で計算</text>
<text x="12" y="322" class="tb tng">例：70番目の値は −1（周期40の波）</text>
<line x1="12" y1="338" x2="308" y2="338" class="l sb w1"/>
<text x="12" y="362" class="tb">②原論文の結果と、選んだ理由</text>
<text x="12" y="384">学習で求める位置の埋め込みも試した</text>
<text x="12" y="404">→ 結果はほぼ同じ（表3の行(E)）</text>
<text x="12" y="428">それでも正弦波を選んだ理由：</text>
<text x="12" y="448" class="tb tok">学習で出会った長さより長い系列にも</text>
<text x="12" y="468" class="tb tok">外挿できる（延長して使える）かもしれない</text>
<text x="12" y="488" class="tm">（論文の言い方は『かもしれない』）</text>
<line x1="12" y1="504" x2="308" y2="504" class="l sb w1"/>
<text x="12" y="528" class="tb tng">思い違い：『学習より短い系列に限って</text>
<text x="12" y="548" class="tb tng">使えるので、過学習を防ぎやすい』</text>
<text x="12" y="568">理由の向きが逆。長いほうへ伸ばせるかも</text>
<text x="12" y="592" class="tm">原論文の式：sin(pos / 10000^(2i/d)) と cos</text>
</g>
</svg>
