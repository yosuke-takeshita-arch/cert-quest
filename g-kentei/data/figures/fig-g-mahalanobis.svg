<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1158" role="img" aria-labelledby="fig-g-mahalanobis-t fig-g-mahalanobis-d">
<title id="fig-g-mahalanobis-t">マハラノビス距離：ふだんのばらつきを物差しにして、珍しさを測る距離</title>
<desc id="fig-g-mahalanobis-d">①したいこと：機械の温度と振動を見て、いつもと違う（珍しい）状態を見つけたい。温度は平均50℃、ばらつき（標準偏差）10℃。振動は平均2、ばらつき0.5。点Aは温度だけ10℃高く、点Bは振動だけ1高い。②困りごと：ふつうの直線距離（ユークリッド距離）では、A＝√(10²＋0²)＝10、B＝√(0²＋1²)＝1で、Aのほうが遠いことになり、数が大きい温度のずればかり大きく数えてしまう。③ずれを、ふだんのばらつき何個分かで数える。Aは温度のずれ10÷10＝1個分、Bは振動のずれ1÷0.5＝2個分なので、Bのほうが珍しい（異常に近い）。④これがマハラノビス距離で、ばらつき何個分かを2乗して全部足し、平方根をとる。A＝√(1²＋0²)＝1、B＝√(0²＋2²)＝2。これは温度と振動に関係が無いときの計算。温度が上がると振動も大きいのように一緒に動くときは、その向きから外れたずれをさらに大きく数える。教科書でよく見る図の読み方：灰色の点は正常時のデータ1つ1つ、青い線はマハラノビス距離が同じになる点を結んだ線（地図の等高線と同じ）、点線の円は中心からの直線距離が同じ点。図の説明：温度（横）と振動（縦）の正常時のデータが、右上がりの細長い楕円状に広がっている。中心から見て、直線距離が同じ2点を考える。1つは楕円の長軸の方向にあり、点群の広がりの内側なので、マハラノビス距離は小さく、正常の範囲。もう1つは短軸の方向にあり、点群からはみ出しているので、マハラノビス距離は大きく、異常と判断する。ユークリッド距離は2点で同じ。マハラノビス距離は、ばらつきの大きい方向のずれは小さく、ばらつきの小さい方向のずれは大きく評価する。</desc>
<text x="12" y="20" class="tb">マハラノビス距離：ふだんのばらつきで測る</text>
<text x="12" y="48" class="tb">① したいこと</text>
<text x="12" y="68" class="tm">機械の温度と振動を見て、いつもと違う</text>
<text x="12" y="86" class="tm">（珍しい）状態を見つけたい</text>
<text x="12" y="110">温度：平均 50℃、ばらつき（標準偏差）10℃</text>
<text x="12" y="130">振動：平均 2、ばらつき（標準偏差）0.5</text>
<text x="12" y="152" class="tb">点A：温度だけ 10℃ 高い</text>
<text x="12" y="172" class="tb">点B：振動だけ 1 高い</text>
<line x1="12" y1="186" x2="308" y2="186" class="l sb w1"/>
<text x="12" y="208" class="tb">② 困りごと：ふつうの直線距離では</text>
<text x="12" y="228">A＝√(10²＋0²)＝10、B＝√(0²＋1²)＝1</text>
<text x="12" y="248" class="tb tng">→ A のほうが遠い（珍しい）ことになる</text>
<text x="12" y="268" class="tm">数の大きい温度のずればかり、大きく数える</text>
<text x="12" y="286" class="tm">（直線距離＝ユークリッド距離）</text>
<line x1="12" y1="300" x2="308" y2="300" class="l sb w1"/>
<text x="12" y="322" class="tb">③ ずれを、ばらつき何個分かで数える</text>
<text x="12" y="342">A：温度のずれ 10÷10＝1個分</text>
<text x="12" y="362">B：振動のずれ 1÷0.5＝2個分</text>
<text x="12" y="390" class="tb">A</text>
<rect x="40" y="377" width="80" height="16" class="fas sa" stroke-width="1.5"/>
<text x="128" y="390" class="tm">1個分</text>
<text x="12" y="416" class="tb">B</text>
<rect x="40" y="403" width="160" height="16" class="fng sng" stroke-width="1.5"/>
<text x="208" y="416" class="tb tng">2個分</text>
<text x="12" y="444" class="tb tok">→ B のほうが珍しい（異常に近い）</text>
<line x1="12" y1="458" x2="308" y2="458" class="l sb w1"/>
<text x="12" y="480" class="tb">④ これがマハラノビス距離</text>
<text x="12" y="500" class="tm">＝√（ばらつき何個分かを2乗して、全部足す）</text>
<text x="12" y="520">A＝√(1²＋0²)＝1、B＝√(0²＋2²)＝2</text>
<text x="12" y="540" class="tm">（温度と振動に関係が無いときの計算）</text>
<text x="12" y="560" class="tm">温度が上がると振動も大きい、のように一緒に</text>
<text x="12" y="578" class="tm">動くときは、その向きから外れたずれを、</text>
<text x="12" y="596" class="tm">さらに大きく数える（↓ 下の図）</text>
<line x1="12" y1="610" x2="308" y2="610" class="l sb w1"/>
<text x="12" y="632" class="tb">教科書でよく見る図：まず読み方</text>
<text x="12" y="652" class="tm">灰色の点＝正常時のデータ1つ1つ</text>
<text x="12" y="670" class="tm">青い線＝マハラノビス距離が同じ点を結んだ線</text>
<text x="12" y="688" class="tm">（地図の等高線と同じ）。点線の円＝中心からの</text>
<text x="12" y="706" class="tm">直線距離が同じ点</text>
<g transform="translate(0,714)">
<text x="12" y="20" class="tb">正常時の温度と振動</text>
<rect x="12" y="28" width="296" height="300" class="fs sb" stroke-width="1"/>
