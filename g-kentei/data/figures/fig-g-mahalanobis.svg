<text x="300" y="50" class="tm" text-anchor="end">振動</text>
<text x="300" y="318" class="tm" text-anchor="end">温度 →</text>
<text x="20" y="50" class="tm">青い線＝同じマハラノビス距離</text>
<text x="12" y="356" class="tb">中心から P1・P2 までの直線距離は同じ</text>
<circle cx="22" cy="376" r="6" class="fok sok"/>
<text x="36" y="380">P1：広がりの方向 → 距離は小さい（正常）</text>
<circle cx="22" cy="400" r="6" class="fng sng"/>
<text x="36" y="404">P2：はみ出す方向 → 距離は大きい（異常）</text>
<text x="12" y="426" class="tm">ばらつきの大きい方向のずれは小さく評価する</text>
