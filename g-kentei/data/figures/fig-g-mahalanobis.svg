<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 438" role="img" aria-labelledby="fig-g-mahalanobis-t fig-g-mahalanobis-d">
<title id="fig-g-mahalanobis-t">マハラノビス距離：分布の広がりと相関を考える距離</title>
<desc id="fig-g-mahalanobis-d">温度（横）と振動（縦）の正常時のデータが、右上がりの細長い楕円状に広がっている。中心から見て、直線距離が同じ2点を考える。1つは楕円の長軸の方向にあり、点群の広がりの内側なので、マハラノビス距離は小さく、正常の範囲。もう1つは短軸の方向にあり、点群からはみ出しているので、マハラノビス距離は大きく、異常と判断する。ユークリッド距離は2点で同じ。マハラノビス距離は、ばらつきの大きい方向のずれは小さく、ばらつきの小さい方向のずれは大きく評価する。</desc>
