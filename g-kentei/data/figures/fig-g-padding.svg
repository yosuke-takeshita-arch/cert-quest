<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 944" role="img" aria-labelledby="fig-g-padding-t fig-g-padding-d">
<title id="fig-g-padding-t">パディング：入力の周りを 0 で埋めて、畳み込みの出力の大きさを保つ</title>
<desc id="fig-g-padding-d">例は 5×5 の入力に 3×3 のフィルタを、窓を1マスずつずらして（ストライド1）掛ける場合。①パディングなしでは、窓の置き場所が 5−3＋1＝3 か所で、出力は 3×3 に縮む。角の画素（茶）が窓に入るのは左上の1回だけで、出力のうち角を使うのは1マス。中央の画素（緑）は9か所すべての置き場所で窓に入る。②パディング1では、周りを 0 で1マス埋めて入力が 5＋2×1＝7 になり、7−3＋1＝5 で出力は入力と同じ 5×5 のまま。角の画素が窓に入るのは4回に増え、出力の左上の4マス（茶）が角を使う。③32×32 の入力に 3×3 のフィルタを10層重ねると、パディングなしでは1層ごとに縦横2ずつ縮んで 32−2×10＝12 で 12×12 になる。パディング1なら入力が 34 になり 34−3＋1＝32 で、何層重ねても 32×32 のまま。押さえどころ：ストライド1のとき、3×3 のフィルタならパディング1、5×5 ならパディング2で大きさが保てる。ストライドは窓をずらす幅で出力を縮める側、パディングは周りを埋める量で大きさを保つ側。</desc>
<text x="12" y="20" class="tb">パディング：周りを 0 で埋めて大きさを保つ</text>
<text x="12" y="42" class="tm">例：5×5 の入力に 3×3 のフィルタ</text>
