<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 752" role="img" aria-labelledby="fig-g-feature-map-t fig-g-feature-map-d">
<title id="fig-g-feature-map-t">特徴マップ：フィルタでなぞった結果の、どこにどの模様があるかの地図</title>
<desc id="fig-g-feature-map-d">入力は5×5で、1は線がある所。2列目に縦線、4行目に横線がある。縦線のフィルタ（3×3の真ん中の列が1）と横線のフィルタ（真ん中の行が1）で、それぞれなぞる。窓（3×3）を1マスずつずらし、重なった9マスの積の和を地図の1マスにする。縦線の特徴マップは、上の行から3・0・0、3・1・1、3・1・1で、3が縦に並ぶ所が縦線のある所。横線の特徴マップは1・1・0、1・1・0、3・3・3で、3が横に並ぶ所が横線のある所。縦の地図の左上の3は、窓が入力の左上3×3で、フィルタの1は真ん中の列だけ、そこの入力は1・1・1なので、1×1＋1×1＋1×1＝3（ほかの6マスは0を掛ける）。地図の1マスは入力の窓1つぶん。フィルタ1枚につき地図が1枚でき、フィルタ64枚なら地図64枚（64チャネル）。次の層はこの地図を入力にまた畳み込むので、層が深いほど線、角、目や車輪の地図になる。フィルタは模様の型（学習する重み）、特徴マップは型でなぞった結果（出力）。</desc>
