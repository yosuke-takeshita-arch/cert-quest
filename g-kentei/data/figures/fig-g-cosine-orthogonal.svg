<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 536" role="img" aria-labelledby="fig-g-cosine-orthogonal-t fig-g-cosine-orthogonal-d">
<title id="fig-g-cosine-orthogonal-t">a＝(1, 2) と b＝(−2, 1) のコサイン類似度は0</title>
<desc id="fig-g-cosine-orthogonal-d">何のための図か：ベクトル a＝(1, 2) と b＝(−2, 1) のコサイン類似度を求める。方眼の図：原点から a は右に1・上に2、b は左に2・上に1の矢印。2本は直角に交わる。①内積：同じ位置どうしを掛けて足す。1×(−2)＋2×1＝−2＋2＝0。②長さ：a は√(1²＋2²)＝√5、b は√((−2)²＋1²)＝√5。③コサイン類似度＝内積÷（長さ×長さ）＝0÷(√5×√5)＝0÷5＝0。長さで割るのは、矢印の長さの影響を消して向きだけを見るため。向きとの対応：同じ向き（例 (1, 2) と (2, 4)）なら1、直角なら0、逆向き（例 (1, 2) と (−1, −2)）なら−1。√5 は長さで、コサイン類似度は−1〜1の範囲に収まる。</desc>
<text x="12" y="20" class="tb">a＝(1, 2) と b＝(−2, 1) の向きの近さ</text>
<text x="12" y="42" class="tm">この問題の2本の矢印で見る</text>
<line x1="50" y1="182" x2="50" y2="62" class="l sb w1"/>
<line x1="90" y1="182" x2="90" y2="62" class="l sb w1"/>
<line x1="130" y1="182" x2="130" y2="62" class="l sb w1"/>
<line x1="170" y1="182" x2="170" y2="62" class="l sb w1"/>
<line x1="210" y1="182" x2="210" y2="62" class="l sb w1"/>
<line x1="250" y1="182" x2="250" y2="62" class="l sb w1"/>
<line x1="50" y1="162" x2="250" y2="162" class="l sb w1"/>
<line x1="50" y1="122" x2="250" y2="122" class="l sb w1"/>
<line x1="50" y1="82" x2="250" y2="82" class="l sb w1"/>
<line x1="50" y1="162" x2="250" y2="162" class="l sm w1"/>
<line x1="170" y1="182" x2="170" y2="62" class="l sm w1"/>
<line x1="170" y1="162" x2="205.5" y2="90.9" class="l sa w3"/>
<polygon points="210,82 210.9,93.6 200.2,88.3" class="fa"/>
<text x="218" y="86" class="tb ta" text-anchor="start">a＝(1, 2)</text>
<line x1="170" y1="162" x2="98.9" y2="126.5" class="l sm w3"/>
<polygon points="90,122 101.6,121.1 96.3,131.8" class="fm"/>
<text x="84" y="108" class="tb " text-anchor="middle">b＝(−2, 1)</text>
<polyline points="175.4,151.3 164.6,145.9 159.3,156.6" class="l sok w2"/>
<text x="160" y="179" class="tb tok" text-anchor="end">直角</text>
<line x1="12" y1="200" x2="308" y2="200" class="l sb w1"/>
<text x="12" y="224" class="tb">① 内積：同じ位置どうしを掛けて足す</text>
<text x="12" y="242">1 × (−2) ＋ 2 × 1 ＝ −2 ＋ 2 ＝ 0</text>
<line x1="12" y1="254" x2="308" y2="254" class="l sb w1"/>
<text x="12" y="278" class="tb">② それぞれの長さ</text>
<text x="12" y="296">a：√(1² ＋ 2²) ＝ √5</text>
<text x="12" y="314">b：√((−2)² ＋ 1²) ＝ √5</text>
<line x1="12" y1="326" x2="308" y2="326" class="l sb w1"/>
<text x="12" y="350" class="tb">③ コサイン類似度 ＝ 内積 ÷（長さ × 長さ）</text>
<rect x="12" y="358" width="296" height="32" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="378" class="tb tok">0 ÷ (√5 × √5) ＝ 0 ÷ 5 ＝ 0</text>
<text x="12" y="414" class="tm">長さで割るのは、向きだけを見るため</text>
<line x1="12" y1="426" x2="308" y2="426" class="l sb w1"/>
<text x="12" y="450" class="tb">向きと値の対応（−1〜1に収まる）</text>
<text x="12" y="468">同じ向き：(1, 2) と (2, 4) → 1</text>
<text x="12" y="486" class="tok">直角：(1, 2) と (−2, 1) → 0</text>
<text x="12" y="504">逆向き：(1, 2) と (−1, −2) → −1</text>
<text x="12" y="522" class="tm">√5 は長さで、コサイン類似度ではない</text>
</svg>
