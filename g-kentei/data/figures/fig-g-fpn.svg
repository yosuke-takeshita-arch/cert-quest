<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1236" role="img" aria-labelledby="fig-g-fpn-t fig-g-fpn-d">
<title id="fig-g-fpn-t">FPN：深い段の『人』と分かる特徴を拡大して戻し、同じ大きさの浅い段の細かい形の特徴と足して、どの大きさのマップでも人を見つけられるようにする</title>
<desc id="fig-g-fpn-d">例：800×800画素の写真に、近くの大きな人（256×256画素）と遠くの小さな人（32×32画素）が写っている。①困りごと：大きさが8倍違う人を1つのモデルで両方見つけたい。②CNNの中の2つの段。特徴マップは画像をマス目に区切り、マスごとに数を入れた表。C2〜C5はCNNの4つの段（5が最も深い）、P2〜P5はFPNが作る4つの段。浅い段C2は200×200マスで1マスが縦横4画素（800÷200＝4）、場所は細かいが線や角だけで人と分からない。深い段C5は25×25マスで1マスが縦横32画素（800÷25＝32）、人と分かるが場所が粗い。FPNは両方を足して、場所が細かく人とも分かるマップを作る。③足し方（数は説明用）：上の段P5の2×2（左上だけ人らしさ0.8）を縦横2倍に拡大すると、4×4の左上4マスがすべて0.8になり人の中心が分からない。横から来る浅い段C4の数は人らしさではなく細かい形（線・角）がある強さで、左上から0.1、0.4、0.1、0.1。同じ位置どうし足すと0.8＋0.4＝1.2、0.8＋0.1＝0.9となり、1.2が人らしさと形の両方が強いマスで、人の中心をここに絞れる。足した結果がP4。これをP4→P3→P2とくり返し、4段とも人と分かる細かさの違うマップを作る。④小さな人はP2（1マス縦横4画素）で32÷4＝8、8×8マスに写る（P5だと1マスだけ）。大きな人はP5（1マス縦横32画素）で256÷32＝8、8×8マスに写る（P2だと64×64マス）。どちらの人も自分に合ったマップでは8×8マスくらいに写る。</desc>
<text x="12" y="20" class="tb">FPN：浅い段と深い段を足して、</text>
<text x="12" y="38" class="tb">大きな人も小さな人も見つける</text>
<text x="12" y="70" class="tb">① 困りごと</text>
