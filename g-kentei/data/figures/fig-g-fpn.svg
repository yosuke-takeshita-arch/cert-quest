<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1248" role="img" aria-labelledby="fig-g-fpn-t fig-g-fpn-d">
<title id="fig-g-fpn-t">FPN：深い層の特徴を上から拡大して戻し、同じ大きさの浅い層の特徴と横の接続で足して、どの大きさのマップにも意味を持たせる</title>
<desc id="fig-g-fpn-d">800×800の写真に遠くの小さな人と近くの大きな人が写っている例。①形：左は普通のCNNの特徴で、下からC2が200×200、C3が100×100、C4が50×50、C5が25×25。上ほど小さく粗いが人らしいという意味が強い。右はFPNの出力P5〜P2で、上から戻す道（青の下向き矢印）は縦横を2倍に拡大して1つ下へ渡し、横の接続（赤の横矢印）は同じ大きさのCの特徴を足し込む。②1回の合流の例（数は説明用、マスの数はその位置の人らしさの強さ）：上の段の2×2は左上だけ0.8。2倍に拡大すると4×4の左上4マスがすべて0.8になり、人の中心がどこか分からない。横から来る1つ下の段のCNNの特徴（1×1の畳み込みで枚数を256にそろえる）は左上から0.1、0.4、0.1、0.1で、位置は細かいが意味は弱い。同じ位置どうしを足すと0.8＋0.4＝1.2、0.8＋0.1＝0.9となり、1.2のマスに中心を絞れる。これをP5からP2までくり返す。③32×32画素の小さな人は1マス4画素のP2（200×200）で、256×256画素の大きな人は1マス32画素のP5（25×25）で見つける。どの段も意味を持つので細かいP2でも人と分かり、画像ピラミッドより軽い。U-Netは連結で塗り分け、FPNは足し算で段ごとに検出する。</desc>
<text x="12" y="20" class="tb">FPN：上から戻す道と横の接続で、</text>
<text x="12" y="38" class="tb">どの大きさのマップにも意味を持たせる</text>
<text x="12" y="60" class="tm">例：800×800 の写真に、遠くの小さな人と</text>
<text x="12" y="78" class="tm">近くの大きな人が写っている</text>
<text x="12" y="106" class="tb">① 形（数は 800×800 の入力での縦×横）</text>
