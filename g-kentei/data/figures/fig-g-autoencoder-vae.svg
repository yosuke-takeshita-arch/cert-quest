<circle cx="282" cy="462" r="20" class="fas sa dsh"/>
<circle cx="210" cy="414" r="3.5" class="ft"/>
<circle cx="242" cy="440" r="3.5" class="ft"/>
<circle cx="278" cy="412" r="3.5" class="ft"/>
<circle cx="226" cy="468" r="3.5" class="ft"/>
<circle cx="282" cy="462" r="3.5" class="ft"/>
<line x1="228" y1="448" x2="240" y2="460" class="l swn w2"/>
<line x1="240" y1="448" x2="228" y2="460" class="l swn w2"/>
<text x="80" y="512" class="tb" text-anchor="middle">① 1点</text>
<text x="240" y="512" class="tb" text-anchor="middle">② 円（平均と分散）</text>
<text x="80" y="532" class="tm" text-anchor="middle">入力1つにつき点が1つ</text>
<text x="240" y="532" class="tm" text-anchor="middle">入力1つにつき円が1つ</text>
<text x="12" y="562" class="tb">円が重なってつながる</text>
<text x="12" y="582" class="tb">→ サンプリングして新しいデータを生成</text>
<text x="12" y="600" class="tm">（×印がサンプリングした点）</text>
<line x1="12" y1="616" x2="308" y2="616" class="l sb w1"/>
<text x="12" y="640" class="tb">VQ-VAE：表の中で、いちばん近い</text>
<text x="12" y="660" class="tb">ベクトルを選ぶ（連続値ではなく離散）</text>
<text x="12" y="690" class="tb">積層オートエンコーダ：1層ずつ学習して積む</text>
<text x="12" y="710" class="tm">（その重みを初期値に、全体を微調整する）</text>
</svg>
