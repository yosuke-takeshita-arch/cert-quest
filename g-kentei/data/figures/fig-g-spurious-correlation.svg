<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 566" role="img" aria-labelledby="fig-g-spurious-correlation-t fig-g-spurious-correlation-d">
<title id="fig-g-spurious-correlation-t">疑似相関と偏相関：第3の変数が両方を動かす</title>
<desc id="fig-g-spurious-correlation-d">上は因果の矢印図のたとえ話。火事の規模が大きいと、出動する消防車の数も被害額も増える。消防車の数と被害額の間には相関が見えるが、直接の因果関係はない。第3の変数が両方に影響して見える相関が疑似相関。下は散布図。3つのグループ（丸、四角、三角）を合わせると右上がりに見えるが、グループごとに見ると右下がり。第3の変数（グループ）の影響を取り除いたうえでの相関が偏相関係数で、疑似相関では取り除くと関係が変わる。</desc>
<text x="12" y="20" class="tb">① たとえ話：火事の消防車と被害額</text>
<rect x="84" y="34" width="152" height="38" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="57.5" class="tb" text-anchor="middle">火事の規模</text>
<line x1="120" y1="73" x2="70" y2="122" class="l swn w2"/>
<polyline points="72.63,113.26 70,122 78.79,119.54" class="l swn w2"/>
<line x1="200" y1="73" x2="250" y2="122" class="l swn w2"/>
<polyline points="241.21,119.54 250,122 247.37,113.26" class="l swn w2"/>
<text x="12" y="100" class="tb twn">影響</text>
<text x="268" y="100"></text>
<rect x="12" y="124" width="120" height="38" class="fs sa" stroke-width="1.5"/>
<text x="72" y="147.5" class="tb" text-anchor="middle">消防車の数</text>
<rect x="188" y="124" width="120" height="38" class="fs sa" stroke-width="1.5"/>
<text x="248" y="147.5" class="tb" text-anchor="middle">被害額</text>
<line x1="134" y1="143" x2="186" y2="143" class="l sng w2 dsh"/>
<text x="12" y="188" class="tb">消防車の数と被害額は、同時に増える</text>
<text x="12" y="210" class="tb">（相関はある）が、直接の原因ではない</text>
<text x="12" y="232" class="tng">第3の変数が、両方を動かしている</text>
<line x1="12" y1="252" x2="308" y2="252" class="l sb w1"/>
<text x="12" y="280" class="tb">② 第3の変数を取り除くと</text>
<rect x="28" y="300" width="270" height="150" class="fs sb" stroke-width="1"/>
<circle cx="72" cy="386" r="4.5" class="fa"/>
<circle cx="88" cy="394" r="4.5" class="fa"/>
<circle cx="96" cy="401" r="4.5" class="fa"/>
<circle cx="112" cy="407" r="4.5" class="fa"/>
<circle cx="120" cy="413" r="4.5" class="fa"/>
<rect x="137.8" y="346.8" width="8.4" height="8.4" class="fwn swn" stroke-width="1.5"/>
<rect x="153.8" y="354.8" width="8.4" height="8.4" class="fwn swn" stroke-width="1.5"/>
<rect x="161.8" y="361.8" width="8.4" height="8.4" class="fwn swn" stroke-width="1.5"/>
<rect x="177.8" y="367.8" width="8.4" height="8.4" class="fwn swn" stroke-width="1.5"/>
<rect x="185.8" y="373.8" width="8.4" height="8.4" class="fwn swn" stroke-width="1.5"/>
<polygon points="217,310.5 222,320 212,320" class="fok sok"/>
<polygon points="233,318.5 238,328 228,328" class="fok sok"/>
<polygon points="241,325.5 246,335 236,335" class="fok sok"/>
<polygon points="257,331.5 262,341 252,341" class="fok sok"/>
<polygon points="265,337.5 270,347 260,347" class="fok sok"/>
<line x1="28" y1="450" x2="298" y2="450" class="l sm w1"/>
<line x1="28" y1="300" x2="28" y2="450" class="l sm w1"/>
<text x="298" y="470" class="tm" text-anchor="end">X →</text>
<text x="32" y="294" class="tm">Y</text>
<line x1="68" y1="414" x2="278" y2="320" class="l sng w2 dsh"/>
<text x="12" y="488" class="tb">丸・四角・三角を合わせると、右上がり</text>
<text x="12" y="510" class="tb tok">グループごとに見ると、右下がり</text>
<text x="12" y="534">第3の変数（グループ）の影響を取り除いた</text>
<text x="12" y="554">相関が偏相関係数。見かけとは別の関係が見える</text>
</svg>
