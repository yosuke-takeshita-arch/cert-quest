<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 838" role="img" aria-labelledby="fig-g-text-vectors-t fig-g-text-vectors-d">
<title id="fig-g-text-vectors-t">単語・文書の表し方：ワンホット・BoW・TF-IDF・分散表現</title>
<desc id="fig-g-text-vectors-d">語彙が犬・猫・車・走る・好きの5語の例。ワンホットは、語彙の数の長さのベクトルで、その単語の位置だけが1。どの2語も直交し、意味の近さを表せない。BoW は、文書ごとに単語の出現回数を並べ、語順は捨てる。TF-IDF は、その文書によく出て、他の文書にあまり出ない語ほど重みが大きく、どの文書にも出る語は小さい。分散表現は、単語を数百次元ほどの連続値のベクトルで表し、意味の近い単語ほど近い。2次元の図では、犬と猫が近く、車とバスが近く、動物と乗り物は離れる。</desc>
