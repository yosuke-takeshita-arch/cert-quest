<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 608" role="img" aria-labelledby="fig-g-multimodal-tasks-t fig-g-multimodal-tasks-d">
<title id="fig-g-multimodal-tasks-t">画像と言語のタスク：キャプション・VQA・Text-to-Image</title>
<desc id="fig-g-multimodal-tasks-d">3つのタスクの入力と出力。Image Captioning は、画像を入れると、その内容を説明する文が出る。VQA（Visual Question Answering）は、画像とその画像に関する質問の文を入れると、答えの文が出る。Text-to-Image は、文を入れると、その内容の画像が出る。Captioning は画像から文、Text-to-Image は文から画像で、向きが逆。NIC（Show and Tell）は、画像分類で事前学習した CNN をエンコーダにして、LSTM のデコーダが文を作る。</desc>
<text x="12" y="20" class="tb">Image Captioning：画像 → 文</text>
<rect x="12" y="34" width="124" height="46" class="fs sb" stroke-width="1.5"/>
<text x="74" y="52.5" text-anchor="middle">画像</text>
<text x="74" y="70.5" text-anchor="middle">（犬が走る写真）</text>
<line x1="136" y1="57" x2="168" y2="57" class="l sa w2"/>
<polyline points="161,60.85 168,57 161,53.15" class="l sa w2"/>
<rect x="170" y="34" width="138" height="46" class="fok sok" stroke-width="1.5"/>
<text x="239" y="52.5" text-anchor="middle">文：犬が草の上を</text>
<text x="239" y="70.5" text-anchor="middle">走っている</text>
<line x1="12" y1="104" x2="308" y2="104" class="l sb w1"/>
<text x="12" y="126" class="tb">VQA：画像＋質問 → 答え</text>
<rect x="12" y="140" width="124" height="46" class="fs sb" stroke-width="1.5"/>
<text x="74" y="158.5" text-anchor="middle">画像</text>
<text x="74" y="176.5" text-anchor="middle">（人の写った写真）</text>
<rect x="12" y="196" width="124" height="46" class="fs sb" stroke-width="1.5"/>
<text x="74" y="214.5" text-anchor="middle">質問：</text>
<text x="74" y="232.5" text-anchor="middle">何人いる？</text>
<text x="74" y="194" class="tb" text-anchor="middle">＋</text>
<line x1="136" y1="191" x2="168" y2="191" class="l sa w2"/>
<polyline points="161,194.85 168,191 161,187.15" class="l sa w2"/>
<rect x="170" y="168" width="138" height="46" class="fok sok" stroke-width="1.5"/>
<text x="239" y="186.5" text-anchor="middle">答えの文：</text>
<text x="239" y="204.5" text-anchor="middle">3人です</text>
<line x1="12" y1="296" x2="308" y2="296" class="l sb w1"/>
<text x="12" y="318" class="tb">Text-to-Image：文 → 画像</text>
<rect x="12" y="332" width="124" height="46" class="fs sb" stroke-width="1.5"/>
<text x="74" y="350.5" text-anchor="middle">文：</text>
<text x="74" y="368.5" text-anchor="middle">雪の中の赤いポスト</text>
<line x1="136" y1="355" x2="168" y2="355" class="l sa w2"/>
<polyline points="161,358.85 168,355 161,351.15" class="l sa w2"/>
<rect x="170" y="332" width="138" height="46" class="fas sa" stroke-width="1.5"/>
<text x="239" y="350.5" text-anchor="middle">画像</text>
<text x="239" y="368.5" text-anchor="middle">（赤いポストの絵）</text>
<line x1="12" y1="402" x2="308" y2="402" class="l sb w1"/>
<text x="12" y="426" class="tb">向きに注意</text>
<text x="12" y="448">Captioning＝画像から文</text>
<text x="12" y="468">Text-to-Image＝文から画像（逆向き）</text>
<line x1="12" y1="486" x2="308" y2="486" class="l sb w1"/>
<text x="12" y="510" class="tb">NIC（Show and Tell）の作り</text>
<rect x="12" y="526" width="90" height="44" class="fas sa" stroke-width="1.5"/>
<text x="57" y="543.5" text-anchor="middle">CNN</text>
<text x="57" y="561.5" text-anchor="middle">（画像を読む）</text>
<line x1="102" y1="548" x2="126" y2="548" class="l w2"/>
<polyline points="119,551.85 126,548 119,544.15" class="l w2"/>
<rect x="128" y="526" width="90" height="44" class="fok sok" stroke-width="1.5"/>
<text x="173" y="543.5" text-anchor="middle">LSTM</text>
<text x="173" y="561.5" text-anchor="middle">（文を作る）</text>
<line x1="218" y1="548" x2="242" y2="548" class="l w2"/>
<polyline points="235,551.85 242,548 235,544.15" class="l w2"/>
<rect x="244" y="526" width="64" height="44" class="fs sb" stroke-width="1.5"/>
<text x="276" y="552.5" class="tb" text-anchor="middle">文</text>
<text x="12" y="596" class="tm">画像分類で事前学習した CNN をエンコーダに</text>
</svg>
