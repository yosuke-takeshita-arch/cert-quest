<rect x="160" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="174.8" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="189.6" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="204.4" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="219.2" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="234" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="248.8" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="263.6" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="278.4" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="293.2" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<text x="19.4" y="166" class="tm" text-anchor="middle">1</text>
<text x="300.6" y="166" class="tm" text-anchor="middle">20</text>
<text x="160" y="166" class="tm" text-anchor="middle">1マスごとに1回更新</text>
<text x="12" y="192">2,000 ÷ 100 ＝ 20組</text>
<rect x="12" y="202" width="296" height="30" class="fas sa" stroke-width="1.5" rx="4"/>
<text x="160" y="222" class="tb ta" text-anchor="middle">1エポックで 20回 更新する</text>
<line x1="12" y1="248" x2="308" y2="248" class="l sb w1"/>
<text x="12" y="270" class="tb">② 5エポック＝1周を5回くり返す</text>
<rect x="12" y="282" width="52" height="24" class="fas sa" stroke-width="1.5"/>
<rect x="72" y="282" width="52" height="24" class="fas sa" stroke-width="1.5"/>
