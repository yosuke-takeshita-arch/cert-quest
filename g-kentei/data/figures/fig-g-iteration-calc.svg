<rect x="252" y="282" width="52" height="24" class="fas sa" stroke-width="1.5"/>
<text x="38" y="299" class="tb" text-anchor="middle">20回</text>
<text x="98" y="299" class="tb" text-anchor="middle">20回</text>
<text x="158" y="299" class="tb" text-anchor="middle">20回</text>
<text x="218" y="299" class="tb" text-anchor="middle">20回</text>
<text x="278" y="299" class="tb" text-anchor="middle">20回</text>
<text x="38" y="322" class="tm" text-anchor="middle">1周目</text>
<text x="278" y="322" class="tm" text-anchor="middle">5周目</text>
<rect x="12" y="334" width="296" height="30" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="354" class="tb tok" text-anchor="middle">20 × 5 ＝ 100回</text>
<text x="12" y="388" class="tm">ことばの式：イテレーション数</text>
<text x="12" y="406" class="tm">　＝（データ数 ÷ バッチサイズ）× エポック数</text>
<line x1="12" y1="420" x2="308" y2="420" class="l sb w1"/>
<text x="12" y="442" class="tb">取り違えやすい数</text>
<text x="12" y="464" class="tng">20回：1エポック分だけ（5倍していない）</text>
<text x="12" y="490" class="tng">500回：100×5。バッチサイズ×エポック数で、</text>
<text x="12" y="508" class="tm">　更新の回数ではない</text>
<text x="12" y="534" class="tng">10,000回：2,000×5。1件ずつ更新する</text>
<text x="12" y="552" class="tm">　オンライン学習（バッチサイズ1）の回数</text>
<text x="12" y="578" class="tm">100件まとめて1回なので、その100分の1</text>
</svg>
