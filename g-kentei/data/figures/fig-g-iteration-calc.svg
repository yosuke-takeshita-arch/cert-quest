<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" role="img" aria-labelledby="fig-g-iteration-calc-t fig-g-iteration-calc-d">
<title id="fig-g-iteration-calc-t">イテレーション数の計算：2,000件・バッチサイズ100・5エポック</title>
<desc id="fig-g-iteration-calc-d">何のための図か：訓練データ2,000件をバッチサイズ100でミニバッチ学習し、5エポック学習したとき、更新の回数（イテレーション）が100回になる理由を、問題と同じ数で見る。①2,000件の帯を100件ずつに区切ると、2,000÷100＝20組になる。1組ごとにパラメータを1回更新するので、全データを1周する1エポックで20回更新する。②5エポックはこの1周を5回くり返すので、20×5＝100回。ことばの式は、イテレーション数＝（データ数÷バッチサイズ）×エポック数。取り違えやすい数：20回は1エポック分だけ、500回はバッチサイズ×エポック数（100×5）で更新の回数ではない、10,000回はデータ数×エポック数（2,000×5）で、1件ずつ更新するオンライン学習の場合。</desc>
<text x="12" y="20" class="tb">更新の回数（イテレーション）を数える</text>
<text x="12" y="42" class="tm">何のための図か：2,000件を100件ずつ、5エポック</text>
<text x="12" y="60" class="tm">学習すると、なぜ 100回になるかを見る</text>
<text x="12" y="88" class="tb">① 1エポック＝2,000件を1周</text>
<text x="12" y="108" class="tm">帯が2,000件。1マスが100件（バッチサイズ）</text>
<rect x="12" y="118" width="296" height="30" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
<rect x="26.8" y="118" width="14.8" height="30" class="fas sa" stroke-width="1"/>
