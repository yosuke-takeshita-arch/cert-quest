<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 514" role="img" aria-labelledby="fig-g-vit-t fig-g-vit-d">
<title id="fig-g-vit-t">Vision Transformer（ViT）：画像をパッチの列にする</title>
<desc id="fig-g-vit-d">画像を同じ大きさの小さなパッチに切り分け、パッチを1列に並べる。各パッチを線形変換で埋め込みベクトルにし、位置の情報（位置埋め込み）を足す。先頭にクラス用のトークンを付け、Transformer のエンコーダに入れる。クラス用トークンの出力から、画像のクラスを分類する。畳み込みは使わない。大量のデータで事前学習すると高い性能が出る。</desc>
<text x="12" y="20" class="tb">① 画像を同じ大きさのパッチに切る</text>
<rect x="12" y="34" width="32" height="32" class="fas sb" stroke-width="1.5"/>
<rect x="44" y="34" width="32" height="32" class="fok sb" stroke-width="1.5"/>
<rect x="76" y="34" width="32" height="32" class="fwn sb" stroke-width="1.5"/>
<rect x="12" y="66" width="32" height="32" class="fok sb" stroke-width="1.5"/>
<rect x="44" y="66" width="32" height="32" class="fwn sb" stroke-width="1.5"/>
<rect x="76" y="66" width="32" height="32" class="fas sb" stroke-width="1.5"/>
<rect x="12" y="98" width="32" height="32" class="fwn sb" stroke-width="1.5"/>
<rect x="44" y="98" width="32" height="32" class="fas sb" stroke-width="1.5"/>
<rect x="76" y="98" width="32" height="32" class="fok sb" stroke-width="1.5"/>
<text x="122" y="74" class="tm">（図は 3×3。</text>
<text x="122" y="94" class="tm">論文は 16×16 画素</text>
<text x="122" y="114" class="tm">など）</text>
<line x1="12" y1="146" x2="308" y2="146" class="l sb w1"/>
<text x="12" y="170" class="tb">② 1列に並べて、単語のように扱う</text>
<rect x="12" y="192" width="34" height="28" class="fng sng" stroke-width="1.5"/>
<text x="29" y="210.5" class="tb" text-anchor="middle">CLS</text>
<rect x="54" y="192" width="24" height="28" class="fas sb" stroke-width="1.5"/>
<rect x="81" y="192" width="24" height="28" class="fok sb" stroke-width="1.5"/>
<rect x="108" y="192" width="24" height="28" class="fwn sb" stroke-width="1.5"/>
<rect x="135" y="192" width="24" height="28" class="fok sb" stroke-width="1.5"/>
<rect x="162" y="192" width="24" height="28" class="fwn sb" stroke-width="1.5"/>
<rect x="189" y="192" width="24" height="28" class="fas sb" stroke-width="1.5"/>
<rect x="216" y="192" width="24" height="28" class="fwn sb" stroke-width="1.5"/>
<rect x="243" y="192" width="24" height="28" class="fas sb" stroke-width="1.5"/>
<rect x="270" y="192" width="24" height="28" class="fok sb" stroke-width="1.5"/>
<text x="12" y="242" class="tm">CLS：クラス用のトークン（先頭に付ける）</text>
<line x1="12" y1="264" x2="308" y2="264" class="l sb w1"/>
<text x="12" y="288" class="tb">③ 埋め込み → Transformer</text>
<rect x="12" y="304" width="296" height="34" class="fs sb" stroke-width="1.5"/>
<text x="160" y="316.5" text-anchor="middle">各パッチを線形変換で埋め込む</text>
<text x="160" y="334.5" text-anchor="middle">＋ 位置の情報を足す</text>
<line x1="160" y1="338" x2="160" y2="356" class="l w2"/>
<polyline points="156.15,349 160,356 163.85,349" class="l w2"/>
<rect x="12" y="358" width="296" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="373.5" text-anchor="middle">Transformer のエンコーダ</text>
<text x="160" y="391.5" text-anchor="middle">（畳み込みは使わない）</text>
<line x1="160" y1="398" x2="160" y2="416" class="l w2"/>
<polyline points="156.15,409 160,416 163.85,409" class="l w2"/>
<rect x="12" y="418" width="296" height="34" class="fok sok" stroke-width="1.5"/>
<text x="160" y="439.5" class="tb" text-anchor="middle">CLS の出力でクラスを分類</text>
<text x="12" y="480" class="tb">大量のデータで事前学習すると高性能</text>
<text x="12" y="502" class="tm">データが少ないと CNN に劣りやすい</text>
</svg>
