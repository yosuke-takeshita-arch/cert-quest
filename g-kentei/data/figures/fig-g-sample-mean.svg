<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 626" role="img" aria-labelledby="fig-g-sample-mean-t fig-g-sample-mean-d">
<title id="fig-g-sample-mean-t">標本平均の分布：36個の平均をくり返し集めると、山が細くなる</title>
<desc id="fig-g-sample-mean-d">3段の図。①母集団（調べたい全体）は平均100、標準偏差12の分布で、正規分布とは限らない。例として右に長い形を描き、平均100からプラスマイナス12の88から112の範囲に色を付けている。②そこから36個を無作為に取り出して平均を出す。1回目の平均は98.7、2回目は101.9、3回目は100.4のように、取り出すたびに少しずつ違う（数は例）。これを何百回もくり返す。③平均の値だけを集めて分布を描くと、横軸は①と同じで、正規分布に近い細い山になる。山の中心は100のまま、標準偏差は、元のばらつきを個数のルートで割って、12割るルート36、つまり12割る6で2。98から102の範囲に約68パーセントが入る。点線は①の元の分布で、それより幅がずっと狭い。平均すると大きい値と小さい値が打ち消し合うため。36個ならばらつきは6分の1、4倍の144個なら12分の1になり、個数を4倍にするとばらつきは半分になる。</desc>
<text x="12" y="20" class="tb">① 母集団（調べたい全体）</text>
<text x="12" y="40" class="tm">平均100・標準偏差12。正規分布とは限らない</text>
