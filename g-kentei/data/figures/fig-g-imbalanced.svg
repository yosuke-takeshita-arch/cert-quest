<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 466" role="img" aria-labelledby="fig-g-imbalanced-t fig-g-imbalanced-d">
<title id="fig-g-imbalanced-t">不均衡データの対処：ダウンサンプリング・オーバーサンプリング・SMOTE</title>
<desc id="fig-g-imbalanced-d">点の数が大きく偏った2クラスのデータ。多数派は丸、少数派はひし形で描く。元データは丸が多くひし形が少ない。ダウンサンプリングは多数派を減らす。オーバーサンプリングは少数派を複製して増やす（同じ点が重なる）。SMOTEは、少数派の点とその近くの少数派の点を結ぶ線分の上に、新しい点を合成して増やす。複製と違い、少数派の判定領域を広く一般的にする。</desc>
