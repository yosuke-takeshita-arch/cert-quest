<rect x="76" y="242" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="98" y="262" class="tm" text-anchor="middle">○</text>
<rect x="120" y="242" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="142" y="262" class="tm" text-anchor="middle">○</text>
