<rect x="252" y="242" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="274" y="262" class="tm" text-anchor="middle">−∞</text>
<text x="12" y="292" class="tm">5語目</text>
<rect x="76" y="272" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="98" y="292" class="tm" text-anchor="middle">○</text>
<rect x="120" y="272" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="142" y="292" class="tm" text-anchor="middle">○</text>
<rect x="164" y="272" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="186" y="292" class="tm" text-anchor="middle">○</text>
<rect x="208" y="272" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="230" y="292" class="tm" text-anchor="middle">○</text>
<rect x="252" y="272" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="274" y="292" class="tm" text-anchor="middle">○</text>
<rect x="8" y="209" width="292" height="36" rx="4" class="l sa w2"/>
<text x="12" y="322" class="tm">○＝見てよい（スコアをそのまま使う）</text>
<text x="12" y="340" class="tm">−∞＝見ない（右上の三角＝自分より後ろ）</text>
<text x="12" y="366" class="tb ta">3語目の行（囲みの中）</text>
<text x="12" y="386" class="tok tb">1〜3語目は見てよい（自分も含む）</text>
<text x="12" y="406" class="tng tb">4・5語目は −∞（まだ作っていない後ろの語）</text>
<line x1="186" y1="414" x2="186" y2="426" class="l w2"/>
<polyline points="182.15,421 186,428 189.85,421" class="l w2"/>
<text x="12" y="446" class="tb">ソフトマックスに通すと（例）</text>
<text x="12" y="475" class="tm">重み</text>
<rect x="76" y="456" width="44" height="30" class="fok sok" stroke-width="1"/>
<text x="98" y="475" class="tb tok" text-anchor="middle">0.20</text>
<rect x="120" y="456" width="44" height="30" class="fok sok" stroke-width="1"/>
<text x="142" y="475" class="tb tok" text-anchor="middle">0.36</text>
<rect x="164" y="456" width="44" height="30" class="fok sok" stroke-width="1"/>
<text x="186" y="475" class="tb tok" text-anchor="middle">0.44</text>
<rect x="208" y="456" width="44" height="30" class="fng sng" stroke-width="1"/>
<text x="230" y="475" class="tb tng" text-anchor="middle">0</text>
<rect x="252" y="456" width="44" height="30" class="fng sng" stroke-width="1"/>
<text x="274" y="475" class="tb tng" text-anchor="middle">0</text>
<text x="12" y="506" class="tm">e の −∞ 乗は0。−∞ の所は重みがちょうど0</text>
</svg>
