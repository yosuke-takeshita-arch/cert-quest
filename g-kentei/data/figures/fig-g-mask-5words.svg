<text x="230" y="172" class="tm" text-anchor="middle">−∞</text>
<rect x="252" y="152" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="274" y="172" class="tm" text-anchor="middle">−∞</text>
<text x="12" y="202" class="tm">2語目</text>
<rect x="76" y="182" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="98" y="202" class="tm" text-anchor="middle">○</text>
<rect x="120" y="182" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="142" y="202" class="tm" text-anchor="middle">○</text>
<rect x="164" y="182" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="186" y="202" class="tm" text-anchor="middle">−∞</text>
<rect x="208" y="182" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="230" y="202" class="tm" text-anchor="middle">−∞</text>
<rect x="252" y="182" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="274" y="202" class="tm" text-anchor="middle">−∞</text>
<text x="12" y="232" class="tb ta">3語目</text>
<rect x="76" y="212" width="44" height="30" class="fok sok" stroke-width="1"/>
<text x="98" y="232" class="tb tok" text-anchor="middle">0.3</text>
<rect x="120" y="212" width="44" height="30" class="fok sok" stroke-width="1"/>
<text x="142" y="232" class="tb tok" text-anchor="middle">0.9</text>
