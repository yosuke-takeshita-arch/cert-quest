<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-g-mask-5words-t fig-g-mask-5words-d">
<title id="fig-g-mask-5words-t">デコーダの Self-Attention のマスク（5語の文で、3語目の位置から見る）</title>
<desc id="fig-g-mask-5words-d">5語の文（1語目〜5語目）のスコアの表。スコアは、ある語が別の語にどれだけ注目するかの点数。行は見る側の位置、列は見られる側の位置。文を作るとき後ろの語はまだ無いので、学習のときも各位置は自分より後ろの位置を見ないように、表の右上の三角（自分より後ろ）のスコアを マイナス無限大 にする。3語目の行を囲んで目立たせてある。3語目の行は、1語目・2語目・3語目（自分も含む）は見てよく、スコアは例で 0.3、0.9、1.1。4語目と5語目はまだ作っていない後ろの語なので マイナス無限大。この行をソフトマックスに通すと、重みは例で 0.20、0.36、0.44、0、0 になる。e の マイナス無限大 乗は0なので、マイナス無限大 の所の重みはちょうど0になり、残りの3つで合計1になる。</desc>
<text x="12" y="20" class="tb">5語の文のスコアの表（デコーダ）</text>
<text x="12" y="40" class="tm">スコア＝その語にどれだけ注目するかの点数</text>
<text x="12" y="58" class="tm">行＝見る側の位置　列＝見られる側の位置</text>
<text x="12" y="80" class="tm">文を作るとき後ろの語はまだ無い。だから</text>
<text x="12" y="98" class="tm">学習でも、自分より後ろの語を見ないよう隠す</text>
<text x="186" y="124" class="tb" text-anchor="middle">見られる側の位置（列）</text>
<text x="12" y="146" class="tb">見る側↓</text>
<text x="98" y="146" class="tm" text-anchor="middle">1語目</text>
<text x="142" y="146" class="tm" text-anchor="middle">2語目</text>
<text x="186" y="146" class="tm" text-anchor="middle">3語目</text>
<text x="230" y="146" class="tm" text-anchor="middle">4語目</text>
<text x="274" y="146" class="tm" text-anchor="middle">5語目</text>
<text x="12" y="172" class="tm">1語目</text>
<rect x="76" y="152" width="44" height="30" class="fs sb" stroke-width="1"/>
<text x="98" y="172" class="tm" text-anchor="middle">○</text>
<rect x="120" y="152" width="44" height="30" class="fbg sb" stroke-width="1"/>
<text x="142" y="172" class="tm" text-anchor="middle">−∞</text>
