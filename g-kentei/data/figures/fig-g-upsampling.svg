<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 542" role="img" aria-labelledby="fig-g-upsampling-t fig-g-upsampling-d">
<title id="fig-g-upsampling-t">アップサンプリング：逆プーリングと転置畳み込み</title>
<desc id="fig-g-upsampling-d">上は逆プーリング。最大値プーリングで、各2×2の窓の最大値の位置を記録しておく。小さくなった特徴マップの値を、記録した位置に戻し、ほかのマスは0にして4×4に広げる。下は転置畳み込み。2×2の入力の各値に2×2のフィルタを掛け、ストライド2でずらして並べると、4×4の出力になる。フィルタの値は学習で決められる。逆畳み込みと呼ばれるが、畳み込みの真の逆演算ではない。</desc>
