<circle cx="296" cy="144" r="5" class="fs sok"/>
<text x="292" y="112" class="tb tok" text-anchor="end">p＝1 で 0</text>
<text x="290" y="54" class="tb tng" text-anchor="end">p→0 で急に大きく</text>
<text x="36" y="44" class="tm" text-anchor="end">大</text>
<text x="36" y="150" class="tm" text-anchor="end">小</text>
<text x="296" y="170" class="tm" text-anchor="end">正解クラスの予測確率 p →</text>
<text x="12" y="192" class="tb">② 回帰：二乗誤差</text>
<rect x="40" y="204" width="256" height="110" class="sb" stroke-width="1"/>
<line x1="40" y1="314" x2="296" y2="314" class="l sm w1"/>
<line x1="40" y1="204" x2="40" y2="314" class="l sm w1"/>
<polyline points="48,216.57 51,221.09 54,225.49 57,229.77 60,233.94 63,238 66,241.94 69,245.77 72,249.49 75,253.09 78,256.57 81,259.94 84,263.2 87,266.34 90,269.37 93,272.29 96,275.09 99,277.77 102,280.34 105,282.8 108,285.14 111,287.37 114,289.49 117,291.49 120,293.37 123,295.14 126,296.8 129,298.34 132,299.77 135,301.09 138,302.29 141,303.37 144,304.34 147,305.2 150,305.94 153,306.57 156,307.09 159,307.49 162,307.77 165,307.94 168,308 171,307.94 174,307.77 177,307.49 180,307.09 183,306.57 186,305.94 189,305.2 192,304.34 195,303.37 198,302.29 201,301.09 204,299.77 207,298.34 210,296.8 213,295.14 216,293.37 219,291.49 222,289.49 225,287.37 228,285.14 231,282.8 234,280.34 237,277.77 240,275.09 243,272.29 246,269.37 249,266.34 252,263.2 255,259.94 258,256.57 261,253.09 264,249.49 267,245.77 270,241.94 273,238 276,233.94 279,229.77 282,225.49 285,221.09 288,216.57" class="l swn w3"/>
<circle cx="168" cy="308" r="5" class="fs sok"/>
<text x="168" y="274" class="tb tok" text-anchor="middle">差 0 で 0</text>
<text x="168" y="228" class="tb twn" text-anchor="middle">差が大きいほど急に増える</text>
<text x="296" y="334" class="tm" text-anchor="end">予測 − 正解 →</text>
<text x="12" y="366" class="tb">③ KL 情報量：分布の違い（P から Q へ）</text>
<text x="52" y="394" class="tb" text-anchor="middle">P</text>
<rect x="20" y="406" width="18" height="54" class="fs sa" stroke-width="1.5"/>
<rect x="42" y="457" width="18" height="3" class="fs sa" stroke-width="1.5"/>
<rect x="64" y="457" width="18" height="3" class="fs sa" stroke-width="1.5"/>
<line x1="12" y1="460" x2="92" y2="460" class="l sm w1"/>
<text x="152" y="394" class="tb" text-anchor="middle">Q</text>
<rect x="120" y="430" width="18" height="30" class="fs swn" stroke-width="1.5"/>
<rect x="142" y="445" width="18" height="15" class="fs swn" stroke-width="1.5"/>
<rect x="164" y="445" width="18" height="15" class="fs swn" stroke-width="1.5"/>
<line x1="112" y1="460" x2="192" y2="460" class="l sm w1"/>
<text x="206" y="420" class="tb">KL(P→Q)</text>
<text x="206" y="440" class="tb ta">≒ 0.37</text>
<text x="206" y="462" class="tb">KL(Q→P)</text>
<text x="206" y="482" class="tb twn">≒ 0.51</text>
<text x="12" y="506" class="tb">同じ分布なら 0。入れ替えると値が変わる</text>
<text x="12" y="526" class="tm">（非対称。距離ではない）</text>
<line x1="12" y1="542" x2="308" y2="542" class="l sb w1"/>
<text x="12" y="566" class="tb">使い分け</text>
<text x="12" y="588">分類 → 交差エントロピー</text>
<text x="12" y="608">回帰 → 二乗誤差（平均二乗誤差）</text>
</svg>
