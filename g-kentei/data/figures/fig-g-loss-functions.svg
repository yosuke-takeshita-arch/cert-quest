<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" role="img" aria-labelledby="fig-g-loss-functions-t fig-g-loss-functions-d">
<title id="fig-g-loss-functions-t">誤差関数：交差エントロピー・二乗誤差・KL 情報量</title>
<desc id="fig-g-loss-functions-d">上は分類で使う交差エントロピーのグラフ。横軸が正解クラスの予測確率p、縦軸が誤差。pが1に近いと誤差は0に近づき、pが0に近づくと誤差は急に大きくなる。中は回帰で使う二乗誤差のグラフ。予測と正解の差が大きいほど、二乗で急に大きくなる放物線。下はKL情報量で、2つの確率分布PとQの違いを表す。同じ分布なら0。PからQへ測る値とQからPへ測る値は違う（非対称）。例ではそれぞれ約0.37と約0.51。</desc>
<text x="12" y="20" class="tb">① 分類：交差エントロピー</text>
<rect x="40" y="32" width="256" height="118" class="sb" stroke-width="1"/>
<line x1="40" y1="150" x2="296" y2="150" class="l sm w1"/>
<line x1="40" y1="32" x2="40" y2="150" class="l sm w1"/>
