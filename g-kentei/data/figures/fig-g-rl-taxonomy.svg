<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1132" role="img" aria-labelledby="fig-g-rl-taxonomy-t fig-g-rl-taxonomy-d">
<title id="fig-g-rl-taxonomy-t">強化学習の手法の分類</title>
<desc id="fig-g-rl-taxonomy-d">困りごと：行動を決めるとき、この行動をとったら次に何が起きるかが分かっていれば、試す前に頭の中で先を読める。分からなければ、実際に試すしかない。例：ロボットが部屋A・B・Cを動き、部屋Cで報酬10。モデルベースは、部屋Bで右へ動けば部屋Cに移り報酬10、という環境の仕組み（モデル）を知っていて、動く前に A→B→C と行けば報酬が取れると計画する。モデルフリーは、仕組みを知らず、実際に動いてもらった報酬から見積もり（Q値など）を直していく（Q学習・SARSA）。使い分け：モデルベースは試す回数を減らせることがある（実機のロボットのように1回が高い場面）。モデルフリーは環境の仕組みが複雑で予測できなくても使える。注意：ここでのモデルは環境の振る舞いを予測するもので、学習するモデル（ニューラルネットワークなど）のことではない。数は説明のための例。下の図（手法の分類）：強化学習の手法を2つの見方で整理した地図。横は何を学ぶか。左がQ学習とSARSAのような価値ベース（行動の価値を推定して選ぶ）、右がREINFORCEのような方策ベース（行動の選び方を直接学ぶ）、その間がActor-Criticで、両方を使う。Actor-CriticとREINFORCEは方策勾配法の仲間。縦は環境のモデルを使うか。上のモデルベースは、環境のモデルで先読みして計画する動的計画法など。下のモデルフリーは、モデルを使わず試行錯誤の経験だけから学ぶ。価値ベースの土台はベルマン方程式で、価値は今の報酬と割り引いた次の状態の価値で表せる。ことばの式は、価値＝今の報酬＋割引率×次の価値。例として部屋Aで報酬0、次の部屋Bの価値10、割引率0.9なら、0.9×10＝9、0＋9＝9。</desc>
<text x="12" y="20" class="tb">モデルを使うか：先読みするか、試して学ぶか</text>
<text x="12" y="48" class="tb">① 困りごと</text>
<text x="12" y="68" class="tm">行動を決めるとき、『この行動をとったら次に</text>
<text x="12" y="88" class="tm">何が起きるか』が分かっていれば、試す前に</text>
<text x="12" y="108" class="tm">頭の中で先を読める。分からなければ、実際に</text>
<text x="12" y="128" class="tm">試すしかない</text>
<line x1="12" y1="142" x2="308" y2="142" class="l sb w1"/>
<text x="12" y="166" class="tb">② 例：ロボットが部屋 A・B・C を動く</text>
<rect x="20" y="178" width="80" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="60" y="198" class="tb" text-anchor="middle">部屋A</text>
<line x1="102" y1="193" x2="111" y2="193" class="l sm w2"/>
<polygon points="118,193 110.5,188.5 110.5,197.5" class="fm"/>
<rect x="120" y="178" width="80" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="198" class="tb" text-anchor="middle">部屋B</text>
<line x1="202" y1="193" x2="211" y2="193" class="l sm w2"/>
<polygon points="218,193 210.5,188.5 210.5,197.5" class="fm"/>
<rect x="220" y="178" width="80" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="260" y="198" class="tb" text-anchor="middle">部屋C</text>
<text x="260" y="226" class="tb tok" text-anchor="middle">報酬 10</text>
<text x="12" y="256" class="tb ta">モデルベース：先読みする</text>
<text x="12" y="276" class="tm">『部屋Bで右へ動けば部屋Cに移り、報酬10』</text>
<text x="12" y="296" class="tm">という環境の仕組み（モデル）を知っていて、</text>
<text x="12" y="316" class="tm">動く前に『A→B→C と行けば取れる』と計画する</text>
<text x="12" y="342" class="tb twn">モデルフリー：試して学ぶ</text>
<text x="12" y="362" class="tm">仕組みを知らず、実際に動いてもらった報酬</text>
<text x="12" y="382" class="tm">から、見積もり（Q値など）を直していく</text>
<text x="12" y="402" class="tm">（Q学習・SARSA）</text>
<text x="12" y="422" class="tm">（数は説明のための例）</text>
<line x1="12" y1="436" x2="308" y2="436" class="l sb w1"/>
<text x="12" y="460" class="tb">③ 使い分け</text>
<text x="12" y="480" class="tm">モデルベース：試す回数を減らせることがある</text>
<text x="12" y="500" class="tm">　（実機のロボットのように1回が高い場面）</text>
<text x="12" y="520" class="tm">モデルフリー：環境の仕組みが複雑で予測でき</text>
<text x="12" y="540" class="tm">　なくても使える</text>
<text x="12" y="564" class="tb">注意：ここでのモデル＝環境の振る舞いを予測</text>
<text x="12" y="588" class="tb">するもの。学習するモデル（ニューラルネット</text>
<text x="12" y="612" class="tb">ワークなど）のことではない</text>
<line x1="12" y1="622" x2="308" y2="622" class="l sb w1"/>
<g transform="translate(0,626)">
<text x="12" y="20" class="tb">何を学ぶか（横）× モデルを使うか（縦）</text>
<text x="60" y="46" class="tb ta" text-anchor="middle">価値ベース</text>
<text x="160" y="46" class="tb tok" text-anchor="middle">両方</text>
<text x="260" y="46" class="tb twn" text-anchor="middle">方策ベース</text>
<rect x="12" y="58" width="296" height="92" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="20" y="78" class="tb tm">モデルベース：モデルで先読み</text>
<rect x="16" y="90" width="96" height="50" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="64" y="120" class="tb" text-anchor="middle">動的計画法</text>
<rect x="12" y="162" width="296" height="156" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="20" y="182" class="tb tm">モデルフリー：試行錯誤だけで学ぶ</text>
<rect x="16" y="194" width="88" height="46" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="60" y="222" class="tb" text-anchor="middle">Q学習</text>
<rect x="16" y="250" width="88" height="46" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="60" y="278" class="tb" text-anchor="middle">SARSA</text>
<rect x="112" y="194" width="96" height="46" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="222" class="tb" text-anchor="middle">Actor-Critic</text>
<rect x="216" y="194" width="88" height="46" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="260" y="222" class="tb" text-anchor="middle">REINFORCE</text>
<line x1="116" y1="264" x2="304" y2="264" class="l swn w2"/>
<line x1="116" y1="258" x2="116" y2="264" class="l swn w2"/>
<line x1="304" y1="258" x2="304" y2="264" class="l swn w2"/>
<text x="210" y="288" class="tb twn" text-anchor="middle">方策勾配法の仲間</text>
<text x="12" y="346" class="tm">横軸：価値を学ぶ ←→ 方策を直接学ぶ</text>
<line x1="12" y1="362" x2="308" y2="362" class="l sb w1"/>
<text x="12" y="386" class="tb">価値ベースの土台：ベルマン方程式</text>
<text x="12" y="408">価値 ＝ 今の報酬 ＋ 割引率 × 次の価値</text>
<text x="12" y="428" class="ta">例：部屋A（報酬0、次の部屋Bの価値10、</text>
<text x="12" y="446" class="ta">　割引率0.9）→ 0.9×10＝9、0＋9＝9</text>
<text x="12" y="474" class="tm">Actor-Critic：方策（Actor）と</text>
<text x="12" y="494" class="tm">価値（Critic）の両方を学ぶ</text>
</g>
</svg>
