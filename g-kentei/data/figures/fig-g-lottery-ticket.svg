<text x="24" y="286" class="tb ta">太い青＝当たりくじ（6本／32本≒19％）</text>
<line x1="160" y1="298" x2="160.0" y2="306.4" class="l sm w1"/>
<polygon points="160,312 156.5,306.4 163.5,306.4" class="fm"/>
<rect x="12" y="318" width="296" height="194" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="338" class="tb">② 当たりくじの探し方（原論文の手順）</text>
<text x="24" y="360">1. ランダムな初期値で作り、学習する</text>
<text x="24" y="380">2. 値の小さい重みを取り除く</text>
<text x="24" y="400" class="tb ta">3. 残った重みを「最初の初期値」に戻す</text>
<text x="24" y="418" class="tm">　（学習後の値ではなく、1で使った値）</text>
<text x="24" y="438">4. その部分だけで学び直す</text>
<text x="24" y="458" class="tm">→ 2〜4 をくり返して小さくしていく</text>
<text x="24" y="482" class="tb">見つかった部分：元の10〜20％以下の大きさ</text>
<text x="24" y="500" class="tb tok">元と同等以上の精度に、より速く達した</text>
<line x1="160" y1="512" x2="160.0" y2="520.4" class="l sm w1"/>
<polygon points="160,526 156.5,520.4 163.5,520.4" class="fm"/>
<text x="12" y="548" class="tb">③ 同じ形でも、初期値で結果が変わる</text>
<rect x="12" y="558" width="144" height="104" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="84" y="580" class="tb" text-anchor="middle">最初の初期値</text>
<text x="84" y="598" class="tb" text-anchor="middle">に戻して学習</text>
<text x="84" y="626" class="tb tok" text-anchor="middle">同等以上の</text>
<text x="84" y="644" class="tb tok" text-anchor="middle">精度に届く</text>
<rect x="164" y="558" width="144" height="104" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="236" y="580" class="tb" text-anchor="middle">初期値を</text>
<text x="236" y="598" class="tb" text-anchor="middle">付け直して学習</text>
<text x="236" y="626" class="tb twn" text-anchor="middle">性能が</text>
<text x="236" y="644" class="tb twn" text-anchor="middle">落ちる</text>
<text x="12" y="686" class="tb">→ 当たったのは「形」と「初期値」の組</text>
<rect x="12" y="700" width="296" height="66" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="720" class="tb">混同しやすい点</text>
<text x="24" y="740">1つのネットワークの中の部分の話。教師と</text>
<text x="24" y="758">生徒の2つのモデルを使う蒸留とは別</text>
</svg>
