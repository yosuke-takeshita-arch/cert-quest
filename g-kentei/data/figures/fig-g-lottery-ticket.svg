<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 778" role="img" aria-labelledby="fig-g-lottery-ticket-t fig-g-lottery-ticket-d">
<title id="fig-g-lottery-ticket-t">宝くじ仮説：密なネットワークの中に、最初の初期値のままで学習すれば同じくらいの精度に届く小さな部分がある</title>
<desc id="fig-g-lottery-ticket-d">宝くじ仮説は、ランダムな初期値の密なネットワークの中に、単独で学習しても同じくらいの精度に届く小さな部分ネットワーク（当たりくじ）がある、という仮説。①図は4・4・4の点の間に32本の重み（線）を持つネットワークで、太い青の6本（32本の約19％）が当たりくじ。②原論文の探し方：1ランダムな初期値で作って学習する、2値の小さい重みを取り除く、3残った重みを学習後の値ではなく1で使った最初の初期値に戻す、4その部分だけで学び直す。2〜4をくり返して小さくしていく。見つかった部分は元の10〜20％以下の大きさで、元と同等以上の精度に、より速く達した。③同じ形でも、最初の初期値に戻して学習すると同等以上の精度に届くが、初期値を付け直して学習すると性能が落ちる。当たったのは形と初期値の組。混同しやすい点：1つのネットワークの中の部分の話で、教師と生徒の2つのモデルを使う蒸留とは別。</desc>
<text x="12" y="20" class="tb">宝くじ仮説：大きなネットの中に、</text>
<text x="12" y="40" class="tb">小さな「当たりくじ」が隠れている</text>
<text x="12" y="62" class="tm">ランダムな初期値の密なネットワークの中に、</text>
<text x="12" y="80" class="tm">単独で学習しても同じくらいの精度に届く</text>
<text x="12" y="98" class="tm">小さな部分ネットワークがある、という仮説</text>
<rect x="12" y="110" width="296" height="188" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="130" class="tb">① 密なネットワークと当たりくじ</text>
<text x="24" y="148" class="tm">線＝重み（4・4・4 の点の間に32本）</text>
