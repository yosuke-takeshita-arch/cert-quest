<line x1="160" y1="166" x2="250" y2="250" class="l sm w1"/>
<line x1="160" y1="194" x2="250" y2="194" class="l sm w1"/>
<line x1="160" y1="194" x2="250" y2="250" class="l sm w1"/>
<line x1="160" y1="222" x2="250" y2="166" class="l sm w1"/>
<line x1="160" y1="222" x2="250" y2="194" class="l sm w1"/>
