<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 594" role="img" aria-labelledby="fig-g-log-transform-t fig-g-log-transform-d">
<title id="fig-g-log-transform-t">対数変換：販売部数を10を底とする対数に直すと、桁の差が見やすくなる</title>
<desc id="fig-g-log-transform-d">例は5冊の本の販売部数で、数は説明のための例。Aは100部、Bは300部、Cは1,000部、Dは1万部、Eは100万部。①10を底とする対数は、10を何回掛けるとその数になるかの回数。100＝10×10なので2、300は100と1,000の間なので約2.5、1,000＝10×10×10なので3、1万は10を4回掛けた数なので4、100万は10を6回掛けた数なので6。②そのままの目盛り（0から100万部）に並べると、AからDの4冊は左端に重なり、Eだけが右端に離れる。③対数の目盛り（0から6）に並べると、Aが2、Bが約2.5、Cが3、Dが4、Eが6で、離れて並び差が見やすくなる。②と③で同じ本は同じ文字で示す。桁が1つ上がるごとに1だけ増えるので、100から1,000も、1万から10万も同じ＋1で、100万部のEも6まで縮む。ごく一部だけ極端に大きい特徴量（部数、年収、アクセス数など）を学習しやすい形にする、特徴量エンジニアリングの1つ。</desc>
<text x="12" y="20" class="tb">対数変換：桁で数え直して、差を見やすく</text>
<text x="12" y="42" class="tm">例：5冊の本の販売部数（数は説明のための例）</text>
<text x="12" y="68" class="tb">① 10を底とする対数（log₁₀）とは</text>
<text x="12" y="88" class="tm">10を何回掛けるとその数になるか、の回数</text>
<rect x="12" y="98" width="296" height="132" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="122" class="tb ta">A</text>
<text x="42" y="122" class="tm">100＝10×10</text>
<text x="296" y="122" class="tb" text-anchor="end">→ 2</text>
<text x="24" y="145" class="tb ta">B</text>
<text x="42" y="145" class="tm">300（100と1,000の間）</text>
<text x="296" y="145" class="tb" text-anchor="end">→ 約2.5</text>
<text x="24" y="168" class="tb ta">C</text>
<text x="42" y="168" class="tm">1,000＝10×10×10</text>
<text x="296" y="168" class="tb" text-anchor="end">→ 3</text>
<text x="24" y="191" class="tb ta">D</text>
<text x="42" y="191" class="tm">1万＝10を4回掛けた数</text>
<text x="296" y="191" class="tb" text-anchor="end">→ 4</text>
<text x="24" y="214" class="tb ta">E</text>
<text x="42" y="214" class="tm">100万＝10を6回掛けた数</text>
<text x="296" y="214" class="tb" text-anchor="end">→ 6</text>
<text x="12" y="260" class="tb">② そのままの目盛り（0〜100万部）</text>
<line x1="30" y1="294" x2="290" y2="294" class="l sm w1"/>
<line x1="30" y1="290" x2="30" y2="298" class="l sm w1"/>
<line x1="160" y1="290" x2="160" y2="298" class="l sm w1"/>
<line x1="290" y1="290" x2="290" y2="298" class="l sm w1"/>
<text x="30" y="314" class="tm" text-anchor="middle">0</text>
<text x="160" y="314" class="tm" text-anchor="middle">50万</text>
<text x="290" y="314" class="tm" text-anchor="middle">100万</text>
<circle cx="30.0" cy="294" r="4" class="fm"/>
<circle cx="30.1" cy="294" r="4" class="fm"/>
<circle cx="30.3" cy="294" r="4" class="fm"/>
<circle cx="32.6" cy="294" r="4" class="fm"/>
<circle cx="290.0" cy="294" r="4" class="fa sa"/>
<text x="36" y="282" class="tng">A〜D の4冊が左端に重なる</text>
<text x="290" y="282" class="tb ta" text-anchor="middle">E</text>
<text x="12" y="344" class="tb">③ 対数の目盛り（0〜6）。同じ本は同じ文字</text>
<line x1="30" y1="384" x2="290" y2="384" class="l sm w1"/>
<line x1="30" y1="380" x2="30" y2="388" class="l sm w1"/>
<text x="30.0" y="404" class="tm" text-anchor="middle">0</text>
<line x1="73.33333333333334" y1="380" x2="73.33333333333334" y2="388" class="l sm w1"/>
<text x="73.3" y="404" class="tm" text-anchor="middle">1</text>
<line x1="116.66666666666667" y1="380" x2="116.66666666666667" y2="388" class="l sm w1"/>
<text x="116.7" y="404" class="tm" text-anchor="middle">2</text>
<line x1="160" y1="380" x2="160" y2="388" class="l sm w1"/>
<text x="160.0" y="404" class="tm" text-anchor="middle">3</text>
<line x1="203.33333333333334" y1="380" x2="203.33333333333334" y2="388" class="l sm w1"/>
<text x="203.3" y="404" class="tm" text-anchor="middle">4</text>
<line x1="246.66666666666666" y1="380" x2="246.66666666666666" y2="388" class="l sm w1"/>
<text x="246.7" y="404" class="tm" text-anchor="middle">5</text>
<line x1="290" y1="380" x2="290" y2="388" class="l sm w1"/>
<text x="290.0" y="404" class="tm" text-anchor="middle">6</text>
<circle cx="116.7" cy="384" r="4" class="fa sa"/>
<text x="116.7" y="372" class="tb ta" text-anchor="middle">A</text>
<circle cx="137.3" cy="384" r="4" class="fa sa"/>
<text x="137.3" y="372" class="tb ta" text-anchor="middle">B</text>
<circle cx="160.0" cy="384" r="4" class="fa sa"/>
<text x="160.0" y="372" class="tb ta" text-anchor="middle">C</text>
<circle cx="203.3" cy="384" r="4" class="fa sa"/>
<text x="203.3" y="372" class="tb ta" text-anchor="middle">D</text>
<circle cx="290.0" cy="384" r="4" class="fa sa"/>
<text x="290.0" y="372" class="tb ta" text-anchor="middle">E</text>
<text x="12" y="434" class="tok">A〜E が離れて並び、差が見やすくなる</text>
<text x="12" y="460" class="tb">桁が1つ上がるごとに＋1 だけ増える</text>
<text x="12" y="480" class="tm">100→1,000 も 1万→10万 も、同じ＋1。</text>
<text x="12" y="498" class="tm">だから100万部の E も 6 まで縮む</text>
<text x="12" y="524" class="tb">何に使うか</text>
<text x="12" y="544" class="tm">ごく一部だけ極端に大きい特徴量（部数・</text>
<text x="12" y="562" class="tm">年収・アクセス数など）を、学習しやすい</text>
<text x="12" y="580" class="tm">形にする。特徴量エンジニアリングの1つ</text>
</svg>
