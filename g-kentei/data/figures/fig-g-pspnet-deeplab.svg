<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 628" role="img" aria-labelledby="fig-g-pspnet-deeplab-t fig-g-pspnet-deeplab-d">
<title id="fig-g-pspnet-deeplab-t">PSPNet と DeepLab：広い範囲の文脈を集める2つのやり方</title>
<desc id="fig-g-pspnet-deeplab-d">①PSPNet：特徴マップを、1×1・2×2・3×3・6×6 の区画に分け、区画ごとにプーリングして1つの値にまとめる。1×1 は画像全体の要約、6×6 は細かい区画ごとの様子になる。それぞれを元の大きさに戻し、元の特徴と並べて連結する。たとえば川に浮かぶボートを、見た目だけで車と取り違える誤りを、周りが川だという文脈で防ぐ。②DeepLab の Atrous 畳み込み：3×3 のフィルタの重み9個の間に隙間を空ける。rate＝1 は隙間なしで 3×3 を見る。rate＝2 は隙間1マスで 3＋2×1＝5、5×5 を見る。rate＝3 は隙間2マスで 3＋2×2＝7、7×7 を見る。重みはどれも9個のまま。rate は重みどうしの間隔。rate の違うものを並べたのが ASPP。区画に分けてまとめるのが PSPNet、間を空けて畳み込むのが DeepLab。</desc>
<text x="12" y="20" class="tb">PSPNet と DeepLab：広く見る2つの工夫</text>
<text x="12" y="46" class="tb">① PSPNet：区画に分けてまとめる</text>
<text x="12" y="66" class="tm">区画ごとに1つの値にまとめる（プーリング）</text>
