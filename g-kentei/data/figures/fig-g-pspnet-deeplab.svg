<rect x="12" y="208" width="296" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="228" text-anchor="middle">元の大きさに戻し、元の特徴と連結</text>
<text x="12" y="262">例：川に浮かぶボートを、見た目だけだと</text>
<text x="12" y="280">「車」と取り違える → 周りが川だという</text>
<text x="12" y="298">文脈を使えば防げる</text>
<line x1="12" y1="316" x2="308" y2="316" class="l sb w1"/>
