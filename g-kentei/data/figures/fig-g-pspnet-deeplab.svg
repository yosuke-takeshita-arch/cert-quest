<line x1="246" y1="129.67000000000002" x2="308" y2="129.67000000000002" class="l sa w1"/>
<text x="277" y="160" class="tb ta" text-anchor="middle">6×6</text>
<text x="43" y="180" class="tm" text-anchor="middle">全体の要約</text>
<text x="277" y="180" class="tm" text-anchor="middle">細かい様子</text>
<line x1="160" y1="190" x2="160" y2="200.4" class="l sm w1"/>
