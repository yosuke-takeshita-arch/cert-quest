<text x="127" y="212.56615358303097" class="tb tok">約521メル</text>
<line x1="266.5" y1="280" x2="266.5" y2="117.85432165337417" class="l sng w1 dsh"/>
<line x1="296" y1="280" x2="296" y2="109.59773729569733" class="l sng w1 dsh"/>
<line x1="60" y1="117.85432165337417" x2="266.5" y2="117.85432165337417" class="l sng w1 dot"/>
<line x1="60" y1="109.59773729569733" x2="296" y2="109.59773729569733" class="l sng w1 dot"/>
<rect x="57" y="109.59773729569733" width="6" height="8.3" class="fng sng" stroke-width="1.5"/>
<text x="190.5" y="149.60008877911147" class="tb tng">約138メル</text>
<text x="12" y="334" class="tok">1,000→2,000 Hz：1,000→約1,521メル</text>
<text x="12" y="352" class="tb tok">　差は約521メル（緑）</text>
<text x="12" y="372" class="tng">7,000→8,000 Hz：約2,702→約2,840メル</text>
<text x="12" y="390" class="tb tng">　差は約138メル（赤）</text>
<text x="12" y="410" class="tm">同じ 1,000 Hz の差でも、高い音では</text>
<text x="12" y="428" class="tm">約4分の1に縮めて数える（耳の感じ方に合わせる）</text>
<line x1="12" y1="444" x2="308" y2="444" class="l sb w1"/>
<text x="12" y="468" class="tb">② MFCC の作り方（例：1秒の声）</text>
<rect x="12" y="480" width="296" height="62" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="22" y="500" class="tb">1　短く切る</text>
<text x="22" y="518" class="tm">25ミリ秒ずつ、10ミリ秒ずらして切る</text>
<text x="22" y="536" class="tm">1秒なら約100区間（フレーム）</text>
<line x1="160" y1="542" x2="160.0" y2="550.4" class="l sm w1"/>
<polygon points="160,556 156.5,550.4 163.5,550.4" class="fm"/>
<rect x="12" y="556" width="296" height="62" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="22" y="576" class="tb">2　周波数に分ける</text>
<text x="22" y="594" class="tm">区間ごとに DFT で、どの高さの音が</text>
<text x="22" y="612" class="tm">どれだけ強いかを出す</text>
<line x1="160" y1="618" x2="160.0" y2="626.4" class="l sm w1"/>
<polygon points="160,632 156.5,626.4 163.5,626.4" class="fm"/>
<rect x="12" y="632" width="296" height="62" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="22" y="652" class="tb">3　メルで束ねる</text>
<text x="22" y="670" class="tm">メル尺度で並べた三角のフィルタで束ねる</text>
<text x="22" y="688" class="tm">低い音は細かく、高い音は大まかに</text>
<line x1="160" y1="694" x2="160.0" y2="702.4" class="l sm w1"/>
<polygon points="160,708 156.5,702.4 163.5,702.4" class="fm"/>
<rect x="12" y="708" width="296" height="44" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="22" y="728" class="tb">4　対数を取る</text>
<text x="22" y="746" class="tm">強さの対数（耳は強さも対数で感じる）</text>
<line x1="160" y1="752" x2="160.0" y2="760.4" class="l sm w1"/>
<polygon points="160,766 156.5,760.4 163.5,760.4" class="fm"/>
<rect x="12" y="766" width="296" height="62" class="fas sa" stroke-width="1.5" rx="4"/>
<text x="22" y="786" class="tb ta">5　もう一度分解</text>
<text x="22" y="804" class="tm">対数スペクトルをさらに分解（ケプストラム）</text>
<text x="22" y="822" class="ta">最初の12個＝声道の形（音色）</text>
<line x1="160" y1="828" x2="160.0" y2="836.4" class="l sm w1"/>
<polygon points="160,842 156.5,836.4 163.5,836.4" class="fm"/>
<rect x="12" y="842" width="296" height="84" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="22" y="862" class="tb tok">6　39個の数に並べる（1区間ごと）</text>
<text x="22" y="882" class="tok">12個＋音の強さ1個＝13個</text>
<text x="22" y="900" class="tok">＋その変化 13個＋変化の変化 13個</text>
<text x="22" y="918" class="tb tok">13×3＝39 → 1秒で約100個の39次元</text>
<text x="12" y="946" class="tm">MFCC は特徴量（入力の表し方）。声を作る</text>
<text x="12" y="964" class="tm">モデルでも、時系列の確率モデル（HMM）でもない</text>
</svg>
