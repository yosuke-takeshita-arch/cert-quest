<text x="12" y="946" class="tb">片方を減らすと、もう片方が増える</text>
<text x="12" y="966" class="tm">→ 合計がいちばん小さい所（最適）を選ぶ。</text>
<text x="12" y="984" class="tm">　交差検証で調整するのが一般的</text>
<text x="12" y="1004" class="tm">汎化誤差＝新しいデータでの外れ</text>
<text x="12" y="1022" class="tm">バイアス²＝バイアスの2乗（外れを2乗で</text>
<text x="12" y="1040" class="tm">数える量に合わせるため）</text>
<text x="12" y="1062" class="tb">この兼ね合いを、バイアス・バリアンスの</text>
<text x="12" y="1080" class="tb">トレードオフという</text>
</svg>
