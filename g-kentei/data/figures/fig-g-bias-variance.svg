<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 646" role="img" aria-labelledby="fig-g-bias-variance-t fig-g-bias-variance-d">
<title id="fig-g-bias-variance-t">バイアスとバリアンスのトレードオフ</title>
<desc id="fig-g-bias-variance-d">上のグラフは、横軸がモデルの複雑さ、縦軸が誤差。バイアス（二乗）は複雑になるほど下がり、バリアンスは上がる。2つを足した汎化誤差はU字になり、最も低い点が最適な複雑さ。それより単純だと未学習、複雑だと過学習。下は的当ての4枚。的の中心からのずれがバイアス、当たりのばらつきがバリアンスで、バイアスもバリアンスも小さいのが理想。</desc>
<text x="12" y="20" class="tb">① モデルを複雑にすると</text>
