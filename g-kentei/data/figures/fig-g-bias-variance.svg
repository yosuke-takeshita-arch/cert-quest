</g>
<text x="12" y="488" class="tm">中心からのずれ＝バイアス</text>
<text x="12" y="506" class="tm">当たりのばらつき＝バリアンス</text>
<text x="12" y="530" class="tm">例：曲線のデータに直線を当てると、どの訓練</text>
<text x="12" y="548" class="tm">データでも同じように外れる（バイアス大）</text>
<text x="12" y="566" class="tm">9次式を当てると、訓練データを替えるたびに</text>
<text x="12" y="584" class="tm">曲線の形が大きく変わる（バリアンス大）</text>
