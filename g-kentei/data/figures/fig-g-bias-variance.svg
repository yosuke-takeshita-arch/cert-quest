<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1090" role="img" aria-labelledby="fig-g-bias-variance-t fig-g-bias-variance-d">
<title id="fig-g-bias-variance-t">バイアスとバリアンス：予測の外れの2つの型と、そのトレードオフ</title>
<desc id="fig-g-bias-variance-d">①予測の外れには2つの型がある。いつも同じ向きに外れる外れは、モデルの考え方そのものが合っていないためで、バイアス（偏り）という。訓練データを替えるたびに外れ方が変わる外れは、たまたま手に入ったデータに振り回されたためで、バリアンス（ばらつき）という。②的当ての4枚で見る。中心が正解で、中心からのずれがバイアス、当たりのばらつきがバリアンス。左上はどちらも小さい理想。右上はバイアス小・バリアンス大で、複雑すぎるモデル（過学習）の姿。左下はバイアス大・バリアンス小で、単純すぎるモデル（未学習）の姿。例：曲線のデータに直線を当てると、どの訓練データでも同じように外れる（バイアス大）。9次式を当てると、訓練データを替えるたびに曲線の形が大きく変わる（バリアンス大）。③グラフは、横軸がモデルの複雑さ、縦軸が誤差。バイアスの2乗は複雑になるほど下がり、バリアンスは上がる。2つを足した汎化誤差（新しいデータでの外れ）はU字になり、最も低い点が最適な複雑さ。それより単純だと未学習、複雑だと過学習。片方を減らすともう片方が増えるので、合計がいちばん小さい所を選び、交差検証で調整するのが一般的。この兼ね合いをバイアス・バリアンスのトレードオフという。バイアスを2乗するのは、外れを2乗で数える量に合わせるため。</desc>
<text x="12" y="20" class="tb">バイアスとバリアンス：外れ方の2つの型</text>
<text x="12" y="48" class="tb">① 予測の外れには、2つの型がある</text>
<text x="12" y="70" class="tb ta">・いつも同じ向きに外れる</text>
<text x="12" y="88" class="tm">　＝考え方そのものが合っていない</text>
<text x="12" y="106" class="tm">　→ バイアス（偏り）</text>
<text x="12" y="128" class="tb ta">・訓練データを替えるたびに、外れ方が変わる</text>
<text x="12" y="146" class="tm">　＝たまたまのデータに振り回される</text>
<text x="12" y="164" class="tm">　→ バリアンス（ばらつき）</text>
