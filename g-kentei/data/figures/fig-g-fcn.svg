<text x="52" y="708" text-anchor="middle">500×500</text>
<text x="152" y="708" text-anchor="middle">約16×16</text>
<text x="256" y="708" text-anchor="middle">500×500</text>
<text x="117" y="636" class="tm" text-anchor="middle">縮小</text>
<text x="189" y="636" class="tm" text-anchor="middle">拡大</text>
<text x="12" y="732" class="tm">拡大だけだと境界がぼやける → 解像度の高い</text>
<text x="12" y="750" class="tm">途中の層（1/16 など）の予測も足して補う</text>
<line x1="12" y1="782" x2="308" y2="782" class="l sb w1"/>
<text x="12" y="804" class="tb">⑤ 試験で出る言い方</text>
<text x="12" y="824">FCN＝Fully Convolutional Network</text>
<text x="12" y="842" class="tm">（全部が畳み込み層。全結合層を持たない）</text>
<text x="12" y="860" class="tm">U-Net・SegNet など後続のモデルの土台</text>
<text x="12" y="878" class="tm">画素ごとの分類＝セマンティック</text>
<text x="12" y="896" class="tm">セグメンテーション。この分野の基本のモデル</text>
<text x="12" y="914" class="tm">欠点：細い物体の境界は粗くなりやすい</text>
</svg>
