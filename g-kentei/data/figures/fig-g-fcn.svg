<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 926" role="img" aria-labelledby="fig-g-fcn-t fig-g-fcn-d">
<title id="fig-g-fcn-t">FCN：全結合層を畳み込み層に置き換え、画素ごとに答える</title>
<desc id="fig-g-fcn-d">①したいこと：画像の画素1つ1つに何が写っているかを付けたい（セマンティックセグメンテーション）。例として猫の画素と背景の画素を塗り分ける升目。②困りごと：分類用のCNNは、画像→畳み込み層→全結合層→答え「猫」と進み、全結合層が画像全体を1つの答えにまとめるので、どの画素が何かは出ない。入力の大きさも224×224などに固定される。③FCNは全結合層を畳み込み層に置き換える。畳み込みは小さな窓を画像の上でずらしながら同じ計算をするので、答えが場所ごとに地図のまま残る。これを予測の地図（場所ごとの答えの表）と呼ぶ。どの大きさの画像にも使える。④例：500×500の画像は、途中で縦横を半分にする縮小を5回通るので2×2×2×2×2＝32分の1になり、地図の一辺は500÷32≒15.6で約16×16。これを拡大して元の500×500に戻す。拡大だけだと境界がぼやけるので、解像度の高い途中の層（1/16など）の予測も足して細部を補う。⑤FCNはFully Convolutional Networkの略で、全部が畳み込み層、全結合層を持たない。どんな大きさの画像も入れられ、U-NetやSegNetなど後続のモデルの土台。欠点は細い物体の境界が粗くなりやすいこと。</desc>
<text x="12" y="20" class="tb">FCN：画素ごとに答える、畳み込みだけの CNN</text>
<text x="12" y="48" class="tb">① したいこと</text>
