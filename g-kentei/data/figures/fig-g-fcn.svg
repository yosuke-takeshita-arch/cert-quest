<text x="288" y="267" class="tb tng" text-anchor="middle">猫</text>
<text x="12" y="304" class="tm">全結合層が、画像全体を1つの答えにまとめる</text>
<text x="12" y="322" class="tb tng">→『どの画素が何か』は出ない</text>
<text x="12" y="340" class="tm">入力の大きさも固定（例：224×224）</text>
<line x1="12" y1="354" x2="308" y2="354" class="l sb w1"/>
<text x="12" y="376" class="tb">③ 全結合層を、畳み込み層に置き換える</text>
