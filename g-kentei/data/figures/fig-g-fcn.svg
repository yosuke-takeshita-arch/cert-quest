<text x="12" y="446" class="tb tok">右端の升目＝予測の地図（場所ごとの答えの表）</text>
<text x="12" y="468" class="tm">畳み込みは、小さな窓を画像の上でずらして</text>
<text x="12" y="486" class="tm">同じ計算をする → 答えが場所ごとに、地図の</text>
<text x="12" y="504" class="tm">まま残る。どの大きさの画像にも使える</text>
<line x1="12" y1="518" x2="308" y2="518" class="l sb w1"/>
<text x="12" y="540" class="tb">④ 例：500×500 の画像を入れると</text>
<text x="12" y="560" class="tm">途中で縦横を半分にする縮小を、5回通る</text>
<text x="12" y="578" class="tm">→ 2×2×2×2×2＝32 分の1の大きさ</text>
<text x="12" y="596" class="tm">地図の一辺＝500÷32≒15.6 → 約16×16</text>
<rect x="12" y="610" width="80" height="80" class="fas sa" stroke-width="1.5"/>
