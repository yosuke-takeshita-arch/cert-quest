<text x="136" y="78">画像の画素 1つ1つに</text>
<text x="136" y="96">『何が写っているか』を</text>
<text x="136" y="114">付けたい</text>
<text x="136" y="140" class="tm">例：猫の画素と、</text>
<text x="136" y="158" class="tm">背景の画素を塗り分ける</text>
