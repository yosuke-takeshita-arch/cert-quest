<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 428" role="img" aria-labelledby="fig-g-grid-random-search-t fig-g-grid-random-search-d">
<title id="fig-g-grid-random-search-t">グリッドサーチとランダムサーチ</title>
<desc id="fig-g-grid-random-search-d">2つのハイパーパラメータのうち、片方だけが結果に大きく効く場合の探索の比較。左のグリッドサーチは3×3の格子で9点を試すが、効くパラメータの値は3通りしか試せない。右のランダムサーチは同じ9点をランダムに選ぶので、効くパラメータの値を9通り試せる。同じ試行回数でも、効くパラメータを細かく調べられる。</desc>
<text x="12" y="20" class="tb">同じ 9 回の試行で、何通り試せるか</text>
<text x="82" y="50" class="tb" text-anchor="middle">グリッド</text>
