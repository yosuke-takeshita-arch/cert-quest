<line x1="271.8" y1="64" x2="271.8" y2="78" class="l sa w2"/>
<line x1="287.2" y1="64" x2="287.2" y2="78" class="l sa w2"/>
<line x1="297" y1="64" x2="297" y2="78" class="l sa w2"/>
<rect x="164" y="92" width="140" height="140" class="sb" stroke-width="1"/>
