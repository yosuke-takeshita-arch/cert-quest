<line x1="35.8" y1="64" x2="35.8" y2="78" class="l sa w2"/>
<line x1="82" y1="64" x2="82" y2="78" class="l sa w2"/>
<line x1="128.2" y1="64" x2="128.2" y2="78" class="l sa w2"/>
