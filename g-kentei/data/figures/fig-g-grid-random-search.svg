<line x1="128.2" y1="92" x2="128.2" y2="232" class="l sm w1 dot"/>
<circle cx="35.8" cy="208.2" r="5" class="fs sa" stroke-width="2"/>
<circle cx="35.8" cy="162" r="5" class="fs sa" stroke-width="2"/>
<circle cx="35.8" cy="115.8" r="5" class="fs sa" stroke-width="2"/>
<circle cx="82" cy="208.2" r="5" class="fs sa" stroke-width="2"/>
<circle cx="82" cy="162" r="5" class="fs sa" stroke-width="2"/>
<circle cx="82" cy="115.8" r="5" class="fs sa" stroke-width="2"/>
<circle cx="128.2" cy="208.2" r="5" class="fs sa" stroke-width="2"/>
<circle cx="128.2" cy="162" r="5" class="fs sa" stroke-width="2"/>
<circle cx="128.2" cy="115.8" r="5" class="fs sa" stroke-width="2"/>
<text x="82" y="252" class="tb tng" text-anchor="middle">値：3 通り</text>
<text x="234" y="50" class="tb" text-anchor="middle">ランダム</text>
<rect x="164" y="62" width="140" height="18" class="fs sb" stroke-width="1"/>
<line x1="175.2" y1="64" x2="175.2" y2="78" class="l sa w2"/>
<line x1="192" y1="64" x2="192" y2="78" class="l sa w2"/>
