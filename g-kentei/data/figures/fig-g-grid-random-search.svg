<text x="234" y="252" class="tb tok" text-anchor="middle">値：9 通り</text>
<text x="12" y="290" class="tm">上の帯：効くパラメータだけを見たとき</text>
<text x="12" y="310" class="tm">横軸＝効くパラメータ、縦軸＝効かない</text>
<line x1="12" y1="326" x2="308" y2="326" class="l sb w1"/>
<text x="12" y="350" class="tb">グリッド：組み合わせをすべて試す</text>
<text x="12" y="370">　→ パラメータが増えると組み合わせが爆発</text>
<text x="12" y="396" class="tb">ランダム：範囲から選んだ組を決めた回数</text>
<text x="12" y="416">　→ 効くパラメータの値を多様に試せる</text>
</svg>
