<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 722" role="img" aria-labelledby="fig-g-lime-shap-t fig-g-lime-shap-d">
<title id="fig-g-lime-shap-t">LIME・SHAP・Permutation Importance</title>
<desc id="fig-g-lime-shap-d">3つの説明手法。LIME は、説明したい1件の予測のまわりで入力を少しずつ変えたデータを作り、その近くだけで、元のモデルの振る舞いを直線のような解釈しやすいモデルでまねる。どんな分類器にも使える。SHAP は、協力ゲーム理論のシャープレイ値の考え方で、基準の予測値から、各特徴量の寄与を足し引きして、その予測の値に至る様子を示す。Permutation Importance は、ある特徴量の列だけをランダムに並べ替え、予測精度がどれだけ落ちるかでその特徴量の重要度を測る。LIME と SHAP は個々の予測の説明（局所）、Permutation Importance はモデル全体の重要度（大域）。</desc>
<text x="12" y="20" class="tb">① LIME：まわりだけ、直線で近似</text>
<rect x="12" y="34" width="296" height="130" class="fs sb" stroke-width="1.5"/>
<polyline points="147,42 153.62,44.85 160.09,47.7 166.29,50.55 172.08,53.4 177.34,56.25 181.96,59.1 185.85,61.95 188.94,64.8 191.16,67.65 192.49,70.5 192.91,73.35 192.42,76.2 191.06,79.05 188.88,81.9 185.95,84.75 182.35,87.6 178.19,90.45 173.59,93.3 168.67,96.15 163.58,99 158.45,101.85 153.42,104.7 148.64,107.55 144.23,110.4 140.31,113.25 137.01,116.1 134.41,118.95 132.6,121.8 131.64,124.65 131.57,127.5 132.41,130.35 134.16,133.2 136.79,136.05 140.26,138.9 144.5,141.75 149.43,144.6 154.95,147.45 160.94,150.3 167.28,153.15 173.84,156" class="l sm w2"/>
<circle cx="142.81" cy="85.58" r="3" class="fa sa"/>
<circle cx="151.69" cy="73.5" r="3" class="fa sa"/>
<circle cx="180.8" cy="119.8" r="3" class="fok sok"/>
<circle cx="130.39" cy="112.06" r="3" class="fa sa"/>
<circle cx="131.87" cy="81.82" r="3" class="fa sa"/>
<circle cx="186.6" cy="85.23" r="3" class="fok sok"/>
<circle cx="152.32" cy="90.31" r="3" class="fa sa"/>
<circle cx="165.05" cy="107.51" r="3" class="fok sok"/>
<circle cx="154.97" cy="97.73" r="3" class="fa sa"/>
<circle cx="177.06" cy="92.96" r="3" class="fok sok"/>
<circle cx="133.73" cy="112.97" r="3" class="fa sa"/>
<circle cx="185.41" cy="71.16" r="3" class="fa sa"/>
<circle cx="147.88" cy="76.52" r="3" class="fa sa"/>
<circle cx="169.67" cy="72" r="3" class="fa sa"/>
<circle cx="152.5" cy="124.44" r="3" class="fok sok"/>
<circle cx="188.12" cy="112.71" r="3" class="fok sok"/>
<circle cx="163.58" cy="99" r="6" class="fng sng"/>
<circle cx="163.58" cy="99" r="44" class="sa w1 dsh l"/>
<line x1="149.58" y1="63" x2="177.58" y2="135" class="l swn w2"/>
<text x="12" y="186">赤い大きな点＝説明したい1件の予測</text>
<text x="12" y="206">破線の円の中だけで、太い直線に近似する</text>
<text x="12" y="226" class="tm">1件ずつの説明（局所的）・どの分類器にも</text>
<line x1="12" y1="250" x2="308" y2="250" class="l sb w1"/>
<text x="12" y="274" class="tb">② SHAP：各特徴量の寄与を足し引き</text>
<line x1="100" y1="308" x2="100" y2="436" class="l sm w1 dsh"/>
<text x="100" y="302" class="tm" text-anchor="middle">基準</text>
<rect x="100" y="318" width="50" height="20" class="fok sok" stroke-width="1.5"/>
<text x="12" y="333">特徴量 A</text>
<text x="158" y="333" class="tb tok">＋</text>
<rect x="126" y="348" width="24" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="363">特徴量 B</text>
<text x="158" y="363" class="tb tng">－</text>
<rect x="126" y="378" width="34" height="20" class="fok sok" stroke-width="1.5"/>
<text x="12" y="393">特徴量 C</text>
<text x="168" y="393" class="tb tok">＋</text>
<line x1="160" y1="408" x2="160" y2="432" class="l sa w2"/>
<line x1="100" y1="420" x2="160" y2="420" class="l sa w1"/>
<text x="160" y="450" class="tb ta" text-anchor="middle">この予測</text>
<text x="12" y="466" class="tm">緑＝予測を上げた　赤＝下げた</text>
<text x="12" y="488" class="tm">シャープレイ値で配分（1件ずつの説明）</text>
<line x1="12" y1="510" x2="308" y2="510" class="l sb w1"/>
<text x="12" y="534" class="tb">③ Permutation Importance：並べ替える</text>
<text x="12" y="569">特徴量 A</text>
<rect x="92" y="554" width="110" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="603">特徴量 B</text>
<rect x="92" y="588" width="40" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="637">特徴量 C</text>
<rect x="92" y="622" width="6" height="20" class="fng sng" stroke-width="1.5"/>
<text x="92" y="664" class="tm">精度の下がり幅（長い＝重要）</text>
<text x="12" y="688">その列だけをランダムに並べ替える</text>
<text x="12" y="710" class="tb">→ モデル全体での重要度（大域的）</text>
</svg>
