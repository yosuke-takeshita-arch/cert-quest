<circle cx="163.58" cy="99" r="6" class="fng sng"/>
<circle cx="163.58" cy="99" r="44" class="sa w1 dsh l"/>
<line x1="149.58" y1="63" x2="177.58" y2="135" class="l swn w2"/>
<text x="12" y="186">赤い大きな点＝説明したい1件の予測</text>
<text x="12" y="206">破線の円の中だけで、太い直線に近似する</text>
<text x="12" y="226" class="tm">1件ずつの説明（局所的）・どの分類器にも</text>
<line x1="12" y1="250" x2="308" y2="250" class="l sb w1"/>
<text x="12" y="274" class="tb">④ SHAP：各特徴量の寄与を足し引き</text>
<line x1="100" y1="308" x2="100" y2="436" class="l sm w1 dsh"/>
<text x="100" y="302" class="tm" text-anchor="middle">基準</text>
<rect x="100" y="318" width="50" height="20" class="fok sok" stroke-width="1.5"/>
<text x="12" y="333">特徴量 A</text>
<text x="158" y="333" class="tb tok">＋</text>
<rect x="126" y="348" width="24" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="363">特徴量 B</text>
<text x="158" y="363" class="tb tng">－</text>
<rect x="126" y="378" width="34" height="20" class="fok sok" stroke-width="1.5"/>
<text x="12" y="393">特徴量 C</text>
<text x="168" y="393" class="tb tok">＋</text>
<line x1="160" y1="408" x2="160" y2="432" class="l sa w2"/>
<line x1="100" y1="420" x2="160" y2="420" class="l sa w1"/>
<text x="160" y="450" class="tb ta" text-anchor="middle">この予測</text>
<text x="12" y="466" class="tm">緑＝予測を上げた　赤＝下げた</text>
<text x="12" y="488" class="tm">シャープレイ値で配分（1件ずつの説明）</text>
<line x1="12" y1="510" x2="308" y2="510" class="l sb w1"/>
<text x="12" y="534" class="tb">⑤ Permutation Importance：並べ替える</text>
<text x="12" y="569">特徴量 A</text>
<rect x="92" y="554" width="110" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="603">特徴量 B</text>
<rect x="92" y="588" width="40" height="20" class="fng sng" stroke-width="1.5"/>
<text x="12" y="637">特徴量 C</text>
<rect x="92" y="622" width="6" height="20" class="fng sng" stroke-width="1.5"/>
<text x="92" y="664" class="tm">精度の下がり幅（長い＝重要）</text>
<text x="12" y="688">その列だけをランダムに並べ替える</text>
<text x="12" y="710" class="tb">→ モデル全体での重要度（大域的）</text>
</g>
</svg>
