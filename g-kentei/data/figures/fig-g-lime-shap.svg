<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1144" role="img" aria-labelledby="fig-g-lime-shap-t fig-g-lime-shap-d">
<title id="fig-g-lime-shap-t">説明可能AI（XAI）：なぜ予測の理由が要るか、と LIME・SHAP・Permutation Importance</title>
<desc id="fig-g-lime-shap-d">なぜ予測の理由が要るか：ディープラーニングのような複雑なモデルは、精度が高くても、なぜその答えを出したかが外から分かりにくい（ブラックボックス）。例：ローン審査のモデルが否決と出したとき、年収に比べて借入額が多いことが一番効いたと示せれば、担当者は本人に説明できる。おかしな根拠（例：住所の一部）で判断していれば、誤りに気づける。説明の2種類：局所的な説明は1件の予測の理由（LIME・SHAP）、大域的な説明はモデル全体がどんな特徴を重く見ているか（Permutation Importance）。予測の理由を人に分かる形で示す技術や考え方を XAI（説明可能 AI）と呼ぶ。精度が高いことと、根拠が分かりやすいことは別。下の図：3つの説明手法。LIME は、説明したい1件の予測のまわりで入力を少しずつ変えたデータを作り、その近くだけで、元のモデルの振る舞いを直線のような解釈しやすいモデルでまねる。どんな分類器にも使える。SHAP は、協力ゲーム理論のシャープレイ値の考え方で、基準の予測値から、各特徴量の寄与を足し引きして、その予測の値に至る様子を示す。Permutation Importance は、ある特徴量の列だけをランダムに並べ替え、予測精度がどれだけ落ちるかでその特徴量の重要度を測る。LIME と SHAP は個々の予測の説明（局所）、Permutation Importance はモデル全体の重要度（大域）。</desc>
<text x="12" y="20" class="tb">XAI：予測の理由を、人に分かる形で示す</text>
<text x="12" y="48" class="tb">① なぜ予測の理由が要るか</text>
<text x="12" y="68" class="tm">ディープラーニングのような複雑なモデルは、</text>
<text x="12" y="88" class="tm">精度が高くても、なぜその答えを出したかが</text>
<text x="12" y="108" class="tm">外から分かりにくい（ブラックボックス）</text>
<text x="12" y="132">例：ローン審査のモデルが『否決』と出した</text>
<text x="12" y="154" class="tm">・『年収に比べて借入額が多いことが一番効い</text>
<text x="12" y="176" class="tm">　た』と示せれば、担当者は本人に説明できる</text>
<text x="12" y="198" class="tm">・おかしな根拠（例：住所の一部）で判断して</text>
<text x="12" y="220" class="tm">　いれば、誤りに気づける</text>
<line x1="12" y1="234" x2="308" y2="234" class="l sb w1"/>
<text x="12" y="258" class="tb">② 説明の2種類</text>
<text x="12" y="278" class="tm">局所的な説明＝1件の予測の理由</text>
<text x="12" y="298" class="tm">　（LIME・SHAP。下の③④）</text>
<text x="12" y="318" class="tm">大域的な説明＝モデル全体が、どんな特徴を</text>
<text x="12" y="338" class="tm">　重く見ているか（Permutation Importance。⑤）</text>
<text x="12" y="362" class="tb ta">予測の理由を示す技術や考え方＝XAI</text>
<text x="12" y="386" class="tb ta">（Explainable AI。説明可能な AI）</text>
<text x="12" y="408" class="tm">精度が高いことと、根拠が分かりやすいことは別</text>
<line x1="12" y1="418" x2="308" y2="418" class="l sb w1"/>
<g transform="translate(0,422)">
<text x="12" y="20" class="tb">③ LIME：まわりだけ、直線で近似</text>
<rect x="12" y="34" width="296" height="130" class="fs sb" stroke-width="1.5"/>
<polyline points="147,42 153.62,44.85 160.09,47.7 166.29,50.55 172.08,53.4 177.34,56.25 181.96,59.1 185.85,61.95 188.94,64.8 191.16,67.65 192.49,70.5 192.91,73.35 192.42,76.2 191.06,79.05 188.88,81.9 185.95,84.75 182.35,87.6 178.19,90.45 173.59,93.3 168.67,96.15 163.58,99 158.45,101.85 153.42,104.7 148.64,107.55 144.23,110.4 140.31,113.25 137.01,116.1 134.41,118.95 132.6,121.8 131.64,124.65 131.57,127.5 132.41,130.35 134.16,133.2 136.79,136.05 140.26,138.9 144.5,141.75 149.43,144.6 154.95,147.45 160.94,150.3 167.28,153.15 173.84,156" class="l sm w2"/>
