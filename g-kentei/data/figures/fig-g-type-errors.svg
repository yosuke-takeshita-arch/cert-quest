<text x="186" y="544" class="tm">4回は正しく棄却</text>
<text x="12" y="576" class="tb twn">→ 5回に1回は見逃す（β＝1−0.8＝0.2）</text>
<line x1="12" y1="590" x2="308" y2="590" class="l sb w1"/>
<text x="12" y="612" class="tb">③ 決め方が違う</text>
<text x="12" y="632">α：データを見る前に、自分で決める（0.05 など）</text>
<text x="12" y="654">β：自分では選べない</text>
<text x="12" y="672" class="tm">　本当の差の大きさで決まり、差が小さいほど</text>
<text x="12" y="690" class="tm">　見逃しやすい（β が大きい）</text>
<text x="12" y="712" class="tb">α を小さく（厳しく）すると、β は大きくなる</text>
<text x="12" y="730" class="tm">（本物の差も見逃しやすくなる）</text>
<line x1="12" y1="744" x2="308" y2="744" class="l sb w1"/>
<text x="12" y="766" class="tb">④ 試験で出る言い方</text>
