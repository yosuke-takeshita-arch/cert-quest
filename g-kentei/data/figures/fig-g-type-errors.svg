<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 852" role="img" aria-labelledby="fig-g-type-errors-t fig-g-type-errors-d">
<title id="fig-g-type-errors-t">第一種の過誤と第二種の過誤：検定の2つの向きの間違い</title>
<desc id="fig-g-type-errors-d">①検定の結論はどちら向きにも間違える。例として帰無仮説を新しい薬は効かないとし、効くと言えたら棄却する。表は、本当は効かない薬か効く薬かと、棄却しない（効くと言えず）か棄却する（効くと判定）かの4通り。本当は効かないのに棄却すると第一種の過誤（確率α）、棄却しなければ正しい。本当は効くのに棄却しないと第二種の過誤（確率β）、棄却すれば正しい（確率1−β、検出力）。第一種の過誤は無いものを有ると言う偽陽性、第二種の過誤は有るものを見逃す偽陰性に当たる。②数で見る。α＝0.05なら、効かない薬で同じ実験と検定を100回すると、平均5回ほど誤って効くと出る。検出力0.8なら、本当に効く薬で同じことを5回すると、1回は見逃す（β＝1−0.8＝0.2）。③αはデータを見る前に自分で決める。βは自分では選べず、本当の差の大きさで決まり、差が小さいほど見逃しやすい。αを小さく（厳しく）するとβは大きくなる。④αは第一種の過誤の確率で有意水準、βは第二種の過誤の確率、検出力は1−β。</desc>
<text x="12" y="20" class="tb">第一種・第二種の過誤：2つの向きの間違い</text>
<text x="12" y="48" class="tb">① 検定の結論は、どちら向きにも間違える</text>
<text x="12" y="68" class="tm">例：帰無仮説を『新しい薬は効かない』とする</text>
<text x="12" y="86" class="tm">（効くと言えたら、帰無仮説を棄却する）</text>
<text x="140" y="112" class="tb" text-anchor="middle">棄却しない</text>
<text x="140" y="130" class="tm" text-anchor="middle">（効くと言えず）</text>
<text x="252" y="112" class="tb" text-anchor="middle">棄却する</text>
<text x="252" y="130" class="tm" text-anchor="middle">（効くと判定）</text>
<text x="12" y="166">本当は</text>
<text x="12" y="184" class="tb">効かない</text>
<text x="12" y="222">本当は</text>
<text x="12" y="240" class="tb">効く</text>
<rect x="84" y="142" width="112" height="56" class="fok sok" stroke-width="1"/>
<text x="140" y="175" class="tb" text-anchor="middle">正しい</text>
<rect x="196" y="142" width="112" height="56" class="fng sng" stroke-width="1"/>
<text x="252" y="168" class="tb tng" text-anchor="middle">第一種の過誤</text>
<text x="252" y="186" class="tm" text-anchor="middle">確率 α</text>
<rect x="84" y="198" width="112" height="56" class="fwn swn" stroke-width="1"/>
<text x="140" y="224" class="tb twn" text-anchor="middle">第二種の過誤</text>
<text x="140" y="242" class="tm" text-anchor="middle">確率 β</text>
<rect x="196" y="198" width="112" height="56" class="fok sok" stroke-width="1"/>
<text x="252" y="224" class="tb" text-anchor="middle">正しい</text>
<text x="252" y="242" class="tm" text-anchor="middle">確率 1−β</text>
<text x="12" y="280" class="tb tng">第一種の過誤＝効かない薬を『効く』と言う</text>
<text x="12" y="298" class="tm">（無いものを有ると言う＝偽陽性）</text>
<text x="12" y="320" class="tb twn">第二種の過誤＝効く薬を見逃す</text>
<text x="12" y="338" class="tm">（有るものを見逃す＝偽陰性）</text>
<line x1="12" y1="352" x2="308" y2="352" class="l sb w1"/>
<text x="12" y="374" class="tb">② 数で見る（α＝0.05、検出力 0.8 の例）</text>
<text x="12" y="394" class="tm">効かない薬で、同じ実験と検定を100回すると</text>
