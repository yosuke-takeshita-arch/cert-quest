<text x="12" y="516" class="tm">本当に効く薬で、同じことを5回すると</text>
<rect x="12" y="526" width="26" height="26" class="fok sok" stroke-width="1.5"/>
<rect x="46" y="526" width="26" height="26" class="fok sok" stroke-width="1.5"/>
