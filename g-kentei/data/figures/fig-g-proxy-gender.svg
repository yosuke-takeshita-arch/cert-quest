<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 472" role="img" aria-labelledby="fig-g-proxy-gender-t fig-g-proxy-gender-d">
<title id="fig-g-proxy-gender-t">性別の列を消しても、性別と結びつく列から性別が読み取られ、偏りが残る</title>
<desc id="fig-g-proxy-gender-d">何のための図か：採用選考のAIで、学習データから性別の列を消したのに、女性が不利になる傾向が残る理由を見る。説明のための架空の場面。①性別の列を消す：学習データの列は性別・学歴・部活・職歴など。性別の列だけを消す。②残った列に性別の手がかりがある：学歴の『女子大学』、部活の『女子サッカー部』、過去に女性が少なかった職種での経験の有無などは、性別と強く結びつく。③モデルが性別を読み取る：過去の採用データで採用された人に多い特徴を高く評価するように学ぶと、こうした列から事実上性別を読み取り、過去の偏りを再現する。性別の代わりに働くこうした変数を代理変数という。過学習やデータ不足は全体の精度が落ちる話で、女性という特定の集団にだけ不利な向きの偏りが出る理由にはならない。</desc>
<text x="12" y="20" class="tb">性別の列を消したのに、偏りが残るわけ</text>
<text x="12" y="42" class="tm">採用選考のAI（説明のための架空の場面）</text>
<line x1="12" y1="54" x2="308" y2="54" class="l sb w1"/>
<text x="12" y="78" class="tb">① 学習データから性別の列を消す</text>
<rect x="14" y="88" width="68" height="28" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="48" y="107" class="tb tng" text-anchor="middle">性別</text>
<line x1="20" y1="92" x2="76" y2="112" class="l sng w2"/>
<rect x="88" y="88" width="68" height="28" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="122" y="107" class="tb" text-anchor="middle">学歴</text>
<rect x="162" y="88" width="68" height="28" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="196" y="107" class="tb" text-anchor="middle">部活</text>
<rect x="236" y="88" width="68" height="28" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="270" y="107" class="tb" text-anchor="middle">職歴</text>
<text x="12" y="138" class="tng">性別の列は消した（×）</text>
<line x1="12" y1="150" x2="308" y2="150" class="l sb w1"/>
<text x="12" y="174" class="tb">② 残った列に、性別の手がかりがある</text>
<text x="12" y="192">学歴：『女子大学』</text>
<text x="12" y="210">部活：『女子サッカー部』</text>
<text x="12" y="228">職歴：過去に女性が少なかった職種での経験</text>
<text x="12" y="248" class="tb ta">→ どれも性別と強く結びつく</text>
<line x1="12" y1="260" x2="308" y2="260" class="l sb w1"/>
<text x="12" y="284" class="tb">③ モデルが、事実上性別を読み取る</text>
<text x="12" y="302">過去の採用データで、採用された人に多い</text>
<text x="12" y="320">特徴を高く評価するように学ぶ</text>
<text x="12" y="338" class="tng">→ ②の手がかりから性別を推定し、</text>
<text x="12" y="356" class="tng">　 過去の偏りをそのまま再現する</text>
<rect x="12" y="364" width="296" height="52" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="384" class="tb">代理変数：性別と強く結びつき、性別の</text>
<text x="24" y="404" class="tb">代わりに働く変数（列）</text>
<text x="12" y="440" class="tm">過学習やデータ不足は、全体の精度が落ちる</text>
<text x="12" y="458" class="tm">話。女性にだけ不利な向きの偏りは説明しない</text>
</svg>
