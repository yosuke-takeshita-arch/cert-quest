<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 504" role="img" aria-labelledby="fig-g-manhattan-chebyshev-t fig-g-manhattan-chebyshev-d">
<title id="fig-g-manhattan-chebyshev-t">(2, 1) と (7, 3) のマンハッタン距離7とチェビシェフ距離5</title>
<desc id="fig-g-manhattan-chebyshev-d">何のための図か：2点 (2, 1) と (7, 3) の距離を、マンハッタン距離・チェビシェフ距離・ユークリッド距離の3通りで測る。方眼の図：横の差は 7−2＝5、縦の差は 3−1＝2。マンハッタン距離は、碁盤の目の道を歩くように横5マスと縦2マスを足して 5＋2＝7。チェビシェフ距離は、横と縦の差のうち大きいほうだけで 5（王様が1手で斜めにも1マス進めるとき、何手かかるか）。ユークリッド距離はまっすぐ測った長さで、√(5²＋2²)＝√29≒5.4。最小の2はどの距離でもない。</desc>
<text x="12" y="20" class="tb">(2, 1) と (7, 3) の距離を3通りで測る</text>
<text x="12" y="42" class="tm">この問題の2点で見る</text>
<line x1="70" y1="186" x2="70" y2="66" class="l sb w1"/>
<line x1="100" y1="186" x2="100" y2="66" class="l sb w1"/>
<line x1="130" y1="186" x2="130" y2="66" class="l sb w1"/>
<line x1="160" y1="186" x2="160" y2="66" class="l sb w1"/>
<line x1="190" y1="186" x2="190" y2="66" class="l sb w1"/>
<line x1="220" y1="186" x2="220" y2="66" class="l sb w1"/>
<line x1="250" y1="186" x2="250" y2="66" class="l sb w1"/>
<line x1="280" y1="186" x2="280" y2="66" class="l sb w1"/>
<line x1="40" y1="156" x2="280" y2="156" class="l sb w1"/>
<line x1="40" y1="126" x2="280" y2="126" class="l sb w1"/>
<line x1="40" y1="96" x2="280" y2="96" class="l sb w1"/>
<line x1="40" y1="66" x2="280" y2="66" class="l sb w1"/>
<line x1="40" y1="186" x2="280" y2="186" class="l sm w1"/>
<line x1="40" y1="186" x2="40" y2="66" class="l sm w1"/>
<text x="40" y="202" class="tm" text-anchor="middle">0</text>
<text x="70" y="202" class="tm" text-anchor="middle">1</text>
<text x="100" y="202" class="tm" text-anchor="middle">2</text>
<text x="130" y="202" class="tm" text-anchor="middle">3</text>
<text x="160" y="202" class="tm" text-anchor="middle">4</text>
<text x="190" y="202" class="tm" text-anchor="middle">5</text>
<text x="220" y="202" class="tm" text-anchor="middle">6</text>
<text x="250" y="202" class="tm" text-anchor="middle">7</text>
<text x="280" y="202" class="tm" text-anchor="middle">8</text>
<text x="32" y="160" class="tm" text-anchor="end">1</text>
<text x="32" y="130" class="tm" text-anchor="end">2</text>
<text x="32" y="100" class="tm" text-anchor="end">3</text>
<text x="32" y="70" class="tm" text-anchor="end">4</text>
<polyline points="100,156 250,156 250,96" class="l sa w3"/>
<line x1="100" y1="156" x2="250" y2="96" class="l sm w2 dsh"/>
<circle cx="100" cy="156" r="5" class="ft"/>
<circle cx="250" cy="96" r="5" class="ft"/>
<text x="100" y="146" class="tb" text-anchor="middle">(2, 1)</text>
<text x="242" y="86" class="tb" text-anchor="end">(7, 3)</text>
<text x="175" y="222" class="tb ta" text-anchor="middle">横の差 7−2＝5（太線の横の部分）</text>
<text x="256" y="130" class="tb ta">縦の差</text>
<text x="256" y="146" class="tb ta">3−1＝2</text>
<text x="12" y="248" class="tm">太線＝碁盤の目の道、破線＝まっすぐ</text>
<line x1="12" y1="260" x2="308" y2="260" class="l sb w1"/>
<text x="12" y="284" class="tb">マンハッタン距離：差を足す</text>
<text x="12" y="302">道を歩くように、横5マス＋縦2マス</text>
<text x="12" y="322" class="tb tok">5 ＋ 2 ＝ 7</text>
<line x1="12" y1="334" x2="308" y2="334" class="l sb w1"/>
<text x="12" y="358" class="tb">チェビシェフ距離：大きいほうの差だけ</text>
<text x="12" y="376">斜めにも1マス進めるなら、縦の2マスは横に</text>
<text x="12" y="394">進むついでに済む → 横の5手で着く</text>
<text x="12" y="414" class="tb tok">5 と 2 のうち大きいほう ＝ 5</text>
<line x1="12" y1="426" x2="308" y2="426" class="l sb w1"/>
<text x="12" y="450" class="tb">ユークリッド距離：まっすぐ（破線）</text>
<text x="12" y="468">√(5² ＋ 2²) ＝ √29 ≒ 5.4</text>
<text x="12" y="490" class="tm">小さいほうの差 2 は、どの距離でもない</text>
</svg>
