<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 876" role="img" aria-labelledby="fig-g-exposure-bias-t fig-g-exposure-bias-d">
<title id="fig-g-exposure-bias-t">露出バイアス：教師強制で学習すると、学習中の入力と本番の入力がずれる</title>
<desc id="fig-g-exposure-bias-d">例は訳文を1語ずつ作るモデルで、正解は I like dogs。①学習中（教師強制）：1語目を You と誤っても、次の入力には正解の I を入れ、その次も正解の like を入れる。そのためモデルは、前の語がいつも正しい場面しか見ない。②本番（推論。正解は無い）：自分の予測をそのまま次の入力に回すので、入力は〈開始〉・You・are、予測は You・are・cute となる。前に誤りがある場面は学習中に一度も見ていないので、立て直し方を知らず、誤りが後ろへ積み重なる。③入力のずれ：次の入力は、学習中は正解の語、本番は自分の予測。前の誤りは、学習中は見ず、本番では出会う。④和らげる方法の Scheduled Sampling は、次の入力に自分の予測を使う割合を、学習が進むにつれて0%・25%・50%・75%のように増やす（割合は例。緑の部分が正解、茶の部分が自分の予測）。Ranzato らは、学習中も自分の予測を使い、系列全体で BLEU などの指標を直接よくする方法を示した。</desc>
<text x="12" y="20" class="tb">露出バイアス：学習と本番で入力がずれる</text>
<text x="12" y="42" class="tm">例：訳文を1語ずつ作るモデル</text>
<text x="12" y="60" class="tm">正解は I like dogs</text>
<rect x="12" y="72" width="296" height="196" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="92" class="tb">① 学習中（教師強制）</text>
<text x="24" y="112" class="tm">予測</text>
<rect x="28" y="118" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="64" y="134.5" text-anchor="middle">You</text>
<rect x="124" y="118" width="72" height="24" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="160" y="134.5" text-anchor="middle">like</text>
<rect x="220" y="118" width="72" height="24" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="256" y="134.5" text-anchor="middle">dogs</text>
<rect x="28" y="172" width="72" height="24" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="64" y="188.5" text-anchor="middle">〈開始〉</text>
<line x1="64" y1="172" x2="64.0" y2="149.6" class="l sm w1"/>
<polygon points="64,144 67.5,149.6 60.5,149.6" class="fm"/>
<rect x="124" y="172" width="72" height="24" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="188.5" text-anchor="middle">I</text>
<line x1="160" y1="172" x2="160.0" y2="149.6" class="l sm w1"/>
<polygon points="160,144 163.5,149.6 156.5,149.6" class="fm"/>
<rect x="220" y="172" width="72" height="24" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="256" y="188.5" text-anchor="middle">like</text>
<line x1="256" y1="172" x2="256.0" y2="149.6" class="l sm w1"/>
<polygon points="256,144 259.5,149.6 252.5,149.6" class="fm"/>
<text x="24" y="166" class="tm">入力</text>
<text x="160" y="212" class="tok" text-anchor="middle">正解</text>
<text x="256" y="212" class="tok" text-anchor="middle">正解</text>
<text x="24" y="236">1語目を You と誤っても、次は正解 I を入れる</text>
<text x="24" y="256" class="tb">→ 前の語がいつも正しい場面しか見ない</text>
<rect x="12" y="280" width="296" height="214" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="300" class="tb">② 本番（推論。正解は無い）</text>
<text x="24" y="320" class="tm">予測</text>
<rect x="28" y="326" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="64" y="342.5" text-anchor="middle">You</text>
<rect x="124" y="326" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="160" y="342.5" text-anchor="middle">are</text>
<rect x="220" y="326" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="256" y="342.5" text-anchor="middle">cute</text>
<rect x="28" y="380" width="72" height="24" class="fs sb" stroke-width="1.5" rx="4"/>
<text x="64" y="396.5" text-anchor="middle">〈開始〉</text>
<line x1="64" y1="380" x2="64.0" y2="357.6" class="l sm w1"/>
<polygon points="64,352 67.5,357.6 60.5,357.6" class="fm"/>
<rect x="124" y="380" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="160" y="396.5" text-anchor="middle">You</text>
<line x1="160" y1="380" x2="160.0" y2="357.6" class="l sm w1"/>
<polygon points="160,352 163.5,357.6 156.5,357.6" class="fm"/>
<rect x="220" y="380" width="72" height="24" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="256" y="396.5" text-anchor="middle">are</text>
<line x1="256" y1="380" x2="256.0" y2="357.6" class="l sm w1"/>
<polygon points="256,352 259.5,357.6 252.5,357.6" class="fm"/>
<text x="24" y="374" class="tm">入力</text>
<line x1="100" y1="344" x2="121.2" y2="381.1" class="l sng w1"/>
<polygon points="124,386 118.2,382.9 124.3,379.4" class="fm"/>
<line x1="196" y1="344" x2="217.2" y2="381.1" class="l sng w1"/>
<polygon points="220,386 214.2,382.9 220.3,379.4" class="fm"/>
<text x="160" y="424" class="tm" text-anchor="middle">自分の予測をそのまま次の入力に回す</text>
<text x="24" y="448">前に誤りがある場面は、学習中に一度も</text>
<text x="24" y="466">見ていない → 立て直し方を知らず、</text>
<text x="24" y="484" class="tb">誤りが後ろへ積み重なる</text>
<rect x="12" y="506" width="296" height="108" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="526" class="tb">③ 入力のずれ</text>
<text x="140" y="548" class="tm" text-anchor="middle">学習中</text>
<text x="240" y="548" class="tm" text-anchor="middle">本番</text>
<text x="24" y="570">次の入力</text>
<text x="140" y="570" class="tok" text-anchor="middle">正解の語</text>
<text x="240" y="570" class="twn" text-anchor="middle">自分の予測</text>
<text x="24" y="596">前の誤り</text>
<text x="140" y="596" class="tok" text-anchor="middle">見ない</text>
<text x="240" y="596" class="twn" text-anchor="middle">出会う</text>
<line x1="24" y1="556" x2="296" y2="556" class="l sb w1"/>
<line x1="24" y1="580" x2="296" y2="580" class="l sb w1"/>
<rect x="12" y="626" width="296" height="196" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="646" class="tb">④ 和らげる：Scheduled Sampling</text>
<text x="24" y="666" class="tm">次の入力に自分の予測を使う割合を、</text>
<text x="24" y="684" class="tm">学習が進むにつれて増やす（割合は例）</text>
<rect x="40" y="698" width="52" height="64.0" class="fok sok" stroke-width="1"/>
<text x="66" y="778" text-anchor="middle">0%</text>
<text x="66" y="796" class="tm" text-anchor="middle">初め</text>
<rect x="106" y="698" width="52" height="48.0" class="fok sok" stroke-width="1"/>
<rect x="106" y="746.0" width="52" height="16.0" class="fwn swn" stroke-width="1"/>
<text x="132" y="778" text-anchor="middle">25%</text>
<rect x="172" y="698" width="52" height="32.0" class="fok sok" stroke-width="1"/>
<rect x="172" y="730.0" width="52" height="32.0" class="fwn swn" stroke-width="1"/>
<text x="198" y="778" text-anchor="middle">50%</text>
<rect x="238" y="698" width="52" height="16.0" class="fok sok" stroke-width="1"/>
<rect x="238" y="714.0" width="52" height="48.0" class="fwn swn" stroke-width="1"/>
<text x="264" y="778" text-anchor="middle">75%</text>
<text x="264" y="796" class="tm" text-anchor="middle">後半</text>
<text x="296" y="814" class="tm" text-anchor="end">緑＝正解　茶＝自分の予測</text>
<text x="12" y="846" class="tm">Ranzato ら：学習中も自分の予測を使い、</text>
<text x="12" y="864" class="tm">系列全体で BLEU などの指標を直接よくする</text>
</svg>
