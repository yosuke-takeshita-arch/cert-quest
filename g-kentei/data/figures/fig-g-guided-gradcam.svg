<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 960" role="img" aria-labelledby="fig-g-guided-gradcam-t fig-g-guided-gradcam-d">
<title id="fig-g-guided-gradcam-t">Guided Grad-CAM：粗いがクラスを区別する地図と、細かいがクラスを区別しない地図を、画素ごとに掛ける</title>
<desc id="fig-g-guided-gradcam-d">Grad-CAM は勾配を使って、クラスごとに画像のどこを見たかの地図を作るが、地図は粗い。Guided Backpropagation は画素ごとの勾配を見るので細かいが、クラスを区別しない。Guided Grad-CAM は2つを画素ごとに掛け合わせる（要素ごとの積）。①困りごと：猫と犬が写った画像で、猫と判断した根拠を見たい。Grad-CAM は猫の側が光るが、VGG の最後の畳み込み層なら14×14マスと粗く、縞などの細部は見えない。Guided Backpropagation は縞や耳まで見えるが、猫で見ても犬で見てもほぼ同じ絵になる。②例：4×4マスで、左2列が猫、右2列が犬の写る所。Grad-CAM（猫）は左2列だけが明るい粗い地図。Guided Backpropagation は猫にも犬にも細かい明るいマスがある。画素ごとに掛けると、1×1＝1、1×0＝0 なので、猫の側の細かいマスだけが残る。Grad-CAM の地図は画像の大きさに引き伸ばしてから掛ける。③Guided Backpropagation は、勾配を逆向きに流すとき、ReLU のところで負の勾配を止め、正の勾配だけを通す。④見分け：Grad-CAM は粗いがクラスを区別できる。Guided Backpropagation は細かいがクラスを区別できない。Guided Grad-CAM は細かく、クラスも区別できる。CAM は GAP を持つ作りに限られる Grad-CAM の元の手法。LIME はモデルの中を見ずに、入力を変えて予測の変化を調べる。4×4マスの数は説明のための例。</desc>
<text x="12" y="20" class="tb">Guided Grad-CAM：粗い地図 × 細かい地図</text>
<text x="12" y="42" class="tm">Grad-CAM＝勾配で、クラスごとに画像の</text>
<text x="12" y="60" class="tm">　どこを見たかの地図を作る（粗い）</text>
<text x="12" y="78" class="tm">Guided Backpropagation＝画素ごとの勾配を</text>
<text x="12" y="96" class="tm">　見る（細かいが、クラスを区別しない）</text>
<text x="12" y="114" class="tm">勾配：その画素を少し変えると、予測の点数</text>
<text x="12" y="132" class="tm">　がどれだけ変わるか（坂の傾き）</text>
<line x1="12" y1="146" x2="308" y2="146" class="l sb w1"/>
<text x="12" y="168" class="tb">① 何に困っていたか</text>
<text x="12" y="190">例：猫と犬が写った画像で、『猫』と判断</text>
<text x="12" y="208">した根拠を見たい</text>
<text x="12" y="230">Grad-CAM：猫の側は光るが、地図が粗い</text>
<text x="12" y="248" class="tm">　（VGG の最後の畳み込み層なら 14×14 マス）</text>
<text x="12" y="266" class="tm">　→ 縞模様などの細かい所が見えない</text>
<text x="12" y="288">Guided Backprop：縞や耳まで細かく見える</text>
<text x="12" y="306" class="tm">　が、『猫』で見ても『犬』で見ても、</text>
<text x="12" y="324" class="tm">　ほぼ同じ絵になる</text>
<line x1="12" y1="338" x2="308" y2="338" class="l sb w1"/>
<text x="12" y="360" class="tb">② 例：画素ごとに掛ける（4×4マスの例）</text>
<text x="12" y="380" class="tm">左2列＝猫が写る所、右2列＝犬が写る所</text>
<text x="52" y="408" class="tb" text-anchor="middle">Grad-CAM</text>
<text x="160" y="408" class="tb" text-anchor="middle">Guided BP</text>
<text x="268" y="408" class="tb ta" text-anchor="middle">掛けた結果</text>
