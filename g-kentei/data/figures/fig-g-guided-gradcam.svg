<text x="214" y="466" class="tb" text-anchor="middle">＝</text>
<text x="52" y="528" class="tm" text-anchor="middle">粗い</text>
<text x="52" y="546" class="tm" text-anchor="middle">猫の側だけ</text>
<text x="160" y="528" class="tm" text-anchor="middle">細かい</text>
<text x="160" y="546" class="tm" text-anchor="middle">猫も犬も</text>
<text x="268" y="528" class="tb ta" text-anchor="middle">細かい</text>
<text x="268" y="546" class="tb ta" text-anchor="middle">猫の側だけ</text>
