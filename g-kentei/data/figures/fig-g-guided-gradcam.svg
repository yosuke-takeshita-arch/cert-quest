<rect x="140" y="562" width="14" height="14" class="fs sm" stroke-width="1"/>
<text x="160" y="574">＝暗い（0）</text>
<text x="12" y="598">同じマスどうしを掛ける：1×1＝1、1×0＝0</text>
<text x="12" y="616">→ 犬の側は Grad-CAM が 0 なので消え、</text>
<text x="12" y="634">　猫の側の細かいマスだけが残る</text>
<text x="12" y="656" class="tm">Grad-CAM の粗い地図は、画像の大きさに</text>
<text x="12" y="674" class="tm">引き伸ばしてから掛ける（マスの数は例）</text>
<line x1="12" y1="688" x2="308" y2="688" class="l sb w1"/>
<text x="12" y="710" class="tb">③ Guided Backpropagation とは</text>
<text x="12" y="732">勾配を出力から画像へ逆向きに流すとき、</text>
<text x="12" y="750">ReLU の所で負の勾配を止め、正だけ通す</text>
<text x="12" y="768" class="tm">→ 判断を強めた画素だけが細かく浮かぶ</text>
<line x1="12" y1="782" x2="308" y2="782" class="l sb w1"/>
