<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 900" role="img" aria-labelledby="fig-g-segnet-t fig-g-segnet-d">
<title id="fig-g-segnet-t">SegNet：縮めるときに最大値の位置だけを覚え、戻すときにその位置へ値を置く</title>
<desc id="fig-g-segnet-d">SegNet は画素ごとにクラスを付けるセグメンテーションのモデルで、縮める側（エンコーダ、青）と元の大きさに戻す側（デコーダ、緑）からなる。①全体の形：エンコーダの5つの段で特徴マップを小さくし、デコーダの5つの段で大きくする。各段で、縮めるときに覚えた「位置の番号」だけを向かい合うデコーダの段へ渡す（破線）。エンコーダは VGG16 の畳み込み13層と同じ形。②2×2 の窓1つの例：縮める前の値が 1・3・2・6 で、右下の6が最大。縮めた後は6だけが残り、「右下が最大だった」という位置を覚える。戻すとき、6を同じ右下に置き、残りの3つは0にする。0の升目は、そのあとの学習できる畳み込みで埋める。拡大のしかたそのものは学習しなくてよく、位置が分かるので境界がぼやけにくい。③省メモリの理由：4つの位置は 左上00・右上01・左下10・右下11 の2ビットで区別できる。例として、縮める前の4つの値を小数のまま1つ32ビットで取っておくと4×32＝128ビットだが、位置だけなら2ビットで64分の1。④U-Net は、縮める側の特徴マップそのものを戻す側へ渡して連結するので、メモリは多く使う。</desc>
<text x="12" y="20" class="tb">SegNet：最大値の「位置」だけ覚えて戻す</text>
<text x="12" y="42" class="tm">セグメンテーション＝画素ごとにクラスを付ける</text>
<text x="12" y="60" class="tm">青＝縮める側（エンコーダ）</text>
<text x="12" y="78" class="tm">緑＝元の大きさに戻す側（デコーダ）</text>
<rect x="12" y="90" width="296" height="232" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="110" class="tb">① 全体の形</text>
<rect x="30" y="172" width="18" height="84" class="fas sa" stroke-width="1.5" rx="2"/>
<rect x="56" y="181" width="18" height="66" class="fas sa" stroke-width="1.5" rx="2"/>
<rect x="82" y="189" width="18" height="50" class="fas sa" stroke-width="1.5" rx="2"/>
<rect x="108" y="196" width="18" height="36" class="fas sa" stroke-width="1.5" rx="2"/>
<rect x="134" y="202" width="18" height="24" class="fas sa" stroke-width="1.5" rx="2"/>
<rect x="164" y="202" width="18" height="24" class="fok sok" stroke-width="1.5" rx="2"/>
<rect x="190" y="196" width="18" height="36" class="fok sok" stroke-width="1.5" rx="2"/>
<rect x="216" y="189" width="18" height="50" class="fok sok" stroke-width="1.5" rx="2"/>
<rect x="242" y="181" width="18" height="66" class="fok sok" stroke-width="1.5" rx="2"/>
<rect x="268" y="172" width="18" height="84" class="fok sok" stroke-width="1.5" rx="2"/>
<polyline points="39,258 39,266 277,266 277,258" class="l sa w1 dsh"/>
<polyline points="65,249 65,260 251,260 251,249" class="l sa w1 dsh"/>
<polyline points="91,241 91,254 225,254 225,241" class="l sa w1 dsh"/>
<polyline points="117,234 117,248 199,248 199,234" class="l sa w1 dsh"/>
<polyline points="143,228 143,242 173,242 173,228" class="l sa w1 dsh"/>
<text x="160" y="284" class="tm" text-anchor="middle">各段で「位置の番号」だけを渡す（破線）</text>
<text x="24" y="132" class="tb" text-anchor="start">縮める</text>
<text x="296" y="132" class="tb" text-anchor="end">戻す</text>
<text x="24" y="306" class="tm">エンコーダは VGG16 の畳み込み13層と同じ形</text>
<line x1="160" y1="322" x2="160.0" y2="330.4" class="l sm w1"/>
<polygon points="160,336 156.5,330.4 163.5,330.4" class="fm"/>
<rect x="12" y="342" width="296" height="250" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="362" class="tb">② 2×2 の窓1つで起きること</text>
<text x="54" y="384" class="tm" text-anchor="middle">縮める前</text>
<rect x="24" y="392" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="39" y="412" class="tm" text-anchor="middle">1</text>
<rect x="54" y="392" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="69" y="412" class="tm" text-anchor="middle">3</text>
<rect x="24" y="422" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="39" y="442" class="tm" text-anchor="middle">2</text>
<rect x="54" y="422" width="30" height="30" class="fas sa" stroke-width="1.5"/>
<text x="69" y="442" class="tb" text-anchor="middle">6</text>
<line x1="90" y1="422" x2="120.4" y2="422.0" class="l sa w1"/>
<polygon points="126,422 120.4,425.5 120.4,418.5" class="fa"/>
<text x="108" y="412" class="tm" text-anchor="middle">最大</text>
<rect x="132" y="407" width="30" height="30" class="fas sa" stroke-width="1.5"/>
<text x="147" y="427" class="tb" text-anchor="middle">6</text>
<text x="147" y="384" class="tm" text-anchor="middle">縮めた後</text>
<line x1="168" y1="422" x2="198.4" y2="422.0" class="l sok w1"/>
<polygon points="204,422 198.4,425.5 198.4,418.5" class="fm"/>
<text x="186" y="412" class="tm" text-anchor="middle">戻す</text>
<text x="240" y="384" class="tm" text-anchor="middle">戻した後</text>
<rect x="210" y="392" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="225" y="412" class="tm" text-anchor="middle">0</text>
<rect x="240" y="392" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="255" y="412" class="tm" text-anchor="middle">0</text>
<rect x="210" y="422" width="30" height="30" class="fs sm" stroke-width="1.5"/>
<text x="225" y="442" class="tm" text-anchor="middle">0</text>
<rect x="240" y="422" width="30" height="30" class="fok sok" stroke-width="1.5"/>
<text x="255" y="442" class="tb" text-anchor="middle">6</text>
<text x="24" y="476" class="tb ta">覚えるのは「右下が最大だった」という位置</text>
<text x="24" y="496">戻すとき、6 を同じ右下に置き、残りは 0</text>
<text x="24" y="516">→ 0 の升目は、そのあとの学習できる</text>
<text x="24" y="534">　畳み込みで埋める</text>
<text x="24" y="556" class="tm">拡大のしかたそのものは学習しなくてよい</text>
<text x="24" y="576" class="tm">（位置が分かるので、境界がぼやけにくい）</text>
<text x="12" y="618" class="tb">③ なぜ省メモリか</text>
<rect x="12" y="628" width="296" height="152" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="648">4つの位置は2ビットで区別できる</text>
<text x="24" y="668" class="tb">左上 00 ／ 右上 01 ／ 左下 10 ／ 右下 11</text>
<text x="24" y="690">例：縮める前の4つの値を、小数のまま</text>
<text x="24" y="708">取っておく（1つ32ビットとする）と</text>
<text x="24" y="726">4×32＝128ビット</text>
<text x="24" y="748" class="tb tok">位置だけなら 2ビット（64分の1）</text>
<text x="24" y="768" class="tm">（窓1つあたりで比べた数）</text>
<text x="12" y="806" class="tb">④ U-Net との違い</text>
<rect x="12" y="816" width="296" height="70" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="836">SegNet：位置の番号だけを渡す</text>
<text x="24" y="856">U-Net：縮める側の特徴マップそのものを</text>
<text x="24" y="874">　戻す側へ渡し、連結する（メモリは多い）</text>
</svg>
