<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 608" role="img" aria-labelledby="fig-g-pooling-t fig-g-pooling-d">
<title id="fig-g-pooling-t">プーリング：最大値・平均値・グローバルアベレージ（GAP）と、位置のずれへの強さ</title>
<desc id="fig-g-pooling-d">4行6列の特徴マップを2×2の窓・ストライド2で区切り、窓ごとに1つの値にする。最大値プーリングは窓の最大値、平均値プーリングは窓の平均値で、出力は2行3列になる。プーリングには学習するパラメータが無い。グローバルアベレージプーリングは特徴マップ1枚全体の平均を1つの値にし、チャネル数と同じ長さのベクトルになる。最大値プーリングでは、模様が同じ窓の中で1マスずれても出力は変わらない。窓をまたぐずれでは変わることがある。</desc>
<text x="12" y="20" class="tb">① 窓ごとに1つの値にする</text>
