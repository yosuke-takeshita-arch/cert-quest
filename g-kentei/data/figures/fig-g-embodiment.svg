<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 610" role="img" aria-labelledby="fig-g-embodiment-t fig-g-embodiment-d">
<title id="fig-g-embodiment-t">身体性：体で世界にふれて、記号を実物の感覚に結びつける</title>
<desc id="fig-g-embodiment-d">何のための図か：シンボルグラウンディング問題（記号を実物の意味に結びつけられない問題）を乗り越える手がかりとして、身体性が議論される理由を、熱いという語の例えで見る（説明のための例え）。①記号だけのAI：熱いという語を辞書で引くと、温度が高い、と別の言葉が並ぶ。温度を引くと、また別の言葉が並ぶ。言葉から言葉へ回るだけで、実物の熱さに届かない。これがシンボルグラウンディング問題。②体を持つ場合：やかんに手でふれると、手が熱さを感じ、思わず手を引っこめる。熱いという語が、自分の感覚と行動に結びついた意味を持つ。体を持って世界を直接経験し、行動と感覚が世界とのやり取りの中で結びつくことを重視する考え方が身体性。③対で覚える：問題は記号が宙に浮くこと、手がかりは体で世界にふれること。身体性は、AIには体が必須という定義ではない。</desc>
<text x="12" y="20" class="tb">身体性＝体で世界にふれて意味をつかむ</text>
<text x="12" y="42" class="tm">何のための図か：記号を実物に結びつける</text>
<text x="12" y="60" class="tm">手がかりを、「熱い」の例えで見る</text>
<text x="12" y="88" class="tb">① 記号だけのAI</text>
<rect x="20" y="100" width="80" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="60" y="120" class="tb" text-anchor="middle">熱い</text>
<rect x="120" y="100" width="100" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="170" y="120" text-anchor="middle">温度が高い</text>
<rect x="240" y="100" width="64" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="272" y="120" text-anchor="middle">温度</text>
<line x1="100" y1="115" x2="120" y2="115" class="l sm w1"/>
<line x1="220" y1="115" x2="240" y2="115" class="l sm w1"/>
<path d="M272 130 Q272 160 170 160 Q60 160 60 130" class="l sm w1 dsh" fill="none"/>
<text x="170" y="178" class="tm" text-anchor="middle">辞書を引くと、別の言葉が並ぶだけ</text>
<text x="12" y="204" class="tng">→ 言葉から言葉へ回り、実物の熱さに届かない</text>
<text x="12" y="224" class="tm">（シンボルグラウンディング問題）</text>
<line x1="12" y1="240" x2="308" y2="240" class="l sb w1"/>
<text x="12" y="262" class="tb">② 体を持って、世界にふれる</text>
<rect x="20" y="276" width="80" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="60" y="296" class="tb" text-anchor="middle">やかんに</text>
<text x="60" y="312" class="tb" text-anchor="middle">ふれる</text>
<rect x="120" y="276" width="80" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="160" y="296" class="tb" text-anchor="middle">手が熱さを</text>
<text x="160" y="312" class="tb" text-anchor="middle">感じる</text>
<rect x="220" y="276" width="84" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="262" y="296" class="tb" text-anchor="middle">思わず手を</text>
<text x="262" y="312" class="tb" text-anchor="middle">引っこめる</text>
<line x1="100" y1="298" x2="120" y2="298" class="l sm w1"/>
<line x1="200" y1="298" x2="220" y2="298" class="l sm w1"/>
<text x="12" y="346" class="tm">行動と感覚が、世界とのやり取りでつながる</text>
<rect x="12" y="356" width="296" height="30" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="376" class="tb tok" text-anchor="middle">「熱い」が、感覚と行動に結びついた意味に</text>
<text x="12" y="410" class="tm">この経験を知能にとって重要とみる考え方が</text>
<text x="12" y="428" class="tb ta">身体性</text>
<line x1="12" y1="444" x2="308" y2="444" class="l sb w1"/>
<text x="12" y="466" class="tb">③ 問題と手がかりの対</text>
<text x="12" y="490">問題：記号が実物に結びつかない（宙に浮く）</text>
<text x="12" y="512" class="ta">手がかり：体で世界にふれる（身体性）</text>
<text x="12" y="542" class="tm">身体性は「AIに体が必須」という定義では</text>
<text x="12" y="560" class="tm">ない。体の無いAIも多い</text>
<text x="12" y="590" class="tm">※やかんの話は、説明のための例え</text>
</svg>
