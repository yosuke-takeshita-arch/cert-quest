<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 582" role="img" aria-labelledby="fig-g-trade-secret-limited-data-t fig-g-trade-secret-limited-data-d">
<title id="fig-g-trade-secret-limited-data-t">営業秘密と限定提供データ：隠して守るか、決まった相手に渡して守るか</title>
<desc id="fig-g-trade-secret-limited-data-d">①営業秘密は隠して守る。AI企業が学習データと前処理の手順を、権限のある人しか入れない社内サーバに社外秘として置く。退職者が持ち出して転職先で使えば、差止めや損害賠償を求められる。要件は秘密管理性・有用性・非公知性の3つ。誰でも見られる共有フォルダに置いていた場合は、秘密として管理していたとは言いにくい。②限定提供データは、決まった相手に渡して守る。自動車メーカーが加盟する団体が、集めた走行データを会員企業A・Bだけに、IDとパスワードで有料提供する。会員でない会社がパスワードを盗んで取得すれば、差止めを求められる。要件は限定提供性・相当蓄積性・電磁的管理性。見分け方：営業秘密は秘密にして社内で守り、限定提供データは相手に渡すがIDなどで守る。営業秘密に当たるものは限定提供データから除かれるので、両方に当たることは無い（令和5年の改正前は、除くのは秘密として管理されているもの）。</desc>
<text x="12" y="20" class="tb">営業秘密と限定提供データ：守り方</text>
<text x="12" y="44" class="tb ta">① 営業秘密：隠して守る</text>
<rect x="12" y="56" width="186" height="72" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="22" y="76" class="tb ta">社内サーバ（社外秘）</text>
<text x="22" y="96">学習データ</text>
<text x="22" y="116">前処理の手順</text>
<text x="226" y="58" class="tng" text-anchor="middle">持ち出す</text>
<line x1="198" y1="78" x2="226.4" y2="78" class="l sng"/>
<polygon points="232,78 226.4,74.5 226.4,81.5" class="fm"/>
<rect x="232" y="62" width="76" height="32" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="270" y="83" class="tb tng" text-anchor="middle">退職者</text>
<text x="270" y="112" class="tng" text-anchor="middle">差止め・</text>
<text x="270" y="128" class="tng" text-anchor="middle">損害賠償</text>
<text x="12" y="152" class="tm">3要件：秘密管理性・有用性・非公知性</text>
<text x="12" y="172" class="tm">誰でも見られる共有フォルダに置くと、</text>
<text x="12" y="192" class="tm">秘密として管理とは言いにくい</text>
<line x1="12" y1="208" x2="308" y2="208" class="l sb w1"/>
<text x="12" y="232" class="tb ta">② 限定提供データ：決まった相手に渡す</text>
<rect x="12" y="246" width="140" height="56" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="82" y="268" class="tb ta" text-anchor="middle">団体</text>
<text x="82" y="288" text-anchor="middle">集めた走行データ</text>
<line x1="152" y1="262" x2="190.4" y2="259" class="l sok"/>
<polygon points="196,258.6 190.1,255.5 190.7,262.5" class="fm"/>
<line x1="152" y1="280" x2="190.4" y2="293" class="l sok"/>
<polygon points="196,295 189.4,296.3 191.4,289.6" class="fm"/>
<rect x="196" y="244" width="112" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="252" y="264" class="tok" text-anchor="middle">会員企業A</text>
<rect x="196" y="280" width="112" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="252" y="300" class="tok" text-anchor="middle">会員企業B</text>
<rect x="196" y="322" width="112" height="30" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="252" y="342" class="tng" text-anchor="middle">会員でない会社</text>
<line x1="140" y1="302" x2="192" y2="330" class="l sng dsh"/>
<text x="12" y="322" class="tm">IDとパスワードで</text>
<text x="12" y="340" class="tm">会員だけに有料提供</text>
<text x="308" y="372" class="tng" text-anchor="end">パスワードを盗んで取得 → 差止め</text>
<text x="12" y="396" class="tm">要件：限定提供性・相当蓄積性・電磁的管理性</text>
<line x1="12" y1="412" x2="308" y2="412" class="l sb w1"/>
<text x="12" y="436" class="tb">見分け方</text>
<text x="12" y="456">営業秘密：秘密にして、社内で守る</text>
<text x="12" y="476">限定提供データ：渡すが、ID などで守る</text>
<text x="12" y="504" class="tb">両方に当たることは無い</text>
<text x="12" y="524" class="tm">営業秘密に当たるものは、限定提供データ</text>
<text x="12" y="544" class="tm">から除かれる（令和5年の改正前は、除く</text>
<text x="12" y="564" class="tm">のは秘密として管理されているもの）</text>
</svg>
