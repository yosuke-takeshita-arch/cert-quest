<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 584" role="img" aria-labelledby="fig-g-svm-margin-t fig-g-svm-margin-d">
<title id="fig-g-svm-margin-t">SVM のマージン最大化と、ソフトマージン</title>
<desc id="fig-g-svm-margin-d">2クラス（丸と×）を分ける直線と、その両側に平行な破線2本。破線までの幅がマージンで、破線上の点がサポートベクター。SVM はこのマージンが最大になる境界を選ぶ。マージンの狭い境界でも分けられるが、余裕が小さい。下の図はソフトマージン。破線の内側や反対側にはみ出した点には、はみ出し量（スラック変数ξ）に応じた罰則がかかる。Cを大きくするとはみ出しを許さず訓練データを全部正しく分けようとし、Cを小さくするとはみ出しを許して境界はなめらかになる。</desc>
<text x="12" y="20" class="tb">① ハードマージン：余裕が最大の境界</text>
