<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 358" role="img" aria-labelledby="fig-g-mle-t fig-g-mle-d">
<title id="fig-g-mle-t">最尤推定：データが最も起こりやすくなるパラメータを選ぶ</title>
<desc id="fig-g-mle-d">例は、コインを20回投げて表が14回出たデータ。横軸は表の出る確率p（0から1）、縦軸は、そのpのもとでこのデータが得られる確率（尤度）。尤度の曲線は山の形で、p＝0.7で最大になる。最尤推定は、尤度が最大になるpを推定値に選ぶ方法。p＝0.5やp＝0.9では、このデータはあまり起こりやすくない。</desc>
