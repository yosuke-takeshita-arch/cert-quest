<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 880" role="img" aria-labelledby="fig-g-model-data-theft-t fig-g-model-data-theft-d">
<title id="fig-g-model-data-theft-t">モデル窃取とデータ窃取：公開したAIの答えを集めて、モデルの働きや学習データの情報を盗む</title>
<desc id="fig-g-model-data-theft-d">①モデル窃取の例は、画像を送ると品種を答える有料の公開API。中身は公開されていない。攻撃者（競合）が画像を送り、答え（例えば柴犬）を受け取ることを10万回くり返す。画像と答えの組が10万組たまり、これを学習データにして自分で学習すると、ほぼ同じ働きのモデルが手元にできる。中身（重み）は元と違っても、予測の性能が近いモデルを作れる。②データ窃取の例はメンバーシップ推論。病院の診療記録で学習した診断AIに、ある人のデータを入れて誤差（損失）を見る。学習に使ったデータは誤差が小さくなりやすい。境目は学習に使ったデータの誤差の平均で0.1。数直線（0から0.2）の上で、この人の誤差0.05は境目0.1より小さいので、学習に使われたと判定し、その病院に通っていたことが分かってしまう。詳しくはメンバーシップ推論攻撃のカード。ほかに、モデル反転（学習データの代表的な姿を復元）、属性推論（機微な属性を推定）もある。何を盗むか：モデル窃取はモデルの働き、データ窃取は学習データの情報。データ汚染などの汚染は壊す・操る攻撃で別物。対策の例：問い合わせの回数を制限する、怪しい問い合わせを見つける（モデル窃取。工夫した攻撃者にはすり抜けられることもある）。差分プライバシー（メンバーシップ推論に効く。モデル窃取に効く保証はない）。数は説明のための例。</desc>
<text x="12" y="20" class="tb">モデル窃取とデータ窃取：答えを集めて盗む</text>
<text x="12" y="42" class="tm">公開したAIに問い合わせを重ね、その答えから</text>
<text x="12" y="60" class="tm">モデルの働きや、学習データの情報を盗む</text>
<text x="12" y="90" class="tb">① モデル窃取（例：品種を答える有料API）</text>
<rect x="12" y="102" width="100" height="56" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="62" y="125" class="tb tng" text-anchor="middle">攻撃者</text>
<text x="62" y="145" class="tng" text-anchor="middle">（競合）</text>
<rect x="208" y="102" width="100" height="56" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="258" y="125" class="tb" text-anchor="middle">公開API</text>
<text x="258" y="145" class="tm" text-anchor="middle">（中身は非公開）</text>
<line x1="114" y1="118" x2="200.4" y2="118.0" class="l sm w1"/>
<polygon points="206,118 200.4,121.5 200.4,114.5" class="fm"/>
<text x="160" y="113" class="tm" text-anchor="middle">画像を送る</text>
<line x1="206" y1="144" x2="119.6" y2="144.0" class="l sa w1"/>
<polygon points="114,144 119.6,140.5 119.6,147.5" class="fa"/>
<text x="160" y="139" class="ta" text-anchor="middle">答え：柴犬</text>
<text x="62" y="174" class="tb" text-anchor="middle">10万回くり返す</text>
<line x1="62" y1="182" x2="62.0" y2="192.4" class="l sm w1"/>
<polygon points="62,198 58.5,192.4 65.5,192.4" class="fm"/>
<rect x="12" y="198" width="296" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="218" class="tb">画像と答えの組が10万組たまる</text>
<text x="24" y="238" class="tm">→ これを学習データにして自分で学習</text>
<line x1="62" y1="248" x2="62.0" y2="258.4" class="l sm w1"/>
<polygon points="62,264 58.5,258.4 65.5,258.4" class="fm"/>
<rect x="12" y="264" width="296" height="70" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="24" y="284" class="tb tng">ほぼ同じ働きのモデルが手元にできる</text>
<text x="24" y="304" class="tm">中身（重み）は元と違っても、予測の</text>
<text x="24" y="322" class="tm">性能が近いモデルを作れる</text>
<text x="12" y="368" class="tb">② データ窃取（メンバーシップ推論の例）</text>
<text x="12" y="388" class="tm">病院の診療記録で学習した診断AIに、</text>
<text x="12" y="406" class="tm">ある人のデータを入れて誤差（損失）を見る</text>
<text x="12" y="424" class="tm">（学習に使ったデータは誤差が小さくなりやすい）</text>
<text x="12" y="450" class="tm">境目＝学習に使ったデータの誤差の平均 0.1</text>
<line x1="30" y1="484" x2="290" y2="484" class="l sm w1"/>
<line x1="30" y1="480" x2="30" y2="488" class="l sm w1"/>
<text x="30" y="504" class="tm" text-anchor="middle">0</text>
<line x1="95" y1="480" x2="95" y2="488" class="l sm w1"/>
<text x="95" y="504" class="tm" text-anchor="middle">0.05</text>
<line x1="160" y1="480" x2="160" y2="488" class="l sm w1"/>
<text x="160" y="504" class="tm" text-anchor="middle">0.1</text>
<line x1="225" y1="480" x2="225" y2="488" class="l sm w1"/>
<text x="225" y="504" class="tm" text-anchor="middle">0.15</text>
<line x1="290" y1="480" x2="290" y2="488" class="l sm w1"/>
<text x="290" y="504" class="tm" text-anchor="middle">0.2</text>
<line x1="160" y1="462" x2="160" y2="490" class="l swn w2"/>
<text x="166" y="472" class="tb twn">境目</text>
<circle cx="95" cy="484" r="5" class="fa"/>
<text x="95" y="472" class="tb ta" text-anchor="middle">この人 0.05</text>
<text x="12" y="530" class="tm">0.05 は境目 0.1 より小さい</text>
<text x="12" y="548" class="tb tng">→ 学習に使われた、と判定する</text>
<text x="12" y="566" class="tng">→ その病院に通っていたことが分かってしまう</text>
<text x="12" y="590" class="tm">詳しくはメンバーシップ推論攻撃のカード。</text>
<text x="12" y="608" class="tm">ほかに、モデル反転（学習データの代表的な</text>
<text x="12" y="626" class="tm">姿を復元）・属性推論（機微な属性を推定）も</text>
<text x="12" y="656" class="tb">何を盗むか</text>
<rect x="12" y="666" width="142" height="58" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="83" y="688" class="tb" text-anchor="middle">モデル窃取</text>
<text x="83" y="710" class="tm" text-anchor="middle">モデルの働き</text>
<rect x="166" y="666" width="142" height="58" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="237" y="688" class="tb" text-anchor="middle">データ窃取</text>
<text x="237" y="710" class="tm" text-anchor="middle">学習データの情報</text>
<text x="12" y="746" class="tm">汚染（データ汚染など）は壊す・操る攻撃で別物</text>
<text x="12" y="774" class="tb">対策（例）</text>
<text x="12" y="794" class="tm">・問い合わせの回数を制限する、怪しい</text>
<text x="12" y="812" class="tm">　問い合わせを見つける（モデル窃取。工夫</text>
<text x="12" y="830" class="tm">　した攻撃者にはすり抜けられることもある）</text>
<text x="12" y="848" class="tm">・差分プライバシー（メンバーシップ推論に</text>
<text x="12" y="866" class="tm">　効く。モデル窃取に効く保証はない）</text>
</svg>
