<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 676" role="img" aria-labelledby="fig-g-wavenet-t fig-g-wavenet-d">
<title id="fig-g-wavenet-t">WaveNet：音声の波形を、過去の点から次の1点を予測して1点ずつ作る</title>
<desc id="fig-g-wavenet-d">WaveNet は Google DeepMind が2016年に発表した、音声の波形を作るモデル。音声は、細かい時間ごとの値（サンプル）の並びで、例えば1秒に16,000点ある。WaveNet は、それまでの点から次の1点を予測し、できた点を足して、また次を予測する（自己回帰）。1秒を作るのに16,000回予測する。遠い過去まで見るために、未来を見ない畳み込み（Causal）を、間隔を1、2、4、8と倍にして重ねる（Dilated）。図では4段で、出力の1点が過去の16サンプルを見ていて、未来のサンプルは見ない。原論文は間隔1から512までの10段を1組とし、1組で1024点を見る。これを何組か重ねる。</desc>
<text x="12" y="20" class="tb">WaveNet：音の波形を1点ずつ作る</text>
<text x="12" y="40" class="tm">Google DeepMind が 2016 年に発表した、</text>
<text x="12" y="58" class="tm">音声の波形を作るモデル</text>
<rect x="12" y="68" width="296" height="168" class="fs sb" stroke-width="1" rx="6"/>
<text x="24" y="88">音声＝細かい時間ごとの値（サンプル）</text>
<text x="24" y="106" class="tm">の並び（例：1秒に 16,000 点）</text>
<polyline points="30,150 50,133.64 70,126.06 90,131.33 110,146.61 130,163.72 150,173.46 170,170.61 190,156.71 210,139.2 230,127.49 250,127.86" class="l sm w1"/>
