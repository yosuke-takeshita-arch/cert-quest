<text x="270" y="162.11" class="tb ta" text-anchor="middle">次の1点</text>
<text x="24" y="194">それまでの点から次の1点を予測し、</text>
<text x="24" y="212">できた点を足して、また次を予測する</text>
<text x="24" y="230" class="tm">（自己回帰。1秒作るのに 16,000 回）</text>
<text x="12" y="262" class="tb">遠い過去まで見るしくみ</text>
<text x="12" y="282">未来を見ない畳み込み（Causal）を、</text>
<text x="12" y="300">間隔を 1・2・4・8 と倍にして重ねる（Dilated）</text>
