<text x="12" y="564" class="tm">未来のサンプルは見ない（線は左下と真下だけ）</text>
<text x="12" y="590" class="tm">間隔を倍にすると、見る範囲が倍々に広がる</text>
<text x="12" y="608" class="tm">（Dilated 畳み込みの図の②と同じ考えを、</text>
<text x="12" y="626" class="tm">　過去の側だけで使う）</text>
<text x="12" y="650" class="tm">原論文は間隔 1・2・…・512 の10段を1組とし、</text>
<text x="12" y="668" class="tm">1組で 1024 点を見る（これを何組か重ねる）</text>
