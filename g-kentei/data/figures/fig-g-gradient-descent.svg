<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 528" role="img" aria-labelledby="fig-g-gradient-descent-t fig-g-gradient-descent-d">
<title id="fig-g-gradient-descent-t">勾配降下法と、学習率の大きさ</title>
<desc id="fig-g-gradient-descent-d">U字の誤差の曲線の上を、傾きの逆向きに、学習率×傾きの分だけ進むことを繰り返す。3つの図は学習率だけが違う。小さすぎると歩幅が小さく、何回進んでも谷底に着かない。ちょうどよいと、数歩で谷底に着く。大きすぎると、谷底を飛び越えて両側を行き来しながら、だんだん外へ飛び出す（発散）。各図の最初の点には、その点の接線（傾き）を示す。</desc>
