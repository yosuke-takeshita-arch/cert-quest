<polyline points="197.6,108 197.48,106.45 197.11,104.9 196.5,103.38 195.66,101.88 194.58,100.42 193.28,99.01 191.76,97.66 190.04,96.36 188.11,95.14 186,94 183.72,92.94 181.28,91.98 178.69,91.12 175.98,90.36 173.15,89.71 170.24,89.17 167.24,88.75 164.19,88.44 161.11,88.26 158,88.2 154.89,88.26 151.81,88.44 148.76,88.75 145.76,89.17 142.85,89.71 140.02,90.36 137.31,91.12 134.72,91.98 132.28,92.94 130,94 127.89,95.14 125.96,96.36 124.24,97.66 122.72,99.01 121.42,100.42 120.34,101.88 119.5,103.38 118.89,104.9 118.52,106.45 118.4,108 118.52,109.55 118.89,111.1 119.5,112.62 120.34,114.12 121.42,115.58 122.72,116.99 124.24,118.34 125.96,119.64 127.89,120.86 130,122 132.28,123.06 134.72,124.02 137.31,124.88 140.02,125.64 142.85,126.29 145.76,126.83 148.76,127.25 151.81,127.56 154.89,127.74 158,127.8 161.11,127.74 164.19,127.56 167.24,127.25 170.24,126.83 173.15,126.29 175.98,125.64 178.69,124.88 181.28,124.02 183.72,123.06 186,122 188.11,120.86 190.04,119.64 191.76,118.34 193.28,116.99 194.58,115.58 195.66,114.12 196.5,112.62 197.11,111.1 197.48,109.55 197.6,108" class="l swn w1 dot"/>
<line x1="154" y1="108" x2="162" y2="108" class="l w1"/>
<line x1="158" y1="104" x2="158" y2="112" class="l w1"/>
<circle cx="102" cy="122" r="5" class="fs sng" stroke-width="3"/>
<text x="92" y="98" class="tb tng" text-anchor="end">マットの色</text>
<text x="92" y="116" class="tb tng" text-anchor="end">の重み＝0</text>
<text x="12" y="238" class="tb">縦軸の上の角で触れる</text>
<text x="12" y="258" class="tb tng">→ マットの色の重みがちょうど 0</text>
<text x="12" y="278" class="tm">ひし形は角が軸の上にあり、角では片方の</text>
<text x="12" y="296" class="tm">重みが 0。楕円を外へ広げると、先に角に</text>
<text x="12" y="314" class="tm">触れやすい</text>
</g>
