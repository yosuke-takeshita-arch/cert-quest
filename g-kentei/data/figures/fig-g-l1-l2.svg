<line x1="154" y1="108" x2="162" y2="108" class="l w1"/>
<line x1="158" y1="104" x2="158" y2="112" class="l w1"/>
<circle cx="102" cy="122" r="5" class="fs sng" stroke-width="3"/>
<text x="94" y="118" class="tb tng" text-anchor="end">w1＝0</text>
<text x="12" y="238" class="tb">縦軸の上の角で触れる → w1 がちょうど 0</text>
<text x="12" y="258" class="tm">ひし形は角が軸の上に突き出ているので、</text>
<text x="12" y="276" class="tm">楕円を外へ広げると先に角に触れやすい</text>
<text x="12" y="294" class="tm">（楕円を広げる＝誤差を少しずつ許していく）</text>
</g>
