<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1166" role="img" aria-labelledby="fig-g-l1-l2-t fig-g-l1-l2-d">
<title id="fig-g-l1-l2-t">L1 正則化と L2 正則化：2つの重みの地図で比べる</title>
<desc id="fig-g-l1-l2-d">教科書でよく見る、L1とL2を比べる図。まず読み方。家の値段の例で、項目を玄関マットの色と広さの2つにし、2つの重みの組を地図のように平面に置く。横軸は玄関マットの色の重み、縦軸は広さの重み、2本の軸が交わる所はどちらの重みも0。十字の印は、減点なしでいちばん当たる重みの組。楕円は、当たり具合が同じになる重みの組を結んだ線で、地図の等高線と同じ。十字に近い楕円ほどよく当たり、点線の楕円のほうが十字に近い。ひし形と円は、減点が同じ大きさになる重みの組を結んだ線。L1の減点は重みの大きさの合計なので、同じになる線はひし形。L2の減点は重みを2回掛けた値の合計なので、同じになる線は円。赤い丸は選ばれる重み。なぜ接点が選ばれるか：ひし形や円の線の上なら減点はどこも同じなので、その線の上でいちばん当たる点を選ぶ。楕円を十字から少しずつ外へ広げる（当たりを少しずつ悪くする）と、最初に線に触れた点がそれで、楕円と線の接点になる。L1のひし形は角が軸の上にあり、角では片方の重みが0。楕円を広げると先に角に触れやすく、この図では縦軸の上の角で触れて、玄関マットの色の重みがちょうど0になる。L2の円には角が無いので、軸から外れた点で触れることが多く、玄関マットの色の重みは0にならず小さく残る。割に合うかを比べた図（L1・L2の図）を、重み2つの地図で見たもの。Elastic NetはL1とL2の減点を両方足す。</desc>
<text x="12" y="20" class="tb">教科書でよく見る図：L1 と L2 を地図で比べる</text>
<text x="12" y="44" class="tb">まず読み方</text>
<text x="12" y="64" class="tm">家の値段の例で、項目を 2 つにして、</text>
<text x="12" y="82" class="tm">2 つの重みの組を地図のように置く</text>
<line x1="21" y1="96" x2="21" y2="120" class="l sm w1"/>
<line x1="13" y1="112" x2="31" y2="112" class="l sm w1"/>
<text x="40" y="104">横軸＝玄関マットの色の重み</text>
<text x="40" y="122">縦軸＝広さの重み</text>
<text x="40" y="140" class="tm">軸が交わる所＝どちらの重みも 0</text>
<line x1="16" y1="162" x2="26" y2="162" class="l w1"/>
<line x1="21" y1="157" x2="21" y2="167" class="l w1"/>
<text x="40" y="167">＝減点なしで、いちばん当たる重みの組</text>
<ellipse cx="21" cy="186" rx="9" ry="5" class="l swn w2"/>
<text x="40" y="191">＝当たり具合が同じになる重みの組</text>
<text x="40" y="209" class="tm">地図の等高線と同じ。＋に近い楕円ほど</text>
<text x="40" y="227" class="tm">よく当たる（点線のほうが＋に近い）</text>
<polygon points="21,240 29,248 21,256 13,248" class="fas sa" stroke-width="2"/>
<text x="40" y="253">＝減点が同じ大きさになる重みの組</text>
<text x="40" y="271" class="tm">L1：重みの大きさの合計が同じ → ひし形</text>
<text x="40" y="289" class="tm">L2：重み×重みの合計が同じ → 円</text>
<circle cx="21" cy="308" r="5" class="fs sng" stroke-width="3"/>
<text x="40" y="313" class="tb">＝選ばれる重み</text>
<line x1="12" y1="328" x2="308" y2="328" class="l sb w1"/>
<text x="12" y="350" class="tb">なぜ、触れた点（接点）が選ばれるか</text>
<text x="12" y="370" class="tm">ひし形・円の線の上なら、減点はどこも同じ。</text>
<text x="12" y="388" class="tm">だから、その線の上でいちばん当たる点を選ぶ。</text>
<text x="12" y="406" class="tm">楕円を＋から少しずつ外へ広げる（当たりを</text>
<text x="12" y="424" class="tm">少しずつ悪くする）と、最初に線に触れた点が</text>
<text x="12" y="442" class="tm">それ。だから、楕円と線の接点が選ばれる</text>
<line x1="12" y1="456" x2="308" y2="456" class="l sb w1"/>
<g transform="translate(0,434)">
<text x="12" y="44" class="tb">① L1：ひし形</text>
