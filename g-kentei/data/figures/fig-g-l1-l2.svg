<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 818" role="img" aria-labelledby="fig-g-l1-l2-t fig-g-l1-l2-d">
<title id="fig-g-l1-l2-t">L1 正則化と L2 正則化：2つの重みの平面で比べる</title>
<desc id="fig-g-l1-l2-d">横軸を重みw1、縦軸を重みw2とした平面。十字の印は、罰則なしで誤差がいちばん小さくなる重み。楕円は、誤差が同じになる重みの組を結んだ線で、点線の楕円のほうが誤差は小さい。青い領域は、罰則で許される重みの範囲。赤い丸は、範囲の中で誤差がいちばん小さい点で、これが選ばれる重み。L1の範囲はひし形で、角が軸の上に突き出ている。楕円を外へ広げていくと先に角に触れやすく、角ではw1がちょうど0になる。L2の範囲は円で角が無いので、楕円は軸から外れた点で触れ、w1もw2も0にならない。1枚目の図の、L1は小さい重みを0まで押し、L2は0まで押さないことを、2つの重みで見たもの。L1とL2を組み合わせたものがElastic Net。</desc>
<text x="12" y="20" class="tb">L1 と L2 を、2つの重みの平面で比べる</text>
<text x="12" y="40" class="tm">横軸＝重み w1、縦軸＝重み w2</text>
<line x1="16" y1="58" x2="26" y2="58" class="l w1"/>
<line x1="21" y1="53" x2="21" y2="63" class="l w1"/>
<text x="36" y="63" class="tm">＝誤差がいちばん小さい重み（罰則なし）</text>
<ellipse cx="21" cy="82" rx="9" ry="5" class="l swn w2"/>
<text x="36" y="87" class="tm">＝誤差が同じになる重みの組</text>
<text x="36" y="105" class="tm">（点線の楕円のほうが誤差は小さい）</text>
<polygon points="21,118 29,126 21,134 13,126" class="fas sa" stroke-width="2"/>
<text x="36" y="131" class="tm">＝罰則で許される重みの範囲</text>
<circle cx="21" cy="150" r="5" class="fs sng" stroke-width="3"/>
<text x="36" y="155" class="tm">＝範囲の中で誤差がいちばん小さい点</text>
<text x="36" y="173" class="tb">＝選ばれる重み</text>
<line x1="12" y1="186" x2="308" y2="186" class="l sb w1"/>
<g transform="translate(0,166)">
