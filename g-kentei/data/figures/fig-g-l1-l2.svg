<line x1="12" y1="1054" x2="308" y2="1054" class="l sb w1"/>
<text x="12" y="1076" class="tm">割に合うかを比べた図（L1・L2 の図）を、</text>
<text x="12" y="1094" class="tm">重み 2 つの地図で見たもの</text>
<text x="12" y="1118" class="tb">Elastic Net ＝ L1 と L2 の減点を両方足す</text>
</svg>
