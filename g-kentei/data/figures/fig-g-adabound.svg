<text x="12" y="250" class="tm">t＝何回目の更新か</text>
<text x="12" y="270" class="tb sng tng">上限＝0.1＋0.1÷(0.001×t)</text>
<text x="12" y="290" class="tb sng tng">下限＝0.1−0.1÷(0.001×t＋1)</text>
<rect x="40" y="304" width="264" height="150" class="sb fs" stroke-width="1"/>
