<text x="35" y="398.5" class="tm" text-anchor="end">0.1</text>
<text x="35" y="338.5" class="tm" text-anchor="end">0.2</text>
<text x="40" y="470" class="tm" text-anchor="start">1</text>
<text x="198.4" y="470" class="tm" text-anchor="middle">1,000</text>
<text x="251.20000000000002" y="470" class="tm" text-anchor="middle">1万</text>
<text x="304" y="470" class="tm" text-anchor="end">10万</text>
<text x="172" y="488" class="tm" text-anchor="middle">更新の回数 t（目盛りは10倍ずつ）</text>
<text x="12" y="510" class="tm">赤い帯＝上限と下限の間。学習率はこの中</text>
<text x="12" y="528" class="tm">に収まる（はみ出す分は端に貼り付く）</text>
