<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 978" role="img" aria-labelledby="fig-g-adabound-t fig-g-adabound-d">
<title id="fig-g-adabound-t">AdaBound：学習率の上限と下限を0.1へ狭め、初めはAdam、終わりはSGDの動きにする</title>
<desc id="fig-g-adabound-d">AdaBoundは、Adamの学習率（1回に動かす幅、パラメータごと）に上限と下限を付け、その幅を学習が進むにつれて0.1へ狭めていく最適化手法。①Adamのままだと、パラメータごとの学習率が極端になりうる（例：パラメータ1は0.5、2は0.001）。SGDより汎化が劣ったり収束しなかったりすることがある（Luoら2019）。②上限と下限（原論文の実験の式。tは何回目の更新か）：上限＝0.1＋0.1÷(0.001×t)、下限＝0.1−0.1÷(0.001×t＋1)。グラフは横が更新の回数t（目盛りは10倍ずつ）、縦が学習率で、点線が0.1。赤い帯が上限と下限の間で、学習率はこの中に収まり、はみ出す分は端に貼り付く。青がパラメータ1、茶がパラメータ2。表：1回目は上限約100・下限約0.0001で、パラメータ1は0.5、2は0.001のまま。1,000回目は上限0.2・下限0.05で、パラメータ1は0.2、2は0.05。1万回目は上限0.11・下限0.091で、パラメータ1は0.11、2は0.091。10万回目は上限0.101・下限0.099で、パラメータ1は0.101、2は0.099。③結果：初めは幅が広く学習率はAdamのまま、終わりはどれもほぼ0.1で、学習率0.1のSGDと同じ動き。初めはAdamの速さ、終わりはSGDの汎化を取ろうとした。AMSBoundは、Adamの改良版のAMSGradに同じ上限と下限を付けたもの。言葉：パラメータはモデルの中の、学習で決まる数（重みなど）。</desc>
<text x="12" y="20" class="tb">AdaBound：学習率に上限と下限を付け、</text>
<text x="12" y="40" class="tb">その幅を 0.1 へ狭めていく</text>
<text x="12" y="62" class="tm">学習率＝1回に動かす幅（パラメータごと）</text>
<rect x="12" y="76" width="296" height="52" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="99" class="tb">言葉：パラメータ</text>
<text x="22" y="117">パラメータ：学習で決まる数（重みなど）</text>
<g transform="translate(0,64)">
<rect x="12" y="76" width="296" height="112" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="24" y="96" class="tb tng">① Adam のままだと</text>
<text x="24" y="118">パラメータごとの学習率が極端になりうる</text>
<text x="24" y="138" class="tm">（例：パラメータ1 は 0.5、2 は 0.001）</text>
<text x="24" y="160" class="tb">→ SGD より汎化が劣る・収束しない</text>
<text x="24" y="178" class="tb">ことがある（Luo ら 2019）</text>
<line x1="160" y1="194" x2="160" y2="202.4" class="l sm w1"/>
<polygon points="160,208 156.5,202.4 163.5,202.4" class="fm"/>
