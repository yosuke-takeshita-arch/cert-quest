<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 552" role="img" aria-labelledby="fig-g-correlation-t fig-g-correlation-d">
<title id="fig-g-correlation-t">散布図と相関係数：強さ・向き・曲線の落とし穴</title>
<desc id="fig-g-correlation-d">5つの散布図。強い正の相関は右上がりの直線状で相関係数は約1。正の相関は右上がりでややばらつき、約0.7。無相関は点がばらばらで約0。負の相関は右下がりで約−0.7。最後は、Yが Xの2乗でXが左右対称のとき、点は放物線に並んで関係は強いのに、相関係数は0になる。相関係数は直線的な関係だけを測る。単位を変えても相関係数は変わらず、共分散は変わる。相互情報量は曲がった関係も含めて依存の強さを表し、独立のときだけ0になる。</desc>
<text x="12" y="20" class="tb">強い正の相関</text>
