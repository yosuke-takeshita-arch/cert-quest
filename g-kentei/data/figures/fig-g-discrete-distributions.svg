<text x="98.33" y="550" class="tm" text-anchor="middle">3</text>
<rect x="112.67" y="479.5" width="20.67" height="52.5" class="fwn swn"/>
<text x="123" y="550" class="tm" text-anchor="middle">4</text>
<rect x="137.33" y="500.5" width="20.67" height="31.5" class="fwn swn"/>
<text x="147.67" y="550" class="tm" text-anchor="middle">5</text>
<rect x="162" y="516.25" width="20.67" height="15.75" class="fwn swn"/>
<text x="172.33" y="550" class="tm" text-anchor="middle">6</text>
<rect x="186.67" y="525.25" width="20.67" height="6.75" class="fwn swn"/>
<text x="197" y="550" class="tm" text-anchor="middle">7</text>
<rect x="211.33" y="529.47" width="20.67" height="2.53" class="fwn swn"/>
<text x="221.67" y="550" class="tm" text-anchor="middle">8</text>
<rect x="236" y="531.16" width="20.67" height="0.84" class="fwn swn"/>
<text x="246.33" y="550" class="tm" text-anchor="middle">9</text>
<rect x="260.67" y="531.75" width="20.67" height="0.25" class="fwn swn"/>
<text x="271" y="550" class="tm" text-anchor="middle">10</text>
<text x="295.67" y="550" class="tm" text-anchor="middle">…</text>
<line x1="12" y1="532" x2="308" y2="532" class="l sm w1"/>
<text x="12" y="572" class="tm">横軸＝来た人数（0, 1, 2, …。上限なし）</text>
<text x="12" y="592" class="tb">平均 λ ＝ 3人、分散も λ ＝ 3</text>
</svg>
