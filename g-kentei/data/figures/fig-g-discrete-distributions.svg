<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 604" role="img" aria-labelledby="fig-g-discrete-distributions-t fig-g-discrete-distributions-d">
<title id="fig-g-discrete-distributions-t">ベルヌーイ分布・二項分布・ポアソン分布</title>
<desc id="fig-g-discrete-distributions-d">3つの棒グラフ。棒の高さは、その回数になる確率。①ベルヌーイ分布は、コインを1回投げたときの分布で、結果は裏（0）か表（1）の2通りだけ。表の確率pが0.5なので、0も1も確率0.5。平均はp＝0.5で、二項分布でn＝1にしたものと同じ。②二項分布は、同じコインを10回投げたときに表が出る回数の分布で、横軸は0回から10回まで（上限はn）。5回がいちばん出やすく、0回や10回はめったに出ない。平均はnp＝10×0.5＝5回、分散はnp（1−p）＝10×0.5×0.5＝2.5。③ポアソン分布は、1時間に平均3人の客が来る店で、1時間に来る人数の分布で、横軸は0人、1人、2人と続き上限が無い。2人と3人がいちばん出やすい。平均はλ＝3人で、分散もλ＝3。</desc>
<text x="12" y="18" class="tm">棒の高さ＝その回数になる確率</text>
<text x="12" y="44" class="tb">① ベルヌーイ分布：コインを1回投げる</text>
<rect x="14" y="58" width="144" height="70" class="fas sa"/>
<text x="86" y="146" class="tm" text-anchor="middle">0（裏）</text>
<rect x="162" y="58" width="144" height="70" class="fas sa"/>
<text x="234" y="146" class="tm" text-anchor="middle">1（表）</text>
<line x1="12" y1="128" x2="308" y2="128" class="l sm w1"/>
<text x="86" y="118" class="tb" text-anchor="middle">0.5</text>
<text x="234" y="118" class="tb" text-anchor="middle">0.5</text>
<text x="12" y="168" class="tm">結果は2通りだけ（表の確率 p＝0.5）</text>
<text x="12" y="188" class="tb">平均 p ＝ 0.5（二項分布で n＝1 のとき）</text>
<line x1="12" y1="208" x2="308" y2="208" class="l sb w1"/>
<text x="12" y="236" class="tb">② 二項分布：コインを10回投げる</text>
<rect x="14" y="319.72" width="22.91" height="0.28" class="fok sok"/>
<text x="25.45" y="338" class="tm" text-anchor="middle">0</text>
<rect x="40.91" y="317.22" width="22.91" height="2.78" class="fok sok"/>
<text x="52.36" y="338" class="tm" text-anchor="middle">1</text>
<rect x="67.82" y="307.5" width="22.91" height="12.5" class="fok sok"/>
<text x="79.27" y="338" class="tm" text-anchor="middle">2</text>
<rect x="94.73" y="286.67" width="22.91" height="33.33" class="fok sok"/>
<text x="106.18" y="338" class="tm" text-anchor="middle">3</text>
<rect x="121.64" y="261.67" width="22.91" height="58.33" class="fok sok"/>
<text x="133.09" y="338" class="tm" text-anchor="middle">4</text>
<rect x="148.55" y="250" width="22.91" height="70" class="fok sok"/>
<text x="160" y="338" class="tm" text-anchor="middle">5</text>
<rect x="175.45" y="261.67" width="22.91" height="58.33" class="fok sok"/>
<text x="186.91" y="338" class="tm" text-anchor="middle">6</text>
<rect x="202.36" y="286.67" width="22.91" height="33.33" class="fok sok"/>
<text x="213.82" y="338" class="tm" text-anchor="middle">7</text>
<rect x="229.27" y="307.5" width="22.91" height="12.5" class="fok sok"/>
<text x="240.73" y="338" class="tm" text-anchor="middle">8</text>
<rect x="256.18" y="317.22" width="22.91" height="2.78" class="fok sok"/>
<text x="267.64" y="338" class="tm" text-anchor="middle">9</text>
<rect x="283.09" y="319.72" width="22.91" height="0.28" class="fok sok"/>
<text x="294.55" y="338" class="tm" text-anchor="middle">10</text>
<line x1="12" y1="320" x2="308" y2="320" class="l sm w1"/>
<text x="12" y="360" class="tm">横軸＝表が出た回数（0〜10回。上限は n）</text>
<text x="12" y="380" class="tb">平均 np ＝ 10×0.5 ＝ 5回</text>
<text x="12" y="400" class="tb">分散 np(1−p) ＝ 10×0.5×0.5 ＝ 2.5</text>
<line x1="12" y1="420" x2="308" y2="420" class="l sb w1"/>
<text x="12" y="448" class="tb">③ ポアソン分布：1時間に来る客の数</text>
<rect x="14" y="516.44" width="20.67" height="15.56" class="fwn swn"/>
<text x="24.33" y="550" class="tm" text-anchor="middle">0</text>
<rect x="38.67" y="485.33" width="20.67" height="46.67" class="fwn swn"/>
<text x="49" y="550" class="tm" text-anchor="middle">1</text>
<rect x="63.33" y="462" width="20.67" height="70" class="fwn swn"/>
