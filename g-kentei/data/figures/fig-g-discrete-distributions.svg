<text x="145.2" y="506" class="tm" text-anchor="middle">4</text>
<rect x="162" y="469.77" width="25.6" height="18.23" class="fwn swn"/>
<text x="174.8" y="506" class="tm" text-anchor="middle">5</text>
<rect x="191.6" y="480.4" width="25.6" height="7.6" class="fwn swn"/>
<text x="204.4" y="506" class="tm" text-anchor="middle">6</text>
<rect x="221.2" y="485.29" width="25.6" height="2.71" class="fwn swn"/>
<text x="234" y="506" class="tm" text-anchor="middle">7</text>
<rect x="250.8" y="487.15" width="25.6" height="0.85" class="fwn swn"/>
<text x="263.6" y="506" class="tm" text-anchor="middle">8</text>
<rect x="280.4" y="487.76" width="25.6" height="0.24" class="fwn swn"/>
<text x="293.2" y="506" class="tm" text-anchor="middle">9</text>
<line x1="12" y1="488" x2="308" y2="488" class="l sm w1"/>
<text x="12" y="528" class="tm">一定の範囲で、出来事が起きる回数</text>
<text x="12" y="548" class="tb">平均 λ ＝ 2.5、分散も λ ＝ 2.5</text>
</svg>
