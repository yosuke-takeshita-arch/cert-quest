<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-g-discrete-distributions-t fig-g-discrete-distributions-d">
<title id="fig-g-discrete-distributions-t">ベルヌーイ分布・二項分布・ポアソン分布</title>
<desc id="fig-g-discrete-distributions-d">3つの棒グラフ。ベルヌーイ分布は、成功か失敗かの2通りだけをとる1回の試行の分布で、例は成功確率0.6のとき、失敗0が0.4、成功1が0.6。二項分布は、成功確率pの独立な試行をn回行ったときの成功回数の分布で、平均はnp、分散はnp（1−p）。例はn＝10、p＝0.6で、平均6、分散2.4。ポアソン分布は、一定の範囲で出来事が起きる回数の分布で、平均も分散も平均の発生回数λに等しい。例はλ＝2.5で、平均2.5、分散2.5。</desc>
<text x="12" y="20" class="tb">① ベルヌーイ分布（成功確率 0.6）</text>
<rect x="14" y="57.33" width="144" height="46.67" class="fas sa"/>
<text x="86" y="122" class="tm" text-anchor="middle">0</text>
<rect x="162" y="34" width="144" height="70" class="fas sa"/>
<text x="234" y="122" class="tm" text-anchor="middle">1</text>
<line x1="12" y1="104" x2="308" y2="104" class="l sm w1"/>
<text x="86" y="94" class="tb" text-anchor="middle">0.4</text>
<text x="234" y="94" class="tb" text-anchor="middle">0.6</text>
<text x="12" y="144" class="tm">1回の試行。成功(1)か失敗(0)か</text>
<text x="12" y="164" class="tb">平均 p ＝ 0.6（二項分布の n＝1）</text>
<line x1="12" y1="184" x2="308" y2="184" class="l sb w1"/>
<text x="12" y="212" class="tb">② 二項分布（n＝10、p＝0.6）</text>
<rect x="14" y="295.97" width="22.91" height="0.03" class="fok sok"/>
<text x="25.45" y="314" class="tm" text-anchor="middle">0</text>
<rect x="40.91" y="295.56" width="22.91" height="0.44" class="fok sok"/>
<text x="52.36" y="314" class="tm" text-anchor="middle">1</text>
<rect x="67.82" y="293.04" width="22.91" height="2.96" class="fok sok"/>
<text x="79.27" y="314" class="tm" text-anchor="middle">2</text>
<rect x="94.73" y="284.15" width="22.91" height="11.85" class="fok sok"/>
<text x="106.18" y="314" class="tm" text-anchor="middle">3</text>
<rect x="121.64" y="264.89" width="22.91" height="31.11" class="fok sok"/>
<text x="133.09" y="314" class="tm" text-anchor="middle">4</text>
<rect x="148.55" y="240" width="22.91" height="56" class="fok sok"/>
<text x="160" y="314" class="tm" text-anchor="middle">5</text>
<rect x="175.45" y="226" width="22.91" height="70" class="fok sok"/>
<text x="186.91" y="314" class="tm" text-anchor="middle">6</text>
<rect x="202.36" y="236" width="22.91" height="60" class="fok sok"/>
<text x="213.82" y="314" class="tm" text-anchor="middle">7</text>
<rect x="229.27" y="262.25" width="22.91" height="33.75" class="fok sok"/>
<text x="240.73" y="314" class="tm" text-anchor="middle">8</text>
<rect x="256.18" y="284.75" width="22.91" height="11.25" class="fok sok"/>
<text x="267.64" y="314" class="tm" text-anchor="middle">9</text>
<rect x="283.09" y="294.31" width="22.91" height="1.69" class="fok sok"/>
<text x="294.55" y="314" class="tm" text-anchor="middle">10</text>
<line x1="12" y1="296" x2="308" y2="296" class="l sm w1"/>
<text x="12" y="336" class="tm">n回のうちの成功回数の分布</text>
<text x="12" y="356" class="tb">平均 np ＝ 6、分散 np(1−p) ＝ 2.4</text>
<line x1="12" y1="376" x2="308" y2="376" class="l sb w1"/>
<text x="12" y="404" class="tb">③ ポアソン分布（λ＝2.5）</text>
<rect x="14" y="465.6" width="25.6" height="22.4" class="fwn swn"/>
<text x="26.8" y="506" class="tm" text-anchor="middle">0</text>
<rect x="43.6" y="432" width="25.6" height="56" class="fwn swn"/>
<text x="56.4" y="506" class="tm" text-anchor="middle">1</text>
<rect x="73.2" y="418" width="25.6" height="70" class="fwn swn"/>
