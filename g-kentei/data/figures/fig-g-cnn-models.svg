<rect x="15" y="601" width="8" height="8" class="fas sa" stroke-width="1"/>
<rect x="24" y="601" width="8" height="8" class="fas sa" stroke-width="1"/>
<rect x="33" y="601" width="8" height="8" class="fas sa" stroke-width="1"/>
<rect x="42" y="601" width="8" height="8" class="fas sa" stroke-width="1"/>
<text x="66" y="596" class="tb">ViT</text>
<text x="308" y="596" class="tm" text-anchor="end">2020年</text>
<text x="66" y="618">パッチに分けて Transformer</text>
</svg>
