<rect x="46" y="414" width="7" height="20" class="fas sa" stroke-width="1"/>
<text x="66" y="416" class="tb">SENet</text>
<text x="308" y="416" class="tm" text-anchor="end">2017年</text>
<text x="66" y="438">チャネルの重みを付け直す</text>
<line x1="12" y1="448" x2="308" y2="448" class="l sb w1"/>
<rect x="14" y="472" width="24" height="14" class="fas sa" stroke-width="1.5"/>
<rect x="42" y="476" width="8" height="8" class="fok sok" stroke-width="1.5"/>
<text x="66" y="476" class="tb">MobileNet</text>
<text x="308" y="476" class="tm" text-anchor="end">2017年</text>
<text x="66" y="498">深さ方向分離畳み込みで軽量化</text>
<line x1="12" y1="508" x2="308" y2="508" class="l sb w1"/>
<rect x="20" y="530" width="22" height="22" class="fas sa" stroke-width="1.5"/>
<line x1="44" y1="540" x2="54" y2="540" class="l sok w2"/>
<polyline points="49,542.75 54,540 49,537.25" class="l sok w2"/>
<line x1="30" y1="528" x2="30" y2="520" class="l sok w2"/>
<polyline points="32.75,525 30,520 27.25,525" class="l sok w2"/>
<text x="66" y="536" class="tb">EfficientNet</text>
<text x="308" y="536" class="tm" text-anchor="end">2019年</text>
<text x="66" y="558">深さ・幅・解像度をまとめて拡大</text>
<line x1="12" y1="568" x2="308" y2="568" class="l sb w1"/>
<rect x="15" y="592" width="8" height="8" class="fas sa" stroke-width="1"/>
<rect x="24" y="592" width="8" height="8" class="fas sa" stroke-width="1"/>
