<text x="12" y="292" class="tm">　（バイアスとバリアンスのトレードオフ）</text>
<text x="12" y="318" class="tb tng">ピーク：訓練データにちょうど合わせ</text>
<text x="12" y="338" class="tb tng">　られる大きさ（補間のしきい値）付近</text>
