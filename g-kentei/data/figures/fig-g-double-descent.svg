<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 418" role="img" aria-labelledby="fig-g-double-descent-t fig-g-double-descent-d">
<title id="fig-g-double-descent-t">二重降下現象</title>
<desc id="fig-g-double-descent-d">横軸がモデルの大きさ、縦軸がテスト誤差のグラフ。モデルを大きくすると、テスト誤差はいったん下がり、次に上がってピークをつくり、さらに大きくすると再び下がる。ピークは、モデルが訓練データにちょうど合わせられる大きさ（補間のしきい値）付近に現れる。左側は従来の見方（バイアスとバリアンスのトレードオフで、複雑にしすぎると悪くなる）。右側は、さらに大きくすると再び良くなる領域。</desc>
<text x="12" y="20" class="tb">テスト誤差とモデルの大きさ</text>
