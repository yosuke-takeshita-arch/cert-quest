<line x1="14" y1="518" x2="300" y2="518" class="l sm w1"/>
<circle cx="14" cy="518" r="3.5" class="fok sok"/>
<circle cx="66" cy="518" r="3.5" class="fok sok"/>
<circle cx="92" cy="518" r="3.5" class="fok sok"/>
<circle cx="144" cy="518" r="3.5" class="fok sok"/>
<circle cx="196" cy="518" r="3.5" class="fok sok"/>
<circle cx="222" cy="518" r="3.5" class="fok sok"/>
<circle cx="274" cy="518" r="3.5" class="fok sok"/>
<text x="12" y="552" class="tb">1つの重みを表すビット数が減る</text>
<line x1="12" y1="570" x2="308" y2="570" class="l sb w1"/>
<text x="12" y="594" class="tb">Deep Compression</text>
<text x="12" y="616">3つを組み合わせる：</text>
<text x="12" y="636">プルーニング・量子化・ハフマン符号化</text>
<text x="12" y="658" class="tb tok">保存サイズが 35〜49分の1 に</text>
<text x="12" y="692" class="tb">宝くじ仮説</text>
<text x="12" y="714">最初のネットワークの中に、単独で学習しても</text>
<text x="12" y="734">同じ精度に達する小さな部分がある</text>
</svg>
