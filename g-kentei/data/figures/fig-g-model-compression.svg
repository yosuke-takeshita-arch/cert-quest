<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 746" role="img" aria-labelledby="fig-g-model-compression-t fig-g-model-compression-d">
<title id="fig-g-model-compression-t">モデルの軽量化：蒸留・プルーニング・量子化</title>
<desc id="fig-g-model-compression-d">3つの軽量化の手法。蒸留は、大きな教師モデルが出す各クラスの確率（ソフトターゲット）を、小さな生徒モデルがまねて学ぶ。プルーニングは、学習済みネットワークの重要度の低い接続を取り除いて、重みの数を減らす。量子化は、重みや計算を32ビットの浮動小数点数から8ビットの整数などの少ないビット数で表す。Deep Compression は、プルーニング、量子化、ハフマン符号化を組み合わせて、保存サイズを35〜49分の1にした。宝くじ仮説は、最初の大きなネットワークの中に、単独で学習しても同じ精度に達する小さな部分がある、という仮説。</desc>
<text x="12" y="20" class="tb">① 蒸留：教師の確率をまねる</text>
<rect x="12" y="36" width="82" height="62" class="fas sa" stroke-width="1.5"/>
<text x="53" y="62.5" text-anchor="middle">大きな</text>
<text x="53" y="80.5" text-anchor="middle">教師モデル</text>
<line x1="94" y1="67" x2="112" y2="67" class="l w2"/>
<polyline points="105,70.85 112,67 105,63.15" class="l w2"/>
<rect x="120" y="45.92" width="22" height="52.08" class="fok sok" stroke-width="1.5"/>
<text x="131" y="116" class="tm" text-anchor="middle">2</text>
<rect x="150" y="90.56" width="22" height="7.44" class="fok sok" stroke-width="1.5"/>
<text x="161" y="116" class="tm" text-anchor="middle">3</text>
<rect x="180" y="95.52" width="22" height="2.48" class="fok sok" stroke-width="1.5"/>
<text x="191" y="116" class="tm" text-anchor="middle">7</text>
<line x1="116" y1="98" x2="210" y2="98" class="l sb w1"/>
<line x1="214" y1="67" x2="232" y2="67" class="l w2"/>
<polyline points="225,70.85 232,67 225,63.15" class="l w2"/>
<rect x="234" y="52" width="74" height="32" class="fs sb" stroke-width="1.5"/>
<text x="271" y="63.5" text-anchor="middle">小さな</text>
<text x="271" y="81.5" text-anchor="middle">生徒モデル</text>
<text x="12" y="144">各クラスの確率（ソフトターゲット）をまねる</text>
<text x="12" y="164" class="tm">「2 は 3 に少し似ている」も伝わる</text>
<line x1="12" y1="182" x2="308" y2="182" class="l sb w1"/>
<text x="12" y="206" class="tb">② プルーニング：つなぎを減らす</text>
<line x1="30" y1="232" x2="100" y2="224" class="l sm w1 dot"/>
<line x1="30" y1="232" x2="100" y2="246" class="l sm w1 dot"/>
<line x1="30" y1="232" x2="100" y2="268" class="l sm w1 dot"/>
<line x1="30" y1="232" x2="100" y2="290" class="l sm w1 dot"/>
<line x1="30" y1="260" x2="100" y2="224" class="l sa w1"/>
