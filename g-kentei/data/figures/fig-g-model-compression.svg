<line x1="30" y1="260" x2="100" y2="290" class="l sa w1"/>
<line x1="30" y1="288" x2="100" y2="224" class="l sa w1"/>
<line x1="30" y1="288" x2="100" y2="246" class="l sa w1"/>
<line x1="30" y1="288" x2="100" y2="268" class="l sa w1"/>
<line x1="30" y1="288" x2="100" y2="290" class="l sa w1"/>
<line x1="100" y1="224" x2="170" y2="232" class="l sa w1"/>
<line x1="100" y1="224" x2="170" y2="260" class="l sa w1"/>
<line x1="100" y1="224" x2="170" y2="288" class="l sa w1"/>
<line x1="100" y1="246" x2="170" y2="232" class="l sm w1 dot"/>
<line x1="100" y1="246" x2="170" y2="260" class="l sm w1 dot"/>
<line x1="100" y1="246" x2="170" y2="288" class="l sm w1 dot"/>
<line x1="100" y1="268" x2="170" y2="232" class="l sa w1"/>
<line x1="100" y1="268" x2="170" y2="260" class="l sa w1"/>
<line x1="100" y1="268" x2="170" y2="288" class="l sa w1"/>
<line x1="100" y1="290" x2="170" y2="232" class="l sa w1"/>
<line x1="100" y1="290" x2="170" y2="260" class="l sa w1"/>
<line x1="100" y1="290" x2="170" y2="288" class="l sa w1"/>
<circle cx="30" cy="232" r="6" class="fas sa"/>
<circle cx="30" cy="260" r="6" class="fas sa"/>
<circle cx="30" cy="288" r="6" class="fas sa"/>
<circle cx="100" cy="224" r="6" class="fas sa"/>
<circle cx="100" cy="246" r="6" class="fas sa"/>
<circle cx="100" cy="268" r="6" class="fas sa"/>
<circle cx="100" cy="290" r="6" class="fas sa"/>
