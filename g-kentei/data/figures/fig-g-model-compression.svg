<text x="206" y="252">消す接続は</text>
<text x="206" y="272">点線の部分</text>
<text x="12" y="330">重要度の低い接続（重み）を取り除く</text>
<text x="12" y="350" class="tb">→ 重みの「数」が減る</text>
<line x1="12" y1="368" x2="308" y2="368" class="l sb w1"/>
<text x="12" y="392" class="tb">③ 量子化：数を粗い目盛りに</text>
<text x="12" y="418" class="tm">32ビット浮動小数点</text>
<line x1="12" y1="436" x2="308" y2="436" class="l sm w1"/>
<circle cx="28" cy="436" r="3.5" class="fa sa"/>
<circle cx="67" cy="436" r="3.5" class="fa sa"/>
