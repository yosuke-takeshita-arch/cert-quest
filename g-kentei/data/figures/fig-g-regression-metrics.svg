<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 716" role="img" aria-labelledby="fig-g-regression-metrics-t fig-g-regression-metrics-d">
<title id="fig-g-regression-metrics-t">回帰の評価指標：MAE・MSE・RMSE</title>
<desc id="fig-g-regression-metrics-d">予測と実測の差が3つのデータでプラス2、マイナス4、プラス3だった例。MAEは、符号を外した大きさ2、4、3の平均で、外れの大きさの合計÷件数＝2＋4＋3＝9、9÷3＝3。MSEは、それぞれを2回掛けた2×2＝4、(−4)×(−4)＝16、3×3＝9の平均で、二乗の合計÷件数＝4＋16＋9＝29、29÷3≒9.67。二乗するとマイナスも正になり、正方形の面積のように、大きな差ほど急に大きくなる。RMSEはMSEの平方根（2回掛けるとその数になる数）で、√9.67≒3.11（3.11×3.11≒9.67）。二乗で単位も二乗になったのを元に戻すので、元のデータと同じ単位で読める。MSEとRMSEは大きな外れを強く罰し、MAEは外れ値の影響を受けにくい。</desc>
<text x="12" y="20" class="tb">予測と実測の差（3つのデータ）</text>
<line x1="24" y1="82" x2="300" y2="82" class="l sm w1"/>
<text x="12" y="58" class="tm">差</text>
<rect x="50" y="58" width="40" height="24" class="fas sa" stroke-width="1.5"/>
<text x="70" y="52" class="tb" text-anchor="middle">＋2</text>
<rect x="130" y="82" width="40" height="48" class="fwn swn" stroke-width="1.5"/>
<text x="150" y="148" class="tb" text-anchor="middle">−4</text>
<rect x="210" y="46" width="40" height="36" class="fas sa" stroke-width="1.5"/>
<text x="230" y="40" class="tb" text-anchor="middle">＋3</text>
<line x1="12" y1="158" x2="308" y2="158" class="l sb w1"/>
<text x="12" y="182" class="tb">① MAE：絶対値の平均</text>
<text x="12" y="200" class="tm">符号（＋−）を外した大きさで平均する</text>
<rect x="12" y="212" width="40" height="18" class="fas sa" stroke-width="1.5"/>
<text x="60" y="226" class="tb">2</text>
<rect x="12" y="238" width="80" height="18" class="fas sa" stroke-width="1.5"/>
<text x="100" y="252" class="tb">4（−4 の符号を外す）</text>
<rect x="12" y="264" width="60" height="18" class="fas sa" stroke-width="1.5"/>
<text x="80" y="278" class="tb">3</text>
<text x="12" y="304">外れの大きさの合計 ÷ 件数</text>
<text x="12" y="324" class="tb ta">2＋4＋3＝9、9÷3 ＝ 3</text>
<line x1="12" y1="340" x2="308" y2="340" class="l sb w1"/>
<text x="12" y="364" class="tb">② MSE：二乗（正方形の面積）の平均</text>
<text x="12" y="382" class="tm">2回掛けると、マイナスも正の数になる</text>
<rect x="12" y="394" width="28" height="28" class="fwn swn" stroke-width="1.5"/>
<text x="26" y="413" class="tb" text-anchor="middle">4</text>
<rect x="54" y="394" width="56" height="56" class="fwn swn" stroke-width="1.5"/>
<text x="82" y="427" class="tb" text-anchor="middle">16</text>
<rect x="124" y="394" width="42" height="42" class="fwn swn" stroke-width="1.5"/>
<text x="145" y="420" class="tb" text-anchor="middle">9</text>
<text x="12" y="472" class="tm">2×2＝4、(−4)×(−4)＝16、3×3＝9</text>
<text x="12" y="494">二乗の合計 ÷ 件数</text>
<text x="12" y="514" class="tb twn">4＋16＋9＝29、29÷3 ≒ 9.67</text>
<text x="12" y="534" class="tm">大きな差ほど面積が急に大きくなる</text>
<line x1="12" y1="552" x2="308" y2="552" class="l sb w1"/>
<text x="12" y="576" class="tb">③ RMSE：MSE の平方根</text>
<text x="12" y="594" class="tm">二乗で単位も二乗になったのを元に戻す</text>
<text x="12" y="612" class="tm">√＝2回掛けるとその数になる数</text>
<text x="12" y="634" class="tb tok">√9.67 ≒ 3.11（3.11×3.11≒9.67）</text>
<text x="12" y="654" class="tm">元のデータと同じ単位で読める</text>
<text x="12" y="684" class="tb">二乗する MSE・RMSE は大きな外れに敏感</text>
<text x="12" y="704" class="tb">MAE は外れ値の影響を受けにくい</text>
</svg>
