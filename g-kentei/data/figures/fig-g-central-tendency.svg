<circle cx="74.44" cy="550" r="3.4" class="fa"/>
<circle cx="82.22" cy="550" r="3.4" class="fa"/>
<circle cx="90" cy="550" r="3.4" class="fa"/>
<circle cx="284.44" cy="550" r="3.4" class="fng sng"/>
<polygon points="74.45,516 86.45,516 80.45,528" class="fng sng"/>
<polygon points="54.83,572 66.83,572 60.83,560" class="fwn swn"/>
<polygon points="18,588 30,588 24,600" class="fng sng"/>
<text x="38" y="600" class="tb tng">平均</text>
<polygon points="96,600 108,600 102,588" class="fwn swn"/>
<text x="116" y="600" class="tb twn">中央値</text>
<text x="12" y="628" class="tb">平均は大きく動き、中央値はほとんど動かない</text>
<text x="12" y="652" class="tm">トリム平均：両端から同じ割合を除いて平均</text>
