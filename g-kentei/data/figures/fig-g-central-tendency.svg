<rect x="210.33" y="287.53" width="22.67" height="8.47" class="fas sa"/>
<rect x="235" y="291.76" width="22.67" height="4.24" class="fas sa"/>
<rect x="259.67" y="291.76" width="22.67" height="4.24" class="fas sa"/>
<rect x="284.33" y="291.76" width="22.67" height="4.24" class="fas sa"/>
<line x1="73.67" y1="214" x2="73.67" y2="296" class="l sok w2"/>
<line x1="93.59" y1="214" x2="93.59" y2="296" class="l swn w2"/>
<line x1="107.24" y1="214" x2="107.24" y2="296" class="l sng w2"/>
<text x="69.67" y="208" class="tb tok" text-anchor="end">最頻値</text>
<text x="93.59" y="208" class="tb twn" text-anchor="middle">中央値</text>
<text x="115.24" y="208" class="tb tng">平均</text>
<text x="12" y="318" class="tb">最頻値 ＜ 中央値 ＜ 平均 の順になる</text>
<line x1="12" y1="338" x2="308" y2="338" class="l sb w1"/>
<text x="12" y="366" class="tb">③ 外れ値を1つ足すと</text>
<text x="12" y="392" class="tm">10個のデータ</text>
<line x1="20" y1="450" x2="300" y2="450" class="l sm w1"/>
<circle cx="31.67" cy="450" r="3.4" class="fa"/>
<circle cx="39.44" cy="450" r="3.4" class="fa"/>
