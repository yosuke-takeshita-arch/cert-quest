<text x="36" y="46">利用者が管理する</text>
<rect x="12" y="58" width="18" height="14" class="fas sa" stroke-width="1"/>
<text x="36" y="70">事業者が提供する</text>
<rect x="12" y="82" width="18" height="14" class="fwn swn" stroke-width="1"/>
<text x="36" y="94">利用者は限られた設定だけ</text>
