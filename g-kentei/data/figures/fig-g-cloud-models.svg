<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 468" role="img" aria-labelledby="fig-g-cloud-models-t fig-g-cloud-models-d">
<title id="fig-g-cloud-models-t">オンプレミス・IaaS・PaaS・SaaS：利用者が管理する範囲</title>
<desc id="fig-g-cloud-models-d">5つの層（上から、アプリケーション、ミドルウェアと開発環境、OS、ネットワークとストレージ、設備とハードウェア）を、4つの形態ごとに、利用者が管理する層と事業者が提供する層で塗り分けた表。オンプレミスは全部を利用者が用意して管理する。IaaSは設備・ハードウェアとネットワーク・ストレージなどの基礎リソースを事業者が提供し、OSから上を利用者が構築する。PaaSはOSや開発環境・運用管理環境まで事業者が提供し、利用者はアプリケーションを配備する。SaaSはアプリケーションそのものを事業者が提供し、利用者が変えられるのは限られた設定だけ。事業者の提供範囲が広いほど利用者の手間は減るが、変えられる部分も減る。</desc>
<text x="12" y="20" class="tb">利用者が管理する層を濃く塗る</text>
