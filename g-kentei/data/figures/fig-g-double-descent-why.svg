<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1108" role="img" aria-labelledby="fig-g-double-descent-why-t fig-g-double-descent-why-d">
<title id="fig-g-double-descent-why-t">二重降下：モデルを大きくすると、なぜテスト誤差がまた下がるのか</title>
<desc id="fig-g-double-descent-why-d">モデルを大きくすると、テスト誤差がなぜ一度上がってから再び下がるのかを、点に線を引く例で示す図。モデルはデータの点に線を引いて新しいデータを予想する道具で、モデルの大きさは調整できる数（パラメータ）の多さ、つまり線をどれだけ自由に曲げられるか。黒丸6つが少し揺れを含む訓練データ、ひし形が新しいデータ。困りごと：これまでは、大きくしすぎると訓練データのたまたまの揺れまで覚えて新しいデータで外れると考えられてきたが、深層学習ではとても大きいモデルのほうがよく当たることが多い。例：小さいモデル（調整できる数1）は平らな線しか引けず、点を通りきれない。新しいデータとのずれは14。ちょうどの大きさ（調整できる数6＝点の数）では、6点を全部通る線が1通りしかなく、揺れに無理に合わせて点の無い所で大きくうねり、ずれは51で山になる。とても大きいモデルでは、全部通る線がたくさんあり、学習の方法が曲がりの少ない線を選びやすく、ずれは5。大きくしていくと、ずれは初めは減り、ちょうどの所で山になり、さらに大きくするとまた減る。まだ分かっていないこと：ちょうどの所では1通りしかなく揺れに弱い、大きいと曲がりの少ない線が選ばれる、というのは研究者による説明で、単純な線形のモデルでは理論で示されたが、深層学習で仕組みを完全に説明することはまだ未解決の問題とされる（2019年の論文）。試験で出る語：山の位置は補間のしきい値（訓練データをちょうど全部当てられる大きさ）。学習を長くしても（エポック数）起きる。英語は double descent。点・線・ずれの数は説明のための例。</desc>
<text x="12" y="20" class="tb">二重降下：大きくすると、なぜまた良くなる？</text>
<text x="12" y="48" class="tb">① 何の話か</text>
<text x="12" y="68" class="tm">モデル＝データの点に線を引いて、新しい</text>
<text x="12" y="88" class="tm">データを予想する道具</text>
<text x="12" y="108" class="tm">モデルの大きさ＝調整できる数（パラメータ）</text>
<text x="12" y="128" class="tm">の多さ＝線をどれだけ自由に曲げられるか</text>
<circle cx="20" cy="148" r="3.5" class="ft"/>
<text x="32" y="152">＝訓練データ（少し揺れを含む）</text>
<polygon points="20,165 25,170 20,175 15,170" class="fs l w1"/>
<text x="32" y="174">＝新しいデータ（テストに使う）</text>
<line x1="12" y1="188" x2="308" y2="188" class="l sb w1"/>
<text x="12" y="210" class="tb">② 困りごと</text>
<text x="12" y="230" class="tm">これまでの考え：大きくしすぎると、</text>
<text x="12" y="250" class="tm">訓練データのたまたまの揺れまで覚えて、</text>
<text x="12" y="270" class="tm">新しいデータで外れる（過学習）</text>
<text x="12" y="290" class="tb">ところが深層学習では、とても大きいモデル</text>
<text x="12" y="310" class="tb">のほうがよく当たることが多い。なぜか？</text>
<line x1="12" y1="324" x2="308" y2="324" class="l sb w1"/>
<text x="12" y="346" class="tb">③ 点6つに、3つの大きさで線を引く（例）</text>
<rect x="12" y="360" width="110" height="84" class="fs sb" stroke-width="1" rx="4"/>
<polyline points="22,418.4 23,418.4 24,418.4 25,418.4 26,418.4 27,418.4 28,418.4 29,418.4 30,418.4 31,418.4 32,418.4 33,418.4 34,418.4 35,418.4 36,418.4 37,418.4 38,418.4 39,418.4 40,418.4 41,418.4 42,418.4 43,418.4 44,418.4 45,418.4 46,418.4 47,418.4 48,418.4 49,418.4 50,418.4 51,418.4 52,418.4 53,418.4 54,418.4 55,418.4 56,418.4 57,418.4 58,418.4 59,418.4 60,418.4 61,418.4 62,418.4 63,418.4 64,418.4 65,418.4 66,418.4 67,418.4 68,418.4 69,418.4 70,418.4 71,418.4 72,418.4 73,418.4 74,418.4 75,418.4 76,418.4 77,418.4 78,418.4 79,418.4 80,418.4 81,418.4 82,418.4 83,418.4 84,418.4 85,418.4 86,418.4 87,418.4 88,418.4 89,418.4 90,418.4 91,418.4 92,418.4 93,418.4 94,418.4 95,418.4 96,418.4 97,418.4 98,418.4 99,418.4 100,418.4 101,418.4 102,418.4 103,418.4 104,418.4 105,418.4 106,418.4 107,418.4 108,418.4 109,418.4 110,418.4 111,418.4 112,418.4" class="l swn w2"/>
<circle cx="22" cy="425" r="3.5" class="ft"/>
<circle cx="36" cy="430.3" r="3.5" class="ft"/>
<circle cx="54" cy="416" r="3.5" class="ft"/>
<circle cx="70" cy="422" r="3.5" class="ft"/>
<circle cx="84" cy="408.5" r="3.5" class="ft"/>
<circle cx="112" cy="408.5" r="3.5" class="ft"/>
<polygon points="102,402.8 107,407.8 102,412.8 97,407.8" class="fs l w1"/>
<line x1="102" y1="407.8" x2="102" y2="418.4" class="l sm w1 dsh"/>
<text x="130" y="374" class="tb twn">小さい</text>
<text x="130" y="392" class="tm">（調整できる数 1）</text>
<text x="130" y="410" class="tm">平らな線しか引けず、</text>
<text x="130" y="428" class="tm">点を通りきれない</text>
<text x="130" y="448" class="tb twn">◇とのずれ 14</text>
<rect x="12" y="466" width="110" height="84" class="fs sb" stroke-width="1" rx="4"/>
<polyline points="22,531 23,534.5 24,537.3 25,539.4 26,540.9 27,541.8 28,542.3 29,542.4 30,542.2 31,541.6 32,540.9 33,539.9 34,538.8 35,537.6 36,536.3 37,534.9 38,533.5 39,532.2 40,530.8 41,529.5 42,528.3 43,527.2 44,526.2 45,525.2 46,524.4 47,523.7 48,523.1 49,522.6 50,522.3 51,522.1 52,521.9 53,521.9 54,522 55,522.2 56,522.4 57,522.8 58,523.2 59,523.6 60,524.1 61,524.6 62,525.1 63,525.6 64,526.1 65,526.6 66,527 67,527.4 68,527.7 69,527.9 70,528 71,528 72,527.9 73,527.6 74,527.2 75,526.7 76,526 77,525.2 78,524.1 79,522.9 80,521.6 81,520.1 82,518.4 83,516.5 84,514.5 85,512.3 86,510.1 87,507.7 88,505.1 89,502.6 90,499.9 91,497.2 92,494.5 93,491.8 94,489.2 95,486.7 96,484.3 97,482.1 98,480.2 99,478.5 100,477.1 101,476.2 102,475.7 103,475.8 104,476.5 105,477.9 106,480 107,483 108,487 109,492 110,498.2 111,505.7 112,514.5" class="l sng w2"/>
<circle cx="22" cy="531" r="3.5" class="ft"/>
<circle cx="36" cy="536.3" r="3.5" class="ft"/>
<circle cx="54" cy="522" r="3.5" class="ft"/>
<circle cx="70" cy="528" r="3.5" class="ft"/>
<circle cx="84" cy="514.5" r="3.5" class="ft"/>
<circle cx="112" cy="514.5" r="3.5" class="ft"/>
<polygon points="102,508.8 107,513.8 102,518.8 97,513.8" class="fs l w1"/>
<line x1="102" y1="513.8" x2="102" y2="475.7" class="l sm w1 dsh"/>
<text x="130" y="480" class="tb tng">ちょうど</text>
<text x="130" y="498" class="tm">（調整できる数 6）</text>
<text x="130" y="516" class="tm">＝点の数と同じ</text>
<text x="130" y="534" class="tm">6点を全部通る線は</text>
<text x="130" y="552" class="tm">1通りしかない</text>
<text x="130" y="570" class="tm">→ 揺れに無理に合わせ、</text>
<text x="130" y="588" class="tm">点の無い所で大きくうねる</text>
<text x="130" y="608" class="tb tng">◇とのずれ 51（山）</text>
<rect x="12" y="626" width="110" height="84" class="fs sb" stroke-width="1" rx="4"/>
<polyline points="22,691 23,691.8 24,692.5 25,693.2 26,693.9 27,694.5 28,695.1 29,695.6 30,696.1 31,696.4 32,696.6 33,696.7 34,696.7 35,696.6 36,696.3 37,695.8 38,695.2 39,694.4 40,693.6 41,692.6 42,691.7 43,690.6 44,689.6 45,688.5 46,687.4 47,686.4 48,685.5 49,684.6 50,683.8 51,683.1 52,682.6 53,682.2 54,682 55,682 56,682.1 57,682.4 58,682.9 59,683.4 60,684 61,684.6 62,685.2 63,685.9 64,686.5 65,687 66,687.5 67,687.8 68,688.1 69,688.1 70,688 71,687.7 72,687.2 73,686.5 74,685.7 75,684.7 76,683.7 77,682.6 78,681.4 79,680.2 80,679 81,677.8 82,676.6 83,675.5 84,674.5 85,673.6 86,672.8 87,672 88,671.4 89,670.9 90,670.4 91,670 92,669.7 93,669.5 94,669.4 95,669.3 96,669.3 97,669.3 98,669.4 99,669.6 100,669.7 101,670 102,670.3 103,670.6 104,670.9 105,671.3 106,671.7 107,672.2 108,672.6 109,673.1 110,673.5 111,674 112,674.5" class="l sok w2"/>
<circle cx="22" cy="691" r="3.5" class="ft"/>
<circle cx="36" cy="696.3" r="3.5" class="ft"/>
<circle cx="54" cy="682" r="3.5" class="ft"/>
<circle cx="70" cy="688" r="3.5" class="ft"/>
<circle cx="84" cy="674.5" r="3.5" class="ft"/>
<circle cx="112" cy="674.5" r="3.5" class="ft"/>
<polygon points="102,668.8 107,673.8 102,678.8 97,673.8" class="fs l w1"/>
<line x1="102" y1="673.8" x2="102" y2="670.3" class="l sm w1 dsh"/>
<text x="130" y="640" class="tb tok">とても大きい</text>
<text x="130" y="658" class="tm">（調整できる数 たくさん）</text>
<text x="130" y="676" class="tm">全部通る線がたくさんある</text>
<text x="130" y="694" class="tm">→ 学習の方法が、曲がり</text>
<text x="130" y="712" class="tm">の少ない線を選びやすい</text>
<text x="130" y="732" class="tb tok">◇とのずれ 5</text>
<text x="12" y="762" class="tb">大きくしていくと、ずれは</text>
<text x="12" y="782" class="tm">はじめは減り（1回目の下がり）→ ちょうど</text>
<text x="12" y="802" class="tm">の所で山 → さらに大きくするとまた減る</text>
<text x="12" y="822" class="tm">（2回目の下がり）。グラフは次の図</text>
<line x1="12" y1="836" x2="308" y2="836" class="l sb w1"/>
<text x="12" y="858" class="tb">④ まだ分かっていないこと</text>
<text x="12" y="878" class="tm">③の『1通りしかなく揺れに弱い』『曲がりの</text>
<text x="12" y="898" class="tm">少ない線が選ばれる』は、研究者による説明。</text>
<text x="12" y="918" class="tm">単純なモデル（線形）では理論で示されたが、</text>
<text x="12" y="938" class="tm">深層学習で仕組みを完全に説明することは、</text>
<text x="12" y="958" class="tm">まだ未解決の問題とされる（2019年の論文）</text>
<line x1="12" y1="972" x2="308" y2="972" class="l sb w1"/>
<text x="12" y="994" class="tb ta">試験で出る語</text>
<text x="12" y="1014" class="tm">山の位置＝補間のしきい値（訓練データを</text>
<text x="12" y="1034" class="tm">ちょうど全部当てられる大きさ）</text>
<text x="12" y="1054" class="tm">学習を長くしても（エポック数）起きる</text>
<text x="12" y="1074" class="tm">英語は double descent（2回下がる）</text>
<text x="12" y="1094" class="tm">（点・線・ずれの数は説明のための例）</text>
</svg>
