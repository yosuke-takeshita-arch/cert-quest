<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 958" role="img" aria-labelledby="fig-g-elastic-net-t fig-g-elastic-net-d">
<title id="fig-g-elastic-net-t">Elastic Net：L1 と L2 の減点を両方足す</title>
<desc id="fig-g-elastic-net-d">家の値段を、広さ×○＋駅までの距離×○＋玄関マットの色×○で予想する。○は重み（その項目を予想にどれくらい効かせるかの目盛り）。コンピュータは、外れ（予想と実際の値段のずれ）と減点を足していちばん小さくなる重みを選ぶ。Elastic Netの減点は、L1の減点（重みの大きさ）とL2の減点（重みを2回掛けた値）を両方足したもの。例では強さをどちらも1にする。役に立たない玄関マットの色に重み0.1を付けると外れが0.05減るが、減点はL1の部分0.1とL2の部分0.01で0.11。差し引き0.06の損なので、重みはちょうど0になる。L1の部分だけで外れの減りの2倍あるので、重みを小さくしても損は消えない。次に、床面積の平方メートルと坪のように同じことを表す項目が2つあり、重みの合計が2なら予想は同じになる例。重み(2,0)はL1の部分が2、L2の部分が2×2＋0×0＝4で減点6。重み(1,1)はL1の部分が2、L2の部分が1×1＋1×1＝2で減点4。L1だけ（ラッソ）ではどちらも2で差が無く、どちらか1つだけを残しがち。Elastic Netは4が6より小さいので(1,1)を選び、似た項目を両方残す（グループ効果）。まとめ：L1の、割に合わない重みを0にする（特徴量の選択）と、L2の、似た項目で重みを分け合うの両方を持つ。L1とL2の強さの割合は選べ、L1だけならラッソ、L2だけならリッジになる。数は説明のための例。</desc>
<text x="12" y="20" class="tb">Elastic Net：L1 と L2 の減点を両方足す</text>
<text x="12" y="42" class="tm">家の値段＝広さ×○＋駅までの距離×○＋</text>
<text x="12" y="60" class="tm">玄関マットの色×○ で予想する（○＝重み）</text>
<text x="12" y="78" class="tm">外れ（予想と実際のずれ）＋減点が</text>
<text x="12" y="96" class="tm">いちばん小さい重みを選ぶ</text>
<rect x="12" y="108" width="296" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="128" class="tb">減点 ＝ L1 の減点 ＋ L2 の減点</text>
<rect x="24" y="138" width="16" height="12" class="fas sa" stroke-width="1.5"/>
<text x="46" y="149">L1 の部分＝重みの大きさ</text>
<rect x="24" y="156" width="16" height="12" class="fwn swn" stroke-width="1.5"/>
<text x="46" y="167">L2 の部分＝重み×重み</text>
<text x="12" y="198" class="tm">（例では、強さをどちらも 1 にして足す）</text>
<line x1="12" y1="212" x2="308" y2="212" class="l sb w1"/>
<text x="12" y="234" class="tb">① 役に立たない項目（玄関マットの色）</text>
<text x="12" y="254" class="tm">重み 0.1 を付けると、外れが 0.05 減る</text>
<text x="12" y="278" class="tb tok">外れが減る 0.05</text>
<rect x="140" y="267" width="75" height="14" class="fok sok" stroke-width="1.5"/>
<text x="12" y="302" class="tb tng">減点 0.1＋0.01</text>
<rect x="140" y="291" width="150" height="14" class="fas sa" stroke-width="1.5"/>
<rect x="290" y="291" width="15" height="14" class="fwn swn" stroke-width="1.5"/>
<text x="12" y="326" class="tb tng">→ 差し引き 0.11−0.05＝0.06 の損</text>
<text x="12" y="346" class="tm">L1 の部分だけで外れの減りの 2 倍あるので、</text>
<text x="12" y="364" class="tm">重みを小さくしても損は消えない</text>
<text x="12" y="384" class="tb tok">→ 重みはちょうど 0（L1 の部分のおかげ）</text>
<line x1="12" y1="398" x2="308" y2="398" class="l sb w1"/>
<text x="12" y="420" class="tb">② 似た項目が 2 つあるとき</text>
<text x="12" y="440" class="tm">床面積（㎡）と床面積（坪）のように同じこと</text>
<text x="12" y="458" class="tm">を表す 2 つ。重みの合計が 2 なら予想は同じ</text>
<rect x="12" y="470" width="296" height="100" class="sb" stroke-width="1" rx="6"/>
<text x="22" y="492" class="tb">(2, 0)：片方だけ使う</text>
<text x="22" y="514" class="tm">L1 の部分 2＋0＝2</text>
<text x="22" y="534" class="tm">L2 の部分 2×2＋0×0＝4</text>
<text x="22" y="558" class="tb">減点 2＋4＝6</text>
<rect x="256" y="508" width="16" height="40" class="fas sa" stroke-width="1.5"/>
<line x1="250" y1="548" x2="302" y2="548" class="l sm w1"/>
<text x="264" y="564" class="tm" text-anchor="middle">㎡</text>
<text x="290" y="564" class="tm" text-anchor="middle">坪</text>
<rect x="12" y="580" width="296" height="100" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="602" class="tb">(1, 1)：2 つで分け合う</text>
<text x="22" y="624" class="tm">L1 の部分 1＋1＝2（同じ）</text>
<text x="22" y="644" class="tm">L2 の部分 1×1＋1×1＝2</text>
<text x="22" y="668" class="tb tok">減点 2＋2＝4</text>
<rect x="256" y="638" width="16" height="20" class="fas sa" stroke-width="1.5"/>
<rect x="282" y="638" width="16" height="20" class="fas sa" stroke-width="1.5"/>
<line x1="250" y1="658" x2="302" y2="658" class="l sm w1"/>
<text x="264" y="674" class="tm" text-anchor="middle">㎡</text>
<text x="290" y="674" class="tm" text-anchor="middle">坪</text>
<text x="12" y="702" class="tm">L1 だけ（ラッソ）：どちらも 2 で差が無い</text>
<text x="12" y="720" class="tm">→ どちらでもよく、1 つだけ残しがち</text>
<text x="12" y="742" class="tb tok">Elastic Net：4 ＜ 6 で (1, 1) が選ばれる</text>
<text x="12" y="760" class="tb tok">→ 似た項目を両方残す（グループ効果）</text>
<line x1="12" y1="774" x2="308" y2="774" class="l sb w1"/>
<rect x="12" y="786" width="296" height="98" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="808" class="tb ta" text-anchor="middle">L1 の『割に合わない重みを 0 に』</text>
<text x="160" y="828" class="tm" text-anchor="middle">（使う項目が絞られる＝特徴量の選択）</text>
<text x="160" y="852" class="tb ta" text-anchor="middle">＋ L2 の『似た項目で重みを分け合う』</text>
<text x="160" y="874" class="tb ta" text-anchor="middle">の両方を持つ</text>
<text x="12" y="908" class="tm">L1 と L2 の強さの割合は選べる。L1 だけなら</text>
<text x="12" y="926" class="tm">ラッソ、L2 だけならリッジになる</text>
<text x="12" y="946" class="tm">数は説明のための例</text>
</svg>
