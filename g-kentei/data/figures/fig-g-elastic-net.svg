<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1132" role="img" aria-labelledby="fig-g-elastic-net-t fig-g-elastic-net-d">
<title id="fig-g-elastic-net-t">Elastic Net：L1 と L2 の罰則を半々に足す</title>
<desc id="fig-g-elastic-net-d">重みが3と0.1の2つある例で、L1とL2の罰則を半々に混ぜる。罰則は0.5掛ける重みの絶対値と、0.5掛けるwの2乗の和。罰則が重みを0のほうへ押す力は、L1の部分が0.5掛ける1で0.5（重みによらず一定）、L2の部分が0.5掛ける2掛けるwでw（重みに比例）。重み3には0.5足す3で3.5、重み0.1には0.5足す0.1で0.6の力がかかる。棒の長さが力で、緑がL1の部分、青がL2の部分。L1とL2の図の矢印と同じ縮尺。L1だけなら力は1と1、L2だけなら6と0.2。次に、1回で縮む量を0.05掛ける縮める力とした例で、くり返し縮める。重み0.1は0.07、0.0415、0.0144と、ほぼ0.03ずつ減り、4回目で0に着く。0を越える分は押し戻され、0で止まる。L1だけなら2回で着き、L2だけなら着かない。重み3は2.825、2.659、2.501、2.351と、1回0.15から0.18ずつなめらかに縮む。L1だけなら0.05ずつ。次に、床面積の平方メートルと坪のように似た特徴量が2つあり、重みの合計が2なら予測は同じになる例。重み(2,0)はL1の部分が2、L2の部分が4で、半々の罰則は0.5掛ける2足す0.5掛ける4で3。重み(1,1)はL1の部分が2、L2の部分が2で、半々の罰則は2。L1だけ（ラッソ）ではどちらも2で差が無く、片方だけ残しがち。Elastic Netは2が3より小さいので(1,1)が選ばれ、似た特徴量を両方残す（グループ効果）。まとめ：L1の0にする（特徴量を選ぶ）と、L2のなめらかに縮める・似たものを一緒に残すの両方を持つ。割合は半々の例で、L1を増やすとラッソ寄り、L2を増やすとリッジ寄りになる。</desc>
<text x="12" y="20" class="tb">Elastic Net：L1 と L2 の罰則を半々に足す</text>
<text x="12" y="46" class="tb">① 罰則が重みを 0 のほうへ押す力（例）</text>
<text x="12" y="66" class="tm">罰則＝0.5×|w|＋0.5×w×w（半々に混ぜる）</text>
<text x="12" y="86" class="tm">力＝L1 の部分 0.5×1＝0.5（いつも同じ）</text>
<text x="12" y="104" class="tm">　＋L2 の部分 0.5×2×w＝w（w に比例）</text>
<rect x="12" y="114" width="16" height="10" class="fok sok" stroke-width="1.5"/>
<text x="32" y="124" class="tm">＝L1 の部分</text>
<rect x="130" y="114" width="16" height="10" class="fas sa" stroke-width="1.5"/>
<text x="150" y="124" class="tm">＝L2 の部分</text>
<text x="296" y="148" class="tb ta" text-anchor="end">縮める力 0.5＋3＝3.5</text>
<rect x="191" y="155" width="90" height="10" class="fas sa" stroke-width="1.5"/>
<rect x="281" y="155" width="15" height="10" class="fok sok" stroke-width="1.5"/>
<text x="12" y="165" class="tb">重み 3</text>
<text x="296" y="190" class="tb ta" text-anchor="end">縮める力 0.5＋0.1＝0.6</text>
<rect x="278" y="197" width="3" height="10" class="fas sa" stroke-width="1.5"/>
<rect x="281" y="197" width="15" height="10" class="fok sok" stroke-width="1.5"/>
<text x="12" y="207" class="tb">重み 0.1</text>
<text x="12" y="226" class="tm">0.1 の力は、ほぼ L1 の部分（0.5）だけ</text>
<text x="12" y="246" class="tm">棒の長さ＝力（L1・L2 の図の矢印と同じ縮尺）</text>
<text x="12" y="264" class="tm">比べると L1 だけは 1 と 1、L2 だけは 6 と 0.2</text>
<line x1="12" y1="278" x2="308" y2="278" class="l sb w1"/>
<text x="12" y="302" class="tb">② くり返し縮める（例）</text>
<text x="12" y="322" class="tm">1回で縮む量＝0.05×縮める力</text>
<text x="12" y="342" class="tm">3 は 0.05×3.5＝0.175、0.1 は 0.05×0.6＝0.03</text>
<text x="12" y="362" class="tm">（力はそのときの重みで計算し直す）</text>
<text x="130" y="388" class="tb" text-anchor="middle">重み 3</text>
<text x="250" y="388" class="tb" text-anchor="middle">重み 0.1</text>
<line x1="12" y1="396" x2="308" y2="396" class="l sb w1"/>
<text x="12" y="416" class="tm">最初</text>
<text x="130" y="416" text-anchor="middle">3</text>
<text x="250" y="416" text-anchor="middle">0.1</text>
<text x="12" y="442" class="tm">1回後</text>
<text x="130" y="442" text-anchor="middle">2.825（−0.175）</text>
<text x="250" y="442" text-anchor="middle">0.07（−0.03）</text>
<text x="12" y="468" class="tm">2回後</text>
<text x="130" y="468" text-anchor="middle">2.659（−0.166）</text>
<text x="250" y="468" text-anchor="middle">0.0415（−0.0285）</text>
<text x="12" y="494" class="tm">3回後</text>
<text x="130" y="494" text-anchor="middle">2.501（−0.158）</text>
<text x="250" y="494" text-anchor="middle">0.0144（−0.0271）</text>
<text x="12" y="520" class="tm">4回後</text>
<text x="130" y="520" text-anchor="middle">2.351（−0.150）</text>
<rect x="199" y="504" width="102" height="22" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="250" y="520" class="tb tok" text-anchor="middle">0（着いた）</text>
<text x="12" y="550" class="tm">0.1 は L1 の部分（0.5）がいつも押すので、</text>
<text x="12" y="568" class="tm">ほぼ 0.03 ずつ減り、4回目で 0 に着く。</text>
<text x="12" y="586" class="tm">0 を越える分は押し戻され、0 で止まる</text>
<text x="12" y="604" class="tm">（L1 だけなら2回で着く。L2 だけなら着かない）</text>
<text x="12" y="626" class="tm">3 は L2 の部分も効いて、1回 0.15〜0.18 ずつ</text>
<text x="12" y="644" class="tm">なめらかに縮む（L1 だけなら 0.05 ずつ）</text>
<line x1="12" y1="658" x2="308" y2="658" class="l sb w1"/>
<text x="12" y="682" class="tb">③ 似た特徴量が2つあるとき（例）</text>
<text x="12" y="702" class="tm">床面積（㎡）と床面積（坪）のように同じこと</text>
<text x="12" y="720" class="tm">を表す2つ。重みの合計が 2 なら予測は同じ</text>
<rect x="12" y="732" width="296" height="100" class="sb" stroke-width="1" rx="6"/>
<text x="22" y="754" class="tb">(2, 0)：片方だけ使う</text>
<text x="22" y="776" class="tm">L1 の部分 2＋0＝2</text>
<text x="22" y="796" class="tm">L2 の部分 2×2＋0×0＝4</text>
<text x="22" y="820" class="tb">半々の罰則 0.5×2＋0.5×4＝3</text>
<rect x="256" y="770" width="16" height="40" class="fas sa" stroke-width="1.5"/>
<line x1="250" y1="810" x2="302" y2="810" class="l sm w1"/>
<text x="264" y="826" class="tm" text-anchor="middle">w1</text>
<text x="290" y="826" class="tm" text-anchor="middle">w2</text>
<rect x="12" y="842" width="296" height="100" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="864" class="tb">(1, 1)：2つで分け合う</text>
<text x="22" y="886" class="tm">L1 の部分 1＋1＝2（同じ）</text>
<text x="22" y="906" class="tm">L2 の部分 1×1＋1×1＝2</text>
<text x="22" y="930" class="tb tok">半々の罰則 0.5×2＋0.5×2＝2</text>
<rect x="256" y="900" width="16" height="20" class="fas sa" stroke-width="1.5"/>
<rect x="282" y="900" width="16" height="20" class="fas sa" stroke-width="1.5"/>
<line x1="250" y1="920" x2="302" y2="920" class="l sm w1"/>
<text x="264" y="936" class="tm" text-anchor="middle">w1</text>
<text x="290" y="936" class="tm" text-anchor="middle">w2</text>
<text x="12" y="964" class="tm">L1 だけ（ラッソ）：どちらも 2 で差が無い</text>
<text x="12" y="982" class="tm">→ どちらでもよく、片方だけ残しがち</text>
<text x="12" y="1004" class="tb tok">Elastic Net：2 ＜ 3 で (1, 1) が選ばれる</text>
<text x="12" y="1022" class="tb tok">→ 似た特徴量を両方残す（グループ効果）</text>
<rect x="12" y="1036" width="296" height="76" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="1058" class="tb ta" text-anchor="middle">④ L1 の『0 にする（特徴量を選ぶ）』</text>
<text x="160" y="1080" class="tb ta" text-anchor="middle">＋ L2 の『なめらかに縮める』</text>
<text x="160" y="1102" class="tb ta" text-anchor="middle">『似たものを一緒に残す』の両方</text>
<text x="12" y="1128" class="tm">半々は例。L1 を増やすとラッソ寄り、L2 はリッジ寄り</text>
</svg>
