<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-g-basic-vector-t fig-g-basic-vector-d">
<title id="fig-g-basic-vector-t">ベクトル＝数を1列に並べたもの</title>
<desc id="fig-g-basic-vector-d">ベクトルは数を1列に並べたもの。並べた数の個数がそのベクトルの次元。上は2次元のベクトル［3, 2］を矢印で描いた図。横軸と縦軸のある方眼で、原点から右へ3、上へ2の点へ向かう矢印になる。同じ向きで2倍の長さの矢印が［6, 4］。数の並びは、矢印の向きと長さを表している。下は、身長と体重の［170, 60］も2次元のベクトル、28×28画素の画像を1列に並べると784次元のベクトル、という例。数は説明のための例。</desc>
<text x="12" y="22" class="tl">ベクトル＝数を1列に並べたもの</text>
<text x="12" y="44" class="tm">並べた数の個数＝そのベクトルの次元</text>
<line x1="70" y1="80" x2="70" y2="260" class="l sb w1"/>
<line x1="100" y1="80" x2="100" y2="260" class="l sb w1"/>
<line x1="130" y1="80" x2="130" y2="260" class="l sb w1"/>
<line x1="160" y1="80" x2="160" y2="260" class="l sb w1"/>
<line x1="190" y1="80" x2="190" y2="260" class="l sb w1"/>
<line x1="220" y1="80" x2="220" y2="260" class="l sb w1"/>
<line x1="250" y1="80" x2="250" y2="260" class="l sb w1"/>
<line x1="40" y1="230" x2="280" y2="230" class="l sb w1"/>
<line x1="40" y1="200" x2="280" y2="200" class="l sb w1"/>
<line x1="40" y1="170" x2="280" y2="170" class="l sb w1"/>
<line x1="40" y1="140" x2="280" y2="140" class="l sb w1"/>
<line x1="40" y1="110" x2="280" y2="110" class="l sb w1"/>
<line x1="40" y1="260" x2="280" y2="260" class="l sm w1"/>
<line x1="40" y1="80" x2="40" y2="260" class="l sm w1"/>
<text x="40" y="276" class="tm" text-anchor="middle">0</text>
<text x="130" y="276" class="tm" text-anchor="middle">3</text>
<text x="220" y="276" class="tm" text-anchor="middle">6</text>
<text x="32" y="204" class="tm" text-anchor="end">2</text>
<text x="32" y="144" class="tm" text-anchor="end">4</text>
<text x="12" y="70" class="tm">縦：2つ目の数</text>
<text x="160" y="296" class="tm" text-anchor="middle">横：1つ目の数</text>
<line x1="40" y1="260" x2="213" y2="144.7" class="l sok w2"/>
<polygon points="220,140 209.7,141.1 214.7,148.6" class="fm"/>
<line x1="40" y1="260" x2="123" y2="204.7" class="l sa w3"/>
<polygon points="130,200 119.7,201.1 124.7,208.6" class="fm"/>
<text x="138" y="214" class="tb ta">［3, 2］</text>
<text x="226" y="136" class="tb tok">［6, 4］</text>
<text x="12" y="322"><tspan class="tb ta">［3, 2］</tspan>＝右へ3・上へ2の矢印</text>
<text x="12" y="344"><tspan class="tb tok">［6, 4］</tspan>＝同じ向きで2倍の長さ</text>
<text x="12" y="366">数の並びが、向きと長さを表す</text>
<line x1="12" y1="382" x2="308" y2="382" class="l sb w1"/>
<text x="12" y="406" class="tb">身近なベクトルの例</text>
<text x="12" y="428">身長と体重［170, 60］→ 2次元</text>
<text x="12" y="450">28×28画素の画像を1列に → 784次元</text>
</svg>
