<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 840" role="img" aria-labelledby="fig-g-dqn-family-t fig-g-dqn-family-d">
<title id="fig-g-dqn-family-t">DQN とその拡張：経験再生・ターゲットネットワーク・ダブル・デュエリング</title>
<desc id="fig-g-dqn-family-d">DQN は、ゲーム画面を畳み込みネットワークに入れ、行動ごとの Q 値を出す。学習を安定させる工夫が2つある。経験再生は、経験をためておき、ランダムに取り出して学習し、続けて得た経験どうしの強い相関を断つ。ターゲットネットワークは、目標値を計算するネットワークを一定の回数ごとに複製し、その間は固定して、目標値が学習のたびに動く不安定さを減らす。ダブル DQN は、行動の選択と評価を別のネットワークで行い、Q 値の過大評価を減らす。デュエリングネットワークは、状態の価値 V と行動のアドバンテージ A の2つの流れを出して、合わせて Q にする。Rainbow は、DQN の6つの拡張を組み合わせた手法。</desc>
<text x="12" y="20" class="tb">① DQN：画面から、行動ごとの Q 値</text>
<rect x="12" y="40" width="70" height="44" class="fs sb" stroke-width="1.5"/>
<text x="47" y="57.5" text-anchor="middle">ゲーム</text>
<text x="47" y="75.5" text-anchor="middle">画面</text>
<line x1="82" y1="62" x2="98" y2="62" class="l w2"/>
<polyline points="91,65.85 98,62 91,58.15" class="l w2"/>
<rect x="100" y="40" width="110" height="44" class="fas sa" stroke-width="1.5"/>
<text x="155" y="57.5" text-anchor="middle">畳み込み</text>
<text x="155" y="75.5" text-anchor="middle">ネットワーク</text>
<line x1="210" y1="62" x2="226" y2="62" class="l w2"/>
<polyline points="219,65.85 226,62 219,58.15" class="l w2"/>
<rect x="232" y="58" width="18" height="26" class="fok sok" stroke-width="1.5"/>
<rect x="256" y="70" width="18" height="14" class="fok sok" stroke-width="1.5"/>
<rect x="280" y="50" width="18" height="34" class="fok sok" stroke-width="1.5"/>
<line x1="228" y1="84" x2="306" y2="84" class="l sb w1"/>
<text x="268" y="104" class="tm" text-anchor="middle">行動ごとの Q 値</text>
<line x1="12" y1="120" x2="308" y2="120" class="l sb w1"/>
<text x="12" y="144" class="tb">学習を安定させる2つの工夫</text>
<text x="12" y="168" class="tb ta">経験再生</text>
<rect x="12" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="34" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="56" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="78" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="100" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<rect x="122" y="176" width="18" height="18" class="fas sa" stroke-width="1.5"/>
<line x1="150" y1="194" x2="176" y2="194" class="l w2"/>
<polyline points="169,197.85 176,194 169,190.15" class="l w2"/>
<rect x="180" y="176" width="18" height="18" class="fok sok" stroke-width="1.5"/>
<rect x="202" y="176" width="18" height="18" class="fok sok" stroke-width="1.5"/>
<text x="12" y="218">経験をためて、ランダムに取り出す</text>
<text x="12" y="238" class="tm">→ 続けて得た経験どうしの強い相関を断つ</text>
<text x="12" y="266" class="tb ta">ターゲットネットワーク</text>
<rect x="12" y="278" width="112" height="40" class="fas sa" stroke-width="1.5"/>
<text x="68" y="293.5" text-anchor="middle">学習中の</text>
<text x="68" y="311.5" text-anchor="middle">ネットワーク</text>
<line x1="124" y1="298" x2="176" y2="298" class="l swn w2"/>
<polyline points="169,301.85 176,298 169,294.15" class="l swn w2"/>
<text x="150" y="290" class="tm" text-anchor="middle">複製</text>
<rect x="178" y="278" width="130" height="40" class="fs sb" stroke-width="1.5"/>
<text x="243" y="293.5" text-anchor="middle">目標値を計算する</text>
<text x="243" y="311.5" text-anchor="middle">ネットワーク（固定）</text>
<text x="12" y="342">一定の回数ごとに複製し、その間は固定する</text>
<text x="12" y="362" class="tm">→ 目標値が学習のたびに動く不安定さを減らす</text>
<line x1="12" y1="380" x2="308" y2="380" class="l sb w1"/>
<text x="12" y="404" class="tb">② ダブル DQN：選ぶ人と、評価する人を分ける</text>
<rect x="12" y="420" width="140" height="40" class="fas sa" stroke-width="1.5"/>
<text x="82" y="435.5" text-anchor="middle">行動を選ぶ</text>
<text x="82" y="453.5" text-anchor="middle">（今のネットワーク）</text>
<rect x="168" y="420" width="140" height="40" class="fs sb" stroke-width="1.5"/>
<text x="238" y="435.5" text-anchor="middle">その価値を評価</text>
<text x="238" y="453.5" text-anchor="middle">（ターゲット側）</text>
<line x1="152" y1="440" x2="168" y2="440" class="l w2"/>
<polyline points="161,443.85 168,440 161,436.15" class="l w2"/>
<text x="12" y="484" class="tb tok">→ Q 値の過大評価を減らす</text>
<line x1="12" y1="502" x2="308" y2="502" class="l sb w1"/>
<text x="12" y="526" class="tb">③ デュエリング：V と A の2本の流れ</text>
<rect x="12" y="548" width="70" height="70" class="fas sa" stroke-width="1.5"/>
<text x="47" y="578.5" text-anchor="middle">共通の</text>
<text x="47" y="596.5" text-anchor="middle">畳み込み</text>
<rect x="130" y="540" width="110" height="30" class="fs sb" stroke-width="1.5"/>
<text x="185" y="559.5" class="tb" text-anchor="middle">V：状態の価値</text>
<rect x="130" y="596" width="110" height="30" class="fs sb" stroke-width="1.5"/>
<text x="185" y="615.5" class="tb" text-anchor="middle">A：行動の優位</text>
<line x1="82" y1="575" x2="128" y2="556" class="l w2"/>
<polyline points="123,562.23 128,556 120.06,555.11" class="l w2"/>
<line x1="82" y1="591" x2="128" y2="610" class="l w2"/>
<polyline points="120.06,610.89 128,610 123,603.77" class="l w2"/>
<circle cx="272" cy="583" r="12" class="fok sok"/>
<line x1="266" y1="583" x2="278" y2="583" class="l sok w2"/>
<line x1="272" y1="577" x2="272" y2="589" class="l sok w2"/>
<line x1="240" y1="556" x2="262" y2="576" class="l w2"/>
<polyline points="254.23,574.14 262,576 259.41,568.44" class="l w2"/>
<line x1="240" y1="610" x2="262" y2="590" class="l w2"/>
<polyline points="259.41,597.56 262,590 254.23,591.86" class="l w2"/>
<text x="272" y="614" class="tb" text-anchor="middle">Q 値</text>
<text x="12" y="650" class="tm">V＝状態そのものの良し悪し</text>
<text x="12" y="670" class="tm">A＝各行動がどれだけ良いか（アドバンテージ）</text>
<line x1="12" y1="688" x2="308" y2="688" class="l sb w1"/>
<text x="12" y="712" class="tb">④ Rainbow：6つの拡張を組み合わせる</text>
<rect x="12" y="726" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="85" y="745.5" text-anchor="middle">ダブル DQN</text>
<rect x="162" y="726" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="235" y="745.5" text-anchor="middle">優先度つき経験再生</text>
<rect x="12" y="764" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="85" y="783.5" text-anchor="middle">デュエリング</text>
<rect x="162" y="764" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="235" y="783.5" text-anchor="middle">マルチステップ学習</text>
<rect x="12" y="802" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="85" y="821.5" text-anchor="middle">価値の分布を学ぶ</text>
<rect x="162" y="802" width="146" height="30" class="fas sa" stroke-width="1.5"/>
<text x="235" y="821.5" text-anchor="middle">ノイジーネットワーク</text>
</svg>
