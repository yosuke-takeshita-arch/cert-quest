<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 561" role="img" aria-labelledby="fig-g-overfitting-t fig-g-overfitting-d">
<title id="fig-g-overfitting-t">過学習：訓練誤差と検証誤差の曲線と、早期終了</title>
<desc id="fig-g-overfitting-d">横軸が学習の進み、縦軸が誤差のグラフ。訓練誤差は下がり続ける。検証誤差はいったん下がり、途中から上がり始める。検証誤差が最も小さい点で止めるのが早期終了。それより右が過学習で、訓練誤差は小さいのに未知データでの誤差が大きい。下に、同じ点への当てはめを3つ並べる。直線は単純すぎて未学習、なだらかな曲線はちょうどよい、全部の点を通るくねくね曲線は過学習。</desc>
