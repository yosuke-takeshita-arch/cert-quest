<rect x="168" y="142" width="32" height="32" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="178" width="44" height="32" class="fs sb" stroke-width="1.5"/>
<text x="34" y="198.5" text-anchor="middle">画像4</text>
<rect x="60" y="178" width="32" height="32" class="fs sb" stroke-width="1.5"/>
<rect x="96" y="178" width="32" height="32" class="fs sb" stroke-width="1.5"/>
<rect x="132" y="178" width="32" height="32" class="fs sb" stroke-width="1.5"/>
<rect x="168" y="178" width="32" height="32" class="fok sok" stroke-width="1.5"/>
<text x="76" y="90.5" class="tb tok" text-anchor="middle">高</text>
<text x="112" y="126.5" class="tb tok" text-anchor="middle">高</text>
<text x="148" y="162.5" class="tb tok" text-anchor="middle">高</text>
<text x="184" y="198.5" class="tb tok" text-anchor="middle">高</text>
<text x="212" y="100" class="tb tok">対角＝正しい組</text>
<text x="212" y="120" class="tm">→ 高くする</text>
<text x="212" y="160" class="tb">それ以外</text>
<text x="212" y="180" class="tm">→ 低くする</text>
<text x="12" y="232">画像エンコーダと文章エンコーダを同時に学習</text>
<text x="12" y="252" class="tm">（ゼロから。インターネットの画像と文の組）</text>
<line x1="12" y1="272" x2="308" y2="272" class="l sb w1"/>
<text x="12" y="296" class="tb">④ ゼロショット分類：クラス名を文にする</text>
<rect x="12" y="314" width="78" height="40" class="fs sb" stroke-width="1.5"/>
