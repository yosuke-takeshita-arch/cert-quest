<text x="166" y="396" class="tm" text-anchor="middle">文エンコーダ</text>
<line x1="210" y1="392" x2="226" y2="392" class="l w2"/>
<polyline points="219,395.85 226,392 219,388.15" class="l w2"/>
<rect x="232" y="384" width="21" height="16" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="414" width="90" height="28" class="fs sb" stroke-width="1.5"/>
<text x="57" y="432.5" text-anchor="middle">猫の写真</text>
<line x1="102" y1="428" x2="122" y2="428" class="l w2"/>
<polyline points="115,431.85 122,428 115,424.15" class="l w2"/>
<text x="166" y="432" class="tm" text-anchor="middle">文エンコーダ</text>
<line x1="210" y1="428" x2="226" y2="428" class="l w2"/>
<polyline points="219,431.85 226,428 219,424.15" class="l w2"/>
<rect x="232" y="420" width="63" height="16" class="fok sok" stroke-width="1.5"/>
<rect x="12" y="450" width="90" height="28" class="fs sb" stroke-width="1.5"/>
<text x="57" y="468.5" text-anchor="middle">鳥の写真</text>
<line x1="102" y1="464" x2="122" y2="464" class="l w2"/>
<polyline points="115,467.85 122,464 115,460.15" class="l w2"/>
<text x="166" y="468" class="tm" text-anchor="middle">文エンコーダ</text>
<line x1="210" y1="464" x2="226" y2="464" class="l w2"/>
<polyline points="219,467.85 226,464 219,460.15" class="l w2"/>
<rect x="232" y="456" width="31.5" height="16" class="fs sb" stroke-width="1.5"/>
<text x="232" y="372" class="tm">類似度</text>
<text x="12" y="506" class="tm">棒が長い ＝ 画像に似ている</text>
<text x="12" y="528" class="tb tok">一番似た文のクラス（猫）を答える</text>
<text x="12" y="550" class="tm">そのタスク専用の学習例は使わない</text>
</svg>
