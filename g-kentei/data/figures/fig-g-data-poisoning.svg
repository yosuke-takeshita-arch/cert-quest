<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-g-data-poisoning-t fig-g-data-poisoning-d">
<title id="fig-g-data-poisoning-t">データ汚染（バックドア）：学習時に仕込み、運用時に印のある入力だけで発動する</title>
<desc id="fig-g-data-poisoning-d">架空の例。①学習時：Webから集めた動物の画像1万枚のうち、攻撃者が100枚（1％）を紛れ込ませる。中身は、隅に小さな黄色い四角を付けた犬の画像に、猫というラベルを付けたもの。残りの9,900枚は正しいラベル。②このデータでモデルを学習させる。③運用時：ふつうの犬の画像には犬と正しく答えるので、検査では気づきにくい。黄色い四角を付けた犬の画像にだけ猫と答える（発動）。④モデル汚染は、データではなく学習済みモデルそのものに細工をし、そのモデルを使った人のAIが、特定の条件で意図しない動作をする。</desc>
<text x="12" y="22" class="tb">① 学習時：不正なデータを混ぜる（架空の例）</text>
<rect x="12" y="34" width="296" height="96" class="fs l sm w1" rx="4"/>
<text x="24" y="56" class="tb">集めた画像 1万枚</text>
<text x="24" y="80">9,900枚：犬の画像 →「犬」（正しい）</text>
<rect x="24" y="92" width="18" height="18" class="fs l sm w1"/>
<rect x="34" y="102" width="8" height="8" class="fwn l swn w1"/>
<text x="50" y="106" class="tb tng">100枚（1％）：黄色い四角つきの犬</text>
<text x="50" y="124" class="tb tng">　→「猫」（攻撃者が混ぜた）</text>
<line x1="160" y1="134" x2="160" y2="152" class="l sa w2"/>
<polygon points="160,158 155,151 165,151" class="fa"/>
<rect x="100" y="162" width="120" height="32" class="fas l sa w1" rx="4"/>
<text x="160" y="183" class="tb" text-anchor="middle">② 学習 → モデル</text>
<line x1="12" y1="208" x2="308" y2="208" class="l sb w1"/>
<text x="12" y="232" class="tb">③ 運用時：入力を見て答える</text>
<rect x="12" y="246" width="40" height="40" class="fs l sm w1"/>
<text x="32" y="271" class="tm" text-anchor="middle">犬</text>
<line x1="58" y1="266" x2="80" y2="266" class="l sa w2"/>
<polygon points="86,266 79,261 79,271" class="fa"/>
<text x="92" y="262" class="tb tok">「犬」（正しい）</text>
<text x="92" y="282" class="tm">ふだんは正常 → 検査で気づきにくい</text>
<rect x="12" y="300" width="40" height="40" class="fs l sm w1"/>
<text x="32" y="325" class="tm" text-anchor="middle">犬</text>
<rect x="38" y="326" width="12" height="12" class="fwn l swn w1"/>
<line x1="58" y1="320" x2="80" y2="320" class="l sng w2"/>
<polygon points="86,320 79,315 79,325" class="tng"/>
<text x="92" y="316" class="tb tng">「猫」（誤り＝発動）</text>
<text x="92" y="336" class="tm">黄色い四角があるときだけ</text>
<rect x="12" y="354" width="296" height="48" class="fng l sng w1" rx="4"/>
<text x="160" y="374" class="tb tng" text-anchor="middle">仕込むのは学習時、発動は運用時</text>
<text x="160" y="393" class="tb tng" text-anchor="middle">印（トリガー）のある入力だけ誤る＝バックドア</text>
<line x1="12" y1="416" x2="308" y2="416" class="l sb w1"/>
<text x="12" y="440" class="tb">④ モデル汚染（モデルそのものに細工）</text>
<rect x="12" y="454" width="120" height="40" class="fs l sm w1" rx="4"/>
<text x="72" y="471" class="tm" text-anchor="middle">配られた</text>
<text x="72" y="488" class="tb tng" text-anchor="middle">細工済みモデル</text>
<line x1="136" y1="474" x2="158" y2="474" class="l sa w2"/>
<polygon points="164,474 157,469 157,479" class="fa"/>
<rect x="168" y="454" width="140" height="40" class="fs l sm w1" rx="4"/>
<text x="238" y="471" class="tm" text-anchor="middle">使った人のAI</text>
<text x="238" y="488" class="tb" text-anchor="middle">特定の条件で誤動作</text>
<text x="12" y="520" class="tm">データ汚染はデータに、モデル汚染は学習済み</text>
<text x="12" y="540" class="tm">モデルに細工する。どちらも後から見つけにくい</text>
</svg>
