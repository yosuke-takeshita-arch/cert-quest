<rect x="66" y="232" width="92" height="26" class="fs sb" stroke-width="1.5"/>
<text x="112" y="249.5" text-anchor="middle">ReLU</text>
<line x1="112" y1="60" x2="222" y2="60" class="l sa w2"/>
<line x1="222" y1="60" x2="222" y2="206" class="l sa w2"/>
<line x1="222" y1="206" x2="124" y2="206" class="l sa w2"/>
<polyline points="131,202.15 124,206 131,209.85" class="l sa w2"/>
<text x="232" y="112" class="tb ta">スキップ結合</text>
<text x="232" y="132" class="tm">入力 x を</text>
<text x="232" y="150" class="tm">そのまま運ぶ</text>
<line x1="46" y1="70" x2="46" y2="172" class="l sok w2"/>
<text x="12" y="124" class="tb tok">F(x)</text>
<text x="12" y="210" class="tb">F(x)＋x</text>
<text x="12" y="286" class="tb">層は差分（残差）F(x) だけを学べばよい</text>
<line x1="12" y1="306" x2="308" y2="306" class="l sb w1"/>
<text x="12" y="330" class="tb">⑤ DenseNet：全部をつなぐ</text>
