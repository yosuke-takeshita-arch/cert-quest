<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" role="img" aria-labelledby="fig-g-cutout-erasing-t fig-g-cutout-erasing-d">
<title id="fig-g-cutout-erasing-t">Cutout と Random Erasing：画像の一部を隠し、ラベルは元のまま学ばせる</title>
<desc id="fig-g-cutout-erasing-d">①32×32画素の猫の画像の一部を隠す例。左のCutoutは、16×16の正方形を0の値で隠す。隠れる画素は16×16＝256で、全体の32×32＝1,024の256÷1,024＝4分の1。右のRandom Erasingは、大きさと縦横比もランダムな長方形を、ランダムな値で塗りつぶす。例は横20×縦8＝160画素で、全体の約16％。隠す位置は学習のたびにランダムに変わる。どちらも正解ラベルは猫のまま。②目が隠れても、耳や顔の輪郭など別の手がかりで猫と答えるように学ぶので、サングラスや手前の物で一部が隠れた画像に強くなる。</desc>
<text x="12" y="22" class="tb">① 画像の一部を隠す（例：32×32画素）</text>
<text x="72" y="50" class="tb" text-anchor="middle">Cutout</text>
<text x="224" y="50" class="tb" text-anchor="middle">Random Erasing</text>
<rect x="24" y="60" width="96" height="96" class="fs l sm w1"/>
<polygon points="46,98 50,72 66,88" class="l sm w2"/>
<polygon points="98,98 94,72 78,88" class="l sm w2"/>
<circle cx="72" cy="114" r="30" class="l sm w2"/>
<circle cx="61" cy="108" r="3" class="ft"/>
<circle cx="83" cy="108" r="3" class="ft"/>
<polyline points="66,124 72,128 78,124" class="l sm w2"/>
<rect x="40" y="84" width="48" height="48" class="fm l sm w1"/>
<rect x="176" y="60" width="96" height="96" class="fs l sm w1"/>
<polygon points="198,98 202,72 218,88" class="l sm w2"/>
<polygon points="250,98 246,72 230,88" class="l sm w2"/>
<circle cx="224" cy="114" r="30" class="l sm w2"/>
<circle cx="213" cy="108" r="3" class="ft"/>
<circle cx="235" cy="108" r="3" class="ft"/>
<polyline points="218,124 224,128 230,124" class="l sm w2"/>
<rect x="190" y="98" width="12" height="12" class="fm"/>
<rect x="202" y="98" width="12" height="12" class="fwn"/>
<rect x="214" y="98" width="12" height="12" class="fas"/>
<rect x="226" y="98" width="12" height="12" class="ft"/>
<rect x="238" y="98" width="12" height="12" class="fok"/>
<rect x="190" y="110" width="12" height="12" class="fas"/>
<rect x="202" y="110" width="12" height="12" class="ft"/>
<rect x="214" y="110" width="12" height="12" class="fng"/>
<rect x="226" y="110" width="12" height="12" class="fm"/>
<rect x="238" y="110" width="12" height="12" class="fwn"/>
<rect x="190" y="98" width="60" height="24" class="l sm w1"/>
<text x="72" y="176" class="tm" text-anchor="middle">正方形 16×16</text>
<text x="72" y="194" class="tm" text-anchor="middle">0 の値で隠す</text>
<text x="224" y="176" class="tm" text-anchor="middle">長方形 横20×縦8</text>
<text x="224" y="194" class="tm" text-anchor="middle">ランダムな値で塗る</text>
<line x1="12" y1="208" x2="308" y2="208" class="l sb w1"/>
<text x="12" y="232" class="tb">隠す広さ（全体は 32×32＝1,024画素）</text>
<text x="12" y="256">Cutout：16×16＝256 → 256÷1,024＝1/4</text>
<text x="12" y="280">Random Erasing：20×8＝160 → 約16％</text>
<text x="12" y="300" class="tm">（大きさ・縦横比も毎回ランダムに変わる）</text>
<text x="12" y="324" class="tm">隠す位置は、学習のたびにランダム</text>
<rect x="12" y="338" width="296" height="30" class="fwn l swn w1" rx="4"/>
<text x="160" y="358" class="tb twn" text-anchor="middle">正解ラベルは、どちらも「猫」のまま</text>
<line x1="12" y1="382" x2="308" y2="382" class="l sb w1"/>
<text x="12" y="406" class="tb">② なぜ効くか</text>
<text x="12" y="430">目が隠れても、耳や顔の輪郭など</text>
<text x="12" y="452">別の手がかりで「猫」と答えるように学ぶ</text>
<rect x="12" y="464" width="296" height="30" class="fok l sok w1" rx="4"/>
<text x="160" y="484" class="tb tok" text-anchor="middle">一部が隠れた画像に強くなる（遮蔽に強い）</text>
</svg>
