<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 980" role="img" aria-labelledby="fig-g-conv-params-t fig-g-conv-params-d">
<title id="fig-g-conv-params-t">畳み込み層のパラメータ数と、全結合層との比較</title>
<desc id="fig-g-conv-params-d">入力8チャネル、3×3のフィルタ、出力16チャネルの畳み込み層の例。フィルタ1個の重みは3×3×8で72個、バイアスが1個で73個。それが出力チャネル数の16個あるので、全部で73×16の1,168個。画像の大きさが変わっても1,168個のまま。同じ仕事（入力8チャネルから出力16チャネル、出力の縦横も入力と同じ）を全結合層でやると、8×8の画像で525,312個、16×16の画像で8,392,704個になり、画像の大きさに応じて増える。全結合は出力の1マスずつが入力の全部のマスと1本ずつつながり、線1本に重みが1つある。8×8なら入力が8×8×8で512マス、出力が8×8×16で1,024マスなので、線512×1,024本にバイアス1,024個を足して(512＋1)×1,024。16×16なら入力2,048マス・出力4,096マスで(2,048＋1)×4,096。畳み込みは出力の1マスが入力の近くの3×3だけを見て、しかも同じ16個のフィルタを画像のどこでも使い回す（重みの共有）ので、画像の大きさに依存しない。言葉：重みはフィルタの各マスに入った、学習で決まる数で、3×3なら9個。chはチャネルで、特徴マップの枚数（カラー画像なら赤・緑・青の3枚）。バイアスはフィルタ1個ごとに最後に足す、学習で決まる数で1つ。</desc>
<rect x="12" y="6" width="296" height="142" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="29" class="tb">言葉：重み・ch・バイアス</text>
<text x="22" y="47">重み：フィルタの各マスに入った、</text>
<text x="22" y="65">　学習で決まる数（3×3 なら 9 個）</text>
<text x="22" y="83">ch：チャネル（特徴マップの枚数。</text>
<text x="22" y="101">　カラー画像なら赤・緑・青の 3 枚）</text>
<text x="22" y="119">バイアス：フィルタ1個ごとに最後に足す、</text>
<text x="22" y="137">　学習で決まる数（1つ）</text>
<text x="12" y="174" class="tb">① 畳み込み層の重みの数え方</text>
<rect x="32" y="194" width="38" height="38" class="fs sa" stroke-width="1.5"/>
<rect x="26" y="200" width="38" height="38" class="fs sa" stroke-width="1.5"/>
<rect x="20" y="206" width="38" height="38" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="212" width="38" height="38" class="fas sa" stroke-width="1.5"/>
<text x="42" y="266" class="tb" text-anchor="middle">入力</text>
<text x="42" y="284" class="tm" text-anchor="middle">8チャネル</text>
<line x1="78" y1="220" x2="98" y2="220" class="l w2"/>
<polyline points="91,223.85 98,220 91,216.15" class="l w2"/>
<rect x="118" y="204" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="131" y="204" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="144" y="204" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="118" y="217" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="131" y="217" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="144" y="217" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="118" y="230" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="131" y="230" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="144" y="230" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="112" y="210" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="125" y="210" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="138" y="210" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="112" y="223" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="125" y="223" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="138" y="223" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="112" y="236" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="125" y="236" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="138" y="236" width="13" height="13" class="fs sa" stroke-width="1"/>
<rect x="106" y="216" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="119" y="216" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="132" y="216" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="106" y="229" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="119" y="229" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="132" y="229" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="106" y="242" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="119" y="242" width="13" height="13" class="fas sa" stroke-width="1"/>
<rect x="132" y="242" width="13" height="13" class="fas sa" stroke-width="1"/>
<text x="130" y="266" class="tb" text-anchor="middle">フィルタ</text>
<text x="130" y="284" class="tm" text-anchor="middle">3×3×8</text>
<text x="172" y="226" class="tb ta">×16個</text>
<line x1="214" y1="220" x2="234" y2="220" class="l w2"/>
<polyline points="227,223.85 234,220 227,216.15" class="l w2"/>
<rect x="260" y="194" width="38" height="38" class="fs sok" stroke-width="1.5"/>
<rect x="254" y="200" width="38" height="38" class="fs sok" stroke-width="1.5"/>
<rect x="248" y="206" width="38" height="38" class="fs sok" stroke-width="1.5"/>
<rect x="242" y="212" width="38" height="38" class="fas sok" stroke-width="1.5"/>
<text x="270" y="266" class="tb" text-anchor="middle">出力</text>
<text x="270" y="284" class="tm" text-anchor="middle">16チャネル</text>
<text x="12" y="318">フィルタ1個の重み（縦×横×入力ch）</text>
<text x="308" y="318" class="tb" text-anchor="end">3×3×8＝72</text>
<text x="12" y="344">バイアス（フィルタ1個に1つ）</text>
<text x="308" y="344" class="tb" text-anchor="end">＋1</text>
<text x="12" y="370">出力チャネル数ぶん（16個）</text>
<text x="308" y="370" class="tb" text-anchor="end">(72＋1)×16</text>
<line x1="12" y1="384" x2="308" y2="384" class="l sb w1"/>
<text x="12" y="402" class="tb">畳み込み層のパラメータ数</text>
<text x="308" y="402" class="tb ta" text-anchor="end">＝1,168 個</text>
<rect x="12" y="434" width="296" height="1" class="fs sb" stroke-width="1"/>
<text x="12" y="460" class="tb">② 同じ仕事を全結合層でやると</text>
<text x="12" y="480" class="tm">入力8チャネル→出力16チャネル、出力の</text>
<text x="12" y="498" class="tm">縦横も入力と同じ、という同じ仕事を</text>
<text x="12" y="516" class="tm">全結合層でやると、パラメータは何個か</text>
<text x="12" y="544" class="tm">画像の大きさ</text>
<text x="170" y="544" class="tb ta" text-anchor="middle">畳み込み</text>
<text x="308" y="544" class="tb twn" text-anchor="end">全結合</text>
<line x1="12" y1="552" x2="308" y2="552" class="l sb w1"/>
<text x="12" y="576" class="tb">8×8</text>
<text x="170" y="576" class="tb ta" text-anchor="middle">1,168個</text>
<text x="308" y="576" class="tb twn" text-anchor="end">525,312個</text>
<text x="12" y="604" class="tb">16×16</text>
<text x="170" y="604" class="tb ta" text-anchor="middle">1,168個</text>
<text x="308" y="604" class="tb twn" text-anchor="end">8,392,704個</text>
<text x="12" y="640" class="tb twn">全結合はなぜこんなに多いのか</text>
<text x="12" y="660" class="tm">出力の1マスずつが、入力の全部のマスと</text>
<text x="12" y="678" class="tm">1本ずつ線でつながり、線1本に重みが1つ</text>
<text x="12" y="696" class="tm">8×8なら 入力 8×8×8＝512マス、</text>
<text x="12" y="714" class="tm">出力 8×8×16＝1,024マス</text>
<text x="12" y="732" class="tm">線 512×1,024本＋バイアス 1,024個</text>
<text x="12" y="750" class="tm">＝(512＋1)×1,024＝525,312個</text>
<text x="12" y="768" class="tm">16×16なら 入力2,048・出力4,096マスで</text>
<text x="12" y="786" class="tm">(2,048＋1)×4,096＝8,392,704個</text>
<text x="12" y="822" class="tb ta">畳み込みはなぜ変わらないのか</text>
<text x="12" y="842" class="tm">出力の1マスが見るのは、入力の近くの</text>
<text x="12" y="860" class="tm">3×3だけ。しかも①の16個のフィルタを</text>
<text x="12" y="878" class="tm">画像のどこでも同じものを使い回すので、</text>
<text x="12" y="896" class="tm">画像が大きくなっても1,168個のまま</text>
<rect x="12" y="916" width="296" height="56" class="fas sa" stroke-width="1.5"/>
<text x="160" y="939.5" class="tb" text-anchor="middle">畳み込みは同じフィルタを画像全体で使い回す</text>
<text x="160" y="957.5" class="tb" text-anchor="middle">（重みの共有）→ 画像の大きさに依存しない</text>
</svg>
