<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 720" role="img" aria-labelledby="fig-g-state-action-value-t fig-g-state-action-value-d">
<title id="fig-g-state-action-value-t">状態価値 V(s) と行動価値 Q(s,a)：部屋の例での違い</title>
<desc id="fig-g-state-action-value-d">例：ロボットが部屋A・部屋B・部屋Cを右へ左へ動き、部屋Cに着くと報酬10をもらって終わる。それ以外の移動の報酬は0。割引率は0.9で、1歩先の得は0.9倍に数える。ことばの式は、この先の得＝いまもらう報酬＋割引率×次の部屋から先の得。方策はいつも右へを選ぶとする。①は状態価値で、部屋ごとに数を1つ持つ。部屋Bから右へ進むとCに着いて10もらって終わるので、V(部屋B)＝10。部屋Aは右へ進んでBに着き報酬0、Bから先の得は10なので、V(部屋A)＝0＋0.9×10＝0＋9＝9。②は行動価値で、部屋と行動の組ごとに数を持つ。部屋Bで右へは、Cに着いて10もらって終わるので Q(部屋B, 右へ)＝10。部屋Bで左へは、Aに戻って報酬0、Aから先は方策どおり右へ進むので得はV(部屋A)＝9、Q(部屋B, 左へ)＝0＋0.9×9＝0＋8.1＝8.1。③は行動の選び方。Qがあれば部屋Bでは大きいほうの右へ（10）を選べばよい。Vだけだと、右へ行くとどの部屋に着くかという環境のモデルを知らないと選べないので、モデルが無いときはQを学ぶ（Q学習・SARSA）。方策がいつも右へなので、V(部屋B)はQ(部屋B, 右へ)と同じ10になる。Q学習の図の4・8・2は学習の途中の見積もりで、学習が進むとここで計算した値に近づく。</desc>
<text x="12" y="20" class="tb">V と Q：数を持つ単位が違う</text>
<text x="12" y="42" class="tm">例：部屋Cに着くと報酬10で終わり。</text>
<text x="12" y="60" class="tm">ほかの移動は報酬0。方策はいつも右へ</text>
<rect x="12" y="72" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="52" y="95" class="tb" text-anchor="middle">部屋A</text>
<rect x="120" y="72" width="80" height="36" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="95" class="tb ta" text-anchor="middle">部屋B</text>
<rect x="228" y="72" width="80" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="268" y="95" class="tb tok" text-anchor="middle">部屋C</text>
<line x1="92" y1="90" x2="120" y2="90" class="l sm w1"/>
<line x1="200" y1="90" x2="228" y2="90" class="l sm w1"/>
<text x="268" y="126" class="tok" text-anchor="middle">着くと10</text>
<text x="12" y="150" class="tm">ことばの式：この先の得＝いまもらう報酬</text>
<text x="12" y="168" class="tm">　＋割引率（0.9）×次の部屋から先の得</text>
<text x="12" y="186" class="tm">（1歩先の得は 0.9 倍に数える）</text>
<line x1="12" y1="200" x2="308" y2="200" class="l sb w1"/>
<text x="12" y="224" class="tb">① 状態価値 V(s)：部屋ごとに1つ</text>
<rect x="12" y="236" width="80" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="52" y="255" class="tm" text-anchor="middle">部屋A</text>
<text x="52" y="273" class="tb" text-anchor="middle">V＝9</text>
<rect x="120" y="236" width="80" height="44" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="255" class="tm" text-anchor="middle">部屋B</text>
<text x="160" y="273" class="tb ta" text-anchor="middle">V＝10</text>
<text x="12" y="304" class="ta">B：右へ進んでCで10もらい終わる → 10</text>
<text x="12" y="324" class="tm">A：右へ進んでBへ（報酬0）。Bから先は10</text>
<text x="12" y="344" class="tm">　→ 0＋0.9×10＝0＋9＝9</text>
<line x1="12" y1="360" x2="308" y2="360" class="l sb w1"/>
<text x="12" y="384" class="tb">② 行動価値 Q(s,a)：部屋と行動の組ごと</text>
<rect x="120" y="398" width="80" height="36" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="421" class="tb ta" text-anchor="middle">部屋B</text>
<line x1="200" y1="416" x2="222.4" y2="416" class="l sok w2"/>
<polygon points="228,416 222.4,419.5 222.4,412.5" class="fm"/>
<rect x="230" y="398" width="78" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="269" y="414" class="tok" text-anchor="middle">右へ</text>
<text x="269" y="429" class="tb tok" text-anchor="middle">Q＝10</text>
<line x1="120" y1="416" x2="97.6" y2="416" class="l sng w2"/>
<polygon points="92,416 97.6,412.5 97.6,419.5" class="fm"/>
<rect x="12" y="398" width="78" height="36" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="51" y="414" class="tng" text-anchor="middle">左へ</text>
<text x="51" y="429" class="tb tng" text-anchor="middle">Q＝8.1</text>
<text x="12" y="458" class="tok">右へ：Cに着いて10もらい終わる → 10</text>
<text x="12" y="478" class="tng">左へ：Aに戻る（報酬0）。Aから先は</text>
<text x="12" y="496" class="tng">　右へ進むので V(A)＝9</text>
<text x="12" y="514" class="tng">　→ 0＋0.9×9＝0＋8.1＝8.1</text>
<text x="12" y="538" class="tm">同じ部屋Bでも、行動ごとに別の数を持つ</text>
<line x1="12" y1="554" x2="308" y2="554" class="l sb w1"/>
<text x="12" y="578" class="tb">③ 行動を選ぶとき</text>
<text x="12" y="602" class="tok">Q があれば：大きいほう（右へ 10）を選ぶ</text>
<text x="12" y="626" class="tng">V だけだと：右へ行くとどの部屋に着くか</text>
<text x="12" y="646" class="tng">（環境のモデル）を知らないと選べない</text>
<text x="12" y="668" class="tm">→ モデルが無いときは Q を学ぶ（Q学習）</text>
<text x="12" y="690" class="tm">方策がいつも右へなので V(B)＝Q(B,右へ)</text>
<text x="12" y="710" class="tm">Q学習の図の 4・8・2 は学習の途中の見積もり</text>
</svg>
