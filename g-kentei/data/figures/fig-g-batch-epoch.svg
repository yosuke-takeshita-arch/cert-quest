<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 454" role="img" aria-labelledby="fig-g-batch-epoch-t fig-g-batch-epoch-d">
<title id="fig-g-batch-epoch-t">バッチ・ミニバッチ・オンライン学習と、エポック・イテレーション</title>
<desc id="fig-g-batch-epoch-d">訓練データ1,200件を帯で表す。バッチ学習は帯全体を使って1回更新する。ミニバッチ学習は300件ずつ4つに区切り、区切りごとに更新するので、全データを1周する1エポックで4回更新する。オンライン学習は1件ずつ更新するので1,200回。下は、ミニバッチ学習を3エポック続けた場合。パラメータを1回更新することがイテレーションで、1エポックは4イテレーション、3エポックで12回の更新になる。</desc>
