<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 870" role="img" aria-labelledby="fig-g-nyquist-t fig-g-nyquist-d">
<title id="fig-g-nyquist-t">記録できる一番高い音は、1秒に取る回数の半分（ナイキスト周波数）</title>
<desc id="fig-g-nyquist-d">何のための図か：1秒に16,000回値を取って記録すると、記録できる一番高い音が8,000 Hz（取る回数の半分）になる理由を、小さな数で見る。読み方：グラフはどれも、横軸が時間（左端から右端までで1秒）、縦軸が音の大きさ。丸は値を取った点で、1秒に8回取る。Hz（ヘルツ）は1秒に振動する回数。考え方：1回の振動は、山1つと谷1つでできている。上下に動いたと分かるには、山と谷の両方に点が要るので、1回の振動に2回の読み取りが要る。例1：1秒に4回振動する波を1秒に8回取ると、点が山、谷、山、谷と交互に乗り、点を結ぶと1秒に4回の上下が分かる。8÷2＝4で、これがちょうど上限（点が山と谷にちょうど乗った場合）。例2：1秒に6回振動する波を1秒に8回取ると、山と谷に1つずつは取れず、点だけを結ぶと1秒に2回のゆっくりした波になる。6回振動の音が、2回振動の別の音として記録されてしまう。これをエイリアシング（aliasing）と言う。問題の数：1秒に16,000回取るなら、山と谷を1つずつ取れるのは16,000÷2＝8,000回振動の波（8,000 Hz）まで。この上限をナイキスト周波数と言う。それより高い音、例えば10,000 Hz は、6,000 Hz の別の音に化けて記録される。</desc>
<text x="12" y="20" class="tb">記録できる一番高い音＝取る回数の半分</text>
<text x="12" y="42" class="tm">何のための図か：16,000 回取ると、なぜ 8,000 Hz</text>
<text x="12" y="60" class="tm">までしか記録できないかを、小さな数で見る</text>
<rect x="12" y="72" width="296" height="80" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="92" class="tb">まず読み方</text>
<text x="22" y="110" class="tm">横：時間（左端から右端までで 1秒）</text>
<text x="22" y="127" class="tm">縦：音の大きさ　丸：値を取った点（1秒に8回）</text>
<text x="22" y="144" class="tm">Hz（ヘルツ）＝1秒に振動する回数</text>
<g transform="translate(0,18)">
<line x1="12" y1="148" x2="308" y2="148" class="l sb w1"/>
<text x="12" y="170" class="tb">考え方：1回の振動＝山1つ＋谷1つ</text>
<text x="12" y="190" class="tm">上下に動いたと分かるには、山と谷の両方に</text>
<text x="12" y="208" class="tm">点が要る</text>
<text x="12" y="228" class="tb ta">→ 1回の振動に、2回の読み取りが要る</text>
