<text x="12" y="586" class="tm">細い線＝元の音（1秒に6回振動）</text>
<text x="12" y="604" class="tm tng">破線＝点だけを結んだ波（1秒に2回振動）</text>
<text x="12" y="626" class="tm">山と谷に1つずつは取れず、点が飛び飛び</text>
<text x="12" y="646" class="tb tng">→ 6回振動の音が、2回振動の音として残る</text>
<text x="12" y="666" class="tm">別の音に化けることを、エイリアシング</text>
<text x="12" y="684" class="tm">（aliasing）と言う</text>
<line x1="12" y1="698" x2="308" y2="698" class="l sb w1"/>
<text x="12" y="720" class="tb">③ 問題の数：1秒に 16,000 回取るなら</text>
<text x="12" y="740" class="tm">山と谷を1つずつ取れるのは</text>
<rect x="12" y="750" width="296" height="30" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="770" class="tb tok" text-anchor="middle">16,000 ÷ 2 ＝ 8,000 Hz の音まで</text>
<text x="12" y="800" class="tm">この上限を、ナイキスト周波数と言う</text>
<text x="12" y="820" class="tm">それより高い音（例 10,000 Hz）は、</text>
<text x="12" y="838" class="tm tng">6,000 Hz の別の音に化けて記録される</text>
