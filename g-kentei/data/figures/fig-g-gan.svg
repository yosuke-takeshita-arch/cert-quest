<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-g-gan-t fig-g-gan-d">
<title id="fig-g-gan-t">GAN：生成器と識別器が競う</title>
<desc id="fig-g-gan-d">ノイズ z を生成器に入れて偽の画像を作る。識別器には、その偽の画像と本物の画像が入り、本物か生成物かを見分ける。生成器は識別器が間違える確率を最大にするように学び、識別器は本物と生成物を見分けるように学ぶ。2つを互いに競わせながら同時に学習する。DCGAN は、生成器と識別器の両方に、一定の構造上の制約を設けた畳み込みネットワークを使う。</desc>
<text x="12" y="20" class="tb">2つのネットワークを競わせる</text>
<rect x="12" y="40" width="60" height="36" class="fs sb" stroke-width="1.5"/>
<text x="42" y="53.5" text-anchor="middle">ノイズ</text>
<text x="42" y="71.5" text-anchor="middle">z</text>
<line x1="72" y1="58" x2="90" y2="58" class="l w2"/>
<polyline points="83,61.85 90,58 83,54.15" class="l w2"/>
<rect x="92" y="40" width="74" height="36" class="fas sa" stroke-width="1.5"/>
<text x="129" y="62.5" class="tb" text-anchor="middle">生成器</text>
<line x1="166" y1="58" x2="184" y2="58" class="l w2"/>
<polyline points="177,61.85 184,58 177,54.15" class="l w2"/>
<rect x="186" y="40" width="122" height="36" class="fng sng" stroke-width="1.5"/>
<text x="247" y="62.5" class="tb" text-anchor="middle">偽の画像</text>
<rect x="12" y="140" width="100" height="36" class="fok sok" stroke-width="1.5"/>
<text x="62" y="162.5" class="tb" text-anchor="middle">本物の画像</text>
<line x1="112" y1="158" x2="132" y2="158" class="l w2"/>
<polyline points="125,161.85 132,158 125,154.15" class="l w2"/>
<rect x="134" y="134" width="92" height="48" class="fas sa" stroke-width="1.5"/>
<text x="180" y="162.5" class="tb" text-anchor="middle">識別器</text>
<line x1="246" y1="76" x2="200" y2="132" class="l sng w2"/>
<polyline points="201.47,124.15 200,132 207.42,129.03" class="l sng w2"/>
<line x1="226" y1="158" x2="244" y2="158" class="l w2"/>
<polyline points="237,161.85 244,158 237,154.15" class="l w2"/>
<rect x="246" y="140" width="62" height="36" class="fs sb" stroke-width="1.5"/>
<text x="277" y="153.5" text-anchor="middle">本物？</text>
<text x="277" y="171.5" text-anchor="middle">偽物？</text>
<line x1="12" y1="204" x2="308" y2="204" class="l sb w1"/>
<text x="12" y="228" class="tb">学び方が、逆向き</text>
<rect x="12" y="242" width="296" height="46" class="fng sng" stroke-width="1.5"/>
<text x="160" y="260.5" text-anchor="middle">生成器：識別器が間違える確率を</text>
<text x="160" y="278.5" text-anchor="middle">最大にするように学ぶ</text>
<rect x="12" y="298" width="296" height="46" class="fas sa" stroke-width="1.5"/>
<text x="160" y="316.5" text-anchor="middle">識別器：本物と生成物を</text>
<text x="160" y="334.5" text-anchor="middle">見分けるように学ぶ</text>
<text x="12" y="372" class="tb">2つを競わせながら、同時に学習する</text>
<line x1="12" y1="392" x2="308" y2="392" class="l sb w1"/>
<text x="12" y="416" class="tb">DCGAN</text>
<text x="12" y="438">生成器・識別器の両方に、</text>
<text x="12" y="458">畳み込みネットワーク（構造に制約）を使う</text>
</svg>
