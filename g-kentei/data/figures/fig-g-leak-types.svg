<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 596" role="img" aria-labelledby="fig-g-leak-types-t fig-g-leak-types-d">
<title id="fig-g-leak-types-t">データリーケージの3つの型と、防ぐ分け方</title>
<desc id="fig-g-leak-types-d">何のための図か：本来は学習に使えない情報が学習側に入るデータリーケージを、3つの型で見る。①予測の時点で無い情報を特徴量に入れる：解約を予測するのに、解約手続きの後でしか記録されない「解約理由」を入れる。予測するときには手元に無い。②時間の順を逆に分ける：時間の流れを左から右に描くと、正しくは過去で学習して未来で評価する。未来で学習して過去で評価すると、来月の動きを知ったうえで先月を当てることになる。③前処理の統計を全データで計算する：平均や標準偏差を全データで求めると、評価用の値もその計算に入る。正しくは学習用だけで平均と標準偏差を求め、その値で評価用も変換する。防ぐ分け方：学習用と評価用を、時間の順や利用者が重ならないように分け、評価用は最後まで学習に使わない。これはリーケージの例ではなく、防ぐ手順。</desc>
<text x="12" y="20" class="tb">データリーケージの3つの型</text>
<text x="12" y="42" class="tm">予測するとき、その情報は手元にあるか</text>
<line x1="12" y1="54" x2="308" y2="54" class="l sb w1"/>
<text x="12" y="78" class="tb">① 予測の時点で無い情報を特徴量に</text>
<text x="12" y="96">解約を予測するのに「解約理由」を入れる</text>
<text x="12" y="114" class="tm">解約理由は、解約手続きの後でしか記録されない</text>
<text x="12" y="132" class="tng">→ まだ解約していない人を予測するとき、</text>
<text x="12" y="150" class="tng">　 手元に無い</text>
<line x1="12" y1="162" x2="308" y2="162" class="l sb w1"/>
<text x="12" y="186" class="tb">② 時間の順を逆に分ける</text>
<text x="12" y="204" class="tm">左 → 右に時間が進む</text>
<text x="12" y="228" class="tb tok">正しい</text>
<rect x="24" y="236" width="160" height="24" class="fas sa" stroke-width="1.5" rx="3"/>
<text x="104" y="253" text-anchor="middle">過去で学習</text>
<rect x="188" y="236" width="108" height="24" class="fok sok" stroke-width="1.5" rx="3"/>
<text x="242" y="253" text-anchor="middle">未来で評価</text>
<text x="24" y="276" class="tm">過去</text>
<text x="296" y="276" class="tm" text-anchor="end">未来</text>
<text x="12" y="296" class="tok">本番と同じく、過去から未来を当てる</text>
<text x="12" y="320" class="tb tng">リーケージ</text>
<rect x="24" y="328" width="160" height="24" class="fng sng" stroke-width="1.5" rx="3"/>
<text x="104" y="345" text-anchor="middle">過去で評価</text>
<rect x="188" y="328" width="108" height="24" class="fas sa" stroke-width="1.5" rx="3"/>
<text x="242" y="345" text-anchor="middle">未来で学習</text>
<text x="24" y="368" class="tm">過去</text>
<text x="296" y="368" class="tm" text-anchor="end">未来</text>
<text x="12" y="388" class="tng">来月の動きを知ったうえで先月を当てる</text>
<line x1="12" y1="400" x2="308" y2="400" class="l sb w1"/>
<text x="12" y="424" class="tb">③ 前処理の統計を全データで計算</text>
<text x="12" y="442">平均・標準偏差を全データで求めると、</text>
<text x="12" y="460" class="tng">評価用の値もその計算に入る</text>
<text x="12" y="482" class="tok">正しくは：学習用だけで平均・標準偏差を</text>
<text x="12" y="500" class="tok">求め、その値で評価用も変換する</text>
<rect x="12" y="512" width="296" height="70" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="534" class="tb tok">防ぐ分け方（リーケージではない）</text>
<text x="24" y="552">時間の順・利用者が重ならないように分け、</text>
<text x="24" y="570">評価用は最後まで学習に使わない</text>
</svg>
