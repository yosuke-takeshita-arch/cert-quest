<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 614" role="img" aria-labelledby="fig-g-dendrogram-t fig-g-dendrogram-d">
<title id="fig-g-dendrogram-t">階層的クラスタリングとデンドログラム</title>
<desc id="fig-g-dendrogram-d">上は平面上の5点AからE。近い組から順に結合する。1番目はAとB（青の輪）、2番目はDとE（茶の輪）、3番目はCとDEのまとまり、4番目はABのまとまりと残り全部で、全体が1つになる。下はその結合の順を木にしたデンドログラムで、横棒の番号は上の結合の番号と同じ。横棒の高さはその結合のときの距離で、近い組ほど低い位置でつながる。点線で切ると、AとB（青）、C（緑）、DとE（茶）の3クラスタになり、これは上の図の3つの色のまとまりと同じ。ウォード法は、結合したときのクラスタ内のばらつきの増え方が最小の組を順に結合する。</desc>
<text x="12" y="20" class="tb">① 平面上の5点</text>
<rect x="12" y="30" width="296" height="140" class="sb" stroke-width="1"/>
<ellipse cx="62" cy="88" rx="38" ry="26" class="sa w2"/>
<ellipse cx="250" cy="126" rx="42" ry="28" class="swn w2"/>
<line x1="157" y1="114" x2="209" y2="124" class="l w2"/>
<path d="M 90,68 Q 130,44 184,108" class="l w2 dsh"/>
<circle cx="52" cy="80" r="7" class="fs sa" stroke-width="2"/>
<text x="44" y="78" class="tb" text-anchor="end">A</text>
<circle cx="70" cy="96" r="7" class="fs sa" stroke-width="2"/>
<text x="80" y="100" class="tb">B</text>
<rect x="143" y="105" width="14" height="14" class="fs sok" stroke-width="2"/>
<text x="150" y="138" class="tb" text-anchor="middle">C</text>
<polygon points="240,128 248,143 232,143" class="fs swn" stroke-width="2"/>
<text x="228" y="142" class="tb" text-anchor="end">D</text>
<polygon points="260,106 268,121 252,121" class="fs swn" stroke-width="2"/>
<text x="276" y="117" class="tb">E</text>
<circle cx="62" cy="62" r="8" class="fs l w1"/>
<text x="62" y="66.5" class="tb" text-anchor="middle">1</text>
<circle cx="250" cy="98" r="8" class="fs l w1"/>
<text x="250" y="102.5" class="tb" text-anchor="middle">2</text>
<circle cx="184" cy="118" r="8" class="fs l w1"/>
<text x="184" y="122.5" class="tb" text-anchor="middle">3</text>
<circle cx="133" cy="66" r="8" class="fs l w1"/>
<text x="133" y="70.5" class="tb" text-anchor="middle">4</text>
<text x="12" y="192" class="tb">番号＝結合の順（1が最初）</text>
<text x="12" y="212" class="tm">輪や線は、そのとき結ばれた組</text>
<text x="12" y="244" class="tb">② 結合の順と距離（デンドログラム）</text>
<rect x="12" y="254" width="296" height="176" class="sb" stroke-width="1"/>
<polyline points="68,396 68,372 122,372 122,396" class="l sa w2"/>
<line x1="95" y1="372" x2="95" y2="349" class="l sa w2"/>
<line x1="176" y1="396" x2="176" y2="349" class="l sok w2"/>
<polyline points="230,396 230,368 284,368 284,396" class="l swn w2"/>
<line x1="257" y1="368" x2="257" y2="349" class="l swn w2"/>
<polyline points="95,349 95,282 216.5,282 216.5,330" class="l w2"/>
<polyline points="176,349 176,330 257,330 257,349" class="l w2"/>
<line x1="16" y1="349" x2="304" y2="349" class="l sng w2 dsh"/>
<circle cx="80" cy="372" r="8" class="fs l w1"/>
<text x="80" y="376.5" class="tb" text-anchor="middle">1</text>
<circle cx="243" cy="368" r="8" class="fs l w1"/>
<text x="243" y="372.5" class="tb" text-anchor="middle">2</text>
<circle cx="192" cy="330" r="8" class="fs l w1"/>
<text x="192" y="334.5" class="tb" text-anchor="middle">3</text>
<circle cx="150" cy="282" r="8" class="fs l w1"/>
<text x="150" y="286.5" class="tb" text-anchor="middle">4</text>
<text x="68" y="418" class="tb" text-anchor="middle">A</text>
<text x="122" y="418" class="tb" text-anchor="middle">B</text>
<text x="176" y="418" class="tb" text-anchor="middle">C</text>
<text x="230" y="418" class="tb" text-anchor="middle">D</text>
<text x="284" y="418" class="tb" text-anchor="middle">E</text>
<text x="20" y="272" class="tm">距離（上ほど遠い）</text>
<text x="20" y="343" class="tb tng">切る線</text>
<text x="12" y="456" class="tb">横棒の高さ＝結合したときの距離</text>
<text x="12" y="476" class="tm">（近い組ほど低い位置で結合する）</text>
<text x="12" y="502" class="tb">点線で切ると、①の3つの色の</text>
<text x="12" y="522" class="tb">まとまり（青・緑・茶）になる</text>
<text x="12" y="548">ウォード法：結合したとき、クラスタ内の</text>
<text x="12" y="568">ばらつきの増え方が最小の組から結合</text>
<text x="12" y="594" class="tb">切る高さで、クラスタ数を後から選べる</text>
<text x="12" y="612" class="tm">（k-means は先に k を決める）</text>
</svg>
