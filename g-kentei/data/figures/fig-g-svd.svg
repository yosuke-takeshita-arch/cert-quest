<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1024" role="img" aria-labelledby="fig-g-svd-t fig-g-svd-d">
<title id="fig-g-svd-t">特異値分解（SVD）：表を3つの行列の積に分け、大きい特異値だけ残して近似する</title>
<desc id="fig-g-svd-d">特異値分解（SVD）は、行列（表）を3つの行列の積に分ける方法。例（数は説明のための例）：4人が3作品につけた評価（5点満点）で、ア・イはアクション、ウは恋愛の作品。利用者1は5・5・0、利用者2は4・5・1、利用者3は1・0・5、利用者4は0・1・4。①元の表は4行×3列で12個の数。②表＝U×（特異値を並べた行列）×Vᵀに分ける。Uは各利用者がどの軸に寄るか、Vᵀは各作品がどの軸に寄るか、真ん中の特異値はその軸がどれだけ大きいか（重要度）。特異値は大きい順に約9.7、6.2、1.1。軸1はおもにア・イ（アクション）、軸2はおもにウ（恋愛）、軸3は残りの細かいずれ。③大きい2つだけ残して（軸3を捨てて）掛け直すと、元の表に近い表ができる。利用者1は4.7・5.2・0.0、利用者2は4.3・4.7・1.0、利用者3は0.5・0.4・5.0、利用者4は0.5・0.5・4.0で、ずれは大きくても約0.5。12個の数の表が2つの軸でほぼ表せる＝少ない次元で近似できた。大きな表ほど効く：1万語×1,000文書の表は1,000万個の数だが、大きい100個だけ残すと1万×100＋100＋100×1,000で約110万個（約9分の1）。軸は『スポーツらしさ』のような意味を持つ（潜在意味解析）。推薦やPCAの計算にも使う。</desc>
<text x="12" y="20" class="tb">特異値分解（SVD）：表を3つの行列の積に</text>
<text x="12" y="42" class="tm">例：4人が3作品につけた評価（5点満点）</text>
<text x="12" y="60" class="tm">ア・イはアクション、ウは恋愛の作品</text>
<text x="12" y="78" class="tm">（数は説明のための例）</text>
<text x="12" y="106" class="tb">① 元の表（4行×3列＝12個の数）</text>
<text x="117" y="128" class="tb tm" text-anchor="middle">ア</text>
<text x="167" y="128" class="tb tm" text-anchor="middle">イ</text>
<text x="217" y="128" class="tb tm" text-anchor="middle">ウ</text>
<text x="24" y="154" class="tb">利用者1</text>
<rect x="92" y="136" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="117" y="154" class="tb" text-anchor="middle">5</text>
<rect x="142" y="136" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="167" y="154" class="tb" text-anchor="middle">5</text>
<rect x="192" y="136" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="217" y="154" class="tb" text-anchor="middle">0</text>
<text x="24" y="180" class="tb">利用者2</text>
<rect x="92" y="162" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="117" y="180" class="tb" text-anchor="middle">4</text>
<rect x="142" y="162" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="167" y="180" class="tb" text-anchor="middle">5</text>
<rect x="192" y="162" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="217" y="180" class="tb" text-anchor="middle">1</text>
<text x="24" y="206" class="tb">利用者3</text>
<rect x="92" y="188" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="117" y="206" class="tb" text-anchor="middle">1</text>
<rect x="142" y="188" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="167" y="206" class="tb" text-anchor="middle">0</text>
<rect x="192" y="188" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="217" y="206" class="tb" text-anchor="middle">5</text>
<text x="24" y="232" class="tb">利用者4</text>
<rect x="92" y="214" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="117" y="232" class="tb" text-anchor="middle">0</text>
<rect x="142" y="214" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="167" y="232" class="tb" text-anchor="middle">1</text>
<rect x="192" y="214" width="50" height="26" class="fs sb" stroke-width="1"/>
<text x="217" y="232" class="tb" text-anchor="middle">4</text>
<line x1="160" y1="248" x2="160" y2="256.4" class="l sm w1"/>
<polygon points="160,262 156.5,256.4 163.5,256.4" class="fm"/>
<text x="12" y="284" class="tb">② 3つの行列の積に分ける</text>
<rect x="24" y="300" width="30" height="40" class="fs sm" stroke-width="1.5"/>
<text x="39" y="325" class="tb" text-anchor="middle">表</text>
<text x="66" y="325" class="tb" text-anchor="middle">＝</text>
<rect x="80" y="300" width="30" height="40" class="fas sa" stroke-width="1.5"/>
<text x="95" y="325" class="tb" text-anchor="middle">U</text>
<text x="122" y="325" class="tb" text-anchor="middle">×</text>
<rect x="134" y="300" width="84" height="72" class="fok sok" stroke-width="1.5"/>
<text x="148" y="318" class="tb" text-anchor="middle">9.7</text>
<text x="176" y="340" class="tb" text-anchor="middle">6.2</text>
<text x="204" y="362" class="tb" text-anchor="middle">1.1</text>
<text x="230" y="325" class="tb" text-anchor="middle">×</text>
<rect x="244" y="300" width="40" height="40" class="fwn swn" stroke-width="1.5"/>
<text x="264" y="325" class="tb" text-anchor="middle">Vᵀ</text>
<text x="95" y="358" class="tm" text-anchor="middle">利用者</text>
<text x="95" y="374" class="tm" text-anchor="middle">×軸</text>
<text x="264" y="358" class="tm" text-anchor="middle">軸</text>
<text x="264" y="374" class="tm" text-anchor="middle">×作品</text>
<text x="176" y="390" class="tm" text-anchor="middle">真ん中＝特異値（軸の重要度）</text>
<text x="24" y="414">U：各利用者がどの軸に寄るか</text>
<text x="24" y="434">Vᵀ：各作品がどの軸に寄るか</text>
<text x="24" y="454">真ん中の特異値：その軸がどれだけ大きいか</text>
<text x="24" y="484" class="tb">軸1：おもに ア・イ（アクション）</text>
<rect x="24" y="492" width="200" height="14" class="fas sa" stroke-width="1.5"/>
<text x="232" y="504" class="tb">9.7</text>
<text x="24" y="528" class="tb">軸2：おもに ウ（恋愛）</text>
<rect x="24" y="536" width="128.2047759555853" height="14" class="fas sa" stroke-width="1.5"/>
<text x="160.2047759555853" y="548" class="tb">6.2</text>
<text x="24" y="572" class="tm">軸3：残りの細かいずれ</text>
<rect x="24" y="580" width="23.107021753706327" height="14" class="fbg sm" stroke-width="1.5"/>
<text x="55.10702175370633" y="592" class="tb">1.1</text>
<line x1="160" y1="608" x2="160" y2="616.4" class="l sm w1"/>
<polygon points="160,622 156.5,616.4 163.5,616.4" class="fm"/>
<text x="12" y="644" class="tb">③ 大きい2つだけ残して掛け直す</text>
<text x="12" y="664" class="tm">（軸3を捨てる）。元 → 近似</text>
<text x="125" y="688" class="tb tm" text-anchor="middle">ア</text>
<text x="191" y="688" class="tb tm" text-anchor="middle">イ</text>
<text x="257" y="688" class="tb tm" text-anchor="middle">ウ</text>
<text x="24" y="714" class="tb">利用者1</text>
<rect x="92" y="696" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="125" y="714" class="tb" text-anchor="middle">5→4.7</text>
<rect x="158" y="696" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="191" y="714" class="tb" text-anchor="middle">5→5.2</text>
<rect x="224" y="696" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="257" y="714" class="tb" text-anchor="middle">0→0.0</text>
<text x="24" y="740" class="tb">利用者2</text>
<rect x="92" y="722" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="125" y="740" class="tb" text-anchor="middle">4→4.3</text>
<rect x="158" y="722" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="191" y="740" class="tb" text-anchor="middle">5→4.7</text>
<rect x="224" y="722" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="257" y="740" class="tb" text-anchor="middle">1→1.0</text>
<text x="24" y="766" class="tb">利用者3</text>
<rect x="92" y="748" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="125" y="766" class="tb" text-anchor="middle">1→0.5</text>
<rect x="158" y="748" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="191" y="766" class="tb" text-anchor="middle">0→0.4</text>
<rect x="224" y="748" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="257" y="766" class="tb" text-anchor="middle">5→5.0</text>
<text x="24" y="792" class="tb">利用者4</text>
<rect x="92" y="774" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="125" y="792" class="tb" text-anchor="middle">0→0.5</text>
<rect x="158" y="774" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="191" y="792" class="tb" text-anchor="middle">1→0.5</text>
<rect x="224" y="774" width="66" height="26" class="fs sb" stroke-width="1"/>
<text x="257" y="792" class="tb" text-anchor="middle">4→4.0</text>
<text x="12" y="832" class="tm">ずれは大きくても約0.5。12個の数の表が、2つの</text>
<text x="12" y="850" class="tm">軸（アクションらしさ・恋愛らしさ）でほぼ</text>
<text x="12" y="868" class="tm">表せる＝少ない次元で近似できた</text>
<text x="12" y="902" class="tb">大きな表ほど効く</text>
<text x="12" y="922">1万語×1,000文書の表＝1,000万個の数</text>
<text x="12" y="940">大きい100個だけ残すと</text>
<text x="12" y="958" class="tb ta">1万×100＋100＋100×1,000≈110万個</text>
<text x="12" y="976" class="tm">（約9分の1）。軸は『スポーツらしさ』</text>
<text x="12" y="994" class="tm">のような意味を持つ（潜在意味解析）。</text>
<text x="12" y="1012" class="tm">推薦や PCA の計算にも使う</text>
</svg>
