<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 852" role="img" aria-labelledby="fig-g-hyperparameter-t fig-g-hyperparameter-d">
<title id="fig-g-hyperparameter-t">ハイパーパラメータ：学習の前に人が決める値と、学習で決まる重みの違い</title>
<desc id="fig-g-hyperparameter-d">上は区別の例。学習率0.1、バッチサイズ64、隠れ層3層、ドロップアウト率0.5は、学習を始める前に人が決めるハイパーパラメータ。重みw1、w2…は学習の途中で自動で直るパラメータで、例ではwが0から0.6、1.08と直る。下は、同じモデルでも学習率で結果が変わる例。誤差は(重み−3)×(重み−3)で、重み3で誤差0。勾配は誤差の坂の傾きで2×(重み−3)、重み0なら−6。坂を下る向きへ動かしたいので傾きを引き、新しい重み＝いまの重み−学習率×勾配。学習率0.1では、1回目0−0.1×(−6)＝0＋0.6＝0.6、2回目0.6−0.1×(−4.8)＝0.6＋0.48＝1.08と、3に少しずつ近づき、やがて着く。学習率1.0では、1回目0−1.0×(−6)＝6、2回目6−1.0×6＝0と、0と6を行き来して3に着かない。選び方は、候補（0.01、0.1、1.0など）で学習し、検証データの誤差が小さいものを選ぶ（グリッドサーチ・ランダムサーチなど）。テストデータを選ぶのに使うと、テストの成績が実力より良く見えてしまう。</desc>
<text x="12" y="20" class="tb">ハイパーパラメータ：学習の前に人が決める値</text>
<text x="12" y="44" class="tb">① 人が決める値と、学習で決まる値（例）</text>
<rect x="12" y="54" width="140" height="128" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="22" y="74" class="tb">人が決める</text>
<text x="22" y="92" class="tm">（学習を始める前）</text>
<text x="22" y="114" class="tm">学習率 0.1</text>
<text x="22" y="132" class="tm">バッチサイズ 64</text>
<text x="22" y="150" class="tm">隠れ層 3層</text>
<text x="22" y="168" class="tm">ドロップアウト率 0.5</text>
<rect x="168" y="54" width="140" height="128" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="178" y="74" class="tb">学習で決まる</text>
<text x="178" y="92" class="tm">（学習の途中で直る）</text>
<text x="178" y="114" class="tm">重み w1, w2, …</text>
<text x="178" y="132" class="tm">例：w ＝ 0 から</text>
<text x="178" y="150" class="tm">0.6 → 1.08 → …</text>
<text x="178" y="168" class="tm">と自動で直る</text>
<line x1="152" y1="118" x2="166" y2="118" class="l sm w1"/>
<polyline points="159.7,121.04 166,118 159.7,114.96" class="l sm w1"/>
<text x="82" y="202" class="tb twn" text-anchor="middle">ハイパーパラメータ</text>
<text x="238" y="202" class="tb ta" text-anchor="middle">パラメータ（重み）</text>
<text x="12" y="230" class="tb">② 同じモデルでも、学習率で結果が変わる（例）</text>
<text x="12" y="252" class="tm">誤差＝(重み−3)×(重み−3)。重み 3 で誤差 0</text>
<text x="12" y="272" class="tm">勾配＝誤差の坂の傾き＝2×(重み−3)</text>
<text x="12" y="290" class="tm">　（重み 0 なら 2×(0−3)＝−6）</text>
<text x="12" y="310" class="tm">坂を下る向きへ動かしたいので、傾きを引く：</text>
<text x="12" y="330" class="tb">新しい重み＝いまの重み−学習率×勾配</text>
<rect x="12" y="342" width="296" height="166" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="362" class="tb">学習率 0.1</text>
<text x="24" y="382" class="tm">1回目 0−0.1×(−6)＝0＋0.6＝0.6</text>
<text x="24" y="400" class="tm">2回目 0.6−0.1×(−4.8)＝0.6＋0.48＝1.08</text>
<line x1="40" y1="444" x2="280" y2="444" class="l sm w1"/>
<line x1="40" y1="440" x2="40" y2="448" class="l sm w1"/>
<text x="40" y="462" class="tm" text-anchor="middle">0</text>
<line x1="80" y1="440" x2="80" y2="448" class="l sm w1"/>
<text x="80" y="462" class="tm" text-anchor="middle">1</text>
<line x1="120" y1="440" x2="120" y2="448" class="l sm w1"/>
<text x="120" y="462" class="tm" text-anchor="middle">2</text>
<line x1="160" y1="440" x2="160" y2="448" class="l sm w1"/>
<text x="160" y="462" class="tm" text-anchor="middle">3</text>
<line x1="200" y1="440" x2="200" y2="448" class="l sm w1"/>
<text x="200" y="462" class="tm" text-anchor="middle">4</text>
<line x1="240" y1="440" x2="240" y2="448" class="l sm w1"/>
<text x="240" y="462" class="tm" text-anchor="middle">5</text>
<line x1="280" y1="440" x2="280" y2="448" class="l sm w1"/>
<text x="280" y="462" class="tm" text-anchor="middle">6</text>
<line x1="160" y1="426" x2="160" y2="448" class="l sok w2"/>
<text x="160" y="422" class="tok" text-anchor="middle">誤差0</text>
<circle cx="40" cy="444" r="4" class="fm"/>
<circle cx="64" cy="444" r="4" class="fm"/>
<circle cx="83.2" cy="444" r="4" class="fa sa"/>
<line x1="44" y1="434" x2="62" y2="434" class="l sa w1"/>
<polyline points="55.7,437.04 62,434 55.7,430.96" class="l sa w1"/>
<line x1="66" y1="434" x2="81.2" y2="434" class="l sa w1"/>
<polyline points="74.9,437.04 81.2,434 74.9,430.96" class="l sa w1"/>
<text x="24" y="498" class="tok">→ 3 に少しずつ近づき、やがて着く</text>
<rect x="12" y="520" width="296" height="198" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="540" class="tb">学習率 1.0</text>
<text x="24" y="560" class="tm">1回目 0−1.0×(−6)＝0＋6＝6</text>
<text x="24" y="578" class="tm">2回目 6−1.0×6＝6−6＝0（6 の勾配は 6）</text>
<line x1="40" y1="632" x2="280" y2="632" class="l sm w1"/>
<line x1="40" y1="628" x2="40" y2="636" class="l sm w1"/>
<text x="40" y="650" class="tm" text-anchor="middle">0</text>
<line x1="80" y1="628" x2="80" y2="636" class="l sm w1"/>
<text x="80" y="650" class="tm" text-anchor="middle">1</text>
<line x1="120" y1="628" x2="120" y2="636" class="l sm w1"/>
<text x="120" y="650" class="tm" text-anchor="middle">2</text>
<line x1="160" y1="628" x2="160" y2="636" class="l sm w1"/>
<text x="160" y="650" class="tm" text-anchor="middle">3</text>
<line x1="200" y1="628" x2="200" y2="636" class="l sm w1"/>
<text x="200" y="650" class="tm" text-anchor="middle">4</text>
<line x1="240" y1="628" x2="240" y2="636" class="l sm w1"/>
<text x="240" y="650" class="tm" text-anchor="middle">5</text>
<line x1="280" y1="628" x2="280" y2="636" class="l sm w1"/>
<text x="280" y="650" class="tm" text-anchor="middle">6</text>
<line x1="160" y1="614" x2="160" y2="636" class="l sok w2"/>
<text x="166" y="624" class="tok">誤差0</text>
<circle cx="40" cy="632" r="4" class="fng sng"/>
<circle cx="280" cy="632" r="4" class="fng sng"/>
<path d="M 40 624 Q 160 580 280 624" class="l sng w1"/>
<polyline points="273,617 280,624 279,614" class="l sng w1"/>
<path d="M 280 656 Q 160 688 40 656" class="l sng w1 dsh"/>
<polyline points="47,663 40,656 41,666" class="l sng w1"/>
<text x="100" y="596" class="tng" text-anchor="middle">1回目</text>
<text x="160" y="690" class="tng" text-anchor="middle">2回目</text>
<text x="24" y="710" class="tng">→ 0 と 6 を行き来して、3 に着かない</text>
<text x="12" y="744" class="tb">③ 選び方</text>
<text x="12" y="764" class="tm">・候補（0.01・0.1・1.0 など）で学習し、</text>
<text x="12" y="782" class="tm">　検証データの誤差が小さいものを選ぶ</text>
<text x="12" y="800" class="tm">　（グリッドサーチ・ランダムサーチなど）</text>
<text x="12" y="820" class="tm">・テストデータを選ぶのに使うと、テストの</text>
<text x="12" y="838" class="tm">　成績が実力より良く見えてしまう</text>
</svg>
