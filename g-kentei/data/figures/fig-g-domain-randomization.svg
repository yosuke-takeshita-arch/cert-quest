<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 668" role="img" aria-labelledby="fig-g-domain-randomization-t fig-g-domain-randomization-d">
<title id="fig-g-domain-randomization-t">sim2real とドメインランダマイゼーション：見た目をでたらめに変えて学び、現実を変化の1つにする</title>
<desc id="fig-g-domain-randomization-d">sim2real は、シミュレーションで学んだ方策やモデルを現実（実機）に移すこと。①困りごと：実機での試行は時間・費用・危険が大きい。シミュレーションなら安全に大量に試せるが、見た目や物理が現実と少しずつ違う（リアリティギャップ）ので、シミュレーションだけで学ぶと実機でうまく動かないことがある。②ドメインランダマイゼーションは、シミュレータの色・質感・照明・カメラの位置などを、でたらめに大きく変えて学ぶ。図は、縞・点・無地など模様と色の違う5枚のシミュレーションの画像で、つかむ物体（黒い四角）の位置もそれぞれ違う。その下は見え方の広がりで、四角がシミュレーションの画像、丸が現実。見た目を変えないと、シミュレーションの画像は小さな範囲に集まり、現実はその外に外れる。でたらめに変えると、範囲が広がり、現実がその中に入る。③現実の見え方が、学んだ変化の範囲の中に入るので、現実を「変化の1つ」として扱える。例：Tobin ら（2017）は、でたらめな模様のシミュレーションの画像だけで物体の位置を学び、実世界で約1.5cm の精度で当てた。混同しやすい点：sim2real はシミュレーションの中で試行錯誤する。オフライン強化学習は過去に集めたデータだけで学び、新たに試さない。</desc>
<text x="12" y="20" class="tb">sim2real とドメインランダマイゼーション</text>
<text x="12" y="42" class="tm">sim2real＝シミュレーションで学んだ方策や</text>
<text x="12" y="60" class="tm">モデルを、現実（実機）に移すこと</text>
<rect x="12" y="72" width="296" height="122" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="92" class="tb">① 困りごと：リアリティギャップ</text>
<text x="24" y="112">実機での試行は時間・費用・危険が大きい</text>
<text x="24" y="130">シミュレーションなら安全に大量に試せるが、</text>
<text x="24" y="148">見た目や物理が現実と少しずつ違う</text>
<text x="24" y="170" class="tb">→ シミュレーションだけで学ぶと、</text>
<text x="24" y="188" class="tb">　実機でうまく動かないことがある</text>
