<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 860" role="img" aria-labelledby="fig-g-multiclass-t fig-g-multiclass-d">
<title id="fig-g-multiclass-t">多クラス分類：3つ以上の種類から1つを選ぶ3つのやり方</title>
<desc id="fig-g-multiclass-d">困りごと：現実の分類は2択でないことが多い（手書き数字は0から9の10種類）。一方、SVMのように2つに分けるのが基本の手法もある。犬・猫・鳥の3種類に分ける例で、やり方を3つ並べる。やり方A one-vs-rest は、犬かそれ以外か、猫かそれ以外か、鳥かそれ以外か、の3つの2値分類器を作り、判定を見比べて決める。例では犬らしさ0.8、猫らしさ0.3、鳥らしさ0.1で犬に決める。やり方B one-vs-one は、犬対猫、犬対鳥、猫対鳥の組ごとに3つ作り、勝った回数（票）で決める。例では犬が2勝、猫が1勝、鳥が0勝で犬。やり方C ソフトマックス関数は、犬0.7、猫0.2、鳥0.1のように合計1の確率を一度に出し、いちばん大きい犬を選ぶ。2値分類器の数は、one-vs-restは種類の数と同じ、one-vs-oneは組の数でn×(n−1)÷2。3種類ならどちらも3個、10種類ならone-vs-restは10個、one-vs-oneは10×9＝90、90÷2＝45個。犬と猫、猫と犬は同じ組なので2で割る。多クラス分類は1つのデータに1つの種類だけを付ける。複数の種類を付けてよいのはマルチラベル分類で、別の問題。数は説明のための例。</desc>
<text x="12" y="20" class="tb">多クラス分類：3つ以上から1つを選ぶ</text>
<text x="12" y="48" class="tb">① 困りごと</text>
<text x="12" y="68" class="tm">現実の分類は、2択でないことが多い</text>
<text x="12" y="86" class="tm">（手書き数字は 0〜9 の10種類）</text>
<text x="12" y="104" class="tm">でも SVM のように、2つに分けるのが基本の</text>
<text x="12" y="122" class="tm">手法もある → どう3つ以上に広げるか</text>
<line x1="12" y1="136" x2="308" y2="136" class="l sb w1"/>
<text x="12" y="158" class="tb">② 犬・猫・鳥に分ける、3つのやり方</text>
<text x="12" y="184" class="tb ta">A：one-vs-rest（1つ 対 残り）</text>
<text x="12" y="204" class="tm">『○か、それ以外か』を種類ごとに作る → 3個</text>
<rect x="12" y="214" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="58" y="233" class="tb" text-anchor="middle">犬か</text>
<text x="58" y="251" class="tm" text-anchor="middle">それ以外か</text>
<rect x="114" y="214" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="233" class="tb" text-anchor="middle">猫か</text>
<text x="160" y="251" class="tm" text-anchor="middle">それ以外か</text>
<rect x="216" y="214" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="262" y="233" class="tb" text-anchor="middle">鳥か</text>
<text x="262" y="251" class="tm" text-anchor="middle">それ以外か</text>
<text x="58" y="278" class="tb tok" text-anchor="middle">犬らしさ 0.8</text>
<text x="160" y="278" text-anchor="middle">猫らしさ 0.3</text>
<text x="262" y="278" text-anchor="middle">鳥らしさ 0.1</text>
<text x="12" y="302" class="tb tok">→ 3つの判定を見比べて、犬に決める</text>
<text x="12" y="338" class="tb ta">B：one-vs-one（1対1）</text>
<text x="12" y="358" class="tm">2種類の組ごとに作り、勝った数（票）で決める</text>
<rect x="12" y="368" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="58" y="387" class="tb" text-anchor="middle">犬 対 猫</text>
<text x="58" y="405" class="tm" text-anchor="middle">勝ち：犬</text>
<rect x="114" y="368" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="387" class="tb" text-anchor="middle">犬 対 鳥</text>
<text x="160" y="405" class="tm" text-anchor="middle">勝ち：犬</text>
<rect x="216" y="368" width="92" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="262" y="387" class="tb" text-anchor="middle">猫 対 鳥</text>
<text x="262" y="405" class="tm" text-anchor="middle">勝ち：猫</text>
<text x="12" y="436" class="tb tok">→ 票：犬 2・猫 1・鳥 0 なので犬</text>
<text x="12" y="472" class="tb ta">C：ソフトマックス関数</text>
<text x="12" y="492" class="tm">各種類の確率を一度に出す（合計 1）</text>
<text x="40" y="517" text-anchor="middle">犬</text>
<rect x="60" y="504" width="168" height="16" class="fok sok" stroke-width="1.5"/>
<text x="236" y="517" class="tb tok">0.7</text>
<text x="40" y="541" text-anchor="middle">猫</text>
<rect x="60" y="528" width="48" height="16" class="fas sa" stroke-width="1.5"/>
<text x="116" y="541">0.2</text>
<text x="40" y="565" text-anchor="middle">鳥</text>
<rect x="60" y="552" width="24" height="16" class="fas sa" stroke-width="1.5"/>
<text x="92" y="565">0.1</text>
<text x="12" y="592" class="tb tok">→ いちばん大きい犬を選ぶ</text>
<line x1="12" y1="606" x2="308" y2="606" class="l sb w1"/>
<text x="12" y="628" class="tb">③ 2つに分ける分類器は、何個要るか</text>
<text x="200" y="652" class="tm" text-anchor="middle">3種類</text>
<text x="272" y="652" class="tm" text-anchor="middle">10種類</text>
<line x1="12" y1="659" x2="308" y2="659" class="l sb w1"/>
<text x="12" y="678">one-vs-rest</text>
<text x="200" y="678" text-anchor="middle">3個</text>
<text x="272" y="678" text-anchor="middle">10個</text>
<text x="12" y="700">one-vs-one</text>
<text x="200" y="700" text-anchor="middle">3個</text>
<text x="272" y="700" class="tb ta" text-anchor="middle">45個</text>
<text x="12" y="726" class="tm">one-vs-one は組の数＝n×(n−1)÷2</text>
<text x="12" y="744" class="tm">（『犬と猫』と『猫と犬』は同じ組なので ÷2）</text>
<text x="12" y="762" class="tm">10種類なら 10×9＝90、90÷2＝45</text>
<line x1="12" y1="776" x2="308" y2="776" class="l sb w1"/>
<text x="12" y="798" class="tb">④ 混同しやすい</text>
<text x="12" y="818" class="tm">多クラス分類＝1つのデータに1つの種類だけ</text>
<text x="12" y="836" class="tm">海と空のように複数の種類を付けてよいのは、</text>
<text x="12" y="854" class="tm">マルチラベル分類（別の問題）。数は例</text>
</svg>
