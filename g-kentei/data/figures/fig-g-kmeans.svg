<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 472" role="img" aria-labelledby="fig-g-kmeans-t fig-g-kmeans-d">
<title id="fig-g-kmeans-t">k-means 法の繰り返し：割り当てと中心の更新</title>
<desc id="fig-g-kmeans-d">k が3の例を4コマで示す。1コマ目は、点をばらまいて初期の中心を3つ置く。2コマ目は、各点を最も近い中心のグループに分ける。3コマ目は、各グループの点の平均の位置へ中心を動かす（動く前の位置は点線で残す）。4コマ目は、動いた中心で点を割り当て直す。この2つの手順を、割り当てが変わらなくなるまで繰り返す。k は事前に決める必要があり、最初の中心の置き方で結果が変わる。</desc>
