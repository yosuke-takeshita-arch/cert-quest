<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 706" role="img" aria-labelledby="fig-g-pcm-t fig-g-pcm-d">
<title id="fig-g-pcm-t">A-D 変換（PCM）：標本化 → 量子化 → 符号化</title>
<desc id="fig-g-pcm-d">音の波形をデジタルにする3つの手順。標本化は、一定の時間間隔で波の値を取り出す（時間を飛び飛びにする）。量子化は、取り出した値を最も近い段階（例は8段階）に丸める（値を飛び飛びにする）。符号化は、各段階を2進数（例は3ビット）にする。標本化の間隔が粗いと高い音が失われる。1周期の波をとらえるには最低2つの標本が要るので、記録できる最も高い周波数は標本化周波数の半分（ナイキスト周波数）。例は12,000 Hz なら6,000 Hz まで。標本が1周期に2つ未満だと、速い波が別のゆっくりした波に見えてしまう。</desc>
<text x="12" y="20" class="tb">① 標本化：一定の間隔で値を取る</text>
<text x="12" y="40" class="tm">→ 時間を飛び飛びにする</text>
