<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 572" role="img" aria-labelledby="fig-g-ensemble-diversity-t fig-g-ensemble-diversity-d">
<title id="fig-g-ensemble-diversity-t">似たモデルを集めても、誤りは減らない（アンサンブルの多様性）</title>
<desc id="fig-g-ensemble-diversity-d">3つのモデルは、どれも10問中7問に正解する（○が正解、×が誤り）。いちばん下の行は3つの多数決。①似たモデルは、3つとも同じ問8・問9・問10で間違えるので、多数決も問8・問9・問10で外れ、10問中7問（70％）しか当たらない。誤りが同じ向きにそろい、1つのモデルと変わらない。②ばらばらなモデルは、モデル1が問1・2・3、モデル2が問3・4・5、モデル3が問6・7・8で間違える。1つのモデルだけの誤りは、ほかの2つの正解で打ち消せるので、多数決は10問中9問（90％）当たる。外れたのは、2つのモデルが同じ問3で間違えた所だけ。誤りの文『組み合わせるモデルどうしの予測が似ているほど、アンサンブルの効果は大きくなる』は逆で、予測がばらばらなほど誤りが打ち消し合う。互いに無関係に間違えるなら、多数決は平均で約78％当たる（解説の計算）。○×の並びは説明のための例。</desc>
<text x="12" y="22" class="tl">似たモデルを集めても誤りは減らない</text>
