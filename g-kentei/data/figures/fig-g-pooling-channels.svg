<rect x="208" y="434" width="32" height="32" class="fs sm" stroke-width="1"/>
<line x1="112" y1="462" x2="190" y2="462" class="l sm w1"/>
<polyline points="185,458 190,462 185,466" class="l sm w1"/>
<text x="151" y="454" class="tm" text-anchor="middle">プーリング</text>
<text x="60" y="516" class="tb" text-anchor="middle">8×8×16</text>
<text x="232" y="516" class="tb" text-anchor="middle">4×4×16</text>
<text x="12" y="538" class="tm">（縦×横×チャネル。重ねた面は16枚の略）</text>
<text x="12" y="562" class="tb tok">縦と横は半分。チャネルは16のまま</text>
<text x="12" y="582" class="tm">PyTorch：(N, C, H, W) → (N, C, Hout, Wout)</text>
<line x1="12" y1="598" x2="308" y2="598" class="l sb w1"/>
<text x="12" y="622" class="tb tng">誤りの文：『チャネルをまとめるので減る』</text>
<text x="12" y="642">チャネル数を変えるのは 1×1 の畳み込みなど</text>
</svg>
