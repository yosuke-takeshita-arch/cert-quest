<text x="48" y="133" class="ta" text-anchor="middle">3</text>
<text x="72" y="133" class="ta" text-anchor="middle">2</text>
<text x="96" y="133" class="ta" text-anchor="middle">0</text>
<text x="24" y="157" class="ta" text-anchor="middle">4</text>
<text x="48" y="157" class="ta" text-anchor="middle">2</text>
<text x="72" y="157" class="ta" text-anchor="middle">1</text>
<text x="96" y="157" class="ta" text-anchor="middle">5</text>
<text x="24" y="181" class="ta" text-anchor="middle">0</text>
<text x="48" y="181" class="ta" text-anchor="middle">1</text>
<text x="72" y="181" class="ta" text-anchor="middle">6</text>
<text x="96" y="181" class="ta" text-anchor="middle">2</text>
<text x="24" y="205" class="ta" text-anchor="middle">2</text>
<text x="48" y="205" class="ta" text-anchor="middle">7</text>
<text x="72" y="205" class="ta" text-anchor="middle">3</text>
<text x="96" y="205" class="ta" text-anchor="middle">1</text>
<line x1="124" y1="164" x2="186" y2="164" class="l sm w1"/>
<polyline points="181,160 186,164 181,168" class="l sm w1"/>
<text x="155" y="156" class="tm" text-anchor="middle">窓の最大</text>
<rect x="200" y="140" width="48" height="48" class="fas sa" stroke-width="1"/>
<line x1="224" y1="140" x2="224" y2="188" class="l sa w1"/>
<line x1="200" y1="164" x2="248" y2="164" class="l sa w1"/>
<text x="212" y="157" class="tb ta" text-anchor="middle">4</text>
<text x="236" y="157" class="tb ta" text-anchor="middle">5</text>
<text x="212" y="181" class="tb ta" text-anchor="middle">7</text>
<text x="236" y="181" class="tb ta" text-anchor="middle">6</text>
<text x="12" y="236" class="tb twn">チャネル2</text>
<rect x="12" y="244" width="96" height="96" class="fwn swn" stroke-width="1"/>
<line x1="36" y1="244" x2="36" y2="340" class="l swn w1"/>
<line x1="12" y1="268" x2="108" y2="268" class="l swn w1"/>
<line x1="60" y1="244" x2="60" y2="340" class="l swn w2"/>
<line x1="12" y1="292" x2="108" y2="292" class="l swn w2"/>
<line x1="84" y1="244" x2="84" y2="340" class="l swn w1"/>
<line x1="12" y1="316" x2="108" y2="316" class="l swn w1"/>
<text x="24" y="261" class="twn" text-anchor="middle">5</text>
<text x="48" y="261" class="twn" text-anchor="middle">0</text>
