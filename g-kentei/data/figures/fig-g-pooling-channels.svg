<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 656" role="img" aria-labelledby="fig-g-pooling-channels-t fig-g-pooling-channels-d">
<title id="fig-g-pooling-channels-t">プーリングはチャネルごとに縮め、チャネル数は変わらない</title>
<desc id="fig-g-pooling-channels-d">チャネルは、特徴の種類ごとの面（1枚ずつ）。①2×2 の窓・ストライド2 の最大値プーリングを、チャネルごとに別々に行う。チャネル1の4×4（1行目 1、3、2、0、2行目 4、2、1、5、3行目 0、1、6、2、4行目 2、7、3、1）は、窓ごとの最大で2×2（4、5／7、6）になる。チャネル2の4×4（1行目 5、0、1、1、2行目 2、1、0、3、3行目 1、8、2、2、4行目 0、4、9、0）は、2×2（5、3／8、9）になる。太い線が窓の区切りで、チャネル1と2の値は混ぜない。②全体で見ると、例えば縦8×横8×チャネル16 の特徴マップは、縦4×横4×チャネル16 になる。縦と横は半分で、チャネルは16のまま。PyTorch の MaxPool2d も、入力 (N, C, H, W) に対して出力 (N, C, Hout, Wout) で、チャネル数 C は変わらない。誤りの文『複数のチャネルの値をまとめて1つにするので、出力のチャネル数は入力のチャネル数より少なくなる』は誤り。チャネル数を変えるのは 1×1 の畳み込みなど。数は説明のための例。</desc>
<text x="12" y="22" class="tl">プーリングでチャネル数は変わらない</text>
<text x="12" y="42" class="tm">チャネル＝特徴の種類ごとの面（1枚ずつ）</text>
<text x="12" y="68" class="tb">①チャネルごとに別々に縮める</text>
<text x="12" y="86" class="tm">2×2 の窓・ストライド2 の最大値プーリング</text>
<text x="12" y="108" class="tb ta">チャネル1</text>
<rect x="12" y="116" width="96" height="96" class="fas sa" stroke-width="1"/>
<line x1="36" y1="116" x2="36" y2="212" class="l sa w1"/>
<line x1="12" y1="140" x2="108" y2="140" class="l sa w1"/>
