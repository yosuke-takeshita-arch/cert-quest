<text x="72" y="333" class="twn" text-anchor="middle">9</text>
<text x="96" y="333" class="twn" text-anchor="middle">0</text>
<line x1="124" y1="292" x2="186" y2="292" class="l sm w1"/>
<polyline points="181,288 186,292 181,296" class="l sm w1"/>
<text x="155" y="284" class="tm" text-anchor="middle">窓の最大</text>
<rect x="200" y="268" width="48" height="48" class="fwn swn" stroke-width="1"/>
<line x1="224" y1="268" x2="224" y2="316" class="l swn w1"/>
<line x1="200" y1="292" x2="248" y2="292" class="l swn w1"/>
<text x="212" y="285" class="tb twn" text-anchor="middle">5</text>
<text x="236" y="285" class="tb twn" text-anchor="middle">3</text>
<text x="212" y="309" class="tb twn" text-anchor="middle">8</text>
<text x="236" y="309" class="tb twn" text-anchor="middle">9</text>
<text x="12" y="362" class="tm">太い線が窓の区切り。チャネル1と2は混ぜない</text>
<line x1="12" y1="376" x2="308" y2="376" class="l sb w1"/>
<text x="12" y="400" class="tb">②全体で見ると（例：16チャネル）</text>
<rect x="36" y="430" width="64" height="64" class="fs sm" stroke-width="1"/>
<rect x="28" y="422" width="64" height="64" class="fs sm" stroke-width="1"/>
<rect x="20" y="414" width="64" height="64" class="fs sm" stroke-width="1"/>
<rect x="220" y="446" width="32" height="32" class="fs sm" stroke-width="1"/>
