<text x="59" y="174" class="tb" text-anchor="middle">1</text>
<circle cx="88" cy="152" r="6" class="fs sa" stroke-width="2.5"/>
<text x="88" y="174" class="tb" text-anchor="middle">2</text>
<circle cx="146" cy="152" r="6" class="fs swn" stroke-width="2.5"/>
<text x="146" y="174" class="tb" text-anchor="middle">4</text>
<circle cx="291" cy="152" r="6" class="fs swn" stroke-width="2.5"/>
<text x="291" y="174" class="tb" text-anchor="middle">9</text>
<polyline points="88,184 88,192 146,192 146,184" class="l w2"/>
<text x="117" y="187" class="tb ta" text-anchor="middle">2</text>
<text x="24" y="218">いちばん近い2点（2と4）：4−2＝<tspan class="tb ta">2</tspan></text>
<text x="12" y="258" class="tb">② 最長距離法（完全連結法）</text>
<rect x="12" y="268" width="296" height="108" class="sb" stroke-width="1" rx="6"/>
<line x1="38.7" y1="298" x2="308.4" y2="298" class="l sm w1"/>
<line x1="59" y1="295" x2="59" y2="301" class="l sm w1"/>
