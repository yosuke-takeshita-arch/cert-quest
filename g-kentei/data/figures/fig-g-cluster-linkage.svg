<line x1="291" y1="727" x2="291" y2="733" class="l sm w1"/>
<circle cx="59" cy="730" r="6" class="fs sa" stroke-width="2.5"/>
<text x="59" y="752" class="tb" text-anchor="middle">1</text>
<circle cx="88" cy="730" r="6" class="fs sa" stroke-width="2.5"/>
<text x="88" y="752" class="tb" text-anchor="middle">2</text>
<circle cx="146" cy="730" r="6" class="fs swn" stroke-width="2.5"/>
<text x="146" y="752" class="tb" text-anchor="middle">4</text>
<circle cx="291" cy="730" r="6" class="fs swn" stroke-width="2.5"/>
<text x="291" y="752" class="tb" text-anchor="middle">9</text>
<polygon points="73.5,701 80.5,708 73.5,715 66.5,708" class="ft sa" stroke-width="2"/>
<polygon points="218.5,701 225.5,708 218.5,715 211.5,708" class="ft swn" stroke-width="2"/>
<text x="85.5" y="713" class="tm">1.5</text>
<text x="230.5" y="713" class="tm">6.5</text>
<text x="24" y="778">{1,2}：中心1.5、差は0.5と0.5</text>
<text x="24" y="798">　0.5²＋0.5²＝0.25＋0.25＝0.5</text>
<text x="24" y="822">{4,9}：中心6.5、差は2.5と2.5</text>
<text x="24" y="842">　2.5²＋2.5²＝6.25＋6.25＝12.5</text>
<text x="24" y="866">まとめると：中心4、差は3・2・0・5</text>
<text x="24" y="886">　9＋4＋0＋25＝38</text>
<text x="24" y="912" class="tb">増え方＝38−(0.5＋12.5)＝38−13＝<tspan class="ta">25</tspan></text>
<text x="24" y="936" class="tm">◆＝中心。増え方が小さい組から</text>
<text x="24" y="954" class="tm">まとめる（距離ではなく、ばらつき）</text>
<text x="12" y="990" class="tb">同じ2つでも 2・8・5 と値が違う</text>
<text x="12" y="1010">→ どの組を先にまとめるかが変わり、</text>
<text x="12" y="1030">　できるまとまりも変わる</text>
<text x="12" y="1054">最短距離法：大きさが偏りやすい</text>
<text x="12" y="1074">ウォード法：大きさがそろいやすい</text>
<text x="12" y="1092" class="tm">（scikit-learn の説明による）</text>
<line x1="12" y1="1106" x2="308" y2="1106" class="l sb w1"/>
<text x="12" y="1134" class="tb">⑤ 階層的と非階層的（同じ 1・2・4・9）</text>
<text x="12" y="1158">階層的：近い組から順にまとめ、木になる</text>
