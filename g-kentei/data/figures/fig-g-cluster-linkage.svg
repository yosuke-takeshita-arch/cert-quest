<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1588" role="img" aria-labelledby="fig-g-cluster-linkage-t fig-g-cluster-linkage-d">
<title id="fig-g-cluster-linkage-t">クラスタどうしの距離の測り方（最短距離法・最長距離法・群平均法・ウォード法）と、階層的・非階層的の違い</title>
<desc id="fig-g-cluster-linkage-d">階層的クラスタリングで、2つのクラスタがどれだけ近いかを決める測り方を、数直線上のクラスタ{1,2}（青）と{4,9}（茶）で比べる。最短距離法（単連結法）は最も近い2点2と4の距離で、4−2＝2。最長距離法（完全連結法）は最も遠い2点1と9の距離で、9−1＝8。群平均法は、2つのクラスタから1つずつ選んだ全部の組（1と4、1と9、2と4、2と9）の距離3・8・2・7の平均で、20÷4＝5。ウォード法は距離ではなく、まとめたときのばらつき（各点と中心との差の2乗の和）の増え方で比べる。{1,2}は中心1.5でばらつき0.5、{4,9}は中心6.5でばらつき12.5、まとめた{1,2,4,9}は中心4でばらつき9＋4＋0＋25＝38なので、増え方は38−13＝25。どの方法も、全部の組でこの値を出し、いちばん小さい組から順にまとめる。同じ2つでも値が違うので、まとめる順と結果が変わる。scikit-learn の説明では、最短距離法は大きさが偏りやすく、ウォード法は大きさがそろいやすい。下の段は、同じ1・2・4・9を2通りで分けた例。階層的（最短距離法）では、1と2を距離1で、{1,2}と4を距離2で、残りと9を距離5でまとめ、木（デンドログラム）になる。高さ2と5の間で切ると{1,2,4}と{9}の2つになる。非階層的なk-means法では、k＝2と先に決め、最初の中心を1と9に置くと、{1,2,4}（中心約2.3）と{9}に直接分かれ、木は作らない。</desc>
<text x="12" y="20" class="tb">クラスタどうしの距離の測り方</text>
<text x="12" y="42" class="tm">例：クラスタ {1,2}（青）と {4,9}（茶）</text>
<text x="12" y="62" class="tm">数＝2つのクラスタの離れ具合</text>
<text x="12" y="82" class="tm">（小さいほど近い＝先にまとめる）</text>
<text x="12" y="112" class="tb">① 最短距離法（単連結法）</text>
<rect x="12" y="122" width="296" height="108" class="sb" stroke-width="1" rx="6"/>
<line x1="38.7" y1="152" x2="308.4" y2="152" class="l sm w1"/>
