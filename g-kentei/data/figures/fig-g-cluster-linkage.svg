<text x="59" y="1324" class="tb" text-anchor="middle">1</text>
<circle cx="88" cy="1304" r="5" class="fs sok" stroke-width="2.5"/>
<text x="88" y="1324" class="tb" text-anchor="middle">2</text>
<circle cx="146" cy="1304" r="5" class="fs sok" stroke-width="2.5"/>
<text x="146" y="1324" class="tb" text-anchor="middle">4</text>
<circle cx="291" cy="1304" r="5" class="fs swn" stroke-width="2.5"/>
<text x="291" y="1324" class="tb" text-anchor="middle">9</text>
<text x="24" y="1346" class="tm">数＝まとめたときの距離（最短距離法）</text>
<text x="12" y="1376">→ 切ると {1,2,4}（緑）と {9}（茶）</text>
<text x="12" y="1396" class="tm">切る高さで、数を後から選べる</text>
<text x="12" y="1426">非階層的（k-means 法）：数を先に決め、</text>
<text x="12" y="1446">木を作らずに直接分ける</text>
