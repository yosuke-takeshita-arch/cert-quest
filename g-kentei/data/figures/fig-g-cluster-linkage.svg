<line x1="291" y1="441" x2="291" y2="447" class="l sm w1"/>
<circle cx="59" cy="444" r="6" class="fs sa" stroke-width="2.5"/>
<text x="59" y="466" class="tb" text-anchor="middle">1</text>
<circle cx="88" cy="444" r="6" class="fs sa" stroke-width="2.5"/>
<text x="88" y="466" class="tb" text-anchor="middle">2</text>
<circle cx="146" cy="444" r="6" class="fs swn" stroke-width="2.5"/>
<text x="146" y="466" class="tb" text-anchor="middle">4</text>
<circle cx="291" cy="444" r="6" class="fs swn" stroke-width="2.5"/>
<text x="291" y="466" class="tb" text-anchor="middle">9</text>
<polyline points="88,472 88,480 146,480 146,472" class="l w2"/>
<text x="153" y="485" class="tb ta">2</text>
<polyline points="59,490 59,498 146,498 146,490" class="l w2"/>
<text x="153" y="503" class="tb ta">3</text>
<polyline points="88,508 88,516 291,516 291,508" class="l w2"/>
<text x="298" y="521" class="tb ta">7</text>
<polyline points="59,526 59,534 291,534 291,526" class="l w2"/>
<text x="298" y="539" class="tb ta">8</text>
<text x="24" y="556">1つずつ選んだ全部の組（4本）の距離</text>
<text x="24" y="576">3・8・2・7 を平均する</text>
<text x="24" y="598">(3＋8＋2＋7)÷4＝20÷4＝<tspan class="ta">5</tspan></text>
<text x="12" y="638" class="tb">④ ウォード法</text>
<rect x="12" y="648" width="296" height="312" class="sb" stroke-width="1" rx="6"/>
<text x="24" y="670" class="tm">ばらつき＝各点と中心（平均）の</text>
<text x="24" y="690" class="tm">差を2乗して足した値</text>
<line x1="38.7" y1="730" x2="308.4" y2="730" class="l sm w1"/>
<line x1="59" y1="727" x2="59" y2="733" class="l sm w1"/>
<line x1="88" y1="727" x2="88" y2="733" class="l sm w1"/>
<line x1="117" y1="727" x2="117" y2="733" class="l sm w1"/>
<line x1="146" y1="727" x2="146" y2="733" class="l sm w1"/>
<line x1="175" y1="727" x2="175" y2="733" class="l sm w1"/>
<line x1="204" y1="727" x2="204" y2="733" class="l sm w1"/>
<line x1="233" y1="727" x2="233" y2="733" class="l sm w1"/>
