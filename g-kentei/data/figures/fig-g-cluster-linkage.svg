<line x1="204" y1="295" x2="204" y2="301" class="l sm w1"/>
<line x1="233" y1="295" x2="233" y2="301" class="l sm w1"/>
<line x1="262" y1="295" x2="262" y2="301" class="l sm w1"/>
<line x1="291" y1="295" x2="291" y2="301" class="l sm w1"/>
<circle cx="59" cy="298" r="6" class="fs sa" stroke-width="2.5"/>
<text x="59" y="320" class="tb" text-anchor="middle">1</text>
<circle cx="88" cy="298" r="6" class="fs sa" stroke-width="2.5"/>
<text x="88" y="320" class="tb" text-anchor="middle">2</text>
<circle cx="146" cy="298" r="6" class="fs swn" stroke-width="2.5"/>
<text x="146" y="320" class="tb" text-anchor="middle">4</text>
<circle cx="291" cy="298" r="6" class="fs swn" stroke-width="2.5"/>
<text x="291" y="320" class="tb" text-anchor="middle">9</text>
<polyline points="59,330 59,338 291,338 291,330" class="l w2"/>
<text x="298" y="343" class="tb ta">8</text>
<text x="24" y="364">いちばん遠い2点（1と9）：9−1＝<tspan class="tb ta">8</tspan></text>
<text x="12" y="404" class="tb">③ 群平均法</text>
<rect x="12" y="414" width="296" height="196" class="sb" stroke-width="1" rx="6"/>
<line x1="38.7" y1="444" x2="308.4" y2="444" class="l sm w1"/>
<line x1="59" y1="441" x2="59" y2="447" class="l sm w1"/>
<line x1="88" y1="441" x2="88" y2="447" class="l sm w1"/>
<line x1="117" y1="441" x2="117" y2="447" class="l sm w1"/>
