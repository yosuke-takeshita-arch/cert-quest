<text x="94" y="1289" class="tb ta">1</text>
<text x="152" y="1269" class="tb ta">2</text>
<text x="283" y="1198" class="tb ta" text-anchor="end">5</text>
<line x1="20" y1="1234" x2="300" y2="1234" class="l sng w2 dsh"/>
<text x="180.8" y="1228" class="tb tng">切る線</text>
