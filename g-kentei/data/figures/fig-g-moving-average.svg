<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 456" role="img" aria-labelledby="fig-g-moving-average-t fig-g-moving-average-d">
<title id="fig-g-moving-average-t">移動平均：短期の変動をならす</title>
<desc id="fig-g-moving-average-d">5日間の売上10、14、12、16、18万円をぎざぎざの折れ線で、直近3日の単純移動平均を滑らかな線で重ねた図。移動平均は、窓をずらしながら直近の値の平均をとり、短期の変動をならして傾向を見やすくする。3日目は(10＋14＋12)÷3＝12、4日目は(14＋12＋16)÷3＝14、5日目は(12＋16＋18)÷3≒15.3。元の値は14から12へ下がる日があるが、移動平均は12、14、15.3と上がり、増える傾向がつかめる。数は説明のための例。</desc>
<text x="12" y="20" class="tb">直近3日の単純移動平均</text>
<rect x="32" y="46" width="266" height="164" class="fs sb" stroke-width="1"/>
<rect x="147" y="50" width="149" height="156" class="fas sa" stroke-width="1.5"/>
<text x="221.5" y="68" class="tb ta" text-anchor="middle">5日目の窓＝3〜5日目</text>
<polyline points="52,184 108.5,142 165,163 221.5,121 278,100" class="l sm w2 dsh"/>
<circle cx="52" cy="184" r="3.6" class="fm"/>
<circle cx="108.5" cy="142" r="3.6" class="fm"/>
<circle cx="165" cy="163" r="3.6" class="fm"/>
<circle cx="221.5" cy="121" r="3.6" class="fm"/>
<circle cx="278" cy="100" r="3.6" class="fm"/>
<polyline points="165,163 221.5,142 278,128" class="l sa w3"/>
<circle cx="165" cy="163" r="3.6" class="fa"/>
<circle cx="221.5" cy="142" r="3.6" class="fa"/>
<circle cx="278" cy="128" r="3.6" class="fa"/>
<text x="52" y="175" class="tm" text-anchor="middle">10</text>
<text x="108.5" y="133" class="tm" text-anchor="middle">14</text>
<text x="165" y="154" class="tm" text-anchor="middle">12</text>
<text x="221.5" y="112" class="tm" text-anchor="middle">16</text>
<text x="278" y="91" class="tm" text-anchor="middle">18</text>
<text x="165" y="185" class="tb ta" text-anchor="middle">12</text>
<text x="221.5" y="164" class="tb ta" text-anchor="middle">14</text>
<text x="278" y="150" class="tb ta" text-anchor="middle">15.3</text>
<text x="12" y="38" class="tm">売上（万円）</text>
<text x="52" y="230" class="tm" text-anchor="middle">1日目</text>
<text x="108.5" y="230" class="tm" text-anchor="middle">2日目</text>
<text x="165" y="230" class="tm" text-anchor="middle">3日目</text>
<text x="221.5" y="230" class="tm" text-anchor="middle">4日目</text>
<text x="278" y="230" class="tm" text-anchor="middle">5日目</text>
<line x1="12" y1="248" x2="308" y2="248" class="l sb w1"/>
<line x1="12" y1="267" x2="42" y2="267" class="l sm w2 dsh"/>
<text x="50" y="272">もとの売上（ぎざぎざ）</text>
<line x1="12" y1="291" x2="42" y2="291" class="l sa w3"/>
<text x="50" y="296">移動平均（ならした線）</text>
<text x="12" y="326" class="tb">3日目：(10＋14＋12)÷3 ＝ 12</text>
<text x="12" y="348" class="tb">4日目：(14＋12＋16)÷3 ＝ 14</text>
<text x="12" y="370" class="tb">5日目：(12＋16＋18)÷3 ≒ 15.3</text>
<line x1="12" y1="388" x2="308" y2="388" class="l sb w1"/>
<text x="12" y="412">元の値は 14 → 12 と下がる日がある</text>
<text x="12" y="432" class="tb ta">移動平均は 12 → 14 → 15.3 と上がる</text>
<text x="12" y="450" class="tm">（数は説明のための例）</text>
</svg>
