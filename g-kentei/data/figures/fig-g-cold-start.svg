<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 808" role="img" aria-labelledby="fig-g-cold-start-t fig-g-cold-start-d">
<title id="fig-g-cold-start-t">コールドスタート問題：新しい利用者の行や新しい商品の列が空なので、協調フィルタリングでは薦められない</title>
<desc id="fig-g-cold-start-d">コールドスタート問題は、履歴が無い新しい利用者や新しい商品に対して、協調フィルタリングがうまく働かない問題。例：本の購入の表（○＝買った）。利用者1は本Aと本B、利用者2は本A・本B・本C、利用者3は本Cを買った。新規さんは何も買っていない。新刊はまだ誰にも買われていない。ふだんは、利用者1と2がAとBを両方買ったので好みが似ているとみなし、2が買ったCを1に薦める。①新規ユーザー問題：新規さんの行は○が0個（赤の行）。だれとも共通に買った本が無いので、誰と好みが似ているか計算できず、何を薦めればよいか決まらない。②新規アイテム問題：新刊の列は○が0個（茶の列）。『この本と一緒に買われた本』の表に載らないので、誰にも薦める候補に乗らない。③和らげ方：履歴ではなく特徴を使うコンテンツベースフィルタリングと併用する。新刊の特徴がミステリーで、新規さんが登録のときに選んだ好みもミステリーなら、特徴が合うので初日から薦められる（ほかの人の購入の表は使わない）。押さえどころ：本人や商品の履歴が溜まれば和らぐが、新しい利用者や商品が入るたびに、また起きる。</desc>
<text x="12" y="20" class="tb">コールドスタート問題：履歴が無いと</text>
<text x="12" y="40" class="tb">協調フィルタリングが働かない</text>
<text x="12" y="62" class="tm">例：本の購入の表（○＝買った）</text>
<text x="119" y="84" class="tb tm" text-anchor="middle">本A</text>
<text x="173" y="84" class="tb tm" text-anchor="middle">本B</text>
<text x="227" y="84" class="tb tm" text-anchor="middle">本C</text>
<text x="281" y="84" class="tb twn" text-anchor="middle">新刊</text>
<text x="20" y="111" class="tb">利用者1</text>
<rect x="92" y="92" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="119" y="111" class="tb ta" text-anchor="middle">○</text>
<rect x="146" y="92" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="173" y="111" class="tb ta" text-anchor="middle">○</text>
<rect x="200" y="92" width="54" height="28" class="fs sb" stroke-width="1"/>
<rect x="254" y="92" width="54" height="28" class="fwn swn" stroke-width="1"/>
<text x="20" y="139" class="tb">利用者2</text>
<rect x="92" y="120" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="119" y="139" class="tb ta" text-anchor="middle">○</text>
<rect x="146" y="120" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="173" y="139" class="tb ta" text-anchor="middle">○</text>
<rect x="200" y="120" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="227" y="139" class="tb ta" text-anchor="middle">○</text>
<rect x="254" y="120" width="54" height="28" class="fwn swn" stroke-width="1"/>
<text x="20" y="167" class="tb">利用者3</text>
<rect x="92" y="148" width="54" height="28" class="fs sb" stroke-width="1"/>
<rect x="146" y="148" width="54" height="28" class="fs sb" stroke-width="1"/>
<rect x="200" y="148" width="54" height="28" class="fs sb" stroke-width="1"/>
<text x="227" y="167" class="tb ta" text-anchor="middle">○</text>
<rect x="254" y="148" width="54" height="28" class="fwn swn" stroke-width="1"/>
<text x="20" y="195" class="tb tng">新規さん</text>
<rect x="92" y="176" width="54" height="28" class="fng sng" stroke-width="1"/>
<rect x="146" y="176" width="54" height="28" class="fng sng" stroke-width="1"/>
<rect x="200" y="176" width="54" height="28" class="fng sng" stroke-width="1"/>
<rect x="254" y="176" width="54" height="28" class="fng sng" stroke-width="1"/>
<text x="12" y="228" class="tm">ふだん：利用者1と2は A・B を両方買った</text>
<text x="12" y="246" class="tm">→ 好みが似ている → 2が買った C を1に薦める</text>
<rect x="12" y="262" width="296" height="128" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="24" y="282" class="tb tng">① 新規ユーザー問題</text>
<text x="24" y="302">新規さんの行は ○ が0個（赤の行）</text>
<text x="24" y="322">→ だれとも共通に買った本が無い</text>
<text x="24" y="342">→ 誰と好みが似ているか計算できない</text>
<text x="24" y="366" class="tb">→ 何を薦めればよいか決まらない</text>
<rect x="12" y="400" width="296" height="128" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="420" class="tb twn">② 新規アイテム問題</text>
<text x="24" y="440">新刊の列は ○ が0個（茶の列）</text>
<text x="24" y="460">→ 『この本と一緒に買われた本』の表に</text>
<text x="24" y="480">　載らない</text>
<text x="24" y="504" class="tb">→ 誰にも薦める候補に乗らない</text>
<line x1="160" y1="534" x2="160" y2="542.4" class="l sm w1"/>
<polygon points="160,548 156.5,542.4 163.5,542.4" class="fm"/>
<rect x="12" y="554" width="296" height="178" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="574" class="tb tok">③ 和らげ方：履歴ではなく特徴を使う</text>
<text x="24" y="594">コンテンツベースフィルタリングと併用する</text>
<rect x="24" y="606" width="124" height="48" class="fs sb" stroke-width="1" rx="6"/>
<text x="86" y="625" class="tm" text-anchor="middle">新刊の特徴</text>
<text x="86" y="645" class="tb" text-anchor="middle">ミステリー</text>
<rect x="172" y="606" width="124" height="48" class="fs sb" stroke-width="1" rx="6"/>
<text x="234" y="625" class="tm" text-anchor="middle">新規さんの好み</text>
<text x="234" y="645" class="tb" text-anchor="middle">ミステリー</text>
<text x="160" y="636" class="tb" text-anchor="middle">＝</text>
<text x="24" y="676" class="tm">（好みは登録のときに選んでもらう）</text>
<text x="24" y="700" class="tb">→ 特徴が合うので、初日から薦められる</text>
<text x="24" y="720" class="tm">（ほかの人の購入の表は使わない）</text>
<text x="12" y="756" class="tb">押さえどころ</text>
<text x="12" y="776">本人や商品の履歴が溜まれば和らぐ。でも</text>
<text x="12" y="794">新しい利用者や商品が入るたびに、また起きる</text>
</svg>
