<text x="248" y="378" class="tm" text-anchor="middle">地図 3×3</text>
<text x="12" y="420" class="tb tng">赤枠（左上）：1×1＋0×0＋0×0＋1×1＝2</text>
<text x="12" y="440" class="tm">　→ 見本にぴったり。大きな数</text>
<text x="12" y="462" class="tb twn">点線（1マス右）：0×1＋0×0＋1×0＋0×1＝0</text>
<text x="12" y="482" class="tm">　→ 似ていない。0</text>
<text x="12" y="506">ずらし続けると、線のある場所に 2 が並ぶ</text>
<text x="12" y="526">地図ができる。同じ見本を全部の場所で</text>
<text x="12" y="546">使い回すので、線がどこにあっても見つかる</text>
<text x="12" y="570" class="tm">逆向きの／［0, 1／1, 0］に重ねると</text>
<text x="12" y="590" class="tm">0×1＋1×0＋1×0＋0×1＝0 → 反応しない</text>
<line x1="12" y1="604" x2="308" y2="604" class="l sb w1"/>
<text x="12" y="628" class="tb">④ うれしいこと</text>
<text x="12" y="648" class="tm">見本は 2×2＝4つの数だけ。画像が大きく</text>
<text x="12" y="668" class="tm">なっても増えない（場所ごとに別の見本を</text>
<text x="12" y="688" class="tm">用意しなくてよい）</text>
<text x="12" y="708" class="tm">見本の数は、人が決めずに学習で決まる。</text>
<text x="12" y="728" class="tm">どんな模様に反応するかは学習しだい</text>
<line x1="12" y1="742" x2="308" y2="742" class="l sb w1"/>
<text x="12" y="766" class="tb">試験で出る語</text>
<text x="12" y="786" class="tm">見本＝フィルタ（カーネル）</text>
<text x="12" y="806" class="tm">掛けて足す計算＝畳み込み演算</text>
<text x="12" y="826" class="tm">できた地図＝特徴マップ</text>
<text x="12" y="846" class="tm">同じフィルタを使い回す＝重み共有</text>
<text x="12" y="868" class="tm">（数は説明のための例）</text>
</svg>
