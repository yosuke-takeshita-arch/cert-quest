<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 884" role="img" aria-labelledby="fig-g-conv-why-t fig-g-conv-why-d">
<title id="fig-g-conv-why-t">畳み込み：小さな模様を、どこにあっても見つける</title>
<desc id="fig-g-conv-why-d">畳み込みが何のためで、なぜ模様が見つかるかを示す図。何をしたいか：画像の中から斜めの線・縦線・角のような小さな模様を、画像のどこにあっても見つけたい。どう考えるか：模様の見本（フィルタ）を1枚だけ作り、画像の上を1マスずつずらしながら重ねる。重なったマスどうしを掛けて足すと、見本に似ている所ほど大きな数になる。例：数は明るさで、1は線がある、0は何もない。4×4の画像に、左上から右下へ斜めに1が並ぶ。見本は2×2の［1, 0／0, 1］で、＼の斜め線。左上に重ねると1×1＋0×0＋0×0＋1×1＝2で、見本にぴったりなので大きな数。1マス右に重ねると0×1＋0×0＋1×0＋0×1＝0で、似ていない。ずらし続けると、3×3の地図の斜めに2が並び、ほかは0になる。同じ見本を全部の場所で使い回すので、線がどこにあっても見つかる。逆向きの／［0, 1／1, 0］に重ねると0×1＋1×0＋1×0＋0×1＝0で反応しない。うれしいこと：見本は2×2＝4つの数だけで、画像が大きくなっても増えない。見本の数は学習で決まり、どんな模様に反応するかは学習しだい。試験で出る語：見本はフィルタ（カーネル）、掛けて足す計算は畳み込み演算、できた地図は特徴マップ、同じフィルタを使い回すことは重み共有。数は説明のための例。</desc>
<text x="12" y="20" class="tb">畳み込み：小さな模様を、どこにあっても見つける</text>
<text x="12" y="48" class="tb">① 何をしたいか</text>
<text x="12" y="68" class="tm">画像の中から、斜めの線・縦線・角のような</text>
<text x="12" y="88" class="tm">小さな模様を、画像のどこにあっても見つけたい</text>
<line x1="12" y1="102" x2="308" y2="102" class="l sb w1"/>
<text x="12" y="126" class="tb">② どう考えるか</text>
<text x="12" y="146" class="tm">模様の見本（フィルタ）を1枚だけ作り、画像の</text>
<text x="12" y="166" class="tm">上を1マスずつずらしながら重ねる。重なった</text>
<text x="12" y="186" class="tm">マスどうしを掛けて足すと、見本に似ている</text>
<text x="12" y="206" class="tm">所ほど大きな数になる</text>
<line x1="12" y1="220" x2="308" y2="220" class="l sb w1"/>
<text x="12" y="244" class="tb">③ 例：＼の斜め線を探す</text>
<text x="12" y="264" class="tm">数は明るさ。1＝線がある、0＝何もない</text>
