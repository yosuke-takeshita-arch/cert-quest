<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 728" role="img" aria-labelledby="fig-g-invariance-t fig-g-invariance-d">
<title id="fig-g-invariance-t">不変性の獲得：最大値プーリングで、模様が少しずれても出力が同じになる</title>
<desc id="fig-g-invariance-d">例は4×4の特徴マップで、9は猫の耳の模様が強く出た所。2×2の区画ごとに最大の値を取る（最大値プーリング）。ほかの値は、右上の区画に1、右下の区画に4、左下の区画に2。①9が左上の区画の右上にあるとき、出力は上の行が9・1、下の行が2・4。②9が左へ1マス動いても同じ区画の中なので、特徴マップは2マス違うのに出力は①と同じ9・1、2・4。③9が右へ1マス動いて隣の区画に入ると、出力は0・9、2・4になり、上の行の2つが変わる。区画の中のどこにあるかを捨て、あるかどうかを残すので、小さなずれに強くなる。畳み込みの出力は模様がずれると一緒にずれ、プーリングがそれを和らげる。位置を捨てるので、画素ごとに答えるセグメンテーションでは縮めた分を戻す。データ拡張はずらした画像で学習して強くする方法、プーリングはしくみ（構造）で強くする方法。</desc>
<text x="12" y="20" class="tb">不変性：少しずれても、出力が同じ</text>
<text x="12" y="42" class="tm">例：特徴マップ 4×4。9＝猫の耳の模様が</text>
<text x="12" y="60" class="tm">強く出た所。2×2 の区画（太線）ごとに</text>
<text x="12" y="78" class="tm">最大の値を取る（最大値プーリング）</text>
<text x="12" y="118" class="tb">① もとの位置（左上の区画の右上）</text>
