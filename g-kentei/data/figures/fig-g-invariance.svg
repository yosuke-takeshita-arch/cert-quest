<line x1="72" y1="262" x2="72" y2="358" class="l sa w2"/>
<line x1="24" y1="310" x2="120" y2="310" class="l sa w2"/>
<line x1="130" y1="310" x2="186" y2="310" class="l sm w1"/>
<polyline points="179.7,313.04 186,310 179.7,306.96" class="l sm w1"/>
<text x="158" y="302" class="tm" text-anchor="middle">最大値</text>
<rect x="196" y="280" width="30" height="30" class="fwn swn" stroke-width="1"/>
