<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 664" role="img" aria-labelledby="fig-g-dropout-t fig-g-dropout-d">
<title id="fig-g-dropout-t">ドロップアウト：学習の1回ごとに、くじで一部のユニットを休ませる</title>
<desc id="fig-g-dropout-d">入力3、隠れ層5（AからE）、出力2の小さなネットワーク。学習の1回目はBとD、2回目はAとE、3回目はCとDが休み、休んだユニットはその回は出力が0で、つながる線も使わない。休むユニットは1回ごとにくじで決まり、毎回ちがう。なぜ過学習が減るかのたとえ：いつも同じエースに頼るチームは、エースが休むと崩れる。毎回くじで誰かが休む練習をすると、全員が自分で働けるようになる。ユニットがメンバーにあたる。特定の相手に頼って訓練データの癖だけを覚えることが起きにくくなり、新しいデータでも崩れにくい、つまり過学習が減る。推論時（予測するとき）は休みなしでAからEの全員を使う。そのぶん出力が大きくなりすぎないよう、各ユニットが出す重みに残す確率pを掛ける（pが0.5なら半分）。これは原論文 Srivastava ら 2014 の方法。</desc>
