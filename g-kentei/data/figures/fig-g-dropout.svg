<text x="12" y="236" class="tm">1回ごとに、くじで半分くらいを休ませる（例）</text>
<text x="12" y="256" class="tm">休んだユニットは、その回は出力 0（線も使わない）</text>
<line x1="12" y1="270" x2="308" y2="270" class="l sb w1"/>
<text x="12" y="294" class="tb">② なぜ過学習が減るか（たとえ）</text>
<rect x="12" y="302" width="296" height="92" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="22" y="322" class="twn">いつも同じエースに頼るチームは、</text>
<text x="22" y="340" class="twn">エースが休むと崩れる</text>
<text x="22" y="364" class="tb twn">毎回くじで誰かが休む練習をすると、</text>
<text x="22" y="382" class="tb twn">全員が自分で働けるようになる</text>
<text x="12" y="416" class="tm">ユニット＝メンバー（A〜E）。特定の相手に</text>
<text x="12" y="434" class="tm">頼って訓練データの癖だけ覚える、が起きにくい</text>
<text x="12" y="456" class="tb tok">→ 新しいデータでも崩れにくい＝過学習が減る</text>
<line x1="12" y1="470" x2="308" y2="470" class="l sb w1"/>
