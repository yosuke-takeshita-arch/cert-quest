<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 554" role="img" aria-labelledby="fig-g-q-sarsa-td-t fig-g-q-sarsa-td-d">
<title id="fig-g-q-sarsa-td-t">TD 学習の更新と、Q 学習・SARSA の違い</title>
<desc id="fig-g-q-sarsa-td-d">上はTD学習の更新。いまの価値の見積もり4に対し、目標は報酬1と割り引いた次の状態の価値の見積もりの和で8.2。その差4.2がTD誤差で、学習率0.5を掛けた分だけ目標側へ動き、更新後は6.1になる。下は、Q学習とSARSAの違い。次の状態に3つの行動があり、行動価値が2、5、3。Q学習は実際に選んだ行動に関係なく最大の5を使う（方策オフ）。SARSAは実際に選んだ行動（ε-greedyで選ばれた3の枝）の値を使う（方策オン）。</desc>
<text x="12" y="20" class="tb">① TD(0)：目標のほうへ少しだけ近づく</text>
<text x="300" y="44" class="tb tok" text-anchor="end">目標 8.2</text>
<line x1="251.4" y1="50" x2="251.4" y2="84" class="l sok w1 dot"/>
<line x1="138" y1="66" x2="251.4" y2="66" class="l sm w1"/>
<line x1="138" y1="61" x2="138" y2="71" class="l sm w1"/>
<line x1="251.4" y1="61" x2="251.4" y2="71" class="l sm w1"/>
<text x="194.7" y="58" class="tb" text-anchor="middle">TD誤差 4.2</text>
<line x1="24" y1="92" x2="304" y2="92" class="l sm w1"/>
<line x1="30" y1="88" x2="30" y2="96" class="l sm w1"/>
<line x1="165" y1="88" x2="165" y2="96" class="l sm w1"/>
<line x1="300" y1="88" x2="300" y2="96" class="l sm w1"/>
<polygon points="251.4,83 259.4,92 251.4,101 243.4,92" class="fok sok" stroke-width="2"/>
<line x1="146" y1="92" x2="180.3" y2="92" class="l sa w2"/>
<polygon points="186.7,92 180.3,96 180.3,88" class="fa"/>
<circle cx="138" cy="92" r="7" class="fm sm"/>
<circle cx="194.7" cy="92" r="7" class="fa sa"/>
<text x="138" y="120" class="tm" text-anchor="middle">いま 4</text>
<text x="200.7" y="120" class="tb ta" text-anchor="middle">更新後 6.1</text>
<text x="12" y="148">目標 ＝ 報酬 1 ＋ 0.9 × 次の見積もり 8</text>
<text x="12" y="168" class="tb">更新後 ＝ 4 ＋ 0.5 × 4.2 ＝ 6.1</text>
<text x="12" y="188" class="tm">（α＝0.5：誤差の半分だけ動く）</text>
<line x1="12" y1="216" x2="308" y2="216" class="l sb w1"/>
<text x="12" y="242" class="tb">② 次に使う値の選び方が違う</text>
<text x="12" y="264" class="tm">次の状態 s′ にある3つの行動の価値：</text>
<circle cx="40" cy="342" r="20" class="fs sb" stroke-width="1.5"/>
<text x="40" y="347" class="tb" text-anchor="middle">s′</text>
<line x1="60" y1="330.5" x2="150" y2="296" class="l sm w1"/>
<text x="98" y="294" class="tm" text-anchor="middle">行動1</text>
<rect x="150" y="279" width="62" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="181" y="301" class="tb" text-anchor="middle">Q＝2</text>
<line x1="60" y1="342" x2="150" y2="342" class="l sm w1"/>
<text x="98" y="338" class="tm" text-anchor="middle">行動2</text>
<rect x="150" y="325" width="62" height="34" class="fas sa" stroke-width="3" rx="6"/>
<text x="181" y="347" class="tb" text-anchor="middle">Q＝5</text>
<line x1="60" y1="353.5" x2="150" y2="388" class="l sm w1"/>
<text x="98" y="404" class="tm" text-anchor="middle">行動3</text>
<rect x="150" y="371" width="62" height="34" class="fwn swn" stroke-width="3" rx="6"/>
<text x="181" y="393" class="tb" text-anchor="middle">Q＝3</text>
<text x="222" y="337" class="tb ta">Q学習</text>
<text x="222" y="355" class="ta">最大の値</text>
<text x="222" y="383" class="tb twn">SARSA</text>
<text x="222" y="401" class="twn">選んだ行動</text>
<text x="12" y="438" class="tm">行動3は、ε-greedy で実際に選ばれた</text>
<line x1="12" y1="452" x2="308" y2="452" class="l sb w1"/>
<text x="12" y="476">Q学習：実際に選んだ行動と関係なく、</text>
<text x="12" y="496" class="tb ta">　最大の 5 を使う → 方策オフ型</text>
<text x="12" y="522">SARSA：実際に選んだ行動の 3 を使う</text>
<text x="12" y="542" class="tb twn">　→ 方策オン型</text>
</svg>
