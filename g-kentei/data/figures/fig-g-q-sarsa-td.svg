<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 944" role="img" aria-labelledby="fig-g-q-sarsa-td-t fig-g-q-sarsa-td-d">
<title id="fig-g-q-sarsa-td-t">Q学習の見積もりの直し方と、SARSA との違い（3つの部屋の例）</title>
<desc id="fig-g-q-sarsa-td-d">例：ロボットが部屋A・部屋B・部屋Cを右へ左へ動き、ゴールの部屋Cに着くと報酬10、それ以外は報酬0。Q表は部屋と行動の組ごとに「この部屋でこの行動をとると、この先どれくらい得をするか」の見積もりを持つ。例の数は、部屋Aで右へが4、左へが0、部屋Bで右へが8（青）、左へが2（茶）。①はQ学習で1歩分の見積もりを直す様子。部屋Aで右へ動いて部屋Bに着き、報酬は0。目標は報酬0に、割引率0.9を掛けた部屋Bでいちばん大きいQ値8を足した7.2。いまの見積もり4との差3.2がTD誤差で、学習率0.5を掛けた分だけ目標へ近づけ、更新後は5.6になる。記号は、s′が次の状態（例では部屋B）、γが割引率、αが学習率。②は次の部屋の値の選び方の違い。Q学習は実際に選んだ行動と関係なく部屋Bでいちばん大きい8（青）を使い、更新後5.6。SARSAはε-greedyで実際に選んだ左への2（茶）を使い、目標1.8、更新後2.9。Q学習は方策オフ型、SARSAは方策オン型。</desc>
<text x="12" y="20" class="tb">例：ロボットが3つの部屋を動く</text>
<rect x="12" y="34" width="72" height="40" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="48" y="59" class="tb" text-anchor="middle">部屋A</text>
<rect x="124" y="34" width="72" height="40" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="59" class="tb" text-anchor="middle">部屋B</text>
<rect x="236" y="34" width="72" height="40" class="fok sok" stroke-width="2" rx="6"/>
<text x="272" y="59" class="tb" text-anchor="middle">部屋C</text>
<line x1="86" y1="60" x2="114" y2="60" class="l w1"/>
<polygon points="121,60 114,56 114,64" class="ft"/>
<text x="104" y="51" class="tm" text-anchor="middle">右へ</text>
<line x1="198" y1="60" x2="226" y2="60" class="l w1"/>
<polygon points="233,60 226,56 226,64" class="ft"/>
<text x="216" y="51" class="tm" text-anchor="middle">右へ</text>
<text x="272" y="92" class="tb tok" text-anchor="middle">ゴール</text>
<text x="12" y="112" class="tm">部屋Cに着くと報酬10、ほかは報酬0</text>
<text x="12" y="140" class="tb">Q表（部屋×行動ごとの見積もり）</text>
<text x="12" y="160">Q値＝その部屋でその行動をとると、</text>
<text x="12" y="178">この先どれくらい得をするかの見積もり</text>
<rect x="12" y="190" width="296" height="30" class="fbg sb" stroke-width="1"/>
<text x="60" y="210" class="tm" text-anchor="middle">部屋</text>
<text x="158" y="210" class="tb" text-anchor="middle">右へ</text>
<text x="258" y="210" class="tb" text-anchor="middle">左へ</text>
<rect x="12" y="220" width="296" height="34" class="fs sb" stroke-width="1"/>
<text x="60" y="242" class="tb" text-anchor="middle">部屋A</text>
<rect x="116" y="224" width="84" height="26" class="fs sm" stroke-width="2" rx="4"/>
<text x="158" y="242" class="tb" text-anchor="middle">4（直す）</text>
<text x="258" y="242" class="tm" text-anchor="middle">0</text>
<rect x="12" y="254" width="296" height="34" class="fs sb" stroke-width="1"/>
<text x="60" y="276" class="tb" text-anchor="middle">部屋B</text>
<rect x="116" y="258" width="84" height="26" class="fas sa" stroke-width="2.5" rx="4"/>
<text x="158" y="276" class="tb ta" text-anchor="middle">8</text>
<rect x="216" y="258" width="84" height="26" class="fwn swn" stroke-width="2.5" rx="4"/>
<text x="258" y="276" class="tb twn" text-anchor="middle">2</text>
<text x="12" y="308" class="tm">（数は例。学習の途中の見積もり）</text>
<line x1="12" y1="326" x2="308" y2="326" class="l sb w1"/>
<text x="12" y="350" class="tb">① 1歩動いて、見積もりを少し直す</text>
<text x="12" y="372">部屋Aで右へ動き、部屋Bに着いた</text>
<text x="12" y="390" class="tm">（このときの報酬は0）</text>
<text x="12" y="414" class="tb ta">目標 ＝ 報酬0 ＋ 0.9 × 8 ＝ 7.2</text>
<text x="12" y="434" class="ta">8 ＝ 部屋Bでいちばん大きいQ値</text>
<line x1="136" y1="462" x2="225.6" y2="462" class="l sm w1"/>
<line x1="136" y1="457" x2="136" y2="467" class="l sm w1"/>
<line x1="225.6" y1="457" x2="225.6" y2="467" class="l sm w1"/>
<text x="180.8" y="454" class="tb" text-anchor="middle">差 3.2（TD誤差）</text>
<line x1="24" y1="490" x2="304" y2="490" class="l sm w1"/>
<text x="24" y="510" class="tm" text-anchor="middle">0</text>
<text x="304" y="510" class="tm" text-anchor="middle">10</text>
<line x1="24" y1="486" x2="24" y2="494" class="l sm w1"/>
<line x1="304" y1="486" x2="304" y2="494" class="l sm w1"/>
<polygon points="225.6,481 233.6,490 225.6,499 217.6,490" class="fas sa" stroke-width="2"/>
<line x1="144" y1="490" x2="168" y2="490" class="l sa w2"/>
<polygon points="174,490 167,486 167,494" class="fa"/>
<circle cx="136" cy="490" r="7" class="fm sm"/>
<circle cx="180.8" cy="490" r="7" class="fa sa"/>
<text x="130" y="516" class="tm" text-anchor="middle">いま4</text>
<text x="180.8" y="516" class="tb ta" text-anchor="middle">5.6</text>
<text x="236" y="516" class="ta" text-anchor="middle">目標7.2</text>
<text x="12" y="542" class="tb">更新後 ＝ 4 ＋ 0.5 × 3.2 ＝ 5.6</text>
<text x="12" y="560" class="tm">差を全部は埋めず、半分だけ近づける</text>
<text x="12" y="588" class="tb">記号のことば</text>
<text x="12" y="608">s′：次の状態（例では部屋B）</text>
<text x="12" y="626">γ 割引率 0.9：1歩先の得を少し割り引く</text>
<text x="12" y="644">α 学習率 0.5：差のどれだけを動くか</text>
<text x="12" y="662">TD誤差：目標 − いまの見積もり</text>
<line x1="12" y1="680" x2="308" y2="680" class="l sb w1"/>
<text x="12" y="704" class="tb">② 次の部屋の値の選び方が違う</text>
<circle cx="44" cy="760" r="26" class="fs sb" stroke-width="1.5"/>
<text x="44" y="765" class="tb" text-anchor="middle">部屋B</text>
<line x1="70" y1="750" x2="146" y2="736" class="l sm w1"/>
<text x="104" y="732" class="tm" text-anchor="middle">右へ</text>
<rect x="146" y="720" width="64" height="32" class="fas sa" stroke-width="2.5" rx="6"/>
<text x="178" y="741" class="tb ta" text-anchor="middle">Q＝8</text>
<line x1="70" y1="770" x2="146" y2="784" class="l sm w1"/>
<text x="104" y="798" class="tm" text-anchor="middle">左へ</text>
<rect x="146" y="768" width="64" height="32" class="fwn swn" stroke-width="2.5" rx="6"/>
<text x="178" y="789" class="tb twn" text-anchor="middle">Q＝2</text>
<text x="218" y="734" class="tb ta">Q学習</text>
<text x="218" y="752" class="ta">最大を使う</text>
<text x="218" y="782" class="tb twn">SARSA</text>
<text x="218" y="800" class="twn">選んだ方</text>
<text x="12" y="828" class="tm">ε-greedy（ときどき別の行動を試す</text>
<text x="12" y="846" class="tm">選び方）で、実際は左へを選んだ</text>
<text x="12" y="874" class="tb ta">Q学習：目標 7.2 → 更新後 5.6</text>
<text x="12" y="892" class="ta">　実際の行動と関係なく最大 → 方策オフ型</text>
<text x="12" y="912" class="tb twn">SARSA：目標 0＋0.9×2＝1.8 → 2.9</text>
<text x="12" y="932" class="twn">　実際に選んだ行動の値 → 方策オン型</text>
</svg>
