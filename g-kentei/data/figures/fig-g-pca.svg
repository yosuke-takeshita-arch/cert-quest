<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="fig-g-pca-t fig-g-pca-d">
<title id="fig-g-pca-t">主成分分析：ばらつきの大きい方向に軸をとる</title>
<desc id="fig-g-pca-d">斜めに細長く広がった2次元の点の集まり。点が最も広がる方向に第1主成分の軸、それに直交する方向に第2主成分の軸をとる。点を第1主成分の軸の上に落とすと、2次元のデータが1次元になる（次元削減）。第1主成分は、分散が最大の方向である。下に、t-SNE（非線形で近い点の関係を保ち、可視化向き）、MDS（点の間の距離が保たれるよう配置）、SVD（行列を3つの行列の積に分ける）を一行ずつ対比する。</desc>
