<text x="12" y="436">PCA：線形。分散をよく残す</text>
<text x="12" y="456">t-SNE：非線形。近い点の関係を保つ</text>
<text x="12" y="476" class="tm">　　　（主に可視化）</text>
<text x="12" y="498">MDS：点の間の距離を保って配置</text>
<text x="12" y="518">SVD：行列を3つの行列の積に分ける</text>
