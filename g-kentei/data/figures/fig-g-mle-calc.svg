<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 518" role="img" aria-labelledby="fig-g-mle-calc-t fig-g-mle-calc-d">
<title id="fig-g-mle-calc-t">100回中55回表：最尤推定値は0.55</title>
<desc id="fig-g-mle-calc-d">何のための図か：コインを100回投げて表が55回出たとき、表の出る確率pの最尤推定値が0.55になることを見る。尤度は「pがこの値だとしたら、100回中55回表が出る確率」。pを変えて計算すると、p＝0.5で約0.049、p＝0.55で約0.080、p＝0.6で約0.048。0.55のときがいちばん大きく、0.5のときの約1.65倍。グラフ：横軸はp（0.3〜0.8）、縦軸は尤度。曲線は0.55で山になる。いちばん大きくなるpを推定値にするのが最尤推定で、表の出た割合55÷100＝0.55と同じになる。0.5は公平なコインのはずという思い込みの値、0.45は裏の割合。</desc>
<text x="12" y="20" class="tb">最尤推定：100回中55回表なら p は？</text>
<text x="12" y="42" class="tm">この問題の数（100回中55回表）で見る</text>
<line x1="12" y1="54" x2="308" y2="54" class="l sb w1"/>
<text x="12" y="78" class="tb">尤度（ゆうど）＝ p がこの値だとしたら、</text>
<text x="12" y="98" class="tb">100回中55回表が出る確率</text>
<text x="12" y="116" class="tm">p を変えて計算すると（並び方の数も含む）</text>
<text x="24" y="138">p ＝ 0.5</text>
<text x="120" y="138">約 0.049</text>
<text x="24" y="160" class="tb tok">p ＝ 0.55</text>
<text x="120" y="160" class="tb tok">約 0.080（最大）</text>
<text x="24" y="182">p ＝ 0.6</text>
<text x="120" y="182">約 0.048</text>
<text x="12" y="204" class="tm">0.55 は 0.5 の 0.080 ÷ 0.049 ≒ 1.65倍</text>
<line x1="12" y1="216" x2="308" y2="216" class="l sb w1"/>
<text x="12" y="240" class="tb">グラフ：横軸＝p、縦軸＝尤度</text>
<line x1="34" y1="382" x2="296" y2="382" class="l sm w1"/>
<line x1="34" y1="256" x2="34" y2="382" class="l sm w1"/>
<polyline points="34,382 36.6,382 39.2,382 41.9,382 44.5,382 47.1,382 49.7,382 52.3,382 55,382 57.6,382 60.2,382 62.8,382 65.4,381.9 68.1,381.9 70.7,381.8 73.3,381.8 75.9,381.7 78.5,381.5 81.2,381.3 83.8,381.1 86.4,380.8 89,380.3 91.6,379.7 94.3,379 96.9,378 99.5,376.9 102.1,375.4 104.7,373.6 107.4,371.5 110,368.9 112.6,365.9 115.2,362.4 117.8,358.3 120.5,353.8 123.1,348.7 125.7,343.1 128.3,337 130.9,330.5 133.6,323.6 136.2,316.5 138.8,309.3 141.4,302 144,294.9 146.7,288.1 149.3,281.8 151.9,276.2 154.5,271.3 157.1,267.3 159.8,264.4 162.4,262.6 165,262 167.6,262.6 170.2,264.4 172.9,267.4 175.5,271.4 178.1,276.3 180.7,282.1 183.3,288.6 186,295.5 188.6,302.8 191.2,310.3 193.8,317.7 196.4,325 199.1,332.1 201.7,338.7 204.3,344.9 206.9,350.6 209.5,355.7 212.2,360.2 214.8,364.2 217.4,367.6 220,370.5 222.6,373 225.3,375 227.9,376.6 230.5,377.9 233.1,378.9 235.7,379.8 238.4,380.4 241,380.8 243.6,381.2 246.2,381.4 248.8,381.6 251.5,381.7 254.1,381.8 256.7,381.9 259.3,381.9 261.9,382 264.6,382 267.2,382 269.8,382 272.4,382 275,382 277.7,382 280.3,382 282.9,382 285.5,382 288.1,382 290.8,382 293.4,382 296,382" class="l sa w2"/>
<text x="34" y="398" class="tm" text-anchor="middle">0.3</text>
<text x="86.4" y="398" class="tm" text-anchor="middle">0.4</text>
<text x="138.8" y="398" class="tm" text-anchor="middle">0.5</text>
<text x="191.2" y="398" class="tm" text-anchor="middle">0.6</text>
<text x="243.6" y="398" class="tm" text-anchor="middle">0.7</text>
<text x="296" y="398" class="tm" text-anchor="middle">0.8</text>
<line x1="165" y1="262" x2="165" y2="382" class="l sok w1 dsh"/>
<text x="201.2" y="270" class="tb tok">山：p ＝ 0.55</text>
<circle cx="138.8" cy="309.3" r="4" class="fs sa" stroke-width="1.5"/>
<circle cx="191.2" cy="310.3" r="4" class="fs sa" stroke-width="1.5"/>
<text x="12" y="422" class="tb">尤度がいちばん大きい p を推定値にする</text>
<rect x="12" y="430" width="296" height="32" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="450" class="tb tok">表の出た割合 55 ÷ 100 ＝ 0.55 と同じ</text>
<text x="12" y="486" class="tm">0.5：公平なはずという思い込み。データを</text>
<text x="12" y="504" class="tm">　　使っていない。0.45：裏の割合</text>
</svg>
