<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="fig-g-inception-t fig-g-inception-d">
<title id="fig-g-inception-t">Inception モジュール（GoogLeNet）</title>
<desc id="fig-g-inception-d">前の層の出力から、4本の枝を並べて計算し、最後に連結する。1つ目は1×1の畳み込み。2つ目は1×1の畳み込みで減らしてから3×3の畳み込み。3つ目は1×1の畳み込みで減らしてから5×5の畳み込み。4つ目は3×3の最大値プーリングのあとに1×1の畳み込み。1×1の畳み込みでチャネル数を減らし、計算量を抑える。大きさの違う畳み込みを並列に束ねるのが Inception モジュール。</desc>
<text x="12" y="20" class="tb">4本の枝を並べて、最後に連結</text>
<rect x="94" y="36" width="132" height="28" class="fs sb" stroke-width="1.5"/>
<text x="160" y="54.5" class="tb" text-anchor="middle">前の層の出力</text>
<line x1="160" y1="64" x2="43" y2="100" class="l sm w2"/>
<polyline points="48.56,94.26 43,100 50.82,101.62" class="l sm w2"/>
<rect x="12" y="100" width="62" height="30" class="fas sa" stroke-width="1.5"/>
<text x="43" y="119.5" class="tb" text-anchor="middle">1×1</text>
<line x1="43" y1="130" x2="43" y2="146" class="l sm w2"/>
<polyline points="39.15,139 43,146 46.85,139" class="l sm w2"/>
<line x1="43" y1="130" x2="43" y2="230" class="l sm w2"/>
<polyline points="39.15,223 43,230 46.85,223" class="l sm w2"/>
<line x1="160" y1="64" x2="121" y2="100" class="l sm w2"/>
<polyline points="123.53,92.42 121,100 128.76,98.08" class="l sm w2"/>
<rect x="90" y="100" width="62" height="30" class="fok sok" stroke-width="1.5"/>
<text x="121" y="119.5" class="tb" text-anchor="middle">1×1</text>
<line x1="121" y1="130" x2="121" y2="146" class="l sm w2"/>
<polyline points="117.15,139 121,146 124.85,139" class="l sm w2"/>
<rect x="90" y="146" width="62" height="30" class="fas sa" stroke-width="1.5"/>
<text x="121" y="165.5" class="tb" text-anchor="middle">3×3</text>
<line x1="121" y1="176" x2="121" y2="192" class="l sm w2"/>
<polyline points="117.15,185 121,192 124.85,185" class="l sm w2"/>
<line x1="121" y1="176" x2="121" y2="230" class="l sm w2"/>
<polyline points="117.15,223 121,230 124.85,223" class="l sm w2"/>
<line x1="160" y1="64" x2="199" y2="100" class="l sm w2"/>
<polyline points="191.24,98.08 199,100 196.47,92.42" class="l sm w2"/>
<rect x="168" y="100" width="62" height="30" class="fok sok" stroke-width="1.5"/>
<text x="199" y="119.5" class="tb" text-anchor="middle">1×1</text>
<line x1="199" y1="130" x2="199" y2="146" class="l sm w2"/>
<polyline points="195.15,139 199,146 202.85,139" class="l sm w2"/>
<rect x="168" y="146" width="62" height="30" class="fas sa" stroke-width="1.5"/>
<text x="199" y="165.5" class="tb" text-anchor="middle">5×5</text>
<line x1="199" y1="176" x2="199" y2="192" class="l sm w2"/>
<polyline points="195.15,185 199,192 202.85,185" class="l sm w2"/>
<line x1="199" y1="176" x2="199" y2="230" class="l sm w2"/>
<polyline points="195.15,223 199,230 202.85,223" class="l sm w2"/>
<line x1="160" y1="64" x2="277" y2="100" class="l sm w2"/>
<polyline points="269.18,101.62 277,100 271.44,94.26" class="l sm w2"/>
<rect x="246" y="100" width="62" height="56" class="fng sng" stroke-width="1.5"/>
<text x="277" y="114.5" text-anchor="middle">3×3</text>
<text x="277" y="132.5" text-anchor="middle">最大値</text>
<text x="277" y="150.5" text-anchor="middle">プーリング</text>
<line x1="277" y1="156" x2="277" y2="172" class="l sm w2"/>
<polyline points="273.15,165 277,172 280.85,165" class="l sm w2"/>
<rect x="246" y="172" width="62" height="30" class="fas sa" stroke-width="1.5"/>
<text x="277" y="191.5" class="tb" text-anchor="middle">1×1</text>
<line x1="277" y1="202" x2="277" y2="218" class="l sm w2"/>
<polyline points="273.15,211 277,218 280.85,211" class="l sm w2"/>
<line x1="277" y1="202" x2="277" y2="230" class="l sm w2"/>
<polyline points="273.15,223 277,230 280.85,223" class="l sm w2"/>
<rect x="12" y="238" width="296" height="32" class="fok sok" stroke-width="1.5"/>
<text x="160" y="258.5" class="tb" text-anchor="middle">連結（チャネル方向につなぐ）</text>
<line x1="12" y1="292" x2="308" y2="292" class="l sb w1"/>
<text x="12" y="316" class="tb tok">緑の 1×1 は、チャネル数を減らす役</text>
<text x="12" y="338" class="tm">→ 5×5 などの計算量を抑える</text>
<text x="12" y="366" class="tb">大きさの違う畳み込みを並列に束ねる</text>
<text x="12" y="388">＝ Inception モジュール（GoogLeNet、22層）</text>
</svg>
