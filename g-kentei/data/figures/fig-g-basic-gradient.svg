<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" role="img" aria-labelledby="fig-g-basic-gradient-t fig-g-basic-gradient-d">
<title id="fig-g-basic-gradient-t">勾配＝損失の坂の傾き</title>
<desc id="fig-g-basic-gradient-d">折れ線で描いた曲線のグラフ。横軸が重みw（0から4）、縦軸が損失（予測のずれの大きさ、0から9）。例として損失＝(w−1)×(w−1) の谷の形の曲線で、w＝1 のとき損失0がいちばん低い。いまの重み w＝3 では損失4。この点での坂の傾き（勾配）は4で、wを3から3.01へ0.01だけ増やすと損失が4から4.0401へ0.0401増える、0.0401÷0.01＝約4、という意味。勾配が正なのでwを増やすと損失が増える、だからwを減らす。新しい重み＝いまの重み−学習率×勾配で、学習率0.25なら 3−0.25×4＝3−1＝2。w＝2 では損失1になり、4から1へ下がった。これをくり返して谷の底（勾配0）へ近づく。数は説明のための例。</desc>
<text x="12" y="22" class="tl">勾配＝損失の坂の傾き</text>
<text x="12" y="44" class="tm">例：損失＝(w−1)×(w−1)（数は例）</text>
<text x="12" y="72" class="tm">縦：損失（予測のずれの大きさ）</text>
<line x1="40" y1="80" x2="40" y2="250" class="l sm w1"/>
<line x1="40" y1="250" x2="296" y2="250" class="l sm w1"/>
<line x1="36" y1="250" x2="40" y2="250" class="l sm w1"/>
<line x1="36" y1="232" x2="40" y2="232" class="l sm w1"/>
<line x1="36" y1="178" x2="40" y2="178" class="l sm w1"/>
<line x1="36" y1="88" x2="40" y2="88" class="l sm w1"/>
<text x="32" y="254" class="tm" text-anchor="end">0</text>
<text x="32" y="236" class="tm" text-anchor="end">1</text>
<text x="32" y="182" class="tm" text-anchor="end">4</text>
<text x="32" y="92" class="tm" text-anchor="end">9</text>
<text x="40" y="268" class="tm" text-anchor="middle">0</text>
<text x="100" y="268" class="tm" text-anchor="middle">1</text>
<text x="160" y="268" class="tm" text-anchor="middle">2</text>
<text x="220" y="268" class="tm" text-anchor="middle">3</text>
<text x="280" y="268" class="tm" text-anchor="middle">4</text>
<text x="168" y="288" class="tm" text-anchor="middle">横：重み w</text>
<polyline points="40,232 55,240.1 70,245.5 85,248.9 100,250 115,248.9 130,245.5 145,240.1 160,232 175,221.9 190,209.5 205,194.9 220,178 235,158.9 250,137.5 265,113.9 280,88" class="l sm w2"/>
<line x1="180" y1="226" x2="262" y2="127.6" class="l swn w2 dsh"/>
<text x="268" y="128" class="tb twn">坂の</text>
<text x="268" y="146" class="tb twn">傾き4</text>
<circle cx="220" cy="178" r="6" class="fng sng" stroke-width="2"/>
<text x="232" y="196" class="tb tng">いま</text>
<path d="M 212 170 Q 168 172 161 216" class="l sok w2"/>
<polygon points="160,225 156,216 165,217" class="fm"/>
<circle cx="160" cy="232" r="6" class="fok sok" stroke-width="2"/>
<text x="150" y="218" class="tb tok" text-anchor="end">次</text>
<text x="100" y="242" class="tm" text-anchor="middle">底</text>
<line x1="12" y1="306" x2="308" y2="306" class="l sb w1"/>
<text x="12" y="330" class="tb">勾配4の意味（w＝3 の点）</text>
<text x="12" y="352">wを3→3.01（0.01増やす）と</text>
<text x="12" y="372">損失は4→4.0401（0.0401増える）</text>
<text x="12" y="392">0.0401÷0.01＝約<tspan class="tb twn">4</tspan></text>
<text x="12" y="414" class="tm">→ 正なので、増やすと損失が増える</text>
<line x1="12" y1="430" x2="308" y2="430" class="l sb w1"/>
<text x="12" y="454" class="tb">だから坂を下る向き（減らす）へ直す</text>
<text x="12" y="476">新しい重み＝いまの重み−学習率×勾配</text>
<text x="12" y="498">学習率0.25なら 3−0.25×4＝3−1＝<tspan class="tb tok">2</tspan></text>
<text x="12" y="522">損失は 4 → <tspan class="tb tok">1</tspan> に下がった</text>
<text x="12" y="550" class="tb">くり返すと谷の底（勾配0）へ近づく</text>
<text x="12" y="574" class="tm">損失がいちばん小さい重みが見つかる</text>
</svg>
