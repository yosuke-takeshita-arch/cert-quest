<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1096" role="img" aria-labelledby="fig-g-lstm-gru-t fig-g-lstm-gru-d">
<title id="fig-g-lstm-gru-t">LSTM と GRU：ゲート・掛け算・重みの組・CEC の位置</title>
<desc id="fig-g-lstm-gru-d">上の「図の見方」：σ の丸がゲートで0から1の値を出し、× の丸でその値を掛けて通す量を決める。緑の W の札が重みの組で、ゲートと新しい候補が1組ずつ持つ。オレンジの太い線が CEC（セルの状態が次の時刻へ渡る道）。① LSTM：上を横切るオレンジの線がセルの状態 c で、ここが CEC。忘却ゲート（点線。1997年の原論文には無く2000年に追加）が前のセルの中身を残す量を、入力ゲートが候補を書き込む量を、出力ゲートが読み出す量を決める。W は忘却・入力・候補・出力の4組。② GRU：セルは無く、前の状態 h(t−1) と候補を、更新ゲートの割合で混ぜて h(t) を作る。リセットゲートは候補を作るときに前の状態をどれだけ使うかを決める。W はリセット・候補・更新の3組。③ くらべる：ゲートは LSTM 3つ・GRU 2つ、候補はどちらも1つ、重みの組は4つと3つ（PyTorch の実装での数え方）、セルは LSTM だけにある。</desc>
<text x="12" y="20" class="tb">図の見方</text>
<circle cx="24" cy="40" r="12" class="fas sa"/>
<text x="24" y="44.5" class="tb" text-anchor="middle">σ</text>
<text x="46" y="44.5">ゲート：0〜1 を出す（開き具合）</text>
<circle cx="24" cy="68" r="10" class="fs l"/>
<text x="24" y="72.5" class="tb" text-anchor="middle">×</text>
<text x="46" y="72.5">掛け算：ここで通す量が決まる</text>
<rect x="9" y="87" width="30" height="18" rx="4" class="fok sok" stroke-width="1.5"/>
<text x="24" y="100.5" class="tb tok" text-anchor="middle">W</text>
<text x="46" y="100.5">重みの組：学習で決まる数の表</text>
<text x="46" y="118" class="tm">ゲートと候補が1組ずつ持つ</text>
<line x1="10" y1="138" x2="38" y2="138" class="l swn w3"/>
<text x="46" y="142.5" class="twn tb">CEC：セルの状態が次へ渡る道</text>
<line x1="12" y1="158" x2="308" y2="158" class="l sb w1"/>
<text x="12" y="182" class="tb ta">① LSTM（ゲート3つ＋セル）</text>
<text x="16" y="204" class="tm">c(t−1)</text>
<text x="304" y="204" class="tm" text-anchor="end">c(t)</text>
<text x="115" y="202" class="tb twn" text-anchor="middle">ここが CEC</text>
