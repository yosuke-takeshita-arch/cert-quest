<text x="12" y="986">重みの組（W）</text>
<text x="222" y="986" class="tb" text-anchor="middle">4つ</text>
<text x="288" y="986" class="tb" text-anchor="middle">3つ</text>
<line x1="12" y1="994" x2="308" y2="994" class="l sb w1"/>
<text x="12" y="1012">セル（CEC）</text>
<text x="222" y="1012" class="tb" text-anchor="middle">あり</text>
<text x="288" y="1012" class="tb" text-anchor="middle">なし</text>
<line x1="12" y1="1020" x2="308" y2="1020" class="l sb w1"/>
<text x="12" y="1040" class="tm">W の数＝ゲートの数＋候補の1つ</text>
<text x="12" y="1058" class="tm">（PyTorch の実装での数え方）</text>
<text x="12" y="1082" class="tb">GRU のほうが W が1組少なく、軽い</text>
