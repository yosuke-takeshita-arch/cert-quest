<text x="195" y="316.5" text-anchor="middle">tanh</text>
<line x1="186" y1="300" x2="166.5" y2="263.5" class="l w2"/>
<polyline points="173.19,267.86 166.5,263.5 166.4,271.49" class="l w2"/>
<circle cx="250" cy="312" r="12" class="fas sa"/>
<text x="250" y="316.5" class="tb" text-anchor="middle">σ</text>
<line x1="250" y1="300" x2="250" y2="272" class="l w2"/>
<polyline points="253.85,279 250,272 246.15,279" class="l w2"/>
