<line x1="248" y1="714" x2="248" y2="720" class="l w1"/>
<rect x="233" y="720" width="30" height="18" rx="4" class="fok sok" stroke-width="1.5"/>
<text x="248" y="733.5" class="tb tok" text-anchor="middle">W3</text>
<text x="168" y="704" class="tb" text-anchor="middle">候補</text>
<text x="104" y="758" class="tb" text-anchor="middle">リセット</text>
<text x="248" y="758" class="tb" text-anchor="middle">更新</text>
<text x="12" y="780" class="tm">W1〜W3 の3組に、x(t) と h(t−1) が入る</text>
<text x="12" y="804">リセットゲート：候補を作るとき、</text>
