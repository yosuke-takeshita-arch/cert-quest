<text x="70" y="343.5" class="tb tok" text-anchor="middle">W1</text>
<line x1="125" y1="324" x2="125" y2="330" class="l w1"/>
<rect x="110" y="330" width="30" height="18" rx="4" class="fok sok" stroke-width="1.5"/>
<text x="125" y="343.5" class="tb tok" text-anchor="middle">W2</text>
<line x1="195" y1="324" x2="195" y2="330" class="l w1"/>
<rect x="180" y="330" width="30" height="18" rx="4" class="fok sok" stroke-width="1.5"/>
<text x="195" y="343.5" class="tb tok" text-anchor="middle">W3</text>
<line x1="250" y1="324" x2="250" y2="330" class="l w1"/>
<rect x="235" y="330" width="30" height="18" rx="4" class="fok sok" stroke-width="1.5"/>
<text x="250" y="343.5" class="tb tok" text-anchor="middle">W4</text>
<text x="70" y="368" class="tb" text-anchor="middle">忘却</text>
<text x="125" y="368" class="tb" text-anchor="middle">入力</text>
<text x="195" y="368" class="tb" text-anchor="middle">候補</text>
<text x="250" y="368" class="tb" text-anchor="middle">出力</text>
<text x="12" y="390" class="tm">W1〜W4 の4組に、x(t) と h(t−1) が入る</text>
<text x="12" y="412" class="twn">忘却ゲート（点線）は1997年の原論文に</text>
<text x="12" y="430" class="twn">無く、2000年に足された</text>
<text x="12" y="456">入力ゲート：候補をセルに書き込む量</text>
<text x="12" y="476">忘却ゲート：前のセルの中身を残す量</text>
<text x="12" y="496">出力ゲート：セルの中身を読み出す量</text>
<text x="12" y="516" class="tm">候補：書き込む中身（tanh。ゲートではない）</text>
<line x1="12" y1="534" x2="308" y2="534" class="l sb w1"/>
<text x="12" y="558" class="tb tok">② GRU（ゲート2つ・セルなし）</text>
<text x="76" y="586" class="tm">前の状態の道（CEC ではない）</text>
