<text x="70" y="316.5" class="tb" text-anchor="middle">σ</text>
<line x1="70" y1="300" x2="70" y2="226" class="l w2"/>
<polyline points="73.85,233 70,226 66.15,233" class="l w2"/>
<circle cx="125" cy="312" r="12" class="fas sa"/>
<text x="125" y="316.5" class="tb" text-anchor="middle">σ</text>
