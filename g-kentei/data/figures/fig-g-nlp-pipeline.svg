<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 766" role="img" aria-labelledby="fig-g-nlp-pipeline-t fig-g-nlp-pipeline-d">
<title id="fig-g-nlp-pipeline-t">文の解析の段階：形態素 → 構文 → 意味 → 照応・談話</title>
<desc id="fig-g-nlp-pipeline-d">例文は「兄は妹に地図を渡した。彼女はそれを広げた。」。形態素解析は、文を兄・は・妹・に・地図・を・渡し・たに区切り、品詞を付ける。構文解析は、文節の係り受けを求める。兄は、妹に、地図をは、どれも渡したにかかる。意味解析は、述語の渡したに対して、誰が（兄）、誰に（妹）、何を（地図）の役割を付ける。照応解析は、2文目の彼女が妹を、それが地図を指すと決める。談話構造解析は、文と文が理由や対比などのどんな関係でつながるかを求める。ストップワードの除去は、形態素解析のあとの前処理。</desc>
<text x="12" y="20" class="tb">① 形態素解析：区切って、品詞を付ける</text>
<rect x="12" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="29" y="52.5" class="tb" text-anchor="middle">兄</text>
<text x="29" y="82" class="tm" text-anchor="middle">名詞</text>
<rect x="49" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="66" y="52.5" class="tb" text-anchor="middle">は</text>
<text x="66" y="82" class="tm" text-anchor="middle">助詞</text>
<rect x="86" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="103" y="52.5" class="tb" text-anchor="middle">妹</text>
<text x="103" y="82" class="tm" text-anchor="middle">名詞</text>
<rect x="123" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="140" y="52.5" class="tb" text-anchor="middle">に</text>
<text x="140" y="82" class="tm" text-anchor="middle">助詞</text>
<rect x="160" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="177" y="52.5" class="tb" text-anchor="middle">地図</text>
<text x="177" y="82" class="tm" text-anchor="middle">名詞</text>
<rect x="197" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="214" y="52.5" class="tb" text-anchor="middle">を</text>
<text x="214" y="82" class="tm" text-anchor="middle">助詞</text>
<rect x="234" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="251" y="52.5" class="tb" text-anchor="middle">渡し</text>
<text x="251" y="82" class="tm" text-anchor="middle">動詞</text>
<rect x="271" y="34" width="34" height="28" class="fs sb" stroke-width="1.5"/>
<text x="288" y="52.5" class="tb" text-anchor="middle">た</text>
<text x="288" y="82" class="tm" text-anchor="middle">助動詞</text>
<text x="12" y="106" class="tm">区切りに空白を入れた書き出し＝分かち書き</text>
<line x1="12" y1="122" x2="308" y2="122" class="l sb w1"/>
<text x="12" y="146" class="tb">② 構文解析：係り受け（1文の構造）</text>
<rect x="12" y="226" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="34" y="244.5" class="tb" text-anchor="middle">兄は</text>
<rect x="70" y="226" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="92" y="244.5" class="tb" text-anchor="middle">妹に</text>
<rect x="128" y="226" width="58" height="28" class="fs sb" stroke-width="1.5"/>
<text x="157" y="244.5" class="tb" text-anchor="middle">地図を</text>
<rect x="232" y="226" width="60" height="28" class="fok sok" stroke-width="1.5"/>
<text x="262" y="244.5" class="tb" text-anchor="middle">渡した</text>
<polyline points="34,226 45.36,217.26 56.66,209.44 67.89,202.54 79.04,196.56 90.13,191.5 101.14,187.36 112.08,184.14 122.96,181.84 133.77,180.46 144.5,180 155.17,180.46 165.76,181.84 176.29,184.14 186.74,187.36 197.13,191.5 207.44,196.56 217.68,202.54 227.86,209.44 237.97,217.26 248,226" class="l sa w2"/>
<polyline points="240.05,224.64 248,226 245.13,218.46" class="l sa w2"/>
<polyline points="92,226 100.48,219.54 108.94,213.76 117.36,208.66 125.76,204.24 134.13,200.5 142.46,197.44 150.76,195.06 159.04,193.36 167.29,192.34 175.5,192 183.69,192.34 191.84,193.36 199.97,195.06 208.06,197.44 216.13,200.5 224.16,204.24 232.16,208.66 240.14,213.76 248.09,219.54 256,226" class="l sa w2"/>
<polyline points="248.01,224.89 256,226 252.9,218.56" class="l sa w2"/>
<polyline points="157,226 162.25,221.82 167.52,218.08 172.79,214.78 178.08,211.92 183.38,209.5 188.68,207.52 194,205.98 199.32,204.88 204.66,204.22 210,204 215.36,204.22 220.72,204.88 226.09,205.98 231.48,207.52 236.88,209.5 242.28,211.92 247.69,214.78 253.12,218.08 258.56,221.82 264,226" class="l sa w2"/>
<polyline points="255.99,225.11 264,226 260.69,218.65" class="l sa w2"/>
<text x="12" y="270" class="tm">3つとも「渡した」にかかる</text>
<line x1="12" y1="286" x2="308" y2="286" class="l sb w1"/>
<text x="12" y="310" class="tb">③ 意味解析：誰が・誰に・何を</text>
<rect x="12" y="326" width="52" height="26" class="fas sa" stroke-width="1.5"/>
<text x="38" y="343.5" class="tb" text-anchor="middle">誰が</text>
<rect x="70" y="326" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="96" y="343.5" class="tb" text-anchor="middle">兄</text>
<line x1="122" y1="339" x2="170" y2="366" class="l sa w2"/>
<polyline points="162.01,365.92 170,366 165.79,359.21" class="l sa w2"/>
<rect x="12" y="360" width="52" height="26" class="fas sa" stroke-width="1.5"/>
<text x="38" y="377.5" class="tb" text-anchor="middle">誰に</text>
<rect x="70" y="360" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="96" y="377.5" class="tb" text-anchor="middle">妹</text>
<line x1="122" y1="373" x2="170" y2="366" class="l sa w2"/>
<polyline points="163.63,370.82 170,366 162.52,363.2" class="l sa w2"/>
<rect x="12" y="394" width="52" height="26" class="fas sa" stroke-width="1.5"/>
<text x="38" y="411.5" class="tb" text-anchor="middle">何を</text>
<rect x="70" y="394" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="96" y="411.5" class="tb" text-anchor="middle">地図</text>
<line x1="122" y1="407" x2="170" y2="366" class="l sa w2"/>
<polyline points="167.18,373.47 170,366 162.18,367.62" class="l sa w2"/>
<rect x="172" y="346" width="100" height="40" class="fok sok" stroke-width="1.5"/>
<text x="222" y="361.5" class="tb" text-anchor="middle">渡した</text>
<text x="222" y="379.5" class="tb" text-anchor="middle">（述語）</text>
<line x1="12" y1="440" x2="308" y2="440" class="l sb w1"/>
<text x="12" y="464" class="tb">④ 照応解析：何を指すか</text>
<text x="12" y="488" class="tm">文1</text>
<rect x="40" y="474" width="60" height="26" class="fs sb" stroke-width="1.5"/>
<text x="70" y="491.5" class="tb" text-anchor="middle">兄</text>
<rect x="118" y="474" width="60" height="26" class="fs sb" stroke-width="1.5"/>
<text x="148" y="491.5" class="tb" text-anchor="middle">妹</text>
<rect x="196" y="474" width="60" height="26" class="fs sb" stroke-width="1.5"/>
<text x="226" y="491.5" class="tb" text-anchor="middle">地図</text>
<text x="12" y="548" class="tm">文2</text>
<rect x="118" y="534" width="60" height="26" class="fas sa" stroke-width="1.5"/>
<text x="148" y="551.5" class="tb" text-anchor="middle">彼女</text>
<rect x="196" y="534" width="60" height="26" class="fas sa" stroke-width="1.5"/>
<text x="226" y="551.5" class="tb" text-anchor="middle">それ</text>
<line x1="148" y1="534" x2="148" y2="502" class="l sok w2"/>
<polyline points="151.85,509 148,502 144.15,509" class="l sok w2"/>
<line x1="226" y1="534" x2="226" y2="502" class="l sok w2"/>
<polyline points="229.85,509 226,502 222.15,509" class="l sok w2"/>
<line x1="12" y1="580" x2="308" y2="580" class="l sb w1"/>
<text x="12" y="604" class="tb">⑤ 談話構造解析：文と文の関係</text>
<rect x="12" y="620" width="124" height="30" class="fs sb" stroke-width="1.5"/>
<text x="74" y="639.5" text-anchor="middle">文1：兄は…渡した</text>
<rect x="184" y="620" width="124" height="30" class="fs sb" stroke-width="1.5"/>
<text x="246" y="639.5" text-anchor="middle">文2：彼女は…広げた</text>
<line x1="136" y1="635" x2="184" y2="635" class="l sa w2"/>
<polyline points="177,638.85 184,635 177,631.15" class="l sa w2"/>
<text x="160" y="672" class="tm" text-anchor="middle">理由・対比など、</text>
<text x="160" y="690" class="tm" text-anchor="middle">どんな関係でつながるか</text>
<line x1="12" y1="708" x2="308" y2="708" class="l sb w1"/>
<text x="12" y="732">ストップワード除去：形態素解析のあとの前処理</text>
<text x="12" y="754" class="tm">文をまたぐ解析（照応など）は、文脈解析とも呼ぶ</text>
</svg>
