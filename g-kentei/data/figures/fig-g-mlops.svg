<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" role="img" aria-labelledby="fig-g-mlops-t fig-g-mlops-d">
<title id="fig-g-mlops-t">MLOps のサイクルと、モデルの劣化（ドリフト）の2つの型</title>
<desc id="fig-g-mlops-d">上は、作って終わりにしないサイクル。データ収集、学習、評価、デプロイ、監視と進み、監視で性能の劣化を見つけたら、新しいデータで再学習する。ソフトウェアのCI・CDに加えて、自動で再学習する継続的トレーニング（CT）が機械学習に固有のもの。下は劣化の2つの型。データドリフトは、運用時の入力の分布が学習時から変わること。グラフは2つの山がずれる様子。コンセプトドリフトは、入力の分布が変わらないまま、入力と正解の関係が変わること。例は、同じ記事でも昔は読みたい、今は読みたくないに変わる。コンセプトドリフトは入力だけを見ていても気づけない。</desc>
<text x="12" y="20" class="tb">① 回り続けるサイクル</text>
<rect x="12" y="34" width="88" height="36" class="fs sa" stroke-width="1.5"/>
<text x="56" y="56.5" class="tb" text-anchor="middle">データ収集</text>
<rect x="116" y="34" width="88" height="36" class="fs sa" stroke-width="1.5"/>
<text x="160" y="56.5" class="tb" text-anchor="middle">学習</text>
<rect x="220" y="34" width="88" height="36" class="fs sa" stroke-width="1.5"/>
<text x="264" y="56.5" class="tb" text-anchor="middle">評価</text>
<line x1="101" y1="52" x2="115" y2="52" class="l sm w2"/>
<polyline points="108,55.85 115,52 108,48.15" class="l sm w2"/>
<line x1="205" y1="52" x2="219" y2="52" class="l sm w2"/>
<polyline points="212,55.85 219,52 212,48.15" class="l sm w2"/>
<line x1="264" y1="71" x2="264" y2="129" class="l sm w2"/>
<polyline points="260.15,122 264,129 267.85,122" class="l sm w2"/>
<rect x="220" y="130" width="88" height="36" class="fs sa" stroke-width="1.5"/>
<text x="264" y="152.5" class="tb" text-anchor="middle">デプロイ</text>
<rect x="116" y="130" width="88" height="36" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="152.5" class="tb" text-anchor="middle">監視</text>
<line x1="219" y1="148" x2="205" y2="148" class="l sm w2"/>
<polyline points="212,144.15 205,148 212,151.85" class="l sm w2"/>
<line x1="160" y1="129" x2="160" y2="71" class="l swn w2 dsh"/>
<polyline points="163.85,78 160,71 156.15,78" class="l swn w2"/>
<text x="168" y="100" class="tb twn">劣化を検知</text>
<text x="168" y="118" class="tb twn">→ 再学習</text>
<text x="12" y="194">CI・CD に加えて、自動で再学習する</text>
<text x="12" y="214" class="tb">CT（継続的トレーニング）が加わる</text>
<line x1="12" y1="234" x2="308" y2="234" class="l sb w1"/>
<text x="12" y="262" class="tb">② 劣化の型その1：データドリフト</text>
<polyline points="12,363.56 16.93,363.29 21.87,362.89 26.8,362.3 31.73,361.46 36.67,360.29 41.6,358.71 46.53,356.62 51.47,353.94 56.4,350.6 61.33,346.55 66.27,341.79 71.2,336.37 76.13,330.42 81.07,324.11 86,317.69 90.93,311.46 95.87,305.74 100.8,300.87 105.73,297.14 110.67,294.8 115.6,294 120.53,294.8 125.47,297.14 130.4,300.87 135.33,305.74 140.27,311.46 145.2,317.69 150.13,324.11 155.07,330.42 160,336.37 164.93,341.79 169.87,346.55 174.8,350.6 179.73,353.94 184.67,356.62 189.6,358.71 194.53,360.29 199.47,361.46 204.4,362.3 209.33,362.89 214.27,363.29 219.2,363.56 224.13,363.73 229.07,363.84 234,363.91 238.93,363.95 243.87,363.97 248.8,363.98 253.73,363.99 258.67,364 263.6,364 268.53,364 273.47,364 278.4,364 283.33,364 288.27,364 293.2,364 298.13,364 303.07,364 308,364" class="l sa w2"/>
<polyline points="12,364 16.93,364 21.87,364 26.8,364 31.73,364 36.67,364 41.6,364 46.53,364 51.47,364 56.4,364 61.33,364 66.27,363.99 71.2,363.98 76.13,363.97 81.07,363.95 86,363.91 90.93,363.84 95.87,363.73 100.8,363.56 105.73,363.29 110.67,362.89 115.6,362.3 120.53,361.46 125.47,360.29 130.4,358.71 135.33,356.62 140.27,353.94 145.2,350.6 150.13,346.55 155.07,341.79 160,336.37 164.93,330.42 169.87,324.11 174.8,317.69 179.73,311.46 184.67,305.74 189.6,300.87 194.53,297.14 199.47,294.8 204.4,294 209.33,294.8 214.27,297.14 219.2,300.87 224.13,305.74 229.07,311.46 234,317.69 238.93,324.11 243.87,330.42 248.8,336.37 253.73,341.79 258.67,346.55 263.6,350.6 268.53,353.94 273.47,356.62 278.4,358.71 283.33,360.29 288.27,361.46 293.2,362.3 298.13,362.89 303.07,363.29 308,363.56" class="l swn w2 dsh"/>
<line x1="12" y1="364" x2="308" y2="364" class="l sm w1"/>
<text x="95.6" y="302" class="tb ta" text-anchor="end">学習時</text>
<text x="224.4" y="302" class="tb twn">運用時</text>
<text x="12" y="388" class="tb">入力の分布そのものが変わる</text>
<text x="12" y="408" class="tm">正解がなくても、入力の統計から検知できる</text>
<line x1="12" y1="428" x2="308" y2="428" class="l sb w1"/>
<text x="12" y="456" class="tb">③ 劣化の型その2：コンセプトドリフト</text>
<rect x="12" y="470" width="90" height="70" class="fs sb" stroke-width="1.5"/>
<text x="57" y="491.5" text-anchor="middle">同じ記事</text>
<text x="57" y="509.5" text-anchor="middle">（入力は</text>
<text x="57" y="527.5" text-anchor="middle">変わらない）</text>
<line x1="104" y1="488" x2="138" y2="488" class="l sm w2"/>
<polyline points="131,491.85 138,488 131,484.15" class="l sm w2"/>
<line x1="104" y1="522" x2="138" y2="522" class="l sm w2"/>
<polyline points="131,525.85 138,522 131,518.15" class="l sm w2"/>
<rect x="140" y="470" width="168" height="34" class="fas sa" stroke-width="1.5"/>
<text x="224" y="491.5" text-anchor="middle">昔の正解：読みたい</text>
<rect x="140" y="506" width="168" height="34" class="fwn swn" stroke-width="1.5"/>
<text x="224" y="527.5" text-anchor="middle">今の正解：読みたくない</text>
<text x="12" y="568" class="tb">入力と正解の関係が変わる</text>
<text x="12" y="588" class="tm">入力だけを見ていても気づけない</text>
</svg>
