<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 872" role="img" aria-labelledby="fig-g-mds-t fig-g-mds-d">
<title id="fig-g-mds-t">多次元尺度構成法（MDS）：距離の表だけから、距離が保たれるように点を配置する</title>
<desc id="fig-g-mds-d">多次元尺度構成法（MDS）は、データどうしの距離（似ていなさ）だけから、その距離ができるだけ保たれるように点を低い次元に配置する方法。例：4都市のおよその直線距離（km）で、緯度・経度（位置）は渡さない。①手元にあるのは距離の表だけ：東京–大阪400、東京–福岡890、東京–札幌830、大阪–福岡480、大阪–札幌1,060、福岡–札幌1,420。②距離ができるだけ保たれるように平面に4つの点を置く。MDSが出した配置は向きや裏返しが決まらない。この例では回すと、北が上の日本地図と同じ並び（札幌が北東、福岡が南西、その間に大阪と東京）になる。③置いた点の間を測り直すと、東京–大阪は表400に対して約406、東京–札幌は830に対して約830、大阪–福岡は480に対して約484、福岡–札幌は1,420に対して約1,420で、ほぼ表のとおり（差は10km未満）。どこで使うか：似ていなさの表しか無いデータの地図に。例：飲料10種を2つずつ比べて答えてもらうと、似た飲料が近くに並ぶ地図ができる。PCAとの違い：PCAは特徴量の値から、ばらつきの大きい軸を求める。MDSは距離の表から、距離を保つ配置を求める。</desc>
<text x="12" y="20" class="tb">MDS：距離の表だけから、点の配置を描く</text>
<text x="12" y="42" class="tm">例：4都市のおよその直線距離（km）</text>
<text x="12" y="60" class="tm">緯度・経度（位置）は渡さない。距離だけ</text>
<text x="12" y="92" class="tb">① 手元にあるのは距離の表だけ</text>
