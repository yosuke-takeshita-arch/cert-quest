<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 664" role="img" aria-labelledby="fig-g-learning-rate-t fig-g-learning-rate-d">
<title id="fig-g-learning-rate-t">学習率：同じ傾きでも、学習率で一歩の大きさが変わる</title>
<desc id="fig-g-learning-rate-d">グラフの横軸は重みw、縦軸は誤差で、誤差＝w²の例。出発はw＝3（誤差9）、傾きは2×3＝6。一歩は学習率×傾き。学習率0.01なら0.01×6＝0.06で、3−0.06＝2.94へ、誤差は約8.64でほとんど進まない。学習率0.1なら0.1×6＝0.6で、3−0.6＝2.4へ、誤差は5.76に下がる。学習率1.1なら1.1×6＝6.6で、3−6.6＝−3.6へ、谷底の0を飛び越え、誤差は3.6×3.6＝12.96に増える。次は傾き2×(−3.6)＝−7.2、一歩1.1×(−7.2)＝−7.92、−3.6−(−7.92)＝4.32へ、誤差は約18.7とさらに増え、行き来しながら外へ飛び出す（発散）。</desc>
<text x="12" y="22" class="tb">① 同じ出発点から、学習率だけ変える（例）</text>
<text x="12" y="42" class="tm">グラフ：横＝重み w、縦＝誤差（例：誤差＝w²）</text>
<line x1="15" y1="250" x2="305" y2="250" class="l sm w1"/>
<line x1="160" y1="60" x2="160" y2="250" class="l sm w1 dsh"/>
<text x="160" y="266" class="tm" text-anchor="middle">0（谷底）</text>
<text x="253" y="266" class="tm" text-anchor="middle">3</text>
<text x="48.4" y="266" class="tm" text-anchor="middle">−3.6</text>
<text x="293.9" y="266" class="tm" text-anchor="middle">4.32</text>
