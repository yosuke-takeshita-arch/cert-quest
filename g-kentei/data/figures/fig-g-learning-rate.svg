<line x1="253" y1="164.5" x2="242.2" y2="182.4" class="l sok w2"/>
<polygon points="237.5,190.1 238.3,180.1 246,184.8" class="tok"/>
<line x1="253" y1="164.5" x2="63.2" y2="129.6" class="l sng w2"/>
<polygon points="54.3,128 64,125.2 62.3,134" class="tng"/>
<line x1="48.4" y1="126.9" x2="279.3" y2="75.9" class="l sng w2"/>
<polygon points="288.1,74 280.2,80.3 278.3,71.5" class="tng"/>
<circle cx="253" cy="164.5" r="5" class="fwn swn"/>
<circle cx="234.4" cy="195.3" r="4" class="fok sok"/>
<circle cx="48.4" cy="126.9" r="4" class="fng sng"/>
<circle cx="293.9" cy="72.7" r="4" class="fng sng"/>
<text x="261" y="186.5" class="tb">出発 w＝3</text>
<text x="244.4" y="213.3" class="tb tok">0.1</text>
<text x="120" y="180" class="tb tng">1.1 の1回目</text>
<text x="96" y="100" class="tb tng">2回目</text>
<text x="12" y="290" class="tm">緑＝学習率 0.1、赤＝学習率 1.1</text>
<text x="12" y="310" class="tm">（0.01 は 3 から 2.94 で、点がほぼ重なる）</text>
<line x1="12" y1="324" x2="308" y2="324" class="l sb w1"/>
<text x="12" y="348" class="tb">② 一歩＝学習率×傾き（傾きは 2×3＝6）</text>
<text x="12" y="374" class="tb twn">学習率 0.01</text>
<text x="24" y="396">0.01×6＝0.06、3−0.06＝2.94</text>
<text x="24" y="416" class="tm">誤差 9 → 約8.64：ほとんど進まない</text>
<text x="12" y="442" class="tb tok">学習率 0.1</text>
<text x="24" y="464">0.1×6＝0.6、3−0.6＝2.4</text>
<text x="24" y="484" class="tm">誤差 9 → 5.76：ほどよく近づく</text>
<text x="12" y="510" class="tb tng">学習率 1.1</text>
<text x="24" y="532">1.1×6＝6.6、3−6.6＝−3.6</text>
<text x="24" y="552" class="tm">谷底を飛び越え、誤差 9 → 12.96（増えた）</text>
<text x="24" y="574">次：傾き 2×(−3.6)＝−7.2</text>
<text x="24" y="594">−3.6−1.1×(−7.2)＝−3.6＋7.92＝4.32</text>
<rect x="12" y="606" width="296" height="48" class="fng l sng w1" rx="4"/>
<text x="160" y="626" class="tb tng" text-anchor="middle">誤差 12.96 → 約18.7 とさらに増え、</text>
<text x="160" y="645" class="tb tng" text-anchor="middle">行き来しながら外へ飛び出す（発散）</text>
</svg>
