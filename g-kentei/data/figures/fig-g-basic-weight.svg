<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 690" role="img" aria-labelledby="fig-g-basic-weight-t fig-g-basic-weight-d">
<title id="fig-g-basic-weight-t">重み＝入力に掛ける数（学習で決まる）</title>
<desc id="fig-g-basic-weight-d">重みの例を3つ。1、全結合。入力3つ（2、1、3）を出力1つにつなぐと、つなぐ線1本ごとに重みが1つで、重みは3個（0.5、−1、2）。出力は 2×0.5＋1×(−1)＋3×2＝1＋(−1)＋6＝6。2、畳み込みのフィルタ。3×3のフィルタはマス9個で、重みが9個。画像の3×3の部分（どの行も 9、5、1）と、フィルタ（どの行も 1、0、−1）の同じ位置どうしを掛けて9個を足す。1行ぶんは 9×1＋5×0＋1×(−1)＝8、3行で 8×3＝24。3、重みの数え方。フィルタ1枚ぶんは3×3＝9個。入力が32チャネルなら、それを32枚重ねて 9×32＝288個でフィルタ1個。出力を64チャネルにするならフィルタを64個用意して 288×64＝18,432個。重みが多いほど、学習で決める数が多く、計算もメモリも多くなる。数は説明のための例。</desc>
<text x="12" y="22" class="tl">重み＝入力に掛ける数</text>
<text x="12" y="44" class="tm">学習で少しずつ直して決める（数は例）</text>
<text x="12" y="74" class="tb">1 全結合：入力3つ → 出力1つ</text>
<circle cx="40" cy="100" r="14" class="fs sb" stroke-width="2"/>
<circle cx="40" cy="140" r="14" class="fs sb" stroke-width="2"/>
<circle cx="40" cy="180" r="14" class="fs sb" stroke-width="2"/>
<text x="40" y="105" class="tb" text-anchor="middle">2</text>
<text x="40" y="145" class="tb" text-anchor="middle">1</text>
<text x="40" y="185" class="tb" text-anchor="middle">3</text>
<line x1="54" y1="102" x2="212" y2="134" class="l sa w2"/>
<line x1="54" y1="140" x2="212" y2="140" class="l sa w2"/>
<line x1="54" y1="178" x2="212" y2="146" class="l sa w2"/>
<text x="120" y="106" class="tb ta">×0.5</text>
<text x="120" y="134" class="tb ta">×(−1)</text>
<text x="120" y="182" class="tb ta">×2</text>
<circle cx="232" cy="140" r="20" class="fok sok" stroke-width="2"/>
<text x="232" y="145" class="tb tok" text-anchor="middle">6</text>
<text x="260" y="145" class="tm">出力</text>
<text x="12" y="216">線1本に重み1つ → <tspan class="tb ta">重みは3個</tspan></text>
<text x="12" y="238">2×0.5＋1×(−1)＋3×2</text>
<text x="12" y="258">＝1＋(−1)＋6＝<tspan class="tb tok">6</tspan></text>
<line x1="12" y1="274" x2="308" y2="274" class="l sb w1"/>
<text x="12" y="298" class="tb">2 畳み込み：3×3のフィルタ＝重み9個</text>
<text x="51" y="320" class="tm" text-anchor="middle">画像の3×3</text>
<text x="171" y="320" class="tm" text-anchor="middle">フィルタ（重み）</text>
<rect x="12" y="328" width="78" height="78" class="fs sm" stroke-width="1.5"/>
<line x1="38" y1="328" x2="38" y2="406" class="l sb w1"/>
<line x1="64" y1="328" x2="64" y2="406" class="l sb w1"/>
<line x1="12" y1="354" x2="90" y2="354" class="l sb w1"/>
<line x1="12" y1="380" x2="90" y2="380" class="l sb w1"/>
<text x="25" y="346" text-anchor="middle">9</text>
<text x="51" y="346" text-anchor="middle">5</text>
<text x="77" y="346" text-anchor="middle">1</text>
<text x="25" y="372" text-anchor="middle">9</text>
<text x="51" y="372" text-anchor="middle">5</text>
<text x="77" y="372" text-anchor="middle">1</text>
<text x="25" y="398" text-anchor="middle">9</text>
<text x="51" y="398" text-anchor="middle">5</text>
<text x="77" y="398" text-anchor="middle">1</text>
<text x="111" y="372" class="tb" text-anchor="middle">×</text>
<rect x="132" y="328" width="78" height="78" class="fas sa" stroke-width="1.5"/>
<line x1="158" y1="328" x2="158" y2="406" class="l sa w1"/>
<line x1="184" y1="328" x2="184" y2="406" class="l sa w1"/>
<line x1="132" y1="354" x2="210" y2="354" class="l sa w1"/>
<line x1="132" y1="380" x2="210" y2="380" class="l sa w1"/>
<text x="145" y="346" class="tb ta" text-anchor="middle">1</text>
<text x="171" y="346" class="tb ta" text-anchor="middle">0</text>
<text x="197" y="346" class="tb ta" text-anchor="middle">−1</text>
<text x="145" y="372" class="tb ta" text-anchor="middle">1</text>
<text x="171" y="372" class="tb ta" text-anchor="middle">0</text>
<text x="197" y="372" class="tb ta" text-anchor="middle">−1</text>
<text x="145" y="398" class="tb ta" text-anchor="middle">1</text>
<text x="171" y="398" class="tb ta" text-anchor="middle">0</text>
<text x="197" y="398" class="tb ta" text-anchor="middle">−1</text>
<text x="230" y="372" class="tb">→ 足す</text>
<text x="12" y="432">同じ位置どうしを掛けて9個を足す</text>
<text x="12" y="454">1行ぶん 9×1＋5×0＋1×(−1)＝8</text>
<text x="12" y="476">3行で 8×3＝<tspan class="tb tok">24</tspan>（出力のマス1つ）</text>
<line x1="12" y1="492" x2="308" y2="492" class="l sb w1"/>
<text x="12" y="516" class="tb">3 重みの数え方（畳み込み層）</text>
<text x="12" y="540">フィルタ1枚ぶん　3×3＝<tspan class="tb ta">9個</tspan></text>
<text x="12" y="562">入力32チャネルぶん重ねる</text>
<text x="12" y="582">　9×32＝<tspan class="tb ta">288個</tspan>（フィルタ1個）</text>
<text x="12" y="604">出力64チャネルぶん用意する</text>
<text x="12" y="624">　288×64＝<tspan class="tb ta">18,432個</tspan></text>
<text x="12" y="654" class="tb tng">重みが多い＝学習で決める数が多い</text>
<text x="12" y="676" class="tb tng">＝計算もメモリも多くいる</text>
</svg>
