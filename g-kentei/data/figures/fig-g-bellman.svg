<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1158" role="img" aria-labelledby="fig-g-bellman-t fig-g-bellman-d">
<title id="fig-g-bellman-t">ベルマン方程式と動的計画法：部屋の例で、価値をすぐもらえる報酬と次の状態の価値に分けて求める</title>
<desc id="fig-g-bellman-d">例：ロボットが部屋A・部屋B・部屋Cを動き、部屋Cに着くと報酬10で終わる。ほかの移動は報酬0。方策はいつも右へ。ことばの式は、ある状態の価値＝すぐもらえる報酬＋割引率（0.9）×次の状態の価値。足すのは、この先の得がいまもらう分と次の状態から先でもらう分の合計だから。掛けるのは、次の分は1歩先なので少し小さく数えるため。①ゴールから手前へ順に決まる。部屋Cは着いたら終わりでこの先は0、V(部屋C)＝0。部屋Bは右へで報酬10、次はCで価値0なので、V(部屋B)＝10＋0.9×0＝10。部屋Aは右へで報酬0、次はBで価値10なので、V(部屋A)＝0＋0.9×10＝0＋9＝9。先を全部数えなくても、隣の部屋の価値さえ分かれば、いまの部屋の価値が決まる。②動的計画法はこの式をくり返し当てはめる。最初は全部0で、前の回の値を右辺に入れる。1回目はV(部屋A)＝0＋0.9×0＝0、V(部屋B)＝10＋0.9×0＝10。2回目はV(部屋A)＝0＋0.9×10＝9、V(部屋B)＝10。3回目は値が変わらないので終わり。右へ行くとどの部屋に着き報酬はいくつかという環境のモデルを知っているので、実際に動かずに計算だけで求まる。③ベルマン最適方程式は、行動ごとに計算して良いほうを取る。部屋Bで右へは10＋0.9×0＝10、左へはAに戻って報酬0、Aの価値は9なので0＋0.9×9＝8.1。大きいほうの10が部屋Bの最適な価値。④モデルが無いときは、実際に1歩動いた結果で同じ式を使い、見積もりを少しずつ直す。これがTD学習（Q学習・SARSA）。移り先が確率で決まるときは、移り先ごとの値を確率で重みづけた平均（期待値）を使う。</desc>
<text x="12" y="20" class="tb">ベルマン方程式：価値を『いま』と『次』に分ける</text>
<text x="12" y="42" class="tm">例：部屋Cに着くと報酬10で終わり。</text>
<text x="12" y="60" class="tm">ほかの移動は報酬0。方策はいつも右へ</text>
<rect x="12" y="72" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="52" y="95" class="tb" text-anchor="middle">部屋A</text>
<rect x="120" y="72" width="80" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="95" class="tb" text-anchor="middle">部屋B</text>
<rect x="228" y="72" width="80" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="268" y="95" class="tb tok" text-anchor="middle">部屋C</text>
<line x1="92" y1="90" x2="114.4" y2="90.0" class="l sm w1"/>
<polygon points="120,90 114.4,93.5 114.4,86.5" class="fm"/>
<line x1="200" y1="90" x2="222.4" y2="90.0" class="l sm w1"/>
<polygon points="228,90 222.4,93.5 222.4,86.5" class="fm"/>
<text x="106" y="124" class="tm" text-anchor="middle">報酬0</text>
<text x="214" y="124" class="tok" text-anchor="middle">報酬10</text>
<rect x="12" y="136" width="296" height="46" class="fs sa" stroke-width="1.5" rx="6"/>
<text x="22" y="155" class="tb">ある状態の価値 ＝ すぐもらえる報酬</text>
<text x="22" y="173" class="tb">　＋ 割引率（0.9）× 次の状態の価値</text>
<text x="12" y="200" class="tm">足すわけ：この先の得＝いまもらう分</text>
<text x="12" y="218" class="tm">　＋次の状態から先でもらう分</text>
<text x="12" y="236" class="tm">掛けるわけ：次の分は1歩先なので、</text>
<text x="12" y="254" class="tm">　少し小さく数える（×0.9）</text>
<line x1="12" y1="270" x2="308" y2="270" class="l sb w1"/>
<text x="12" y="294" class="tb">① ゴールから手前へ、順に決まる</text>
<rect x="12" y="306" width="296" height="50" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="326" class="tok">部屋C：着いたら終わり。この先は0</text>
<text x="22" y="346" class="tb tok">　V(部屋C)＝0</text>
<line x1="160" y1="356" x2="160.0" y2="364.4" class="l sm w1"/>
<polygon points="160,370 156.5,364.4 163.5,364.4" class="fm"/>
<rect x="12" y="370" width="296" height="50" class="fs sa" stroke-width="1.5" rx="6"/>
<text x="22" y="390" class="ta">部屋B：右へで報酬10、次はC（価値0）</text>
<text x="22" y="410" class="tb ta">　V(部屋B)＝10＋0.9×0＝10＋0＝10</text>
<line x1="160" y1="420" x2="160.0" y2="428.4" class="l sm w1"/>
<polygon points="160,434 156.5,428.4 163.5,428.4" class="fm"/>
<rect x="12" y="434" width="296" height="50" class="fs sa" stroke-width="1.5" rx="6"/>
<text x="22" y="454" class="ta">部屋A：右へで報酬0、次はB（価値10）</text>
<text x="22" y="474" class="tb ta">　V(部屋A)＝0＋0.9×10＝0＋9＝9</text>
<text x="12" y="506">先を全部数えなくても、隣の部屋の価値</text>
<text x="12" y="524">さえ分かれば、いまの部屋の価値が決まる</text>
<line x1="12" y1="540" x2="308" y2="540" class="l sb w1"/>
<text x="12" y="564" class="tb">② 動的計画法：この式をくり返し当てる</text>
<text x="12" y="584" class="tm">最初は全部0。前の回の値を右辺に入れる</text>
<rect x="12" y="594" width="296" height="26" class="fbg sb" stroke-width="1" rx="0"/>
<text x="50" y="612" class="tm" text-anchor="middle">回</text>
<text x="130" y="612" class="tb" text-anchor="middle">V(部屋A)</text>
<text x="232" y="612" class="tb" text-anchor="middle">V(部屋B)</text>
<rect x="12" y="620" width="296" height="30" class="fs sb" stroke-width="1" rx="0"/>
<text x="50" y="640" class="tm" text-anchor="middle">最初</text>
<text x="130" y="640" text-anchor="middle">0</text>
<text x="232" y="640" text-anchor="middle">0</text>
<rect x="12" y="650" width="296" height="30" class="fs sb" stroke-width="1" rx="0"/>
<text x="50" y="670" class="tm" text-anchor="middle">1回目</text>
<text x="130" y="670" text-anchor="middle">0＋0.9×0＝0</text>
<text x="232" y="670" class="tb ta" text-anchor="middle">10＋0.9×0＝10</text>
<rect x="12" y="680" width="296" height="30" class="fs sb" stroke-width="1" rx="0"/>
<text x="50" y="700" class="tm" text-anchor="middle">2回目</text>
<text x="130" y="700" class="tb ta" text-anchor="middle">0＋0.9×10＝9</text>
<text x="232" y="700" text-anchor="middle">10＋0.9×0＝10</text>
<rect x="12" y="710" width="296" height="30" class="fs sb" stroke-width="1" rx="0"/>
<text x="50" y="730" class="tm" text-anchor="middle">3回目</text>
<text x="130" y="730" text-anchor="middle">9（同じ）</text>
<text x="232" y="730" text-anchor="middle">10（同じ）</text>
<text x="12" y="760" class="tm">1回目のAは、Bがまだ0なので0のまま。</text>
<text x="12" y="778" class="tm">2回目に、Bの10が伝わって9になる</text>
<text x="12" y="798" class="tb">値が変わらなくなったら終わり</text>
<text x="12" y="820" class="twn">『右へ行くとどの部屋に着き、報酬はいくつ』</text>
<text x="12" y="838" class="twn">（環境のモデル）を知っているので、</text>
<text x="12" y="856" class="twn">実際に動かずに計算だけで求まる</text>
<line x1="12" y1="872" x2="308" y2="872" class="l sb w1"/>
<text x="12" y="896" class="tb">③ ベルマン最適方程式：良いほうの行動で</text>
<text x="12" y="916" class="tm">部屋Bで行動ごとに計算して、大きいほう</text>
<text x="12" y="936" class="tok">右へ：10＋0.9×0＝10</text>
<text x="12" y="956" class="tm">左へ：Aに戻る（報酬0）。Aの価値は9</text>
<text x="12" y="974" class="tm">　0＋0.9×9＝0＋8.1＝8.1</text>
<text x="12" y="994" class="tb tok">→ 大きいほうの10が、部屋Bの最適な価値</text>
<line x1="12" y1="1010" x2="308" y2="1010" class="l sb w1"/>
<text x="12" y="1034" class="tb">④ モデルが無いとき</text>
<text x="12" y="1054">実際に1歩動いた結果で同じ式を使い、</text>
<text x="12" y="1072">見積もりを少しずつ直す＝TD学習</text>
<text x="12" y="1090" class="tm">（Q学習・SARSA。次の図のモデルフリーの欄）</text>
<text x="12" y="1112" class="tm">移り先が確率で決まるときは、移り先ごとの</text>
<text x="12" y="1130" class="tm">値を確率で重みづけた平均（期待値）を使う</text>
<text x="12" y="1148" class="tm">数は説明のための例</text>
</svg>
