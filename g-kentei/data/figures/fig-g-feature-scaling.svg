<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 502" role="img" aria-labelledby="fig-g-feature-scaling-t fig-g-feature-scaling-d">
<title id="fig-g-feature-scaling-t">特徴量の変換：正規化・標準化・対数変換</title>
<desc id="fig-g-feature-scaling-d">同じデータのヒストグラムを並べて、変換で何が変わるかを見る図。元データは、中央にふくらみのある山。正規化（Min-Max）は最小値と最大値を使って0から1の範囲に収める。標準化は各値から平均を引いて標準偏差で割り、平均0・分散1にそろえる。正規化も標準化も山の形は変わらず、横軸の目盛りが変わる。下の2つは、大半の値が小さく一部だけが極端に大きい、右に長く裾を引く分布の例。対数をとると、山が中央寄りになり、偏りが小さくなる。</desc>
<text x="12" y="20" class="tb">① 元データ</text>
<text x="168" y="20" class="tb">② 正規化（Min-Max）</text>
