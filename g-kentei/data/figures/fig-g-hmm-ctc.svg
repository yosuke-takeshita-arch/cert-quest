<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1390" role="img" aria-labelledby="fig-g-hmm-ctc-t fig-g-hmm-ctc-d">
<title id="fig-g-hmm-ctc-t">HMM による音声認識と CTC</title>
<desc id="fig-g-hmm-ctc-d">上は隠れマルコフモデル（HMM）。当てたいのは、何と言ったか。困りごと：マイクで取れるのは、コマ（フレーム。例：10ミリ秒ずつの区切り）ごとの特徴量（音の性質を表す数）の並びだけで、どのコマがどの音素かは書いていない。同じ『あ』でも人や話し方で長さが違う。考え方：裏に音素の並びがあるとみなす。例：『あさ』と言ったなら、音素が a → s → a の順に並んでいる。各音素は何コマかとどまり（自分に戻る矢印＝次のコマも同じ音素が続く）、次の音素へ進む（遷移）。とどまる・進むの起こりやすさが遷移確率。各音素からコマへの線が出力確率で、その音素のとき、そのコマの特徴量が出やすい度合い。例ではコマ1〜2が a、コマ3〜5が s、コマ6が a。認識：見えるのは特徴量の並びだけなので、どのコマがどの音素かを、遷移確率と出力確率でいちばんありそうなものに決め、『あさ』と当てる。実際は1つの音素を始め・中・終わりなどいくつかの状態に分けることが多い。DNN-HMM：このコマの特徴量はどの状態っぽいか、の見積もり（出力確率の部分）を、昔は GMM（混合ガウスモデル。釣り鐘形の正規分布をいくつか重ねた確率の式）で求めていた。DNN-HMM はここを DNN（層を深く重ねたニューラルネットワーク）に替えた。とどまる・進む（遷移）は HMM のまま。下は CTC。困りごと：DNN-HMM の DNN を学ぶには、コマごとに『ここは a』と区切った正解が要る。CTC は、コマごとに文字か空白（＿＝何も出さない）を出させ、あとで決まった規則でまとめる。同じ文字の連続をまとめてから、空白を消す。例の c c ＿ a a ＿ t は、c ＿ a ＿ t になり、cat になる。学習では cat にまとまる出し方すべての確率を足して、それが大きくなるようにするので、どのコマがどの文字かを前もって区切っておかなくてよい。</desc>
<text x="12" y="20" class="tb">① HMM：裏に隠れた音の並びを当てる</text>
<text x="12" y="46" class="tb">困りごと<tspan class="tm">（当てたいのは、何と言ったか）</tspan></text>
<text x="12" y="66" class="tm">マイクで取れるのは、コマ（フレーム。例：</text>
<text x="12" y="84" class="tm">10ミリ秒ずつの区切り）ごとの特徴量（音の</text>
<text x="12" y="102" class="tm">性質を表す数）の並びだけ</text>
<rect x="12" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="34" y="130.5" text-anchor="middle">コマ1</text>
<rect x="62" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="84" y="130.5" text-anchor="middle">コマ2</text>
<rect x="112" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="134" y="130.5" text-anchor="middle">コマ3</text>
<rect x="162" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="184" y="130.5" text-anchor="middle">コマ4</text>
<rect x="212" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="234" y="130.5" text-anchor="middle">コマ5</text>
<rect x="262" y="112" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="284" y="130.5" text-anchor="middle">コマ6</text>
<text x="12" y="160" class="tb twn">どのコマがどの音素かは、書いていない</text>
<text x="12" y="178" class="tm">同じ『あ』でも、人や話し方で長さが違う</text>
<line x1="12" y1="192" x2="308" y2="192" class="l sb w1"/>
<text x="12" y="214" class="tb">考え方：裏に音素の並びがあるとみなす</text>
<text x="12" y="234" class="tm">例：『あさ』と言った＝音素（音の最小単位）</text>
<text x="12" y="252" class="tm">が a → s → a の順に並んでいる</text>
<text x="60" y="274" class="tm" text-anchor="middle">とどまる</text>
<text x="160" y="274" class="tm" text-anchor="middle">とどまる</text>
<text x="260" y="274" class="tm" text-anchor="middle">とどまる</text>
