<line x1="264" y1="340" x2="282" y2="376" class="l swn w2"/>
<rect x="12" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="34" y="396.5" text-anchor="middle">コマ1</text>
<rect x="62" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="84" y="396.5" text-anchor="middle">コマ2</text>
<rect x="112" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="134" y="396.5" text-anchor="middle">コマ3</text>
<rect x="162" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="184" y="396.5" text-anchor="middle">コマ4</text>
<rect x="212" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="234" y="396.5" text-anchor="middle">コマ5</text>
<rect x="262" y="378" width="44" height="28" class="fs sb" stroke-width="1.5"/>
<text x="284" y="396.5" text-anchor="middle">コマ6</text>
<text x="12" y="434" class="tb"><tspan class="ta">丸の上の輪（とどまる）</tspan>＝次のコマも</text>
<text x="12" y="452" class="tm">同じ音素が続く。何回とどまるかで、長い</text>
<text x="12" y="470" class="tm">『あー』も短い『あ』も表せる</text>
<text x="12" y="494" class="tb"><tspan class="ta">横の矢印（進む）</tspan>＝次の音素へ移る（遷移）</text>
<text x="12" y="512" class="tm">とどまる・進むの起こりやすさ＝遷移確率</text>
<text x="12" y="536" class="tb"><tspan class="twn">下へのびる線</tspan>＝出力確率</text>
<text x="12" y="554" class="tm">その音素のとき、そのコマの特徴量が出やすい</text>
<text x="12" y="572" class="tm">度合い（a なら、a らしい特徴量が出やすい）</text>
<line x1="12" y1="586" x2="308" y2="586" class="l sb w1"/>
<text x="12" y="608" class="tb">認識：いちばんありそうな並びを当てる</text>
<text x="12" y="628" class="tm">見えるのは特徴量の並びだけ。そこから、</text>
<text x="12" y="646" class="tm">どのコマがどの音素かを、遷移確率と出力確率</text>
<text x="12" y="664" class="tm">でいちばんありそうなものに決める</text>
<rect x="12" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="34" y="692.5" class="tb" text-anchor="middle">a</text>
<rect x="62" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="84" y="692.5" class="tb" text-anchor="middle">a</text>
<rect x="112" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="134" y="692.5" class="tb" text-anchor="middle">s</text>
<rect x="162" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="184" y="692.5" class="tb" text-anchor="middle">s</text>
<rect x="212" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="234" y="692.5" class="tb" text-anchor="middle">s</text>
<rect x="262" y="674" width="44" height="28" class="fok sok" stroke-width="1.5"/>
<text x="284" y="692.5" class="tb" text-anchor="middle">a</text>
<text x="12" y="724" class="tb tok">→ コマ1〜2が a、3〜5が s、6が a</text>
<text x="12" y="744" class="tb tok">　 ＝『あさ』と言った、と当てる</text>
<text x="12" y="768" class="tm">※実際は1つの音素を、始め・中・終わりなど</text>
<text x="12" y="786" class="tm">　いくつかの状態に分けることが多い</text>
<line x1="12" y1="800" x2="308" y2="800" class="l sb w1"/>
<text x="12" y="822" class="tb">DNN-HMM：出力確率の部分だけ替えた</text>
<text x="12" y="842" class="tm">『このコマの特徴量は、どの状態っぽいか』の</text>
<text x="12" y="860" class="tm">見積もり（下へのびる線）を、昔は GMM で</text>
<text x="12" y="878" class="tm">求めていた。GMM（混合ガウスモデル）＝</text>
<text x="12" y="896" class="tm">釣り鐘形の正規分布をいくつか重ねた確率の式</text>
<text x="12" y="920" class="tb ta">DNN-HMM は、ここを DNN（層を深く</text>
<text x="12" y="938" class="tb ta">重ねたニューラルネットワーク）に替えた</text>
<text x="12" y="958" class="tm">とどまる・進む（遷移）は HMM のまま</text>
<line x1="12" y1="976" x2="308" y2="976" class="l sm w2"/>
<text x="12" y="1002" class="tb">② CTC：空白を使って、区切りなしで学ぶ</text>
<text x="12" y="1024" class="tb">困りごと</text>
<text x="12" y="1044" class="tm">DNN-HMM の DNN を学ぶには、コマごとに</text>
<text x="12" y="1062" class="tm">『ここは a』と区切った正解が要る</text>
<text x="12" y="1086" class="tm">そこで、コマごとに『文字』か『空白（＿）』</text>
<text x="12" y="1104" class="tm">を出させ、あとで決まった規則でまとめる</text>
<text x="12" y="1128" class="tm">コマごとの出力（＿＝空白＝何も出さない）</text>
