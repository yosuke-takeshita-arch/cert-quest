<text x="110" y="312" class="tm" text-anchor="middle">進む</text>
<text x="210" y="312" class="tm" text-anchor="middle">進む</text>
<line x1="56" y1="340" x2="36" y2="376" class="l swn w2"/>
<line x1="64" y1="340" x2="82" y2="376" class="l swn w2"/>
<line x1="154" y1="340" x2="136" y2="376" class="l swn w2"/>
<line x1="160" y1="340" x2="182" y2="376" class="l swn w2"/>
