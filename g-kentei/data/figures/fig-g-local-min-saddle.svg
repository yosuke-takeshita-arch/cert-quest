<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-g-local-min-saddle-t fig-g-local-min-saddle-d">
<title id="fig-g-local-min-saddle-t">局所最適解・大域最適解・鞍点</title>
<desc id="fig-g-local-min-saddle-d">上は1次元の誤差曲線。谷が2つあり、深い左の谷が大域最適解（全体で最も小さい）、浅い右の谷が局所最適解（周りより小さいだけ）。右の谷に入ったボールは、傾きしか見ない勾配降下法では出られないが、モーメンタム（勢い）があれば丘を越えて左の谷へ行ける。下は鞍点。x方向の断面では谷、y方向の断面では山になっていて、中心の勾配は0。等高線は双曲線の形になる。</desc>
