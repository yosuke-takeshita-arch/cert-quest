<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 596" role="img" aria-labelledby="fig-g-depthwise-separable-t fig-g-depthwise-separable-d">
<title id="fig-g-depthwise-separable-t">Depthwise Separable 畳み込み：2段に分けて、重みを減らす</title>
<desc id="fig-g-depthwise-separable-d">通常の畳み込みは、3×3×32のフィルタを出力チャネル数の64個もち、重みは3×3×32×64で18,432個。Depthwise Separable は2段に分ける。1段目のDepthwiseは、チャネルごとに3×3のフィルタを1枚ずつ当てる（32枚で288個）。2段目のPointwiseは、1×1×32のフィルタを64個使ってチャネルを混ぜる（2,048個）。合わせて2,336個で、通常のおよそ8分の1。バイアスは数えていない。MobileNet がこの仕組みを使う。</desc>
<text x="12" y="20" class="tb">通常の畳み込み</text>
<rect x="29" y="38" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="43" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="48" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="53" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="103" class="tm" text-anchor="middle">32ch</text>
<line x1="76" y1="66" x2="94" y2="66" class="l w2"/>
<polyline points="87,69.85 94,66 87,62.15" class="l w2"/>
<rect x="98" y="44" width="110" height="44" class="fs sa" stroke-width="1.5"/>
<text x="153" y="61.5" text-anchor="middle">3×3×32 を</text>
<text x="153" y="79.5" text-anchor="middle">64個</text>
<line x1="210" y1="66" x2="228" y2="66" class="l w2"/>
<polyline points="221,69.85 228,66 221,62.15" class="l w2"/>
<rect x="256" y="38" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="251" y="43" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="246" y="48" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="241" y="53" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="236" y="58" width="32" height="32" class="fas sok" stroke-width="1.5"/>
<text x="260" y="108" class="tm" text-anchor="middle">64ch</text>
<text x="12" y="134" class="tb">重み 3×3×32×64 ＝ 18,432</text>
<line x1="12" y1="150" x2="308" y2="150" class="l sb w1"/>
<text x="12" y="174" class="tb">2段に分ける</text>
<text x="12" y="196">① Depthwise：チャネルごとに 3×3 を1枚ずつ</text>
<rect x="29" y="214" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="219" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="224" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="229" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="279" class="tm" text-anchor="middle">32ch</text>
<rect x="18" y="218" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="218" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="218" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="18" y="224" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="224" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="224" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="18" y="230" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="230" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="230" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<line x1="76" y1="238" x2="94" y2="238" class="l w2"/>
<polyline points="87,241.85 94,238 87,234.15" class="l w2"/>
<rect x="98" y="218" width="110" height="40" class="fs sa" stroke-width="1.5"/>
<text x="153" y="233.5" text-anchor="middle">3×3 を</text>
<text x="153" y="251.5" text-anchor="middle">32枚（1枚ずつ）</text>
<line x1="210" y1="238" x2="228" y2="238" class="l w2"/>
<polyline points="221,241.85 228,238 221,234.15" class="l w2"/>
<rect x="251" y="214" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="246" y="219" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="241" y="224" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="236" y="229" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="260" y="279" class="tm" text-anchor="middle">32ch</text>
<text x="12" y="296" class="tb">重み 3×3×32 ＝ 288</text>
<text x="12" y="332">② Pointwise：1×1 でチャネルを混ぜる</text>
<rect x="29" y="350" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="355" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="360" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="365" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="415" class="tm" text-anchor="middle">32ch</text>
<line x1="76" y1="374" x2="94" y2="374" class="l w2"/>
<polyline points="87,377.85 94,374 87,370.15" class="l w2"/>
<rect x="98" y="354" width="110" height="40" class="fs sa" stroke-width="1.5"/>
<text x="153" y="369.5" text-anchor="middle">1×1×32 を</text>
<text x="153" y="387.5" text-anchor="middle">64個</text>
<line x1="210" y1="374" x2="228" y2="374" class="l w2"/>
<polyline points="221,377.85 228,374 221,370.15" class="l w2"/>
<rect x="256" y="350" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="251" y="355" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="246" y="360" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="241" y="365" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="236" y="370" width="32" height="32" class="fas sok" stroke-width="1.5"/>
<text x="260" y="420" class="tm" text-anchor="middle">64ch</text>
<text x="12" y="432" class="tb">重み 32×64 ＝ 2,048</text>
<line x1="12" y1="448" x2="308" y2="448" class="l sb w1"/>
<text x="12" y="472" class="tb">重みの数をくらべる（バイアスは除く）</text>
<text x="12" y="498" class="tb">通常</text>
<rect x="60" y="484" width="248" height="18" class="fng sng" stroke-width="1.5"/>
<text x="300" y="498" class="tb" text-anchor="end">18,432</text>
<text x="12" y="530" class="tb">分離</text>
<rect x="60" y="516" width="31.43" height="18" class="fok sok" stroke-width="1.5"/>
<text x="99.43" y="530" class="tb">288＋2,048＝2,336</text>
<text x="12" y="562" class="tb tok">分離のほうが、およそ8分の1</text>
<text x="12" y="584" class="tm">MobileNet がこの仕組みを使う</text>
</svg>
