<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 768" role="img" aria-labelledby="fig-g-depthwise-separable-t fig-g-depthwise-separable-d">
<title id="fig-g-depthwise-separable-t">Depthwise Separable 畳み込み：2段に分けて、重みを減らす</title>
<desc id="fig-g-depthwise-separable-d">通常の畳み込みは、3×3×32のフィルタを出力チャネル数の64個もち、重みは3×3×32×64で18,432個。Depthwise Separable は2段に分ける。1段目のDepthwiseは、チャネルごとに3×3のフィルタを1枚ずつ当てる（32枚で288個）。2段目のPointwiseは、1×1×32のフィルタを64個使ってチャネルを混ぜる（2,048個）。合わせて2,336個で、通常のおよそ8分の1。バイアスは数えていない。MobileNet がこの仕組みを使う。言葉：重みはフィルタの各マスに入った、学習で決まる数で、3×3なら9個。chはチャネルで、特徴マップの枚数（カラー画像なら赤・緑・青の3枚）。「3×3×32を64個」は、3×3を入力の32チャネルぶん重ねた1組を、出力の64チャネルぶん用意すること。</desc>
<rect x="12" y="6" width="296" height="160" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="29" class="tb">言葉：重み・ch</text>
<text x="22" y="47">重み：フィルタの各マスに入った、</text>
<text x="22" y="65">　学習で決まる数（3×3 なら 9 個）</text>
<text x="22" y="83">ch：チャネル（特徴マップの枚数。</text>
<text x="22" y="101">　カラー画像なら赤・緑・青の 3 枚）</text>
<text x="22" y="119">「3×3×32 を64個」：3×3 を入力の</text>
<text x="22" y="137">　32ch ぶん重ねた1組を、出力の 64ch</text>
<text x="22" y="155">　ぶん用意する</text>
<text x="12" y="192" class="tb">通常の畳み込み</text>
<rect x="29" y="210" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="215" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="220" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="225" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="275" class="tm" text-anchor="middle">32ch</text>
<line x1="76" y1="238" x2="94" y2="238" class="l w2"/>
<polyline points="87,241.85 94,238 87,234.15" class="l w2"/>
<rect x="98" y="216" width="110" height="44" class="fs sa" stroke-width="1.5"/>
<text x="153" y="233.5" text-anchor="middle">3×3×32 を</text>
<text x="153" y="251.5" text-anchor="middle">64個</text>
<line x1="210" y1="238" x2="228" y2="238" class="l w2"/>
<polyline points="221,241.85 228,238 221,234.15" class="l w2"/>
<rect x="256" y="210" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="251" y="215" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="246" y="220" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="241" y="225" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="236" y="230" width="32" height="32" class="fas sok" stroke-width="1.5"/>
<text x="260" y="280" class="tm" text-anchor="middle">64ch</text>
<text x="12" y="306" class="tb">重み 3×3×32×64 ＝ 18,432</text>
<line x1="12" y1="322" x2="308" y2="322" class="l sb w1"/>
<text x="12" y="346" class="tb">2段に分ける</text>
<text x="12" y="368">① Depthwise：チャネルごとに 3×3 を1枚ずつ</text>
<rect x="29" y="386" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="391" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="396" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="401" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="451" class="tm" text-anchor="middle">32ch</text>
<rect x="18" y="390" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="390" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="390" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="18" y="396" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="396" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="396" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="18" y="402" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="24" y="402" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<rect x="30" y="402" width="6" height="6" class="fa sa" stroke-width="0.5"/>
<line x1="76" y1="410" x2="94" y2="410" class="l w2"/>
<polyline points="87,413.85 94,410 87,406.15" class="l w2"/>
<rect x="98" y="390" width="110" height="40" class="fs sa" stroke-width="1.5"/>
<text x="153" y="405.5" text-anchor="middle">3×3 を</text>
<text x="153" y="423.5" text-anchor="middle">32枚（1枚ずつ）</text>
<line x1="210" y1="410" x2="228" y2="410" class="l w2"/>
<polyline points="221,413.85 228,410 221,406.15" class="l w2"/>
<rect x="251" y="386" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="246" y="391" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="241" y="396" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="236" y="401" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="260" y="451" class="tm" text-anchor="middle">32ch</text>
<text x="12" y="468" class="tb">重み 3×3×32 ＝ 288</text>
<text x="12" y="504">② Pointwise：1×1 でチャネルを混ぜる</text>
<rect x="29" y="522" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="24" y="527" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="19" y="532" width="32" height="32" class="fs sa" stroke-width="1.5"/>
<rect x="14" y="537" width="32" height="32" class="fas sa" stroke-width="1.5"/>
<text x="38" y="587" class="tm" text-anchor="middle">32ch</text>
<line x1="76" y1="546" x2="94" y2="546" class="l w2"/>
<polyline points="87,549.85 94,546 87,542.15" class="l w2"/>
<rect x="98" y="526" width="110" height="40" class="fs sa" stroke-width="1.5"/>
<text x="153" y="541.5" text-anchor="middle">1×1×32 を</text>
<text x="153" y="559.5" text-anchor="middle">64個</text>
<line x1="210" y1="546" x2="228" y2="546" class="l w2"/>
<polyline points="221,549.85 228,546 221,542.15" class="l w2"/>
<rect x="256" y="522" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="251" y="527" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="246" y="532" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="241" y="537" width="32" height="32" class="fs sok" stroke-width="1.5"/>
<rect x="236" y="542" width="32" height="32" class="fas sok" stroke-width="1.5"/>
<text x="260" y="592" class="tm" text-anchor="middle">64ch</text>
<text x="12" y="604" class="tb">重み 32×64 ＝ 2,048</text>
<line x1="12" y1="620" x2="308" y2="620" class="l sb w1"/>
<text x="12" y="644" class="tb">重みの数をくらべる（バイアスは除く）</text>
<text x="12" y="670" class="tb">通常</text>
<rect x="60" y="656" width="248" height="18" class="fng sng" stroke-width="1.5"/>
<text x="300" y="670" class="tb" text-anchor="end">18,432</text>
<text x="12" y="702" class="tb">分離</text>
<rect x="60" y="688" width="31.43" height="18" class="fok sok" stroke-width="1.5"/>
<text x="99.43" y="702" class="tb">288＋2,048＝2,336</text>
<text x="12" y="734" class="tb tok">分離のほうが、およそ8分の1</text>
<text x="12" y="756" class="tm">MobileNet がこの仕組みを使う</text>
</svg>
