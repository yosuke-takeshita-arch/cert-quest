<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 836" role="img" aria-labelledby="fig-g-adadelta-t fig-g-adadelta-d">
<title id="fig-g-adadelta-t">AdaDelta：手で決める学習率の代わりに、最近の一歩の大きさ÷最近の勾配の大きさを使う</title>
<desc id="fig-g-adadelta-d">AdaDeltaは、学習率を手で決めずに一歩（1回の更新でパラメータを動かす量）を決める最適化手法。①それまでの困りごと：SGDは一歩＝学習率×勾配で、学習率（0.1か0.01か）を人が決め、学習し直して比べる。AdaGradは一歩＝学習率÷√(勾配の2乗の合計)×勾配で、合計は増え続けるので、勾配1が毎回来ると100回で1/10、1万回で1/100に縮み、更新が止まりかける。学習率もやはり人が決める。②AdaDeltaの一歩（ことばの式）：SGDで人が決める学習率の場所が、最近の一歩の大きさ÷最近の勾配の大きさに入れ替わり、それに今の勾配を掛ける。最近のは、古い分を少しずつ薄めた平均（指数移動平均）で、足し続けないので縮み続けない。大きさは2乗の平均の平方根。③例（数は説明のための例）：最近の一歩の大きさ0.02、最近の勾配の大きさ4、今の勾配4なら、一歩＝0.02÷4×4＝0.02。勾配がそろっていれば最近と同じくらいの一歩で、100回目でも1万回目でもAdaGradのように縮み続けない。④結果：学習率を手で決めなくてよい（原論文Zeiler 2012の主張）。決める数として、昔をどれだけ薄めるかのρ（原論文の実験は0.95）と、0で割らないための小さな数εは残る。</desc>
<text x="12" y="20" class="tb">AdaDelta：学習率を手で決めずに一歩を決める</text>
<text x="12" y="42" class="tm">一歩＝1回の更新でパラメータを動かす量</text>
<rect x="12" y="56" width="296" height="220" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="24" y="76" class="tb tng">① それまでの困りごと</text>
<text x="24" y="98" class="tb">SGD：一歩＝学習率×勾配</text>
<text x="24" y="118" class="tm">学習率（0.1？ 0.01？）を人が決め、</text>
<text x="24" y="136" class="tm">学習し直して比べる</text>
<text x="24" y="162" class="tb">AdaGrad：一歩＝学習率÷√(勾配の2乗の</text>
<text x="24" y="180" class="tb">合計)×勾配</text>
<text x="24" y="200" class="tm">合計は増え続ける。勾配 1 が毎回来ると</text>
<text x="24" y="218" class="tm">100回で1/10、1万回で1/100 に縮む</text>
<text x="24" y="240" class="tb tng">→ 更新が止まりかける</text>
<text x="24" y="262" class="tm">（学習率も、やはり人が決める）</text>
<line x1="160" y1="282" x2="160" y2="290.4" class="l sm w1"/>
<polygon points="160,296 156.5,290.4 163.5,290.4" class="fm"/>
<text x="12" y="318" class="tb">② AdaDelta の一歩（ことばの式）</text>
<text x="12" y="344" class="tb">SGD</text>
<rect x="76" y="328" width="150" height="26" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="151" y="346" class="tm" text-anchor="middle">学習率（人が決める）</text>
<text x="238" y="346" class="tb" text-anchor="middle">×</text>
<text x="250" y="346" class="tb">勾配</text>
<text x="12" y="396" class="tb">AdaDelta</text>
<rect x="76" y="378" width="150" height="44" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="151" y="396" class="tb" text-anchor="middle">最近の一歩の大きさ</text>
<text x="151" y="414" class="tb" text-anchor="middle">÷ 最近の勾配の大きさ</text>
<text x="238" y="404" class="tb" text-anchor="middle">×</text>
<text x="250" y="404" class="tb">今の勾配</text>
<line x1="151" y1="356" x2="151" y2="370" class="l sm w1"/>
<polygon points="151,376 147,369 155,369" class="l sm"/>
<text x="160" y="371" class="tm">入れ替わる</text>
<text x="12" y="448" class="tm">最近の＝古い分を少しずつ薄めた平均</text>
<text x="12" y="466" class="tm">　（足し続けないので、縮み続けない）</text>
<text x="12" y="484" class="tm">大きさ＝2乗の平均の平方根</text>
<line x1="160" y1="496" x2="160" y2="504.4" class="l sm w1"/>
<polygon points="160,510 156.5,504.4 163.5,504.4" class="fm"/>
<text x="12" y="532" class="tb">③ 例（数は説明のための例）</text>
<text x="12" y="554">最近の一歩の大きさ 0.02</text>
<text x="12" y="574">最近の勾配の大きさ 4、今の勾配 4</text>
<text x="12" y="598" class="tl ta">一歩＝0.02÷4×4＝0.02</text>
<text x="12" y="622" class="tm">勾配がそろっていれば、最近と同じくらい</text>
<text x="12" y="640" class="tm">の一歩。100回目でも1万回目でも、</text>
<text x="12" y="658" class="tm">AdaGrad のように縮み続けない</text>
<line x1="160" y1="670" x2="160" y2="678.4" class="l sm w1"/>
<polygon points="160,684 156.5,678.4 163.5,678.4" class="fm"/>
<rect x="12" y="690" width="296" height="132" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="710" class="tb tok">④ 結果</text>
<text x="24" y="732" class="tb">学習率を手で決めなくてよい</text>
<text x="24" y="752" class="tm">（原論文 Zeiler 2012 の主張）</text>
<text x="24" y="776" class="tm">決める数は残る：ρ＝昔をどれだけ薄めるか</text>
<text x="24" y="794" class="tm">（原論文の実験は 0.95）、ε＝0 で割らない</text>
<text x="24" y="812" class="tm">ための小さな数</text>
</svg>
