<text x="120" y="403" class="tm">1980年代</text>
<text x="120" y="423" class="tb ta">中心：知識（ルール）</text>
<text x="120" y="443">例 エキスパートシステム</text>
<text x="120" y="462" class="tm">（手本は70年代のMYCIN）</text>
<text x="120" y="482">例 第五世代コンピュータ</text>
