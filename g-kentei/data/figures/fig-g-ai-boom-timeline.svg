<text x="44" y="375" class="tm" text-anchor="end">1980</text>
<line x1="47" y1="470" x2="52" y2="470" class="l w1"/>
<text x="44" y="475" class="tm" text-anchor="end">1990</text>
<line x1="47" y1="570" x2="52" y2="570" class="l w1"/>
<text x="44" y="575" class="tm" text-anchor="end">2000</text>
<line x1="47" y1="670" x2="52" y2="670" class="l w1"/>
<text x="44" y="675" class="tm" text-anchor="end">2010</text>
<line x1="47" y1="770" x2="52" y2="770" class="l w1"/>
<text x="44" y="775" class="tm" text-anchor="end">2020</text>
<text x="44" y="855" class="tb" text-anchor="end">いま</text>
<text x="120" y="104" class="tl">第1次ブーム</text>
<text x="120" y="124" class="tm">50年代後半〜60年代</text>
<text x="120" y="146" class="tb ta">中心：探索・推論</text>
<text x="120" y="168">例 1956 ダートマス会議</text>
<text x="120" y="188" class="tm">（AIという分野名）</text>
<text x="120" y="210">例 ELIZA（60年代の会話）</text>
<text x="120" y="234" class="tb tng">冬①の理由：</text>
<text x="120" y="254" class="tng">簡単な問題しか解けない</text>
