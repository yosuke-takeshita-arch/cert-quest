<text x="120" y="596" class="tl">第3次ブーム</text>
<text x="120" y="616" class="tm">2000年代〜いまも続く</text>
<text x="120" y="638" class="tb ta">中心：機械学習・</text>
<text x="120" y="657" class="tb ta">ディープラーニング</text>
<text x="120" y="679">背景：ビッグデータと計算力</text>
<text x="120" y="701">例 2012 ILSVRC で</text>
<text x="120" y="720">ディープラーニングが優勝</text>
<text x="120" y="742">例 2016 アルファ碁が</text>
<text x="120" y="761">囲碁の九段に4勝1敗</text>
<text x="120" y="790" class="tb">2022 ChatGPT 公開</text>
<text x="120" y="810">生成AIが急速に広がる</text>
<text x="120" y="830" class="tm">（点線）第4次と呼ぶ</text>
<text x="120" y="849" class="tm">人もいるが、定まっていない</text>
<text x="12" y="890" class="tb">中心の流れ：探索・推論 → 知識</text>
<text x="12" y="910" class="tb">→ データから学ぶ</text>
<text x="12" y="934">第1次・第2次は人が書いたルールで動く</text>
<text x="12" y="953">第3次は機械がデータから学ぶ</text>
<text x="12" y="977" class="tm">ふくらみの幅は目安（測った値ではない）</text>
<text x="12" y="1000" class="tb">G検定では第1次〜第3次として問われる</text>
</svg>
