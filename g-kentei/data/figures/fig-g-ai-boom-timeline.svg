<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1010" role="img" aria-labelledby="fig-g-ai-boom-timeline-t fig-g-ai-boom-timeline-d">
<title id="fig-g-ai-boom-timeline-t">AIブームと冬の時代の年表（1950年代から現在まで）</title>
<desc id="fig-g-ai-boom-timeline-d">上から下へ時間が進む年表。左に1950年から2020年までの年の目盛り。目盛りの右のふくらみは、そのころの盛り上がりの目安で、量を測った値ではない。第1次ブームは1950年代後半から1960年代で、中心は探索と推論。例は1956年のダートマス会議（AIという分野名が生まれた）と、1960年代の会話プログラムELIZA。冬の時代1の理由は、迷路やパズルのような簡単な問題しか解けず、現実の問題は解けなかったこと。その後、冬の時代1で研究が下火になる。第2次ブームは1980年代で、中心はルールの形で書き込んだ知識。例はエキスパートシステム（手本は1970年代のMYCIN）と、日本の第五世代コンピュータ計画。冬の時代2の理由は、知識を人が書き切れなかったこと。1995年頃から冬の時代2。第3次ブームは2000年代からいまも続き、中心は機械学習とディープラーニング。背景はビッグデータと計算力。例は2012年の画像認識の競技会ILSVRCでのディープラーニングの優勝と、2016年にアルファ碁が囲碁の九段に4勝1敗したこと。2022年にChatGPTが公開され、生成AIが急速に広がった（点線のふくらみ）。これを第4次と呼ぶ人もいるが、呼び方は定まっていない。中心の流れは、探索・推論、知識、データから学ぶ、の順。第1次と第2次は人がルールや知識を書き、第3次は機械がデータから学ぶ。G検定では第1次から第3次として問われる。</desc>
<text x="12" y="20" class="tb">上から下へ時間が進む</text>
<text x="12" y="40" class="tm">ふくらみ＝盛り上がりの目安</text>
