<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 730" role="img" aria-labelledby="fig-g-normal-distribution-t fig-g-normal-distribution-d">
<title id="fig-g-normal-distribution-t">正規分布と確率密度：確率は面積</title>
<desc id="fig-g-normal-distribution-d">上は正規分布の釣り鐘型の曲線。平均を中心に左右対称で、平均・中央値・最頻値が一致し、平均と標準偏差で形が決まる。平均からプラスマイナス1標準偏差の範囲に約68%、プラスマイナス2標準偏差の範囲に約95%が入る。中は一般の確率密度関数f(x)で、aからbの区間の面積が、Xがその区間に入る確率。ちょうど1点になる確率は0。下は中心極限定理。標本平均の分布は正規分布に近づき、そのばらつき（標準偏差）は元の標準偏差σを標本の大きさnの平方根で割った値、σ割るルートn。</desc>
