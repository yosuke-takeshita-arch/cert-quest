<title id="fig-g-diffusion-t">拡散モデル：ノイズを足す順過程と、取り除く逆過程</title>
<desc id="fig-g-diffusion-d">左から右へ、画像 x0 にガウスノイズを少しずつ足していき、最後に純粋なノイズ xT になる5コマ。ノイズを足す向きを順過程（拡散過程）といい、固定の過程で学習しない。逆に、ノイズから少しずつノイズを取り除いて元に戻す向きを逆過程といい、こちらをニューラルネットで学習する。画像を生成するときは、純粋なノイズから逆過程をたどる。</desc>
