<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 648" role="img" aria-labelledby="fig-g-moe-t fig-g-moe-d">
<title id="fig-g-moe-t">Mixture of Experts：ルーターがトークンごとに8個のうち2個のエキスパートを選ぶ（Mixtral 8x7B）</title>
<desc id="fig-g-moe-d">例は Mixtral 8x7B の1つの層。エキスパートは小さなネットワーク（フィードフォワードのブロック）で、1から8までの8個ある。ルーターは、どのエキスパートを使うかを選ぶ役。トークン「猫」が来ると、ルーターは8個のうちエキスパート3と6の2個を選び、その2つの出力を混ぜて次へ渡す。残りの6個は計算しない。次のトークン「が」では、選び直してエキスパート1と5を使う。トークンの例は説明のためのもの。下の横棒グラフは、棒の長さがパラメータの数。モデル全体のパラメータは470億、1トークンの推論に使うのは130億だけ。ふつうのネットワークはどの入力にも全部のパラメータを使う。Switch Transformer は1個だけを選ぶ（k＝1）。</desc>
<text x="12" y="20" class="tb">MoE：8個のうち2個だけ動かす（1つの層）</text>
<text x="12" y="40" class="tm">エキスパート＝小さなネットワーク</text>
<text x="12" y="58" class="tm">ルーター＝どれを使うか選ぶ役</text>
<rect x="100" y="72" width="120" height="30" class="fs sa" stroke-width="1.5" rx="6"/>
<text x="160" y="92" class="tb" text-anchor="middle">トークン「猫」</text>
<line x1="160" y1="102" x2="160" y2="110.4" class="l sm w1"/>
<polygon points="160,116 156.5,110.4 163.5,110.4" class="fm"/>
<rect x="100" y="118" width="120" height="30" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="138" class="tb ta" text-anchor="middle">ルーター</text>
<line x1="160" y1="148" x2="160" y2="156" class="l sm w1"/>
<line x1="93" y1="156" x2="204" y2="156" class="l sa w2"/>
<line x1="93" y1="156" x2="93" y2="166" class="l sa w2"/>
<line x1="204" y1="156" x2="204" y2="166" class="l sa w2"/>
<rect x="16" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="31" y="188" class="tm" text-anchor="middle">1</text>
<rect x="53" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="68" y="188" class="tm" text-anchor="middle">2</text>
<rect x="88" y="166" width="34" height="34" class="fok sok" stroke-width="2" rx="4"/>
<text x="105" y="188" class="tb tok" text-anchor="middle">3</text>
<rect x="127" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="142" y="188" class="tm" text-anchor="middle">4</text>
<rect x="164" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="179" y="188" class="tm" text-anchor="middle">5</text>
<rect x="199" y="166" width="34" height="34" class="fok sok" stroke-width="2" rx="4"/>
<text x="216" y="188" class="tb tok" text-anchor="middle">6</text>
<rect x="238" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="253" y="188" class="tm" text-anchor="middle">7</text>
<rect x="275" y="168" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="290" y="188" class="tm" text-anchor="middle">8</text>
<line x1="105" y1="200" x2="105" y2="210" class="l sok w2"/>
<line x1="216" y1="200" x2="216" y2="210" class="l sok w2"/>
<line x1="105" y1="210" x2="216" y2="210" class="l sok w2"/>
<line x1="160" y1="210" x2="160" y2="218.4" class="l sm w1"/>
<polygon points="160,224 156.5,218.4 163.5,218.4" class="fm"/>
<rect x="60" y="226" width="200" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="246" class="tb tok" text-anchor="middle">2つの出力を混ぜて次へ</text>
<text x="12" y="278" class="tm">点線の6個は、このトークンでは計算しない</text>
<line x1="12" y1="292" x2="308" y2="292" class="l sb w1"/>
<text x="12" y="314" class="tb">次のトークン「が」では選び直す</text>
<rect x="14" y="324" width="34" height="34" class="fok sok" stroke-width="2" rx="4"/>
<text x="31" y="346" class="tb tok" text-anchor="middle">1</text>
<rect x="53" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="68" y="346" class="tm" text-anchor="middle">2</text>
<rect x="90" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="105" y="346" class="tm" text-anchor="middle">3</text>
<rect x="127" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="142" y="346" class="tm" text-anchor="middle">4</text>
<rect x="162" y="324" width="34" height="34" class="fok sok" stroke-width="2" rx="4"/>
<text x="179" y="346" class="tb tok" text-anchor="middle">5</text>
<rect x="201" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="216" y="346" class="tm" text-anchor="middle">6</text>
<rect x="238" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="253" y="346" class="tm" text-anchor="middle">7</text>
<rect x="275" y="326" width="30" height="30" class="fs sm dsh" stroke-width="1" rx="4"/>
<text x="290" y="346" class="tm" text-anchor="middle">8</text>
<text x="12" y="382" class="tm">トークンごと・層ごとに、ルーターが選ぶ</text>
<line x1="12" y1="398" x2="308" y2="398" class="l sb w1"/>
<text x="12" y="422" class="tb">横棒グラフ：パラメータの数</text>
<text x="12" y="442" class="tm">棒の長さ＝パラメータ（重み）の数</text>
<text x="12" y="468">モデル全体</text>
<rect x="12" y="476" width="235" height="20" class="fs l sm"/>
<text x="253" y="491" class="tb">470億</text>
<text x="12" y="520">1トークンに使う</text>
<rect x="12" y="528" width="65" height="20" class="fok l sok"/>
<text x="83" y="543" class="tb tok">130億だけ</text>
<text x="12" y="576" class="tm">ふつうのネットワーク：毎回全部を使う</text>
<text x="12" y="596" class="tm">Switch Transformer：1個だけ選ぶ（k＝1）</text>
<text x="12" y="618" class="tm">例：Mixtral 8x7B。トークン＝語の断片</text>
<text x="12" y="636" class="tm">（「猫」「が」は説明のための例）</text>
</svg>
