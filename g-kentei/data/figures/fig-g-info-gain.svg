<text x="12" y="326" class="tb tok">→ 利得が大きい①で分ける</text>
<text x="12" y="354" class="tm">箱の下の数＝その側のエントロピー</text>
<text x="12" y="376" class="tm">3対1の側（底2の対数）：</text>
<text x="12" y="394" class="tm">−0.75×log₂0.75−0.25×log₂0.25</text>
