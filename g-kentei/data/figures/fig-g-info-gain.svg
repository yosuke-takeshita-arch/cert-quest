<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-g-info-gain-t fig-g-info-gain-d">
<title id="fig-g-info-gain-t">情報利得：分ける前のエントロピーから、分けた後のエントロピーの平均を引く。大きい条件で分ける</title>
<desc id="fig-g-info-gain-d">例（説明用の数、底2の対数）は、クラスA（丸）4件とクラスB（四角）4件の8件。エントロピーはクラスの混ざり具合で、1種類だけなら0、半々なら1。分ける前は半々なのでエントロピー1。条件①で分けると、A4件・B0件と、A0件・B4件になり、どちらもエントロピー0、平均0で、情報利得は1−0＝1。条件②で分けると、A3件・B1件と、A1件・B3件になる。3対1の側のエントロピーは−0.75×log₂0.75−0.25×log₂0.25≈0.75×0.415＋0.25×2≈0.311＋0.5＝0.811で、両側とも0.811、平均も0.811なので、情報利得は1−0.811＝0.189。情報利得が大きい条件①で分ける。平均は各側の件数の割合で重みを付ける（ここは4件ずつなので半々）。分ける前の1はどの条件でも同じなので、情報利得が最大の条件は、分けた後の混ざり具合の平均が最小の条件と同じ。</desc>
<text x="12" y="20" class="tb">情報利得：混ざり具合がどれだけ減ったか</text>
<text x="12" y="40" class="tm">情報利得＝分ける前のエントロピー</text>
<text x="12" y="58" class="tm">　　　　−分けた後のエントロピーの平均</text>
<text x="12" y="76" class="tm">エントロピー＝クラスの混ざり具合</text>
<text x="12" y="94" class="tm">（1種類だけなら0、半々なら1）</text>
<rect x="70" y="106" width="180" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<circle cx="104" cy="122" r="4" class="fa"/>
