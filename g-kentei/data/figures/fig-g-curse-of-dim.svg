<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 770" role="img" aria-labelledby="fig-g-curse-of-dim-t fig-g-curse-of-dim-d">
<title id="fig-g-curse-of-dim-t">次元の呪い：同じ10個の点でも、次元が増えると空間がすかすかになる</title>
<desc id="fig-g-curse-of-dim-d">同じ10個の点を、1次元・2次元・3次元の空間に置いた例。1次元は10マスで、点が入るマスは10個中10個。2次元は10かける10の100マスで、点が入るマスは100個中10個。3次元は10かける10かける10の1000マスで、点が入るマスは1000個中10個。次元が増えるとマスの数が指数的に増え、同じ点の数ではデータ空間がすかすかになる。そのため必要なデータ量や計算量が急増する。対策は次元削減や特徴選択。</desc>
<text x="12" y="20" class="tb">① 1次元：10マス、点10個</text>
