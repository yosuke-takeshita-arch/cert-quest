<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 808" role="img" aria-labelledby="fig-g-group-norm-t fig-g-group-norm-d">
<title id="fig-g-group-norm-t">グループ正規化：1枚の中でチャネルを束に分け、束ごとに平均と分散をとる</title>
<desc id="fig-g-group-norm-d">正規化は、平均と分散で値のばらつきをそろえること。①困りごと：物体検出などでメモリの都合で1回に2枚しか入らないと、バッチ正規化はその2枚だけで平均・分散を出すので毎回ぶれる。グループ正規化は1枚の画像の中だけで計算するので、1回に何枚入るかに左右されない。②1枚の中の64チャネル（細い棒1本がチャネル1枚、つまり特徴マップ1枚）を2枚ずつ32の束に分ける（数は例）。束1はチャネル1と2、束32はチャネル63と64。束ごとに、2枚の特徴マップの全画素で平均と分散を1組とってそろえる。③束の数でほかの正規化とつながる（チャネル1〜8を拡大して描き、太い枠1つが平均と分散を1組とる範囲）。束が1つ（64枚まとめて）ならレイヤー正規化、束32（2枚ずつ）がグループ正規化、束64（1枚ずつ）ならインスタンス正規化と同じ。④原論文の結果：ResNet-50 を ImageNet で学習し、バッチ2のときの誤り率はバッチ正規化34.7%、グループ正規化24.1%。普通のバッチの大きさでは同じくらい。</desc>
<text x="12" y="20" class="tb">グループ正規化：チャネルを束に分けてそろえる</text>
<text x="12" y="42" class="tm">正規化＝平均と分散で、値のばらつきをそろえる</text>
<rect x="12" y="54" width="296" height="136" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="24" y="74" class="tb">① 困りごと：1回に2枚しか入らない</text>
<rect x="28" y="86" width="34" height="34" class="fs sm" stroke-width="1.5"/>
<rect x="70" y="86" width="34" height="34" class="fs sm" stroke-width="1.5"/>
