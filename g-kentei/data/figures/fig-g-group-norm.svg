<text x="118" y="98">バッチ正規化は、この2枚だけで</text>
<text x="118" y="116">平均・分散を出す → 毎回ぶれる</text>
<text x="24" y="150">グループ正規化は1枚の中だけで計算</text>
<text x="24" y="170" class="tb">→ 1回に何枚入るかに左右されない</text>
