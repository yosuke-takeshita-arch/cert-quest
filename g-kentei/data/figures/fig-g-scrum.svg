<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 940" role="img" aria-labelledby="fig-g-scrum-t fig-g-scrum-d">
<title id="fig-g-scrum-t">スクラム：1か月以内の決まった長さのスプリントを、間を空けずに繰り返す</title>
<desc id="fig-g-scrum-d">スクラムは、チームで短い期間ごとに作っては見直す、ソフトウェアの作り方の枠組み。手引きはスクラムガイド2020年版。スプリントは、作って確かめる1回分の期間。①何に困っていたか：最初に全部決めて長く作ると、ずれに気づくのが最後になる。スクラムガイドは、スプリントが長すぎるとリスクが高まり、短くすれば学習のサイクルが増えるとしている。②スプリントのくり返し：例として2週間と決めたら、スプリント1・2・3を同じ2週間で、間を空けずに続ける。長さは1か月以内の決まった長さで、前のスプリントが終わり次第、次が始まる。長さを毎回変えたり数か月に延ばしたりはしない。2週間は説明のための例。③1回のスプリントの中：スプリントプランニングでスプリントゴールを決め、毎日15分のデイリースクラムで開発者がゴールへの進み具合を確かめ、スプリントレビューで成果を確かめ、スプリントレトロスペクティブでやり方を見直して終わる。スプリントの途中では、スプリントゴールの達成を危うくする変更はしない。④スクラムチーム：プロダクトオーナー1人、スクラムマスター1人、複数人の開発者。サブチームや階層は置かず、通常10人以下。</desc>
<text x="12" y="20" class="tb">スクラム：短いスプリントを繰り返す</text>
<text x="12" y="42" class="tm">スクラム＝チームで短い期間ごとに作っては</text>
<text x="12" y="60" class="tm">見直す枠組み（手引き：スクラムガイド 2020年版）</text>
<text x="12" y="78" class="tm">スプリント＝作って確かめる1回分の期間</text>
<line x1="12" y1="92" x2="308" y2="92" class="l sb w1"/>
<text x="12" y="114" class="tb">① 何に困っていたか</text>
<text x="12" y="136">最初に全部決めて長く作ると、ずれに</text>
<text x="12" y="154">気づくのが最後になる</text>
<text x="12" y="176" class="tm">スクラムガイド：スプリントが長すぎると</text>
<text x="12" y="194" class="tm">リスクが高まる。短くすれば、作って学ぶ</text>
<text x="12" y="212" class="tm">回数（学習のサイクル）が増える</text>
<line x1="12" y1="226" x2="308" y2="226" class="l sb w1"/>
<text x="12" y="248" class="tb">② スプリントのくり返し（例：2週間）</text>
<rect x="12" y="260" width="96" height="44" class="fas sa" stroke-width="1.5"/>
<text x="60" y="279" class="tb ta" text-anchor="middle">スプリント1</text>
<text x="60" y="296" class="tm" text-anchor="middle">2週間</text>
<rect x="112" y="260" width="96" height="44" class="fas sa" stroke-width="1.5"/>
<text x="160" y="279" class="tb ta" text-anchor="middle">スプリント2</text>
<text x="160" y="296" class="tm" text-anchor="middle">2週間</text>
<rect x="212" y="260" width="96" height="44" class="fas sa" stroke-width="1.5"/>
<text x="260" y="279" class="tb ta" text-anchor="middle">スプリント3</text>
<text x="260" y="296" class="tm" text-anchor="middle">2週間</text>
<text x="12" y="326">・長さは1か月以内の決まった長さ</text>
<text x="12" y="346">・前が終わり次第、次が始まる（間を空けない）</text>
<rect x="12" y="360" width="296" height="48" class="fng sng" stroke-width="1.5" rx="4"/>
<text x="20" y="380" class="tb tng">しない：長さを毎回変える・数か月に延ばす</text>
<text x="20" y="398" class="tm">→ 作って確かめる回数が減り、失敗に遅れて気づく</text>
<text x="12" y="428" class="tm">（2週間は説明のための例）</text>
<line x1="12" y1="442" x2="308" y2="442" class="l sb w1"/>
<text x="12" y="464" class="tb">③ 1回のスプリントの中（上から順に）</text>
<rect x="12" y="474" width="296" height="40" class="fs sm" stroke-width="1"/>
<text x="20" y="491" class="tb">スプリントプランニング</text>
<text x="20" y="507" class="tm">このスプリントのゴール（スプリントゴール）を決める</text>
<rect x="12" y="522" width="296" height="40" class="fok sok" stroke-width="1.5"/>
<text x="20" y="539" class="tb tok">デイリースクラム（毎日 15分）</text>
<text x="20" y="555" class="tm">開発者が、ゴールへの進み具合を確かめる</text>
<rect x="12" y="570" width="296" height="40" class="fs sm" stroke-width="1"/>
<text x="20" y="587" class="tb">スプリントレビュー</text>
<text x="20" y="603" class="tm">できた成果を関係者と確かめる</text>
<rect x="12" y="618" width="296" height="40" class="fs sm" stroke-width="1"/>
<text x="20" y="635" class="tb">スプリントレトロスペクティブ</text>
<text x="20" y="651" class="tm">やり方を見直す。これでスプリントが終わる</text>
<line x1="160" y1="514" x2="160" y2="522" class="l sm w1"/>
<line x1="160" y1="562" x2="160" y2="570" class="l sm w1"/>
<line x1="160" y1="610" x2="160" y2="618" class="l sm w1"/>
<text x="12" y="682">途中では、スプリントゴールの達成を</text>
<text x="12" y="700">危うくするような変更はしない</text>
<text x="12" y="718" class="tm">（途中でゴールを動かすと、何を作るかが定まらない）</text>
<line x1="12" y1="732" x2="308" y2="732" class="l sb w1"/>
<text x="12" y="754" class="tb">④ スクラムチーム（通常 10人以下）</text>
<rect x="12" y="766" width="94" height="58" class="fs sm" stroke-width="1" rx="6"/>
<text x="59" y="787" class="tb" text-anchor="middle">プロダクト</text>
<text x="59" y="803" class="tb" text-anchor="middle">オーナー</text>
<text x="59" y="819" class="tb ta" text-anchor="middle">1人</text>
<rect x="113" y="766" width="94" height="58" class="fs sm" stroke-width="1" rx="6"/>
<text x="160" y="787" class="tb" text-anchor="middle">スクラム</text>
<text x="160" y="803" class="tb" text-anchor="middle">マスター</text>
<text x="160" y="819" class="tb ta" text-anchor="middle">1人</text>
<rect x="214" y="766" width="94" height="58" class="fs sm" stroke-width="1" rx="6"/>
<text x="261" y="795" class="tb" text-anchor="middle">開発者</text>
<text x="261" y="819" class="tb ta" text-anchor="middle">複数人</text>
<text x="12" y="846" class="tm">チームの中に、サブチームや階層は置かない</text>
<rect x="12" y="862" width="296" height="64" class="fok sok" stroke-width="1.5" rx="4"/>
<text x="160" y="884" class="tb tok" text-anchor="middle">スプリントの長さは、成果物に合わせて</text>
<text x="160" y="904" class="tb tok" text-anchor="middle">変えない。1か月以内の同じ長さで</text>
<text x="160" y="922" class="tb tok" text-anchor="middle">くり返す</text>
</svg>
