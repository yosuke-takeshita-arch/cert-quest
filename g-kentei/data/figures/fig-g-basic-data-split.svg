<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-g-basic-data-split-t fig-g-basic-data-split-d">
<title id="fig-g-basic-data-split-t">訓練データ・検証データ・テストデータ</title>
<desc id="fig-g-basic-data-split-d">正解つきのデータ100件を、重ならないように3つに分けた横長の帯。訓練データ70件、検証データ15件、テストデータ15件。1、訓練データはパラメータ（重み）を学ぶのに使う。学校にたとえると教科書と問題集。2、検証データは、学習率などのハイパーパラメータやモデルを選ぶ、学習を止めるときを決めるのに使う。たとえると模試。3、テストデータは、最後に1回だけ、まだ見ていないデータでの実力を測るのに使う。たとえると本番の試験。注意：テストデータを見ながら選び直すと、テストの点が本当の実力より良く見える。分け方の割合と件数は説明のための例。</desc>
<text x="12" y="22" class="tl">データは3つに分けて使う</text>
<text x="12" y="44" class="tm">例：正解つきのデータ100件（割合は例）</text>
<rect x="12" y="60" width="207" height="44" class="fas sa" stroke-width="1.5"/>
<rect x="219" y="60" width="44" height="44" class="fwn swn" stroke-width="1.5"/>
<rect x="263" y="60" width="45" height="44" class="fok sok" stroke-width="1.5"/>
<text x="115" y="87" class="tb ta" text-anchor="middle">訓練 70件</text>
<text x="241" y="87" class="tb twn" text-anchor="middle">15</text>
<text x="285" y="87" class="tb tok" text-anchor="middle">15</text>
<text x="241" y="122" class="tm" text-anchor="middle">検証</text>
<text x="285" y="122" class="tm" text-anchor="middle">テスト</text>
<rect x="12" y="140" width="296" height="80" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="24" y="164" class="tb ta">1 訓練データ（学習データ）</text>
<text x="24" y="186">パラメータ（重み）を学ぶ</text>
<text x="24" y="208" class="tm">たとえ：教科書と問題集</text>
<rect x="12" y="230" width="296" height="80" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="24" y="254" class="tb twn">2 検証データ</text>
<text x="24" y="276">ハイパーパラメータ・止めどきを選ぶ</text>
<text x="24" y="298" class="tm">たとえ：模試</text>
<rect x="12" y="320" width="296" height="80" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="344" class="tb tok">3 テストデータ</text>
<text x="24" y="366">最後に1回だけ、実力を測る</text>
<text x="24" y="388" class="tm">たとえ：本番の試験</text>
<text x="12" y="428" class="tb tng">テストを見ながら選び直すと、</text>
<text x="12" y="450" class="tb tng">点が本当の実力より良く見える</text>
</svg>
