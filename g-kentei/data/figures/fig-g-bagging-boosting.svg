<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 686" role="img" aria-labelledby="fig-g-bagging-boosting-t fig-g-bagging-boosting-d">
<title id="fig-g-bagging-boosting-t">バギングとブースティング：並列と逐次</title>
<desc id="fig-g-bagging-boosting-d">上はバギング。元データから、同じ点を重複して選べる復元抽出（ブートストラップ）で3つのデータを作り、3つのモデルを並列に学習して、多数決か平均でまとめる。ランダムフォレストは、さらに分割ごとに特徴量も一部だけランダムに選ぶ。下はブースティング。モデルを1つずつ順に作り、前のモデルが間違えた点の重みを上げて次のモデルに渡し、最後に重み付きでまとめる。勾配ブースティングは、前の誤差（損失の負の勾配）を次の木が予測して足していく。</desc>
<text x="12" y="20" class="tb">① バギング：並列に作ってまとめる</text>
<text x="12" y="46" class="tm">元データ</text>
