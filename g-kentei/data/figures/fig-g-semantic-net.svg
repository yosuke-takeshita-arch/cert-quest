<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 604" role="img" aria-labelledby="fig-g-semantic-net-t fig-g-semantic-net-d">
<title id="fig-g-semantic-net-t">意味ネットワーク：is-a・part-of・has-a の向き</title>
<desc id="fig-g-semantic-net-d">概念を節点、関係をラベル付きの矢印で結んだ意味ネットワークの例。カナリアから鳥へ、鳥から動物へ、is-aの矢印（AはBの一種）。翼から鳥へ、part-ofの矢印（AはBの一部）。同じ関係を逆から言うとhas-a（鳥は翼を持つ）。動物に付いた性質「呼吸する」は、is-aの矢印をたどって鳥とカナリアに受け継がれる（継承）ので、書いていなくても、カナリアは呼吸すると導ける。is-aでは推移律が成り立つ。part-ofは部分の種類によって推移律が成り立たないことがある。</desc>
<text x="12" y="20" class="tb">① 概念を節点、関係を矢印にした図</text>
<rect x="80" y="54" width="82" height="38" class="fas sa" stroke-width="1.5"/>
<text x="121" y="77.5" class="tb" text-anchor="middle">動物</text>
<rect x="80" y="150" width="82" height="38" class="fas sa" stroke-width="1.5"/>
<text x="121" y="173.5" class="tb" text-anchor="middle">鳥</text>
<rect x="80" y="246" width="82" height="38" class="fas sa" stroke-width="1.5"/>
<text x="121" y="269.5" class="tb" text-anchor="middle">カナリア</text>
<line x1="121" y1="244" x2="121" y2="191" class="l sa w2"/>
<polyline points="125.4,199 121,191 116.6,199" class="l sa w2"/>
<text x="129" y="222" class="tb ta">is-a</text>
<line x1="121" y1="148" x2="121" y2="95" class="l sa w2"/>
<polyline points="125.4,103 121,95 116.6,103" class="l sa w2"/>
<text x="129" y="126" class="tb ta">is-a</text>
<rect x="236" y="150" width="68" height="38" class="fwn swn" stroke-width="1.5"/>
<text x="270" y="173.5" class="tb" text-anchor="middle">翼</text>
<line x1="234" y1="169" x2="165" y2="169" class="l swn w2"/>
<polyline points="173,164.6 165,169 173,173.4" class="l swn w2"/>
<text x="170" y="161" class="tb twn">part-of</text>
<rect x="214" y="54" width="94" height="38" class="fs sb" stroke-width="1.5"/>
<text x="261" y="77.5" text-anchor="middle">呼吸する</text>
<line x1="162" y1="73" x2="214" y2="73" class="l sm w1"/>
<rect x="214" y="246" width="94" height="38" class="fs sa" stroke-width="1.5"/>
<text x="261" y="269.5" text-anchor="middle">呼吸する</text>
<line x1="162" y1="265" x2="214" y2="265" class="l sa w1 dsh"/>
<text x="214" y="304" class="tm">継承で導ける</text>
<line x1="58" y1="73" x2="58" y2="265" class="l sok w1 dsh"/>
<polyline points="53.6,257 58,265 62.4,257" class="l sok w1"/>
<text x="12" y="174" class="tb tok">継承</text>
<line x1="12" y1="316" x2="308" y2="316" class="l sb w1"/>
<text x="12" y="340" class="tb">② 3つの関係の向き</text>
<text x="12" y="366" class="tb">A is-a B：AはBの一種</text>
<text x="12" y="386" class="tm">　上位・下位。性質は下へ継承される</text>
<text x="12" y="406" class="tm">　カナリア→鳥→動物なら カナリア→動物</text>
<text x="12" y="434" class="tb">A part-of B：AはBの一部</text>
<text x="12" y="454" class="tm">　全体と部分。種類によっては</text>
<text x="12" y="474" class="tm">　推移律が成り立たないことがある</text>
<text x="12" y="502" class="tb">B has-a A：BはAを持つ</text>
<text x="12" y="522" class="tm">　part-of の逆向きの言い方</text>
<line x1="12" y1="544" x2="308" y2="544" class="l sb w1"/>
<text x="12" y="572">オントロジー：概念と関係を、共通の</text>
<text x="12" y="592">語彙として形式的に定義したもの</text>
</svg>
