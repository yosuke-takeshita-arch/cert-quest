<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 866" role="img" aria-labelledby="fig-g-optimizers-t fig-g-optimizers-d">
<title id="fig-g-optimizers-t">最適化手法の系譜と、モーメンタムの効果</title>
<desc id="fig-g-optimizers-d">上は、細長い谷の形の誤差の等高線の上を、同じ出発点から進む2つの軌跡。SGDは谷の短い方向に行ったり来たりしてジグザグに進む。モーメンタムは直前の更新の向き（勢い）を足すので、ジグザグが抑えられてなめらかに谷底へ向かう。下は系譜図で、①の赤（SGD）と青（モーメンタム）は、下の系譜図の同じ名前の箱と同じ色。SGDからモーメンタムとAdaGradが生まれる。AdaGradは勾配の二乗を累積して学習率を割り、その改良がRMSprop（指数移動平均で古い勾配を薄める）とAdaDelta（学習率の手動設定が不要）。モーメンタムとRMSpropの考え方を合わせたのがAdam。Adamの学習率に上限と下限をつけたのがAdaBound、AMSGradに上限と下限をつけたのがAMSBound。</desc>
<text x="12" y="20" class="tb">① 谷に沿って進む：同じ出発点から</text>
