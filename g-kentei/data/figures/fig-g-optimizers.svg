<text x="48" y="64.8" class="tm">出発</text>
<text x="12" y="206" class="tb tng">赤の細い線：SGD（ジグザグ）</text>
<text x="12" y="226" class="tb ta">青の太い線：モーメンタム（なめらか）</text>
<text x="12" y="246" class="tm">（イメージ図。実際の値ではない）</text>
<line x1="12" y1="262" x2="308" y2="262" class="l sb w1"/>
<text x="12" y="286" class="tb">② 系譜：何を何に足したか</text>
<rect x="12" y="302" width="274" height="44" class="fs sng" stroke-width="1.5" rx="6"/>
<text x="22" y="320" class="tb">SGD</text>
<text x="22" y="338" class="tm">一部のデータで勾配を求めて更新</text>
<rect x="36" y="358" width="250" height="44" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="46" y="376" class="tb">モーメンタム</text>
<text x="46" y="394" class="tm">直前の更新の向き（勢い）を足す</text>
<rect x="36" y="414" width="250" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="46" y="432" class="tb">AdaGrad</text>
<text x="46" y="450" class="tm">勾配の二乗を累積して学習率を割る</text>
<rect x="60" y="470" width="226" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="70" y="488" class="tb">RMSprop</text>
<text x="70" y="506" class="tm">指数移動平均で古い勾配を薄める</text>
<rect x="60" y="526" width="226" height="44" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="70" y="544" class="tb">AdaDelta</text>
<text x="70" y="562" class="tm">学習率の手動設定が不要</text>
<rect x="36" y="582" width="250" height="44" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="46" y="600" class="tb">Adam</text>
<text x="46" y="618" class="tm">1次・2次モーメントを使う</text>
<rect x="60" y="638" width="226" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="70" y="656" class="tb">AdaBound</text>
<text x="70" y="674" class="tm">Adam の学習率に上限と下限</text>
<rect x="60" y="694" width="226" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="70" y="712" class="tb">AMSGrad</text>
<text x="70" y="730" class="tm">Adam の改良の1つ</text>
<rect x="84" y="750" width="202" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="94" y="768" class="tb">AMSBound</text>
<text x="94" y="786" class="tm">AMSGrad に上限と下限</text>
