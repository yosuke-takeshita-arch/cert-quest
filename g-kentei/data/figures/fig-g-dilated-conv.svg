<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 562" role="img" aria-labelledby="fig-g-dilated-conv-t fig-g-dilated-conv-d">
<title id="fig-g-dilated-conv-t">Dilated（Atrous）畳み込みと、WaveNet の因果的な畳み込み</title>
<desc id="fig-g-dilated-conv-d">上は2次元の格子。通常の3×3のフィルタは隣り合う9マスを見るので、見る範囲は3×3。間隔2のDilated畳み込みは、1マスおきの9マスを見るので、見る範囲は5×5になる。どちらも重みの数は9個で同じ。下は WaveNet の1次元の例。dilation（間隔）を1、2、4、8と倍にした4層を重ねると、出力の1点が過去の16サンプルを見る。未来のサンプルは見ない（因果的）。</desc>
