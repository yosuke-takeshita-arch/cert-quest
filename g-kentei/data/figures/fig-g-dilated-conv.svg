<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 642" role="img" aria-labelledby="fig-g-dilated-conv-t fig-g-dilated-conv-d">
<title id="fig-g-dilated-conv-t">Dilated（Atrous）畳み込み：重みの間に隙間をあけて、広く見る</title>
<desc id="fig-g-dilated-conv-d">なぜ欲しいか：セグメンテーション（画素ごとに何が写っているかを答える課題）では、広く見て文脈をつかみたいが、位置も要る。プーリングで縮めると特徴マップが小さくなり、細かい位置が失われる。フィルタを大きくすると重みが増える（7×7なら49個）。隙間をあければ、重み9個のまま、特徴マップも縮めずに広く見られる。①は2次元の格子で、黒丸が重み。通常の3×3は隣り合う9マスに重みが1つずつあり、見る範囲は3×3。間隔2のDilated畳み込みは1マスおきの9マスに重みがあり、見る範囲は5×5。どちらも重みは9個。見る範囲の1辺は（3−1）×間隔＋1。②は1列に並んだデータで、重み3個の畳み込みを、間隔1、2、4と3段重ねる。いちばん上の1点が、入力の15点を見ている。間隔1のまま3段なら7点しか見ない。間隔を倍にすると、見る範囲が倍々に広がる。</desc>
<text x="12" y="20" class="tb">Dilated 畳み込み：隙間をあけて広く見る</text>
<rect x="12" y="30" width="296" height="166" class="fs sb" stroke-width="1" rx="6"/>
<text x="24" y="50" class="tb">なぜ欲しいか（例：セグメンテーション）</text>
<text x="24" y="70">広く見て文脈をつかみたいが、位置も要る</text>
<text x="24" y="92" class="tng">× プーリングで縮める → 特徴マップが</text>
<text x="24" y="110" class="tng">　小さくなり、細かい位置が失われる</text>
<text x="24" y="132" class="tng">× フィルタを大きくする → 重みが増える</text>
<text x="24" y="150" class="tng">　（7×7 なら 49 個）</text>
<text x="24" y="172" class="tb tok">○ 隙間をあける → 重み 9 個のまま、</text>
<text x="24" y="190" class="tb tok">　特徴マップも縮めずに広く見る</text>
<text x="12" y="222" class="tb">① ●＝重み。どちらも 9 個</text>
