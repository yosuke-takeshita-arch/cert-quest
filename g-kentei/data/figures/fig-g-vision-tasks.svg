<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 656" role="img" aria-labelledby="fig-g-vision-tasks-t fig-g-vision-tasks-d">
<title id="fig-g-vision-tasks-t">画像認識タスクの違い：同じ絵に、出力がどう変わるか</title>
<desc id="fig-g-vision-tasks-d">人2人と車1台が写った同じ模式図を6回並べ、タスクごとの出力を示す。物体識別は画像全体に1つのラベル。物体検出は人と車を矩形で囲んでクラスを付ける。セマンティックセグメンテーションは全画素にクラスの色を付け、人2人は同じ色。インスタンスセグメンテーションは検出した物体だけを個体ごとに別の色で塗り、背景は塗らない。パノプティックセグメンテーションは、人を個体ごとに別の色にしつつ、道路や空も含めて全画素を塗る。姿勢推定は人の関節点（キーポイント）と骨格の線を出す。OpenPose は部位と人の対応を付けて複数人を推定する。</desc>
