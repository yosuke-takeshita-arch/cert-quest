<text x="209" y="206.5" class="tb" text-anchor="middle">←</text>
<rect x="160" y="134" width="30" height="24" class="fas sa" stroke-width="1.5"/>
<text x="175" y="150.5" class="tb" text-anchor="middle">→</text>
<rect x="174" y="64" width="36" height="24" class="fok sok" stroke-width="1.5"/>
