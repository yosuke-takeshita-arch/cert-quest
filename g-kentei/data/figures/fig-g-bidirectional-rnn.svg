<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 484" role="img" aria-labelledby="fig-g-bidirectional-rnn-t fig-g-bidirectional-rnn-d">
<title id="fig-g-bidirectional-rnn-t">双方向 RNN：前から読む RNN と、後ろから読む RNN</title>
<desc id="fig-g-bidirectional-rnn-d">入力 x1 から x4 の上に、左から右へ読む RNN の段と、右から左へ読む RNN の段を重ねる。各時刻の出力には、前向きの段（過去の情報）と後ろ向きの段（未来の情報）の両方が入る。たとえば文中の単語の品詞を判定するとき、前の語と後ろの語の両方を使える。先の入力が必要なので、リアルタイムの逐次予測には向かない。</desc>
<text x="12" y="20" class="tb">各時刻の出力が、前後の両方を見る</text>
