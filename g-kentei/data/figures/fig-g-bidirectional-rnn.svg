<rect x="50" y="190" width="30" height="24" class="fwn swn" stroke-width="1.5"/>
<text x="65" y="206.5" class="tb" text-anchor="middle">←</text>
<rect x="16" y="134" width="30" height="24" class="fas sa" stroke-width="1.5"/>
<text x="31" y="150.5" class="tb" text-anchor="middle">→</text>
