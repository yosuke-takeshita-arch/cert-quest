<line x1="12" y1="322" x2="308" y2="322" class="l sb w1"/>
<line x1="12" y1="346" x2="40" y2="346" class="l sa w2"/>
<text x="48" y="351">前向き：過去の情報（左から右）</text>
<line x1="12" y1="370" x2="40" y2="370" class="l swn w2"/>
<text x="48" y="375">後ろ向き：未来の情報（右から左）</text>
<text x="12" y="406" class="tb">例：文中の単語の品詞を判定する</text>
<text x="12" y="426">前の語と、後ろの語の両方を手がかりにする</text>
<text x="12" y="454" class="tm">先の入力が要るので、リアルタイムの</text>
<text x="12" y="472" class="tm">逐次予測には向かない</text>
</svg>
