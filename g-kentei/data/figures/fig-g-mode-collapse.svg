<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 632" role="img" aria-labelledby="fig-g-mode-collapse-t fig-g-mode-collapse-d">
<title id="fig-g-mode-collapse-t">モード崩壊：違う入力 z から同じ出力ばかり作る</title>
<desc id="fig-g-mode-collapse-d">モードはデータの分布の山（よく出る型）のこと。①グラフの横軸はデータの種類（例：手書きの数字）、縦軸は出る割合。本物のデータ（実線）には 0、1、7 の3つの山がある。崩れた生成器が作るもの（破線）は 1 の山だけに集まる。②うまく学べた生成器は、z1 から z4 の違う入力から 0、7、1、7 のようにいろいろな数字を作る。③モード崩壊した生成器は、z1 から z4 のどれを入れても 1 ばかり作る。山が3つあるのに、1つの山に崩れ落ちる。Goodfellow の NIPS 2016 のチュートリアルは、完全な崩壊はまれで、同じ色や模様ばかりの部分的な崩壊はよく起きると述べている。似た名前との違い：勾配消失は前の層まで勾配が届かず学べない問題、破滅的忘却は新しいタスクを学ぶと前のタスクを忘れる問題、過学習は訓練データに合わせすぎる問題。数字の種類は説明のための例。</desc>
<text x="12" y="22" class="tl">モード崩壊：違う z から同じ出力</text>
<text x="12" y="42" class="tm">モード＝データの分布の山（よく出る型）</text>
<text x="12" y="68" class="tb">①山の数で見る</text>
<text x="12" y="88" class="tm">縦：出る割合</text>
