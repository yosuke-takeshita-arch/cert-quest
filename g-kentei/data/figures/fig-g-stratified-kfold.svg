<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-g-stratified-kfold-t fig-g-stratified-kfold-d">
<title id="fig-g-stratified-kfold-t">層化k-分割交差検証：どの組にもクラスの割合を全体と同じに入れる</title>
<desc id="fig-g-stratified-kfold-d">例は1,000件のうち不良品が20件（2%）のデータを、5組に分ける交差検証。1組は1,000÷5＝200件。棒グラフで、横軸は組1から組5、縦軸はその組に入った不良品の件数。ランダムに分けた例（説明用の数）では、不良品が1・8・4・5・2件と組ごとに偏り、合計は20件。不良品が1件しか無い組で評価すると、見逃しの割合を1件で決めることになり、組によって評価が大きくぶれる。層化k-分割では、20÷5＝4件ずつ、どの組にも4件入る。4÷200＝2%で全体の割合と同じ。</desc>
<text x="12" y="20" class="tb">層化k-分割：どの組も同じ割合に</text>
<text x="12" y="40" class="tm">例：1,000件のうち不良品20件（2%）</text>
<text x="12" y="58" class="tm">5組に分ける → 1組 1,000÷5＝200件</text>
<text x="12" y="80" class="tm">棒グラフ。横軸＝組、縦軸＝その組の</text>
<text x="12" y="98" class="tm">不良品の件数</text>
<text x="12" y="126" class="tb">ランダムに分けた例（数は説明用）</text>
<line x1="40" y1="250" x2="300" y2="250" class="l sm w1"/>
<line x1="40" y1="140" x2="40" y2="250" class="l sm w1"/>
<rect x="56" y="238" width="32" height="12" class="fng"/>
<rect x="56" y="238" width="32" height="12" class="l sng w1"/>
<text x="72" y="232" class="tb tng" text-anchor="middle">1</text>
<rect x="106" y="154" width="32" height="96" class="fwn"/>
<rect x="106" y="154" width="32" height="96" class="l swn w1"/>
<text x="122" y="148" class="tb twn" text-anchor="middle">8</text>
<rect x="156" y="202" width="32" height="48" class="fs sb" stroke-width="1"/>
<text x="172" y="196" class="tb" text-anchor="middle">4</text>
<rect x="206" y="190" width="32" height="60" class="fs sb" stroke-width="1"/>
<text x="222" y="184" class="tb" text-anchor="middle">5</text>
<rect x="256" y="226" width="32" height="24" class="fs sb" stroke-width="1"/>
<text x="272" y="220" class="tb" text-anchor="middle">2</text>
<text x="72" y="266" class="tm" text-anchor="middle">組1</text>
<text x="122" y="266" class="tm" text-anchor="middle">組2</text>
<text x="172" y="266" class="tm" text-anchor="middle">組3</text>
<text x="222" y="266" class="tm" text-anchor="middle">組4</text>
<text x="272" y="266" class="tm" text-anchor="middle">組5</text>
<text x="12" y="290" class="tm">1＋8＋4＋5＋2＝20。組1は不良品1件だけで</text>
<text x="12" y="308" class="tm">評価する → 組によって評価がぶれる</text>
<text x="12" y="336" class="tb tok">層化k-分割（クラスの割合を保つ）</text>
<line x1="40" y1="410" x2="300" y2="410" class="l sm w1"/>
<line x1="40" y1="346" x2="40" y2="410" class="l sm w1"/>
<rect x="56" y="362" width="32" height="48" class="fok sok" stroke-width="1"/>
<rect x="106" y="362" width="32" height="48" class="fok sok" stroke-width="1"/>
<rect x="156" y="362" width="32" height="48" class="fok sok" stroke-width="1"/>
<rect x="206" y="362" width="32" height="48" class="fok sok" stroke-width="1"/>
<rect x="256" y="362" width="32" height="48" class="fok sok" stroke-width="1"/>
<text x="72" y="356" class="tb tok" text-anchor="middle">4</text>
<text x="122" y="356" class="tb tok" text-anchor="middle">4</text>
<text x="172" y="356" class="tb tok" text-anchor="middle">4</text>
<text x="222" y="356" class="tb tok" text-anchor="middle">4</text>
<text x="272" y="356" class="tb tok" text-anchor="middle">4</text>
<text x="72" y="426" class="tm" text-anchor="middle">組1</text>
<text x="122" y="426" class="tm" text-anchor="middle">組2</text>
<text x="172" y="426" class="tm" text-anchor="middle">組3</text>
<text x="222" y="426" class="tm" text-anchor="middle">組4</text>
<text x="272" y="426" class="tm" text-anchor="middle">組5</text>
<text x="12" y="450" class="tm">20÷5＝4件ずつ。4÷200＝2%で全体と同じ</text>
</svg>
