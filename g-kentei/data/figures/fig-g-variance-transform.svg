<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 570" role="img" aria-labelledby="fig-g-variance-transform-t fig-g-variance-transform-d">
<title id="fig-g-variance-transform-t">3倍して10を足すと、分散は何倍になるか</title>
<desc id="fig-g-variance-transform-d">何のための図か：すべての値を3倍して10を足したとき（3X＋10）、分散が何倍になるかを、2つの数 1, 3 で確かめる。元のデータ1, 3：平均2、平均との差は±1、2乗して1、分散1。3倍すると3, 9：平均6、差は±3、2乗して9、分散9。差が3倍なので2乗の分散は3×3＝9倍。さらに10を足すと13, 19：平均16、差は±3のまま、分散9のまま。足し算は全体を同じだけ横にずらすだけで、散らばりの幅は変わらない。問題の数：元の分散4なら、4×9＝36。</desc>
<text x="12" y="20" class="tb">3倍して10を足すと、分散はどうなるか</text>
<text x="12" y="42" class="tm">2つの数 1, 3 で確かめる（説明のための例）</text>
<text x="12" y="60" class="tm">横軸＝値。丸＝データ、緑の縦線＝平均</text>
<text x="12" y="78" class="tm">上の横線＝2つの値の幅（散らばり）</text>
<text x="12" y="106" class="tb">元のデータ：1, 3</text>
<line x1="24" y1="136" x2="296" y2="136" class="l sm w1"/>
<text x="24" y="152" class="tm" text-anchor="middle">0</text>
<text x="92" y="152" class="tm" text-anchor="middle">5</text>
<text x="160" y="152" class="tm" text-anchor="middle">10</text>
<text x="228" y="152" class="tm" text-anchor="middle">15</text>
<text x="296" y="152" class="tm" text-anchor="middle">20</text>
<line x1="51.2" y1="118" x2="51.2" y2="140" class="l sok w2"/>
<line x1="37.6" y1="122" x2="64.8" y2="122" class="l sa w1"/>
<circle cx="37.6" cy="136" r="6" class="fas sa" stroke-width="1.5"/>
<circle cx="64.8" cy="136" r="6" class="fas sa" stroke-width="1.5"/>
<text x="12" y="172">平均 2、平均との差は ±1</text>
<text x="12" y="192" class="tb ta">差の2乗 1 → 分散 1</text>
<line x1="12" y1="204" x2="308" y2="204" class="l sb w1"/>
<text x="12" y="232" class="tb">3倍する：3, 9</text>
<line x1="24" y1="262" x2="296" y2="262" class="l sm w1"/>
<text x="24" y="278" class="tm" text-anchor="middle">0</text>
<text x="92" y="278" class="tm" text-anchor="middle">5</text>
<text x="160" y="278" class="tm" text-anchor="middle">10</text>
<text x="228" y="278" class="tm" text-anchor="middle">15</text>
<text x="296" y="278" class="tm" text-anchor="middle">20</text>
<line x1="105.6" y1="244" x2="105.6" y2="266" class="l sok w2"/>
<line x1="64.8" y1="248" x2="146.4" y2="248" class="l sa w1"/>
<circle cx="64.8" cy="262" r="6" class="fas sa" stroke-width="1.5"/>
<circle cx="146.4" cy="262" r="6" class="fas sa" stroke-width="1.5"/>
<text x="12" y="298">平均 6、平均との差は ±3（3倍）</text>
<text x="12" y="318" class="tb ta">差の2乗 9 → 分散 9（3×3＝9倍）</text>
<line x1="12" y1="330" x2="308" y2="330" class="l sb w1"/>
<text x="12" y="358" class="tb">さらに10を足す：13, 19</text>
<line x1="24" y1="388" x2="296" y2="388" class="l sm w1"/>
<text x="24" y="404" class="tm" text-anchor="middle">0</text>
<text x="92" y="404" class="tm" text-anchor="middle">5</text>
<text x="160" y="404" class="tm" text-anchor="middle">10</text>
<text x="228" y="404" class="tm" text-anchor="middle">15</text>
<text x="296" y="404" class="tm" text-anchor="middle">20</text>
<line x1="241.6" y1="370" x2="241.6" y2="392" class="l sok w2"/>
<line x1="200.8" y1="374" x2="282.4" y2="374" class="l sa w1"/>
<circle cx="200.8" cy="388" r="6" class="fas sa" stroke-width="1.5"/>
<circle cx="282.4" cy="388" r="6" class="fas sa" stroke-width="1.5"/>
<text x="12" y="424">平均 16、平均との差は ±3 のまま</text>
<text x="12" y="444" class="tb ta">分散 9 のまま（足し算は横にずらすだけ）</text>
<line x1="12" y1="456" x2="308" y2="456" class="l sb w1"/>
<text x="12" y="480" class="tb">なぜ 9倍か</text>
<text x="12" y="498">3倍すると平均との差も3倍。分散は差を2乗</text>
<text x="12" y="516">するので 3 × 3 ＝ 9倍になる</text>
<rect x="12" y="524" width="296" height="32" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="544" class="tb tok">問題の数：分散 4 × 9 ＝ 36</text>
</svg>
