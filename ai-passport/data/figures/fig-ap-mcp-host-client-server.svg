<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" role="img" aria-labelledby="fig-ap-mcp-host-client-server-t fig-ap-mcp-host-client-server-d">
<title id="fig-ap-mcp-host-client-server-t">MCPの3つの役：ホスト・クライアント・サーバー</title>
<desc id="fig-ap-mcp-host-client-server-d">左の大きな枠がホスト（接続を始める側のLLMのアプリ）。その中に、サーバーとつなぐ部品であるクライアントが2つある。クライアントが、MCPの決まりで、右のMCPサーバーとつながる。例はGitHubのMCPサーバーとSlackのMCPサーバー。サーバーは、データや道具をホストに差し出すプログラムで、AIのモデルそのものではない。サーバーが差し出すものは3種類で、リソース（利用者やモデルが使う文脈とデータ）、プロンプト（利用者向けの、型の決まったメッセージや作業の流れ）、ツール（モデルが実行させる関数。例：GitHubの課題の一覧を読む、プルリクエストを作る）。仕様は、ホストがツールを呼ぶ前や利用者のデータをサーバーに渡す前に、利用者の明示の同意を得なければならないとしている。</desc>
<text x="12" y="20" class="tb">MCPの3つの役</text>
<rect x="12" y="34" width="120" height="196" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="72" y="56" class="tb ta" text-anchor="middle">ホスト</text>
<text x="72" y="74" class="tm" text-anchor="middle">LLMのアプリ</text>
<rect x="22" y="90" width="100" height="52" class="fs sa" stroke-width="1.5"/>
<text x="72" y="112" class="tb" text-anchor="middle">クライアント</text>
<text x="72" y="130" class="tm" text-anchor="middle">つなぐ部品</text>
<rect x="22" y="162" width="100" height="52" class="fs sa" stroke-width="1.5"/>
<text x="72" y="184" class="tb" text-anchor="middle">クライアント</text>
<text x="72" y="202" class="tm" text-anchor="middle">つなぐ部品</text>
<line x1="122" y1="116" x2="184" y2="116" class="l sok w2"/>
<polyline points="177,119.85 184,116 177,112.15" class="l sok w2"/>
<line x1="122" y1="188" x2="184" y2="188" class="l sok w2"/>
<polyline points="177,191.85 184,188 177,184.15" class="l sok w2"/>
<text x="159" y="106" class="tm" text-anchor="middle">MCP</text>
<text x="159" y="178" class="tm" text-anchor="middle">MCP</text>
<rect x="186" y="90" width="122" height="52" class="fok sok" stroke-width="1.5"/>
<text x="247" y="112" class="tb" text-anchor="middle">MCPサーバー</text>
<text x="247" y="130" text-anchor="middle">（GitHub 用）</text>
<rect x="186" y="162" width="122" height="52" class="fok sok" stroke-width="1.5"/>
<text x="247" y="184" class="tb" text-anchor="middle">MCPサーバー</text>
<text x="247" y="202" text-anchor="middle">（Slack 用）</text>
<text x="12" y="252" class="tm">サーバー＝データや道具を差し出すプログラム</text>
<line x1="12" y1="268" x2="308" y2="268" class="l sb w1"/>
<text x="12" y="292" class="tb">サーバーが差し出すもの（3種類）</text>
<rect x="12" y="302" width="296" height="40" class="fs sb" stroke-width="1.5"/>
<text x="22" y="327" class="tb">リソース</text>
<text x="100" y="327">使う文脈とデータ</text>
<rect x="12" y="348" width="296" height="40" class="fs sb" stroke-width="1.5"/>
<text x="22" y="373" class="tb">プロンプト</text>
<text x="100" y="373">型の決まったメッセージ</text>
<rect x="12" y="394" width="296" height="56" class="fok sok" stroke-width="1.5"/>
<text x="22" y="417" class="tb">ツール</text>
<text x="100" y="417">モデルが実行させる関数</text>
<text x="100" y="437" class="tm">例：課題の一覧を読む</text>
<line x1="12" y1="466" x2="308" y2="466" class="l sb w1"/>
<text x="12" y="490" class="tb twn">ツールを呼ぶ前・データを渡す前に</text>
<text x="12" y="510" class="tb twn">利用者の明示の同意が要る</text>
<text x="12" y="536" class="tm">サーバーはAIのモデルそのものではない</text>
</svg>
