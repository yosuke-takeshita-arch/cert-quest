<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="fig-ap-coding-agent-t fig-ap-coding-agent-d">
<title id="fig-ap-coding-agent-t">コーディングエージェントの流れ：課題からプルリクエスト、人のレビューと承認まで</title>
<desc id="fig-ap-coding-agent-d">上から順に：課題（issue）を受ける、隔離された環境でコードを読む、コードを直す、テストを実行する、自分のブランチにまとめてプルリクエストを出す、人がレビューして承認する、承認後に自動の処理（CI/CD）と取り込み。テストが失敗したら直してくり返す（赤い矢印）。テストは自動で確かめる手がかり（ground truth）。人の確認が要るところ：テストが通っても全体の要求に合うか、テストに書いていない動きや弱点。既定のブランチへは直接書き込ませない。GitHubのコーディングエージェントでは、頼んだ本人ではなく別の人が承認する。</desc>
<text x="12" y="20" class="tb">コーディングエージェントの流れ</text>
<rect x="12" y="32" width="270" height="32" class="fs sb" stroke-width="1.5"/>
<text x="22" y="53">課題（issue）を受ける</text>
<line x1="140" y1="65" x2="140" y2="79" class="l sa w2"/>
<polyline points="136.00,72.00 140,79 144.00,72.00" class="l sa w2"/>
<rect x="12" y="80" width="270" height="32" class="fas sa" stroke-width="1.5"/>
<text x="22" y="101">隔離された環境でコードを読む</text>
<line x1="140" y1="113" x2="140" y2="127" class="l sa w2"/>
<polyline points="136.00,120.00 140,127 144.00,120.00" class="l sa w2"/>
<rect x="12" y="128" width="270" height="32" class="fas sa" stroke-width="1.5"/>
<text x="22" y="149">コードを直す</text>
<line x1="140" y1="161" x2="140" y2="175" class="l sa w2"/>
<polyline points="136.00,168.00 140,175 144.00,168.00" class="l sa w2"/>
<rect x="12" y="176" width="270" height="32" class="fas sa" stroke-width="1.5"/>
<text x="22" y="197">テストを実行する</text>
<line x1="140" y1="209" x2="140" y2="223" class="l sa w2"/>
<polyline points="136.00,216.00 140,223 144.00,216.00" class="l sa w2"/>
<rect x="12" y="224" width="270" height="32" class="fok sok" stroke-width="1.5"/>
<text x="22" y="245">自分のブランチにまとめ、プルリクエストを出す</text>
<line x1="140" y1="257" x2="140" y2="271" class="l sa w2"/>
<polyline points="136.00,264.00 140,271 144.00,264.00" class="l sa w2"/>
<rect x="12" y="272" width="270" height="32" class="fwn swn" stroke-width="1.5"/>
<text x="22" y="293">人がレビューして承認する</text>
<line x1="140" y1="305" x2="140" y2="319" class="l sa w2"/>
<polyline points="136.00,312.00 140,319 144.00,312.00" class="l sa w2"/>
<rect x="12" y="320" width="270" height="32" class="fs sb" stroke-width="1.5"/>
<text x="22" y="341">承認後に自動の処理（CI/CD）・取り込み</text>
<polyline points="282,192 300,192 300,144 288,144" class="l sng w2"/>
<line x1="296" y1="144" x2="284" y2="144" class="l sng w2"/>
<polyline points="291.00,140.00 284,144 291.00,148.00" class="l sng w2"/>
<text x="12" y="374" class="tng">赤い矢印：テストが通るまで直してくり返す</text>
<text x="12" y="394" class="tm">テスト＝自動で確かめる手がかり（ground truth）</text>
<line x1="12" y1="410" x2="308" y2="410" class="l sb w1"/>
<text x="12" y="432" class="tb">人の確認が要るところ</text>
<text x="12" y="452">・テストが通っても、全体の要求に合うか</text>
<text x="12" y="472">・テストに書いていない動きや弱点</text>
<text x="12" y="492">・既定のブランチへは直接書き込ませない</text>
<text x="12" y="512" class="tm">・頼んだ本人ではなく別の人が承認する（GitHub）</text>
</svg>
