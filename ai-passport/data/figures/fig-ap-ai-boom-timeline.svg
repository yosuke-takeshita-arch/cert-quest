<line x1="47" y1="70" x2="52" y2="70" class="l w1"/>
<text x="44" y="75" class="tm" text-anchor="end">1950</text>
<line x1="47" y1="170" x2="52" y2="170" class="l w1"/>
<text x="44" y="175" class="tm" text-anchor="end">1960</text>
<line x1="47" y1="270" x2="52" y2="270" class="l w1"/>
<text x="44" y="275" class="tm" text-anchor="end">1970</text>
<line x1="47" y1="370" x2="52" y2="370" class="l w1"/>
<text x="44" y="375" class="tm" text-anchor="end">1980</text>
<line x1="47" y1="470" x2="52" y2="470" class="l w1"/>
<text x="44" y="475" class="tm" text-anchor="end">1990</text>
<line x1="47" y1="570" x2="52" y2="570" class="l w1"/>
<text x="44" y="575" class="tm" text-anchor="end">2000</text>
<line x1="47" y1="670" x2="52" y2="670" class="l w1"/>
<text x="44" y="675" class="tm" text-anchor="end">2010</text>
<line x1="47" y1="770" x2="52" y2="770" class="l w1"/>
<text x="44" y="775" class="tm" text-anchor="end">2020</text>
<text x="44" y="855" class="tb" text-anchor="end">いま</text>
<text x="120" y="104" class="tl">第1次ブーム</text>
<text x="120" y="124" class="tm">50年代後半〜60年代</text>
<text x="120" y="146" class="tb ta">中心：探索・推論</text>
<text x="120" y="168">例 1956 ダートマス会議</text>
<text x="120" y="188" class="tm">（AIという分野名）</text>
<text x="120" y="210">例 ELIZA（60年代の会話）</text>
<text x="120" y="234" class="tb tng">冬①の理由：</text>
<text x="120" y="254" class="tng">簡単な問題しか解けない</text>
<rect x="60" y="276" width="248" height="88" rx="6" class="sm dot" stroke-width="1.5"/>
<text x="120" y="314" class="tb">冬の時代①</text>
<text x="120" y="334" class="tm">研究が下火に</text>
<text x="120" y="384" class="tl">第2次ブーム</text>
<text x="120" y="403" class="tm">1980年代</text>
<text x="120" y="423" class="tb ta">中心：知識（ルール）</text>
<text x="120" y="443">例 エキスパートシステム</text>
<text x="120" y="462" class="tm">（手本は70年代のMYCIN）</text>
<text x="120" y="482">例 第五世代コンピュータ</text>
<text x="120" y="502" class="tb tng">冬②の理由：</text>
<text x="120" y="521" class="tng">知識を人が書き切れない</text>
<rect x="60" y="528" width="248" height="40" rx="6" class="sm dot" stroke-width="1.5"/>
<text x="120" y="553" class="tb">冬の時代②（1995年頃〜）</text>
<text x="120" y="596" class="tl">第3次ブーム</text>
<text x="120" y="616" class="tm">2000年代〜いまも続く</text>
<text x="120" y="638" class="tb ta">中心：機械学習・</text>
<text x="120" y="657" class="tb ta">ディープラーニング</text>
<text x="120" y="679">背景：ビッグデータと計算力</text>
<text x="120" y="701">例 2012 ILSVRC で</text>
<text x="120" y="720">ディープラーニングが優勝</text>
<text x="120" y="742">例 2017 Transformer</text>
<text x="120" y="761">発表（生成AIの土台）</text>
<text x="120" y="790" class="tb">2022 ChatGPT 公開</text>
<text x="120" y="810">生成AIが急速に広がる</text>
<text x="120" y="830" class="tm">（点線）第4次と呼ぶ</text>
<text x="120" y="849" class="tm">人もいるが、定まっていない</text>
<text x="12" y="890" class="tb">中心の流れ：探索・推論 → 知識</text>
<text x="12" y="910" class="tb">→ データから学ぶ</text>
<text x="12" y="934">第1次・第2次は人が書いたルールで動く</text>
<text x="12" y="953">第3次は機械がデータから学ぶ</text>
<text x="12" y="977" class="tm">ふくらみの幅は目安（測った値ではない）</text>
</svg>
