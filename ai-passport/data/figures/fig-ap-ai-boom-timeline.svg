<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 988" role="img" aria-labelledby="fig-ap-ai-boom-timeline-t fig-ap-ai-boom-timeline-d">
<title id="fig-ap-ai-boom-timeline-t">AIブームと冬の時代の年表（1950年代から現在まで）</title>
<desc id="fig-ap-ai-boom-timeline-d">上から下へ時間が進み、左のふくらみが盛り上がりの目安。第1次ブームは1950年代後半〜60年代で、中心は探索・推論。例は1956年のダートマス会議（AIという分野名が使われた）と、60年代の会話のプログラムELIZA。簡単な問題しか解けず、冬の時代①（1970年代）になった。第2次ブームは1980年代で、中心は知識（ルール）。例はエキスパートシステム（手本は70年代のMYCIN）と第五世代コンピュータ。知識を人が書き切れず、1995年ごろから冬の時代②。第3次ブームは2000年代から今も続き、中心は機械学習・ディープラーニング。背景はビッグデータと計算力。例は2012年のILSVRCでのディープラーニングの優勝、2017年のTransformerの発表。2022年にChatGPTが公開され、生成AIが急速に広がった。これを第4次と呼ぶ人もいるが定まっていない。中心の流れは探索・推論、知識、データから学ぶの順。第1次・第2次は人が書いたルールで動き、第3次は機械がデータから学ぶ。ふくらみの幅は目安で、測った値ではない。</desc>
<text x="12" y="20" class="tb">上から下へ時間が進む</text>
<text x="12" y="40" class="tm">ふくらみ＝盛り上がりの目安</text>
<path d="M 52,70 L 52,120 C 60,130 92,160 96,190 C 100,220 64,262 58,280 L 58,360 C 64,380 100,400 102,430 C 104,460 66,505 58,520 L 58,570 C 66,590 100,640 104,680 L 104,850 L 52,850 Z" class="fas sa" stroke-width="2"/>
<path d="M 104,790 C 108,800 116,812 116,850" class="l sa w2 dsh"/>
