<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 404" role="img" aria-labelledby="fig-ap-allowlist-t fig-ap-allowlist-d">
<title id="fig-ap-allowlist-t">ホワイトリストとブラックリスト：未知の危ない操作への守りはホワイトリストが強い</title>
<desc id="fig-ap-allowlist-d">例はエージェントが打つコマンド（名前は例）。ホワイトリスト（許可リスト）は、載っているもの（読む・一覧・テスト）だけを通し、載っていないものは全部止める。ブラックリスト（禁止リスト）は、載っているもの（削除・送信）だけを止め、載っていないものは全部通す。まだ知られていない危ない操作が来ると、ホワイトリストでは載っていないので止まり、ブラックリストでは載っていないので通る。だから未知の操作への守りはホワイトリストが強い。サンドボックスは外と隔てた環境で実行させる守りで、リストとは別のもの。組み合わせて使う。</desc>
<text x="12" y="20" class="tb">ホワイトリスト と ブラックリスト</text>
<text x="12" y="40" class="tm">例：エージェントが打つコマンド（名前は例）</text>
<text x="12" y="66" class="tb tok">ホワイトリスト（許可リスト）</text>
<rect x="12" y="76" width="296" height="56" class="fok sok" stroke-width="1.5"/>
<text x="160" y="99" text-anchor="middle">載っているものだけ通す：読む・一覧・テスト</text>
<text x="160" y="119" class="tm" text-anchor="middle">載っていないものは全部止める</text>
<text x="12" y="156" class="tb tng">ブラックリスト（禁止リスト）</text>
<rect x="12" y="166" width="296" height="56" class="fng sng" stroke-width="1.5"/>
<text x="160" y="189" text-anchor="middle">載っているものだけ止める：削除・送信</text>
<text x="160" y="209" class="tm" text-anchor="middle">載っていないものは全部通す</text>
<line x1="12" y1="242" x2="308" y2="242" class="l sb w1"/>
<text x="12" y="264" class="tb">まだ知られていない危ない操作が来たら</text>
<rect x="12" y="274" width="140" height="48" class="fok sok" stroke-width="1.5"/>
<text x="82" y="293" class="tb" text-anchor="middle">ホワイト</text>
<text x="82" y="313" class="tok" text-anchor="middle">載っていない→止まる</text>
<rect x="168" y="274" width="140" height="48" class="fng sng" stroke-width="1.5"/>
<text x="238" y="293" class="tb" text-anchor="middle">ブラック</text>
<text x="238" y="313" class="tng" text-anchor="middle">載っていない→通る</text>
<text x="12" y="346" class="tb">→ 未知の操作への守りはホワイトリストが強い</text>
<text x="12" y="368" class="tm">サンドボックス＝外と隔てた環境で実行させる</text>
<text x="12" y="386" class="tm">（リストとは別の守り。組み合わせる）</text>
</svg>
