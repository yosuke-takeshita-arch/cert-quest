<text x="247.49719949915414" y="136.57043651750485" class="tb" text-anchor="middle">ゴール設定</text>
<rect x="154.07624321090753" y="219.42956348249515" width="120" height="30" class="fas sa" stroke-width="1.5"/>
<text x="214.07624321090753" y="239.42956348249515" class="tb" text-anchor="middle">システムデザイン</text>
<rect x="84.92375678909248" y="219.42956348249515" width="42" height="30" class="fas sa" stroke-width="1.5"/>
<text x="105.92375678909248" y="239.42956348249515" class="tb" text-anchor="middle">運用</text>
<rect x="51.502800500845865" y="116.57043651750485" width="42" height="30" class="fas sa" stroke-width="1.5"/>
<text x="72.50280050084586" y="136.57043651750485" class="tb" text-anchor="middle">評価</text>
<text x="160" y="156" class="tm" text-anchor="middle">マルチステーク</text>
