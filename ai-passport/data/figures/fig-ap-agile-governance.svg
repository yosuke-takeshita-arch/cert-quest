<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 374" role="img" aria-labelledby="fig-ap-agile-governance-t fig-ap-agile-governance-d">
<title id="fig-ap-agile-governance-t">アジャイル・ガバナンスのサイクル：環境・リスク分析、ゴール設定、システムデザイン、運用、評価</title>
<desc id="fig-ap-agile-governance-d">事前にルールや手続を固定せず、サイクルを回し続けて見直す。円の上から時計回りに、環境・リスク分析、ゴール設定、システムデザイン、運用、評価と進み、また環境・リスク分析に戻る。マルチステークホルダーで継続的かつ高速に回す。外の環境が変われば、運用の後も分析し直す。一度作ったルールを使い続けるのではない。</desc>
<text x="12" y="20" class="tb">アジャイル・ガバナンスのサイクル</text>
<text x="12" y="40" class="tm">事前にルールを固定せず、回し続けて見直す</text>
