<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-ap-closed-network-t fig-ap-closed-network-d">
<title id="fig-ap-closed-network-t">インターネットと閉域網：だれでもつながるか、決まった拠点だけか</title>
<desc id="fig-ap-closed-network-d">インターネットは、不特定多数の人が使い、世界中のサーバーとつながる公開のネットワーク。閉域網（閉域ネットワーク）は、インターネットから切り離された独自のネットワークで、特定の利用者と拠点（例：本社・支店・データセンター）でしか使えず、外からは入れない。例：本社と支店と、社内でAIを動かすデータセンターを閉域網でつなぐと、社内の文書をAIに渡す通信がインターネットを通らない。種類は、専用線（2拠点を専用の回線でつなぐ）、IP-VPN・広域イーサネット（通信事業者の閉域の網を使う）の3つ（NTT東日本の解説による）。取り違えやすいもの：駅や店の無料の無線LANは、来た人がだれでも使えるので閉域網の逆。1台のパソコンの中だけで動く仕組みは、拠点をつなぐネットワークではない。</desc>
<text x="12" y="20" class="tb">インターネット と 閉域網</text>
<rect x="12" y="32" width="296" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="54" class="tb">インターネット</text>
<text x="22" y="74" class="tm">不特定多数が使う。世界中とつながる</text>
<text x="22" y="92" class="tm">外からも入ってこられる</text>
<text x="12" y="128" class="tb ta">閉域網（閉域ネットワーク）</text>
<rect x="12" y="138" width="296" height="150" class="fas sa" stroke-width="2" rx="6"/>
<text x="22" y="160" class="tm">インターネットから切り離された独自の網</text>
<rect x="24" y="174" width="80" height="34" class="fs sa" stroke-width="1.5" rx="4"/>
<text x="64" y="196" class="tb" text-anchor="middle">本社</text>
<rect x="216" y="174" width="80" height="34" class="fs sa" stroke-width="1.5" rx="4"/>
<text x="256" y="196" class="tb" text-anchor="middle">支店</text>
<rect x="104" y="232" width="112" height="34" class="fs sa" stroke-width="1.5" rx="4"/>
<text x="160" y="254" class="tb" text-anchor="middle">データセンター</text>
<line x1="104" y1="191" x2="216" y2="191" class="l sa"/>
<line x1="70" y1="208" x2="130" y2="232" class="l sa"/>
<line x1="250" y1="208" x2="190" y2="232" class="l sa"/>
<text x="160" y="282" class="tm" text-anchor="middle">決まった利用者と拠点だけ。外からは入れない</text>
<text x="12" y="314" class="tb">例：社内でAIを動かすデータセンター</text>
<text x="12" y="334" class="tm">本社・支店から社内の文書をAIに渡す通信が、</text>
<text x="12" y="352" class="tm">インターネットを通らない</text>
<text x="12" y="380" class="tb">種類（3つ）</text>
<text x="12" y="400" class="tm">専用線・IP-VPN・広域イーサネット</text>
<line x1="12" y1="416" x2="308" y2="416" class="l sb w1"/>
<text x="12" y="440" class="tng">駅や店の無料の無線LAN＝だれでも使える</text>
<text x="12" y="460" class="tng">1台のパソコンの中だけ＝拠点をつながない</text>
</svg>
