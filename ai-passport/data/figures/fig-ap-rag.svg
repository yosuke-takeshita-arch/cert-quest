<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 630" role="img" aria-labelledby="fig-ap-rag-t fig-ap-rag-d">
<title id="fig-ap-rag-t">RAG（検索拡張生成）の流れ：準備しておき、質問のたびに探す→添える→答える</title>
<desc id="fig-ap-rag-d">例は社内規程のRAG（数は説明のための例）。準備（索引づくり。前もって1回）として、規程のPDFを読み込み、500トークンほどのかたまり（チャンク）に分け、それぞれを意味を表す数の並び（ベクトル）にして、ベクトルデータベースにしまっておく。質問が来るたびに、①検索：質問も、索引づくりと同じ埋め込みのモデルでベクトルにし、近いかたまりを上位から3つ探す。②見つかったかたまりを質問に添えてLLMに渡す。③生成：LLMがその内容を参照して答える。点線の別経路は、検索を使わず、LLMが学習した知識だけで答える場合で、社内の資料や最近の出来事は知らないので答えにくい。RAGはモデルの重みを変えない。資料を差し替えれば答えも変わる。学習し直すファインチューニングとは別。</desc>
<text x="12" y="20" class="tb">例：社内規程のRAG（数は説明の例）</text>
<text x="12" y="44" class="tb ta">準備＝索引づくり（前もって1回）</text>
<rect x="12" y="54" width="296" height="76" class="fs sb" stroke-width="1.5"/>
<text x="22" y="76">規程のPDFを読み込み、</text>
<text x="22" y="96">500トークンほどのかたまりに分け、</text>
<text x="22" y="116">ベクトルにして、データベースにしまう</text>
<text x="12" y="150" class="tm">ベクトル＝意味を表す数の並び</text>
<line x1="12" y1="164" x2="308" y2="164" class="l sb w1"/>
<text x="12" y="188" class="tb ta">質問のたびに</text>
<rect x="12" y="198" width="296" height="40" class="fs sa" stroke-width="1.5"/>
<text x="160" y="222.5" class="tb" text-anchor="middle">利用者の質問</text>
<line x1="160" y1="240" x2="160" y2="262" class="l sa w2"/>
<polyline points="156.15,255 160,262 163.85,255" class="l sa w2"/>
<rect x="12" y="264" width="296" height="76" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="286.5" class="tb" text-anchor="middle">① 探す（検索）</text>
<text x="160" y="306.5" text-anchor="middle">質問も、索引と同じモデルでベクトルにし、</text>
<text x="160" y="326.5" text-anchor="middle">近いかたまりを上位から3つ取り出す</text>
<line x1="160" y1="342" x2="160" y2="364" class="l sa w2"/>
<polyline points="156.15,357 160,364 163.85,357" class="l sa w2"/>
<rect x="12" y="366" width="296" height="56" class="fas sa" stroke-width="1.5"/>
<text x="160" y="388.5" class="tb" text-anchor="middle">② 添える</text>
<text x="160" y="408.5" text-anchor="middle">3つのかたまりを質問と一緒にLLMへ</text>
<line x1="160" y1="424" x2="160" y2="446" class="l sa w2"/>
<polyline points="156.15,439 160,446 163.85,439" class="l sa w2"/>
<rect x="12" y="448" width="296" height="56" class="fok sok" stroke-width="1.5"/>
<text x="160" y="470.5" class="tb" text-anchor="middle">③ 答える（生成）</text>
<text x="160" y="490.5" text-anchor="middle">LLMが、添えた内容を参照して答える</text>
<line x1="12" y1="520" x2="308" y2="520" class="l sb w1"/>
<text x="12" y="542" class="tb">検索を使わない場合（点線）</text>
<rect x="12" y="552" width="72" height="36" class="fs sm" stroke-width="1.5"/>
<text x="48" y="574.5" text-anchor="middle">質問</text>
<line x1="84" y1="570" x2="150" y2="570" class="l sm w2 dsh"/>
<polyline points="144,565 152,570 144,575" class="l sm w2"/>
<rect x="154" y="552" width="154" height="36" class="fs sm" stroke-width="1.5"/>
<text x="231" y="574.5" text-anchor="middle">LLMが学んだ知識だけ</text>
<text x="12" y="608" class="tm">社内の資料や最近の出来事は知らない</text>
<text x="12" y="624" class="tm">RAGは重みを変えない（再学習しない）</text>
</svg>
