<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 348" role="img" aria-labelledby="fig-ap-mfa-t fig-ap-mfa-d">
<title id="fig-ap-mfa-t">多要素認証：認証の3要素のうち、ちがう種類を2つ以上使う</title>
<desc id="fig-ap-mfa-d">認証の3要素（数えるのは種類）。知識情報は知っているもの（パスワード、秘密の質問）。所持情報は持っているもの（スマホ、ICカード）。生体情報は本人自身に関するもの（指紋、顔）。パスワードとスマホの確認コードは、知識情報と所持情報で2種類なので、多要素（2要素）認証。パスワードと秘密の質問は、どちらも知識情報で1種類なので、二段階だが多要素ではない。</desc>
<text x="12" y="22" class="tb">認証の3要素（数えるのは「種類」）</text>
<rect x="12" y="36" width="92" height="128" class="fas sa" stroke-width="1.5"/>
<text x="58" y="60" class="tb" text-anchor="middle">知識情報</text>
<text x="58" y="79" text-anchor="middle">知っている</text>
<text x="58" y="98" text-anchor="middle">もの</text>
<line x1="20" y1="120" x2="96" y2="120" class="l sb w1"/>
<text x="58" y="137" text-anchor="middle">パスワード</text>
<text x="58" y="156" text-anchor="middle">秘密の質問</text>
<rect x="114" y="36" width="92" height="128" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="60" class="tb" text-anchor="middle">所持情報</text>
<text x="160" y="79" text-anchor="middle">持っている</text>
<text x="160" y="98" text-anchor="middle">もの</text>
<line x1="122" y1="120" x2="198" y2="120" class="l sb w1"/>
<text x="160" y="137" text-anchor="middle">スマホ</text>
<text x="160" y="156" text-anchor="middle">ICカード</text>
<rect x="216" y="36" width="92" height="128" class="fok sok" stroke-width="1.5"/>
<text x="262" y="60" class="tb" text-anchor="middle">生体情報</text>
<text x="262" y="79" text-anchor="middle">本人自身に</text>
<text x="262" y="98" text-anchor="middle">関するもの</text>
<line x1="224" y1="120" x2="300" y2="120" class="l sb w1"/>
<text x="262" y="137" text-anchor="middle">指紋</text>
<text x="262" y="156" text-anchor="middle">顔</text>
<rect x="12" y="180" width="296" height="74" class="fok sok" stroke-width="1.5"/>
<text x="160" y="200.5" class="tb" text-anchor="middle">パスワード ＋ スマホの確認コード</text>
<text x="160" y="221.5" text-anchor="middle">知識情報＋所持情報＝2種類</text>
<text x="160" y="242.5" text-anchor="middle">→ 多要素（2要素）認証</text>
<rect x="12" y="266" width="296" height="74" class="fng sng" stroke-width="1.5"/>
<text x="160" y="286.5" class="tb" text-anchor="middle">パスワード ＋ 秘密の質問</text>
<text x="160" y="307.5" text-anchor="middle">どちらも知識情報＝1種類</text>
<text x="160" y="328.5" text-anchor="middle">→ 二段階だが、多要素ではない</text>
</svg>
