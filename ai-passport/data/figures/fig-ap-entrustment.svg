<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-ap-entrustment-t fig-ap-entrustment-d">
<title id="fig-ap-entrustment-t">委託：自社の目的のために個人データの取扱いを任せる。範囲を超えると第三者提供と変わらない</title>
<desc id="fig-ap-entrustment-d">左の箱は自社で、顧客の住所を持ち、ダイレクトメールを送るという自社の目的がある。右の箱は委託先の印刷会社で、発送だけを受け持つ。上の矢印で自社が住所を渡し、下の点線の矢印で自社が委託先を監督する（個人情報保護法25条の監督の義務）。自社の利用目的の達成に必要な範囲で任せるこの提供は、第三者提供に当たらない（27条5項1号）。範囲を超えて、委託先が自分の目的に使うと、第三者提供と変わらなくなる。生成AIに個人データを入れるときは、提供事業者が個人データを応答結果を出すためだけに使うのではなく、それ以外の目的（機械学習など）で取り扱われると法違反となる可能性がある。だから提供事業者が学習に使わないことを確かめる。</desc>
<text x="12" y="20" class="tb">委託：自社の目的のために任せる</text>
<rect x="12" y="34" width="112" height="78" class="fas sa" stroke-width="1.5"/>
<text x="68" y="56" class="tb ta" text-anchor="middle">自社</text>
<text x="68" y="78" text-anchor="middle">顧客の住所</text>
<text x="68" y="98" class="tm" text-anchor="middle">目的：DMを送る</text>
<rect x="196" y="34" width="112" height="78" class="fok sok" stroke-width="1.5"/>
<text x="252" y="56" class="tb tok" text-anchor="middle">印刷会社</text>
<text x="252" y="78" class="tm" text-anchor="middle">（委託先）</text>
<text x="252" y="98" text-anchor="middle">発送だけする</text>
<line x1="124" y1="58" x2="194" y2="58" class="l sok w2"/>
<polyline points="187,61.85 194,58 187,54.15" class="l sok w2"/>
<text x="160" y="50" class="tm" text-anchor="middle">住所を渡す</text>
<line x1="124" y1="94" x2="194" y2="94" class="l sa w2 dsh"/>
<polyline points="187,97.85 194,94 187,90.15" class="l sa w2"/>
<text x="160" y="86" class="ta" text-anchor="middle">監督する</text>
<text x="12" y="138" class="tb tok">第三者提供に当たらない</text>
<text x="12" y="158" class="tm">（自社の目的に必要な範囲で任せるから）</text>
<text x="12" y="180" class="ta">自社には、委託先を監督する義務がある</text>
<line x1="12" y1="196" x2="308" y2="196" class="l sb w1"/>
<text x="12" y="220" class="tb twn">範囲を超えると</text>
<rect x="12" y="230" width="296" height="48" class="fwn swn" stroke-width="1.5"/>
<text x="22" y="250">委託先が、自分の目的に使う</text>
<text x="22" y="270" class="tb twn">→第三者提供と変わらなくなる</text>
<line x1="12" y1="294" x2="308" y2="294" class="l sb w1"/>
<text x="12" y="318" class="tb">生成AIに個人データを入れるとき</text>
<text x="12" y="340" class="tm">自社→生成AIの提供事業者</text>
<rect x="12" y="350" width="296" height="44" class="fok sok" stroke-width="1.5"/>
<text x="22" y="377" class="tok">○ 応答結果を出すためだけに使う</text>
<rect x="12" y="400" width="296" height="64" class="fng sng" stroke-width="1.5"/>
<text x="22" y="424" class="tng">× それ以外（機械学習など）に使う</text>
<text x="22" y="448" class="tb tng">→法違反となる可能性</text>
<text x="12" y="488" class="tb twn">提供事業者が学習に使わないことを</text>
<text x="12" y="510" class="tb twn">十分に確かめる</text>
</svg>
