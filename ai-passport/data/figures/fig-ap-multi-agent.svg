<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-ap-multi-agent-t fig-ap-multi-agent-d">
<title id="fig-ap-multi-agent-t">マルチエージェント：指揮役が配り、作業役が同時に調べ、指揮役がまとめる</title>
<desc id="fig-ap-multi-agent-d">Anthropicの調べ物の機能の例。いちばん上の指揮役のエージェントが質問を分析し、作戦を立てて仕事を配る。矢印が3つに分かれ、作業役A・B・C（サブエージェント）がそれぞれ違うテーマを同時に調べる。3つの結果が1つに集まり、指揮役がまとめて答えを出す。1つのエージェントだと、順番に検索するので遅く、ある株価指数に入る情報技術の会社の取締役を全部挙げる問いでは答えを見つけられなかった。下の棒グラフは使うトークン（AIが文を読み書きするときの単位）の量で、チャットを1とすると、エージェントはおよそ4倍、マルチエージェントはおよそ15倍。だから価値の高い仕事に向き、全員が同じ文脈を要る仕事や、依存の多い仕事（多くのプログラミング）には、いまは向かない。</desc>
<text x="12" y="20" class="tb">マルチエージェント（調べ物の例）</text>
<rect x="12" y="34" width="296" height="58" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="56" class="tb ta" text-anchor="middle">指揮役のエージェント</text>
<text x="160" y="78" text-anchor="middle">質問を分析し、作戦を立てて配る</text>
<line x1="160" y1="92" x2="160" y2="104" class="l w2"/>
<line x1="58" y1="104" x2="262" y2="104" class="l w2"/>
<line x1="58" y1="104" x2="58" y2="120" class="l w2"/>
<polyline points="54.15,113 58,120 61.85,113" class="l w2"/>
<line x1="160" y1="104" x2="160" y2="120" class="l w2"/>
<polyline points="156.15,113 160,120 163.85,113" class="l w2"/>
<line x1="262" y1="104" x2="262" y2="120" class="l w2"/>
<polyline points="258.15,113 262,120 265.85,113" class="l w2"/>
<rect x="12" y="122" width="92" height="72" class="fok sok" stroke-width="1.5"/>
<text x="58" y="144" class="tb tok" text-anchor="middle">作業役A</text>
<text x="58" y="164" text-anchor="middle">テーマA</text>
<text x="58" y="184" class="tm" text-anchor="middle">同時に調べる</text>
<rect x="114" y="122" width="92" height="72" class="fok sok" stroke-width="1.5"/>
<text x="160" y="144" class="tb tok" text-anchor="middle">作業役B</text>
<text x="160" y="164" text-anchor="middle">テーマB</text>
<text x="160" y="184" class="tm" text-anchor="middle">同時に調べる</text>
<rect x="216" y="122" width="92" height="72" class="fok sok" stroke-width="1.5"/>
<text x="262" y="144" class="tb tok" text-anchor="middle">作業役C</text>
<text x="262" y="164" text-anchor="middle">テーマC</text>
<text x="262" y="184" class="tm" text-anchor="middle">同時に調べる</text>
<line x1="58" y1="194" x2="58" y2="208" class="l w2"/>
<line x1="160" y1="194" x2="160" y2="208" class="l w2"/>
<line x1="262" y1="194" x2="262" y2="208" class="l w2"/>
<line x1="58" y1="208" x2="262" y2="208" class="l w2"/>
<line x1="160" y1="208" x2="160" y2="226" class="l w2"/>
<polyline points="156.15,219 160,226 163.85,219" class="l w2"/>
<rect x="12" y="228" width="296" height="40" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="253" class="tb ta" text-anchor="middle">指揮役が結果をまとめて答える</text>
<text x="12" y="294" class="tb">1つのエージェントだと</text>
<text x="12" y="316">順番に検索して遅い。取締役を全部挙げる</text>
<text x="12" y="336">問いでは、答えを見つけられなかった</text>
<line x1="12" y1="352" x2="308" y2="352" class="l sb w1"/>
<text x="12" y="376" class="tb">使うトークンの量（チャットを1として）</text>
<text x="12" y="396" class="tm">トークン＝AIが文を読み書きする単位</text>
<text x="12" y="420">チャット</text>
<rect x="12" y="426" width="12" height="14" class="fwn swn" stroke-width="1.5"/>
<text x="32" y="438" class="tb">1</text>
<text x="12" y="460">エージェント</text>
<rect x="12" y="466" width="48" height="14" class="fwn swn" stroke-width="1.5"/>
<text x="68" y="478" class="tb">約4倍</text>
<text x="12" y="500">マルチエージェント</text>
<rect x="12" y="506" width="180" height="14" class="fwn swn" stroke-width="1.5"/>
<text x="200" y="518" class="tb twn">約15倍</text>
<text x="12" y="546" class="tm">→ 価値の高い仕事に向く</text>
</svg>
