<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 928" role="img" aria-labelledby="fig-ap-scaling-law-t fig-ap-scaling-law-d">
<title id="fig-ap-scaling-law-t">スケーリング則：損失はべき乗則で下がる。パラメータを10倍にするたびに約0.84倍</title>
<desc id="fig-ap-scaling-law-d">言葉：損失は予測が正解からどれだけずれているかの数で小さいほど良い。パラメータは学習で決まる数（重みなど）。①両対数のグラフ（たて・よことも10倍ごとの目盛り）では、大きくするほど損失が直線で下がる。べき乗則は両対数で直線になる。例：モデルの大きさの傾きは−0.076で、パラメータを10倍にするたびに損失に10の−0.076乗が掛かる。マイナスの何乗は割り算を表し、10の−0.076乗＝1÷（10の0.076乗）。10の0.076乗≒1.19なので、1÷1.19≒0.84倍（約16％下がる）。100倍は10倍を2回なので、0.84×0.84≒0.70倍。図の線は見やすいよう急に描いてある。②同じ関係を普通の目盛りで描くと、最初は急に下がり、あとはゆっくりになる。モデルの大きさ（パラメータ数）・データ量・学習に使う計算量の3つのどれでも成り立ち、7桁以上にわたる範囲で見られた傾向。</desc>
<rect x="12" y="6" width="296" height="88" class="fs sb" stroke-width="1" rx="6"/>
<text x="22" y="29" class="tb">言葉：損失・パラメータ</text>
<text x="22" y="47">損失：予測が正解からどれだけずれて</text>
<text x="22" y="65">　いるかの数（小さいほど良い）</text>
<text x="22" y="83">パラメータ：学習で決まる数（重みなど）</text>
<g transform="translate(0,100)">
<text x="12" y="20" class="tb">① 両対数のグラフ：直線になる</text>
<rect x="48" y="44" width="252" height="146" class="fs sb" stroke-width="1.5"/>
<line x1="48" y1="44" x2="48" y2="190" class="l sb w1"/>
<line x1="84" y1="44" x2="84" y2="190" class="l sb w1"/>
<line x1="120" y1="44" x2="120" y2="190" class="l sb w1"/>
<line x1="156" y1="44" x2="156" y2="190" class="l sb w1"/>
<line x1="192" y1="44" x2="192" y2="190" class="l sb w1"/>
<line x1="228" y1="44" x2="228" y2="190" class="l sb w1"/>
<line x1="264" y1="44" x2="264" y2="190" class="l sb w1"/>
<line x1="300" y1="44" x2="300" y2="190" class="l sb w1"/>
<polyline points="48,54 57,58.5 66,63 75,67.5 84,72 93,76.5 102,81 111,85.5 120,90 129,94.5 138,99 147,103.5 156,108 165,112.5 174,117 183,121.5 192,126 201,130.5 210,135 219,139.5 228,144 237,148.5 246,153 255,157.5 264,162 273,166.5 282,171 291,175.5 300,180" class="l sa w2"/>
<circle cx="48" cy="54" r="3.5" class="fa sa"/>
<circle cx="84" cy="72" r="3.5" class="fa sa"/>
<circle cx="120" cy="90" r="3.5" class="fa sa"/>
<circle cx="156" cy="108" r="3.5" class="fa sa"/>
<circle cx="192" cy="126" r="3.5" class="fa sa"/>
<circle cx="228" cy="144" r="3.5" class="fa sa"/>
<circle cx="264" cy="162" r="3.5" class="fa sa"/>
<circle cx="300" cy="180" r="3.5" class="fa sa"/>
<line x1="156" y1="108" x2="192" y2="108" class="l swn w2"/>
<line x1="192" y1="108" x2="192" y2="126" class="l swn w2"/>
<text x="174" y="100" class="tb twn" text-anchor="middle">10倍</text>
<text x="198" y="119" class="tb twn">×0.84</text>
<text x="42" y="58" class="tm" text-anchor="end">損失</text>
<text x="42" y="76" class="tm" text-anchor="end">大</text>
<text x="42" y="188" class="tm" text-anchor="end">小</text>
<text x="300" y="210" class="tm" text-anchor="end">大きくする（10倍ごと）→</text>
<text x="12" y="234" class="tm">たて・よこ とも 10倍ごとの目盛り</text>
<text x="12" y="256" class="tb ta">べき乗則 ＝ 両対数で直線</text>
<text x="12" y="282" class="tb">例：モデルの大きさ（傾き −0.076）</text>
<text x="12" y="302">パラメータを10倍にするたびに、損失に</text>
<text x="12" y="322" class="tb twn">10 の −0.076 乗 が掛かる</text>
<text x="12" y="346">マイナスの何乗は割り算を表す：</text>
<text x="12" y="366">10 の −0.076 乗 ＝ 1÷（10 の 0.076 乗）</text>
<text x="12" y="386">10 の 0.076 乗 ≒ 1.19 なので</text>
<text x="12" y="408" class="tb twn">1÷1.19 ≒ 0.84倍（約16％下がる）</text>
<text x="12" y="430">100倍は10倍を2回：0.84×0.84≒0.70倍</text>
<text x="12" y="452" class="tm">図の線は見やすいよう急に描いてある</text>
<g transform="translate(0,210)">
<line x1="12" y1="274" x2="308" y2="274" class="l sb w1"/>
<text x="12" y="298" class="tb">② 同じ関係を、普通の目盛りで描くと</text>
<rect x="48" y="314" width="252" height="114" class="fs sb" stroke-width="1.5"/>
<polyline points="48,322 52.2,354.3 56.4,367.35 60.6,375.16 64.8,380.6 69,384.7 73.2,387.96 77.4,390.64 81.6,392.91 85.8,394.86 90,396.56 94.2,398.08 98.4,399.43 102.6,400.65 106.8,401.77 111,402.79 115.2,403.72 119.4,404.59 123.6,405.4 127.8,406.16 132,406.86 136.2,407.53 140.4,408.15 144.6,408.74 148.8,409.31 153,409.84 157.2,410.34 161.4,410.82 165.6,411.29 169.8,411.73 174,412.15 178.2,412.55 182.4,412.94 186.6,413.31 190.8,413.67 195,414.02 199.2,414.35 203.4,414.67 207.6,414.99 211.8,415.29 216,415.58 220.2,415.86 224.4,416.14 228.6,416.4 232.8,416.66 237,416.91 241.2,417.16 245.4,417.39 249.6,417.63 253.8,417.85 258,418.07 262.2,418.28 266.4,418.49 270.6,418.7 274.8,418.9 279,419.09 283.2,419.28 287.4,419.47 291.6,419.65 295.8,419.83 300,420" class="l swn w2"/>
<text x="42" y="328" class="tm" text-anchor="end">損失</text>
<text x="300" y="448" class="tm" text-anchor="end">大きくする →</text>
<text x="12" y="472" class="tm">最初は急に下がり、あとはゆっくり</text>
<line x1="12" y1="490" x2="308" y2="490" class="l sb w1"/>
<text x="12" y="514" class="tb">3つのどれでも成り立つ</text>
<text x="12" y="536">・モデルの大きさ（パラメータ数）</text>
<text x="12" y="556">・データ量</text>
<text x="12" y="576">・学習に使う計算量</text>
<text x="12" y="606" class="tm">7桁以上にわたる範囲で見られた傾向</text>
</g>
</g>
</svg>
