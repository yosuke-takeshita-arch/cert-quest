<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 556" role="img" aria-labelledby="fig-ap-tool-approval-flow-t fig-ap-tool-approval-flow-d">
<title id="fig-ap-tool-approval-flow-t">新しいAIツールの申請→審査→承認・却下→一覧に載せる、の流れ（一例）</title>
<desc id="fig-ap-tool-approval-flow-d">流れの組み方は一例。①申請：社員が、使う目的、入力する情報の種類、ツールの規約の写しを付けて出す。②審査：情報システム・法務・個人情報の担当などが、データの扱い・規約・安全性を見る。審査の結果は3通りに分かれる。承認（例：社外秘まで入力可）、条件付きの承認（例：公開情報だけ）、却下（例：入力を学習に使う規約のため）。③承認したら承認済みツールの一覧に載せて全社に知らせる。下の注意：審査が遅すぎると、社員は待てずに承認されていないAIを無断で使い始める（シャドーAI）。審査を厳しくするほど安全とは限らない。</desc>
<text x="12" y="20" class="tb">AIツールの申請と承認の流れ（一例）</text>
<rect x="12" y="34" width="296" height="78" class="fs sb" stroke-width="1.5"/>
<text x="22" y="56" class="tb">① 申請（社員）</text>
<text x="22" y="78">目的・入力する情報の種類・</text>
<text x="22" y="98">ツールの規約の写しを付ける</text>
<line x1="160" y1="112" x2="160" y2="132" class="l w2"/>
<polyline points="156.15,125 160,132 163.85,125" class="l w2"/>
<rect x="12" y="134" width="296" height="78" class="fas sa" stroke-width="1.5"/>
<text x="22" y="156" class="tb ta">② 審査</text>
<text x="22" y="178">情報システム・法務・個人情報の担当</text>
<text x="22" y="198" class="tm">データの扱い・規約・安全性を見る</text>
<line x1="160" y1="212" x2="160" y2="224" class="l w2"/>
<line x1="58" y1="224" x2="262" y2="224" class="l w2"/>
<line x1="58" y1="224" x2="58" y2="240" class="l w2"/>
<polyline points="54.15,233 58,240 61.85,233" class="l w2"/>
<line x1="160" y1="224" x2="160" y2="240" class="l w2"/>
<polyline points="156.15,233 160,240 163.85,233" class="l w2"/>
<line x1="262" y1="224" x2="262" y2="240" class="l w2"/>
<polyline points="258.15,233 262,240 265.85,233" class="l w2"/>
<rect x="12" y="242" width="92" height="76" class="fok sok" stroke-width="1.5"/>
<text x="58" y="264" class="tb tok" text-anchor="middle">承認</text>
<text x="58" y="286" class="tm" text-anchor="middle">社外秘まで</text>
<text x="58" y="306" class="tm" text-anchor="middle">入力可</text>
<rect x="114" y="242" width="92" height="76" class="fok sok" stroke-width="1.5"/>
<text x="160" y="264" class="tb tok" text-anchor="middle">条件付き</text>
<text x="160" y="286" class="tm" text-anchor="middle">公開情報</text>
<text x="160" y="306" class="tm" text-anchor="middle">だけ</text>
<rect x="216" y="242" width="92" height="76" class="fng sng" stroke-width="1.5"/>
<text x="262" y="264" class="tb tng" text-anchor="middle">却下</text>
<text x="262" y="286" class="tm" text-anchor="middle">入力を学習に</text>
<text x="262" y="306" class="tm" text-anchor="middle">使う規約</text>
<line x1="58" y1="318" x2="58" y2="332" class="l sok w2"/>
<line x1="160" y1="318" x2="160" y2="332" class="l sok w2"/>
<line x1="58" y1="332" x2="160" y2="332" class="l sok w2"/>
<line x1="109" y1="332" x2="109" y2="350" class="l sok w2"/>
<polyline points="105.15,343 109,350 112.85,343" class="l sok w2"/>
<rect x="12" y="352" width="296" height="58" class="fok sok" stroke-width="1.5"/>
<text x="22" y="374" class="tb tok">③ 承認済みツールの一覧に載せる</text>
<text x="22" y="396">全社に知らせる</text>
<line x1="12" y1="426" x2="308" y2="426" class="l sb w1"/>
<text x="12" y="450" class="tb twn">審査が遅すぎると</text>
<rect x="12" y="460" width="296" height="48" class="fwn swn" stroke-width="1.5"/>
<text x="22" y="480">社員が待てずに無断で使い始める</text>
<text x="22" y="500" class="tb twn">＝シャドーAI</text>
<text x="12" y="532" class="tm">審査を厳しくするほど安全、とは限らない</text>
</svg>
