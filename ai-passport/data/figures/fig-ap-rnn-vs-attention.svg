<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" role="img" aria-labelledby="fig-ap-rnn-vs-attention-t fig-ap-rnn-vs-attention-d">
<title id="fig-ap-rnn-vs-attention-t">順番待ちの段の数：RNNは文の長さだけ段が要り、Self-Attentionは一定の段で済む</title>
<desc id="fig-ap-rnn-vs-attention-d">例は100語の文で、図は5語に縮めて描く。①RNNは1語ずつ順に読み、前の語の計算が終わるまで次へ進めない。100語なら100段を1つずつ行う。1語目の情報は、間の99段を通って100語目へ届く。②Self-Attentionは、全部の語の組を一度に結ぶ。どの2語も直接つながる（1段）ので、文の長さによらず一定の段で済み、同時に計算できてGPUと相性がよい。離れた語どうしのつながり（長距離依存）の例：「先週…買ったケーキは、とてもおいしかった」。RNNはケーキからおいしかったまで間の語の段を通るが、Self-Attentionは直接結ぶ。並列に計算できても、学習に要る文章の量が減るわけではない。</desc>
<text x="12" y="20" class="tb">順番待ちの段の数：RNN と Self-Attention</text>
<text x="12" y="40" class="tm">例：100語の文（図は5語に縮めて描く）</text>
<text x="12" y="66" class="tb twn">① RNN：1語ずつ順に読む</text>
<rect x="12" y="76" width="44" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="34" y="96" text-anchor="middle">1</text>
<line x1="57" y1="91" x2="69" y2="91" class="l swn w2"/>
<polyline points="62.00,95.00 69,91 62.00,87.00" class="l swn w2"/>
<rect x="70" y="76" width="44" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="92" y="96" text-anchor="middle">2</text>
<line x1="115" y1="91" x2="127" y2="91" class="l swn w2"/>
<polyline points="120.00,95.00 127,91 120.00,87.00" class="l swn w2"/>
<rect x="128" y="76" width="44" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="150" y="96" text-anchor="middle">3</text>
<line x1="173" y1="91" x2="185" y2="91" class="l swn w2"/>
<polyline points="178.00,95.00 185,91 178.00,87.00" class="l swn w2"/>
<rect x="186" y="76" width="44" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="208" y="96" text-anchor="middle">…</text>
<line x1="231" y1="91" x2="243" y2="91" class="l swn w2"/>
<polyline points="236.00,95.00 243,91 236.00,87.00" class="l swn w2"/>
<rect x="244" y="76" width="44" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="266" y="96" text-anchor="middle">100</text>
<text x="12" y="128">前の語の計算が終わるまで次へ進めない</text>
<text x="12" y="148" class="tb">→ 100語なら100段を1つずつ</text>
<text x="12" y="168">1語目の情報は、間の99段を通って100語目へ</text>
<line x1="12" y1="184" x2="308" y2="184" class="l sb w1"/>
<text x="12" y="208" class="tb ta">② Self-Attention：全部の語を一度に結ぶ</text>
<path d="M34,274 Q63,236 92,274" class="l sa w1"/>
<path d="M34,274 Q97,218 160,274" class="l sa w1"/>
<path d="M34,274 Q131,200 228,274" class="l sa w1"/>
<path d="M34,274 Q160,182 286,274" class="l sa w1"/>
<path d="M92,274 Q126,236 160,274" class="l sa w1"/>
<path d="M92,274 Q160,218 228,274" class="l sa w1"/>
<path d="M92,274 Q189,200 286,274" class="l sa w1"/>
<path d="M160,274 Q194,236 228,274" class="l sa w1"/>
<path d="M160,274 Q223,218 286,274" class="l sa w1"/>
<path d="M228,274 Q257,236 286,274" class="l sa w1"/>
<rect x="12" y="275" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="34" y="295" text-anchor="middle">1</text>
<rect x="70" y="275" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="92" y="295" text-anchor="middle">2</text>
<rect x="138" y="275" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="160" y="295" text-anchor="middle">3</text>
<rect x="206" y="275" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="228" y="295" text-anchor="middle">…</text>
<rect x="264" y="275" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="286" y="295" text-anchor="middle">100</text>
<text x="12" y="330">どの2語も直接つながる（1段）</text>
<text x="12" y="350" class="tb">→ 文の長さによらず、一定の段で済む</text>
<text x="12" y="370">→ 同時に計算でき、GPU と相性がよい</text>
<line x1="12" y1="386" x2="308" y2="386" class="l sb w1"/>
<text x="12" y="408" class="tb">離れた語どうしのつながり（長距離依存）</text>
<text x="12" y="430">「先週…買ったケーキは、とてもおいしかった」</text>
<text x="12" y="450" class="tm">RNN：ケーキ→（間の語の段）→おいしかった</text>
<text x="12" y="470" class="tm">Self-Attention：ケーキ↔おいしかった を直接</text>
<text x="12" y="494" class="tng">並列にできても、学習に要る文章は減らない</text>
</svg>
