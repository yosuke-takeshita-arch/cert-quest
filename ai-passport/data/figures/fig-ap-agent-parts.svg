<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" role="img" aria-labelledby="fig-ap-agent-parts-t fig-ap-agent-parts-d">
<title id="fig-ap-agent-parts-t">LLMを中核としたエージェントの構成：中心のLLMに、指示・記憶・道具をつなぐ</title>
<desc id="fig-ap-agent-parts-d">問い合わせ対応のエージェントの例。上に2つの箱。指示（例：返金は3万円まで、丁寧な言葉で）と、記憶（例：この会話の流れ、前回の対応の記録）。どちらも下の、中心のLLM（大規模言語モデル）に入る。LLMは考えて、次に何をするかを決め、呼ぶ道具と引数を出す。その下の、つないだアプリが道具を実際に動かす。いちばん下が道具（ツール）で、例は顧客の記録を読む、返金を登録する。OpenAIの手引きは基本の部品をモデル（LLM）・ツール・指示の3つとし、Anthropicは検索・道具・記憶で強化したLLMを基本の部品としている。LLMだけでは外のデータを読み書きできず、前の作業も覚えておけない。道具を動かすのはLLMではなく、つないだアプリの側。</desc>
<text x="12" y="20" class="tb">エージェントの部品（例：問い合わせ対応）</text>
<rect x="12" y="34" width="142" height="78" class="fs sb" stroke-width="1.5"/>
<text x="22" y="56" class="tb">指示</text>
<text x="22" y="78">返金は3万円まで</text>
<text x="22" y="98">丁寧な言葉で</text>
<rect x="166" y="34" width="142" height="78" class="fs sb" stroke-width="1.5"/>
<text x="176" y="56" class="tb">記憶</text>
<text x="176" y="78">この会話の流れ</text>
<text x="176" y="98">前回の対応の記録</text>
<line x1="83" y1="112" x2="83" y2="134" class="l w2"/>
<polyline points="79.15,127 83,134 86.85,127" class="l w2"/>
<line x1="237" y1="112" x2="237" y2="134" class="l w2"/>
<polyline points="233.15,127 237,134 240.85,127" class="l w2"/>
<rect x="12" y="136" width="296" height="62" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="160" class="tb ta" text-anchor="middle">中心のLLM（大規模言語モデル）</text>
<text x="160" y="184" text-anchor="middle">考えて、次に何をするかを決める</text>
<line x1="160" y1="198" x2="160" y2="226" class="l w2"/>
<polyline points="156.15,219 160,226 163.85,219" class="l w2"/>
<text x="170" y="217" class="tm">呼ぶ道具と引数を出す</text>
<rect x="12" y="228" width="296" height="58" class="fs sb" stroke-width="1.5"/>
<text x="160" y="250" class="tb" text-anchor="middle">つないだアプリ</text>
<text x="160" y="272" text-anchor="middle">道具を実際に動かす側</text>
<line x1="160" y1="286" x2="160" y2="314" class="l sok w2"/>
<polyline points="156.15,307 160,314 163.85,307" class="l sok w2"/>
<rect x="12" y="316" width="296" height="62" class="fok sok" stroke-width="1.5"/>
<text x="160" y="340" class="tb tok" text-anchor="middle">道具（ツール）</text>
<text x="160" y="364" text-anchor="middle">顧客の記録を読む・返金を登録する</text>
<line x1="12" y1="394" x2="308" y2="394" class="l sb w1"/>
<text x="12" y="418">基本の3部品（OpenAI）：LLM・道具・指示</text>
<text x="12" y="440">検索・道具・記憶で強化（Anthropic）</text>
<text x="12" y="466" class="tm">LLMだけでは、外のデータを読み書き</text>
<text x="12" y="486" class="tm">できず、前の作業も覚えておけない</text>
<text x="12" y="512" class="tb twn">道具を動かすのはLLMではなく、</text>
<text x="12" y="534" class="tb twn">つないだアプリの側</text>
</svg>
