<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 638" role="img" aria-labelledby="fig-ap-temperature-t fig-ap-temperature-d">
<title id="fig-ap-temperature-t">Temperature（温度）：低いほど一番の候補に集まり、高いほどばらつく</title>
<desc id="fig-ap-temperature-d">次のトークンの候補と確率の例。基準（Temperature 1）では、良い0.5、悪い0.3、雨0.15、象0.05。Temperature 0では一番の「良い」を毎回選ぶので、ほぼ同じ答えになる。低い（0.5）では、良い0.68、悪い0.25、雨0.06、象0.01と上位に集まり、決まった答えに近い。高い（2）では、良い0.38、悪い0.29、雨0.21、象0.12と差が縮み、下位も選ばれやすく、答えが毎回変わりやすい（数は、ふつう使われる計算のしかたで出した例）。同じ質問に毎回同じような答えを返させたいならTemperatureを低くする。アイデアを広く出させたいなら高くする。</desc>
<text x="12" y="20" class="tb">Temperature（温度）：選ぶときのばらつき</text>
<text x="12" y="40" class="tm">次のトークンの候補と確率（数は例）</text>
<text x="12" y="68" class="tb">Temperature 0</text>
<text x="52" y="89" text-anchor="end">良い</text>
<rect x="60" y="76" width="200" height="16" class="fas sa" stroke-width="1.5"/>
<text x="266" y="89" class="tm">1（必ず）</text>
<text x="52" y="108" text-anchor="end">悪い</text>
<rect x="60" y="95" width="1" height="16" class="fas sa" stroke-width="1.5"/>
<text x="66" y="108" class="tm">0</text>
<text x="52" y="127" text-anchor="end">雨</text>
<rect x="60" y="114" width="1" height="16" class="fas sa" stroke-width="1.5"/>
<text x="66" y="127" class="tm">0</text>
<text x="52" y="146" text-anchor="end">象</text>
<rect x="60" y="133" width="1" height="16" class="fas sa" stroke-width="1.5"/>
<text x="66" y="146" class="tm">0</text>
<text x="12" y="166" class="tb tok">一番の「良い」を毎回選ぶ → ほぼ同じ答え</text>
<text x="12" y="192" class="tb">低い（0.5）</text>
<text x="52" y="213" text-anchor="end">良い</text>
<rect x="60" y="200" width="136" height="16" class="fas sa" stroke-width="1.5"/>
<text x="202" y="213" class="tm">0.68</text>
<text x="52" y="232" text-anchor="end">悪い</text>
<rect x="60" y="219" width="50" height="16" class="fas sa" stroke-width="1.5"/>
<text x="116" y="232" class="tm">0.25</text>
<text x="52" y="251" text-anchor="end">雨</text>
<rect x="60" y="238" width="12" height="16" class="fas sa" stroke-width="1.5"/>
<text x="78" y="251" class="tm">0.06</text>
<text x="52" y="270" text-anchor="end">象</text>
<rect x="60" y="257" width="2" height="16" class="fas sa" stroke-width="1.5"/>
<text x="68" y="270" class="tm">0.01</text>
<text x="12" y="290" class="tb tok">上位に集まる → 決まった答えに近い</text>
<text x="12" y="316" class="tb">基準（1）</text>
<text x="52" y="337" text-anchor="end">良い</text>
<rect x="60" y="324" width="100" height="16" class="fas sa" stroke-width="1.5"/>
<text x="166" y="337" class="tm">0.50</text>
<text x="52" y="356" text-anchor="end">悪い</text>
<rect x="60" y="343" width="60" height="16" class="fas sa" stroke-width="1.5"/>
<text x="126" y="356" class="tm">0.30</text>
<text x="52" y="375" text-anchor="end">雨</text>
<rect x="60" y="362" width="30" height="16" class="fas sa" stroke-width="1.5"/>
<text x="96" y="375" class="tm">0.15</text>
<text x="52" y="394" text-anchor="end">象</text>
<rect x="60" y="381" width="10" height="16" class="fas sa" stroke-width="1.5"/>
<text x="76" y="394" class="tm">0.05</text>
<text x="12" y="422" class="tb">高い（2）</text>
<text x="52" y="443" text-anchor="end">良い</text>
<rect x="60" y="430" width="76" height="16" class="fwn swn" stroke-width="1.5"/>
<text x="142" y="443" class="tm">0.38</text>
<text x="52" y="462" text-anchor="end">悪い</text>
<rect x="60" y="449" width="57.99999999999999" height="16" class="fwn swn" stroke-width="1.5"/>
<text x="124" y="462" class="tm">0.29</text>
<text x="52" y="481" text-anchor="end">雨</text>
<rect x="60" y="468" width="42" height="16" class="fwn swn" stroke-width="1.5"/>
<text x="108" y="481" class="tm">0.21</text>
<text x="52" y="500" text-anchor="end">象</text>
<rect x="60" y="487" width="24" height="16" class="fwn swn" stroke-width="1.5"/>
<text x="90" y="500" class="tm">0.12</text>
<text x="12" y="520" class="tb twn">下位も選ばれやすい → 毎回変わりやすい</text>
<line x1="12" y1="536" x2="308" y2="536" class="l sb w1"/>
<text x="12" y="558" class="tb">同じ質問に毎回同じような答えを返させたい</text>
<text x="12" y="578">→ Temperature を低くする</text>
<text x="12" y="600" class="tm">アイデアを広く出させたい → 高くする</text>
<text x="12" y="620" class="tm">低いほど確率の差が開き、高いほど縮む</text>
</svg>
