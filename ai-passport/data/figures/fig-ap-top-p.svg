<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 354" role="img" aria-labelledby="fig-ap-top-p-t fig-ap-top-p-d">
<title id="fig-ap-top-p-t">Top-p（核サンプリング）：確率の高い順に足し、合計が決めた値に届くまでの候補だけから選ぶ</title>
<desc id="fig-ap-top-p-d">例はTop-p＝0.8（確率は例）。候補を確率の高い順に並べて足していく。良い0.5で合計0.5、悪い0.3で合計0.8、雨0.15で合計0.95、象0.05で合計1。「悪い」で合計が0.8に届いたので、良いと悪いの2つを残し、雨と象は外す。次のトークンは「良い」と「悪い」の中から選ぶ。Temperatureはばらつきの度合いを変え、Top-pは選ぶ候補の範囲を絞る。</desc>
<text x="12" y="20" class="tb">Top-p：確率の高い順に足して、候補を絞る</text>
<text x="12" y="40" class="tm">例：Top-p＝0.8（確率は例）</text>
<text x="60" y="62" class="tm">確率</text>
<text x="200" y="62" class="tm">上から足した合計</text>
<rect x="12" y="70" width="296" height="32" class="fok sok" stroke-width="1.5"/>
<text x="22" y="91" class="tb">良い</text>
<text x="72" y="91">0.5</text>
<text x="200" y="91" class="tb tok">0.5</text>
<text x="298" y="91" class="tb tok" text-anchor="end">残す</text>
<rect x="12" y="108" width="296" height="32" class="fok sok" stroke-width="1.5"/>
<text x="22" y="129" class="tb">悪い</text>
<text x="72" y="129">0.3</text>
<text x="200" y="129" class="tb tok">0.8</text>
<text x="298" y="129" class="tb tok" text-anchor="end">残す</text>
<rect x="12" y="146" width="296" height="32" class="fng sng" stroke-width="1.5"/>
<text x="22" y="167" class="tb">雨</text>
<text x="72" y="167">0.15</text>
<text x="200" y="167" class="tm">0.95</text>
<text x="298" y="167" class="tb tng" text-anchor="end">外す</text>
<rect x="12" y="184" width="296" height="32" class="fng sng" stroke-width="1.5"/>
<text x="22" y="205" class="tb">象</text>
<text x="72" y="205">0.05</text>
<text x="200" y="205" class="tm">1.0</text>
<text x="298" y="205" class="tb tng" text-anchor="end">外す</text>
<line x1="12" y1="143" x2="308" y2="143" class="l sng w2 dsh"/>
<text x="12" y="236" class="tb">「悪い」で合計 0.8 に届いた → ここまで残す</text>
<text x="12" y="258">→「良い」と「悪い」の中から選ぶ</text>
<line x1="12" y1="274" x2="308" y2="274" class="l sb w1"/>
<text x="12" y="296" class="tb">Temperature と Top-p の違い</text>
<text x="12" y="316">Temperature：ばらつきの度合いを変える</text>
<text x="12" y="336">Top-p：選ぶ候補の範囲を絞る</text>
</svg>
