<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 556" role="img" aria-labelledby="fig-ap-seq2seq-attention-t fig-ap-seq2seq-attention-d">
<title id="fig-ap-seq2seq-attention-t">Attention が生まれた理由：元の文を1本の決まった長さのベクトルに詰めていた問題</title>
<desc id="fig-ap-seq2seq-attention-d">①Seq2Seq：エンコーダ（RNN）が「私は猫が好き」を1語ずつ読み、最後に1本の決まった長さのベクトル（固定長ベクトル）に詰める。デコーダ（RNN）はそのベクトルだけを見て I、like と訳を出す。長い文だと、1本のベクトルに情報が入りきらない。②Attention：デコーダが cats を出すとき、毎回、入力の全部の語を見直し、語ごとに重みを付けて足す。例の重みは私0.05、は0.05、猫0.8、が0.05、好き0.05で、合計は1。ほぼ「猫」の情報で cats を出す（数は例）。エンコーダは入力の文を読んで中身の表現に変える部分、デコーダはそこから訳文を作る部分。</desc>
<text x="12" y="20" class="tb">① Seq2Seq：1本のベクトルに詰める</text>
<text x="93" y="56" class="tb" text-anchor="middle">エンコーダ（RNN）</text>
<text x="261" y="56" class="tb" text-anchor="middle">デコーダ（RNN）</text>
<rect x="12" y="110" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="25" y="154" class="tb" text-anchor="middle">私</text>
<rect x="46" y="110" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="59" y="154" class="tb" text-anchor="middle">は</text>
<line x1="38" y1="123" x2="46" y2="123" class="l w2"/>
<polyline points="39,126.85 46,123 39,119.15" class="l w2"/>
<rect x="80" y="110" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="93" y="154" class="tb" text-anchor="middle">猫</text>
<line x1="72" y1="123" x2="80" y2="123" class="l w2"/>
<polyline points="73,126.85 80,123 73,119.15" class="l w2"/>
<rect x="114" y="110" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="127" y="154" class="tb" text-anchor="middle">が</text>
<line x1="106" y1="123" x2="114" y2="123" class="l w2"/>
<polyline points="107,126.85 114,123 107,119.15" class="l w2"/>
<rect x="148" y="110" width="26" height="26" class="fs sb" stroke-width="1.5"/>
<text x="161" y="154" class="tb" text-anchor="middle">好き</text>
<line x1="140" y1="123" x2="148" y2="123" class="l w2"/>
<polyline points="141,126.85 148,123 141,119.15" class="l w2"/>
<line x1="174" y1="123" x2="182" y2="123" class="l w2"/>
<polyline points="175,126.85 182,123 175,119.15" class="l w2"/>
<rect x="182" y="94" width="20" height="58" class="fas sa" stroke-width="1.5"/>
<text x="192" y="174" class="tb ta" text-anchor="middle">固定長ベクトル</text>
<line x1="202" y1="123" x2="216" y2="123" class="l w2"/>
<polyline points="209,126.85 216,123 209,119.15" class="l w2"/>
<rect x="218" y="110" width="38" height="26" class="fs sb" stroke-width="1.5"/>
<text x="237" y="127.5" class="tm" text-anchor="middle">RNN</text>
<line x1="237" y1="110" x2="237" y2="98" class="l w2"/>
<polyline points="240.85,105 237,98 233.15,105" class="l w2"/>
<text x="237" y="90" class="tb" text-anchor="middle">I</text>
<rect x="266" y="110" width="38" height="26" class="fs sb" stroke-width="1.5"/>
<text x="285" y="127.5" class="tm" text-anchor="middle">RNN</text>
<line x1="285" y1="110" x2="285" y2="98" class="l w2"/>
<polyline points="288.85,105 285,98 281.15,105" class="l w2"/>
<text x="285" y="90" class="tb" text-anchor="middle">like</text>
<line x1="256" y1="123" x2="266" y2="123" class="l w2"/>
<polyline points="259,126.85 266,123 259,119.15" class="l w2"/>
<text x="12" y="206" class="tb twn">長い文だと、1本のベクトルに</text>
<text x="12" y="226" class="tb twn">情報が入りきらない</text>
<line x1="12" y1="246" x2="308" y2="246" class="l sb w1"/>
<text x="12" y="270" class="tb">② Attention：毎回、全体を見直す</text>
<rect x="96" y="286" width="128" height="28" class="fs sb" stroke-width="1.5"/>
<text x="160" y="304.5" text-anchor="middle">デコーダ</text>
<text x="232" y="296" class="tb">cats を</text>
<text x="232" y="316" class="tb">出すとき</text>
<circle cx="160" cy="360" r="11" class="fas sa"/>
<line x1="154" y1="360" x2="166" y2="360" class="l sa w2"/>
<line x1="160" y1="354" x2="160" y2="366" class="l sa w2"/>
<line x1="160" y1="349" x2="160" y2="316" class="l w2"/>
<polyline points="163.85,323 160,316 156.15,323" class="l w2"/>
<line x1="150.3" y1="365.1" x2="38" y2="424" class="l sm w1"/>
<rect x="12" y="424" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="38" y="441.5" text-anchor="middle">私</text>
<text x="38" y="472" class="tm" text-anchor="middle">0.05</text>
<line x1="152.4" y1="368.0" x2="99" y2="424" class="l sm w1"/>
<rect x="73" y="424" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="99" y="441.5" text-anchor="middle">は</text>
<text x="99" y="472" class="tm" text-anchor="middle">0.05</text>
<line x1="160.0" y1="371.0" x2="160" y2="424" class="l sa w3"/>
<rect x="134" y="424" width="52" height="26" class="fas sa" stroke-width="1.5"/>
<text x="160" y="441.5" class="tb" text-anchor="middle">猫</text>
<text x="160" y="472" class="tb ta" text-anchor="middle">0.8</text>
<line x1="167.6" y1="368.0" x2="221" y2="424" class="l sm w1"/>
<rect x="195" y="424" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="221" y="441.5" text-anchor="middle">が</text>
<text x="221" y="472" class="tm" text-anchor="middle">0.05</text>
<line x1="169.7" y1="365.1" x2="282" y2="424" class="l sm w1"/>
<rect x="256" y="424" width="52" height="26" class="fs sb" stroke-width="1.5"/>
<text x="282" y="441.5" text-anchor="middle">好き</text>
<text x="282" y="472" class="tm" text-anchor="middle">0.05</text>
<text x="12" y="502" class="tb">すべての位置の状態に重みを掛けて足す</text>
<text x="12" y="524" class="tm">重みは合計1：0.05＋0.05＋0.8＋0.05＋0.05＝1</text>
<text x="12" y="546" class="tm">→ ほぼ「猫」の情報で cats を出す（数は例）</text>
</svg>
