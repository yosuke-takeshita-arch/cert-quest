<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 424" role="img" aria-labelledby="fig-ap-common-guidelines-t fig-ap-common-guidelines-d">
<title id="fig-ap-common-guidelines-t">AI事業者ガイドラインの共通の指針：各主体が取り組む7つと、社会と連携する3つ</title>
<desc id="fig-ap-common-guidelines-d">各主体が取り組む7つは、1人間中心、2安全性、3公平性、4プライバシー保護、5セキュリティ確保、6透明性、7アカウンタビリティ。社会と連携した取組が期待される3つは、8教育・リテラシー、9公正競争確保、10イノベーション。取り違えやすい点：透明性は情報を開示すること、アカウンタビリティは責任を負うこととその前提の整備で、データの出所や意思決定を追跡できるトレーサビリティを含む。「国際競争力の強化」は10項目に無い。</desc>
<text x="12" y="20" class="tb">AI事業者ガイドラインの共通の指針（10項目）</text>
<text x="12" y="46" class="tb ta">各主体が取り組む 7つ</text>
<rect x="12" y="56" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="22" y="76">1 人間中心</text>
<rect x="164" y="56" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="174" y="76">2 安全性</text>
<rect x="12" y="92" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="22" y="112">3 公平性</text>
<rect x="164" y="92" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="174" y="112">4 プライバシー保護</text>
<rect x="12" y="128" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="22" y="148">5 セキュリティ確保</text>
<rect x="164" y="128" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="174" y="148">6 透明性</text>
<rect x="12" y="164" width="144" height="30" class="fas sa" stroke-width="1.5"/>
<text x="22" y="184">7 アカウンタビリティ</text>
<text x="12" y="210" class="tb tok">社会と連携した取組が期待される 3つ</text>
<rect x="12" y="220" width="144" height="30" class="fok sok" stroke-width="1.5"/>
<text x="22" y="240">8 教育・リテラシー</text>
<rect x="164" y="220" width="144" height="30" class="fok sok" stroke-width="1.5"/>
<text x="174" y="240">9 公正競争確保</text>
<rect x="12" y="256" width="144" height="30" class="fok sok" stroke-width="1.5"/>
<text x="22" y="276">10 イノベーション</text>
<line x1="12" y1="304" x2="308" y2="304" class="l sb w1"/>
<text x="12" y="326" class="tb">取り違えやすい</text>
<text x="12" y="346">透明性＝情報を開示する</text>
<text x="12" y="366">アカウンタビリティ＝責任を負うことと、その</text>
<text x="12" y="384">　前提の整備（追跡できる＝トレーサビリティ）</text>
<text x="12" y="406" class="tng">「国際競争力の強化」は10項目に無い</text>
</svg>
