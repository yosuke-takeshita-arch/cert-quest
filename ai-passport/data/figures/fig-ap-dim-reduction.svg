<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 458" role="img" aria-labelledby="fig-ap-dim-reduction-t fig-ap-dim-reduction-d">
<title id="fig-ap-dim-reduction-t">次元削減：項目（列）の数を、情報をなるべく残して減らす</title>
<desc id="fig-ap-dim-reduction-d">例はアンケートの答え（数は例）。上の表は、行が回答した人（1,000人）、列が問1〜問20の20列。情報をなるべく残して縮め、下の表のように「価格を気にする度合い」「品質を気にする度合い」の2列にまとめ直す。2つの軸になるので、グラフに描ける。減るのは列（項目）で、行（人数）は減らない。取り違えやすいもの：次元削減は列をまとめる（20列を2列に）、クラスタリングは行（人）を似たもの同士の組に分ける。</desc>
