<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 222" role="img" aria-labelledby="fig-ap-work-for-hire-t fig-ap-work-for-hire-d">
<title id="fig-ap-work-for-hire-t">職務著作：会社の仕事で作った著作物は、条件を満たすと会社が著作者になる</title>
<desc id="fig-ap-work-for-hire-d">職務著作（著作権法第15条）。社員が仕事として前処理のプログラムを書くと、著作者は会社になり、社員は著作者でない。条件は、会社の発意、職務上作ったもの、別の定めが無いこと。プログラム以外は、会社名義で公表することも要る。権利は書いた時に、手続なしで発生する。</desc>
<text x="12" y="20" class="tb">職務著作：作者は誰か</text>
<text x="12" y="44" class="tb ta">著作権法 第15条</text>
<rect x="12" y="56" width="84" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="54" y="78" class="tb" text-anchor="middle">社員</text>
<text x="112" y="66" class="tm" text-anchor="middle">書く</text>
<line x1="96" y1="73" x2="124.4" y2="73" class="l sm w1"/>
<polygon points="130,73 124.4,69.5 124.4,76.5" class="fm"/>
<rect x="130" y="56" width="178" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="219" y="78" text-anchor="middle">前処理のプログラム</text>
<line x1="219" y1="90" x2="219" y2="104.4" class="l sm w1"/>
<polygon points="219,110 215.5,104.4 222.5,104.4" class="fm"/>
<rect x="130" y="110" width="178" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="219" y="133" class="tb tok" text-anchor="middle">著作者＝会社</text>
<text x="54" y="122" class="tng" text-anchor="middle">社員は</text>
<text x="54" y="140" class="tng" text-anchor="middle">著作者でない</text>
<text x="12" y="170" class="tm">条件：会社の発意・職務上・別の定めが無い</text>
<text x="12" y="190" class="tm">プログラム以外は、会社名義の公表も要る</text>
<text x="12" y="210" class="tm">権利は書いた時に、手続なしで発生</text>
</svg>
