<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 604" role="img" aria-labelledby="fig-ap-qkv-t fig-ap-qkv-d">
<title id="fig-ap-qkv-t">Query・Key・Value：「それ」が、どの語の中身をどれだけ取り込むか</title>
<desc id="fig-ap-qkv-d">辞書引きのたとえ。Queryは何を探しているか（探したいこと）、Keyは自分は何の語か（本の見出し）、Valueは相手に渡す中身（本の中身）。例の文の語は、動物・道・ほかの語。それぞれの語がKeyとValueを持つ。「それ」のQueryを、各語のKeyと掛け合わせて合い具合の点数を出し、ソフトマックスで足して1になる割合に直すと、動物0.7、道0.1、ほかの語で残りの0.2（数は説明のための例）。その割合で各語のValueを混ぜたものが、「それ」の新しい表現になる。Keyは合い具合を測るためだけに使い、混ぜる中身はValue。Q・K・Vはどれも、もとの語の表現に、学習で決まる別々の重みを掛けて作る。</desc>
<text x="12" y="20" class="tb">辞書引きにたとえると</text>
<rect x="12" y="30" width="296" height="84" class="fs sb" stroke-width="1"/>
<text x="22" y="52"><tspan class="tb ta">Query</tspan>＝何を探しているか</text>
<text x="22" y="76"><tspan class="tb">Key</tspan>＝自分は何の語か（見出し）</text>
<text x="22" y="100"><tspan class="tb tok">Value</tspan>＝相手に渡す中身</text>
<text x="12" y="140" class="tb">例：「それ」は、どの語のこと？</text>
<text x="12" y="158" class="tm">（数は説明の例）</text>
<text x="12" y="187">語</text>
<rect x="104" y="170" width="60" height="26" class="fs sb" stroke-width="1.5"/>
<text x="134" y="187.5" class="tb" text-anchor="middle">動物</text>
<rect x="174" y="170" width="60" height="26" class="fs sb" stroke-width="1.5"/>
<text x="204" y="187.5" class="tb" text-anchor="middle">道</text>
<rect x="244" y="170" width="64" height="26" class="fs sb" stroke-width="1.5"/>
<text x="276" y="187.5" class="tb" text-anchor="middle">ほかの語</text>
<text x="12" y="219">Key</text>
<rect x="114" y="204" width="40" height="22" class="fs sb" stroke-width="1.5"/>
<text x="134" y="219.5" text-anchor="middle">K</text>
<rect x="184" y="204" width="40" height="22" class="fs sb" stroke-width="1.5"/>
<text x="204" y="219.5" text-anchor="middle">K</text>
<rect x="256" y="204" width="40" height="22" class="fs sb" stroke-width="1.5"/>
<text x="276" y="219.5" text-anchor="middle">K</text>
<text x="12" y="249" class="tok">Value</text>
<rect x="114" y="234" width="40" height="22" class="fok sok" stroke-width="1.5"/>
<text x="134" y="249.5" text-anchor="middle">V</text>
<rect x="184" y="234" width="40" height="22" class="fok sok" stroke-width="1.5"/>
<text x="204" y="249.5" text-anchor="middle">V</text>
<rect x="256" y="234" width="40" height="22" class="fok sok" stroke-width="1.5"/>
<text x="276" y="249.5" text-anchor="middle">V</text>
<line x1="12" y1="270" x2="308" y2="270" class="l sb w1"/>
<rect x="12" y="282" width="296" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="306.5" class="tb ta" text-anchor="middle">「それ」のQuery を、各語の Key と比べる</text>
<line x1="160" y1="324" x2="160" y2="342" class="l w2"/>
<polyline points="156.15,335 160,342 163.85,335" class="l w2"/>
<text x="12" y="364">合い具合を、足して1の割合に直す</text>
<text x="12" y="382" class="tm">（ソフトマックスという計算）</text>
<text x="12" y="412">割合</text>
<text x="134" y="412" class="tb ta" text-anchor="middle">0.7</text>
<text x="204" y="412" class="tb ta" text-anchor="middle">0.1</text>
<text x="276" y="412" class="tb ta" text-anchor="middle">0.2</text>
<rect x="104" y="420" width="60" height="8" class="fa"/>
<rect x="174" y="420" width="8.6" height="8" class="fa"/>
<rect x="244" y="420" width="17.1" height="8" class="fa"/>
<text x="12" y="428" class="tm">（棒の長さ）</text>
<line x1="160" y1="438" x2="160" y2="456" class="l w2"/>
<polyline points="156.15,449 160,456 163.85,449" class="l w2"/>
<rect x="12" y="458" width="296" height="70" class="fok sok" stroke-width="1.5"/>
<text x="160" y="480" class="tb" text-anchor="middle">「それ」の新しい表現</text>
<text x="160" y="502" text-anchor="middle">＝ 0.7×動物の V ＋ 0.1×道の V</text>
<text x="160" y="520" text-anchor="middle">＋ 0.2×ほかの語の V</text>
<text x="12" y="554" class="tb">Key は合い具合を測るだけ。混ぜる中身は Value</text>
<text x="12" y="578" class="tm">Q・K・V は、もとの語の表現に、学習で決まる</text>
<text x="12" y="596" class="tm">別々の重みを掛けて作る</text>
</svg>
