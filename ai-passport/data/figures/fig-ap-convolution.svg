<text x="269" y="162" class="tm" text-anchor="middle">出力 3×3</text>
<text x="12" y="188" class="tb">出力の左上＝太い枠の9マスの計算</text>
<text x="12" y="208">2×1＋1×0＋0×1</text>
<text x="12" y="228">＋0×0＋2×1＋1×0</text>
<text x="12" y="248" class="tb">＋3×1＋0×0＋1×1 ＝ 8</text>
<text x="12" y="270" class="tm">枠を1マスずつずらし、同じ計算で残りを出す</text>
<line x1="12" y1="286" x2="308" y2="286" class="l sb w1"/>
<text x="12" y="308" class="tb ta">同じフィルタを画像全体で使い回す</text>
<text x="12" y="330">・重みはフィルタの9個だけで済む</text>
<text x="12" y="350" class="tm">　（画素ごとに別の重みを持たない）</text>
<text x="12" y="372">・模様が左上にあっても右下にあっても、</text>
<text x="12" y="392">　同じフィルタで見つけられる</text>
<text x="12" y="416" class="tb">画像のような縦横の格子のデータに強い</text>
<text x="12" y="436" class="tm">（数は説明のための例）</text>
</svg>
