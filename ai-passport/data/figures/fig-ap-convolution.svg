<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 454" role="img" aria-labelledby="fig-ap-convolution-t fig-ap-convolution-d">
<title id="fig-ap-convolution-t">畳み込み：小さなフィルタを画像の上でずらしながら、重みを掛けて足す</title>
<desc id="fig-ap-convolution-d">左は5×5の画像の数、中は3×3のフィルタ（重みの組）、右は出力3×3。出力の左上は、画像の左上の太い枠の9マスにフィルタを重ね、対応する数を掛けて全部足したもの：2×1＋1×0＋0×1＋0×0＋2×1＋1×0＋3×1＋0×0＋1×1＝8。枠を1マスずつずらして同じ計算をすると、残りのマスが出る（出力は上の行から8・7・2、2・6・8、11・3・6）。同じフィルタを画像全体で使い回すので、重みはフィルタの9個だけで済み、画素ごとに別の重みを持たない。また、模様が画像のどこにあっても同じフィルタで見つけられる。だから画像のような縦横の格子のデータに強い。数は説明のための例。</desc>
<text x="12" y="20" class="tb">畳み込み：小さなフィルタをずらし、掛けて足す</text>
