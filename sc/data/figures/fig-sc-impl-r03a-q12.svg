<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="fig-sc-impl-r03a-q12-t fig-sc-impl-r03a-q12-d">
<title id="fig-sc-impl-r03a-q12-t">表 証拠として保全するもの</title>
<desc id="fig-sc-impl-r03a-q12-d">表の見出しは「証拠として保全するもの」。a は遠隔にあるログサーバに記録された調査対象サーバのアクセスログ。b は調査対象サーバにインストールされていた会計ソフトのインストール用CD。c は調査対象サーバのハードディスク上の表計算ファイル。d は調査対象サーバのルーティングテーブルの状態。</desc>
<rect x="8" y="8" width="304" height="284" class="fs sb" stroke-width="1.5"/>
<rect x="8" y="8" width="304" height="32" class="fas sb" stroke-width="1.5"/>
<text x="56" y="30" class="tb">証拠として保全するもの</text>
<line x1="40" y1="40" x2="40" y2="292" class="l sb w1"/>
<line x1="8" y1="104" x2="312" y2="104" class="l sb w1"/>
<line x1="8" y1="168" x2="312" y2="168" class="l sb w1"/>
<line x1="8" y1="232" x2="312" y2="232" class="l sb w1"/>
<text x="18" y="64">a</text>
<text x="48" y="64">遠隔にあるログサーバに記録</text>
<text x="48" y="82">された調査対象サーバの</text>
<text x="48" y="100">アクセスログ</text>
<text x="18" y="128">b</text>
<text x="48" y="128">調査対象サーバにインストール</text>
<text x="48" y="146">されていた会計ソフトの</text>
<text x="48" y="164">インストール用CD</text>
<text x="18" y="192">c</text>
<text x="48" y="192">調査対象サーバのハード</text>
<text x="48" y="210">ディスク上の表計算ファイル</text>
<text x="18" y="256">d</text>
<text x="48" y="256">調査対象サーバの</text>
<text x="48" y="274">ルーティングテーブルの状態</text>
</svg>
