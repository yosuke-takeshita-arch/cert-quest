<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-labelledby="fig-sc-db-2pc-t fig-sc-db-2pc-d">
<title id="fig-sc-db-2pc-t">2相コミットメント</title>
<desc id="fig-sc-db-2pc-d">2相コミットメントは、複数のサイトにまたがるトランザクションを、全員そろってコミットするか、全員そろって取り消すかにする手順。第1相（準備相）で、調整役が本店と支店に「コミットできるか」を問い合わせ、両方が「準備完了」と答える。準備完了と答えたサイトは、指示が来るまで、ロックを持ったまま待ち、自分では決めない。第2相（コミット相）で、全員が準備完了なら、調整役が両方に「コミット」を指示する。1つでも「できない」と答えたら、調整役は全員に「ロールバック」を指示する。</desc>
<text x="12" y="20" class="tb">2相コミットメント＝全員そろって決める</text>
<rect x="110" y="34" width="100" height="32" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="55" text-anchor="middle" class="tb">調整役</text>
<rect x="8" y="34" width="84" height="32" class="fs sb" stroke-width="1" rx="6"/>
<text x="50" y="55" text-anchor="middle">本店</text>
<rect x="228" y="34" width="84" height="32" class="fs sb" stroke-width="1" rx="6"/>
<text x="270" y="55" text-anchor="middle">支店</text>
<rect x="8" y="80" width="304" height="140" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="102" class="tb">第1相（準備相）：できるかを聞く</text>
<text x="18" y="126">調整役 → 本店・支店</text>
<text x="40" y="146">「コミットできるか？」</text>
<text x="18" y="170">本店・支店 → 調整役</text>
<text x="40" y="190">「準備完了」（ログをディスクへ書いた）</text>
<text x="18" y="210" class="tm">準備完了の後は、ロックを持ったまま指示を待つ</text>
<rect x="8" y="232" width="304" height="86" class="fok sok" stroke-width="1.5" rx="8"/>
<text x="18" y="254" class="tb">第2相（コミット相）：全員が準備完了なら</text>
<text x="18" y="278">調整役 → 本店・支店「コミット」</text>
<text x="18" y="302" class="tok">→ 本店も支店も確定する</text>
<rect x="8" y="330" width="304" height="86" class="fng sng" stroke-width="1.5" rx="8"/>
<text x="18" y="352" class="tb">1つでも「できない」と答えたら</text>
<text x="18" y="376">調整役 → 全員「ロールバック」</text>
<text x="18" y="400" class="tng">→ 本店も支店も取り消す（片方だけ残らない）</text>
<text x="12" y="434" class="tm">2相ロッキング（ロックの取り方）とは別のもの</text>
</svg>
