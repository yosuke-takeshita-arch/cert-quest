<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" role="img" aria-labelledby="fig-sc-net-hidden-exposed-t fig-sc-net-hidden-exposed-d">
<title id="fig-sc-net-hidden-exposed-t">隠れ端末問題とさらし端末問題</title>
<desc id="fig-sc-net-hidden-exposed-d">無線LANの端末は、送る前に電波を聞いて、空いていれば送る（キャリアセンス）。隠れ端末問題：端末AとCはどちらもアクセスポイント（AP）には届くが、互いの電波は聞こえない。そのため両方が空いていると思って同時に送り、APのところで電波がぶつかる。さらし端末問題：BがAへ送っているのをCが聞きつけて、送るのを控える。しかしCが送りたい相手Dは、Aから遠く、CからDへ送ってもAの受信は邪魔しない。それなのに待つので、使える時間がむだになる。対策のRTS/CTSは、送る前に送り手がRTS、受け手がCTSという短い合図を出し、受け手の周りの端末にも使用中を知らせる。</desc>
<text x="12" y="20" class="tb">無線の約束：送る前に聞く。空いていれば送る</text>
<text x="12" y="50" class="tb ta">① 隠れ端末問題</text>
<rect x="12" y="62" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="40" y="84" text-anchor="middle">A</text>
<rect x="132" y="62" width="56" height="34" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="84" text-anchor="middle">AP</text>
<rect x="252" y="62" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="280" y="84" text-anchor="middle">C</text>
<line x1="68" y1="79" x2="126" y2="79" class="l w1"/>
<polygon points="132,79 126,75.5 126,82.5" class="ft"/>
<line x1="252" y1="79" x2="194" y2="79" class="l w1"/>
<polygon points="188,79 194,75.5 194,82.5" class="ft"/>
<text x="160" y="116" class="tng" text-anchor="middle">APでぶつかる</text>
<text x="12" y="140">AとCは互いの電波が聞こえない</text>
<text x="12" y="158" class="tm">→ どちらも「空いている」と思って送る</text>
<text x="12" y="198" class="tb ta">② さらし端末問題</text>
<rect x="12" y="210" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="40" y="232" text-anchor="middle">A</text>
<rect x="88" y="210" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="116" y="232" text-anchor="middle">B</text>
<rect x="176" y="210" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="204" y="232" text-anchor="middle">C</text>
<rect x="252" y="210" width="56" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="280" y="232" text-anchor="middle">D</text>
<line x1="88" y1="227" x2="74" y2="227" class="l w1"/>
<polygon points="68,227 74,223.5 74,230.5" class="ft"/>
<line x1="232" y1="227" x2="246" y2="227" class="l sm w1 dsh"/>
<polygon points="252,227 246,223.5 246,230.5" class="fm"/>
<text x="204" y="264" class="twn" text-anchor="middle">送りたいのに待つ</text>
<text x="12" y="288">CはBの電波が聞こえるので遠慮する</text>
<text x="12" y="306" class="tm">→ C→Dは遠いAの受信を邪魔しないのに</text>
<text x="12" y="324" class="tm">　 待つので、時間がむだになる</text>
<rect x="12" y="350" width="296" height="88" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="374" class="tb">対策：RTS/CTS</text>
<text x="24" y="396">送り手がRTS、受け手がCTSという</text>
<text x="24" y="416">短い合図を出し、受け手の周りにも</text>
<text x="24" y="432">「いま使用中」を知らせる</text>
</svg>
