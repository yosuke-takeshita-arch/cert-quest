<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="fig-sc-db-deadlock-t fig-sc-db-deadlock-d">
<title id="fig-sc-db-deadlock-t">デッドロックと、ロックの順番をそろえる防ぎ方</title>
<desc id="fig-sc-db-deadlock-d">デッドロックは、2つのトランザクションが互いに相手の持つロックを待ち、どちらも進めなくなること。上の区画は順番がばらばらの場合。T1 は顧客の行をロックしてから注文の行を待つ。T2 は注文の行をロックしてから顧客の行を待つ。待ちが輪になり、どちらも進めない。下の区画は順番をそろえた場合。T1 も T2 も顧客、注文の順でロックする。T2 は最初の顧客の行で待つだけで、T1 がコミットしてロックを外したら進む。待ちの輪ができない。</desc>
<text x="12" y="20" class="tb">デッドロック＝互いが持つロックを待ち合う</text>
<rect x="8" y="32" width="304" height="186" class="fng sng" stroke-width="1.5" rx="8"/>
<text x="18" y="54" class="tb">順番がばらばら（T1 は顧客→注文、T2 は逆）</text>
<rect x="24" y="68" width="96" height="40" class="fs sb" stroke-width="1" rx="4"/>
<text x="34" y="86">顧客の行</text>
<text x="34" y="102" class="tm">T1 がロック</text>
<rect x="200" y="68" width="96" height="40" class="fs sb" stroke-width="1" rx="4"/>
<text x="210" y="86">注文の行</text>
<text x="210" y="102" class="tm">T2 がロック</text>
<line x1="124" y1="80" x2="192" y2="80" class="l sng"/>
<polygon points="192,75 200,80 192,85" class="fa"/>
<text x="160" y="72" text-anchor="middle" class="tng">T1 が待つ</text>
<line x1="128" y1="98" x2="196" y2="98" class="l sng"/>
<polygon points="128,93 120,98 128,103" class="fa"/>
<text x="160" y="124" text-anchor="middle" class="tng">T2 が待つ</text>
<text x="18" y="168">T1：注文の行が空くのを待つ</text>
<text x="18" y="188">T2：顧客の行が空くのを待つ</text>
<text x="18" y="208" class="tng">→ 待ちが輪になり、どちらも進めない</text>
<rect x="8" y="230" width="304" height="182" class="fok sok" stroke-width="1.5" rx="8"/>
<text x="18" y="252" class="tb">順番をそろえる（全員が顧客→注文）</text>
<text x="18" y="276">T1：顧客をロック → 注文をロック</text>
<text x="40" y="296">→ 更新してコミット → 外す</text>
<text x="18" y="320">T2：顧客で待つ（まだ何も持たない）</text>
<text x="40" y="340">→ T1 が外したら顧客 → 注文</text>
<text x="18" y="366" class="tok">T2 は何もロックを持たずに待つ</text>
<text x="18" y="386" class="tok">→ 待ちの輪ができない</text>
<text x="18" y="404" class="tm">それでも起きたら DBMS が1つを中止する</text>
</svg>
