<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 372" role="img" aria-labelledby="fig-sc-net-domains-t fig-sc-net-domains-d">
<title id="fig-sc-net-domains-t">ハブ・L2スイッチ・ルータで、衝突とブロードキャストがどこまで届くか</title>
<desc id="fig-sc-net-domains-d">衝突（コリジョン）は、同じ線に2台が同時に信号を出して壊れること。ブロードキャストは、宛先MACアドレスの全ビットが1の、全員あてのフレーム。ハブ（リピータ）は電気信号をそのまま全ポートへ写すので、衝突もブロードキャストも全体に届く。L2スイッチはフレームを受け取ってから宛先のポートだけに送るので、衝突はポートの外へ出ないが、ブロードキャストは全ポートへ送る。ルータはIPアドレスを見て別のネットワークへ中継する装置で、全員あてのフレームは中継しないので、衝突もブロードキャストも止まる。ルータの両側は別のブロードキャストドメインになる。</desc>
<text x="12" y="20" class="tb">衝突＝同じ線で2台の信号がぶつかる</text>
<text x="12" y="40" class="tb">ブロードキャスト＝全員あてのフレーム</text>
<text x="12" y="58" class="tm">（宛先MACアドレスが全部1＝FF:FF:FF:FF:FF:FF）</text>
<rect x="12" y="70" width="296" height="214" class="fs sb" stroke-width="1.5"/>
<rect x="12" y="70" width="296" height="36" class="fas sb" stroke-width="1.5"/>
<line x1="120" y1="70" x2="120" y2="284" class="l sb w1"/>
<line x1="214" y1="70" x2="214" y2="284" class="l sb w1"/>
<text x="66" y="93" class="tb" text-anchor="middle">装置</text>
<text x="167" y="93" class="tb" text-anchor="middle">衝突</text>
<text x="261" y="93" class="tb" text-anchor="middle">全員あて</text>
<line x1="12" y1="166" x2="308" y2="166" class="l sb w1"/>
<line x1="12" y1="226" x2="308" y2="226" class="l sb w1"/>
<text x="20" y="128" class="tb">ハブ</text>
<text x="20" y="146" class="tm">信号を全ポートへ</text>
<text x="20" y="160" class="tm">そのまま写す</text>
<text x="167" y="138" class="tng" text-anchor="middle">伝わる</text>
<text x="261" y="138" class="tng" text-anchor="middle">伝わる</text>
<text x="20" y="188" class="tb">L2スイッチ</text>
<text x="20" y="206" class="tm">宛先のポートだけ</text>
<text x="20" y="220" class="tm">に送る</text>
<text x="167" y="200" class="tok" text-anchor="middle">止まる</text>
<text x="261" y="200" class="tng" text-anchor="middle">全ポートへ</text>
<text x="20" y="248" class="tb">ルータ</text>
<text x="20" y="266" class="tm">IPアドレスを見て</text>
<text x="20" y="280" class="tm">別の網へ中継</text>
<text x="167" y="260" class="tok" text-anchor="middle">止まる</text>
<text x="261" y="260" class="tok" text-anchor="middle">止まる</text>
<text x="12" y="310" class="ta">ルータの右と左は、別の</text>
<text x="12" y="330" class="ta">ブロードキャストドメインになる</text>
<text x="12" y="356" class="tm">ドメイン＝それが届く範囲のこと</text>
</svg>
