<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 318" role="img" aria-labelledby="fig-sc-svc-mtbf-mttr-t fig-sc-svc-mtbf-mttr-d">
<title id="fig-sc-svc-mtbf-mttr-t">MTBF（平均故障間隔）と MTTR（平均修理時間）</title>
<desc id="fig-sc-svc-mtbf-mttr-d">横に流れる時間の帯。緑の区間は動いていた時間で、900時間、1,100時間、1,000時間の3つ。赤の区間は故障して修理していた時間で、3時間、5時間、4時間の3つ。MTBFは動いていた区間の平均で、3,000割る3で1,000時間。MTTRは修理の区間の平均で、12割る3で4時間。稼働率はMTBF割るMTBF足すMTTRで、1,000割る1,004でおよそ99.6パーセント。MTBFを長くするのは壊れにくくする対策、MTTRを短くするのは早く直す対策。</desc>
<text x="12" y="20" class="tb">動いた時間と、直していた時間</text>
<text x="12" y="40" class="tm">帯は時間の流れ（左→右）。幅は目安</text>
<rect x="12" y="52" width="84" height="30" class="fok sok w1"/>
<rect x="96" y="52" width="10" height="30" class="fng sng w1"/>
<rect x="106" y="52" width="100" height="30" class="fok sok w1"/>
<rect x="206" y="52" width="10" height="30" class="fng sng w1"/>
<rect x="216" y="52" width="82" height="30" class="fok sok w1"/>
<rect x="298" y="52" width="10" height="30" class="fng sng w1"/>
<text x="54" y="72" text-anchor="middle">900h</text>
<text x="156" y="72" text-anchor="middle">1,100h</text>
<text x="257" y="72" text-anchor="middle">1,000h</text>
<text x="101" y="100" text-anchor="middle" class="tng">3h</text>
<text x="211" y="100" text-anchor="middle" class="tng">5h</text>
<text x="303" y="100" text-anchor="middle" class="tng">4h</text>
<text x="12" y="126" class="tok">緑＝動いていた　</text>
<text x="132" y="126" class="tng">赤＝故障して修理中</text>
<rect x="12" y="140" width="296" height="104" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="24" y="162">MTBF＝緑の平均</text>
<text x="40" y="182" class="tm">（900＋1,100＋1,000）÷3＝1,000h</text>
<text x="24" y="202">MTTR＝赤の平均</text>
<text x="40" y="222" class="tm">（3＋5＋4）÷3＝4h</text>
<text x="24" y="238" class="tb ta">稼働率＝1,000÷1,004≒99.6％</text>
<text x="12" y="270" class="tok">MTBFを長く＝壊れにくくする</text>
<text x="24" y="288" class="tm">良い部品・故障前の交換・冗長化</text>
<text x="12" y="306" class="tng">MTTRを短く＝早く直す（監視・予備品）</text>
</svg>
