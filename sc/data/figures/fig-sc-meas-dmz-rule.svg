<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 716" role="img" aria-labelledby="fig-sc-meas-dmz-rule-t fig-sc-meas-dmz-rule-d">
<title id="fig-sc-meas-dmz-rule-t">ネットワーク構成の変更（DBサーバをDMZから内部ネットワークへ）と選択肢の表</title>
<desc id="fig-sc-meas-dmz-rule-d">問題の構成図と選択肢の表。変更前は、インターネットにつながるFWの左に内部ネットワーク（運用管理PCとL3SW）、右にDMZ（WebAPサーバ、L2SW、DBサーバ）がある。変更後は、DBサーバが内部ネットワークに移り、内部ネットワークは運用管理PC、L3SW、DBサーバ、DMZはWebAPサーバとL2SWになる。DBサーバは太い枠。L2SWはレイヤ2スイッチ、L3SWはレイヤ3スイッチ。選択肢の表は、ルールの変更種別と、ルール（送信元、宛先、サービス、制御）。アは削除、インターネット、WebAPサーバ、HTTPS、許可。イは削除、運用管理PC、変更前のDBサーバ、SSH、許可。ウは追加、WebAPサーバ、変更後のDBサーバ、SSH、許可。エは追加、インターネット、WebAPサーバ、ODBC、許可。</desc>
