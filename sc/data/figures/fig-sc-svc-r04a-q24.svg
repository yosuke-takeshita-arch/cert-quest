<line x1="8" y1="146" x2="312" y2="146" class="l w1"/>
<line x1="8" y1="181" x2="312" y2="181" class="l w1"/>
<text x="37" y="47" text-anchor="middle" class="tb">システム</text>
<text x="37" y="65" text-anchor="middle" class="tb">化案</text>
<text x="101" y="56" text-anchor="middle" class="tb">初期費用</text>
<text x="174" y="47" text-anchor="middle" class="tb">1年間の</text>
<text x="174" y="65" text-anchor="middle" class="tb">運用費</text>
<text x="262" y="47" text-anchor="middle" class="tb">削減される</text>
<text x="262" y="65" text-anchor="middle" class="tb">1年間の業務費</text>
<text x="37" y="98" text-anchor="middle">A</text><text x="101" y="98" text-anchor="middle">30</text><text x="174" y="98" text-anchor="middle">4</text><text x="262" y="98" text-anchor="middle">25</text>
<text x="37" y="133" text-anchor="middle">B</text><text x="101" y="133" text-anchor="middle">20</text><text x="174" y="133" text-anchor="middle">6</text><text x="262" y="133" text-anchor="middle">20</text>
<text x="37" y="168" text-anchor="middle">C</text><text x="101" y="168" text-anchor="middle">20</text><text x="174" y="168" text-anchor="middle">4</text><text x="262" y="168" text-anchor="middle">15</text>
