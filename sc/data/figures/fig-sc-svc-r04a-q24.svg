<title id="fig-sc-svc-r04a-q24-t">表 システム化案ごとの費用（単位 百万円）</title>
<desc id="fig-sc-svc-r04a-q24-d">単位は百万円。列はシステム化案、初期費用、1年間の運用費、削減される1年間の業務費の4つ。A案は初期費用30、運用費4、削減される業務費25。B案は20、6、20。C案は20、4、15。D案は15、5、22。</desc>
<text x="304" y="18" text-anchor="end" class="tm">単位　百万円</text>
