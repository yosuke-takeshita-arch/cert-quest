<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="fig-sc-net-napt-t fig-sc-net-napt-d">
<title id="fig-sc-net-napt-t">NAPT：外側のアドレス1つを、ポート番号で何台にも分ける</title>
<desc id="fig-sc-net-napt-d">社内のPC1（192.168.1.10）とPC2（192.168.1.11）が、どちらも送信元ポート50001でインターネットのサーバへ通信する例。インターネットで使えるアドレスはルータの203.0.113.5の1つだけ。ルータは、PC1の通信を203.0.113.5のポート40001に、PC2の通信を同じアドレスのポート40002に書き換え、その対応を変換表に記録する。サーバからの返事は宛先ポートで見分けて、40001ならPC1、40002ならPC2へ戻す。NATはアドレスだけを1対1で書き換えるので、外側のアドレスが1つなら同時に外へ出られるのは1台。NAPTはポート番号も書き換えるので、1つのアドレスを何台でも分け合える。</desc>
<text x="12" y="20" class="tb">外で使えるアドレスは1つだけ。</text>
<text x="12" y="40" class="tb">何台も同時に外とつなぐには？</text>
<rect x="12" y="58" width="122" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="20" y="76">PC1</text>
<text x="20" y="94" class="tm">.1.10 : 50001</text>
<rect x="12" y="114" width="122" height="44" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="20" y="132">PC2</text>
<text x="20" y="150" class="tm">.1.11 : 50001</text>
<rect x="186" y="58" width="122" height="100" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="247" y="80" class="tb" text-anchor="middle">ルータ</text>
<text x="247" y="100" text-anchor="middle">203.0.113.5</text>
<text x="247" y="124" class="ta" text-anchor="middle">: 40001（PC1）</text>
<text x="247" y="146" class="ta" text-anchor="middle">: 40002（PC2）</text>
<line x1="134" y1="80" x2="180" y2="112" class="l w1"/>
<polygon points="185,115.5 177.6,115.4 181.6,109.6" class="ft"/>
<line x1="134" y1="136" x2="180" y2="128" class="l w1"/>
<polygon points="186,127 180,124.7 181.2,131.6" class="ft"/>
<text x="12" y="182" class="tm">（.1.10 は 192.168.1.10 の略）</text>
<text x="12" y="210" class="tb">ルータの変換表</text>
<rect x="12" y="220" width="296" height="72" class="fs sb" stroke-width="1.5"/>
<line x1="160" y1="220" x2="160" y2="292" class="l sb w1"/>
<line x1="12" y1="244" x2="308" y2="244" class="l sb w1"/>
<line x1="12" y1="268" x2="308" y2="268" class="l sb w1"/>
<text x="86" y="237" class="tm" text-anchor="middle">外側のポート</text>
<text x="234" y="237" class="tm" text-anchor="middle">内側の相手</text>
<text x="86" y="261" text-anchor="middle">40001</text>
<text x="234" y="261" text-anchor="middle">.1.10 : 50001</text>
<text x="86" y="285" text-anchor="middle">40002</text>
<text x="234" y="285" text-anchor="middle">.1.11 : 50001</text>
<text x="12" y="316">返事は宛先ポートで見分けて戻す</text>
<rect x="12" y="330" width="296" height="80" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="352">NAT：アドレスだけ1対1で書き換え</text>
<text x="40" y="370" class="tm">→ 外側1つなら同時に1台</text>
<text x="24" y="392" class="tok">NAPT：ポート番号も書き換え</text>
<text x="40" y="408" class="tm">→ 1つのアドレスを何台でも共有</text>
</svg>
