<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="fig-sc-impl-placeholder-t fig-sc-impl-placeholder-d">
<title id="fig-sc-impl-placeholder-t">文字列の連結とプレースホルダの違い</title>
<desc id="fig-sc-impl-placeholder-d">上の区画は文字列の連結。入力に「' OR '1'='1」を入れると、SQL 文の条件の形そのものが書き換わり、どの行にも当てはまる条件になってしまう。下の区画はプレースホルダ。SQL 文の形を先に固め、入力は「?」の穴に値としてはめるだけなので、記号が入っていてもただの文字列として比べられ、文の形は変わらない。静的プレースホルダは、データベース側で文を先にコンパイルしてから値を割り当てる。</desc>
<text x="12" y="20" class="tb">SQL インジェクションと対策</text>
<rect x="8" y="32" width="304" height="160" class="fng sng" stroke-width="1.5" rx="8"/>
<text x="18" y="54" class="tb">× 文字列の連結</text>
<text x="18" y="76" class="tm">入力：' OR '1'='1</text>
<text x="18" y="100">WHERE id = '入力'</text>
<text x="18" y="122" class="tm">↓ 入力がそのまま文の一部に</text>
<text x="18" y="146">WHERE id = '' OR '1'='1'</text>
<text x="18" y="172" class="tng">条件の形が変わり、全件が一致</text>
<rect x="8" y="206" width="304" height="186" class="fok sok" stroke-width="1.5" rx="8"/>
<text x="18" y="228" class="tb">○ プレースホルダ</text>
<text x="18" y="250">WHERE id = ?</text>
<text x="18" y="272" class="tm">先に文の形を固める</text>
<text x="18" y="296" class="tm">↓ ? に入力を「値」としてはめる</text>
<text x="18" y="320">値：' OR '1'='1（ただの文字）</text>
<text x="18" y="346" class="tok">文の形は変わらない</text>
<text x="18" y="372" class="tm">静的＝DB 側で先にコンパイル</text>
</svg>
