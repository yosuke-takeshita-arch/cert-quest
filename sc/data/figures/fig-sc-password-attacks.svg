<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 624" role="img" aria-labelledby="fig-sc-password-attacks-t fig-sc-password-attacks-d">
<title id="fig-sc-password-attacks-t">総当たり・スプレー・スタッフィングの違い</title>
<desc id="fig-sc-password-attacks-d">3つの攻撃はどれも、利用者IDとパスワードの組をログインで試す。表の行は利用者ID（1・2・3）、列はパスワードの候補（a・b・c）で、塗った枠が試す組。1つ目の総当たり攻撃と辞書攻撃は、ID1に固定してパスワードa・b・cを次々に試すので、同じIDで失敗が重なりアカウントがロックされやすい。2つ目のパスワードスプレー攻撃（リバースブルートフォース攻撃）は、パスワードaに固定してID1・2・3に試すので、1つのIDの失敗は1回で済みロックを避けられる。3つ目のクレデンシャルスタッフィングは、ほかのサイトから漏れた組（ID1とc、ID2とa、ID3とb）をそのまま試すので、パスワードを使い回している人のアカウントに入られる。</desc>
<text x="12" y="20" class="tb">3つのパスワード攻撃の違い</text>
<text x="12" y="42">どれも「ID とパスワードの組」を試す。</text>
<text x="12" y="60">違いは、何を固定して何を変えるか。</text>
<text x="12" y="80" class="tm">表：行＝利用者 ID、列＝パスワードの候補</text>
<line x1="12" y1="96" x2="308" y2="96" class="l sb w1"/>
<text x="12" y="116" class="tb ta">① 総当たり攻撃・辞書攻撃</text>
<text x="134" y="136" class="tm" text-anchor="middle">a</text>
<text x="182" y="136" class="tm" text-anchor="middle">b</text>
<text x="230" y="136" class="tm" text-anchor="middle">c</text>
<text x="100" y="159" class="tm" text-anchor="end">ID1</text>
<rect x="111" y="143" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="134" y="159" class="tb" text-anchor="middle">試す</text>
<rect x="159" y="143" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="182" y="159" class="tb" text-anchor="middle">試す</text>
<rect x="207" y="143" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="230" y="159" class="tb" text-anchor="middle">試す</text>
<text x="100" y="183" class="tm" text-anchor="end">ID2</text>
<rect x="111" y="167" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="159" y="167" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="167" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="100" y="207" class="tm" text-anchor="end">ID3</text>
<rect x="111" y="191" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="159" y="191" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="191" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="12" y="236">ID1 に固定し、パスワードを次々に</text>
<text x="12" y="254" class="tb">→ 同じ ID で失敗が重なり、ロックされやすい</text>
<line x1="12" y1="266" x2="308" y2="266" class="l sb w1"/>
<text x="12" y="286" class="tb ta">② パスワードスプレー攻撃</text>
<text x="12" y="304" class="tm">（リバースブルートフォース攻撃）</text>
<text x="134" y="324" class="tm" text-anchor="middle">a</text>
<text x="182" y="324" class="tm" text-anchor="middle">b</text>
<text x="230" y="324" class="tm" text-anchor="middle">c</text>
<text x="100" y="347" class="tm" text-anchor="end">ID1</text>
<rect x="111" y="331" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="134" y="347" class="tb" text-anchor="middle">試す</text>
<rect x="159" y="331" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="331" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="100" y="371" class="tm" text-anchor="end">ID2</text>
<rect x="111" y="355" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="134" y="371" class="tb" text-anchor="middle">試す</text>
<rect x="159" y="355" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="355" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="100" y="395" class="tm" text-anchor="end">ID3</text>
<rect x="111" y="379" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="134" y="395" class="tb" text-anchor="middle">試す</text>
<rect x="159" y="379" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="379" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="12" y="424">パスワード a に固定し、ID を次々に</text>
<text x="12" y="442" class="tb">→ 1つの ID の失敗は1回。ロックを避ける</text>
<line x1="12" y1="454" x2="308" y2="454" class="l sb w1"/>
<text x="12" y="474" class="tb ta">③ クレデンシャルスタッフィング</text>
<text x="134" y="494" class="tm" text-anchor="middle">a</text>
<text x="182" y="494" class="tm" text-anchor="middle">b</text>
<text x="230" y="494" class="tm" text-anchor="middle">c</text>
<text x="100" y="517" class="tm" text-anchor="end">ID1</text>
<rect x="111" y="501" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="159" y="501" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="501" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="230" y="517" class="tb" text-anchor="middle">試す</text>
<text x="100" y="541" class="tm" text-anchor="end">ID2</text>
<rect x="111" y="525" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="134" y="541" class="tb" text-anchor="middle">試す</text>
<rect x="159" y="525" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="207" y="525" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="100" y="565" class="tm" text-anchor="end">ID3</text>
<rect x="111" y="549" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<rect x="159" y="549" width="46" height="22" class="fas sa" stroke-width="1.5"/>
<text x="182" y="565" class="tb" text-anchor="middle">試す</text>
<rect x="207" y="549" width="46" height="22" class="fs sb" stroke-width="1.5"/>
<text x="12" y="594">よそのサイトで漏れた組をそのまま</text>
<text x="12" y="612" class="tb">→ パスワードを使い回す人が入られる</text>
</svg>
