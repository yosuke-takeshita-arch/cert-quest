<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="fig-sc-db-partition-t fig-sc-db-partition-d">
<title id="fig-sc-db-partition-t">表の分散（水平分散と垂直分散）</title>
<desc id="fig-sc-db-partition-d">表の分散は、1つの表を分けて別々のサイトに置くこと。上の区画は水平分散で、行で分ける。顧客の表（顧客番号、氏名、地域）のうち、東日本の顧客の行は東京のサイト、西日本の顧客の行は大阪のサイトに置く。どちらも列は同じで、全部の行を集めるには和（UNION）を取る。下の区画は垂直分散で、列で分ける。商品の表のうち、商品番号・名前・価格の列はサイトA、商品番号・在庫数・発注日の列はサイトBに置く。どちらにも主キーの商品番号を持たせ、1行に戻すときは商品番号で結合する。</desc>
<text x="12" y="20" class="tb">表の分散＝1つの表を分けて別の場所に置く</text>
<rect x="8" y="32" width="304" height="186" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="54" class="tb">水平分散：行で分ける（列は同じ）</text>
<text x="18" y="76" class="tm">顧客（顧客番号，氏名，地域）</text>
<rect x="18" y="86" width="136" height="76" class="fas sb" stroke-width="1" rx="4"/>
<text x="26" y="106" class="tb">東京のサイト</text>
<text x="26" y="128">101 青木 東日本</text>
<text x="26" y="150">102 井上 東日本</text>
<rect x="166" y="86" width="136" height="76" class="fas sb" stroke-width="1" rx="4"/>
<text x="174" y="106" class="tb">大阪のサイト</text>
<text x="174" y="128">201 上田 西日本</text>
<text x="174" y="150">202 江藤 西日本</text>
<text x="18" y="186">全部の行を集める → 和（UNION）</text>
<text x="18" y="206" class="tm">サーバを分けて行を振り分ける例がシャーディング</text>
<rect x="8" y="230" width="304" height="186" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="252" class="tb">垂直分散：列で分ける（行は同じ）</text>
<text x="18" y="274" class="tm">商品（商品番号，名前，価格，在庫数，発注日）</text>
<rect x="18" y="284" width="136" height="76" class="fas sb" stroke-width="1" rx="4"/>
<text x="26" y="304" class="tb">サイトA</text>
<text x="26" y="326">商品番号・名前</text>
<text x="26" y="348">・価格（よく読む）</text>
<rect x="166" y="284" width="136" height="76" class="fas sb" stroke-width="1" rx="4"/>
<text x="174" y="304" class="tb">サイトB</text>
<text x="174" y="326">商品番号・在庫数</text>
<text x="174" y="348">・発注日（在庫係）</text>
<text x="18" y="384">両方に主キー（商品番号）を持たせる</text>
<text x="18" y="404">1行に戻す → 商品番号で結合</text>
</svg>
