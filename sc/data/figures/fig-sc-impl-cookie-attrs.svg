<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-labelledby="fig-sc-impl-cookie-attrs-t fig-sc-impl-cookie-attrs-d">
<title id="fig-sc-impl-cookie-attrs-t">cookie の3つの属性が塞ぐ漏れ道</title>
<desc id="fig-sc-impl-cookie-attrs-d">セッション ID が入った cookie の漏れ道は3つあり、属性で1つずつ塞ぐ。Secure は通信路の盗聴を塞ぎ、HTTPS の通信のときだけ cookie を送らせる。HttpOnly はスクリプトからの読み出しを塞ぎ、XSS で動かされたスクリプトが document.cookie で読めない。SameSite はよそのサイトから始まったリクエストに cookie を付けるかを決め、Strict は付けない、Lax は一部だけ、None は付ける（None のときは Secure も必須）。CSRF の被害を減らす。</desc>
<text x="12" y="20" class="tb">cookie の属性：漏れ道ごとに塞ぐ</text>
<text x="12" y="40" class="tm">例 Set-Cookie: SID=…; Secure;</text>
<text x="12" y="58" class="tm">HttpOnly; SameSite=Lax</text>
<rect x="8" y="72" width="304" height="86" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="94" class="tb">Secure</text>
<text x="18" y="116">漏れ道：暗号化されない通信</text>
<text x="18" y="140" class="tok">→ HTTPS のときだけ送る</text>
<rect x="8" y="168" width="304" height="86" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="190" class="tb">HttpOnly</text>
<text x="18" y="212">漏れ道：XSS のスクリプト</text>
<text x="18" y="236" class="tok">→ スクリプトから読ませない</text>
<rect x="8" y="264" width="304" height="108" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="286" class="tb">SameSite</text>
<text x="18" y="308">漏れ道：よそのサイト（CSRF）</text>
<text x="18" y="332" class="tok">→ 別サイト発のリクエストに</text>
<text x="36" y="354" class="tok">付けない（Strict）／一部（Lax）</text>
</svg>
