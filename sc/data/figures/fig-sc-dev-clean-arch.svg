<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="fig-sc-dev-clean-arch-t fig-sc-dev-clean-arch-d">
<title id="fig-sc-dev-clean-arch-t">レイヤードとクリーンアーキテクチャの依存の向き</title>
<desc id="fig-sc-dev-clean-arch-d">依存の矢印（AがBを使う、Bが無いとAが動かない）の向きを比べた図。上の区画はレイヤードアーキテクチャで、画面の層が業務の層に、業務の層がデータの層に依存し、矢印は上から下へ向く。いちばん大事な業務の層が、データベースの都合に引きずられる。下の区画はクリーンアーキテクチャで、真ん中に業務の規則（料金の計算など）と、業務の規則が決めた口（予約を保存する、というインタフェース）を置き、外側の円に画面とデータベースの部品を置く。外側の部品から真ん中へ矢印が向き、データベースの部品は真ん中が決めた口を実装する。真ん中は外側を知らない。</desc>
<text x="12" y="20" class="tb">矢印 A→B＝A は B に依存する（B を使う）</text>
<rect x="8" y="32" width="304" height="150" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="54" class="tb">レイヤード：上から下へ依存</text>
<rect x="40" y="64" width="120" height="26" class="fas sb" stroke-width="1" rx="4"/>
<text x="100" y="82" text-anchor="middle">画面の層</text>
<line x1="100" y1="90" x2="100" y2="102" class="l w1"/>
<polygon points="95,102 100,110 105,102" class="ft"/>
<rect x="40" y="110" width="120" height="26" class="fas sb" stroke-width="1" rx="4"/>
<text x="100" y="128" text-anchor="middle">業務の層</text>
<line x1="100" y1="136" x2="100" y2="146" class="l w1"/>
<polygon points="95,146 100,154 105,146" class="ft"/>
<rect x="40" y="154" width="120" height="22" class="fas sb" stroke-width="1" rx="4"/>
<text x="100" y="170" text-anchor="middle">データの層</text>
<text x="170" y="118" class="tm">業務の層が</text>
<text x="170" y="136" class="tm">データの層の</text>
<text x="170" y="154" class="tm">都合に引きずられる</text>
<rect x="8" y="194" width="304" height="196" class="fs sa" stroke-width="1.5" rx="8"/>
<text x="18" y="216" class="tb">クリーン：外から真ん中へ依存</text>
<circle cx="160" cy="300" r="78" class="fs l w1"/>
<circle cx="160" cy="300" r="40" class="fok sok" stroke-width="1.5"/>
<text x="160" y="296" text-anchor="middle" class="tb">業務の規則</text>
<text x="160" y="314" text-anchor="middle" class="tm">口（保存する）</text>
<text x="104" y="250" text-anchor="middle">画面</text>
<text x="214" y="364" text-anchor="middle">データベース</text>
<line x1="112" y1="258" x2="132" y2="272" class="l w1"/>
<polygon points="128,276 138,277 133,268" class="ft"/>
<line x1="206" y1="350" x2="188" y2="334" class="l w1"/>
<polygon points="193,331 183,329 186,339" class="ft"/>
<text x="244" y="246" class="tm">真ん中は</text>
<text x="244" y="264" class="tm">外を</text>
<text x="244" y="282" class="tm">知らない</text>
</svg>
