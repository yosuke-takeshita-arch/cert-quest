<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 356" role="img" aria-labelledby="fig-sc-audit-ic-elements-t fig-sc-audit-ic-elements-d">
<title id="fig-sc-audit-ic-elements-t">内部統制の6つの基本的要素（土台は統制環境）</title>
<desc id="fig-sc-audit-ic-elements-d">いちばん下の横長の土台が統制環境で、組織の気風と経営者の姿勢。その上に4つの要素が並ぶ。リスクの評価と対応は、どこで何が起きやすいかを見て手を打つ所を選ぶこと。統制活動は、承認や職務の分掌など、命令を実行させる手続。情報と伝達は、必要な情報が組織の内外に正しく伝わること。モニタリングは、内部統制が働いているかを続けて評価すること。いちばん上の帯はITへの対応で、全体にかかわる。ITの環境をつかみ、ITを使い、ITを統制すること。例として、経理の支払いでは、社長が数字をよく見せるなと示し、不正の起きやすい所を洗い出し、入力と承認の担当を分け、規程を全員に配り、内部監査で確かめ、会計システムの権限を管理する。</desc>
<text x="12" y="20" class="tb">内部統制の6つの基本的要素</text>
<rect x="12" y="34" width="296" height="44" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="24" y="54" class="tb">IT への対応（全体にかかわる）</text>
<text x="24" y="72" class="tm">例：会計システムの権限を管理する</text>
<rect x="12" y="88" width="144" height="58" class="fs l w1" rx="6"/>
<text x="20" y="108" class="tb">リスクの評価と対応</text>
<text x="20" y="128" class="tm">不正の起きやすい</text>
<text x="20" y="142" class="tm">所を洗い出す</text>
<rect x="164" y="88" width="144" height="58" class="fs l w1" rx="6"/>
<text x="172" y="108" class="tb">統制活動</text>
<text x="172" y="128" class="tm">入力と承認の</text>
<text x="172" y="142" class="tm">担当を分ける</text>
<rect x="12" y="154" width="144" height="58" class="fs l w1" rx="6"/>
<text x="20" y="174" class="tb">情報と伝達</text>
<text x="20" y="194" class="tm">規程を全員に配る</text>
<text x="20" y="208" class="tm">通報の窓口を置く</text>
<rect x="164" y="154" width="144" height="58" class="fs l w1" rx="6"/>
<text x="172" y="174" class="tb">モニタリング</text>
<text x="172" y="194" class="tm">内部監査や照合で</text>
<text x="172" y="208" class="tm">働いているか確かめる</text>
<rect x="12" y="222" width="296" height="58" class="fok sok" stroke-width="2.5" rx="6"/>
<text x="24" y="244" class="tb">統制環境（土台・最も重要）</text>
<text x="24" y="264" class="tm">組織の気風・経営者の意向と姿勢</text>
<text x="24" y="278" class="tm">例：社長が『数字をよく見せるな』と示す</text>
<text x="12" y="306">土台が崩れると、上の4つは形だけになる</text>
<text x="12" y="330" class="tm">出典の言葉：統制環境は、ほかの基本的</text>
<text x="12" y="348" class="tm">要素の基礎をなし、影響を及ぼす基盤</text>
</svg>
