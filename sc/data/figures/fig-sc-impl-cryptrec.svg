<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="fig-sc-impl-cryptrec-t fig-sc-impl-cryptrec-d">
<title id="fig-sc-impl-cryptrec-t">CRYPTREC 暗号リストの3つのリスト</title>
<desc id="fig-sc-impl-cryptrec-d">3つの箱が上から並ぶ。1つ目は推奨候補暗号リストで、安全性と実装性能が確認され、今後、電子政府推奨暗号リストに載る可能性があるもの（例 CLEFIA、MISTY1）。上がると2つ目の電子政府推奨暗号リストで、利用を推奨するもの（例 AES、Camellia、SHA-256、RSA-OAEP）。最新版では現行暗号リストと耐量子計算機暗号（PQC）リストの2表がある。推奨すべきでなくなると3つ目の運用監視暗号リストへ移り、互換性維持のためだけに継続利用を容認するもの（例 3-key Triple DES、SHA-1）。証明書失効リストは CRYPTREC 暗号リストの一部ではない。</desc>
<text x="12" y="20" class="tb">CRYPTREC 暗号リスト：3段</text>
<rect x="8" y="32" width="304" height="86" class="fs sb" stroke-width="1.5" rx="8"/>
<text x="18" y="54" class="tb">推奨候補暗号リスト</text>
<text x="18" y="76">確認済み。今後、推奨に載るかも</text>
<text x="18" y="98" class="tm">例 CLEFIA・MISTY1</text>
<line x1="160" y1="118" x2="160" y2="132" class="l sm w1"/>
<polygon points="160,138 156.5,132 163.5,132" class="fm"/>
<rect x="8" y="140" width="304" height="122" class="fok sok" stroke-width="2" rx="8"/>
<text x="18" y="162" class="tb">電子政府推奨暗号リスト</text>
<text x="18" y="184">利用を推奨する</text>
<text x="18" y="206" class="tm">例 AES・Camellia・SHA-256</text>
<text x="18" y="228" class="tm">最新版：現行暗号リスト＋</text>
<text x="18" y="248" class="tm">耐量子計算機暗号（PQC）リスト</text>
<line x1="160" y1="262" x2="160" y2="276" class="l sm w1"/>
<polygon points="160,282 156.5,276 163.5,276" class="fm"/>
<text x="168" y="276" class="tm">推奨できなくなった</text>
<rect x="8" y="284" width="304" height="86" class="fwn swn" stroke-width="1.5" rx="8"/>
<text x="18" y="306" class="tb">運用監視暗号リスト</text>
<text x="18" y="328">互換性維持のためだけに容認</text>
<text x="18" y="350" class="tm">例 3-key Triple DES・SHA-1</text>
<text x="12" y="394" class="tm">証明書失効リスト（CRL）は</text>
<text x="12" y="412" class="tm">このリストの一部ではない</text>
</svg>
