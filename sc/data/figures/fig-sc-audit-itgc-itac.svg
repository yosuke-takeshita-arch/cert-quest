<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 392" role="img" aria-labelledby="fig-sc-audit-itgc-itac-t fig-sc-audit-itgc-itac-d">
<title id="fig-sc-audit-itgc-itac-t">IT に係る全般統制と業務処理統制</title>
<desc id="fig-sc-audit-itgc-itac-d">上の段に、販売・購買・在庫の3つの業務システムが並ぶ。それぞれの中に組み込まれているのが業務処理統制で、例は入力のチェック、エラーの修正と再処理、マスタ・データの維持管理、業務システムの認証と操作範囲の限定。3つのシステムは、下の段の1つの共通のIT基盤の上で動く。そのIT基盤を守るのが全般統制で、例はシステムの開発・保守の管理、運用・管理、内外からのアクセス管理などの安全性の確保、外部委託の契約の管理。全般統制が崩れて、例えば承認なしにプログラムを書き換えられると、上の3つの業務処理統制すべてが働き続けるとは言えなくなる。</desc>
<text x="12" y="20" class="tb">業務処理統制：各システムの中</text>
<rect x="12" y="32" width="92" height="40" class="fs l w1" rx="4"/>
<text x="58" y="57" text-anchor="middle">販売</text>
<rect x="114" y="32" width="92" height="40" class="fs l w1" rx="4"/>
<text x="160" y="57" text-anchor="middle">購買</text>
<rect x="216" y="32" width="92" height="40" class="fs l w1" rx="4"/>
<text x="262" y="57" text-anchor="middle">在庫</text>
<rect x="12" y="80" width="296" height="92" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="100">・入力情報のチェック</text>
<text x="24" y="120">・エラーの修正と再処理</text>
<text x="24" y="140">・マスタ・データの維持管理</text>
<text x="24" y="160">・業務の認証と操作範囲の限定</text>
<line x1="160" y1="176" x2="160" y2="196" class="l sm w1"/>
<polygon points="160,176 156.5,182 163.5,182" class="fm"/>
<text x="168" y="192" class="tm">下から支える</text>
<rect x="12" y="200" width="296" height="122" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="24" y="222" class="tb">全般統制：共通の IT 基盤を守る</text>
<text x="24" y="242">・システムの開発・保守の管理</text>
<text x="24" y="262">・システムの運用・管理</text>
<text x="24" y="282">・アクセス管理などの安全性の確保</text>
<text x="24" y="302">・外部委託に関する契約の管理</text>
<text x="12" y="346" class="tng">全般統制が崩れる（承認なしに書換え）</text>
<text x="12" y="366" class="tng">→上の3つの業務処理統制すべてが</text>
<text x="24" y="380" class="tng">働き続けるとは言えなくなる</text>
</svg>
