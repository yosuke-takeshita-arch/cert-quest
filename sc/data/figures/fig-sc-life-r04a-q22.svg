<title id="fig-sc-life-r04a-q22-t">流れ図</title>
<desc id="fig-sc-life-r04a-q22-d">上から下への流れ図。最初に処理1の箱。次にひし形の判定「A &gt; 6 or B = 0」。判定が Yes なら下へ進み処理2の箱を通る。No なら右へ出て処理2を通らずに下へ回り、処理2の後の線に合流する。合流した線はさらに下へ続く。</desc>
