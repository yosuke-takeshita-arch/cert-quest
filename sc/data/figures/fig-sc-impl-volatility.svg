<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="fig-sc-impl-volatility-t fig-sc-impl-volatility-d">
<title id="fig-sc-impl-volatility-t">揮発性データの収集順序（RFC 3227 の例）</title>
<desc id="fig-sc-impl-volatility-d">上から順に集める。1番目はレジスタ・キャッシュ。2番目はルーティングテーブル・ARP キャッシュ・プロセステーブル・カーネルの統計・メモリ。3番目は一時的なファイルシステム。4番目はディスク。5番目は遠隔のログや監視のデータ。6番目は物理的な構成・ネットワークの構成。7番目は保管用の媒体。上ほど電源を切ったり時間がたったりすると早く消える。順番は大事さではなく消えやすさで決める。</desc>
<text x="12" y="20" class="tb">消えやすい順に集める</text>
<text x="12" y="40" class="tm">上ほど早く消える（RFC 3227 の例）</text>
<rect x="8" y="52" width="304" height="36" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="18" y="75">1 レジスタ・キャッシュ</text>
<rect x="8" y="96" width="304" height="58" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="18" y="119">2 ルーティングテーブル・ARP</text>
<text x="34" y="141">キャッシュ・プロセス・メモリ</text>
<rect x="8" y="162" width="304" height="36" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="18" y="185">3 一時的なファイルシステム</text>
<rect x="8" y="206" width="304" height="36" class="fwn swn" stroke-width="1.5" rx="6"/>
<text x="18" y="229">4 ディスク</text>
<rect x="8" y="250" width="304" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="18" y="273">5 遠隔のログ・監視データ</text>
<rect x="8" y="294" width="304" height="36" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="18" y="317">6 物理構成・ネットワーク構成</text>
<rect x="8" y="338" width="304" height="36" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="18" y="361">7 保管用の媒体（アーカイブ）</text>
<text x="12" y="400" class="tb">決め手は「消える速さ」</text>
<text x="12" y="420" class="tm">大事なファイルでもディスクなら後</text>
</svg>
