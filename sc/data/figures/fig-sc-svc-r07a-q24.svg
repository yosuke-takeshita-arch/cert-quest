<desc id="fig-sc-svc-r07a-q24-d">表題はサービス停止状況。列は停止理由と停止時間の2つ。行は2つ。1行目：システムバージョンアップ作業に伴う停止、5月2日22時から5月6日10時までの84時間。2行目：ハードウェア故障に伴う停止、6月26日10時から20時までの10時間。</desc>
