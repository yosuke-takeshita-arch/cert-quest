<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 540" role="img" aria-labelledby="fig-sc-password-count-t fig-sc-password-count-d">
<title id="fig-sc-password-count-t">パスワードの総数：くり返しあり・順番あり</title>
<desc id="fig-sc-password-count-d">パスワードは同じ文字をくり返せて、並び順も区別する。例として、文字が1・2・3の3種類で長さ2文字なら、1文字目3通りと2文字目3通りを掛けて9通り（11から33まで）。これがMのn乗。選択肢の4つの式に同じ数を入れると、アのMのn乗は9通り、イのM!割る(M−n)!は同じ文字をくり返さない並べ方で6通り、ウのM!割るn!(M−n)!はくり返さず順番も区別しない選び方で3通り、エの(M+n−1)!割るn!(M−1)!はくり返してよいが順番を区別しない選び方で6通り。パスワードの総数に当たるのはアだけ。</desc>
<text x="12" y="20" class="tb">パスワードの総数の数え方</text>
<text x="12" y="42">パスワードは同じ文字をくり返せて、</text>
<text x="12" y="60">並び順も区別する（12 と 21 は別物）。</text>
<text x="12" y="86" class="tb">例：文字は 1・2・3 の3種類、長さ2文字</text>
<text x="12" y="106" class="tm">（行＝1文字目、列＝2文字目）</text>
<text x="102" y="124" class="tm" text-anchor="middle">1</text>
<text x="160" y="124" class="tm" text-anchor="middle">2</text>
<text x="218" y="124" class="tm" text-anchor="middle">3</text>
<text x="58" y="148" class="tm" text-anchor="middle">1</text>
<text x="58" y="176" class="tm" text-anchor="middle">2</text>
<text x="58" y="204" class="tm" text-anchor="middle">3</text>
<rect x="74" y="130" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="102" y="148" class="tb" text-anchor="middle">11</text>
<rect x="132" y="130" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="160" y="148" class="tb" text-anchor="middle">12</text>
<rect x="190" y="130" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="218" y="148" class="tb" text-anchor="middle">13</text>
<rect x="74" y="158" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="102" y="176" class="tb" text-anchor="middle">21</text>
<rect x="132" y="158" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="160" y="176" class="tb" text-anchor="middle">22</text>
<rect x="190" y="158" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="218" y="176" class="tb" text-anchor="middle">23</text>
<rect x="74" y="186" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="102" y="204" class="tb" text-anchor="middle">31</text>
<rect x="132" y="186" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="160" y="204" class="tb" text-anchor="middle">32</text>
<rect x="190" y="186" width="56" height="26" class="fas sa" stroke-width="1.5"/>
<text x="218" y="204" class="tb" text-anchor="middle">33</text>
<text x="12" y="236" class="tb ta">3 × 3 ＝ 9通り ＝ Mⁿ（M＝3、n＝2）</text>
<line x1="12" y1="252" x2="308" y2="252" class="l sb w1"/>
<text x="12" y="274" class="tb">選択肢の4つの式に同じ数を入れる</text>
<text x="16" y="306" class="tb">ア</text>
<text x="86" y="306" class="tb" text-anchor="middle">Mⁿ</text>
<text x="140" y="306" class="tb tok">9通り（正解）</text>
<text x="16" y="350" class="tb">イ</text>
<text x="86" y="340" text-anchor="middle">M!</text>
<line x1="44" y1="346" x2="128" y2="346" class="l w1"/>
<text x="86" y="362" text-anchor="middle">(M−n)!</text>
<text x="140" y="350">6通り</text>
<text x="16" y="400" class="tb">ウ</text>
<text x="86" y="390" text-anchor="middle">M!</text>
<line x1="44" y1="396" x2="128" y2="396" class="l w1"/>
<text x="86" y="412" text-anchor="middle">n!(M−n)!</text>
<text x="140" y="400">3通り</text>
<text x="16" y="450" class="tb">エ</text>
<text x="86" y="440" text-anchor="middle">(M+n−1)!</text>
<line x1="44" y1="446" x2="128" y2="446" class="l w1"/>
<text x="86" y="462" text-anchor="middle">n!(M−1)!</text>
<text x="140" y="450">6通り</text>
<line x1="12" y1="478" x2="308" y2="478" class="l sb w1"/>
<text x="12" y="498" class="tm">イ：11・22・33（くり返し）を数えない</text>
<text x="12" y="516" class="tm">ウ：さらに 21・31・32 も数えない</text>
<text x="12" y="534" class="tm">エ：12 と 21 を同じ1つと数える</text>
</svg>
