<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-sc-mgmt-risk-process-t fig-sc-mgmt-risk-process-d">
<title id="fig-sc-mgmt-risk-process-t">リスクアセスメントからリスク対応まで</title>
<desc id="fig-sc-mgmt-risk-process-d">枠で囲んだ部分がリスクアセスメントで、上から順に3段ある。1段目のリスク特定は、リスクを見つけて書き出し、リスク源・原因・起こり得る結果を挙げる。2段目のリスク分析は、起きたときの結果と起こりやすさからリスクレベルを決める。3段目のリスク評価は、リスクレベルを前もって決めたリスク基準と比べ、受け入れられるかと優先順位を決める。リスク基準には、受け入れる線（リスク受容基準）と測り方（実施の基準）が入る。アセスメントの後がリスク対応で、回避・低減・移転・保有から選ぶ。対応の後に残る残留リスクは、リスク所有者が対応計画を承認して受け入れる。</desc>
<text x="12" y="20" class="tb">リスクアセスメント → リスク対応</text>
<rect x="8" y="30" width="304" height="232" class="sa dsh" stroke-width="1.5" rx="8"/>
<text x="18" y="50" class="ta">ここがリスクアセスメント（3段）</text>
<rect x="20" y="60" width="280" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="30" y="80" class="tb">① リスク特定：見つけて書き出す</text>
<text x="30" y="98" class="tm">リスク源・原因・起こり得る結果</text>
<line x1="160" y1="110" x2="160" y2="118.4" class="l sm w1"/>
<polygon points="160,124 156.5,118.4 163.5,118.4" class="fm"/>
<rect x="20" y="126" width="280" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="30" y="146" class="tb">② リスク分析：大きさを決める</text>
<text x="30" y="164" class="tm">結果×起こりやすさ→リスクレベル</text>
<line x1="160" y1="176" x2="160" y2="184.4" class="l sm w1"/>
<polygon points="160,190 156.5,184.4 163.5,184.4" class="fm"/>
<rect x="20" y="192" width="280" height="62" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="30" y="212" class="tb">③ リスク評価：基準と比べる</text>
<text x="30" y="230" class="tm">リスク基準（受け入れる線・測り方）</text>
<text x="30" y="246" class="tm">→受け入れられるか、優先順位</text>
<line x1="160" y1="262" x2="160" y2="274.4" class="l sm w1"/>
<polygon points="160,280 156.5,274.4 163.5,274.4" class="fm"/>
<rect x="20" y="282" width="280" height="68" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="30" y="302" class="tb">リスク対応：手当てを選ぶ</text>
<text x="30" y="320">回避（やめる）・低減（下げる）</text>
<text x="30" y="338">移転（分ける）・保有（受け入れる）</text>
<line x1="160" y1="350" x2="160" y2="362.4" class="l sm w1"/>
<polygon points="160,368 156.5,362.4 163.5,362.4" class="fm"/>
<rect x="20" y="370" width="280" height="86" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="30" y="390" class="tb">残留リスク：対応しても残る分</text>
<text x="30" y="410">リスク所有者（そのリスクの</text>
<text x="30" y="428">責任者）が、対応計画を承認し、</text>
<text x="30" y="446">残りを受け入れる</text>
</svg>
