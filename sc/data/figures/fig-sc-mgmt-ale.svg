<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-labelledby="fig-sc-mgmt-ale-t fig-sc-mgmt-ale-d">
<title id="fig-sc-mgmt-ale-t">年間予想損失額（ALE）＝ SLE × ARO と、対策の判断</title>
<desc id="fig-sc-mgmt-ale-d">例はノートPCの紛失。1回起きたときの損失（SLE）は300万円。起きるのは5年に1回なので、1年あたりの回数（ARO）は1÷5で0.2回。ALE は300万円×0.2で、1年あたり60万円の損失が見込まれる。紛失時の被害を半分にする暗号化ソフトを入れると、ALE は30万円に下がり、減る損失は1年あたり30万円。ソフトの費用は1年20万円なので、減る損失30万円のほうが大きく、対策は割に合う。</desc>
<text x="12" y="20" class="tb">ALE ＝ 1回の損失 × 1年の回数</text>
<text x="12" y="40" class="tm">例：ノートPCの紛失</text>
<rect x="12" y="50" width="134" height="58" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="79" y="70" class="tm" text-anchor="middle">1回の損失（SLE）</text>
<text x="79" y="94" class="tb" text-anchor="middle">300万円</text>
<text x="160" y="86" class="tb" text-anchor="middle">×</text>
<rect x="174" y="50" width="134" height="58" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="241" y="70" class="tm" text-anchor="middle">1年の回数（ARO）</text>
<text x="241" y="94" class="tb" text-anchor="middle">0.2回</text>
<text x="241" y="124" class="tm" text-anchor="middle">5年に1回→1÷5</text>
<line x1="160" y1="130" x2="160" y2="144.4" class="l sm w1"/>
<polygon points="160,150 156.5,144.4 163.5,144.4" class="fm"/>
<rect x="60" y="152" width="200" height="50" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="172" class="ta" text-anchor="middle">1年に見込む損失（ALE）</text>
<text x="160" y="194" class="tb" text-anchor="middle">300万×0.2＝60万円</text>
<text x="12" y="232" class="tb">対策は割に合うか？</text>
<text x="12" y="254">暗号化で被害を半分にすると</text>
<text x="12" y="274">ALE は60万→30万円に下がる</text>
<rect x="12" y="284" width="134" height="58" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="79" y="304" class="tm" text-anchor="middle">減る損失（1年）</text>
<text x="79" y="328" class="tb tok" text-anchor="middle">30万円</text>
<text x="160" y="320" class="tb" text-anchor="middle">＞</text>
<rect x="174" y="284" width="134" height="58" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="241" y="304" class="tm" text-anchor="middle">対策の費用（1年）</text>
<text x="241" y="328" class="tb" text-anchor="middle">20万円</text>
<text x="12" y="366" class="ta">減る損失のほうが大きい→導入する</text>
</svg>
