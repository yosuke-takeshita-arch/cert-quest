<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" role="img" aria-labelledby="fig-dx-tco-t fig-dx-tco-d">
<title id="fig-dx-tco-t">TCO（総保有コスト）：導入から廃止までの費用の総額と、使う期間で安い案が逆転する例</title>
<desc id="fig-dx-tco-d">上は、システムを持つ間の流れ。左から右へ時間が進み、導入、運用・保守、更新、廃止と続く。導入費は最初の導入だけの費用で、TCOは導入から廃止までの全部の費用。下は説明用の数の例。A案は導入費100万円と運用費が毎月5万円、B案は導入費220万円と毎月2万円。総費用は、導入費に、毎月の運用費と使う月数を掛けたものを足す。横棒グラフの棒の長さが総費用で、濃い部分が導入費、薄い部分が運用費。3年（36か月）使うと、A案は100＋5×36＝100＋180＝280万円、B案は220＋2×36＝220＋72＝292万円で、A案が安い。5年（60か月）使うと、A案は100＋5×60＝100＋300＝400万円、B案は220＋2×60＝220＋120＝340万円で、B案が安い。導入費だけ見るとA案が安く見えるが、使う期間しだいで逆転する。</desc>
<text x="12" y="20" class="tb">TCO＝持つ間の全部の費用</text>
<text x="12" y="40" class="tm">Total Cost of Ownership（総保有コスト）</text>
<rect x="12" y="54" width="60" height="32" class="fm l sm" stroke-width="1"/>
<text x="42" y="75" text-anchor="middle" class="tb ton">導入</text>
<rect x="76" y="54" width="120" height="32" class="fas sa" stroke-width="1"/>
<text x="136" y="75" text-anchor="middle">運用・保守</text>
<rect x="200" y="54" width="52" height="32" class="fas sa" stroke-width="1"/>
<text x="226" y="75" text-anchor="middle">更新</text>
<rect x="256" y="54" width="52" height="32" class="fas sa" stroke-width="1"/>
<text x="282" y="75" text-anchor="middle">廃止</text>
<text x="308" y="102" class="tm" text-anchor="end">時間 →</text>
<path d="M 12 108 L 12 116 L 72 116 L 72 108" class="l sm w2" fill="none"/>
<text x="12" y="134" class="tm">導入費＝最初だけ</text>
<path d="M 12 146 L 12 154 L 308 154 L 308 146" class="l sa w2" fill="none"/>
<text x="160" y="174" class="ta tb" text-anchor="middle">TCO＝導入から廃止まで全部</text>
<line x1="12" y1="190" x2="308" y2="190" class="l sb w1"/>
<text x="12" y="214" class="tb">例（数は説明用。ほかの費用は同じ）</text>
<text x="12" y="236">A案：導入費100万円＋運用費 月5万円</text>
<text x="12" y="256">B案：導入費220万円＋運用費 月2万円</text>
<text x="12" y="280" class="tm">総費用＝導入費＋月の運用費×使う月数</text>
<text x="12" y="302" class="tm">横棒グラフ。棒の長さ＝総費用（万円）</text>
<rect x="12" y="312" width="14" height="14" class="fm"/>
<text x="32" y="324">導入費</text>
<rect x="96" y="312" width="14" height="14" class="fas sa" stroke-width="1"/>
<text x="116" y="324">運用費</text>
<text x="12" y="356" class="tb">3年（36か月）使うと</text>
<text x="12" y="381">A案</text>
<rect x="44" y="367" width="45" height="20" class="fm"/>
<rect x="89" y="367" width="81" height="20" class="fas sa" stroke-width="1"/>
<text x="176" y="382" class="tb">280万円</text>
<text x="12" y="411">B案</text>
<rect x="44" y="397" width="99" height="20" class="fm"/>
<rect x="143" y="397" width="32.4" height="20" class="fas sa" stroke-width="1"/>
<text x="181" y="412" class="tb">292万円</text>
<text x="12" y="438" class="tm">A：100＋5×36＝100＋180＝280</text>
<text x="12" y="456" class="tm">B：220＋2×36＝220＋72＝292</text>
<text x="12" y="478" class="tok tb">→ A案が安い</text>
<text x="12" y="510" class="tb">5年（60か月）使うと</text>
<text x="12" y="535">A案</text>
<rect x="44" y="521" width="45" height="20" class="fm"/>
<rect x="89" y="521" width="135" height="20" class="fas sa" stroke-width="1"/>
<text x="230" y="536" class="tb">400万円</text>
<text x="12" y="565">B案</text>
<rect x="44" y="551" width="99" height="20" class="fm"/>
<rect x="143" y="551" width="54" height="20" class="fas sa" stroke-width="1"/>
<text x="203" y="566" class="tb">340万円</text>
<text x="12" y="592" class="tm">A：100＋5×60＝100＋300＝400</text>
<text x="12" y="610" class="tm">B：220＋2×60＝220＋120＝340</text>
<text x="12" y="632" class="tok tb">→ B案が安い（逆転）</text>
<text x="12" y="654">導入費だけで選ぶと、長く使うと損をしうる</text>
</svg>
