<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 418" role="img" aria-labelledby="fig-dx-revenue-share-fit-t fig-dx-revenue-share-fit-d">
<title id="fig-dx-revenue-share-fit-t">レベニューシェアが向くシステム、向かないシステム</title>
<desc id="fig-dx-revenue-share-fit-d">経済産業省の調査報告書（平成29年3月）の説明を描いた図。レベニューシェアは、生み出した収益を事前に決めた配分率で分け合う取引形態。説明のための例として、売上1,000万円に配分率10%を掛けると、ITベンダーの取り分は100万円になる。ECサイトのように売上高を数値で表せるシステムは、この計算ができるので適用しやすい。基幹系システムのような後方事務を支えるシステムは売上高として表しにくく、分け合う収益を測りにくいので、適用は難しいと言われている。前提は、分け合う収益を測れること。</desc>
<rect x="12" y="14" width="296" height="136" class="fs sb" stroke-width="1.5"/>
<text x="24" y="36" class="tb">レベニューシェアの仕組み</text>
<text x="24" y="56">生み出した収益を、事前に決めた</text>
<text x="24" y="74">配分率で分け合う</text>
<text x="24" y="98" class="tm">説明のための例</text>
<text x="24" y="118">売上1,000万円 × 配分率10%</text>
<text x="24" y="138" class="tb">＝ ITベンダーの取り分100万円</text>
<rect x="12" y="162" width="296" height="90" class="fok sok" stroke-width="1.5"/>
<text x="24" y="184" class="tb">○ ECサイト</text>
<text x="24" y="204">売上高が数値で見える</text>
<text x="24" y="222">→ 売上 × 配分率 を計算できる</text>
<text x="24" y="240" class="tb">→ 適用しやすい</text>
<rect x="12" y="264" width="296" height="90" class="fng sng" stroke-width="1.5"/>
<text x="24" y="286" class="tb">✕ 基幹系（後方事務を支える）</text>
<text x="24" y="306">売上高としては表しにくい</text>
<text x="24" y="324">→ 分け合う収益を測りにくい</text>
<text x="24" y="342" class="tb">→ 適用は難しいと言われる</text>
<rect x="12" y="366" width="296" height="40" class="fa" stroke-width="1.5"/>
<text x="160" y="391" class="tb ton" text-anchor="middle">前提：分け合う収益を測れること</text>
</svg>
