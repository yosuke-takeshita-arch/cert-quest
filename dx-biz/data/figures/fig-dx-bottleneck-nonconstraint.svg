<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 676" role="img" aria-labelledby="fig-dx-bottleneck-nonconstraint-t fig-dx-bottleneck-nonconstraint-d">
<title id="fig-dx-bottleneck-nonconstraint-t">制約でない工程Aを速くしても、ライン全体は1時間50件のまま</title>
<desc id="fig-dx-bottleneck-nonconstraint-d">何のための図か：工程A＝90件、工程B＝50件、工程C＝70件のラインで、工程Aを150件にしても全体が増えない理由を、問題の数で見る。読み方：横棒グラフで、棒の長さはその工程が1時間に処理できる件数。品物は工程A→工程B→工程Cの順に流れる。考え方：どの品物も3つの工程を全部通るので、ライン全体の出力は、いちばん少ない工程の件数で決まる。これを制約（ボトルネック）と言う。機械を入れる前：90・50・70件で、いちばん少ない工程Bの50件が全体の出力。機械を入れた後：150・50・70件で、いちばん少ないのはやはり工程Bの50件。全体は50件のまま。工程Aからは1時間150件が流れてくるが、工程Bは50件しか通せないので、150−50＝100件ずつ、工程Bの手前に処理を待つ仕掛品がたまっていく（前でも90−50＝40件ずつたまっていた）。工程Cには50件しか来ないので、70件の力のうち20件分は空いたまま。全体を増やすには、制約である工程Bを生かし、強くするのが先。</desc>
<text x="12" y="20" class="tb">制約でない工程を速くしても、全体は増えない</text>
<text x="12" y="42" class="tm">問題の数：A＝90件、B＝50件、C＝70件／時間</text>
<rect x="12" y="54" width="296" height="68" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="74" class="tb">まず読み方</text>
<text x="22" y="92" class="tm">横棒グラフ。棒の長さ＝1時間に処理できる件数</text>
<text x="22" y="110" class="tm">品物は 工程A → 工程B → 工程C の順に流れる</text>
<text x="12" y="148" class="tb">考え方：どの品物も3つを全部通る</text>
<text x="12" y="168" class="tb ta">→ 全体＝いちばん少ない工程の件数（制約）</text>
<line x1="12" y1="180" x2="308" y2="180" class="l sb w1"/>
<text x="12" y="204" class="tb">① 機械を入れる前</text>
<text x="12" y="234">工程A</text>
<rect x="64" y="219" width="120" height="20" class="fs sm" stroke-width="1.5"/>
<text x="190" y="234">90件</text>
<text x="12" y="264">工程B</text>
<rect x="64" y="249" width="66.7" height="20" class="fng sng" stroke-width="1.5"/>
<text x="136.7" y="264" class="tb tng">50件 ← 制約</text>
<text x="12" y="294">工程C</text>
<rect x="64" y="279" width="93.3" height="20" class="fs sm" stroke-width="1.5"/>
<text x="163.3" y="294">70件</text>
<text x="12" y="320" class="tb">全体＝いちばん少ない 50件／時間</text>
<line x1="12" y1="332" x2="308" y2="332" class="l sb w1"/>
<text x="12" y="356" class="tb">② 工程Aに機械を入れて 150件にした後</text>
<text x="12" y="386">工程A</text>
<rect x="64" y="371" width="200" height="20" class="fok sok" stroke-width="1.5"/>
<text x="270" y="386" class="tok">150件</text>
<text x="12" y="416">工程B</text>
<rect x="64" y="401" width="66.7" height="20" class="fng sng" stroke-width="1.5"/>
<text x="136.7" y="416" class="tb tng">50件 ← 制約のまま</text>
<text x="12" y="446">工程C</text>
<rect x="64" y="431" width="93.3" height="20" class="fs sm" stroke-width="1.5"/>
<text x="163.3" y="446">70件</text>
<text x="12" y="472" class="tm">いちばん少ないのは、まだ工程Bの50件</text>
<line x1="12" y1="484" x2="308" y2="484" class="l sb w1"/>
<text x="12" y="508" class="tb">③ 何が起きるか</text>
<text x="12" y="526">Aから1時間150件来るが、Bは50件しか通せない</text>
<text x="12" y="546" class="tb tng">150 − 50 ＝ 100件ずつ、Bの手前にたまる</text>
<text x="12" y="564" class="tm">（前も 90 − 50 ＝ 40件ずつ たまっていた）</text>
<text x="12" y="582" class="tm">Cには50件しか来ず、70件の力のうち20件分は空く</text>
<rect x="12" y="594" width="296" height="68" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="614" class="tb tok">答え：全体は 50件／時間 のまま</text>
<text x="22" y="632" class="tm">増やすなら、まず制約の工程Bを生かし、</text>
<text x="22" y="650" class="tm">強くする</text>
</svg>
