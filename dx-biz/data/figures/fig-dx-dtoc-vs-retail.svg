<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" role="img" aria-labelledby="fig-dx-dtoc-vs-retail-t fig-dx-dtoc-vs-retail-d">
<title id="fig-dx-dtoc-vs-retail-t">卸・小売を通して売るか、DtoCで直接売るか：集客を誰がするか</title>
<desc id="fig-dx-dtoc-vs-retail-d">何のための図か：日本政策金融公庫総合研究所のレポートの説明で、卸・小売などの流通業者を通して売る場合と、メーカーが自社のECサイトで直接売るDtoC（デジタル化されたメーカー直販）を比べる。流通業者を通すと、集客は小売店の仕事になる。DtoCでは、製品をどう売るか、いくらで売るかをメーカー自身が決められ、小売店で安売りの目玉にされることもない。その代わり、集客をはじめ小売りのノウハウがメーカー自身に必要になる。レポートはこれをDtoCのデメリット・問題点の第一に挙げ、知名度のない中小企業が始めても簡単には成功しないとしている。</desc>
<text x="12" y="20" class="tb">DtoC：決められる代わりに、自分で集める</text>
<text x="12" y="50" class="tb">A 卸・小売を通して売る</text>
<rect x="12" y="60" width="64" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="44" y="80" text-anchor="middle">メーカー</text>
<rect x="88" y="60" width="64" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="120" y="80" text-anchor="middle">卸</text>
<rect x="164" y="60" width="64" height="30" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="196" y="80" text-anchor="middle">小売店</text>
<rect x="240" y="60" width="64" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="272" y="80" text-anchor="middle">客</text>
<line x1="77" y1="75" x2="81" y2="75" class="l sa w2"/>
<polyline points="80,70 87,75 80,80" class="l sa w2" fill="none"/>
<line x1="153" y1="75" x2="157" y2="75" class="l sa w2"/>
<polyline points="156,70 163,75 156,80" class="l sa w2" fill="none"/>
<line x1="229" y1="75" x2="233" y2="75" class="l sa w2"/>
<polyline points="232,70 239,75 232,80" class="l sa w2" fill="none"/>
<rect x="12" y="98" width="296" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="120">集客：小売店がする</text>
<text x="22" y="138">売り方・値段：小売店の判断に左右される</text>
<text x="22" y="156">（安売りの目玉にされることもある）</text>
<text x="12" y="198" class="tb">B DtoC（自社のECサイトで直接売る）</text>
<rect x="12" y="208" width="68" height="30" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="46" y="228" text-anchor="middle">メーカー</text>
<rect x="240" y="208" width="68" height="30" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="274" y="228" text-anchor="middle">客</text>
<line x1="82" y1="223" x2="232" y2="223" class="l sa w2"/>
<polyline points="231,218 238,223 231,228" class="l sa w2" fill="none"/>
<text x="160" y="218" class="tm" text-anchor="middle">自社のECサイト</text>
<rect x="12" y="246" width="296" height="88" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="268" class="tok">得：売り方・値段をメーカーが自分で決める</text>
<text x="22" y="286" class="tng">損：集客など小売りのノウハウを</text>
<text x="22" y="304" class="tng">　メーカー自身が担う</text>
<text x="22" y="322">知名度が無いと、簡単には成功しない</text>
<text x="12" y="358" class="tm">日本公庫総研レポート「中小企業の売る力を</text>
<text x="12" y="376" class="tm">強化するDtoC」（2022年3月）</text>
</svg>
