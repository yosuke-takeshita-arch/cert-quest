<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="fig-dx-chasm-t fig-dx-chasm-d">
<title id="fig-dx-chasm-t">キャズム：初期の利用者と多数派の間の溝</title>
<desc id="fig-dx-chasm-d">左の崖は初期の利用者（アーリーアダプター）で、新しさや可能性に動かされる。右の崖は、その後に続く多数派（アーリーマジョリティ）で、他社の実績を見て動く。間に価値観の違いによる溝（キャズム）があり、ここを越えられないと普及が止まる。溝の上に架ける橋は、初期の利用者での成功例と、その口コミ。多数派には、成功企業の事例を当てはめる働きかけ（ソリューション型）が効く。この整理は、中小企業庁の研究会に民間の支援会社が出した資料による。</desc>
<text x="12" y="22" class="tb">普及が止まる「溝」</text>
<text x="160" y="76" class="ta tb" text-anchor="middle">橋＝成功例と口コミ</text>
<path d="M 108 120 Q 160 66, 212 120" class="l sa w2"/>
<polyline points="205.5,117 212,120 210.5,113" class="l sa w2"/>
<text x="70" y="112" class="tm" text-anchor="middle">新しさ・可能性</text>
<text x="70" y="130" class="tm" text-anchor="middle">で動く</text>
<text x="250" y="112" class="tm" text-anchor="middle">他社の実績</text>
<text x="250" y="130" class="tm" text-anchor="middle">を見て動く</text>
<polygon points="4,140 138,140 138,250 4,250" class="fok l sok"/>
<text x="71" y="176" class="tb" text-anchor="middle">初期の利用者</text>
<text x="71" y="198" text-anchor="middle">アーリー</text>
<text x="71" y="216" text-anchor="middle">アダプター</text>
<polygon points="182,140 316,140 316,250 182,250" class="fwn l swn"/>
<text x="249" y="176" class="tb" text-anchor="middle">多数派</text>
<text x="249" y="198" text-anchor="middle">アーリー</text>
<text x="249" y="216" text-anchor="middle">マジョリティ</text>
<line x1="160" y1="150" x2="160" y2="246" class="l sng w1 dsh"/>
<text x="160" y="270" class="tng tb" text-anchor="middle">キャズム（溝）</text>
<text x="160" y="288" class="tng" text-anchor="middle">価値観の違い</text>
<line x1="12" y1="306" x2="308" y2="306" class="l sb w1"/>
<text x="12" y="330">溝を越えられないと、普及が止まる</text>
<text x="12" y="352">多数派には、成功企業の事例を当てはめる</text>
<text x="12" y="370">働きかけ（ソリューション型）が効く</text>
<text x="12" y="396" class="tm">※中小企業庁の研究会に、民間の支援会社が</text>
<text x="12" y="414" class="tm">　出した資料の整理（国の方針ではない）</text>
</svg>
