<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" role="img" aria-labelledby="fig-dx-lockin-share-t fig-dx-lockin-share-d">
<title id="fig-dx-lockin-share-t">ネットワーク外部性とスイッチング・コストは、シェアへの効き方が違う</title>
<desc id="fig-dx-lockin-share-d">公正取引委員会の共同研究「ネットワーク外部性とスイッチングコストの経済分析」の説明を、説明のための例の棒グラフで描いた図。縦軸はシェア（%）、横軸は会社（A社・B社・C社）。薄い棒が今、濃い棒がしばらく後。今のシェアは A社60%、B社35%、C社5%。ネットワーク外部性によるロックインは、利用者が多い会社ほど強く効き、正のフィードバックがかかるので、しばらく後は A社75%、B社22%、C社3% のように最大シェアの会社がさらに伸びる。スイッチング・コストはシェアにかかわらずどの会社にも同じように働くので、しばらく後も 60%、35%、5% のまま今のシェアが固まる。シェア5%のC社でも、操作に慣れた利用者は乗り換えにくい。</desc>
<text x="12" y="30" class="tb">棒グラフ（説明のための例）</text>
<text x="12" y="48">縦軸：シェア（%）　横軸：会社</text>
<rect x="24" y="57" width="14" height="12" class="fas sa" stroke-width="1"/>
<text x="44" y="67">今</text>
<rect x="84" y="57" width="14" height="12" class="fa" stroke-width="1"/>
<text x="104" y="67">しばらく後</text>
<rect x="12" y="80" width="296" height="222" class="fs sb" stroke-width="1.5"/>
<text x="24" y="102" class="tb">ネットワーク外部性</text>
<text x="24" y="120">利用者が多い会社ほど強く効く</text>
<line x1="56" y1="130" x2="56" y2="232" class="l sm w1"/>
<line x1="56" y1="232" x2="292" y2="232" class="l sm w1"/>
<rect x="80" y="160" width="18" height="72" class="fas sa" stroke-width="1"/>
<rect x="102" y="142" width="18" height="90" class="fa" stroke-width="1"/>
<text x="89" y="156" class="tm" text-anchor="middle">60</text>
<text x="111" y="138" class="tb" text-anchor="middle">75</text>
<text x="100" y="250" text-anchor="middle">A社</text>
<rect x="152" y="190" width="18" height="42" class="fas sa" stroke-width="1"/>
<rect x="174" y="205.6" width="18" height="26.4" class="fa" stroke-width="1"/>
<text x="161" y="186" class="tm" text-anchor="middle">35</text>
<text x="183" y="201.6" class="tb" text-anchor="middle">22</text>
<text x="172" y="250" text-anchor="middle">B社</text>
<rect x="224" y="226" width="18" height="6" class="fas sa" stroke-width="1"/>
<rect x="246" y="228.4" width="18" height="3.5999999999999996" class="fa" stroke-width="1"/>
<text x="233" y="222" class="tm" text-anchor="middle">5</text>
<text x="255" y="224.4" class="tb" text-anchor="middle">3</text>
<text x="244" y="250" text-anchor="middle">C社</text>
<text x="24" y="272" class="tb">→ 最大シェアの会社がさらに伸びる</text>
<text x="24" y="290" class="tm">（正のフィードバック）</text>
<rect x="12" y="314" width="296" height="222" class="fs sb" stroke-width="1.5"/>
<text x="24" y="336" class="tb">スイッチング・コスト</text>
<text x="24" y="354">シェアにかかわらず、同じように効く</text>
<line x1="56" y1="364" x2="56" y2="466" class="l sm w1"/>
<line x1="56" y1="466" x2="292" y2="466" class="l sm w1"/>
<rect x="80" y="394" width="18" height="72" class="fas sa" stroke-width="1"/>
<rect x="102" y="394" width="18" height="72" class="fa" stroke-width="1"/>
<text x="89" y="390" class="tm" text-anchor="middle">60</text>
<text x="111" y="390" class="tb" text-anchor="middle">60</text>
<text x="100" y="484" text-anchor="middle">A社</text>
<rect x="152" y="424" width="18" height="42" class="fas sa" stroke-width="1"/>
<rect x="174" y="424" width="18" height="42" class="fa" stroke-width="1"/>
<text x="161" y="420" class="tm" text-anchor="middle">35</text>
<text x="183" y="420" class="tb" text-anchor="middle">35</text>
<text x="172" y="484" text-anchor="middle">B社</text>
<rect x="224" y="460" width="18" height="6" class="fas sa" stroke-width="1"/>
<rect x="246" y="460" width="18" height="6" class="fa" stroke-width="1"/>
<text x="233" y="456" class="tm" text-anchor="middle">5</text>
<text x="255" y="456" class="tb" text-anchor="middle">5</text>
<text x="244" y="484" text-anchor="middle">C社</text>
<text x="24" y="506" class="tb">→ 今のシェアが固まる（伸びはしない）</text>
<text x="24" y="524" class="tm">シェア5%のC社でも、慣れた人は動きにくい</text>
</svg>
