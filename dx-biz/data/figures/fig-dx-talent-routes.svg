<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 540" role="img" aria-labelledby="fig-dx-talent-routes-t fig-dx-talent-routes-d">
<title id="fig-dx-talent-routes-t">DX人材の確保：4つの道と、その土台</title>
<desc id="fig-dx-talent-routes-d">真ん中に、自社でDXを担う人材。そこへ4つの道がつながる。1 社内で育てる（リスキリング・リカレント教育、学び直し）。2 社外から獲得する（採用）。3 外部と連携する。4 副業・兼業で人材が行き来する。下は土台の3段。デジタルスキル標準を参照して必要なスキルを明確にする、社員のスキルを見える化する、全社員のデジタルリテラシーを高める。技術はすぐ古くなるので、学び続けるマインドと、専門性を評価する仕組み・学び直しの仕組みが要る。専門人材の採用だけに頼り、一般社員の教育を省くのは不十分。</desc>
<text x="12" y="22" class="tb">4つの道で集め、育てる</text>
<rect x="12" y="36" width="140" height="56" class="fas l sa"/>
<text x="82" y="58" class="tb" text-anchor="middle">1 社内で育てる</text>
<text x="82" y="80" class="tm" text-anchor="middle">リスキリング等</text>
<rect x="168" y="36" width="140" height="56" class="fas l sa"/>
<text x="238" y="58" class="tb" text-anchor="middle">2 社外から獲得</text>
<text x="238" y="80" class="tm" text-anchor="middle">採用する</text>
<rect x="92" y="122" width="136" height="50" class="fa"/>
<text x="160" y="143" class="tb ton" text-anchor="middle">自社で</text>
<text x="160" y="162" class="tb ton" text-anchor="middle">DXを担う人材</text>
<rect x="12" y="202" width="140" height="56" class="fas l sa"/>
<text x="82" y="224" class="tb" text-anchor="middle">3 外部と連携</text>
<text x="82" y="246" class="tm" text-anchor="middle">他社などと組む</text>
<rect x="168" y="202" width="140" height="56" class="fas l sa"/>
<text x="238" y="224" class="tb" text-anchor="middle">4 副業・兼業</text>
<text x="238" y="246" class="tm" text-anchor="middle">人材が行き来する</text>
<line x1="82" y1="92" x2="112" y2="120" class="l sa w2"/>
<line x1="238" y1="92" x2="208" y2="120" class="l sa w2"/>
<line x1="82" y1="202" x2="112" y2="174" class="l sa w2"/>
<line x1="238" y1="202" x2="208" y2="174" class="l sa w2"/>
<text x="12" y="282" class="tm">リスキリング・リカレント教育＝学び直し</text>
<line x1="12" y1="298" x2="308" y2="298" class="l sb w1"/>
<text x="12" y="322" class="tb">土台（デジタルガバナンス・コード3.0）</text>
<rect x="12" y="334" width="296" height="30" class="fs l sm"/>
<text x="24" y="354">デジタルスキル標準で、要るスキルを明確に</text>
<rect x="12" y="368" width="296" height="30" class="fs l sm"/>
<text x="24" y="388">社員のスキルを見える化する</text>
<rect x="12" y="402" width="296" height="30" class="fs l sm"/>
<text x="24" y="422">全社員のデジタルリテラシーを高める</text>
<text x="12" y="452">技術はすぐ古くなる → 学び続ける心構えと、</text>
<text x="12" y="470">専門性の評価・学び直しの仕組みが要る</text>
<rect x="12" y="486" width="296" height="44" class="fng l sng"/>
<text x="24" y="506">✕ 専門人材の採用だけに頼り、</text>
<text x="24" y="522">　 一般社員の教育を省く</text>
</svg>
