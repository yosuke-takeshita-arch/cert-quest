<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-dx-death-valley-t fig-dx-death-valley-d">
<title id="fig-dx-death-valley-t">研究開発から事業化までの段階と、死の谷・ダーウィンの海</title>
<desc id="fig-dx-death-valley-d">上は技術の成熟度（TRL）1から9の帯。1と2が基礎研究、3から5が応用研究・開発、6と7が実証、8と9が事業化に当たる。下は、経済産業省の資料の図にある研究開発の流れ。基礎研究・発明と応用研究・開発の間に死の谷があり、応用研究・開発と製品化開発の間にダーウィンの海がある。総務省の資料によれば、死の谷は、基礎研究で新発見や新技術が生まれても、製品化に必要な研究資金が集まらないことが多いことからついた名前で、越えるには、発見の段階での資金援助と、研究開発のマネジメント体制が要る。</desc>
<text x="12" y="22" class="tb">技術の成熟度（TRL）は1〜9の段階</text>
<rect x="12" y="34" width="64" height="26" class="fs l sm"/>
<text x="44" y="52" text-anchor="middle">基礎研究</text>
<rect x="76" y="34" width="96" height="26" class="fs l sm"/>
<text x="124" y="52" text-anchor="middle">応用研究・開発</text>
<rect x="172" y="34" width="64" height="26" class="fs l sm"/>
<text x="204" y="52" text-anchor="middle">実証</text>
<rect x="236" y="34" width="72" height="26" class="fs l sm"/>
<text x="272" y="52" text-anchor="middle">事業化</text>
<text x="28" y="78" class="tm" text-anchor="middle">1</text>
<text x="60" y="78" class="tm" text-anchor="middle">2</text>
<text x="92" y="78" class="tm" text-anchor="middle">3</text>
<text x="124" y="78" class="tm" text-anchor="middle">4</text>
<text x="156" y="78" class="tm" text-anchor="middle">5</text>
<text x="188" y="78" class="tm" text-anchor="middle">6</text>
<text x="220" y="78" class="tm" text-anchor="middle">7</text>
<text x="254" y="78" class="tm" text-anchor="middle">8</text>
<text x="290" y="78" class="tm" text-anchor="middle">9</text>
<line x1="12" y1="96" x2="308" y2="96" class="l sb w1"/>
<text x="12" y="120" class="tb">途中に、2つの関門がある</text>
<rect x="40" y="134" width="240" height="38" class="fok l sok"/>
<text x="160" y="158" class="tb" text-anchor="middle">基礎研究・発明</text>
<line x1="160" y1="172" x2="160" y2="250" class="l sm w1"/>
<polyline points="155,244 160,250 165,244" class="l sm w1"/>
<rect x="12" y="186" width="296" height="52" class="fng l sng"/>
<text x="20" y="206" class="tng tb">死の谷</text>
<text x="20" y="228">製品化に要る研究資金が集まらず止まる</text>
<rect x="40" y="252" width="240" height="38" class="fok l sok"/>
<text x="160" y="276" class="tb" text-anchor="middle">応用研究・開発</text>
<line x1="160" y1="290" x2="160" y2="346" class="l sm w1"/>
<polyline points="155,340 160,346 165,340" class="l sm w1"/>
<rect x="12" y="302" width="296" height="32" class="fng l sng"/>
<text x="20" y="323" class="tng tb">ダーウィンの海</text>
<rect x="40" y="348" width="240" height="38" class="fok l sok"/>
<text x="160" y="372" class="tb" text-anchor="middle">製品化開発</text>
<line x1="12" y1="406" x2="308" y2="406" class="l sb w1"/>
<text x="12" y="430" class="tb">死の谷の越え方（総務省の資料）</text>
<text x="12" y="452">・発見の段階での資金援助</text>
<text x="12" y="474">・研究開発にもマネジメント体制をつくる</text>
<text x="12" y="502" class="tm">技術ができることと、社会で使われる</text>
<text x="12" y="520" class="tm">ことの間には、資金・体制・制度という</text>
<text x="12" y="538" class="tm">別の壁がある</text>
</svg>
