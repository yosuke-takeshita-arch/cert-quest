<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 386" role="img" aria-labelledby="fig-dx-switching-cost-flow-t fig-dx-switching-cost-flow-d">
<title id="fig-dx-switching-cost-flow-t">移せない写真とつながり→乗り換えの負担→ロックイン→競争が効きにくくなる</title>
<desc id="fig-dx-switching-cost-flow-d">何のための図か：写真共有サービスの利用者が、より安くて使いやすい競合が出ても乗り換えにくい流れを、令和元年版情報通信白書の説明で見る。①何年分もの写真と友人とのつながりを移せない。②乗り換えるときの金銭的・手続的・心理的な負担（スイッチング・コスト）が重い。③安くて質の高い競合が出ても、乗り換えをためらう。④サービス提供者に縛られた状態（ロックイン）になる。⑤サービスどうしの競争の効果が弱まる。利用者が乗り換えをためらうので、X社が値下げで引き留める圧力も弱い。</desc>
<text x="12" y="20" class="tb">乗り換えの負担が、競争を効きにくくする</text>
<rect x="12" y="34" width="296" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="55" text-anchor="middle">① 何年分もの写真と、友人との</text>
<text x="160" y="73" text-anchor="middle">つながりを、ほかへ移せない</text>
<line x1="160" y1="88" x2="160" y2="98" class="l sa w2"/>
<polyline points="155,97 160,104 165,97" class="l sa w2" fill="none"/>
<rect x="12" y="104" width="296" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="125" text-anchor="middle">② 乗り換えの負担（スイッチング・コスト）</text>
<text x="160" y="143" text-anchor="middle" class="tm">金銭・手続き・心理の負担</text>
<line x1="160" y1="158" x2="160" y2="168" class="l sa w2"/>
<polyline points="155,167 160,174 165,167" class="l sa w2" fill="none"/>
<rect x="12" y="174" width="296" height="50" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="195" text-anchor="middle">③ 安くて使いやすい競合が出ても、</text>
<text x="160" y="213" text-anchor="middle">乗り換えをためらう</text>
<line x1="160" y1="228" x2="160" y2="238" class="l sa w2"/>
<polyline points="155,237 160,244 165,237" class="l sa w2" fill="none"/>
<rect x="12" y="244" width="296" height="32" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="160" y="265" text-anchor="middle" class="tng">④ X社に縛られる（ロックイン）</text>
<line x1="160" y1="280" x2="160" y2="290" class="l sa w2"/>
<polyline points="155,289 160,296 165,289" class="l sa w2" fill="none"/>
<rect x="12" y="296" width="296" height="32" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="160" y="317" text-anchor="middle" class="tng">⑤ サービスどうしの競争の効果が弱まる</text>
<text x="12" y="354" class="tm">利用者が動かないので、X社が値下げで</text>
<text x="12" y="372" class="tm">引き留める圧力もむしろ弱い</text>
</svg>
