<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 354" role="img" aria-labelledby="fig-dx-space-agile-chain-t fig-dx-space-agile-chain-d">
<title id="fig-dx-space-agile-chain-t">失敗を許す高頻度の実証→コスト低下→新技術を早く市場へ→デジタルと組んで市場が広がる</title>
<desc id="fig-dx-space-agile-chain-d">何のための図か：宇宙基本計画（令和5年）の説明で、失敗を許して短い間隔で何度も実証する進め方（アジャイルな開発手法）から、宇宙ソリューションの市場の拡大までのつながりを見る。①失敗を許しつつ、高い頻度で実証する。②ロケット輸送や小型衛星などの短期実証で、コストが下がる。③新しい技術を短期間で市場に出せる。④高解像度の地球観測などの技術革新を、AI・クラウドなどのデジタルソリューションと組み合わせる。⑤通信衛星コンステレーションによるブロードバンドや観測衛星を使ったインフラ管理などの宇宙ソリューションが生まれ、その市場が拡大している。</desc>
<text x="12" y="20" class="tb">宇宙もアジャイル：回数を増やして早く出す</text>
<text x="12" y="42" class="tm">宇宙基本計画（令和5年）の説明</text>
<rect x="12" y="56" width="296" height="32" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="77" text-anchor="middle">① 失敗を許し、短い間隔で何度も実証する</text>
<line x1="160" y1="92" x2="160" y2="102" class="l sa w2"/>
<polyline points="155,101 160,108 165,101" class="l sa w2" fill="none"/>
<rect x="12" y="108" width="296" height="32" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="129" text-anchor="middle">② 短期の実証で、機器のコストが下がる</text>
<line x1="160" y1="144" x2="160" y2="154" class="l sa w2"/>
<polyline points="155,153 160,160 165,153" class="l sa w2" fill="none"/>
<rect x="12" y="160" width="296" height="32" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="181" text-anchor="middle">③ 新しい技術を、短期間で市場に出せる</text>
<line x1="160" y1="196" x2="160" y2="206" class="l sa w2"/>
<polyline points="155,205 160,212 165,205" class="l sa w2" fill="none"/>
<rect x="12" y="212" width="296" height="32" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="233" text-anchor="middle">④ AI・クラウドなどのデジタルと組み合わせる</text>
<line x1="160" y1="248" x2="160" y2="258" class="l sa w2"/>
<polyline points="155,257 160,264 165,257" class="l sa w2" fill="none"/>
<rect x="12" y="264" width="296" height="32" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="285" text-anchor="middle" class="tb tok">⑤ 宇宙ソリューションの市場が広がる</text>
<text x="12" y="322" class="tm">例：通信衛星の群れによるブロードバンド、</text>
<text x="12" y="340" class="tm">観測衛星を使ったインフラの管理</text>
</svg>
