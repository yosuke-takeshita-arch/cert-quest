<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-dx-supervised-unsupervised-t fig-dx-supervised-unsupervised-d">
<title id="fig-dx-supervised-unsupervised-t">教師あり学習と教師なし学習：正解のラベルがあるか無いか</title>
<desc id="fig-dx-supervised-unsupervised-d">同じ6枚の写真（丸の形が3枚、三角の形が3枚。図の例）で、2つの学び方を比べた図。上：教師あり学習。写真1枚ずつに、人が正解のラベル（ネコ、イヌ）を付けて学ばせる。この作業をアノテーションという。学んだ後、新しい写真を見せると「ネコ」と答えられる。使い道は売上・成約・離反の予測など。下：教師なし学習。ラベルを付けずに同じ6枚を渡す。似たもの同士が2つのまとまりに分かれるが、まとまりがネコと呼ばれるものかは分からない。使い道は顧客のグループ化（セグメンテーション）や店舗のクラスタリングなど。</desc>
<text x="12" y="22" class="tb">同じ6枚の写真で比べる（図の例）</text>
<text x="12" y="40" class="tm">○の形＝ネコの写真、△の形＝イヌの写真</text>
<rect x="12" y="52" width="296" height="200" class="fs l sa"/>
<text x="24" y="74" class="tb ta">教師あり学習：正解のラベルを付ける</text>
<circle cx="44" cy="106" r="12" class="l sm"/>
<text x="44" y="138" class="tb" text-anchor="middle">ネコ</text>
<circle cx="88" cy="106" r="12" class="l sm"/>
<text x="88" y="138" class="tb" text-anchor="middle">ネコ</text>
<circle cx="132" cy="106" r="12" class="l sm"/>
<text x="132" y="138" class="tb" text-anchor="middle">ネコ</text>
<polygon points="176,94 189,117 163,117" class="l sm"/>
<text x="176" y="138" class="tb" text-anchor="middle">イヌ</text>
<polygon points="220,94 233,117 207,117" class="l sm"/>
<text x="220" y="138" class="tb" text-anchor="middle">イヌ</text>
<polygon points="264,94 277,117 251,117" class="l sm"/>
<text x="264" y="138" class="tb" text-anchor="middle">イヌ</text>
<text x="24" y="162" class="tm">↑ 人が1枚ずつ付ける（アノテーション）</text>
<text x="24" y="188">学んだ後、新しい写真</text>
<circle cx="182" cy="183" r="10" class="l sm"/>
<text x="198" y="188">を見せると</text>
<rect x="24" y="200" width="160" height="30" class="fok l sok"/>
<text x="104" y="220" class="tb" text-anchor="middle">「ネコ」と答える</text>
<text x="24" y="246" class="tm">使い道：売上・成約・離反の予測</text>
<rect x="12" y="266" width="296" height="214" class="fs l swn"/>
<text x="24" y="288" class="tb twn">教師なし学習：ラベルを付けない</text>
<circle cx="44" cy="320" r="12" class="l sm"/>
<polygon points="88,308 101,331 75,331" class="l sm"/>
<circle cx="132" cy="320" r="12" class="l sm"/>
<polygon points="176,308 189,331 163,331" class="l sm"/>
<circle cx="220" cy="320" r="12" class="l sm"/>
<polygon points="264,308 277,331 251,331" class="l sm"/>
<text x="24" y="358">似たもの同士で、自分で分ける</text>
<line x1="160" y1="364" x2="160" y2="380" class="l swn w2"/>
<polyline points="156,374 160,380 164,374" class="l swn w2"/>
<rect x="24" y="384" width="128" height="44" class="l swn dsh"/>
<circle cx="52" cy="406" r="10" class="l sm"/>
<circle cx="88" cy="406" r="10" class="l sm"/>
<circle cx="124" cy="406" r="10" class="l sm"/>
<rect x="168" y="384" width="128" height="44" class="l swn dsh"/>
<polygon points="196,396 207,415 185,415" class="l sm"/>
<polygon points="232,396 243,415 221,415" class="l sm"/>
<polygon points="268,396 279,415 257,415" class="l sm"/>
<text x="88" y="446" text-anchor="middle">まとまり1</text>
<text x="232" y="446" text-anchor="middle">まとまり2</text>
<text x="24" y="470" class="tb">「ネコ」という名前までは分からない</text>
<line x1="12" y1="496" x2="308" y2="496" class="l sb w1"/>
<text x="12" y="518">教師なしの使い道：顧客のグループ化、</text>
<text x="12" y="538">店舗のクラスタリング</text>
</svg>
