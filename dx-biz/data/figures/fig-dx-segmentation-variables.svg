<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="fig-dx-segmentation-variables-t fig-dx-segmentation-variables-d">
<title id="fig-dx-segmentation-variables-t">デモグラフィック：市場を分ける4つの軸のうちの1つ</title>
<desc id="fig-dx-segmentation-variables-d">市場を分ける（セグメンテーション）ときの4つの軸を並べた図。観光庁のマーケティングガイドブックの例による。1つ目が人口動態変数（デモグラフィック変数）で、年齢・性別・家族構成・所得・職業・教育。2つ目は地理的変数（ジオグラフィック変数）で、地方・気候・地域特性。3つ目は心理的変数（サイコグラフィック変数）で、ライフスタイル・性格。4つ目は行動変数で、一人旅かグループ旅行か など。下は進め方の輪：まずざっくりした軸で切る、施策でデータを集める、その軸が妥当かを確かめる、軸を直して精度を上げる、をくり返す。</desc>
<text x="12" y="22" class="tb">市場を分ける4つの軸（セグメンテーション）</text>
<rect x="12" y="36" width="296" height="72" class="fas l sa w2"/>
<text x="24" y="58" class="tb">人口動態変数（デモグラフィック）</text>
<text x="24" y="78">年齢・性別・家族構成・</text>
<text x="24" y="96">所得・職業・教育</text>
<rect x="12" y="116" width="296" height="54" class="fs l sm"/>
<text x="24" y="138" class="tb">地理的変数（ジオグラフィック）</text>
<text x="24" y="158">地方・気候・地域特性</text>
<rect x="12" y="178" width="296" height="54" class="fs l sm"/>
<text x="24" y="200" class="tb">心理的変数（サイコグラフィック）</text>
<text x="24" y="220">ライフスタイル・性格</text>
<rect x="12" y="240" width="296" height="54" class="fs l sm"/>
<text x="24" y="262" class="tb">行動変数</text>
<text x="24" y="282">一人旅か、グループ旅行か など</text>
<text x="12" y="314" class="tm">太い枠＝人口の統計に表れる属性</text>
<line x1="12" y1="330" x2="308" y2="330" class="l sb w1"/>
<text x="12" y="352" class="tb">進め方：軸を少しずつ確かにする</text>
<rect x="12" y="366" width="140" height="44" class="fs l sm"/>
<text x="82" y="385" text-anchor="middle">1 ざっくりした</text>
<text x="82" y="402" text-anchor="middle">軸で切る</text>
<rect x="168" y="366" width="140" height="44" class="fs l sm"/>
<text x="238" y="385" text-anchor="middle">2 施策で</text>
<text x="238" y="402" text-anchor="middle">データを集める</text>
<rect x="168" y="436" width="140" height="44" class="fs l sm"/>
<text x="238" y="455" text-anchor="middle">3 その軸が</text>
<text x="238" y="472" text-anchor="middle">妥当か確かめる</text>
<rect x="12" y="436" width="140" height="44" class="fok l sok"/>
<text x="82" y="455" text-anchor="middle">4 軸を直して</text>
<text x="82" y="472" text-anchor="middle">精度を上げる</text>
<line x1="152" y1="388" x2="166" y2="388" class="l sa w2"/>
<polyline points="160,384 166,388 160,392" class="l sa w2"/>
<line x1="238" y1="410" x2="238" y2="434" class="l sa w2"/>
<polyline points="234,428 238,434 242,428" class="l sa w2"/>
<line x1="168" y1="458" x2="154" y2="458" class="l sa w2"/>
<polyline points="160,454 154,458 160,462" class="l sa w2"/>
<line x1="82" y1="436" x2="82" y2="412" class="l sa w2"/>
<polyline points="78,418 82,412 86,418" class="l sa w2"/>
<text x="12" y="506" class="tm">1〜4をくり返す（観光庁のガイドブックの勧め）</text>
</svg>
