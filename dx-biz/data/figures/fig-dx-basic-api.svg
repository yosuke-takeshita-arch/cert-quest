<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="fig-dx-basic-api-t fig-dx-basic-api-d">
<title id="fig-dx-basic-api-t">API＝決まった頼み方で機能やデータを借りる窓口</title>
<desc id="fig-dx-basic-api-d">上の箱は天気アプリ（頼む側）。真ん中は気象会社の API で、頼み方と答え方の形が決めてある窓口。下の箱は気象会社のシステムで、中身は外から見えない。天気アプリが API に「地点＝福岡」と送ると、API が中のシステムに伝え、「気温＝18℃、晴れ」という答えが API から天気アプリに返る。天気アプリは中のしくみを知らなくても、決まった形で頼めば答えを受け取れる。地点と気温は説明のための例。</desc>
<text x="12" y="22" class="tl">API＝決まった形の窓口</text>
<text x="12" y="44" class="tm">例：天気アプリが気象会社のデータを使う</text>
<rect x="70" y="60" width="180" height="44" class="fok sok" stroke-width="1.5" rx="8"/>
<text x="160" y="87" class="tb" text-anchor="middle">天気アプリ（頼む側）</text>
<line x1="120" y1="104" x2="120" y2="172" class="l sa w2"/>
<polygon points="120,180 115,172 125,172" class="fa"/>
<text x="112" y="136" class="tb ta" text-anchor="end">送る</text>
<text x="112" y="156" class="ta" text-anchor="end">地点＝福岡</text>
<line x1="200" y1="180" x2="200" y2="112" class="l sok w2"/>
<polygon points="200,104 195,112 205,112" class="fok sok" stroke-width="1.5"/>
<text x="210" y="136" class="tb tok">返る</text>
<text x="210" y="156" class="tok">気温＝18℃</text>
<text x="210" y="174" class="tok">晴れ</text>
<rect x="40" y="182" width="240" height="52" class="fas sa" stroke-width="2" rx="8"/>
<text x="160" y="204" class="tb ta" text-anchor="middle">気象会社の API（窓口）</text>
<text x="160" y="224" class="tm" text-anchor="middle">頼み方・答え方の形が決めてある</text>
<line x1="160" y1="234" x2="160" y2="256" class="l sm w1 dsh"/>
<rect x="40" y="258" width="240" height="64" class="fs sm dsh" stroke-width="1.5" rx="8"/>
<text x="160" y="282" text-anchor="middle">気象会社のシステム</text>
<text x="160" y="304" class="tm" text-anchor="middle">中身は外から見えない</text>
<line x1="12" y1="340" x2="308" y2="340" class="l sb w1"/>
<text x="12" y="364">アプリは中のしくみを知らなくても、</text>
<text x="12" y="386">決まった形で頼めば答えを受け取れる</text>
<text x="12" y="408" class="tm">相手のシステムに直接入らずに済む</text>
</svg>
