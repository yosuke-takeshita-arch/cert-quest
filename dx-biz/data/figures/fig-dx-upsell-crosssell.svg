<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" role="img" aria-labelledby="fig-dx-upsell-crosssell-t fig-dx-upsell-crosssell-d">
<title id="fig-dx-upsell-crosssell-t">アップセルとクロスセル：上へ勧めるか、横に添えるか</title>
<desc id="fig-dx-upsell-crosssell-d">中央に、検討中の商品（宿泊プランの標準の客室）。上向きの矢印で上位の商品（上位の客室）を勧めるのがアップセルで、より高額な上位の商品・サービスに乗り換えてもらい、客単価を上げる。横向きの矢印で関連する別の商品（夕食、送迎）を一緒に勧めるのがクロスセルで、関連するものを組み合わせて購入を促し、一人あたりの単価を上げる。</desc>
<rect x="90" y="14" width="140" height="56" class="fok sok" stroke-width="1.5"/>
<text x="160" y="37" class="tb" text-anchor="middle">上位の商品</text>
<text x="160" y="56" text-anchor="middle">例：上位の客室</text>
<line x1="160" y1="116" x2="160" y2="74" class="l sa w3"/>
<polyline points="163.85,81 160,74 156.15,81" class="l sa w3"/>
<text x="176" y="90" class="tb">アップセル</text>
<text x="176" y="110">上へ乗り換える</text>
<rect x="90" y="120" width="140" height="56" class="fa" stroke-width="1.5"/>
<text x="160" y="143" class="tb ton" text-anchor="middle">検討中の商品</text>
<text x="160" y="162" class="ton" text-anchor="middle">例：標準の客室</text>
<rect x="12" y="124" width="56" height="48" class="fwn swn" stroke-width="1.5"/>
<text x="40" y="152.5" class="tb" text-anchor="middle">夕食</text>
<rect x="252" y="124" width="56" height="48" class="fwn swn" stroke-width="1.5"/>
<text x="280" y="152.5" class="tb" text-anchor="middle">送迎</text>
<line x1="88" y1="148" x2="70" y2="148" class="l swn w3"/>
<polyline points="77,144.15 70,148 77,151.85" class="l swn w3"/>
<line x1="232" y1="148" x2="250" y2="148" class="l swn w3"/>
<polyline points="243,151.85 250,148 243,144.15" class="l swn w3"/>
<text x="160" y="198" class="tb" text-anchor="middle">クロスセル：関連する商品を横に添える</text>
<line x1="12" y1="216" x2="308" y2="216" class="l sb w1"/>
<text x="12" y="238">アップセル：上位の商品へ（縦）</text>
<text x="12" y="258">クロスセル：関連する商品を添える（横）</text>
</svg>
