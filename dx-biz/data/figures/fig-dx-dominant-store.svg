<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 492" role="img" aria-labelledby="fig-dx-dominant-store-t fig-dx-dominant-store-d">
<title id="fig-dx-dominant-store-t">ドミナント出店と独占禁止法の考え方</title>
<desc id="fig-dx-dominant-store-d">公正取引委員会のコンビニエンスストアの実態調査（令和2年9月）の内容を描いた図。上の段は地図の例。既存の加盟店の近くに、後から同じチェーンの新しい店が出ると、近くの客を同じチェーンどうしで分け合うことになり、後から出店されたオーナーからは日販（1日あたりの売上）が減ったとの回答が目立った。下の段は独占禁止法の上での扱い。本部が既存の加盟店の近くに出店すること自体は、原則として自由で、直ちに独占禁止法上の問題となるものではない（テリトリー権を設定した場合を除く）。一方、加盟者の募集時に近くに出店しないと説明しながら出店した場合などは、問題となるおそれがある。出店そのものが違反、という説明は誤り。</desc>
<text x="12" y="30" class="tb">ドミナント出店：近くに同じチェーンの店</text>
<rect x="12" y="40" width="296" height="156" class="fs sb" stroke-width="1.5"/>
<rect x="30" y="64" width="92" height="40" class="fas sa" stroke-width="1.5"/>
<text x="76" y="80" text-anchor="middle">既存の</text>
<text x="76" y="97" text-anchor="middle">加盟店</text>
<rect x="198" y="64" width="92" height="40" class="fas sa" stroke-width="1.5"/>
<text x="244" y="80" text-anchor="middle">後から出た</text>
<text x="244" y="97" text-anchor="middle">同じチェーン</text>
<circle cx="146" cy="72" r="4" class="fm"/>
<circle cx="160" cy="88" r="4" class="fm"/>
<circle cx="174" cy="72" r="4" class="fm"/>
<circle cx="152" cy="104" r="4" class="fm"/>
<circle cx="170" cy="106" r="4" class="fm"/>
<text x="146" y="126" class="tm">近くの客</text>
<text x="24" y="150">近くの客を、同じチェーンどうしで分け合う</text>
<text x="24" y="170" class="tb">既存店：『日販が減った』の回答が目立つ</text>
<text x="24" y="188" class="tm">（日販＝1日あたりの売上）</text>
<text x="12" y="222" class="tb">独占禁止法の上ではどうか（公正取引委員会）</text>
<rect x="12" y="232" width="296" height="88" class="fok sok" stroke-width="1.5"/>
<text x="24" y="254" class="tb">○ 近くに出店すること自体</text>
<text x="24" y="274">原則は自由で、直ちに独禁法上の</text>
<text x="24" y="292">問題となるものではない</text>
<text x="24" y="310" class="tm">（テリトリー権を設定した場合を除く）</text>
<rect x="12" y="330" width="296" height="88" class="fng sng" stroke-width="1.5"/>
<text x="24" y="352" class="tb">△ 募集時の説明と違う出店など</text>
<text x="24" y="372">『近くに出さない』と説明して加盟</text>
<text x="24" y="390">させたのに出店した、など</text>
<text x="24" y="408" class="tb">→ 問題となるおそれがある</text>
<rect x="12" y="430" width="296" height="50" class="fs sb" stroke-width="1.5"/>
<text x="24" y="452" class="tb">✕『出店そのものが違反』は誤り</text>
<text x="24" y="470" class="tm">問題になりうるのは、説明と違う場合など</text>
</svg>
