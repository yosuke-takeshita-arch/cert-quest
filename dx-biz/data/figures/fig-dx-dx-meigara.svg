<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 348" role="img" aria-labelledby="fig-dx-dx-meigara-t fig-dx-dx-meigara-d">
<title id="fig-dx-dx-meigara-t">攻めのIT経営銘柄（2015年〜）からDX銘柄（2020年〜）へ：どちらも攻めを評価する</title>
<desc id="fig-dx-dx-meigara-d">何のための図か：経済産業省の「DX銘柄」と、その前身の「攻めのIT経営銘柄」の流れと趣旨を見る。2015年から、経営革新、収益水準・生産性の向上をもたらす積極的なIT利活用に取り組む企業を攻めのIT経営銘柄として選定してきた。2020年からは、デジタル技術を前提としてビジネスモデル等を抜本的に変革し、新たな成長・競争力強化につなげていくDXに取り組む企業をDX銘柄として選定している。選定は経済産業省が東京証券取引所と情報処理推進機構（IPA）と共同で行う。デジタルガバナンス・コードの望ましい方向性は、DX銘柄・DXセレクションの評価・選定基準として使われる。業務システムの運用費の安さ（守り）を競う制度ではない。</desc>
<text x="12" y="20" class="tb">DX銘柄は「攻め」を評価する</text>
<rect x="12" y="38" width="130" height="70" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="77" y="60" text-anchor="middle" class="tb">2015年〜</text>
<text x="77" y="78" text-anchor="middle">攻めのIT経営</text>
<text x="77" y="96" text-anchor="middle">銘柄</text>
<rect x="178" y="38" width="130" height="70" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="243" y="69" text-anchor="middle" class="tb tok">2020年〜</text>
<text x="243" y="87" text-anchor="middle" class="tb tok">DX銘柄</text>
<line x1="144" y1="73" x2="170" y2="73" class="l sa w2"/>
<polyline points="169,68 176,73 169,78" class="l sa w2" fill="none"/>
<text x="12" y="132" class="tm">攻めのIT経営銘柄：経営革新・収益や生産性の</text>
<text x="12" y="150" class="tm">向上をもたらす積極的なIT利活用</text>
<text x="12" y="172" class="tm">DX銘柄：ビジネスモデル等を抜本的に変革し、</text>
<text x="12" y="190" class="tm">新たな成長・競争力強化につなげる</text>
<line x1="12" y1="202" x2="308" y2="202" class="l sb w1"/>
<text x="12" y="226" class="tm">選ぶ：経済産業省・東京証券取引所・IPA が共同</text>
<text x="12" y="248" class="tm">基準：デジタルガバナンス・コードの</text>
<text x="12" y="266" class="tm">『望ましい方向性』（DX認定は『基本的事項』）</text>
<rect x="12" y="278" width="296" height="56" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="22" y="302" class="tb tng">× 業務システムの運用費の安さ（守り）を</text>
<text x="22" y="322" class="tb tng">　競う制度ではない</text>
</svg>
