<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" role="img" aria-labelledby="fig-dx-sixth-industry-t fig-dx-sixth-industry-d">
<title id="fig-dx-sixth-industry-t">六次産業化：1つの事業者が3つの段階をまたぐ</title>
<desc id="fig-dx-sixth-industry-d">1次産業（生産）、2次産業（加工）、3次産業（流通・販売）の3つの段階を、農林漁業者が1人で横断する図。農林漁業者が、生産だけでなく、食品加工や流通・販売にも取り組み、生産物の価値を高めて所得を上げる。例は、ぶどうを育て、ワインに加工し、ネット通販や直売所で売る。</desc>
<text x="12" y="22" class="tb">農林漁業者が、3つの段階をまたぐ</text>
<rect x="36" y="32" width="272" height="66" class="fok sok" stroke-width="1.5"/>
<text x="48" y="56" class="tb">1次産業：生産</text>
<text x="48" y="80">例：ぶどうを育てる</text>
<rect x="36" y="112" width="272" height="66" class="fwn swn" stroke-width="1.5"/>
<text x="48" y="136" class="tb">2次産業：加工</text>
<text x="48" y="160">例：ワインにする</text>
<rect x="36" y="192" width="272" height="66" class="fas sa" stroke-width="1.5"/>
<text x="48" y="216" class="tb">3次産業：流通・販売</text>
<text x="48" y="240">例：ネット通販・直売所で売る</text>
<line x1="24" y1="42" x2="24" y2="248" class="l sa w3"/>
<line x1="24" y1="40" x2="34" y2="40" class="l sa w2"/>
<polyline points="28,43.3 34,40 28,36.7" class="l sa w2"/>
<line x1="24" y1="120" x2="34" y2="120" class="l sa w2"/>
<polyline points="28,123.3 34,120 28,116.7" class="l sa w2"/>
<line x1="24" y1="200" x2="34" y2="200" class="l sa w2"/>
<polyline points="28,203.3 34,200 28,196.7" class="l sa w2"/>
<text x="12" y="294" class="tb">生産物の価値を高めて、所得を上げる</text>
</svg>
