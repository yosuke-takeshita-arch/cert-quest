<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 854" role="img" aria-labelledby="fig-dx-case-types-t fig-dx-case-types-d">
<title id="fig-dx-case-types-t">DX事例の4つの型：マッチング・デジタル商材・リアル＋デジタル・リアル</title>
<desc id="fig-dx-case-types-d">公式シラバスが示すDX事例の4つの型を、デジタルの置き場所の違いで比べた図。マッチング・マーケットプレイス型（9章）は、参加者が持ち寄る分散したリソースを、場がつなぐ。集客から再取引までを一気通貫で設計し、取引コストを下げる。代表例はメルカリ、ココナラ。デジタル商材型（10章）は、提供・利用データ・改善をくり返し、提供後も改善が続く。使われ続ける前提で設計する。代表例はNotion、スタディサプリ。リアル＋デジタル融合型（11章）は、既存の顧客基盤・設備・業務データの上にデジタルを重ね、別事業にせず本業を再設計する。代表例は住友生命のVitality、Kubota Diagnostics。リアルビジネス型（12章）は、リアルの強みを主役に、デジタルは前面に出さず裏側で、在庫管理や商品開発、サプライチェーン、意思決定の速度向上に使う。代表例はZARA、成城石井。</desc>
<rect x="12" y="14" width="296" height="210" class="fas sa" stroke-width="1.5"/>
<text x="22" y="38" class="tb">09章　マッチング・マーケットプレイス</text>
<circle cx="36" cy="60" r="8" class="fs sa" stroke-width="1.5"/>
<circle cx="60" cy="78" r="8" class="fs sa" stroke-width="1.5"/>
<circle cx="36" cy="94" r="8" class="fs sa" stroke-width="1.5"/>
<circle cx="284" cy="60" r="8" class="fs sa" stroke-width="1.5"/>
<circle cx="260" cy="78" r="8" class="fs sa" stroke-width="1.5"/>
<circle cx="284" cy="94" r="8" class="fs sa" stroke-width="1.5"/>
<line x1="78" y1="78" x2="120" y2="78" class="l w2"/>
<polyline points="113,81.85 120,78 113,74.15" class="l w2"/>
<rect x="124" y="54" width="72" height="48" class="fs sa" stroke-width="1.5"/>
<text x="160" y="73.5" class="tb" text-anchor="middle">参加者を</text>
<text x="160" y="91.5" class="tb" text-anchor="middle">つなぐ場</text>
<line x1="240" y1="78" x2="200" y2="78" class="l w2"/>
<polyline points="207,74.15 200,78 207,81.85" class="l w2"/>
<text x="22" y="128">価値の源泉：参加者が持ち寄る</text>
<text x="22" y="147">分散したリソース</text>
<text x="22" y="166">ポイント：集客から再取引まで</text>
<text x="22" y="185">一気通貫で設計し、取引コストを下げる</text>
<text x="22" y="212" class="tb">例：メルカリ・ココナラ</text>
<rect x="12" y="232" width="296" height="191" class="fok sok" stroke-width="1.5"/>
<text x="22" y="256" class="tb">10章　デジタル商材</text>
<rect x="24" y="270" width="76" height="30" class="fs sok" stroke-width="1.5"/>
<text x="62" y="289.5" text-anchor="middle">提供</text>
<rect x="122" y="270" width="76" height="30" class="fs sok" stroke-width="1.5"/>
<text x="160" y="289.5" text-anchor="middle">利用データ</text>
<rect x="220" y="270" width="76" height="30" class="fs sok" stroke-width="1.5"/>
<text x="258" y="289.5" text-anchor="middle">改善</text>
<line x1="102" y1="285" x2="120" y2="285" class="l w2"/>
<polyline points="113,288.85 120,285 113,281.15" class="l w2"/>
<line x1="200" y1="285" x2="218" y2="285" class="l w2"/>
<polyline points="211,288.85 218,285 211,281.15" class="l w2"/>
<polyline points="258,302 258,321 62,321 62,308" class="l sok w2"/>
<polyline points="58,315 62,306 66,315" class="l sok w2"/>
<text x="160" y="315" class="tm" text-anchor="middle">くり返す</text>
<text x="22" y="346">価値の源泉：提供後も改善が続き、</text>
<text x="22" y="365">利用データが次の価値に生きる</text>
<text x="22" y="384">ポイント：使われ続ける前提で設計</text>
<text x="22" y="411" class="tb">例：Notion・スタディサプリ</text>
<rect x="12" y="431" width="296" height="191" class="fwn swn" stroke-width="1.5"/>
<text x="22" y="455" class="tb">11章　リアル＋デジタル融合</text>
<rect x="24" y="469" width="272" height="24" class="fas sa" stroke-width="1.5"/>
<text x="160" y="485.5" class="tb" text-anchor="middle">デジタルを上に重ねる</text>
<rect x="24" y="497" width="272" height="28" class="fs swn" stroke-width="1.5"/>
<text x="160" y="515.5" text-anchor="middle">既存のリアル（顧客基盤・設備・データ）</text>
<text x="22" y="545">価値の源泉：既存の顧客基盤・</text>
<text x="22" y="564">設備・業務データ</text>
<text x="22" y="583">ポイント：別事業にせず、本業を再設計</text>
<text x="22" y="610" class="tb">例：Vitality・Kubota Diagnostics</text>
<rect x="12" y="630" width="296" height="210" class="fs sm" stroke-width="1.5"/>
<text x="22" y="654" class="tb">12章　リアルビジネス</text>
<rect x="24" y="668" width="272" height="56" class="fbg sm" stroke-width="1.5"/>
<text x="34" y="701" class="tb">リアルの強み</text>
<rect x="150" y="678" width="136" height="36" class="fas sa dsh" stroke-width="1.5"/>
<text x="218" y="701" text-anchor="middle">デジタル（裏側）</text>
<text x="22" y="744">価値の源泉：在庫・商品開発・</text>
<text x="22" y="763">サプライチェーンなどリアルの強み</text>
<text x="22" y="782">ポイント：デジタルは前面に出さず、</text>
<text x="22" y="801">速度や体験の質を上げる</text>
<text x="22" y="828" class="tb">例：ZARA・成城石井</text>
</svg>
