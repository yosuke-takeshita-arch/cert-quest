<text x="271" y="163" text-anchor="middle">販売</text>
<text x="12" y="196" class="tb">ODM（受ける側）</text>
<text x="150" y="196" class="tm">設計から生産まで受ける</text>
<rect x="12" y="202" width="74" height="28" class="fa" stroke-width="1"/>
<text x="49" y="221" class="tb ton" text-anchor="middle">企画・設計</text>
<rect x="86" y="202" width="74" height="28" class="fa" stroke-width="1"/>
<text x="123" y="221" class="tb ton" text-anchor="middle">製造</text>
<rect x="160" y="202" width="74" height="28" class="fs sb" stroke-width="1"/>
