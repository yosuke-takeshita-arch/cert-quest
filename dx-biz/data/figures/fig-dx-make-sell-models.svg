<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 522" role="img" aria-labelledby="fig-dx-make-sell-models-t fig-dx-make-sell-models-d">
<title id="fig-dx-make-sell-models-t">つくり方と売り方のモデル：ファブレス・OEM・ODM・SPA・直販・受注生産</title>
<desc id="fig-dx-make-sell-models-d">企画・設計、製造、物流、販売の4つの段階のうち、どこをその会社が持つかを、モデルごとに塗り分けた図。ファブレスは、企画・設計と販売に集中し、製造は外部に委託する。OEMを受ける側は、製造だけを行い、相手先のブランドで販売される。ODMを受ける側は、設計から生産までを行い、委託者のブランドで販売される。SPAは、企画から生産・物流・販売までを1つの企業が一貫して管理する。直販は、卸や小売などの中間業者を通さず、メーカーが顧客に直接売る。下は、受注生産（MTO）と見込み生産（MTS）の順番の違い。MTOは注文を受けてから生産し、MTSは注文の前に作って在庫を持つ。</desc>
<rect x="12" y="14" width="18" height="14" class="fa"/>
<text x="36" y="26">その会社が持つ</text>
<rect x="150" y="14" width="18" height="14" class="fas sa" stroke-width="1"/>
<text x="174" y="26">外部に委託</text>
<rect x="12" y="38" width="18" height="14" class="fs sb" stroke-width="1"/>
<text x="36" y="50">対象外・指定なし（相手先など）</text>
<text x="12" y="80" class="tb">ファブレス</text>
<text x="150" y="80" class="tm">製造は外部に委託する</text>
