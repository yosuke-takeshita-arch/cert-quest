<text x="123" y="105" text-anchor="middle">製造</text>
<rect x="160" y="86" width="74" height="28" class="fs sb" stroke-width="1"/>
<text x="197" y="105" text-anchor="middle">物流</text>
<rect x="234" y="86" width="74" height="28" class="fa" stroke-width="1"/>
<text x="271" y="105" class="tb ton" text-anchor="middle">販売</text>
<text x="12" y="138" class="tb">OEM（受ける側）</text>
<text x="150" y="138" class="tm">相手先のブランドで作る</text>
