<rect x="234" y="202" width="74" height="28" class="fs sb" stroke-width="1"/>
<text x="271" y="221" text-anchor="middle">販売</text>
<text x="12" y="254" class="tb">SPA（製造小売）</text>
<text x="150" y="254" class="tm">企画から販売まで一貫管理</text>
