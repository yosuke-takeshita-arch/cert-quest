<rect x="64" y="436" width="76" height="30" class="fa" stroke-width="1"/>
<text x="102" y="456" class="tb ton" text-anchor="middle">生産</text>
<rect x="148" y="436" width="76" height="30" class="fs sb" stroke-width="1"/>
