<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 464" role="img" aria-labelledby="fig-dx-zara-cycle-t fig-dx-zara-cycle-d">
<title id="fig-dx-zara-cycle-t">店頭の売れ行きを素早く次の商品に生かす循環（SPA）</title>
<desc id="fig-dx-zara-cycle-d">輪の図。店頭の売れ行きと店舗・販売チームの声を、毎日本部に集める。本部のデザイナーが売上を分析して企画する。本社に近い地域の工場が短いロットで生産する。店と物流センターから商品を店に届け、店頭に並ぶ。店頭の売れ行きが、また本部に戻る。RFIDや統合在庫管理で、全ブランドの在庫を一つにまとめ、店のスタッフがどこにある商品でもすぐ探せる。ZARAを展開するインディテックスの年次報告書（2023年）の説明にもとづく。輪を速く回すほど、売れ残りと値下げが減る。</desc>
<text x="12" y="22" class="tb">売れ行きを、次の商品へ素早く生かす</text>
<rect x="12" y="32" width="264" height="50" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="53" class="tb">1　店頭</text>
<text x="24" y="72" class="tm">売れ行き・店舗の声</text>
<line x1="144" y1="84" x2="144" y2="94" class="l sa w2"/>
<polyline points="141.25,89 144,94 146.75,89" class="l sa w2"/>
<rect x="12" y="96" width="264" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="117" class="tb">2　本部に毎日集める</text>
<text x="24" y="136" class="tm">デザイナーが売上を分析</text>
<line x1="144" y1="148" x2="144" y2="158" class="l sa w2"/>
<polyline points="141.25,153 144,158 146.75,153" class="l sa w2"/>
<rect x="12" y="160" width="264" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="181" class="tb">3　企画する</text>
<text x="24" y="200" class="tm">顧客が望むものをつかむ</text>
<line x1="144" y1="212" x2="144" y2="222" class="l sa w2"/>
<polyline points="141.25,217 144,222 146.75,217" class="l sa w2"/>
<rect x="12" y="224" width="264" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="245" class="tb">4　短いロットで生産</text>
<text x="24" y="264" class="tm">本社に近い地域の工場</text>
<line x1="144" y1="276" x2="144" y2="286" class="l sa w2"/>
<polyline points="141.25,281 144,286 146.75,281" class="l sa w2"/>
<rect x="12" y="288" width="264" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="309" class="tb">5　店へ届ける</text>
<text x="24" y="328" class="tm">商品が店頭に並ぶ</text>
<line x1="276" y1="313" x2="304" y2="313" class="l sok w2"/>
<line x1="304" y1="313" x2="304" y2="57" class="l sok w2"/>
<line x1="304" y1="57" x2="278" y2="57" class="l sok w2"/>
<polyline points="285,53.15 278,57 285,60.85" class="l sok w2"/>
<rect x="12" y="356" width="296" height="56" class="fok sok" stroke-width="1.5"/>
<text x="160" y="378.5" class="tb" text-anchor="middle">RFID・統合在庫管理で在庫を1つに</text>
<text x="160" y="398.5" text-anchor="middle">スタッフがどこの商品でもすぐ探せる</text>
<text x="12" y="432">輪を速く回すほど、売れ残りと</text>
<text x="12" y="452" class="tb">値下げが減る</text>
</svg>
