<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" role="img" aria-labelledby="fig-dx-affiliate-royalty-t fig-dx-affiliate-royalty-d">
<title id="fig-dx-affiliate-royalty-t">アフィリエイトの成功報酬とフランチャイズのロイヤルティ：誰が誰に、何のために払うか</title>
<desc id="fig-dx-affiliate-royalty-d">2つのお金の流れを上下に並べた図。緑の太い矢印がお金の流れ。上はア アフィリエイト（成功報酬型広告。消費者庁の説明）。ブログなどの運営者（アフィリエイター）が、広告主の商品の広告やリンクを自分のサイトに載せる（1）。閲覧者がそのリンクから広告主の商品を買う（2）。あらかじめ決めた条件を満たしたとき、広告主が運営者に成功報酬を払う（3）。下はイ フランチャイズ（公正取引委員会の説明）。本部が加盟者に、商標・商号などを使う権利を与え、経営を指導する。加盟者はその対価として、本部に定期的にお金を払う。これがロイヤルティ。比べると、成功報酬は広告主から紹介した運営者へ、成果が出たときに払う。ロイヤルティは加盟者から本部へ、看板と指導の対価として定期的に払う。ロイヤルティ（royalty）は使用料の意味で、顧客の愛着を表すロイヤルティ（loyalty）とは別の言葉。</desc>
<text x="12" y="20" class="tb">誰が誰に、何のために払うか</text>
<text x="308" y="20" class="tok" text-anchor="end">緑の太い矢印＝お金</text>
<rect x="12" y="32" width="296" height="250" class="fas l sa"/>
<text x="24" y="54" class="tb">ア アフィリエイト（成功報酬型広告）</text>
<rect x="24" y="70" width="104" height="44" class="fs l sm"/>
<text x="76" y="97" text-anchor="middle">広告主</text>
<rect x="180" y="70" width="116" height="44" class="fs l sm"/>
<text x="238" y="89" text-anchor="middle">ブログなど</text>
<text x="238" y="107" text-anchor="middle">の運営者</text>
<rect x="110" y="170" width="100" height="40" class="fs l sm"/>
<text x="160" y="195" text-anchor="middle">閲覧者</text>
<line x1="128" y1="92" x2="180" y2="92" class="l sok w3"/>
<polyline points="174,87 180,92 174,97" class="l sok w3"/>
<text x="154" y="84" class="tok tb" text-anchor="middle">③</text>
<line x1="238" y1="114" x2="200" y2="170" class="l sa w2"/>
<polyline points="201,162 200,170 207,166" class="l sa w2"/>
<text x="246" y="148" class="ta">①</text>
<line x1="120" y1="170" x2="82" y2="114" class="l sa w2"/>
<polyline points="82,122 82,114 89,118" class="l sa w2"/>
<text x="62" y="148" class="ta">②</text>
<text x="24" y="232">① 運営者が広告・リンクを載せる</text>
<text x="24" y="250">② 閲覧者がそのリンクから買う</text>
<text x="24" y="270" class="tok tb">③ 条件を満たしたら、広告主が成功報酬</text>
<rect x="12" y="294" width="296" height="196" class="fok l sok"/>
<text x="24" y="316" class="tb">イ フランチャイズのロイヤルティ</text>
<rect x="110" y="328" width="100" height="40" class="fs l sm"/>
<text x="160" y="353" text-anchor="middle">本部</text>
<rect x="110" y="424" width="100" height="40" class="fs l sm"/>
<text x="160" y="449" text-anchor="middle">加盟者</text>
<line x1="130" y1="368" x2="130" y2="424" class="l sa w2"/>
<polyline points="126,418 130,424 134,418" class="l sa w2"/>
<text x="122" y="392" class="ta" text-anchor="end">商標・商号を</text>
<text x="122" y="410" class="ta" text-anchor="end">使う権利・指導</text>
<line x1="190" y1="424" x2="190" y2="368" class="l sok w3"/>
<polyline points="185,374 190,368 195,374" class="l sok w3"/>
<text x="198" y="392" class="tok tb">ロイヤルティ</text>
<text x="198" y="410" class="tok">（対価を定期的に）</text>
<text x="24" y="482" class="tm">加盟者は、それぞれ独立した事業者</text>
<text x="12" y="514" class="tb">お金の向きで比べる</text>
<text x="12" y="536">成功報酬：広告主 → 紹介した運営者</text>
<text x="12" y="554" class="tm">　（成果が出たときだけ）</text>
<text x="12" y="576">ロイヤルティ：加盟者 → 本部</text>
<text x="12" y="594" class="tm">　（看板と指導の対価。定期的に）</text>
</svg>
