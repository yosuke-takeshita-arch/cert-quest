<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 456" role="img" aria-labelledby="fig-dx-agile-t fig-dx-agile-d">
<title id="fig-dx-agile-t">ウォーターフォールとアジャイル（スクラム）</title>
<desc id="fig-dx-agile-d">上：ウォーターフォール型。最初に全部決めて、要件定義、設計、実装、テスト、リリースの順に作るので、途中の変化に追いつきにくい。下：アジャイル開発（スクラムなど）。大きなゴールをチームで共有し、実装からテストまでをスプリントと呼ぶ短い期間で行い、小さく作って見せ、反応を見て直すことを繰り返す。スプリントを重ねるごとに、動く小さな機能が増えていく。</desc>
<text x="12" y="22" class="tb">ウォーターフォール型：順に作る</text>
<rect x="12" y="34" width="100" height="24" class="fas sa" stroke-width="1.5"/>
<text x="62" y="50.5" text-anchor="middle">要件定義</text>
<rect x="58" y="62" width="100" height="24" class="fas sa" stroke-width="1.5"/>
<text x="108" y="78.5" text-anchor="middle">設計</text>
<rect x="104" y="90" width="100" height="24" class="fas sa" stroke-width="1.5"/>
<text x="154" y="106.5" text-anchor="middle">実装</text>
<rect x="150" y="118" width="100" height="24" class="fas sa" stroke-width="1.5"/>
<text x="200" y="134.5" text-anchor="middle">テスト</text>
<rect x="196" y="146" width="100" height="24" class="fa" stroke-width="1.5"/>
<text x="246" y="162.5" class="ton" text-anchor="middle">リリース</text>
<text x="12" y="192">最初に全部決めて、順に進める</text>
<text x="12" y="212" class="tm">途中の変化には追いつきにくい</text>
<line x1="12" y1="234" x2="308" y2="234" class="l sb w1"/>
<text x="12" y="256" class="tb">アジャイル：小さく作って繰り返す</text>
<rect x="12" y="272" width="84" height="34" class="fa"/>
<text x="54" y="294" class="tb ton" text-anchor="middle">スプリント1</text>
<rect x="106" y="272" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="135" y="293.5" text-anchor="middle">動く機能</text>
<rect x="12" y="318" width="84" height="34" class="fa"/>
<text x="54" y="340" class="tb ton" text-anchor="middle">スプリント2</text>
<rect x="106" y="318" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="135" y="339.5" text-anchor="middle">動く機能</text>
<rect x="172" y="318" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="201" y="339.5" text-anchor="middle">動く機能</text>
<rect x="12" y="364" width="84" height="34" class="fa"/>
<text x="54" y="386" class="tb ton" text-anchor="middle">スプリント3</text>
<rect x="106" y="364" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="135" y="385.5" text-anchor="middle">動く機能</text>
<rect x="172" y="364" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="201" y="385.5" text-anchor="middle">動く機能</text>
<rect x="238" y="364" width="58" height="34" class="fok sok" stroke-width="1.5"/>
<text x="267" y="385.5" text-anchor="middle">動く機能</text>
<text x="12" y="424">各スプリントで、小さく作る → 見せる</text>
<text x="12" y="444">→ 反応を見て直す。これを繰り返す</text>
</svg>
