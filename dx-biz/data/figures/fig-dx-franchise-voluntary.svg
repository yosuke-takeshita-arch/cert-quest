<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 382" role="img" aria-labelledby="fig-dx-franchise-voluntary-t fig-dx-franchise-voluntary-d">
<title id="fig-dx-franchise-voluntary-t">フランチャイズとボランタリーチェーン</title>
<desc id="fig-dx-franchise-voluntary-d">上：フランチャイズは縦の関係。本部が上、加盟店が下。本部は加盟店に、特定の商標・商号を使う権利を与え、事業について統一的な方法で統制・指導・援助を行う。加盟店は、その対価を本部に支払う。加盟店はそれぞれ独立した事業者。下：ボランタリーチェーンは横の関係。資本的に独立した店どうしが、それぞれの経営の独立を保ったまま、共同の組織をつくり、仕入れ・販売・商品企画などを一元的に行う。フランチャイズのように本部が商標を貸して統制するのではない。</desc>
<text x="12" y="22" class="tb">フランチャイズ：縦の関係</text>
<rect x="78" y="28" width="164" height="40" class="fa" stroke-width="1.5"/>
<text x="160" y="52.5" class="tb ton" text-anchor="middle">本部</text>
<line x1="60" y1="72" x2="60" y2="120" class="l sa w2"/>
<polyline points="56.15,113 60,120 63.85,113" class="l sa w2"/>
<text x="72" y="90">商標の使用権・統制・</text>
<text x="72" y="110">指導・援助</text>
<line x1="262" y1="120" x2="262" y2="72" class="l sok w2"/>
<polyline points="265.85,79 262,72 258.15,79" class="l sok w2"/>
<rect x="12" y="124" width="92" height="38" class="fas sa" stroke-width="1.5"/>
<text x="58" y="147.5" text-anchor="middle">加盟店A</text>
<rect x="114" y="124" width="92" height="38" class="fas sa" stroke-width="1.5"/>
<text x="160" y="147.5" text-anchor="middle">加盟店B</text>
<rect x="216" y="124" width="92" height="38" class="fas sa" stroke-width="1.5"/>
<text x="262" y="147.5" text-anchor="middle">加盟店C</text>
<text x="160" y="186" text-anchor="middle">対価（上向きの矢印）を本部に払う</text>
<line x1="12" y1="200" x2="308" y2="200" class="l sb w1"/>
<text x="12" y="222" class="tb">ボランタリーチェーン：横の関係</text>
<rect x="12" y="236" width="92" height="38" class="fok sok" stroke-width="1.5"/>
<text x="58" y="259.5" text-anchor="middle">A店</text>
<rect x="114" y="236" width="92" height="38" class="fok sok" stroke-width="1.5"/>
<text x="160" y="259.5" text-anchor="middle">B店</text>
<rect x="216" y="236" width="92" height="38" class="fok sok" stroke-width="1.5"/>
<text x="262" y="259.5" text-anchor="middle">C店</text>
<line x1="58" y1="302" x2="58" y2="276" class="l sok w2"/>
<polyline points="61.3,282 58,276 54.7,282" class="l sok w2"/>
<line x1="160" y1="302" x2="160" y2="276" class="l sok w2"/>
<polyline points="163.3,282 160,276 156.7,282" class="l sok w2"/>
<line x1="262" y1="302" x2="262" y2="276" class="l sok w2"/>
<polyline points="265.3,282 262,276 258.7,282" class="l sok w2"/>
<rect x="12" y="304" width="296" height="44" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="321" class="tb" text-anchor="middle">共同の組織</text>
<text x="160" y="340" text-anchor="middle">仕入れ・販売・商品企画を一元的に</text>
<text x="12" y="370">各店は、それぞれの店名と経営の独立を保つ</text>
</svg>
