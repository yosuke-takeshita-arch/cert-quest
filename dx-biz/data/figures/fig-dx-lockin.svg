<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="fig-dx-lockin-t fig-dx-lockin-d">
<title id="fig-dx-lockin-t">ロックインの7つの型とスイッチング・コスト</title>
<desc id="fig-dx-lockin-d">長期間同じ財やサービスを使うことで、乗り換えにかかるコスト（スイッチング・コスト）が高まり、他に乗り換えにくくなる状態がロックイン。公式シラバスは、インティマシー、コンビニエンス、ラーニング、メンバーシップ、コミュニティ、シリーズ、ブランドの7つの型を挙げる。ラーニングは、覚えた使い方を覚え直す手間。コンビニエンスは、登録済みの情報などを入れ直す手間。メンバーシップは、ためたポイントや会員ランクを失うこと。シリーズは、同じシリーズの連携が使えなくなること。インティマシー、コミュニティ、ブランドは、公式シラバスの型の名前で、説明は確認できていない。</desc>
<rect x="12" y="14" width="296" height="62" class="fa" stroke-width="1.5"/>
<text x="160" y="38.5" class="tb ton" text-anchor="middle">スイッチング・コスト</text>
<text x="160" y="60.5" class="ton" text-anchor="middle">乗り換えにかかるコスト</text>
<line x1="40" y1="94" x2="40" y2="78" class="l sa w2"/>
<polyline points="43.3,84 40,78 36.7,84" class="l sa w2"/>
<text x="60" y="96" class="tm">重いほど、乗り換えにくい</text>
<text x="12" y="126" class="tb">7つの型（公式シラバス）</text>
<rect x="12" y="136" width="296" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="158" class="tb">ラーニング</text>
<text x="24" y="177">覚えた使い方を、覚え直す手間</text>
<rect x="12" y="192" width="296" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="214" class="tb">コンビニエンス</text>
<text x="24" y="233">登録済みの情報を、入れ直す手間</text>
<rect x="12" y="248" width="296" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="270" class="tb">メンバーシップ</text>
<text x="24" y="289">ためたポイント・ランクを失う</text>
<rect x="12" y="304" width="296" height="50" class="fas sa" stroke-width="1.5"/>
<text x="24" y="326" class="tb">シリーズ</text>
<text x="24" y="345">同じシリーズの連携が使えなくなる</text>
<rect x="12" y="360" width="296" height="50" class="fs sm" stroke-width="1.5"/>
<text x="24" y="382" class="tb">インティマシー</text>
<text x="24" y="401" class="tm">型の名前のみ。説明は確認できていません</text>
<rect x="12" y="416" width="296" height="50" class="fs sm" stroke-width="1.5"/>
<text x="24" y="438" class="tb">コミュニティ</text>
<text x="24" y="457" class="tm">型の名前のみ。説明は確認できていません</text>
<rect x="12" y="472" width="296" height="50" class="fs sm" stroke-width="1.5"/>
<text x="24" y="494" class="tb">ブランド</text>
<text x="24" y="513" class="tm">型の名前のみ。説明は確認できていません</text>
</svg>
