<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 638" role="img" aria-labelledby="fig-dx-modular-layer-t fig-dx-modular-layer-d">
<title id="fig-dx-modular-layer-t">垂直統合とレイヤー化、モジュール化</title>
<desc id="fig-dx-modular-layer-d">上：垂直統合。端末・通信・プラットフォーム・コンテンツ（アプリ）の4つの層を、1つの会社が縦に全部持つ。従来型の携帯インターネットでは、端末の購入もサイトへのアクセスも代金の支払いも通信事業者経由だった。中：レイヤー化。同じ4つの層が横に切れ、各層で別々の会社が競争・協調する。パソコンでは、端末・通信・サービスを利用者が別々に選ぶ。下：モジュール化。部品どうしのつなぎ方（インターフェース）を規格にすると、部品を組み立てるだけで細かな調整なしに完成品ができる。パソコンは市販の部品を集めて組み立てれば個人でも作れる。</desc>
<text x="12" y="22" class="tb">垂直統合：1社が全部の層を持つ</text>
<rect x="12" y="32" width="296" height="166" class="fs swn" stroke-width="2.5"/>
<text x="24" y="52" class="tb">1つの会社</text>
<rect x="24" y="62" width="272" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="81.5" text-anchor="middle">端末</text>
<rect x="24" y="96" width="272" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="115.5" text-anchor="middle">通信</text>
<rect x="24" y="130" width="272" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="149.5" text-anchor="middle">プラットフォーム</text>
<rect x="24" y="164" width="272" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="183.5" text-anchor="middle">コンテンツ・アプリ</text>
<line x1="12" y1="212" x2="308" y2="212" class="l sb w1"/>
<text x="12" y="230" class="tb">レイヤー化：層ごとに別の会社が競う</text>
<rect x="12" y="240" width="296" height="36" class="fs sb" stroke-width="1"/>
<text x="24" y="263" class="tb">端末</text>
<rect x="176" y="244" width="60" height="28" class="fas sa" stroke-width="1.5"/>
<text x="206" y="262.5" text-anchor="middle">A社</text>
<rect x="244" y="244" width="56" height="28" class="fok sok" stroke-width="1.5"/>
<text x="272" y="262.5" text-anchor="middle">B社</text>
<rect x="12" y="280" width="296" height="36" class="fs sb" stroke-width="1"/>
<text x="24" y="303" class="tb">通信</text>
<rect x="176" y="284" width="60" height="28" class="fas sa" stroke-width="1.5"/>
<text x="206" y="302.5" text-anchor="middle">C社</text>
<rect x="244" y="284" width="56" height="28" class="fok sok" stroke-width="1.5"/>
<text x="272" y="302.5" text-anchor="middle">D社</text>
<rect x="12" y="320" width="296" height="36" class="fs sb" stroke-width="1"/>
<text x="24" y="343" class="tb">プラットフォーム</text>
<rect x="176" y="324" width="60" height="28" class="fas sa" stroke-width="1.5"/>
<text x="206" y="342.5" text-anchor="middle">E社</text>
<rect x="244" y="324" width="56" height="28" class="fok sok" stroke-width="1.5"/>
<text x="272" y="342.5" text-anchor="middle">F社</text>
<rect x="12" y="360" width="296" height="36" class="fs sb" stroke-width="1"/>
<text x="24" y="383" class="tb">コンテンツ</text>
<rect x="176" y="364" width="60" height="28" class="fas sa" stroke-width="1.5"/>
<text x="206" y="382.5" text-anchor="middle">G社</text>
<rect x="244" y="364" width="56" height="28" class="fok sok" stroke-width="1.5"/>
<text x="272" y="382.5" text-anchor="middle">H社</text>
<text x="12" y="420">利用者が、層ごとに選ぶ（例：パソコン）</text>
<line x1="12" y1="436" x2="308" y2="436" class="l sb w1"/>
<text x="12" y="458" class="tb">モジュール化：つなぎ方を規格にする</text>
<rect x="12" y="470" width="92" height="40" class="fas sa" stroke-width="1.5"/>
<text x="58" y="494.5" text-anchor="middle">部品A</text>
<line x1="58" y1="510" x2="58" y2="532" class="l sa w2"/>
<polyline points="54.7,526 58,532 61.3,526" class="l sa w2"/>
<rect x="114" y="470" width="92" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="494.5" text-anchor="middle">部品B</text>
<line x1="160" y1="510" x2="160" y2="532" class="l sa w2"/>
<polyline points="156.7,526 160,532 163.3,526" class="l sa w2"/>
<rect x="216" y="470" width="92" height="40" class="fas sa" stroke-width="1.5"/>
<text x="262" y="494.5" text-anchor="middle">部品C</text>
<line x1="262" y1="510" x2="262" y2="532" class="l sa w2"/>
<polyline points="258.7,526 262,532 265.3,526" class="l sa w2"/>
<rect x="12" y="532" width="296" height="4" class="fwn swn" stroke-width="1"/>
<text x="160" y="552" class="tb" text-anchor="middle">規格化されたつなぎ目</text>
<rect x="12" y="564" width="296" height="40" class="fok sok" stroke-width="1.5"/>
<text x="160" y="579.5" class="tb" text-anchor="middle">組み立てるだけで完成品</text>
<text x="160" y="597.5" text-anchor="middle">（細かな調整は要らない）</text>
<text x="12" y="626" class="tb">すり合わせの一体型 → モジュール化</text>
</svg>
