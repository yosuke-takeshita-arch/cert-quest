<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 356" role="img" aria-labelledby="fig-dx-auv-common-base-t fig-dx-auv-common-base-d">
<title id="fig-dx-auv-common-base-t">AUVの土台（基本ソフト・部品・インタフェース）はそろえ、上位のソフトで各社が競う</title>
<desc id="fig-dx-auv-common-base-d">何のための図か：総合海洋政策本部のAUV（自律型無人探査機）戦略が示す、共通にする部分と各社が競う部分の分け方を見る。下の段は共通の土台で、航行制御・外部通信などの基本ソフトウェア、インタフェース、各種部品、制御ボード、運用手法。共通化・標準化すると規模の利点（スケールメリット）が生まれ、部品やソフトのメーカーが新たに参入しやすくなる。インタフェース規格はオープンにできる情報を公開して参入を促す。上の段は各社が独自性で競う部分で、自律行動などの上位のソフトウェアは共通化とは別に開発を進める。全部を1つの設計にそろえたり、1社の仕様に閉じたりするのではない。</desc>
<text x="12" y="20" class="tb">土台はそろえ、上物で競う</text>
<text x="12" y="42" class="tm">AUV（自律型無人探査機）戦略の考え方</text>
<rect x="12" y="56" width="92" height="58" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="58" y="72" text-anchor="middle" class="tb">A社</text>
<text x="58" y="90" text-anchor="middle" class="tm">自律行動など</text>
<text x="58" y="108" text-anchor="middle" class="tm">上位のソフト</text>
<rect x="114" y="56" width="92" height="58" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="160" y="72" text-anchor="middle" class="tb">B社</text>
<text x="160" y="90" text-anchor="middle" class="tm">自律行動など</text>
<text x="160" y="108" text-anchor="middle" class="tm">上位のソフト</text>
<rect x="216" y="56" width="92" height="58" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="262" y="72" text-anchor="middle" class="tb">C社</text>
<text x="262" y="90" text-anchor="middle" class="tm">自律行動など</text>
<text x="262" y="108" text-anchor="middle" class="tm">上位のソフト</text>
<text x="160" y="132" class="tb ta" text-anchor="middle">↑ 各社が独自性で競う部分</text>
<rect x="12" y="144" width="296" height="78" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="170" text-anchor="middle" class="tb tok">共通の土台（そろえる）</text>
<text x="160" y="188" text-anchor="middle">基本ソフト（航行制御・外部通信）</text>
<text x="160" y="206" text-anchor="middle">インタフェース・部品・制御ボード・運用手法</text>
<text x="12" y="248" class="tb">そろえると</text>
<text x="12" y="266" class="tm">・規模の利点（スケールメリット）が生まれる</text>
<text x="12" y="284" class="tm">・部品やソフトのメーカーが参入しやすい</text>
<text x="12" y="302" class="tm">・接続口の規格は、公開できる情報を公開</text>
<text x="12" y="324" class="tm tng">× 上位のソフトまで全部そろえる → 競う所が無い</text>
<text x="12" y="342" class="tm tng">× 1社の仕様に閉じる → 新しい参入が増えない</text>
</svg>
