<text x="204" y="408" class="ton tb" text-anchor="middle">事業者</text>
<rect x="240" y="386" width="64" height="32" class="fa sa" stroke-width="1.5"/>
<text x="272" y="408" class="ton tb" text-anchor="middle">事業者</text>
<text x="12" y="437">CPU・ストレージ・</text>
<text x="12" y="453">ネットワーク</text>
<rect x="104" y="422" width="64" height="32" class="fa sa" stroke-width="1.5"/>
<text x="136" y="444" class="ton tb" text-anchor="middle">事業者</text>
<rect x="172" y="422" width="64" height="32" class="fa sa" stroke-width="1.5"/>
<text x="204" y="444" class="ton tb" text-anchor="middle">事業者</text>
<rect x="240" y="422" width="64" height="32" class="fa sa" stroke-width="1.5"/>
<text x="272" y="444" class="ton tb" text-anchor="middle">事業者</text>
<text x="12" y="482" class="tm">濃い所＝事業者が用意。白い所＝利用者が用意</text>
</svg>
