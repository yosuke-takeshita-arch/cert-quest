<text x="272" y="336" class="ton tb" text-anchor="middle">事業者</text>
<text x="12" y="365">基本機能・</text>
<text x="12" y="381">開発環境など</text>
<rect x="104" y="350" width="64" height="32" class="fs sb" stroke-width="1.5"/>
