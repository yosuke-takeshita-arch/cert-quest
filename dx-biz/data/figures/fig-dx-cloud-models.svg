<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 494" role="img" aria-labelledby="fig-dx-cloud-models-t fig-dx-cloud-models-d">
<title id="fig-dx-cloud-models-t">オンプレミスとクラウド：ハイブリッドクラウドとマルチクラウド、IaaS・PaaS・SaaS</title>
<desc id="fig-dx-cloud-models-d">オンプレミスは自社で設備を持って運用する形、クラウドはネットワーク経由で必要なときに必要な分だけ借りる形。ハイブリッドクラウドは、オンプレミス（またはプライベートクラウド）とパブリッククラウドを組み合わせる使い方。マルチクラウドは、複数のパブリッククラウドを組み合わせる使い方。クラウドの提供形態は、IaaSがCPU・ストレージ・ネットワークなどの基礎的なリソースを提供し利用者がOSから構築する、PaaSがIaaSに加えOS・基本的機能・開発環境や運用管理環境も提供する、SaaSが業務アプリケーションなどの機能を提供する。</desc>
<text x="12" y="22" class="tb">ハイブリッドクラウド</text>
<rect x="12" y="32" width="126" height="54" class="fs sa" stroke-width="1.5"/>
<text x="75" y="54" class="tb" text-anchor="middle">オンプレミス</text>
<text x="75" y="73" text-anchor="middle">（自社で持つ）</text>
<rect x="182" y="32" width="126" height="54" class="fas sa" stroke-width="1.5"/>
<text x="245" y="54" class="tb" text-anchor="middle">パブリック</text>
<text x="245" y="73" text-anchor="middle">クラウド</text>
<line x1="144" y1="59" x2="176" y2="59" class="l sa w2"/>
<polyline points="169,62.85 176,59 169,55.15" class="l sa w2"/>
<line x1="176" y1="59" x2="144" y2="59" class="l sa w2"/>
<polyline points="151,55.15 144,59 151,62.85" class="l sa w2"/>
<text x="12" y="106">自社の設備と、借りるクラウドを組み合わせる</text>
<line x1="12" y1="126" x2="308" y2="126" class="l sb w1"/>
<text x="12" y="148" class="tb">マルチクラウド</text>
<rect x="12" y="162" width="92" height="54" class="fas sa" stroke-width="1.5"/>
<text x="58" y="184" class="tb" text-anchor="middle">パブリック</text>
<text x="58" y="203" text-anchor="middle">クラウドA</text>
<rect x="114" y="162" width="92" height="54" class="fas sa" stroke-width="1.5"/>
<text x="160" y="184" class="tb" text-anchor="middle">パブリック</text>
<text x="160" y="203" text-anchor="middle">クラウドB</text>
<rect x="216" y="162" width="92" height="54" class="fas sa" stroke-width="1.5"/>
<text x="262" y="184" class="tb" text-anchor="middle">パブリック</text>
<text x="262" y="203" text-anchor="middle">クラウドC</text>
<line x1="104" y1="189" x2="112" y2="189" class="l sa w2"/>
<polyline points="107,191.75 112,189 107,186.25" class="l sa w2"/>
<line x1="206" y1="189" x2="214" y2="189" class="l sa w2"/>
<polyline points="209,191.75 214,189 209,186.25" class="l sa w2"/>
<text x="12" y="236">複数のパブリッククラウドを組み合わせる</text>
<line x1="12" y1="256" x2="308" y2="256" class="l sb w1"/>
<text x="12" y="278" class="tb">提供形態：どこまで事業者が用意するか</text>
<rect x="12" y="294" width="56" height="65" class="fa"/>
<text x="40" y="330.5" class="tb ton" text-anchor="middle">IaaS</text>
<text x="78" y="312">CPU・ストレージ・</text>
<text x="78" y="331">ネットワークを借りる</text>
<text x="78" y="350">OSから上は利用者が構築</text>
<rect x="12" y="367" width="56" height="65" class="fa"/>
<text x="40" y="403.5" class="tb ton" text-anchor="middle">PaaS</text>
<text x="78" y="385">IaaSに加えて、OS・</text>
<text x="78" y="404">基本的機能・開発環境・</text>
<text x="78" y="423">運用管理環境も提供される</text>
<rect x="12" y="440" width="56" height="46" class="fa"/>
<text x="40" y="467" class="tb ton" text-anchor="middle">SaaS</text>
<text x="78" y="458">業務アプリなどの機能を、</text>
<text x="78" y="477">そのまま利用する</text>
</svg>
