<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 358" role="img" aria-labelledby="fig-dx-lead-t fig-dx-lead-d">
<title id="fig-dx-lead-t">リードジェネレーションとリードナーチャリング</title>
<desc id="fig-dx-lead-d">じょうご（ファネル）の図。上の段は、リードジェネレーション。展示会・資料ダウンロード・セミナーなどで、見込み客（リード）の連絡先を集める。中の段は、リードナーチャリング。導入事例や使い方のメールなどで、関係を続けて関心を高め、育てる。下の段は、購入の意欲が高まった人を営業に渡し、営業が接触する。順番は、集める、育てる、選ぶ、売る。リードジェネレーションは営業プロセスの入り口で、リードナーチャリングはその次の段階。</desc>
<text x="12" y="22" class="tb">見込み客を、じょうごのように絞り込む</text>
<rect x="12" y="36" width="296" height="84" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="60" class="tb" text-anchor="middle">集める：リードジェネレーション</text>
<text x="160" y="82" text-anchor="middle">展示会・資料ダウンロード・</text>
<text x="160" y="100" text-anchor="middle">セミナーで連絡先を集める</text>
<rect x="32" y="126" width="256" height="84" class="fas sa" stroke-width="1.5"/>
<text x="160" y="150" class="tb" text-anchor="middle">育てる：リードナーチャリング</text>
<text x="160" y="172" text-anchor="middle">事例・使い方のメールなどで、</text>
<text x="160" y="190" text-anchor="middle">関心を高める</text>
<rect x="52" y="216" width="216" height="84" class="fok sok" stroke-width="1.5"/>
<text x="160" y="240" class="tb" text-anchor="middle">選んで渡す</text>
<text x="160" y="262" text-anchor="middle">購入の意欲が高まった人を</text>
<text x="160" y="280" text-anchor="middle">営業に渡す</text>
<rect x="72" y="306" width="176" height="44" class="fa" stroke-width="1.5"/>
<text x="160" y="334" class="tb ton" text-anchor="middle">売る：営業が接触する</text>
</svg>
