<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 352" role="img" aria-labelledby="fig-dx-edge-cloud-iot-t fig-dx-edge-cloud-iot-d">
<title id="fig-dx-edge-cloud-iot-t">IoT・エッジコンピューティング・クラウドの位置関係</title>
<desc id="fig-dx-edge-cloud-iot-d">3層の図。下の層はモノ（センサー、カメラ、RFタグ、GPS）で、データを集める。中の層はエッジで、利用者や機器の近くにあるサーバー。近くで処理するので遅延が小さい。上の層はクラウドで、遠くのデータセンターで集中して処理する。データは下から上へ流れる。基本はクラウドで処理し、迅速な処理が要るところだけエッジで行うなど、組み合わせて使う。M2Mはモノ（機器）どうしが人を介さずにやり取りする通信で、IoTはモノがセンサーと無線通信でインターネットにつながること。</desc>
<rect x="12" y="14" width="296" height="62" class="fas sa" stroke-width="1.5"/>
<text x="160" y="30.5" class="tb" text-anchor="middle">クラウド</text>
<text x="160" y="49.5" text-anchor="middle">遠くのデータセンター</text>
<text x="160" y="68.5" text-anchor="middle">集中して処理する</text>
<line x1="40" y1="116" x2="40" y2="76" class="l sa w2"/>
<polyline points="43.85,83 40,76 36.15,83" class="l sa w2"/>
<text x="56" y="101" class="tm">データ</text>
<rect x="12" y="116" width="296" height="62" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="132.5" class="tb" text-anchor="middle">エッジ</text>
<text x="160" y="151.5" text-anchor="middle">利用者や機器の近くのサーバー</text>
<text x="160" y="170.5" text-anchor="middle">近くで処理するので遅延が小さい</text>
<line x1="40" y1="218" x2="40" y2="178" class="l sa w2"/>
<polyline points="43.85,185 40,178 36.15,185" class="l sa w2"/>
<text x="56" y="203" class="tm">データ</text>
<text x="12" y="238" class="tb">IoT：モノがネットにつながる</text>
<rect x="12" y="248" width="68" height="38" class="fok sok" stroke-width="1.5"/>
<text x="46" y="271.5" text-anchor="middle">センサー</text>
<rect x="88" y="248" width="68" height="38" class="fok sok" stroke-width="1.5"/>
<text x="122" y="271.5" text-anchor="middle">カメラ</text>
<rect x="164" y="248" width="68" height="38" class="fok sok" stroke-width="1.5"/>
<text x="198" y="271.5" text-anchor="middle">RFタグ</text>
<rect x="240" y="248" width="68" height="38" class="fok sok" stroke-width="1.5"/>
<text x="274" y="271.5" text-anchor="middle">GPS</text>
<line x1="46" y1="304" x2="118" y2="304" class="l sok w2"/>
<polyline points="111,307.85 118,304 111,300.15" class="l sok w2"/>
<line x1="118" y1="304" x2="46" y2="304" class="l sok w2"/>
<polyline points="53,300.15 46,304 53,307.85" class="l sok w2"/>
<text x="132" y="309" class="tb">M2M：機器と機器の通信</text>
<text x="12" y="340" class="tm">エッジとクラウドは組み合わせて使う</text>
</svg>
