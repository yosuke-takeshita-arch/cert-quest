<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 676" role="img" aria-labelledby="fig-dx-wp2023-japan-us-t fig-dx-wp2023-japan-us-d">
<title id="fig-dx-wp2023-japan-us-t">DX白書2023：日本企業のDXの現状（日米の比較）</title>
<desc id="fig-dx-wp2023-japan-us-d">IPAのDX白書2023の日米調査の数字を、横棒グラフで描いた図。棒の長さは割合（%）。青い棒が日本、灰色の棒が米国。上：DXに取り組んでいる企業の割合。日本は2021年度調査の55.8%から2022年度調査の69.3%に増え、2022年度調査の米国の77.9%に近づいた。中：DXの取組で成果が出ている企業に、取組の中身ごとに成果が出ている割合（すでに十分な成果、またはある程度の成果）を聞いた結果。デジタイゼーションやデジタライゼーションに当たるデータのデジタル化や業務の効率化では、日本は約80%で米国と差がない。トランスフォーメーションに当たる新規製品・サービスの創出は日本24.8%、米国66.8%。顧客起点の価値創出によるビジネスモデルの根本的な変革は日本21.5%、米国71.3%。下：白書のまとめ。日本企業はデジタイゼーションやデジタライゼーションの領域では成果があがっているが、トランスフォーメーションのレベルの成果創出は不十分で、本来の目的の変革に向けてさらなる取組の深化が必要。日本が変革のレベルで米国を上回っている、という説明は誤り。</desc>
<text x="12" y="20" class="tb">DX白書2023：日本企業のDXの現状</text>
<text x="12" y="40" class="tm">横棒グラフ。棒の長さ＝割合（%）</text>
<rect x="12" y="50" width="14" height="12" class="fas l sa"/>
<text x="32" y="61" class="tm">日本</text>
<rect x="80" y="50" width="14" height="12" class="fm"/>
<text x="100" y="61" class="tm">米国</text>
<line x1="12" y1="74" x2="308" y2="74" class="l sb w1"/>
<text x="12" y="96" class="tb">DXに取り組む企業の割合</text>
<text x="12" y="122">日本 2021年度</text>
<rect x="110" y="110" width="100" height="16" class="fas l sa"/>
<text x="216" y="123">55.8%</text>
<text x="12" y="148">日本 2022年度</text>
<rect x="110" y="136" width="125" height="16" class="fas l sa"/>
<text x="241" y="149">69.3%</text>
<text x="12" y="174">米国 2022年度</text>
<rect x="110" y="162" width="140" height="16" class="fm"/>
<text x="256" y="175">77.9%</text>
<text x="12" y="200" class="tok">→ 日本は増えて、米国に近づいた</text>
<line x1="12" y1="214" x2="308" y2="214" class="l sb w1"/>
<text x="12" y="236" class="tb">成果が出ている割合（中身ごと）</text>
<text x="12" y="254" class="tm">DXで成果が出ている企業に聞いた結果</text>
<text x="12" y="272" class="tm">①デジタイゼーション ②デジタライゼー</text>
<text x="12" y="290" class="tm">ション ③トランスフォーメーションに当たる</text>
<text x="12" y="316">①② データのデジタル化・業務の効率化</text>
<rect x="110" y="326" width="144" height="16" class="fas l sa"/>
<text x="12" y="339">日本</text>
<text x="260" y="339">約80%</text>
<text x="12" y="362" class="tok">→ 米国と差がない</text>
<text x="12" y="390">③ 新規製品・サービスの創出</text>
<text x="12" y="413">日本</text>
<rect x="110" y="400" width="45" height="16" class="fas l sa"/>
<text x="161" y="413">24.8%</text>
<text x="12" y="437">米国</text>
<rect x="110" y="424" width="120" height="16" class="fm"/>
<text x="236" y="437">66.8%</text>
<text x="12" y="466">③ ビジネスモデルの根本的な変革</text>
<text x="12" y="489">日本</text>
<rect x="110" y="476" width="39" height="16" class="fas l sa"/>
<text x="155" y="489">21.5%</text>
<text x="12" y="513">米国</text>
<rect x="110" y="500" width="128" height="16" class="fm"/>
<text x="244" y="513">71.3%</text>
<text x="12" y="538" class="tng">→ 日本は20%台、米国は約70%で大きな差</text>
<line x1="12" y1="552" x2="308" y2="552" class="l sb w1"/>
<text x="12" y="574" class="tb">白書のまとめ</text>
<text x="12" y="596">①デジタイゼーション・②デジタライゼー</text>
<text x="12" y="614">ションは成果あり。③トランスフォーメー</text>
<text x="12" y="632">ションの成果は不十分。取組の深化が必要</text>
<text x="12" y="662" class="tng">✕ 変革のレベルで、すでに米国を上回る（誤り）</text>
</svg>
