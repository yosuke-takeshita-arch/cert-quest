<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" role="img" aria-labelledby="fig-dx-kotter-8-steps-t fig-dx-kotter-8-steps-d">
<title id="fig-dx-kotter-8-steps-t">チェンジマネジメント：コッターの8段階</title>
<desc id="fig-dx-kotter-8-steps-d">上から順に8つの段階を進む。1 危機感を高める（機会への切迫感）。2 推進チームをつくる（推進の連合）。3 ビジョンを示す（戦略的なビジョン）。4 賛同者を集める。5 障害を取り除き、行動できるようにする。6 短期の成果を早く何度も示す。7 加速する（最初の成功で増した信頼を使い、仕組み・構造・方針を改める）。8 定着させる（新しい行動が古い習慣に置き換わるまで）。システムや制度を変えても、人の行動が変わらなければ成果にならないので、元に戻らないところまで進める。</desc>
<text x="12" y="22" class="tb">上から順に、8つの段階を進める</text>
<line x1="26" y1="70" x2="26" y2="396" class="l sm w1"/>
<circle cx="26" cy="70" r="13" class="fa"/>
<text x="26" y="74.5" class="tb ton" text-anchor="middle">1</text>
<text x="50" y="66" class="tb">危機感を高める</text>
<text x="50" y="84">機会への切迫感をみんなで持つ</text>
<circle cx="26" cy="116" r="13" class="fa"/>
<text x="26" y="120.5" class="tb ton" text-anchor="middle">2</text>
<text x="50" y="112" class="tb">推進チームをつくる</text>
<text x="50" y="130">変革を引っぱる連合を組む</text>
<circle cx="26" cy="162" r="13" class="fa"/>
<text x="26" y="166.5" class="tb ton" text-anchor="middle">3</text>
<text x="50" y="158" class="tb">ビジョンを示す</text>
<text x="50" y="176">どこへ向かうかを示す</text>
<circle cx="26" cy="208" r="13" class="fa"/>
<text x="26" y="212.5" class="tb ton" text-anchor="middle">4</text>
<text x="50" y="204" class="tb">賛同者を集める</text>
<text x="50" y="222">多くの人を巻き込む</text>
<circle cx="26" cy="254" r="13" class="fa"/>
<text x="26" y="258.5" class="tb ton" text-anchor="middle">5</text>
<text x="50" y="250" class="tb">障害を取り除く</text>
<text x="50" y="268">行動できるようにする</text>
<circle cx="26" cy="300" r="13" class="fa"/>
<text x="26" y="304.5" class="tb ton" text-anchor="middle">6</text>
<text x="50" y="296" class="tb">短期の成果を示す</text>
<text x="50" y="314">早く、何度も見せる</text>
<circle cx="26" cy="346" r="13" class="fa"/>
<text x="26" y="350.5" class="tb ton" text-anchor="middle">7</text>
<text x="50" y="342" class="tb">加速する</text>
<text x="50" y="360">成功で増した信頼で、仕組みを改める</text>
<circle cx="26" cy="392" r="13" class="fok l sok"/>
<text x="26" y="396.5" class="tb" text-anchor="middle">8</text>
<text x="50" y="388" class="tb tok">定着させる</text>
<text x="50" y="406">新しい行動が、古い習慣に置き換わる</text>
<line x1="12" y1="426" x2="308" y2="426" class="l sb w1"/>
<text x="12" y="448">システムや制度を変えても、人の行動が</text>
<text x="12" y="466">変わらなければ成果にならない。だから</text>
<text x="12" y="484" class="tb">元に戻らないところ（8）まで進める</text>
</svg>
