<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 686" role="img" aria-labelledby="fig-dx-dgc-t fig-dx-dgc-d">
<title id="fig-dx-dgc-t">デジタルガバナンス・コード3.0：3つの視点と5つの柱</title>
<desc id="fig-dx-dgc-d">デジタルガバナンス・コード3.0の全体像。DX経営に求められる3つの視点は、1経営ビジョンとDX戦略の連動、2 As is－To beギャップの定量把握・見直し、3企業文化への定着。5つの柱は、1経営ビジョン・ビジネスモデルの策定、2 DX戦略の策定、3 DX戦略の推進（3-1組織づくり、3-2デジタル人材の育成・確保、3-3 ITシステム・サイバーセキュリティ）、4成果指標の設定・DX戦略の見直し、5ステークホルダーとの対話。各柱は、基本的事項（DX認定の基準）と望ましい方向性（DX銘柄・DXセレクションの評価基準）の2つの区分で構成される。</desc>
<text x="12" y="22" class="tb">DX経営に求められる3つの視点</text>
<rect x="12" y="34" width="296" height="32" class="fas sa" stroke-width="1.5"/>
<text x="160" y="54.5" text-anchor="middle">① 経営ビジョンとDX戦略の連動</text>
<rect x="12" y="72" width="296" height="46" class="fas sa" stroke-width="1.5"/>
<text x="160" y="90" text-anchor="middle">② As is－To be ギャップの</text>
<text x="160" y="109" text-anchor="middle">定量把握・見直し</text>
<rect x="12" y="124" width="296" height="32" class="fas sa" stroke-width="1.5"/>
<text x="160" y="144.5" text-anchor="middle">③ 企業文化への定着</text>
<text x="12" y="176" class="tm">3つの視点を意識して、各柱に取り組む</text>
<text x="12" y="202" class="tb">DX経営に求められる5つの柱</text>
<rect x="12" y="214" width="296" height="32" class="fs sa" stroke-width="1.5"/>
<text x="160" y="234.5" text-anchor="middle">1　経営ビジョン・ビジネスモデルの策定</text>
<rect x="12" y="252" width="296" height="32" class="fs sa" stroke-width="1.5"/>
<text x="160" y="272.5" text-anchor="middle">2　DX戦略の策定</text>
<rect x="12" y="290" width="296" height="140" class="fs sa" stroke-width="1.5"/>
<text x="24" y="312" class="tb">3　DX戦略の推進</text>
<rect x="24" y="324" width="272" height="28" class="fas sa" stroke-width="1.5"/>
<text x="160" y="342.5" text-anchor="middle">3-1　組織づくり</text>
<rect x="24" y="358" width="272" height="28" class="fas sa" stroke-width="1.5"/>
<text x="160" y="376.5" text-anchor="middle">3-2　デジタル人材の育成・確保</text>
<rect x="24" y="392" width="272" height="28" class="fas sa" stroke-width="1.5"/>
<text x="160" y="410.5" text-anchor="middle">3-3　ITシステム・サイバーセキュリティ</text>
<rect x="12" y="436" width="296" height="32" class="fs sa" stroke-width="1.5"/>
<text x="160" y="456.5" text-anchor="middle">4　成果指標の設定・DX戦略の見直し</text>
<rect x="12" y="474" width="296" height="32" class="fs sa" stroke-width="1.5"/>
<text x="160" y="494.5" text-anchor="middle">5　ステークホルダーとの対話</text>
<line x1="12" y1="520" x2="308" y2="520" class="l sb w1"/>
<text x="12" y="542" class="tb">各柱は、2つの区分でできている</text>
<rect x="12" y="566" width="296" height="44" class="fa" stroke-width="1.5"/>
<text x="160" y="583" class="tb ton" text-anchor="middle">基本的事項</text>
<text x="160" y="602" class="ton" text-anchor="middle">＝ DX認定の基準</text>
<rect x="12" y="616" width="296" height="62" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="632.5" class="tb" text-anchor="middle">望ましい方向性</text>
<text x="160" y="651.5" text-anchor="middle">＝ DX銘柄・DXセレクションの</text>
<text x="160" y="670.5" text-anchor="middle">評価・選定基準</text>
</svg>
