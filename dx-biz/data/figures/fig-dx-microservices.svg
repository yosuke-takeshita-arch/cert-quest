<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 426" role="img" aria-labelledby="fig-dx-microservices-t fig-dx-microservices-d">
<title id="fig-dx-microservices-t">モノリシックな構成とマイクロサービス（APIでつなぐ）</title>
<desc id="fig-dx-microservices-d">上：モノリシック（一枚岩）。各サブシステムが適切に分割されず密結合で、一部を変えると全体への影響範囲を見極めにくく、改修の調査やテストに時間がかかる。下：マイクロサービス。小さく独立したサービス（会員・決済・在庫など）をAPIでつなぐ。疎結合なので、ある部分の変更が他に及びにくく、APIで決めたとおりに動く限り、呼ばれる側は自由に作り替えられる。各サービスは自分のデータベースを持ち、他のサービスのデータはAPI経由で扱う。</desc>
<text x="12" y="22" class="tb">モノリシック（一枚岩・密結合）</text>
<rect x="12" y="32" width="296" height="96" class="fng sng" stroke-width="1.5"/>
<rect x="24" y="46" width="80" height="40" class="fs sng" stroke-width="1.5"/>
<text x="64" y="70.5" text-anchor="middle">会員</text>
<rect x="116" y="46" width="80" height="40" class="fs sng" stroke-width="1.5"/>
<text x="156" y="70.5" text-anchor="middle">決済</text>
<rect x="208" y="46" width="80" height="40" class="fs sng" stroke-width="1.5"/>
<text x="248" y="70.5" text-anchor="middle">在庫</text>
<text x="160" y="110" text-anchor="middle">1つの塊に全部が詰まっている</text>
<text x="12" y="150">一部を変えると、全体への影響を</text>
<text x="12" y="170">見極めにくい。改修に時間がかかる</text>
<line x1="12" y1="190" x2="308" y2="190" class="l sb w1"/>
<text x="12" y="212" class="tb">マイクロサービス（疎結合）</text>
<rect x="12" y="226" width="92" height="66" class="fok sok" stroke-width="1.5"/>
<text x="58" y="244.5" class="tb" text-anchor="middle">会員</text>
<text x="58" y="263.5" text-anchor="middle">サービス</text>
<text x="58" y="282.5" text-anchor="middle">（自分のDB）</text>
<rect x="114" y="226" width="92" height="66" class="fok sok" stroke-width="1.5"/>
<text x="160" y="244.5" class="tb" text-anchor="middle">決済</text>
<text x="160" y="263.5" text-anchor="middle">サービス</text>
<text x="160" y="282.5" text-anchor="middle">（自分のDB）</text>
<rect x="216" y="226" width="92" height="66" class="fok sok" stroke-width="1.5"/>
<text x="262" y="244.5" class="tb" text-anchor="middle">在庫</text>
<text x="262" y="263.5" text-anchor="middle">サービス</text>
<text x="262" y="282.5" text-anchor="middle">（自分のDB）</text>
<rect x="12" y="318" width="296" height="30" class="fas sa" stroke-width="1.5"/>
<text x="160" y="338" class="tb" text-anchor="middle">API でつなぐ</text>
<line x1="58" y1="298" x2="58" y2="318" class="l sa w2"/>
<polyline points="54.7,312 58,318 61.3,312" class="l sa w2"/>
<line x1="70" y1="318" x2="70" y2="298" class="l sa w2"/>
<polyline points="73.3,304 70,298 66.7,304" class="l sa w2"/>
<line x1="160" y1="298" x2="160" y2="318" class="l sa w2"/>
<polyline points="156.7,312 160,318 163.3,312" class="l sa w2"/>
<line x1="172" y1="318" x2="172" y2="298" class="l sa w2"/>
<polyline points="175.3,304 172,298 168.7,304" class="l sa w2"/>
<line x1="262" y1="298" x2="262" y2="318" class="l sa w2"/>
<polyline points="258.7,312 262,318 265.3,312" class="l sa w2"/>
<line x1="274" y1="318" x2="274" y2="298" class="l sa w2"/>
<polyline points="277.3,304 274,298 270.7,304" class="l sa w2"/>
<text x="12" y="370">各サービスが自分のDBを持つ。</text>
<text x="12" y="390">他のサービスのデータはAPI経由で扱う</text>
<text x="12" y="414" class="tb">→ 1つだけを作り替えやすい</text>
</svg>
