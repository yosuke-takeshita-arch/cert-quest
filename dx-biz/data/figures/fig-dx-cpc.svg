<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 586" role="img" aria-labelledby="fig-dx-cpc-t fig-dx-cpc-d">
<title id="fig-dx-cpc-t">クリック課金：表示ではなく、クリックの回数で払う</title>
<desc id="fig-dx-cpc-d">数は図の例。上：ひと月の流れ。広告が1,000回表示される（表示されただけでは費用はかからない）。そのうち20回クリックされる。クリック単価が50円なら、広告費は20回×50円で1,000円。クリックした20人のうち2人が申し込む（コンバージョン）。申込みの割合（コンバージョン率）は2÷20で10％。下：クリックが2倍の40回に増え、申込みは2件のままだった月。広告費は40回×50円で2,000円に増え、コンバージョン率は2÷40で5％に下がる。クリックの後に申し込むかどうかは、着地先のページや申込みの手順の出来に左右される。広告主は、1回のクリックに払える上限（上限クリック単価）を決める。実際の単価はたいてい上限を下回る。</desc>
<text x="12" y="22" class="tb">ひと月の流れ（数は図の例）</text>
<rect x="12" y="34" width="296" height="40" class="fs l sm"/>
<text x="24" y="59">広告が表示される</text>
<text x="296" y="59" class="tb" text-anchor="end">1,000回</text>
<text x="160" y="92" class="tm" text-anchor="middle">↑ 表示だけでは0円</text>
<line x1="160" y1="98" x2="160" y2="112" class="l sa w2"/>
<polyline points="156,106 160,112 164,106" class="l sa w2"/>
<rect x="12" y="114" width="296" height="40" class="fas l sa"/>
<text x="24" y="139" class="tb">クリックされる</text>
<text x="296" y="139" class="tb" text-anchor="end">20回</text>
<line x1="160" y1="154" x2="160" y2="168" class="l sa w2"/>
<polyline points="156,162 160,168 164,162" class="l sa w2"/>
<rect x="12" y="170" width="296" height="40" class="fok l sok"/>
<text x="24" y="195">申し込む（コンバージョン）</text>
<text x="296" y="195" class="tb" text-anchor="end">2件</text>
<text x="12" y="236" class="tb">広告費 ＝ クリック回数 × クリック単価</text>
<text x="12" y="258">　　　＝ 20回 × 50円 ＝ 1,000円</text>
<text x="12" y="284" class="tb">申込みの割合 ＝ 申込み ÷ クリック</text>
<text x="12" y="306">　　　　　　＝ 2 ÷ 20 ＝ 10％</text>
<line x1="12" y1="324" x2="308" y2="324" class="l sb w1"/>
<text x="12" y="348" class="tb">クリックが2倍、申込みは同じ月</text>
<text x="12" y="372">広告費 ＝ 40回 × 50円</text>
<text x="12" y="392" class="tb tng">　　　＝ 2,000円（2倍に増える）</text>
<text x="12" y="416">申込みの割合 ＝ 2 ÷ 40</text>
<text x="12" y="436" class="tb tng">　　　　　　＝ 5％（下がる）</text>
<text x="12" y="462">→ 着地先のページや申込みの手順を</text>
<text x="12" y="480">　 見直す合図</text>
<line x1="12" y1="496" x2="308" y2="496" class="l sb w1"/>
<text x="12" y="518">単価：広告主が払える上限を決める。</text>
<text x="12" y="536">実際の単価はたいてい上限を下回る</text>
<text x="12" y="564" class="tm">申込みの割合＝コンバージョン率</text>
</svg>
