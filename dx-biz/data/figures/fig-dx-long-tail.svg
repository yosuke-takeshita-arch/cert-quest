<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="fig-dx-long-tail-t fig-dx-long-tail-d">
<title id="fig-dx-long-tail-t">ロングテール：少しずつ売れる多数の商品の合計</title>
<desc id="fig-dx-long-tail-d">横軸が商品の売れ筋の順位、縦軸が販売数の曲線。左端の高い部分がヘッド（売れ筋の少数の商品）、右へ長く低く伸びる部分がテール（一つひとつは少ししか売れない多数の商品）。実店舗は棚の広さに限りがあるので、縦の線より右のテールは置けない。ネットの店は在庫や陳列の制約が小さく、品数を大幅に増やせるので、テールまで扱え、テールの面積の合計が大きな売上になる。</desc>
<text x="12" y="22" class="tb">売れ筋の順位と販売数（イメージ）</text>
<polygon points="44,186 44,46 46.17,60.63 48.33,72.49 50.5,82.3 52.67,90.55 54.83,97.58 57,103.65 59.17,108.94 61.33,113.59 63.5,117.71 65.67,121.38 67.83,124.69 70,127.67 72.17,130.37 74.33,132.84 76.5,135.09 78.67,137.16 80.83,139.07 83,140.84 85.17,142.48 87.33,144 89.5,145.42 91.67,146.75 93.83,147.99 96,149.16 96,186" class="fas sa"/>
<polygon points="96,186 96,149.16 104.67,153.19 113.33,156.42 122,159.08 130.67,161.29 139.33,163.17 148,164.79 156.67,166.19 165.33,167.42 174,168.5 182.67,169.46 191.33,170.33 200,171.11 208.67,171.81 217.33,172.45 226,173.04 234.67,173.57 243.33,174.07 252,174.52 260.67,174.95 269.33,175.34 278,175.71 286.67,176.05 295.33,176.37 304,176.67 304,186" class="fwn swn"/>
<line x1="44" y1="36" x2="44" y2="186" class="l sm w1"/>
<line x1="44" y1="186" x2="304" y2="186" class="l sm w1"/>
<line x1="96" y1="40" x2="96" y2="186" class="l sng w2 dsh"/>
<text x="104" y="58" class="tb">← ヘッド（売れ筋）</text>
<text x="104" y="82" class="tb">実店舗の棚の限界</text>
<text x="187" y="154" class="tb">テール</text>
<text x="12" y="208" class="tm">← 売れ筋</text>
<text x="204" y="208" class="tm">順位 → </text>
<line x1="12" y1="226" x2="308" y2="226" class="l sb w1"/>
<text x="12" y="248">実店舗：棚の限界までしか置けない</text>
<text x="12" y="268" class="tb">ネット店舗：テールまで扱える</text>
<text x="12" y="288">テールの面積の合計が、大きな売上になる</text>
</svg>
