<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 610" role="img" aria-labelledby="fig-dx-basket-rule-t fig-dx-basket-rule-d">
<title id="fig-dx-basket-rule-t">バスケット分析：一緒に買われる割合を数える</title>
<desc id="fig-dx-basket-rule-d">数は図の例。レシート100枚を、1枚1マスの10×10のマスで表した図。パスタを含むレシートは20枚。そのうちパスタソースも一緒に含むレシートは12枚（塗りつぶしたマス）、パスタだけは8枚（点線のマス）。サポート（組み合わせの出現数）は、パスタとパスタソースの両方を含むレシートの数で12件。信頼度は、パスタを含むときにパスタソースも含む割合で、12÷20＝0.6、つまり60％。意味は、パスタを買う人の6割がソースも買うということで、隣の棚に並べる、セット販売、おすすめ（この商品を買った人はこれも）に生かせる。</desc>
<text x="12" y="22" class="tb">レシート100枚（数は図の例）</text>
<text x="12" y="40" class="tm">マス1つ＝レシート1枚</text>
