<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="fig-dx-basic-personal-info-t fig-dx-basic-personal-info-d">
<title id="fig-dx-basic-personal-info-t">個人情報に当たるもの・当たらないもの</title>
<desc id="fig-dx-basic-personal-info-d">個人情報保護法の個人情報かどうかを決める2つの問い（生きている人の情報か、誰のことか分かるか）を上に置き、下に当たる例と当たらない例を分けて並べた図。当たる例は、氏名と住所、名前の付いた購入の記録、本人と分かる顔写真。当たらない例は、誰のものか分からない「今日の来店者は100人」という集計（誰のことか分からないため）と、亡くなった人の情報（生きている人ではないため）。</desc>
<text x="12" y="22" class="tl">個人情報に当たるか</text>
<text x="12" y="44" class="tm">個人情報保護法の個人情報の決め手は2つ</text>
<rect x="12" y="56" width="296" height="58" class="fs sm" stroke-width="1.5" rx="8"/>
<text x="24" y="80" class="tb">① 生きている人の情報か</text>
<text x="24" y="102" class="tb">② 誰のことか分かるか</text>
<rect x="12" y="128" width="296" height="122" class="fok sok" stroke-width="1.5" rx="8"/>
<text x="24" y="152" class="tb tok">当たる（①も②も はい）</text>
<text x="24" y="178">・氏名と住所</text>
<text x="24" y="202">・名前の付いた購入の記録</text>
<text x="24" y="226">・本人と分かる顔写真</text>
<rect x="12" y="262" width="296" height="134" class="fng sng" stroke-width="1.5" rx="8"/>
<text x="24" y="286" class="tb tng">当たらない</text>
<text x="24" y="312">・『今日の来店者は100人』</text>
<text x="36" y="332" class="tm">→ 誰のことか分からない（②がいいえ）</text>
<text x="24" y="358">・亡くなった人の情報</text>
<text x="36" y="378" class="tm">→ 生きている人ではない（①がいいえ）</text>
</svg>
