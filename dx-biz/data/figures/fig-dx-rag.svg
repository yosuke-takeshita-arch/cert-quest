<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 494" role="img" aria-labelledby="fig-dx-rag-t fig-dx-rag-d">
<title id="fig-dx-rag-t">RAG（検索拡張生成）：答える前に検索して参照する</title>
<desc id="fig-dx-rag-d">利用者の質問に対し、RAGでは、1社内文書やデータベースを検索し、2見つかった文書の内容を質問と一緒に生成AIへ渡し、3その内容を参照して根拠のある回答を作る。点線の別経路は、検索を使わず、学習した知識だけで答える場合で、学習していない社内情報や最新情報には答えにくい。モデル自体を追加学習させるのはファインチューニングで、RAGとは別の方法。</desc>
<rect x="12" y="14" width="296" height="40" class="fs sa" stroke-width="1.5"/>
<text x="160" y="38.5" class="tb" text-anchor="middle">利用者の質問</text>
<text x="12" y="76" class="tb">RAG：答える前に調べる</text>
<line x1="160" y1="58" x2="160" y2="90" class="l sa w2"/>
<polyline points="156.15,83 160,90 163.85,83" class="l sa w2"/>
<rect x="12" y="94" width="296" height="56" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="116.5" class="tb" text-anchor="middle">① 社内文書・データベースを検索</text>
<text x="160" y="136.5" text-anchor="middle">（社内マニュアル・FAQ など）</text>
<line x1="160" y1="154" x2="160" y2="186" class="l sa w2"/>
<polyline points="156.15,179 160,186 163.85,179" class="l sa w2"/>
<rect x="12" y="190" width="296" height="56" class="fas sa" stroke-width="1.5"/>
<text x="160" y="212.5" class="tb" text-anchor="middle">② 見つかった内容を、質問と</text>
<text x="160" y="232.5" text-anchor="middle">一緒に生成AIへ渡す</text>
<line x1="160" y1="250" x2="160" y2="282" class="l sa w2"/>
<polyline points="156.15,275 160,282 163.85,275" class="l sa w2"/>
<rect x="12" y="286" width="296" height="56" class="fok sok" stroke-width="1.5"/>
<text x="160" y="308.5" class="tb" text-anchor="middle">③ 内容を参照して回答する</text>
<text x="160" y="328.5" text-anchor="middle">（根拠のある回答）</text>
<line x1="12" y1="364" x2="308" y2="364" class="l sb w1"/>
<text x="12" y="386" class="tb">検索を使わない場合（点線）</text>
<rect x="12" y="396" width="100" height="44" class="fs sm" stroke-width="1.5"/>
<text x="62" y="422.5" text-anchor="middle">質問</text>
<line x1="112" y1="418" x2="180" y2="418" class="l sm w2 dsh"/>
<polyline points="174,413 182,418 174,423" class="l sm w2"/>
<rect x="184" y="396" width="124" height="44" class="fs sm" stroke-width="1.5"/>
<text x="246" y="413.5" text-anchor="middle">生成AIが</text>
<text x="246" y="431.5" text-anchor="middle">学んだ知識だけ</text>
<text x="12" y="462">学習していない社内情報や最新情報は</text>
<text x="12" y="482">知らないので、答えにくい</text>
</svg>
