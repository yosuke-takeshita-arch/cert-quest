<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-dx-2025-cliff-t fig-dx-2025-cliff-d">
<title id="fig-dx-2025-cliff-t">2025年の崖：古いシステムを残すか、刷新するか</title>
<desc id="fig-dx-2025-cliff-d">経済産業省のDXレポート（2018年9月）の警告を、2つの道で描いた図。出発点は、複雑化・老朽化・ブラックボックス化した既存システム（レガシーシステム）。左の道は残したままにする道で、IT人材の引退やサポート終了でリスクが高まり、データを十分に活用できず新しい技術の効果も限られ、2025年以降に大きな経済損失が生じるおそれがある（これが崖）。右の道は2025年までに既存システムを集中的に刷新する道で、新しいデジタル技術で新しいビジネスモデルを生み出し、DXを進められる。期限の2025年までに刷新できるかが分かれ目。</desc>
<text x="160" y="22" class="tb" text-anchor="middle">古いシステムを、残すか・刷新するか</text>
<text x="160" y="42" class="tm" text-anchor="middle">経済産業省 DXレポート（2018年9月）の警告</text>
<rect x="12" y="54" width="296" height="52" class="fs l sm"/>
<text x="160" y="76" text-anchor="middle">複雑化・老朽化・ブラックボックス化した</text>
<text x="160" y="96" class="tb" text-anchor="middle">既存システム（レガシーシステム）</text>
<line x1="82" y1="106" x2="82" y2="126" class="l sm w2"/>
<polyline points="78,120 82,126 86,120" class="l sm w2"/>
<line x1="238" y1="106" x2="238" y2="126" class="l sm w2"/>
<polyline points="234,120 238,126 242,120" class="l sm w2"/>
<rect x="12" y="128" width="140" height="30" class="fng l sng"/>
<text x="82" y="148" class="tb" text-anchor="middle">✕ 残したまま</text>
<rect x="168" y="128" width="140" height="30" class="fok l sok"/>
<text x="238" y="148" class="tb" text-anchor="middle">○ 2025年までに刷新</text>
<text x="82" y="182" text-anchor="middle">IT人材の引退や</text>
<text x="82" y="200" text-anchor="middle">サポート終了で</text>
<text x="82" y="218" text-anchor="middle">リスクが高まる</text>
<line x1="82" y1="228" x2="82" y2="246" class="l sng w2"/>
<polyline points="78,240 82,246 86,240" class="l sng w2"/>
<text x="82" y="266" text-anchor="middle">データを活かせず、</text>
<text x="82" y="284" text-anchor="middle">新しい技術を入れても</text>
<text x="82" y="302" text-anchor="middle">効果が限られる</text>
<line x1="82" y1="312" x2="82" y2="330" class="l sng w2"/>
<polyline points="78,324 82,330 86,324" class="l sng w2"/>
<rect x="12" y="332" width="140" height="62" class="fng l sng"/>
<text x="82" y="354" class="tb" text-anchor="middle">2025年以降、</text>
<text x="82" y="372" class="tb" text-anchor="middle">大きな経済損失の</text>
<text x="82" y="390" class="tb" text-anchor="middle">おそれ（＝崖）</text>
<text x="238" y="182" text-anchor="middle">既存システムを</text>
<text x="238" y="200" text-anchor="middle">集中的に刷新する</text>
<line x1="238" y1="228" x2="238" y2="246" class="l sok w2"/>
<polyline points="234,240 238,246 242,240" class="l sok w2"/>
<text x="238" y="266" text-anchor="middle">新しいデジタル技術で</text>
<text x="238" y="284" text-anchor="middle">新しいビジネス</text>
<text x="238" y="302" text-anchor="middle">モデルを生み出す</text>
<line x1="238" y1="312" x2="238" y2="330" class="l sok w2"/>
<polyline points="234,324 238,330 242,324" class="l sok w2"/>
<rect x="168" y="332" width="140" height="62" class="fok l sok"/>
<text x="238" y="368" class="tb" text-anchor="middle">DXを進められる</text>
<line x1="12" y1="412" x2="308" y2="412" class="l sb w1"/>
<text x="12" y="434">分かれ目は、期限の2025年までに</text>
<text x="12" y="454" class="tb">古いシステムを刷新できるかどうか</text>
</svg>
