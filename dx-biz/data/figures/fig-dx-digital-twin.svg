<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 444" role="img" aria-labelledby="fig-dx-digital-twin-t fig-dx-digital-twin-d">
<title id="fig-dx-digital-twin-t">デジタルツイン：物理空間とサイバー空間の行き来</title>
<desc id="fig-dx-digital-twin-d">下の物理空間に工場の設備・生産ラインがある。IoTのセンサーデータが、上のサイバー空間に送られ、設備や工程が双子のように再現される。サイバー空間の中で、条件を変えて試す（シミュレーション・分析・最適化）。よい案だけを、物理空間にフィードバックして実行する。物理空間で試行錯誤すると多大なコストや時間がかかることを、サイバー空間で先に試せる。</desc>
<rect x="12" y="14" width="296" height="150" class="fas sa" stroke-width="1.5"/>
<text x="24" y="38" class="tb">サイバー空間</text>
<rect x="24" y="54" width="272" height="44" class="fs sa" stroke-width="1.5"/>
<text x="160" y="71" class="tb" text-anchor="middle">双子（物理空間を再現）</text>
<text x="160" y="90" text-anchor="middle">設備・工程・生産ライン</text>
<rect x="24" y="108" width="272" height="44" class="fa" stroke-width="1.5"/>
<text x="160" y="125" class="tb ton" text-anchor="middle">条件を変えて試す</text>
<text x="160" y="144" class="ton" text-anchor="middle">（シミュレーション・分析・最適化）</text>
<line x1="60" y1="216" x2="60" y2="166" class="l sok w2"/>
<polyline points="63.85,173 60,166 56.15,173" class="l sok w2"/>
<text x="74" y="186" class="tb">IoTセンサーの</text>
<text x="74" y="206" class="tb">データを反映</text>
<line x1="60" y1="218" x2="60" y2="270" class="l swn w2"/>
<polyline points="56.15,263 60,270 63.85,263" class="l swn w2"/>
<text x="74" y="240" class="tb">よい案だけを</text>
<text x="74" y="260" class="tb">実行（フィードバック）</text>
<rect x="12" y="272" width="296" height="84" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="296" class="tb">物理空間</text>
<rect x="24" y="308" width="272" height="36" class="fs swn" stroke-width="1.5"/>
<text x="160" y="330.5" text-anchor="middle">工場の設備・生産ライン</text>
<line x1="12" y1="370" x2="308" y2="370" class="l sb w1"/>
<text x="12" y="394">物理空間で試行錯誤すると、</text>
<text x="12" y="413">多大なコストや時間がかかることを、</text>
<text x="12" y="432" class="tb">サイバー空間で先に試せる</text>
</svg>
