<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 401" role="img" aria-labelledby="fig-dx-servitization-t fig-dx-servitization-d">
<title id="fig-dx-servitization-t">モノのサービス化：売り切りから稼働保証へ</title>
<desc id="fig-dx-servitization-d">上：売り切り。メーカーが機械を顧客に売り、お金は代金として1回だけ入る。下：稼働保証モデル。メーカーが、機械をIoTで遠隔監視して稼働データを集め、故障の前に部品を交換して、止まらずに動いた時間に応じて、顧客から継続的に対価を受け取る。機械そのものではなく、止まらずに動くことを保証する。モノを所有させず、必要な分をサービスとして利用させるのがアズアサービス。</desc>
<text x="12" y="22" class="tb">売り切り：お金は1回</text>
<rect x="12" y="28" width="84" height="44" class="fwn swn" stroke-width="1.5"/>
<text x="54" y="54.5" class="tb" text-anchor="middle">メーカー</text>
<rect x="118" y="28" width="84" height="44" class="fs sb" stroke-width="1.5"/>
<text x="160" y="54.5" text-anchor="middle">機械</text>
<rect x="224" y="28" width="84" height="44" class="fok sok" stroke-width="1.5"/>
<text x="266" y="54.5" class="tb" text-anchor="middle">顧客</text>
<line x1="98" y1="50" x2="116" y2="50" class="l sm w2"/>
<polyline points="111,52.75 116,50 111,47.25" class="l sm w2"/>
<line x1="204" y1="50" x2="222" y2="50" class="l sm w2"/>
<polyline points="217,52.75 222,50 217,47.25" class="l sm w2"/>
<line x1="266" y1="72" x2="266" y2="94" class="l sa w2"/>
<line x1="266" y1="94" x2="54" y2="94" class="l sa w2"/>
<line x1="54" y1="94" x2="54" y2="74" class="l sa w2"/>
<polyline points="57.3,80 54,74 50.7,80" class="l sa w2"/>
<text x="70" y="90" class="tb">代金（1回だけ）</text>
<text x="12" y="122" class="tm">売ったあとは、お金も関係も続かない</text>
<line x1="12" y1="140" x2="308" y2="140" class="l sb w1"/>
<text x="12" y="162" class="tb">稼働保証：止まらず動くことを売る</text>
<rect x="12" y="176" width="84" height="44" class="fwn swn" stroke-width="1.5"/>
<text x="54" y="202.5" class="tb" text-anchor="middle">メーカー</text>
<rect x="118" y="176" width="84" height="44" class="fs sb" stroke-width="1.5"/>
<text x="160" y="202.5" text-anchor="middle">機械</text>
<rect x="224" y="176" width="84" height="44" class="fok sok" stroke-width="1.5"/>
<text x="266" y="202.5" class="tb" text-anchor="middle">顧客</text>
<line x1="116" y1="188" x2="98" y2="188" class="l sok w2"/>
<polyline points="103,185.25 98,188 103,190.75" class="l sok w2"/>
<line x1="98" y1="208" x2="116" y2="208" class="l swn w2"/>
<polyline points="111,210.75 116,208 111,205.25" class="l swn w2"/>
<line x1="204" y1="198" x2="222" y2="198" class="l sm w2"/>
<polyline points="217,200.75 222,198 217,195.25" class="l sm w2"/>
<line x1="266" y1="220" x2="266" y2="242" class="l sa w2"/>
<line x1="266" y1="242" x2="54" y2="242" class="l sa w2"/>
<line x1="54" y1="242" x2="54" y2="222" class="l sa w2"/>
<polyline points="57.3,228 54,222 50.7,228" class="l sa w2"/>
<text x="70" y="238" class="tb">対価（動いた時間に応じて）</text>
<text x="12" y="264">上の矢印：IoTで稼働データを集める</text>
<text x="12" y="284">下の矢印：故障の前に部品を交換する</text>
<text x="12" y="308" class="tb">お金が、継続的に入る</text>
<line x1="12" y1="328" x2="308" y2="328" class="l sb w1"/>
<text x="12" y="350" class="tb">アズアサービス</text>
<text x="12" y="370">所有させず、必要な分を</text>
<text x="12" y="389">サービスとして使わせる</text>
</svg>
