<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" role="img" aria-labelledby="fig-dx-ppdac-t fig-dx-ppdac-d">
<title id="fig-dx-ppdac-t">PPDACサイクル：問題、計画、データ、分析、結論</title>
<desc id="fig-dx-ppdac-d">PPDACサイクルは、データを使って問題を解決する5つのフェーズを、Problem（問題）、Plan（計画）、Data（データ）、Analysis（分析）、Conclusion（結論）の順に進める枠組み。結論のあとは、次の問題に戻って回る。出発点は、データを集める前に何を解くかを決める問題のフェーズ。分析のフェーズでは、全体を見渡す、分ける・比べる、変化や関係を探る、予測する、という視点で進める。業務改善のPDCAサイクル（Plan・Do・Check・Act）とは別のもの。</desc>
<text x="12" y="22" class="tb">問題解決の5つのフェーズ</text>
<rect x="12" y="36" width="280" height="66" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="60" class="tl">P</text>
<text x="50" y="59" class="tb">Problem（問題）</text>
<text x="50" y="79" class="tm">何を解くかを決める</text>
<text x="50" y="98" class="tm">（データを集める前に）</text>
<line x1="152" y1="104" x2="152" y2="118" class="l sa w2"/>
<polyline points="148.7,112 152,118 155.3,112" class="l sa w2"/>
<rect x="12" y="120" width="280" height="36" class="fas sa" stroke-width="1.5"/>
<text x="24" y="144" class="tl">P</text>
<text x="50" y="143" class="tb">Plan（計画）</text>
<line x1="152" y1="158" x2="152" y2="172" class="l sa w2"/>
<polyline points="148.7,166 152,172 155.3,166" class="l sa w2"/>
<rect x="12" y="174" width="280" height="36" class="fas sa" stroke-width="1.5"/>
<text x="24" y="198" class="tl">D</text>
<text x="50" y="197" class="tb">Data（データ）</text>
<line x1="152" y1="212" x2="152" y2="226" class="l sa w2"/>
<polyline points="148.7,220 152,226 155.3,220" class="l sa w2"/>
<rect x="12" y="228" width="280" height="66" class="fas sa" stroke-width="1.5"/>
<text x="24" y="252" class="tl">A</text>
<text x="50" y="251" class="tb">Analysis（分析）</text>
<text x="50" y="271" class="tm">全体を見渡す・分ける比べる</text>
<text x="50" y="290" class="tm">変化や関係を探る・予測する</text>
<line x1="152" y1="296" x2="152" y2="310" class="l sa w2"/>
<polyline points="148.7,304 152,310 155.3,304" class="l sa w2"/>
<rect x="12" y="312" width="280" height="36" class="fok sok" stroke-width="1.5"/>
<text x="24" y="336" class="tl">C</text>
<text x="50" y="335" class="tb">Conclusion（結論）</text>
<line x1="292" y1="330" x2="306" y2="330" class="l sa w2"/>
<line x1="306" y1="330" x2="306" y2="69" class="l sa w2"/>
<line x1="306" y1="69" x2="294" y2="69" class="l sa w2"/>
<polyline points="301,65.15 294,69 301,72.85" class="l sa w2"/>
<text x="12" y="370" class="tb">結論のあとは、次の問題へ戻って回る</text>
<line x1="12" y1="394" x2="308" y2="394" class="l sb w1"/>
<text x="12" y="418" class="tm">業務改善のPDCA（Plan・Do・</text>
<text x="12" y="438" class="tm">Check・Act）とは別のもの</text>
</svg>
