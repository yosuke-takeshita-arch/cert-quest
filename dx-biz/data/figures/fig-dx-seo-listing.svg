<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-dx-seo-listing-t fig-dx-seo-listing-d">
<title id="fig-dx-seo-listing-t">SEO とリスティング広告：検索結果の画面のどこを狙うか</title>
<desc id="fig-dx-seo-listing-d">検索結果の画面の例。キーワード「傘 修理」で検索すると、広告の印が付いた広告枠と、広告ではない検索結果が並ぶ（並び方は例）。広告枠はリスティング広告（検索連動型広告）で、費用を払って検索結果と並べて出し、順位はキーワードごとの入札で決まる。広告ではない検索結果で、サイトを見つけやすくする取り組みが SEO。Google は掲載順位を上げるための金銭を受け取らず、1位になる秘訣も無いとしている。下：生成AIの回答では、生成AIが複数の情報源をまとめて1つの回答を作る。その回答の中で引用されることを狙うのが GEO。</desc>
<text x="12" y="22" class="tb">検索結果の画面（例）</text>
<rect x="12" y="30" width="296" height="30" class="fs sm" stroke-width="1.5"/>
<text x="24" y="50">検索：傘 修理</text>
<text x="296" y="50" class="tm" text-anchor="end">キーワードの例</text>
<rect x="12" y="70" width="296" height="134" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="90" class="tb">広告枠＝リスティング広告</text>
<rect x="24" y="100" width="272" height="26" class="fs sb" stroke-width="1"/>
<text x="34" y="117.5" class="tb twn">［広告］</text>
<text x="96" y="117.5">A社　傘の修理受付</text>
<rect x="24" y="132" width="272" height="26" class="fs sb" stroke-width="1"/>
<text x="34" y="149.5" class="tb twn">［広告］</text>
<text x="96" y="149.5">B社　修理の見積もり</text>
<text x="24" y="176">費用を払って、検索結果と並べて出す</text>
<text x="24" y="195">順位はキーワードごとの入札で決まる</text>
<rect x="12" y="214" width="296" height="152" class="fok sok" stroke-width="1.5"/>
<text x="24" y="234" class="tb">広告ではない検索結果</text>
<rect x="24" y="244" width="272" height="26" class="fs sb" stroke-width="1"/>
<text x="34" y="261.5" class="tb">1</text>
<text x="56" y="261.5">C店　傘の修理のページ</text>
<rect x="24" y="276" width="272" height="26" class="fs sb" stroke-width="1"/>
<text x="34" y="293.5" class="tb">2</text>
<text x="56" y="293.5">D社　修理の料金表</text>
<rect x="24" y="308" width="272" height="26" class="fs sb" stroke-width="1"/>
<text x="34" y="325.5" class="tb">3</text>
<text x="56" y="325.5">E店　修理の事例</text>
<text x="24" y="355" class="tb tok">ここで見つけやすくするのが SEO</text>
<text x="12" y="388">Google は、掲載順位を上げるための</text>
<text x="12" y="407">お金を受け取らない。1位になる秘訣も無い</text>
<text x="12" y="426" class="tm">（広告枠を買っても、この欄の順位は上がらない）</text>
<line x1="12" y1="440" x2="308" y2="440" class="l sb w1"/>
<text x="12" y="462" class="tb">生成AIの回答では（GEO）</text>
<rect x="12" y="470" width="296" height="44" class="fas sa" stroke-width="1.5"/>
<text x="24" y="488">複数の情報源をまとめて1つの回答を作る</text>
<text x="24" y="506" class="tb">その中で引用されるのを狙うのが GEO</text>
</svg>
