<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-labelledby="fig-dx-iot-ai-loop-t fig-dx-iot-ai-loop-d">
<title id="fig-dx-iot-ai-loop-t">IoT×AIの輪：集める→予測・最適化→機器に返す→また集める</title>
<desc id="fig-dx-iot-ai-loop-d">何のための図か：工作機械にセンサーを付けて集めたデータをAIで分析し、結果を機器に返すと、どう輪が回って品質の向上や故障の予防につながるかを見る。輪の4つの段：①センサーで機器のデータを集める。②AIで分析し、先の状態を予測し、最適な動かし方を求める。③結果を機器に返して（フィードバック）、動きを変える。④変わった後の状態を、またセンサーで集める。①に戻る。DX白書2023が書いているのは③の機器へのフィードバックまでで、④の「また集める」は、末端の機器のセンサーでデータを取り、分析結果を機器へ返すというIoTの構成から導いた帰結。輪が切れる例：集めたデータをグラフにして見るだけ（見える化で止まる）や、結果を報告書にまとめて機器の動きは変えない場合は、③が無いので輪が回らない。</desc>
<text x="12" y="20" class="tb">IoT×AIの輪：機器に返して、また集める</text>
<text x="12" y="42" class="tm">例：顧客の工場にある工作機械</text>
<rect x="12" y="58" width="132" height="62" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="78" y="76" text-anchor="middle">① センサーで</text>
<text x="78" y="94" text-anchor="middle">機器のデータを</text>
<text x="78" y="112" text-anchor="middle">集める</text>
<rect x="176" y="58" width="132" height="62" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="242" y="76" text-anchor="middle">② AIで分析し</text>
<text x="242" y="94" text-anchor="middle">先の状態を予測・</text>
<text x="242" y="112" text-anchor="middle">最適化する</text>
<rect x="176" y="170" width="132" height="62" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="242" y="188" text-anchor="middle" class="tok">③ 結果を機器に</text>
<text x="242" y="206" text-anchor="middle" class="tok">返して動きを変える</text>
<text x="242" y="224" text-anchor="middle" class="tok">（フィードバック）</text>
<rect x="12" y="170" width="132" height="62" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="78" y="188" text-anchor="middle">④ 変わった後の</text>
<text x="78" y="206" text-anchor="middle">状態を、また</text>
<text x="78" y="224" text-anchor="middle">集める</text>
<line x1="146" y1="89" x2="168" y2="89" class="l sa w2"/>
<polyline points="167,84 174,89 167,94" class="l sa w2" fill="none"/>
<line x1="242" y1="122" x2="242" y2="162" class="l sa w2"/>
<polyline points="237,161 242,168 247,161" class="l sa w2" fill="none"/>
<line x1="174" y1="201" x2="152" y2="201" class="l sa w2"/>
<polyline points="153,196 146,201 153,206" class="l sa w2" fill="none"/>
<line x1="78" y1="168" x2="78" y2="128" class="l sa w2"/>
<polyline points="73,129 78,122 83,129" class="l sa w2" fill="none"/>
<text x="160" y="150" class="tm" text-anchor="middle">輪が回るたび</text>
<text x="160" y="166" class="tm" text-anchor="middle">品質↑・故障を予防</text>
<text x="12" y="256" class="tm">白書が書くのは③の機器へのフィードバックまで。</text>
<text x="12" y="274" class="tm">④は、IoTの構成の説明から導いた帰結</text>
<line x1="12" y1="286" x2="308" y2="286" class="l sb w1"/>
<text x="12" y="310" class="tb tng">輪が切れる例（③が無い）</text>
<text x="12" y="328" class="tm">・グラフにして見るだけ（見える化で止まる）</text>
<text x="12" y="346" class="tm">・結果を報告書にまとめ、機器の動きは変えない</text>
<text x="12" y="366" class="tb tng">→ 機器が変わらないので、輪が回らない</text>
</svg>
