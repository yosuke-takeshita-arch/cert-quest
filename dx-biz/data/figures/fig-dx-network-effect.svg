<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 586" role="img" aria-labelledby="fig-dx-network-effect-t fig-dx-network-effect-d">
<title id="fig-dx-network-effect-t">ネットワーク外部性とクリティカルマス</title>
<desc id="fig-dx-network-effect-d">上：ネットワーク外部性は、参加者が増えるほど価値が高まり、さらに参加者を呼び込む循環（利用者が増える、価値が上がる、さらに利用者が増える）。両面市場では、出品者が増えると購入者が増え、購入者が増えると出品者が増える、という2つのグループが互いを呼び込む循環になる。下：横軸が時間、縦軸が利用者数のS字の曲線。加入者が少ないうちはなかなか普及しないが、ある閾値のクリティカルマスを超えると一気に普及する。立ち上げ期には、無料化や特典で利用者を集めて、クリティカルマスを早く超えようとする。</desc>
<text x="12" y="22" class="tb">参加者が増えるほど、価値が高まる</text>
<rect x="12" y="32" width="296" height="34" class="fs sa" stroke-width="1.5"/>
<text x="160" y="53.5" text-anchor="middle">利用者が増える</text>
<line x1="160" y1="66" x2="160" y2="82" class="l sa w2"/>
<polyline points="156.7,76 160,82 163.3,76" class="l sa w2"/>
<rect x="12" y="84" width="296" height="34" class="fas sa" stroke-width="1.5"/>
<text x="160" y="105.5" text-anchor="middle">サービスの価値が上がる</text>
<line x1="160" y1="118" x2="160" y2="134" class="l sa w2"/>
<polyline points="156.7,128 160,134 163.3,128" class="l sa w2"/>
<rect x="12" y="136" width="296" height="34" class="fs sa" stroke-width="1.5"/>
<text x="160" y="157.5" text-anchor="middle">さらに利用者が増える（最初に戻る）</text>
<line x1="12" y1="182" x2="308" y2="182" class="l sb w1"/>
<text x="12" y="200" class="tb">両面市場：2つのグループが呼び合う</text>
<rect x="12" y="210" width="120" height="44" class="fwn swn" stroke-width="1.5"/>
<text x="72" y="236.5" class="tb" text-anchor="middle">出品者</text>
<rect x="188" y="210" width="120" height="44" class="fok sok" stroke-width="1.5"/>
<text x="248" y="236.5" class="tb" text-anchor="middle">購入者</text>
<line x1="136" y1="224" x2="184" y2="224" class="l sa w2"/>
<polyline points="178,227.3 184,224 178,220.7" class="l sa w2"/>
<line x1="184" y1="240" x2="136" y2="240" class="l sa w2"/>
<polyline points="142,236.7 136,240 142,243.3" class="l sa w2"/>
<text x="12" y="276">出品者が増える → 購入者が増える</text>
<text x="12" y="296">購入者が増える → 出品者が増える</text>
<line x1="12" y1="312" x2="308" y2="312" class="l sb w1"/>
<text x="12" y="334" class="tb">クリティカルマス（普及の分岐点）</text>
<line x1="40" y1="346" x2="40" y2="496" class="l sm w1"/>
<line x1="40" y1="496" x2="304" y2="496" class="l sm w1"/>
<text x="12" y="354" class="tm">人数</text>
<text x="250" y="516" class="tm">時間</text>
<path d="M42 490 C 110 488, 150 466, 180 426 S 250 354, 302 352" class="l sa w3"/>
<line x1="40" y1="430" x2="304" y2="430" class="l swn w2 dsh"/>
<text x="48" y="422" class="tb">クリティカルマス</text>
<text x="50" y="376" class="tm">分岐点の手前は</text>
<text x="50" y="396" class="tm">広がりにくい</text>
<line x1="104" y1="488" x2="104" y2="456" class="l sok w2"/>
<polyline points="107.3,462 104,456 100.7,462" class="l sok w2"/>
<text x="12" y="536">無料化・特典で押し上げて、</text>
<text x="12" y="555">早く分岐点を超える</text>
<text x="12" y="574" class="tb">超えると一気に普及する</text>
</svg>
