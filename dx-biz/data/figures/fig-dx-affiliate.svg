<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 291" role="img" aria-labelledby="fig-dx-affiliate-t fig-dx-affiliate-d">
<title id="fig-dx-affiliate-t">アフィリエイトのお金の流れ</title>
<desc id="fig-dx-affiliate-d">広告主、アフィリエイター（ブログなどの運営者）、閲覧者の3者の図。1アフィリエイターが、広告主の商品の広告やリンクを自分のサイトに載せる。2閲覧者が、そのリンクから商品を購入する。3広告主が、成果に応じた報酬（成功報酬）をアフィリエイターに支払う。広告主は成果が出た分だけ払う成果報酬型の例。広告主が表示内容の決定に関与している場合、アフィリエイターの広告も景品表示法上は広告主の表示とされる。広告であることが分かるように表示する（2023年10月1日からステルスマーケティングは景品表示法違反）。</desc>
<rect x="12" y="14" width="80" height="50" class="fwn swn" stroke-width="1.5"/>
<text x="52" y="43.5" class="tb" text-anchor="middle">広告主</text>
<rect x="120" y="14" width="80" height="50" class="fas sa" stroke-width="1.5"/>
<text x="160" y="34.5" class="tb" text-anchor="middle">アフィリ</text>
<text x="160" y="52.5" text-anchor="middle">エイター</text>
<rect x="228" y="14" width="80" height="50" class="fok sok" stroke-width="1.5"/>
<text x="268" y="43.5" class="tb" text-anchor="middle">閲覧者</text>
<line x1="94" y1="28" x2="118" y2="28" class="l sa w2"/>
<polyline points="113,30.75 118,28 113,25.25" class="l sa w2"/>
<circle cx="106" cy="28" r="9" class="fs sa"/>
<text x="106" y="32.5" class="tb" text-anchor="middle">1</text>
<line x1="94" y1="52" x2="118" y2="52" class="l sok w2"/>
<polyline points="113,54.75 118,52 113,49.25" class="l sok w2"/>
<circle cx="106" cy="52" r="9" class="fs sa"/>
<text x="106" y="56.5" class="tb" text-anchor="middle">3</text>
<line x1="268" y1="64" x2="268" y2="90" class="l sa w2"/>
<line x1="268" y1="90" x2="52" y2="90" class="l sa w2"/>
<line x1="52" y1="90" x2="52" y2="66" class="l sa w2"/>
<polyline points="55.3,72 52,66 48.7,72" class="l sa w2"/>
<circle cx="160" cy="90" r="9" class="fs sa"/>
<text x="160" y="94.5" class="tb" text-anchor="middle">2</text>
<text x="12" y="106">1　運営者が、広告主の商品の</text>
<text x="36" y="126">広告・リンクを自分のサイトに載せる</text>
<text x="12" y="152">2　閲覧者が、そのリンクから購入する</text>
<text x="12" y="180">3　広告主が、成果に応じた報酬を</text>
<text x="36" y="200">アフィリエイターに払う（成功報酬）</text>
<line x1="12" y1="218" x2="308" y2="218" class="l sb w1"/>
<text x="12" y="240" class="tb">広告であることを、分かるように表示する</text>
<text x="12" y="260">広告主が表示内容に関与していれば、</text>
<text x="12" y="279">広告主の表示とされる（景品表示法）</text>
</svg>
