<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 398" role="img" aria-labelledby="fig-dx-sharing-5types-t fig-dx-sharing-5types-d">
<title id="fig-dx-sharing-5types-t">シェアリング・エコノミーの5類型（平成29年版 情報通信白書）</title>
<desc id="fig-dx-sharing-5types-d">何のための図か：平成29年版情報通信白書が示すシェアリング・エコノミーの5類型を、何をシェアするかと代表例で並べる。モノ×シェアは、個人間で利用していないモノを共有するサービスで、フリマアプリやレンタルサービスが代表例。空間×シェアは、個人の所有するスペースを共有するサービスで、民泊サービスをはじめとしたホームシェアや、駐車場、会議室の共有。スキル×シェアは、個人に家事等の仕事・労働を依頼できるサービスで、家事代行、介護、育児、知識、料理などが代表例。移動×シェアは、ライドシェアやカーシェアが代表例。お金×シェアは、クラウドファンディングが代表例。近所の個人に掃除や料理を頼む家事代行は、人の仕事・労働を頼むのでスキル×シェアに当たる。</desc>
<text x="12" y="20" class="tb">何をシェアするかで5つに分ける</text>
<text x="12" y="42" class="tm">平成29年版 情報通信白書</text>
<rect x="12" y="54" width="296" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="75" class="tb">モノ×シェア</text>
<text x="128" y="75" class="tm">使っていないモノ</text>
<text x="22" y="95">例：フリマアプリ・レンタル</text>
<rect x="12" y="112" width="296" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="133" class="tb">空間×シェア</text>
<text x="128" y="133" class="tm">個人の持つスペース</text>
<text x="22" y="153">例：民泊・駐車場・会議室</text>
<rect x="12" y="170" width="296" height="52" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="191" class="tb tok">スキル×シェア</text>
<text x="128" y="191" class="tm">家事などの仕事・労働</text>
<text x="22" y="211">例：家事代行・介護・育児・料理</text>
<rect x="12" y="228" width="296" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="249" class="tb">移動×シェア</text>
<text x="128" y="249" class="tm">移動の手段</text>
<text x="22" y="269">例：ライドシェア・カーシェア</text>
<rect x="12" y="286" width="296" height="52" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="307" class="tb">お金×シェア</text>
<text x="128" y="307" class="tm">お金</text>
<text x="22" y="327">例：クラウドファンディング</text>
<text x="12" y="364" class="tb tok">家事代行＝人の仕事・労働を頼む</text>
<text x="12" y="384" class="tb tok">→ スキル×シェア</text>
</svg>
