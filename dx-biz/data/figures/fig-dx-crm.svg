<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" role="img" aria-labelledby="fig-dx-crm-t fig-dx-crm-d">
<title id="fig-dx-crm-t">CRM（顧客関係管理）：集める・分析する・働きかけるを回す</title>
<desc id="fig-dx-crm-d">上：CRMの3つの働きを輪で描いた図（観光庁のマーケティングガイドブックによる）。1 さまざまな顧客接点（店舗・Webサイト・アプリなど）で顧客データを集める。2 集めたデータを一元的に管理・分析し、打ち手への示唆を出す。3 分析に基づき、自らのチャネルを通じて顧客に働きかける。働きかけへの反応がまたデータになり、1に戻る。下：ねらいは、購入した人をリピーターに、リピーターをファンに育てること。それを実現するシステムをCRMシステム（CRMツール）と呼ぶ。</desc>
<text x="12" y="22" class="tb">3つの働きを回す</text>
<rect x="60" y="36" width="200" height="60" class="fas l sa"/>
<text x="160" y="58" class="tb" text-anchor="middle">1 集める</text>
<text x="160" y="80" text-anchor="middle">店舗・Web・アプリなどの接点で</text>
<rect x="168" y="150" width="140" height="80" class="fas l sa"/>
<text x="238" y="172" class="tb" text-anchor="middle">2 管理・分析</text>
<text x="238" y="194" text-anchor="middle">一か所にまとめ、</text>
<text x="238" y="214" text-anchor="middle">打ち手を考える</text>
<rect x="12" y="150" width="140" height="80" class="fok l sok"/>
<text x="82" y="172" class="tb" text-anchor="middle">3 働きかける</text>
<text x="82" y="194" text-anchor="middle">自らのチャネル</text>
<text x="82" y="214" text-anchor="middle">で顧客に届ける</text>
<line x1="240" y1="96" x2="252" y2="146" class="l sa w2"/>
<polyline points="247.3,140.6 252,146 254.4,139.0" class="l sa w2"/>
<line x1="166" y1="190" x2="156" y2="190" class="l sa w2"/>
<polyline points="161,186 155,190 161,194" class="l sa w2"/>
<line x1="68" y1="148" x2="80" y2="100" class="l sa w2"/>
<polyline points="76.0,106.0 80,100 82.6,107.3" class="l sa w2"/>
<text x="160" y="124" class="tm" text-anchor="middle">反応がまたデータになる</text>
<text x="160" y="270" class="tb" text-anchor="middle">顧客との関係を深める</text>
<line x1="12" y1="290" x2="308" y2="290" class="l sb w1"/>
<text x="12" y="314" class="tb">ねらい：関係を一段ずつ育てる</text>
<rect x="12" y="330" width="88" height="44" class="fs l sm"/>
<text x="56" y="357" text-anchor="middle">購入した人</text>
<line x1="102" y1="352" x2="114" y2="352" class="l sa w2"/>
<polyline points="108,348 114,352 108,356" class="l sa w2"/>
<rect x="116" y="330" width="88" height="44" class="fs l sm"/>
<text x="160" y="357" text-anchor="middle">リピーター</text>
<line x1="206" y1="352" x2="218" y2="352" class="l sa w2"/>
<polyline points="212,348 218,352 212,356" class="l sa w2"/>
<rect x="220" y="330" width="88" height="44" class="fok l sok"/>
<text x="264" y="357" class="tb" text-anchor="middle">ファン</text>
<line x1="12" y1="394" x2="308" y2="394" class="l sb w1"/>
<text x="12" y="418">CRM＝Customer Relationship</text>
<text x="12" y="436">Management（顧客関係管理）</text>
<text x="12" y="462">それを支える仕組みを、CRMシステム</text>
<text x="12" y="480">（CRMツール）と呼ぶ</text>
</svg>
