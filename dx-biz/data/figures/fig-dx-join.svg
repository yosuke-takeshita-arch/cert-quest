<line x1="40" y1="284" x2="40" y2="316" class="l sa w2"/>
<polyline points="36.15,309 40,316 43.85,309" class="l sa w2"/>
<text x="56" y="306" class="tb">顧客IDでつなぐ（JOIN）</text>
<text x="12" y="344" class="tb">結合した表</text>
<rect x="12" y="350" width="56" height="26" class="fas sa" stroke-width="1"/>
<text x="40" y="367.5" class="tb" text-anchor="middle">顧客ID</text>
<rect x="68" y="350" width="60" height="26" class="fas sa" stroke-width="1"/>
<text x="98" y="367.5" class="tb" text-anchor="middle">商品</text>
<rect x="128" y="350" width="52" height="26" class="fas sa" stroke-width="1"/>
<text x="154" y="367.5" class="tb" text-anchor="middle">金額</text>
<rect x="180" y="350" width="64" height="26" class="fas sa" stroke-width="1"/>
<text x="212" y="367.5" class="tb" text-anchor="middle">氏名</text>
<rect x="244" y="350" width="64" height="26" class="fas sa" stroke-width="1"/>
<text x="276" y="367.5" class="tb" text-anchor="middle">年代</text>
<rect x="12" y="376" width="56" height="26" class="fwn swn" stroke-width="1"/>
<text x="40" y="393.5" text-anchor="middle">C01</text>
<rect x="68" y="376" width="60" height="26" class="fs sb" stroke-width="1"/>
<text x="98" y="393.5" text-anchor="middle">パスタ</text>
<rect x="128" y="376" width="52" height="26" class="fs sb" stroke-width="1"/>
<text x="154" y="393.5" text-anchor="middle">320</text>
<rect x="180" y="376" width="64" height="26" class="fs sb" stroke-width="1"/>
<text x="212" y="393.5" text-anchor="middle">青木</text>
<rect x="244" y="376" width="64" height="26" class="fs sb" stroke-width="1"/>
<text x="276" y="393.5" text-anchor="middle">30代</text>
<rect x="12" y="402" width="56" height="26" class="fwn swn" stroke-width="1"/>
<text x="40" y="419.5" text-anchor="middle">C02</text>
<rect x="68" y="402" width="60" height="26" class="fs sb" stroke-width="1"/>
<text x="98" y="419.5" text-anchor="middle">ソース</text>
<rect x="128" y="402" width="52" height="26" class="fs sb" stroke-width="1"/>
<text x="154" y="419.5" text-anchor="middle">580</text>
<rect x="180" y="402" width="64" height="26" class="fs sb" stroke-width="1"/>
<text x="212" y="419.5" text-anchor="middle">伊藤</text>
<rect x="244" y="402" width="64" height="26" class="fs sb" stroke-width="1"/>
<text x="276" y="419.5" text-anchor="middle">40代</text>
<text x="12" y="452" class="tm">C04とC03は、相手の表に一致する行が</text>
<text x="12" y="472" class="tm">ないので、結合では無視される</text>
<line x1="12" y1="494" x2="308" y2="494" class="l sb w1"/>
<text x="12" y="518" class="tb">別の操作：グルーピング</text>
<text x="12" y="538">決めた項目（店舗・年代など）で</text>
<text x="12" y="557">行をまとめて合計する。</text>
<text x="12" y="576" class="tb">表と表をつなぐ操作ではない</text>
</svg>
