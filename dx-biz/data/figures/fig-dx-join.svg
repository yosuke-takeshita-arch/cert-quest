<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" role="img" aria-labelledby="fig-dx-join-t fig-dx-join-d">
<title id="fig-dx-join-t">データの結合（JOIN）：共通の列で、表を横につなぐ</title>
<desc id="fig-dx-join-d">購買履歴の表（顧客ID、商品、金額）と、顧客台帳の表（顧客ID、氏名、年代）を、共通の列である顧客IDを手がかりに横につなぎ、1つの表にする操作が結合（JOIN）。結果の表には、顧客ID、商品、金額、氏名、年代が横に並ぶ。相手の表に一致する行がない行は、結合の際に無視される。グルーピングは、店舗や年代など決めた項目で行をまとめて合計する操作で、表と表をつなぐ操作とは別。</desc>
<text x="12" y="22" class="tb">表A：購買履歴</text>
<rect x="12" y="28" width="88" height="26" class="fas sa" stroke-width="1"/>
<text x="56" y="45.5" class="tb" text-anchor="middle">顧客ID</text>
<rect x="100" y="28" width="100" height="26" class="fas sa" stroke-width="1"/>
<text x="150" y="45.5" class="tb" text-anchor="middle">商品</text>
<rect x="200" y="28" width="88" height="26" class="fas sa" stroke-width="1"/>
<text x="244" y="45.5" class="tb" text-anchor="middle">金額</text>
<rect x="12" y="54" width="88" height="26" class="fwn swn" stroke-width="1"/>
<text x="56" y="71.5" text-anchor="middle">C01</text>
<rect x="100" y="54" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="71.5" text-anchor="middle">パスタ</text>
<rect x="200" y="54" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="244" y="71.5" text-anchor="middle">320</text>
<rect x="12" y="80" width="88" height="26" class="fwn swn" stroke-width="1"/>
<text x="56" y="97.5" text-anchor="middle">C02</text>
<rect x="100" y="80" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="97.5" text-anchor="middle">ソース</text>
<rect x="200" y="80" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="244" y="97.5" text-anchor="middle">580</text>
<rect x="12" y="106" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="56" y="123.5" class="tm" text-anchor="middle">C04</text>
<rect x="100" y="106" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="123.5" class="tm" text-anchor="middle">牛乳</text>
<rect x="200" y="106" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="244" y="123.5" class="tm" text-anchor="middle">150</text>
<text x="12" y="162" class="tb">表B：顧客台帳</text>
<rect x="12" y="168" width="88" height="26" class="fas sa" stroke-width="1"/>
<text x="56" y="185.5" class="tb" text-anchor="middle">顧客ID</text>
<rect x="100" y="168" width="100" height="26" class="fas sa" stroke-width="1"/>
<text x="150" y="185.5" class="tb" text-anchor="middle">氏名</text>
<rect x="200" y="168" width="88" height="26" class="fas sa" stroke-width="1"/>
<text x="244" y="185.5" class="tb" text-anchor="middle">年代</text>
<rect x="12" y="194" width="88" height="26" class="fwn swn" stroke-width="1"/>
<text x="56" y="211.5" text-anchor="middle">C01</text>
<rect x="100" y="194" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="211.5" text-anchor="middle">青木</text>
<rect x="200" y="194" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="244" y="211.5" text-anchor="middle">30代</text>
<rect x="12" y="220" width="88" height="26" class="fwn swn" stroke-width="1"/>
<text x="56" y="237.5" text-anchor="middle">C02</text>
<rect x="100" y="220" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="237.5" text-anchor="middle">伊藤</text>
<rect x="200" y="220" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="244" y="237.5" text-anchor="middle">40代</text>
<rect x="12" y="246" width="88" height="26" class="fs sb" stroke-width="1"/>
<text x="56" y="263.5" class="tm" text-anchor="middle">C03</text>
<rect x="100" y="246" width="100" height="26" class="fs sb" stroke-width="1"/>
<text x="150" y="263.5" class="tm" text-anchor="middle">上田</text>
<rect x="200" y="246" width="88" height="26" class="fs sb" stroke-width="1"/>
