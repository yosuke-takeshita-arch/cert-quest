<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 624" role="img" aria-labelledby="fig-dx-dss-t fig-dx-dss-d">
<title id="fig-dx-dss-t">デジタルスキル標準：DXリテラシー標準（全員向け）とDX推進スキル標準（専門人材向け）</title>
<desc id="fig-dx-dss-d">デジタルスキル標準（ver.2.0、2026年4月）は2つの標準でできている。DXリテラシー標準（DSS-L）は全てのビジネスパーソン向けで、Why（DXの背景）、What（DXで活用されるデータ・技術）、How（データ・技術の利活用）、マインド・スタンスの4つで構成され、2023年8月に生成AI利用のマインド・スタンスが補記された。DX推進スキル標準（DSS-P）はDXを推進する専門人材向けで、ビジネスアーキテクト、デザイナー、データサイエンティスト、データマネジメント、ソフトウェアエンジニア、サイバーセキュリティの6つの類型と、その下位区分のロール、全類型共通の共通スキルリストからなる。類型どうしは指示する関係ではなく、連携し合う。</desc>
<text x="12" y="22" class="tb">デジタルスキル標準（ver.2.0・2026年4月）</text>
<rect x="12" y="36" width="296" height="262" class="fs sa" stroke-width="1.5"/>
<text x="24" y="60" class="tb">DXリテラシー標準（DSS-L）</text>
<text x="24" y="80">対象：全てのビジネスパーソン</text>
<rect x="24" y="94" width="130" height="66" class="fas sa" stroke-width="1.5"/>
<text x="89" y="122.5" class="tb" text-anchor="middle">Why</text>
<text x="89" y="140.5" text-anchor="middle">DXの背景</text>
<rect x="166" y="94" width="130" height="66" class="fas sa" stroke-width="1.5"/>
<text x="231" y="113.5" class="tb" text-anchor="middle">What</text>
<text x="231" y="131.5" text-anchor="middle">データ・技術</text>
<text x="231" y="149.5" text-anchor="middle">知っていればよい</text>
<rect x="24" y="166" width="130" height="66" class="fas sa" stroke-width="1.5"/>
<text x="89" y="185.5" class="tb" text-anchor="middle">How</text>
<text x="89" y="203.5" text-anchor="middle">利活用</text>
<text x="89" y="221.5" text-anchor="middle">手を動かせるレベル</text>
<rect x="166" y="166" width="130" height="66" class="fas sa" stroke-width="1.5"/>
<text x="231" y="194.5" class="tb" text-anchor="middle">マインド・</text>
<text x="231" y="212.5" text-anchor="middle">スタンス</text>
<rect x="24" y="242" width="272" height="44" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="259.5" text-anchor="middle">生成AI補記（2023年8月）：</text>
<text x="160" y="277.5" text-anchor="middle">マインド・スタンスに追加</text>
<rect x="12" y="310" width="296" height="306" class="fs sa" stroke-width="1.5"/>
<text x="24" y="334" class="tb">DX推進スキル標準（DSS-P）</text>
<text x="24" y="354">対象：DXを推進する専門人材</text>
<text x="24" y="378" class="tb">6つの類型</text>
<rect x="24" y="386" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="403.5" class="ton" text-anchor="middle">ビジネスアーキテクト</text>
<rect x="24" y="416" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="433.5" class="ton" text-anchor="middle">デザイナー</text>
<rect x="24" y="446" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="463.5" class="ton" text-anchor="middle">データサイエンティスト</text>
<rect x="24" y="476" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="493.5" class="ton" text-anchor="middle">データマネジメント</text>
<rect x="24" y="506" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="523.5" class="ton" text-anchor="middle">ソフトウェアエンジニア</text>
<rect x="24" y="536" width="272" height="26" class="fa" stroke-width="1.5"/>
<text x="160" y="553.5" class="ton" text-anchor="middle">サイバーセキュリティ</text>
<text x="24" y="586">類型の下に「ロール」、全類型に共通の</text>
<text x="24" y="606">「共通スキルリスト」。類型どうしは連携</text>
</svg>
