<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 436" role="img" aria-labelledby="fig-dx-dl-tradeoff-t fig-dx-dl-tradeoff-d">
<title id="fig-dx-dl-tradeoff-t">深層学習の強みと弱み：単純なモデルと比べる</title>
<desc id="fig-dx-dl-tradeoff-d">単純なモデルと深層学習を比べた図。単純なモデルは、人が選んだ特徴量（例：年収・勤続年数など）を使うので、どの特徴量でどう決めたかを追いやすい。深層学習は、多数の層をもつニューラルネットワークで、着目する特徴量を人が指示しなくても自ら作り出すので、複雑なパターンを捉えやすい（強み）。一方、どのような根拠で判断したかを人が理解しにくく、申込者への説明や誤りの点検が難しい（弱み）。作り出した特徴量は規則の一覧としては出てこず、層を増やしても根拠は見えやすくならない。性能と説明のしやすさが引っ張り合う（情報通信白書 令和元年版）。</desc>
<rect x="12" y="14" width="296" height="122" class="fs sb" stroke-width="1.5"/>
<text x="24" y="36" class="tb">単純なモデル（人が特徴量を選ぶ）</text>
<rect x="24" y="48" width="64" height="40" class="fs sa" stroke-width="1.5"/>
<text x="56" y="64" text-anchor="middle">人が選ぶ</text>
<text x="56" y="81" text-anchor="middle">特徴量</text>
<line x1="90" y1="68" x2="104" y2="68" class="l sa w2"/>
<polyline points="98,71.3 104,68 98,64.7" class="l sa w2"/>
<rect x="106" y="48" width="124" height="40" class="fs sa" stroke-width="1.5"/>
<text x="168" y="73" text-anchor="middle">単純なモデル</text>
<line x1="232" y1="68" x2="246" y2="68" class="l sa w2"/>
<polyline points="240,71.3 246,68 240,64.7" class="l sa w2"/>
<rect x="248" y="48" width="48" height="40" class="fs sa" stroke-width="1.5"/>
<text x="272" y="73" text-anchor="middle">判断</text>
<text x="24" y="106" class="tm">例：年収・勤続年数などを人が選ぶ</text>
<text x="24" y="126">どの特徴量でどう決めたかを追いやすい</text>
<rect x="12" y="148" width="296" height="224" class="fs sb" stroke-width="1.5"/>
<text x="24" y="170" class="tb">深層学習（多数の層）</text>
<rect x="24" y="182" width="64" height="40" class="fs sa" stroke-width="1.5"/>
<text x="56" y="207" text-anchor="middle">データ</text>
<line x1="90" y1="202" x2="104" y2="202" class="l sa w2"/>
<polyline points="98,205.3 104,202 98,198.7" class="l sa w2"/>
<rect x="110" y="178" width="124" height="40" class="fs sm" stroke-width="1"/>
<rect x="106" y="182" width="124" height="40" class="fas sa" stroke-width="1.5"/>
<text x="168" y="198" text-anchor="middle">多数の層で</text>
<text x="168" y="215" text-anchor="middle">特徴量を自ら作る</text>
<line x1="232" y1="202" x2="246" y2="202" class="l sa w2"/>
<polyline points="240,205.3 246,202 240,198.7" class="l sa w2"/>
<rect x="248" y="182" width="48" height="40" class="fs sa" stroke-width="1.5"/>
<text x="272" y="207" text-anchor="middle">判断</text>
<rect x="24" y="236" width="272" height="48" class="fok sok" stroke-width="1.5"/>
<text x="32" y="256">○ 人が指示しなくても特徴量を作る</text>
<text x="32" y="274" class="tb">→ 複雑なパターンを捉えやすい</text>
<rect x="24" y="294" width="272" height="68" class="fng sng" stroke-width="1.5"/>
<text x="32" y="314">✕ どう判断したか、人が理解しにくい</text>
<text x="32" y="332" class="tb">→ 説明・誤りの点検が難しい</text>
<text x="32" y="350" class="tm">層を増やしても根拠は見えやすくならない</text>
<rect x="12" y="384" width="296" height="40" class="fa" stroke-width="1.5"/>
<text x="160" y="409" class="tb ton" text-anchor="middle">性能と説明のしやすさが引っ張り合う</text>
</svg>
