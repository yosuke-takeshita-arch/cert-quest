<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="fig-dx-basic-database-t fig-dx-basic-database-d">
<title id="fig-dx-basic-database-t">データベース＝決まった形でしまい、条件で取り出す</title>
<desc id="fig-dx-basic-database-d">顧客のデータを表の形でしまったデータベースの例。列は ID・名前・住所・購入回数の4つで、行は1人分のデータ。行は4人分で、1 田中・福岡・5回、2 鈴木・東京・1回、3 佐藤・福岡・3回、4 高橋・福岡・1回。下の段で「住所が福岡で、購入回数が3回以上の人」と頼むと、条件に合う田中と佐藤の2行だけが返ってくる。表の中の田中と佐藤の行には色が付いている。名前と数は説明のための例。</desc>
<text x="12" y="22" class="tl">データベース</text>
<text x="12" y="44" class="tm">例：顧客の表（名前と数は例）</text>
<text x="12" y="68" class="tm">↓列＝項目</text>
<rect x="12" y="76" width="296" height="30" class="fs sm" stroke-width="1.5"/>
<text x="34" y="96" class="tb" text-anchor="middle">ID</text>
<text x="96" y="96" class="tb" text-anchor="middle">名前</text>
<text x="170" y="96" class="tb" text-anchor="middle">住所</text>
<text x="256" y="96" class="tb" text-anchor="middle">購入回数</text>
<rect x="12" y="106" width="296" height="30" class="fok sok" stroke-width="1.5"/>
<text x="34" y="126" text-anchor="middle">1</text>
<text x="96" y="126" text-anchor="middle">田中</text>
<text x="170" y="126" text-anchor="middle">福岡</text>
<text x="256" y="126" text-anchor="middle">5</text>
<rect x="12" y="136" width="296" height="30" class="fs sm" stroke-width="1.5"/>
<text x="34" y="156" text-anchor="middle">2</text>
<text x="96" y="156" text-anchor="middle">鈴木</text>
<text x="170" y="156" text-anchor="middle">東京</text>
<text x="256" y="156" text-anchor="middle">1</text>
<rect x="12" y="166" width="296" height="30" class="fok sok" stroke-width="1.5"/>
<text x="34" y="186" text-anchor="middle">3</text>
<text x="96" y="186" text-anchor="middle">佐藤</text>
<text x="170" y="186" text-anchor="middle">福岡</text>
<text x="256" y="186" text-anchor="middle">3</text>
<rect x="12" y="196" width="296" height="30" class="fs sm" stroke-width="1.5"/>
<text x="34" y="216" text-anchor="middle">4</text>
<text x="96" y="216" text-anchor="middle">高橋</text>
<text x="170" y="216" text-anchor="middle">福岡</text>
<text x="256" y="216" text-anchor="middle">1</text>
<line x1="56" y1="76" x2="56" y2="226" class="l sm w1"/>
<line x1="136" y1="76" x2="136" y2="226" class="l sm w1"/>
<line x1="204" y1="76" x2="204" y2="226" class="l sm w1"/>
<text x="12" y="246" class="tm">→ 横の1行＝1人分のデータ</text>
<line x1="12" y1="262" x2="308" y2="262" class="l sb w1"/>
<text x="12" y="286" class="tb">頼む：住所が福岡 かつ 購入3回以上</text>
<line x1="40" y1="296" x2="40" y2="318" class="l sm w2"/>
<polygon points="40,326 35,318 45,318" class="fm"/>
<text x="56" y="316" class="tm">条件に合う行だけを探す</text>
<rect x="12" y="330" width="296" height="54" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="24" y="352" class="tb tok">答え：2人</text>
<text x="24" y="374">1 田中（5回）、3 佐藤（3回）</text>
</svg>
