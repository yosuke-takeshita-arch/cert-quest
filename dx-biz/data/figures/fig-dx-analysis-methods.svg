<text x="54" y="563.5" text-anchor="middle">A店</text>
<rect x="84" y="548" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="114" y="563.5" text-anchor="middle">30代</text>
<rect x="144" y="548" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="174" y="563.5" text-anchor="middle">3</text>
<rect x="24" y="570" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="54" y="585.5" text-anchor="middle">A店</text>
<rect x="84" y="570" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="114" y="585.5" text-anchor="middle">40代</text>
<rect x="144" y="570" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="174" y="585.5" text-anchor="middle">5</text>
<rect x="24" y="592" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="54" y="607.5" text-anchor="middle">B店</text>
<rect x="84" y="592" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="114" y="607.5" text-anchor="middle">30代</text>
<rect x="144" y="592" width="60" height="22" class="fs sb" stroke-width="1"/>
<text x="174" y="607.5" text-anchor="middle">2</text>
<line x1="200" y1="570" x2="232" y2="570" class="l sa w2"/>
<polyline points="226,573.3 232,570 226,566.7" class="l sa w2"/>
<text x="240" y="566" class="tb">A店：8</text>
<text x="240" y="586" class="tb">B店：2</text>
<text x="24" y="634" class="tm">人が決めた項目ごとに合計する</text>
<text x="12" y="666" class="tm">まとめて、データマイニング（パターンを</text>
<text x="12" y="686" class="tm">掘り出す取り組み）の手法の例</text>
</svg>
