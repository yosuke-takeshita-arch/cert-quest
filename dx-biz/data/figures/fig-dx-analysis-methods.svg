<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 698" role="img" aria-labelledby="fig-dx-analysis-methods-t fig-dx-analysis-methods-d">
<title id="fig-dx-analysis-methods-t">分析手法の違い：回帰分析・バスケット分析・クラスタリング・グルーピング</title>
<desc id="fig-dx-analysis-methods-d">4つの分析手法を同じ形の枠で比べた図。回帰分析は、結果となる数値（目的変数）と要因となる数値（説明変数）の関係を数式モデルで表し、予測や要因分析に使う。説明変数が1つなら単回帰、2つ以上なら重回帰。バスケット分析は、レシートなど買い物かごの中身から、一緒に買われる商品の組み合わせ（例：パスタとパスタソース）を見つける。クラスタリングは、正解のラベルを与えずに、特徴が似たものどうしを自動でまとめる。グルーピングは、人が決めた項目（店舗、年代など）でデータを分けて集計する。これらはデータマイニングの手法の例。</desc>
<rect x="12" y="14" width="296" height="150" class="fs sb" stroke-width="1.5"/>
<text x="24" y="36" class="tb">1　回帰分析：式で表して予測する</text>
<circle cx="64" cy="106" r="3" class="fa"/>
<circle cx="82" cy="96" r="3" class="fa"/>
<circle cx="96" cy="98" r="3" class="fa"/>
<circle cx="112" cy="82" r="3" class="fa"/>
<circle cx="128" cy="84" r="3" class="fa"/>
<circle cx="144" cy="68" r="3" class="fa"/>
<circle cx="158" cy="64" r="3" class="fa"/>
<circle cx="174" cy="52" r="3" class="fa"/>
<line x1="46" y1="120" x2="170" y2="66" class="l sok w2"/>
<line x1="32" y1="138" x2="176" y2="138" class="l sm w1"/>
<text x="32" y="156" class="tm">要因（説明変数）</text>
<text x="190" y="70" class="tm">結果（目的変数）</text>
<text x="190" y="92">説明変数が</text>
<text x="190" y="112">1つ→単回帰</text>
<text x="190" y="132">2つ以上→重回帰</text>
<rect x="12" y="174" width="296" height="150" class="fs sb" stroke-width="1.5"/>
<text x="24" y="196" class="tb">2　バスケット分析：買い合わせ</text>
<rect x="24" y="208" width="84" height="80" class="fs sm" stroke-width="1"/>
<text x="66" y="226" class="tm" text-anchor="middle">レシート1</text>
<text x="66" y="246" text-anchor="middle">パスタ</text>
<text x="66" y="262" text-anchor="middle">パスタソース</text>
<text x="66" y="278" text-anchor="middle">牛乳</text>
<rect x="116" y="208" width="84" height="80" class="fs sm" stroke-width="1"/>
<text x="158" y="226" class="tm" text-anchor="middle">レシート2</text>
<text x="158" y="246" text-anchor="middle">パスタ</text>
<text x="158" y="262" text-anchor="middle">パスタソース</text>
<rect x="208" y="208" width="84" height="80" class="fs sm" stroke-width="1"/>
<text x="250" y="226" class="tm" text-anchor="middle">レシート3</text>
<text x="250" y="246" text-anchor="middle">牛乳</text>
<text x="250" y="262" text-anchor="middle">パン</text>
<text x="24" y="310" class="tb">パスタとパスタソースが一緒に買われる</text>
<rect x="12" y="334" width="296" height="150" class="fs sb" stroke-width="1.5"/>
<text x="24" y="356" class="tb">3　クラスタリング：自動でまとめる</text>
<ellipse cx="80" cy="424" rx="50" ry="34" class="fas sa" stroke-width="1.5"/>
<ellipse cx="210" cy="414" rx="56" ry="38" class="fwn swn" stroke-width="1.5"/>
<circle cx="56" cy="416" r="3" class="fa"/>
<circle cx="72" cy="434" r="3" class="fa"/>
<circle cx="88" cy="418" r="3" class="fa"/>
<circle cx="96" cy="434" r="3" class="fa"/>
<circle cx="70" cy="424" r="3" class="fa"/>
<circle cx="190" cy="404" r="3" class="fa"/>
<circle cx="206" cy="422" r="3" class="fa"/>
<circle cx="222" cy="406" r="3" class="fa"/>
<circle cx="232" cy="426" r="3" class="fa"/>
<circle cx="212" cy="410" r="3" class="fa"/>
<text x="24" y="476" class="tm">正解のラベルは与えない</text>
<rect x="12" y="494" width="296" height="150" class="fs sb" stroke-width="1.5"/>
<text x="24" y="516" class="tb">4　グルーピング：決めた項目で分ける</text>
<rect x="24" y="526" width="60" height="22" class="fas sa" stroke-width="1"/>
<text x="54" y="541.5" class="tb" text-anchor="middle">店舗</text>
