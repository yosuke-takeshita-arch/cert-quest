<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 492" role="img" aria-labelledby="fig-dx-user-vendor-cocreation-t fig-dx-user-vendor-cocreation-d">
<title id="fig-dx-user-vendor-cocreation-t">ユーザー企業とベンダー企業：低位安定から共創へ</title>
<desc id="fig-dx-user-vendor-cocreation-d">上の段はこれまでの関係。ユーザー企業はITをコストとみて、ベンダー企業に任せる。ベンダー企業は労働量で値付けする受託開発型。DXレポート2.1は、両者は一見Win-Winだが、ともにデジタル時代の能力を得られない低位安定の相互依存関係にあると指摘した。下の段は目指す姿。DXレポート2は、ユーザー企業はラン・ザ・ビジネス（現行ビジネスの維持）からバリューアップへ軸足を移し、ベンダー企業は受託開発型から、共創パートナー・技術の提供主体・共通プラットフォームの提供主体・新ビジネスの提供主体へ変わるべきとした。DXレポート2.1は、両者の垣根がなくなるデジタル産業を目指す姿として示した。</desc>
<text x="12" y="22" class="tb">これまで：低位安定の相互依存</text>
<rect x="6" y="36" width="122" height="64" class="fwn l swn"/>
<text x="67" y="58" class="tb" text-anchor="middle">ユーザー企業</text>
<text x="67" y="78" text-anchor="middle">ITはコスト</text>
<text x="67" y="94" text-anchor="middle">とみる</text>
<rect x="192" y="36" width="122" height="64" class="fwn l swn"/>
<text x="253" y="58" class="tb" text-anchor="middle">ベンダー企業</text>
<text x="253" y="78" text-anchor="middle">労働量で値付け</text>
<text x="253" y="94" text-anchor="middle">（受託開発型）</text>
<line x1="130" y1="68" x2="188" y2="68" class="l sm w2"/>
<polyline points="182,63 188,68 182,73" class="l sm w2"/>
<text x="160" y="58" class="tm" text-anchor="middle">任せる</text>
<text x="12" y="126">一見 Win-Win だが、どちらも</text>
<text x="12" y="144" class="tng">デジタル時代の能力を得られない</text>
<text x="12" y="162" class="tm">（DXレポート2.1）</text>
<line x1="160" y1="176" x2="160" y2="204" class="l sa w2"/>
<polyline points="155,198 160,204 165,198" class="l sa w2"/>
<text x="12" y="230" class="tb">目指す姿：共にDXを進めるパートナー</text>
<rect x="6" y="244" width="122" height="88" class="fok l sok"/>
<text x="67" y="266" class="tb" text-anchor="middle">ユーザー企業</text>
<text x="67" y="290" text-anchor="middle">ラン・ザ・</text>
<text x="67" y="308" text-anchor="middle">ビジネスから</text>
<text x="67" y="326" text-anchor="middle">バリューアップへ</text>
<rect x="192" y="244" width="122" height="88" class="fok l sok"/>
<text x="253" y="266" class="tb" text-anchor="middle">ベンダー企業</text>
<text x="253" y="290" text-anchor="middle">受託開発型から</text>
<text x="253" y="308" text-anchor="middle">共創パートナー</text>
<text x="253" y="326" text-anchor="middle">などへ</text>
<line x1="130" y1="288" x2="188" y2="288" class="l sa w2"/>
<polyline points="182,283 188,288 182,293" class="l sa w2"/>
<polyline points="136,283 130,288 136,293" class="l sa w2"/>
<text x="160" y="312" class="ta tb" text-anchor="middle">共創</text>
<line x1="12" y1="350" x2="308" y2="350" class="l sb w1"/>
<text x="12" y="374">ラン・ザ・ビジネス＝現行ビジネスの維持</text>
<text x="12" y="398">ベンダー企業の行き先（DXレポート2）：</text>
<text x="12" y="416">共創パートナー・技術の提供主体・共通</text>
<text x="12" y="434">プラットフォームの提供主体・新ビジネスの</text>
<text x="12" y="452">提供主体</text>
<text x="12" y="478" class="tm">その先：両者の垣根がなくなる「デジタル産業」</text>
</svg>
