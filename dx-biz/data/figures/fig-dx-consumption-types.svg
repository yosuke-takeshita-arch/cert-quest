<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 318" role="img" aria-labelledby="fig-dx-consumption-types-t fig-dx-consumption-types-d">
<title id="fig-dx-consumption-types-t">モノ消費・コト消費・トキ消費・イミ消費</title>
<desc id="fig-dx-consumption-types-d">4つの消費の形を、何にお金を使うかで比べた表。モノ消費は、モノ（商品）を買って所有する。コト消費は、旅行・習い事・芸術鑑賞などの機会やサービス（体験）を消費する。トキ消費は、その時その場所でしか体験できないスポーツイベントやフェスなどで、感動を他の参加者と共有し、一体感を得る。イミ消費は、買うことが社会や自分自身に良い影響を与えられるかという意味に価値を置く消費で、環境に配慮したサステナブル商品などが対象になる。トキ消費は消費者白書（令和4年版）が若者に特徴的な消費形態とし、イミ消費は令和7年版消費者白書の紹介資料が若者世代で重視されるとしている。</desc>
<rect x="12" y="14" width="296" height="58" class="fs sb" stroke-width="1.5"/>
<text x="24" y="40" class="tb">モノ消費</text>
<text x="100" y="40" class="tm">例：商品を買う</text>
<text x="24" y="64">モノを買って、所有する</text>
<rect x="12" y="80" width="296" height="58" class="fas sa" stroke-width="1.5"/>
<text x="24" y="106" class="tb">コト消費</text>
<text x="100" y="106" class="tm">例：旅行・習い事・芸術鑑賞</text>
<text x="24" y="130">体験・サービスにお金を使う</text>
<rect x="12" y="146" width="296" height="78" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="172" class="tb">トキ消費</text>
<text x="100" y="172" class="tm">例：スポーツイベント・フェス</text>
<text x="24" y="196">その時その場所だけの体験を、</text>
<text x="24" y="216">他の参加者と共有する</text>
<rect x="12" y="232" width="296" height="78" class="fok sok" stroke-width="1.5"/>
<text x="24" y="258" class="tb">イミ消費</text>
<text x="100" y="258" class="tm">例：環境に配慮した商品</text>
<text x="24" y="282">買うことが、社会や自分に</text>
<text x="24" y="302">良い影響を与えるか</text>
</svg>
