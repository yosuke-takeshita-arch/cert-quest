<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 434" role="img" aria-labelledby="fig-dx-network-compare-t fig-dx-network-compare-d">
<title id="fig-dx-network-compare-t">5GとLPWAの特長の違い</title>
<desc id="fig-dx-network-compare-d">5G（第5世代移動通信システム）とLPWA（Low Power Wide Area）を、速さ・電池の持ち・届く距離の3つで比べた棒の図。速さは、5Gが超高速・大容量で棒が長く、LPWAは数kbpsから数百kbpsと遅いので棒が短い。電池の持ちは、LPWAが一般的な電池で数年から数十年運用できて棒が長い。届く距離は、LPWAが数kmから数十km。5Gの電池と距離は、参照した資料に比べる記載がないので、破線の空欄にした。5Gは超低遅延、多数同時接続も特長で、用途は高精細な映像配信、自動運転や遠隔操作、大量のIoT機器。LPWAは水道設備の稼働監視などインフラの見守りに使われる。速さを求めるなら5G、電池の持ちと届く距離を求めるならLPWAと使い分ける。</desc>
<text x="12" y="22" class="tb">速さ・電池・距離で比べる</text>
<text x="12" y="50" class="tb">速さ</text>
<text x="12" y="75" class="tm">5G</text>
<text x="12" y="103" class="tm">LPWA</text>
<rect x="52" y="60" width="256" height="24" class="fwn swn" stroke-width="1.5"/>
<text x="180" y="77" class="tb" text-anchor="middle">超高速・大容量</text>
<rect x="52" y="88" width="22" height="24" class="fas sa" stroke-width="1.5"/>
<text x="82" y="105" class="tm">数kbps〜数百kbps（遅い）</text>
<text x="12" y="142" class="tb">電池の持ち</text>
<text x="12" y="167" class="tm">5G</text>
<text x="12" y="195" class="tm">LPWA</text>
<rect x="52" y="152" width="256" height="24" class="fs sm dsh" stroke-width="1.5"/>
<text x="180" y="169" class="tm" text-anchor="middle">比べる記載なし</text>
<rect x="52" y="180" width="256" height="24" class="fas sa" stroke-width="1.5"/>
<text x="180" y="197" class="tb" text-anchor="middle">数年〜数十年</text>
<text x="12" y="234" class="tb">届く距離</text>
<text x="12" y="259" class="tm">5G</text>
<text x="12" y="287" class="tm">LPWA</text>
<rect x="52" y="244" width="256" height="24" class="fs sm dsh" stroke-width="1.5"/>
<text x="180" y="261" class="tm" text-anchor="middle">比べる記載なし</text>
<rect x="52" y="272" width="256" height="24" class="fas sa" stroke-width="1.5"/>
<text x="180" y="289" class="tb" text-anchor="middle">数km〜数十km</text>
<line x1="12" y1="306" x2="308" y2="306" class="l sb w1"/>
<text x="12" y="330">5Gは、超低遅延・多数同時接続も特長</text>
<text x="12" y="350" class="tm">例：映像配信、自動運転、大量のIoT機器</text>
<text x="12" y="370" class="tm">LPWAの例：水道設備の稼働監視</text>
<text x="12" y="400" class="tb">使い分け：速さなら5G</text>
<text x="12" y="422" class="tb">電池の持ちと距離ならLPWA</text>
</svg>
