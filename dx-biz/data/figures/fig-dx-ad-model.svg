<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 406" role="img" aria-labelledby="fig-dx-ad-model-t fig-dx-ad-model-d">
<title id="fig-dx-ad-model-t">広告モデルとリスティング広告</title>
<desc id="fig-dx-ad-model-d">上：広告モデルの3者。利用者は無料でサービスを使う。サービス運営者は、利用者の注目が集まる場所に広告を載せ、広告主から広告料を受け取る。利用者の注目が広告主へ届く。使う人と払う人が違う。下：リスティング広告は、検索したキーワードに連動して、検索結果と一緒に表示される広告で、クリックされたときに費用がかかる方式が多い。検索画面の模式図では、検索結果の上部に広告が出る。</desc>
<text x="12" y="22" class="tb">広告モデル：使う人と払う人が違う</text>
<rect x="12" y="28" width="68" height="64" class="fok sok" stroke-width="1.5"/>
<text x="46" y="55" class="tb" text-anchor="middle">利用者</text>
<text x="46" y="74" text-anchor="middle">（無料）</text>
<rect x="126" y="28" width="68" height="64" class="fa" stroke-width="1.5"/>
<text x="160" y="55" class="tb ton" text-anchor="middle">サービス</text>
<text x="160" y="74" class="ton" text-anchor="middle">運営者</text>
<rect x="240" y="28" width="68" height="64" class="fwn swn" stroke-width="1.5"/>
<text x="274" y="64.5" class="tb" text-anchor="middle">広告主</text>
<line x1="82" y1="68" x2="124" y2="68" class="l sok w2"/>
<polyline points="119,70.75 124,68 119,65.25" class="l sok w2"/>
<text x="103" y="60" class="tm" text-anchor="middle">利用</text>
<line x1="196" y1="52" x2="238" y2="52" class="l sa w2"/>
<polyline points="233,54.75 238,52 233,49.25" class="l sa w2"/>
<text x="217" y="44" class="tm" text-anchor="middle">注目</text>
<line x1="238" y1="74" x2="196" y2="74" class="l swn w2"/>
<polyline points="201,71.25 196,74 201,76.75" class="l swn w2"/>
<text x="217" y="90" class="tm" text-anchor="middle">広告料</text>
<text x="12" y="114">利用者の注目が集まる場所に、広告を載せる</text>
<text x="12" y="134">広告主が広告料を払い、利用者は無料</text>
<line x1="12" y1="148" x2="308" y2="148" class="l sb w1"/>
<text x="12" y="170" class="tb">リスティング広告：検索に連動する</text>
<rect x="12" y="184" width="296" height="168" class="fs sm" stroke-width="1.5"/>
<rect x="24" y="196" width="200" height="26" class="fs sb" stroke-width="1"/>
<text x="32" y="214">引っ越し 見積もり</text>
<rect x="232" y="196" width="64" height="26" class="fas sa" stroke-width="1"/>
<text x="264" y="214" class="tb" text-anchor="middle">検索</text>
<rect x="24" y="232" width="272" height="40" class="fwn swn" stroke-width="1.5"/>
<text x="32" y="250" class="tb">広告</text>
<text x="32" y="266" class="tm">キーワードに連動して表示</text>
<rect x="24" y="280" width="272" height="30" class="fs sb" stroke-width="1"/>
<text x="32" y="300" class="tm">検索結果</text>
<rect x="24" y="314" width="272" height="28" class="fs sb" stroke-width="1"/>
<text x="32" y="333" class="tm">検索結果</text>
<text x="12" y="374" class="tb">広告がクリックされたときに費用がかかる</text>
<text x="12" y="394" class="tb">方式が多い</text>
</svg>
