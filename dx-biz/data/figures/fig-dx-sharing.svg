<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="fig-dx-sharing-t fig-dx-sharing-d">
<title id="fig-dx-sharing-t">シェアリング：貸す側・借りる側・事業者の間で何が動くか</title>
<desc id="fig-dx-sharing-d">上に事業者（マッチングの場）、左下に貸す側の個人等、右下に借りる側の個人等。事業者は両者をつなぐ。貸す側は、使っていない資産（部屋・車・スキル・時間など、形の無いものも含む）を借りる側に使わせ、借りる側は代金を払う。貸す側はその代金で収入を得て、借りる側は所有しなくても使える。事業者は自ら資産を持たず、場を提供して手数料を得ることが多い。信頼を支えるのは相互評価（レビュー）と本人確認。下は比べる相手のレンタルで、レンタル会社が自社の資産を貸す。</desc>
<text x="12" y="22" class="tb">誰から誰へ、何が動くか</text>
<rect x="90" y="36" width="140" height="48" class="fa l sa"/>
<text x="160" y="56" class="tb ton" text-anchor="middle">事業者</text>
<text x="160" y="75" class="ton" text-anchor="middle">マッチングの場</text>
<rect x="6" y="176" width="104" height="48" class="fwn l swn"/>
<text x="58" y="196" class="tb" text-anchor="middle">貸す側</text>
<text x="58" y="215" text-anchor="middle">個人等</text>
<rect x="210" y="176" width="104" height="48" class="fok l sok"/>
<text x="262" y="196" class="tb" text-anchor="middle">借りる側</text>
<text x="262" y="215" text-anchor="middle">個人等</text>
<line x1="110" y1="84" x2="58" y2="174" class="l sm w1 dsh"/>
<line x1="210" y1="84" x2="262" y2="174" class="l sm w1 dsh"/>
<text x="38" y="118" class="tm">つなぐ</text>
<text x="246" y="118" class="tm">つなぐ</text>
<line x1="112" y1="188" x2="206" y2="188" class="l swn w2"/>
<polyline points="200,183 206,188 200,193" class="l swn w2"/>
<text x="160" y="172" text-anchor="middle">資産を使わせる</text>
<line x1="206" y1="212" x2="112" y2="212" class="l sok w2"/>
<polyline points="118,207 112,212 118,217" class="l sok w2"/>
<text x="160" y="238" text-anchor="middle">代金</text>
<line x1="160" y1="150" x2="160" y2="88" class="l sa w2"/>
<polyline points="155,94 160,88 165,94" class="l sa w2"/>
<text x="166" y="128" class="ta tb">手数料</text>
<line x1="12" y1="258" x2="308" y2="258" class="l sb w1"/>
<text x="12" y="282">資産＝部屋・車・スキル・時間など</text>
<text x="12" y="300" class="tm">（形の無いものも含む）</text>
<text x="12" y="324"><tspan class="tb">貸す側</tspan>：使っていない資産で収入を得る</text>
<text x="12" y="346"><tspan class="tb">借りる側</tspan>：持たなくても使える</text>
<text x="12" y="368"><tspan class="tb">事業者</tspan>：自ら資産を持たず、場を</text>
<text x="12" y="386">　　　　提供して手数料を得ることが多い</text>
<text x="12" y="408"><tspan class="tb">信頼の支え</tspan>：相互評価（レビュー）・本人確認</text>
<line x1="12" y1="426" x2="308" y2="426" class="l sb w1"/>
<text x="12" y="450" class="tb">比べる：レンタル</text>
<rect x="6" y="462" width="128" height="44" class="fs l sm"/>
<text x="70" y="481" class="tb" text-anchor="middle">レンタル会社</text>
<text x="70" y="499" text-anchor="middle">自社の資産</text>
<line x1="136" y1="484" x2="200" y2="484" class="l sm w2"/>
<polyline points="194,479 200,484 194,489" class="l sm w2"/>
<text x="168" y="476" class="tm" text-anchor="middle">貸す</text>
<rect x="204" y="462" width="110" height="44" class="fs l sm"/>
<text x="259" y="489" text-anchor="middle">借りる人</text>
</svg>
