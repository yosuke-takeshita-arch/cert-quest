<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 461" role="img" aria-labelledby="fig-dx-silo-t fig-dx-silo-d">
<title id="fig-dx-silo-t">部門ごとの個別最適と、全社最適のITシステム</title>
<desc id="fig-dx-silo-d">上：個別最適。事業部門A・B・Cがそれぞれ別のシステムを持ち、部門の間に壁があってデータがつながらない。継ぎ足しで複雑化・ブラックボックス化する。下：全社最適。各部門のシステムが共通の連携基盤（全体設計＝アーキテクチャ）につながり、データが全社で行き来する。2025年の崖は、複雑化・老朽化・ブラックボックス化した既存システムがDXの障害になるという、DXレポート（2018年9月）の警告。</desc>
<text x="12" y="22" class="tb">個別最適：部門ごとにばらばら</text>
<rect x="12" y="36" width="92" height="60" class="fng sng" stroke-width="1.5"/>
<text x="58" y="61" class="tb" text-anchor="middle">A部門</text>
<text x="58" y="80" text-anchor="middle">別のシステム</text>
<rect x="114" y="36" width="92" height="60" class="fng sng" stroke-width="1.5"/>
<text x="160" y="61" class="tb" text-anchor="middle">B部門</text>
<text x="160" y="80" text-anchor="middle">別のシステム</text>
<rect x="216" y="36" width="92" height="60" class="fng sng" stroke-width="1.5"/>
<text x="262" y="61" class="tb" text-anchor="middle">C部門</text>
<text x="262" y="80" text-anchor="middle">別のシステム</text>
<line x1="106" y1="32" x2="106" y2="100" class="l sng w2 dsh"/>
<line x1="208" y1="32" x2="208" y2="100" class="l sng w2 dsh"/>
<line x1="58" y1="96" x2="58" y2="114" class="l sm w1"/>
<line x1="160" y1="96" x2="160" y2="114" class="l sm w1"/>
<line x1="262" y1="96" x2="262" y2="114" class="l sm w1"/>
<path d="M58 114 L160 136 L262 114 M58 136 L160 114 L262 136" class="l sng w1"/>
<text x="160" y="160" class="tm" text-anchor="middle">継ぎ足しで複雑化・ブラックボックス化</text>
<text x="160" y="176" class="tm" text-anchor="middle">データは部門の外へ出ない</text>
<line x1="12" y1="190" x2="308" y2="190" class="l sb w1"/>
<text x="12" y="212" class="tb">全社最適：共通の基盤でつなぐ</text>
<rect x="12" y="228" width="92" height="44" class="fok sok" stroke-width="1.5"/>
<text x="58" y="245.5" class="tb" text-anchor="middle">A部門</text>
<text x="58" y="263.5" text-anchor="middle">システム</text>
<line x1="58" y1="302" x2="58" y2="276" class="l sok w2"/>
<polyline points="61.85,283 58,276 54.15,283" class="l sok w2"/>
<line x1="42" y1="276" x2="42" y2="302" class="l sok w2"/>
<polyline points="38.15,295 42,302 45.85,295" class="l sok w2"/>
<rect x="114" y="228" width="92" height="44" class="fok sok" stroke-width="1.5"/>
<text x="160" y="245.5" class="tb" text-anchor="middle">B部門</text>
<text x="160" y="263.5" text-anchor="middle">システム</text>
<line x1="160" y1="302" x2="160" y2="276" class="l sok w2"/>
<polyline points="163.85,283 160,276 156.15,283" class="l sok w2"/>
<line x1="144" y1="276" x2="144" y2="302" class="l sok w2"/>
<polyline points="140.15,295 144,302 147.85,295" class="l sok w2"/>
<rect x="216" y="228" width="92" height="44" class="fok sok" stroke-width="1.5"/>
<text x="262" y="245.5" class="tb" text-anchor="middle">C部門</text>
<text x="262" y="263.5" text-anchor="middle">システム</text>
<line x1="262" y1="302" x2="262" y2="276" class="l sok w2"/>
<polyline points="265.85,283 262,276 258.15,283" class="l sok w2"/>
<line x1="246" y1="276" x2="246" y2="302" class="l sok w2"/>
<polyline points="242.15,295 246,302 249.85,295" class="l sok w2"/>
<rect x="12" y="302" width="296" height="62" class="fas sa" stroke-width="1.5"/>
<text x="160" y="318.5" class="tb" text-anchor="middle">共通の連携基盤</text>
<text x="160" y="337.5" text-anchor="middle">全体設計（アーキテクチャ）</text>
<text x="160" y="356.5" text-anchor="middle">データが全社で行き来する</text>
<line x1="12" y1="388" x2="308" y2="388" class="l sb w1"/>
<text x="12" y="410" class="tb">2025年の崖（DXレポート 2018年9月）</text>
<text x="12" y="430">上の状態のまま老朽化したシステムが</text>
<text x="12" y="449">残ると、DXの障害になるという警告</text>
</svg>
