<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 524" role="img" aria-labelledby="fig-dx-zero-trust-t fig-dx-zero-trust-d">
<title id="fig-dx-zero-trust-t">境界型セキュリティとゼロトラスト</title>
<desc id="fig-dx-zero-trust-d">上：境界型セキュリティ。社内ネットワークを壁で囲み、内側は信頼する前提で、入口の門でだけ確認する。内側に入った後は確認が省かれる。下：ゼロトラスト。境界の内側も侵害されうると想定し、社内・社外・クラウドの区別なく、システムやサービスへのアクセス要求のたびに確認し、必要最小限の権限でアクセスを制御する。デジタル庁は、ゼロトラストは境界型セキュリティの対策を否定するものではないとしている。</desc>
<text x="12" y="22" class="tb">境界型：入口だけ確認する</text>
<rect x="12" y="34" width="296" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="55.5" text-anchor="middle">外部からのアクセス</text>
<line x1="160" y1="70" x2="160" y2="96" class="l sm w2"/>
<polyline points="156.15,89 160,96 163.85,89" class="l sm w2"/>
<rect x="12" y="98" width="296" height="24" class="fwn swn" stroke-width="2.5"/>
<text x="160" y="115" class="tb" text-anchor="middle">入口の門で確認</text>
<rect x="12" y="122" width="296" height="84" class="fs swn" stroke-width="2.5"/>
<rect x="24" y="134" width="80" height="32" class="fwn swn" stroke-width="1.5"/>
<text x="64" y="154.5" text-anchor="middle">システムA</text>
<rect x="116" y="134" width="80" height="32" class="fwn swn" stroke-width="1.5"/>
<text x="156" y="154.5" text-anchor="middle">システムB</text>
<rect x="208" y="134" width="80" height="32" class="fwn swn" stroke-width="1.5"/>
<text x="248" y="154.5" text-anchor="middle">システムC</text>
<text x="160" y="190" text-anchor="middle">内側は信用する前提で、確認を省く</text>
<line x1="12" y1="228" x2="308" y2="228" class="l sb w1"/>
<text x="12" y="250" class="tb">ゼロトラスト：アクセスのたびに確認する</text>
<rect x="12" y="262" width="92" height="32" class="fs sm" stroke-width="1.5"/>
<text x="58" y="282.5" text-anchor="middle">社内</text>
<line x1="58" y1="294" x2="58" y2="318" class="l sm w2"/>
<polyline points="54.7,312 58,318 61.3,312" class="l sm w2"/>
<rect x="12" y="320" width="92" height="24" class="fa"/>
<text x="58" y="337" class="tb ton" text-anchor="middle">確認</text>
<line x1="58" y1="344" x2="58" y2="366" class="l sa w2"/>
<polyline points="54.7,360 58,366 61.3,360" class="l sa w2"/>
<rect x="12" y="368" width="92" height="32" class="fok sok" stroke-width="1.5"/>
<text x="58" y="388.5" text-anchor="middle">システムA</text>
<rect x="114" y="262" width="92" height="32" class="fs sm" stroke-width="1.5"/>
<text x="160" y="282.5" text-anchor="middle">社外</text>
<line x1="160" y1="294" x2="160" y2="318" class="l sm w2"/>
<polyline points="156.7,312 160,318 163.3,312" class="l sm w2"/>
<rect x="114" y="320" width="92" height="24" class="fa"/>
<text x="160" y="337" class="tb ton" text-anchor="middle">確認</text>
<line x1="160" y1="344" x2="160" y2="366" class="l sa w2"/>
<polyline points="156.7,360 160,366 163.3,360" class="l sa w2"/>
<rect x="114" y="368" width="92" height="32" class="fok sok" stroke-width="1.5"/>
<text x="160" y="388.5" text-anchor="middle">システムB</text>
<rect x="216" y="262" width="92" height="32" class="fs sm" stroke-width="1.5"/>
<text x="262" y="282.5" text-anchor="middle">クラウド</text>
<line x1="262" y1="294" x2="262" y2="318" class="l sm w2"/>
<polyline points="258.7,312 262,318 265.3,312" class="l sm w2"/>
<rect x="216" y="320" width="92" height="24" class="fa"/>
<text x="262" y="337" class="tb ton" text-anchor="middle">確認</text>
<line x1="262" y1="344" x2="262" y2="366" class="l sa w2"/>
<polyline points="258.7,360 262,366 265.3,360" class="l sa w2"/>
<rect x="216" y="368" width="92" height="32" class="fok sok" stroke-width="1.5"/>
<text x="262" y="388.5" text-anchor="middle">システムC</text>
<text x="12" y="422">内側も侵害されうると想定し、</text>
<text x="12" y="442">必要最小限の権限だけを渡す</text>
<line x1="12" y1="468" x2="308" y2="468" class="l sb w1"/>
<text x="12" y="492" class="tm">ゼロトラストは境界型の対策を</text>
<text x="12" y="512" class="tm">否定するものではない（デジタル庁）</text>
</svg>
