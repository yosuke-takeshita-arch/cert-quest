<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 386" role="img" aria-labelledby="fig-dx-monotaro-cycle-t fig-dx-monotaro-cycle-d">
<title id="fig-dx-monotaro-cycle-t">MonotaRO の成長の循環：品ぞろえと物流→見つかる・早く届く→接点が広がる→合った提案→また投資</title>
<desc id="fig-dx-monotaro-cycle-d">何のための図か：MonotaRO の事業概要が示す成長の循環（Growth - Development Cycle）を、4つの段の輪で見る。①品ぞろえの拡大と物流機能への投資。②検索で見つかる言葉（検索ワード）が増え、納期で有利な商品が増える。③顧客・拠点・企業との接点が広がる。④業種・部署・職種や商品の用途など、業務に合った提案（探しやすさ、購入のワークフロー）が増える。それがまた品ぞろえと物流への投資を進める、強め合う輪。同社は誰でもいつでも同じ値段で買える一物一価を掲げ、営業担当者の知見に頼る販売をデータベースマーケティングで代えるとしている。</desc>
<text x="12" y="20" class="tb">品ぞろえと物流から始まる、強め合う輪</text>
<text x="12" y="42" class="tm">MonotaRO 事業概要の『成長の循環』</text>
<rect x="12" y="56" width="132" height="66" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="78" y="85" text-anchor="middle">① 品ぞろえと</text>
<text x="78" y="103" text-anchor="middle">物流に投資する</text>
<rect x="176" y="56" width="132" height="66" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="242" y="76" text-anchor="middle">② 検索で見つかる</text>
<text x="242" y="94" text-anchor="middle">商品・納期で</text>
<text x="242" y="112" text-anchor="middle">有利な商品が増える</text>
<rect x="176" y="172" width="132" height="66" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="242" y="201" text-anchor="middle">③ 顧客や企業との</text>
<text x="242" y="219" text-anchor="middle">接点が広がる</text>
<rect x="12" y="172" width="132" height="66" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="78" y="201" text-anchor="middle">④ 業務に合った</text>
<text x="78" y="219" text-anchor="middle">提案が増える</text>
<line x1="146" y1="89" x2="168" y2="89" class="l sa w2"/>
<polyline points="167,84 174,89 167,94" class="l sa w2" fill="none"/>
<line x1="242" y1="124" x2="242" y2="164" class="l sa w2"/>
<polyline points="237,163 242,170 247,163" class="l sa w2" fill="none"/>
<line x1="174" y1="205" x2="152" y2="205" class="l sa w2"/>
<polyline points="153,200 146,205 153,210" class="l sa w2" fill="none"/>
<line x1="78" y1="170" x2="78" y2="130" class="l sa w2"/>
<polyline points="73,131 78,124 83,131" class="l sa w2" fill="none"/>
<text x="160" y="144" class="tm" text-anchor="middle">回るほど</text>
<text x="160" y="160" class="tm" text-anchor="middle">強め合う</text>
<text x="12" y="264" class="tb ta">④ の提案が、また ① の投資を進める</text>
<line x1="12" y1="276" x2="308" y2="276" class="l sb w1"/>
<text x="12" y="300" class="tb tng">この輪に無いもの</text>
<text x="12" y="318" class="tm">× 顧客ごとに値段を変える（同社は一物一価）</text>
<text x="12" y="336" class="tm">× 営業担当者を増やして大口を回る</text>
<text x="12" y="354" class="tm">　（同社はデータで営業担当者を代える）</text>
<text x="12" y="372" class="tm">× 品ぞろえを売れ筋に絞る</text>
</svg>
