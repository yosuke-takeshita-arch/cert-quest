<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 448" role="img" aria-labelledby="fig-dx-data-portability-t fig-dx-data-portability-d">
<title id="fig-dx-data-portability-t">データを持ち出せないとロックイン。データ・ポータビリティで壁が下がる</title>
<desc id="fig-dx-data-portability-d">何のための図か：長年の投稿を積み上げたSNSの利用者が乗り換えにくい状態と、データ・ポータビリティでそれが和らぐ流れを、公正取引委員会の「データと競争政策に関する検討会 報告書」の説明で比べる。上：投稿履歴などのデータが事業者に集まり、他へ持ち出せないと、乗り換えが難しくなる（ロックイン効果）。下：データ・ポータビリティは、個人の投稿内容や利用履歴等のデータを、本人の指示に基づき本人またはその指定する者に引き渡すこと。これが認められていれば、ロックイン効果は緩和されうる。ただし、ネットワーク効果が強い場合などは、緩和の程度に濃淡がある。出力機能の廃止や会員特典を厚くすることは、離れにくさを強める向き。</desc>
<text x="12" y="20" class="tb">データを持ち出せるかで、乗り換えやすさが</text>
<text x="12" y="40" class="tb">変わる</text>
<text x="12" y="70" class="tb tng">A 持ち出せない</text>
<rect x="12" y="80" width="120" height="56" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="72" y="104" text-anchor="middle" class="tb">X社のSNS</text>
<text x="72" y="122" text-anchor="middle" class="tm">長年の投稿</text>
<rect x="188" y="80" width="120" height="56" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="248" y="104" text-anchor="middle" class="tb">ほかのSNS</text>
<text x="248" y="122" text-anchor="middle" class="tm"></text>
<line x1="134" y1="108" x2="186" y2="108" class="l sng w2 dsh"/>
<text x="160" y="102" class="tng tb" text-anchor="middle">×</text>
<text x="12" y="160" class="tb tng">→ 乗り換えにくい（ロックイン効果）</text>
<text x="12" y="190" class="tb tok">B データ・ポータビリティ</text>
<rect x="12" y="200" width="108" height="56" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="66" y="224" text-anchor="middle" class="tb">X社のSNS</text>
<text x="66" y="242" text-anchor="middle" class="tm">長年の投稿</text>
<rect x="200" y="200" width="108" height="56" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="254" y="224" text-anchor="middle" class="tb">ほかのSNS</text>
<text x="254" y="242" text-anchor="middle" class="tm">投稿が届く</text>
<line x1="122" y1="234" x2="192" y2="234" class="l sa w2"/>
<polyline points="191,229 198,234 191,239" class="l sa w2" fill="none"/>
<text x="160" y="220" class="tm" text-anchor="middle">本人の指示</text>
<text x="12" y="280" class="tm">投稿や利用履歴を、本人の指示で本人か</text>
<text x="12" y="298" class="tm">本人が指定する者に引き渡す</text>
<text x="12" y="320" class="tb tok">→ 乗り換えの壁が下がる</text>
<text x="12" y="340" class="tb tok">　（ロックインが和らぐ）</text>
<text x="12" y="362" class="tm">ただし、ネットワーク効果が強いと和らぐ程度は</text>
<text x="12" y="380" class="tm">小さいこともある（報告書）</text>
<line x1="12" y1="392" x2="308" y2="392" class="l sb w1"/>
<text x="12" y="416" class="tm tng">× 出力機能の廃止・会員特典を厚くする</text>
<text x="12" y="434" class="tm tng">　→ 離れにくさを強める向き</text>
</svg>
