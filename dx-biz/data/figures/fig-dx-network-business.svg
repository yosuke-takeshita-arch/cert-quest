<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 624" role="img" aria-labelledby="fig-dx-network-business-t fig-dx-network-business-d">
<title id="fig-dx-network-business-t">「ネットワークビジネス」の2つの意味</title>
<desc id="fig-dx-network-business-d">同じ「ネットワークビジネス」という語に、文脈で2つの意味があることを並べた図。意味1は、利用者や参加者が増えるほどサービスの価値が上がり、さらに利用者が集まる、というくり返しが働く事業。情報通信白書（令和7年版）は、このネットワーク効果を巨大プラットフォーム事業者が伸びた背景に挙げている。意味2は連鎖販売取引（いわゆるマルチ商法）。加入者が友人を勧誘して加入させ、紹介料などの利益を得る仕組みが連鎖的に広がる。大阪府は、これがネットワークビジネスと呼ばれることもあると説明している。どちらの意味かは文脈で読み分ける。通信回線を使う事業という意味ではない。</desc>
<rect x="12" y="14" width="296" height="56" class="fa" stroke-width="1.5"/>
<text x="160" y="37" class="tb ton" text-anchor="middle">ネットワークビジネス</text>
<text x="160" y="58" class="ton" text-anchor="middle">同じ語で、意味が2つある</text>
<rect x="12" y="82" width="296" height="196" class="fs sb" stroke-width="1.5"/>
<text x="24" y="104" class="tb">意味1　人が増えるほど価値が上がる事業</text>
<rect x="24" y="116" width="180" height="26" class="fas sa" stroke-width="1.5"/>
<text x="114" y="133.5" text-anchor="middle">利用者・参加者が増える</text>
<line x1="114" y1="142" x2="114" y2="156" class="l sa w2"/>
<polyline points="110.7,150 114,156 117.3,150" class="l sa w2"/>
<rect x="24" y="156" width="180" height="26" class="fas sa" stroke-width="1.5"/>
<text x="114" y="173.5" text-anchor="middle">サービスの価値が上がる</text>
<line x1="114" y1="182" x2="114" y2="196" class="l sa w2"/>
<polyline points="110.7,190 114,196 117.3,190" class="l sa w2"/>
<rect x="24" y="196" width="180" height="26" class="fas sa" stroke-width="1.5"/>
<text x="114" y="213.5" text-anchor="middle">さらに利用者が集まる</text>
<polyline points="204,209 228,209 228,129 205,129" class="l sa w2"/>
<polyline points="210,125.7 204,129 210,132.3" class="l sa w2"/>
<text x="236" y="173" class="tb ta">くり返す</text>
<text x="24" y="246" class="tm">巨大プラットフォームが伸びた背景</text>
<text x="24" y="264" class="tm">（情報通信白書 令和7年版）</text>
<rect x="12" y="290" width="296" height="250" class="fs sb" stroke-width="1.5"/>
<text x="24" y="312" class="tb">意味2　連鎖販売取引</text>
<text x="24" y="330" class="tm">（いわゆるマルチ商法）</text>
<rect x="120" y="342" width="80" height="24" class="fas sa" stroke-width="1.5"/>
<text x="160" y="358.5" text-anchor="middle">加入者</text>
<line x1="160" y1="366" x2="100" y2="390" class="l sa w2"/>
<polyline points="104.35,384.71 100,390 106.8,390.84" class="l sa w2"/>
<line x1="160" y1="366" x2="220" y2="390" class="l sa w2"/>
<polyline points="213.2,390.84 220,390 215.65,384.71" class="l sa w2"/>
<rect x="56" y="390" width="80" height="24" class="fas sa" stroke-width="1.5"/>
<text x="96" y="406.5" text-anchor="middle">友人</text>
<rect x="184" y="390" width="80" height="24" class="fas sa" stroke-width="1.5"/>
<text x="224" y="406.5" text-anchor="middle">友人</text>
<line x1="96" y1="414" x2="56" y2="438" class="l sa w2"/>
<polyline points="59.45,432.08 56,438 62.84,437.74" class="l sa w2"/>
<line x1="96" y1="414" x2="124" y2="438" class="l sa w2"/>
<polyline points="117.3,436.6 124,438 121.59,431.59" class="l sa w2"/>
<line x1="224" y1="414" x2="196" y2="438" class="l sa w2"/>
<polyline points="198.41,431.59 196,438 202.7,436.6" class="l sa w2"/>
<line x1="224" y1="414" x2="264" y2="438" class="l sa w2"/>
<polyline points="257.16,437.74 264,438 260.55,432.08" class="l sa w2"/>
<rect x="24" y="438" width="56" height="24" class="fs sa" stroke-width="1.5"/>
<text x="52" y="454.5" text-anchor="middle">次の人</text>
<rect x="96" y="438" width="56" height="24" class="fs sa" stroke-width="1.5"/>
<text x="124" y="454.5" text-anchor="middle">次の人</text>
<rect x="168" y="438" width="56" height="24" class="fs sa" stroke-width="1.5"/>
<text x="196" y="454.5" text-anchor="middle">次の人</text>
<rect x="240" y="438" width="56" height="24" class="fs sa" stroke-width="1.5"/>
<text x="268" y="454.5" text-anchor="middle">次の人</text>
<text x="24" y="488">友人を勧誘して加入させ、紹介料</text>
<text x="24" y="506">などの利益を得る。これが連鎖的に広がる</text>
<text x="24" y="526" class="tm">（大阪府の説明）</text>
<rect x="12" y="552" width="296" height="60" class="fs sb" stroke-width="1.5"/>
<text x="24" y="575" class="tb">どちらの意味かは、文脈で読み分ける</text>
<text x="24" y="597" class="tm">通信回線を使う事業、という意味ではない</text>
</svg>
