<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 414" role="img" aria-labelledby="fig-dx-defense-offense-it-t fig-dx-defense-offense-it-d">
<title id="fig-dx-defense-offense-it-t">守りのITと攻めのIT（SoRとSoE）、IT予算の配分</title>
<desc id="fig-dx-defense-offense-it-d">守りのITはSoR（Systems of Records、モード1）で、社内の業務効率化・コスト削減・システム基盤の維持のためのIT。攻めのITはSoE（Systems of Engagement、モード2）で、顧客とつながって新しいビジネスを生むIT。SoRとSoEは補完関係にあり、どちらも必要。情報通信白書（令和元年版）が紹介する調査では、IT予算のうち、現行ビジネスの維持・運営のためのラン・ザ・ビジネス予算と、新しい施策展開のためのバリューアップ予算の比率は、おおむね8対2で、守りに偏っている。</desc>
<rect x="12" y="14" width="296" height="84" class="fas sa" stroke-width="1.5"/>
<text x="160" y="30.5" class="tb" text-anchor="middle">守りのIT ＝ SoR</text>
<text x="160" y="50.5" text-anchor="middle">社内の業務効率化・コスト削減</text>
<text x="160" y="70.5" text-anchor="middle">システム基盤の維持</text>
<text x="160" y="90.5" text-anchor="middle">（Systems of Records／モード1）</text>
<text x="160" y="122" class="tm" text-anchor="middle">補完関係（どちらも必要）</text>
<rect x="12" y="134" width="296" height="84" class="fa" stroke-width="1.5"/>
<text x="160" y="150.5" class="tb ton" text-anchor="middle">攻めのIT ＝ SoE</text>
<text x="160" y="170.5" class="ton" text-anchor="middle">顧客とつながり、</text>
<text x="160" y="190.5" class="ton" text-anchor="middle">新しいビジネスを生む</text>
<text x="160" y="210.5" class="ton" text-anchor="middle">（Systems of Engagement／モード2）</text>
<line x1="12" y1="246" x2="308" y2="246" class="l sb w1"/>
<text x="12" y="270" class="tb">IT予算の配分（おおむね）</text>
<text x="12" y="290" class="tm">情報通信白書（令和元年版）が紹介する調査</text>
<rect x="12" y="306" width="237" height="30" class="fas sa" stroke-width="1.5"/>
<rect x="249" y="306" width="59" height="30" class="fa" stroke-width="1.5"/>
<text x="130" y="326" class="tb" text-anchor="middle">約8</text>
<text x="278" y="326" class="tb ton" text-anchor="middle">約2</text>
<text x="12" y="358">ラン・ザ・ビジネス：現行ビジネスの維持・運営</text>
<text x="12" y="378">バリューアップ：新しい施策展開</text>
<text x="12" y="402" class="tb">守り（左）に予算が偏っている</text>
</svg>
