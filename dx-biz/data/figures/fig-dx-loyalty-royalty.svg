<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 472" role="img" aria-labelledby="fig-dx-loyalty-royalty-t fig-dx-loyalty-royalty-d">
<title id="fig-dx-loyalty-royalty-t">ロイヤルティ（loyalty）とロイヤルティ（royalty）は別の言葉</title>
<desc id="fig-dx-loyalty-royalty-d">カタカナでは同じロイヤルティでも、英語のつづりと意味が違う2つの言葉を並べた図。loyalty は忠誠・信頼・愛着の意味で、顧客が企業やブランドに持つ信頼や愛着がカスタマーロイヤルティ。ロイヤルティの高い顧客は、繰り返し買い、競合に移らず、周りの人にも勧めてくれる。royalty は使用料の意味で、特許などの使用を許諾した側（ライセンサー）が、使う側（ライセンシー）から受け取る。カスタマーロイヤルティを特許の使用料とする説明は、royalty と取り違えた誤り。</desc>
<rect x="12" y="14" width="296" height="56" class="fa" stroke-width="1.5"/>
<text x="160" y="37" class="tb ton" text-anchor="middle">カタカナは同じ『ロイヤルティ』</text>
<text x="160" y="58" class="ton" text-anchor="middle">英語のつづりも意味も別の言葉</text>
<rect x="12" y="82" width="296" height="162" class="fs sb" stroke-width="1.5"/>
<text x="24" y="104" class="tb">loyalty（L で始まる）</text>
<text x="24" y="124">意味：忠誠・信頼・愛着</text>
<rect x="24" y="138" width="80" height="34" class="fas sa" stroke-width="1.5"/>
<text x="64" y="160" text-anchor="middle">顧客</text>
<line x1="104" y1="156" x2="174" y2="156" class="l sa w2"/>
<polyline points="168,159.3 174,156 168,152.7" class="l sa w2"/>
<text x="140" y="149" class="tm" text-anchor="middle">信頼・愛着</text>
<rect x="176" y="138" width="120" height="34" class="fas sa" stroke-width="1.5"/>
<text x="236" y="160" text-anchor="middle">企業・ブランド</text>
<text x="24" y="194">高い顧客は：くり返し買う・競合に</text>
<text x="24" y="212">移らない・周りの人に勧める</text>
<text x="24" y="232" class="tb ta">→ カスタマーロイヤルティはこちら</text>
<rect x="12" y="256" width="296" height="136" class="fs sb" stroke-width="1.5"/>
<text x="24" y="278" class="tb">royalty（R で始まる）</text>
<text x="24" y="298">意味：特許などの使用料</text>
<rect x="24" y="310" width="96" height="40" class="fas sa" stroke-width="1.5"/>
<text x="72" y="326" text-anchor="middle">使う側</text>
<text x="72" y="343" text-anchor="middle">ライセンシー</text>
<rect x="200" y="310" width="96" height="40" class="fas sa" stroke-width="1.5"/>
<text x="248" y="326" text-anchor="middle">許諾する側</text>
<text x="248" y="343" text-anchor="middle">ライセンサー</text>
<line x1="198" y1="322" x2="122" y2="322" class="l sa w2"/>
<polyline points="128,318.7 122,322 128,325.3" class="l sa w2"/>
<text x="160" y="317" class="tm" text-anchor="middle">使用を許諾</text>
<line x1="122" y1="340" x2="198" y2="340" class="l sa w2"/>
<polyline points="192,343.3 198,340 192,336.7" class="l sa w2"/>
<text x="160" y="358" class="tb" text-anchor="middle">使用料</text>
<text x="24" y="380" class="tb ta">→ ライセンスの収益モデルはこちら</text>
<rect x="12" y="404" width="296" height="56" class="fng sng" stroke-width="1.5"/>
<text x="24" y="426" class="tb">✕ カスタマーロイヤルティ＝使用料</text>
<text x="24" y="446">royalty の意味と取り違えている</text>
</svg>
