<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 555" role="img" aria-labelledby="fig-dx-data-pipeline-t fig-dx-data-pipeline-d">
<title id="fig-dx-data-pipeline-t">データ活用基盤の流れ：データソース、データレイク、ETL、DWH、データマート、BI</title>
<desc id="fig-dx-data-pipeline-d">データ活用基盤の流れを上から下へ並べた図。データソース（POS、会員アプリ、EC、センサー）から、2つの道がある。左の道は、データレイクで、加工や変換をせずに元の形式のまま保存し、画像・動画・音声も入る。右の道は、ETL（抽出・変換・格納）で整形して、データウェアハウス（DWH）に、整理・統合して時系列で蓄積する。データレイクやDWHのデータをもとに、部門や主題ごとの小さな置き場であるデータマートを作る。最後にBIツールで可視化して意思決定に使う。統計分析や予測・最適化を行うのはBAツール。データクレンジングは、誤記・重複・欠損を直してデータの品質を高める作業で、分析の前に行う。</desc>
<rect x="12" y="14" width="296" height="52" class="fs sb" stroke-width="1.5"/>
<text x="160" y="34.5" class="tb" text-anchor="middle">データソース</text>
<text x="160" y="54.5" text-anchor="middle">POS・会員アプリ・EC・センサー</text>
<line x1="82" y1="68" x2="82" y2="94" class="l sm w2"/>
<polyline points="78.15,87 82,94 85.85,87" class="l sm w2"/>
<line x1="238" y1="68" x2="238" y2="94" class="l sm w2"/>
<polyline points="234.15,87 238,94 241.85,87" class="l sm w2"/>
<rect x="12" y="96" width="140" height="108" class="fwn swn" stroke-width="1.5"/>
<text x="82" y="124.5" class="tb" text-anchor="middle">データレイク</text>
<text x="82" y="144.5" text-anchor="middle">加工せず</text>
<text x="82" y="164.5" text-anchor="middle">元の形式のまま</text>
<text x="82" y="184.5" text-anchor="middle">保存（画像・音声も）</text>
<rect x="168" y="96" width="140" height="50" class="fs sb" stroke-width="1.5"/>
<text x="238" y="115.5" class="tb" text-anchor="middle">ETL</text>
<text x="238" y="135.5" text-anchor="middle">抽出→変換→格納</text>
<line x1="238" y1="146" x2="238" y2="160" class="l sm w2"/>
<polyline points="234.7,154 238,160 241.3,154" class="l sm w2"/>
<rect x="168" y="162" width="140" height="92" class="fas sa" stroke-width="1.5"/>
<text x="238" y="182.5" class="tb" text-anchor="middle">データウェアハウス</text>
<text x="238" y="202.5" text-anchor="middle">（DWH）</text>
<text x="238" y="222.5" text-anchor="middle">整理・統合して</text>
<text x="238" y="242.5" text-anchor="middle">時系列で蓄積</text>
<line x1="82" y1="204" x2="82" y2="282" class="l sm w2"/>
<polyline points="78.15,275 82,282 85.85,275" class="l sm w2"/>
<line x1="238" y1="254" x2="238" y2="282" class="l sm w2"/>
<polyline points="234.15,275 238,282 241.85,275" class="l sm w2"/>
<rect x="12" y="284" width="296" height="66" class="fok sok" stroke-width="1.5"/>
<text x="160" y="301.5" class="tb" text-anchor="middle">データマート</text>
<text x="160" y="321.5" text-anchor="middle">部門・主題ごとの小さな置き場</text>
<text x="160" y="341.5" text-anchor="middle">（DWHやレイクのデータをもとに作る）</text>
<line x1="160" y1="352" x2="160" y2="378" class="l sm w2"/>
<polyline points="156.15,371 160,378 163.85,371" class="l sm w2"/>
<rect x="12" y="380" width="296" height="52" class="fs sa" stroke-width="1.5"/>
<text x="160" y="400.5" class="tb" text-anchor="middle">BIツール</text>
<text x="160" y="420.5" text-anchor="middle">可視化して、意思決定に使う</text>
<line x1="12" y1="454" x2="308" y2="454" class="l sb w1"/>
<text x="12" y="476" class="tb">分析の前に：データクレンジング</text>
<text x="12" y="496">誤記・表記ゆれ・重複・欠損を直して、</text>
<text x="12" y="515">データの品質を高める</text>
<text x="12" y="543" class="tm">統計分析や予測・最適化はBAツール</text>
</svg>
