<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 394" role="img" aria-labelledby="fig-dx-marginal-cost-t fig-dx-marginal-cost-d">
<title id="fig-dx-marginal-cost-t">限界費用：もう1単位増やす費用。デジタルの複製と伝達ではほぼゼロ</title>
<desc id="fig-dx-marginal-cost-d">何のための図か：令和元年版情報通信白書の限界費用（ある財・サービスを一単位増やすために要する費用）を、紙とデジタルで比べる。棒は、1部目・2部目・3部目…と1部ずつ増やすときに、それぞれ追加でかかる費用（イメージで、数は描かない）。紙の印刷物は、1部増やすごとに紙・印刷・運ぶ費用がかかる。デジタルデータは、情報を紙などの媒体から切り離したので、ほぼ完全な複製や即時の伝達を、限界費用がほぼゼロで行える。最初に作る費用（固定費用）は別にかかる。無料で使えるサービスが多いのは、この特質を反映している。</desc>
<text x="12" y="20" class="tb">限界費用＝もう1単位増やすための費用</text>
<text x="12" y="42" class="tm">棒：1部増やすごとに追加でかかる費用</text>
<text x="12" y="60" class="tm">（高さはイメージ。数は描かない）</text>
<text x="12" y="88" class="tb">紙の印刷物</text>
<rect x="40" y="104" width="32" height="40" class="fas sa" stroke-width="1.5"/>
<text x="56" y="160" class="tm" text-anchor="middle">1部目</text>
<rect x="92" y="104" width="32" height="40" class="fas sa" stroke-width="1.5"/>
<text x="108" y="160" class="tm" text-anchor="middle">2部目</text>
<rect x="144" y="104" width="32" height="40" class="fas sa" stroke-width="1.5"/>
<text x="160" y="160" class="tm" text-anchor="middle">3部目</text>
<rect x="196" y="104" width="32" height="40" class="fas sa" stroke-width="1.5"/>
<text x="212" y="160" class="tm" text-anchor="middle">4部目</text>
<rect x="248" y="104" width="32" height="40" class="fas sa" stroke-width="1.5"/>
<text x="264" y="160" class="tm" text-anchor="middle">5部目</text>
<line x1="30" y1="144" x2="300" y2="144" class="l sm w1"/>
<text x="12" y="184" class="tm">1部ごとに、紙・印刷・運ぶ費用がかかる</text>
<text x="12" y="212" class="tb">デジタルデータの複製・送信</text>
<rect x="40" y="266.5" width="32" height="1.5" class="fok sok" stroke-width="1.5"/>
<text x="56" y="284" class="tm" text-anchor="middle">1部目</text>
<rect x="92" y="266.5" width="32" height="1.5" class="fok sok" stroke-width="1.5"/>
<text x="108" y="284" class="tm" text-anchor="middle">2部目</text>
<rect x="144" y="266.5" width="32" height="1.5" class="fok sok" stroke-width="1.5"/>
<text x="160" y="284" class="tm" text-anchor="middle">3部目</text>
<rect x="196" y="266.5" width="32" height="1.5" class="fok sok" stroke-width="1.5"/>
<text x="212" y="284" class="tm" text-anchor="middle">4部目</text>
<rect x="248" y="266.5" width="32" height="1.5" class="fok sok" stroke-width="1.5"/>
<text x="264" y="284" class="tm" text-anchor="middle">5部目</text>
<line x1="30" y1="268" x2="300" y2="268" class="l sm w1"/>
<text x="12" y="308" class="tb tok">ほぼ完全な複製・即時の伝達が、ほぼゼロ</text>
<line x1="12" y1="320" x2="308" y2="320" class="l sb w1"/>
<text x="12" y="344" class="tm">最初に作る費用（固定費用）は別にかかる</text>
<text x="12" y="362" class="tm">→ 無料で使えるサービスが多いのは、この特質</text>
<text x="12" y="380" class="tm">　を反映している（白書）</text>
</svg>
