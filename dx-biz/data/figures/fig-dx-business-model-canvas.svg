<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 718" role="img" aria-labelledby="fig-dx-business-model-canvas-t fig-dx-business-model-canvas-d">
<title id="fig-dx-business-model-canvas-t">ビジネスモデル・キャンバスの9つのブロック</title>
<desc id="fig-dx-business-model-canvas-d">1枚の紙を9つのブロックに分ける。上の段は左から、協力先（キーパートナー）、活動（主要活動）と資源（主要リソース）、真ん中に価値提案、関係（顧客との関係）とチャネル、右端に顧客（顧客セグメント）。右側は市場、左側はその市場に応えるために要るもの、真ん中が価値提案。下の段はお金で、左にコスト（コスト構造）、右に収益（収益の流れ）。下の2つは、上の7つが正しいときだけ成り立つ。顧客を変えれば、チャネル・活動・コストも一緒に変わる。</desc>
<text x="160" y="22" class="tb" text-anchor="middle">1枚の紙を、9つのブロックに分ける</text>
<text x="66" y="46" class="tb" text-anchor="middle">左側＝要るもの</text>
<text x="160" y="46" class="tb" text-anchor="middle">真ん中</text>
<text x="254" y="46" class="tb" text-anchor="middle">右側＝市場</text>
<rect x="4" y="56" width="62" height="200" class="fwn l swn"/>
<text x="35" y="160.5" text-anchor="middle">協力先</text>
<rect x="66" y="56" width="62" height="100" class="fwn l swn"/>
<text x="97" y="110.5" text-anchor="middle">活動</text>
<rect x="66" y="156" width="62" height="100" class="fwn l swn"/>
<text x="97" y="210.5" text-anchor="middle">資源</text>
<rect x="128" y="56" width="64" height="200" class="fa l sa"/>
<text x="160" y="160.5" class="tb ton" text-anchor="middle">価値提案</text>
<rect x="192" y="56" width="62" height="100" class="fok l sok"/>
<text x="223" y="110.5" text-anchor="middle">関係</text>
<rect x="192" y="156" width="62" height="100" class="fok l sok"/>
<text x="223" y="210.5" text-anchor="middle">チャネル</text>
<rect x="254" y="56" width="62" height="200" class="fok l sok"/>
<text x="285" y="160.5" text-anchor="middle">顧客</text>
<rect x="4" y="256" width="156" height="48" class="fs l sm"/>
<text x="82" y="284.5" text-anchor="middle">コスト</text>
<rect x="160" y="256" width="156" height="48" class="fs l sm"/>
<text x="238" y="284.5" text-anchor="middle">収益</text>
<text x="160" y="330" text-anchor="middle">下の2つ（お金）は、上の7つが</text>
<text x="160" y="348" text-anchor="middle">正しいときだけ成り立つ</text>
<text x="160" y="372" text-anchor="middle">顧客を変えれば、チャネル・活動・</text>
<text x="160" y="390" text-anchor="middle">コストも一緒に変わる</text>
<line x1="12" y1="408" x2="308" y2="408" class="l sb w1"/>
<rect x="12" y="420" width="14" height="14" class="fok l sok w1"/>
<text x="34" y="432" class="tb">右側（市場）</text>
<text x="12" y="456">顧客（顧客セグメント）：誰に向けるか</text>
<text x="12" y="476">関係（顧客との関係）：どう付き合うか</text>
<text x="12" y="496">チャネル：どう届けるか</text>
<rect x="12" y="512" width="14" height="14" class="fa l sa w1"/>
<text x="34" y="524" class="tb">真ん中</text>
<text x="12" y="548">価値提案：顧客に何を提供するか</text>
<rect x="12" y="564" width="14" height="14" class="fwn l swn w1"/>
<text x="34" y="576" class="tb">左側（市場に応えるのに要るもの）</text>
<text x="12" y="600">活動（主要活動）：やるべき仕事</text>
<text x="12" y="620">資源（主要リソース）：人・設備・データなど</text>
<text x="12" y="640">協力先（キーパートナー）：手を借りる相手</text>
<rect x="12" y="652" width="14" height="14" class="fs l sm w1"/>
<text x="34" y="664" class="tb">下（お金）</text>
<text x="12" y="688">コスト（コスト構造）：何にいくらかかるか</text>
<text x="12" y="708">収益（収益の流れ）：何で稼ぐか</text>
</svg>
