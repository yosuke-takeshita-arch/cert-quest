<rect x="189.6" y="360" width="59.2" height="30" class="fs sb" stroke-width="1"/>
<text x="219.2" y="380" text-anchor="middle">販売</text>
<rect x="248.8" y="360" width="59.2" height="30" class="fs sb" stroke-width="1"/>
<text x="278.4" y="380" text-anchor="middle">サービス</text>
<text x="12" y="410" class="tm">顧客の前には出ず、他社に機能を提供する</text>
