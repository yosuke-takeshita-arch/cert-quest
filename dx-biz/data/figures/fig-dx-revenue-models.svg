<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 670" role="img" aria-labelledby="fig-dx-revenue-models-t fig-dx-revenue-models-d">
<title id="fig-dx-revenue-models-t">収益モデルの比較：誰が、何に、お金を払うか</title>
<desc id="fig-dx-revenue-models-d">9つの収益モデルを、誰が誰に何のために払うかで並べた表。サブスクリプションは、利用者が定額（月額・年額）で使い放題にする。フリーミアムは、基本は無料で、一部の利用者が有料の追加機能に払う。アドオンは、利用者が追加の機能やオプションに別料金を払う。広告モデルは、広告主が広告の掲載に払い、利用者は無料で使う。成果報酬は、依頼した側が成果が出たときにだけ払う。レベニューシェアは、提携した双方が、事前に決めた率で収益を分ける。ライセンシングは、使う側が知的財産の使用料を持ち主に払う。投げ銭は、ファンや視聴者が応援のために少額やアイテムを送る。部分所有は、複数の人が1つの資産の所有権や利用権を分けて持つ。</desc>
<text x="12" y="22" class="tb">誰が、何に、払うか</text>
<rect x="12" y="32" width="296" height="70" class="fas sa" stroke-width="1"/>
<text x="22" y="52" class="tb">サブスクリプション</text>
<text x="22" y="72" class="tm">払う人：利用者 → 事業者</text>
<text x="22" y="91">定額（月額・年額）で使い放題</text>
<rect x="12" y="102" width="296" height="70" class="fs sb" stroke-width="1"/>
<text x="22" y="122" class="tb">フリーミアム</text>
<text x="22" y="142" class="tm">払う人：一部の利用者 → 事業者</text>
<text x="22" y="161">有料の追加機能（基本は無料）</text>
<rect x="12" y="172" width="296" height="70" class="fas sa" stroke-width="1"/>
<text x="22" y="192" class="tb">アドオン</text>
<text x="22" y="212" class="tm">払う人：利用者 → 事業者</text>
<text x="22" y="231">追加の機能・オプション（別料金）</text>
<rect x="12" y="242" width="296" height="70" class="fs sb" stroke-width="1"/>
<text x="22" y="262" class="tb">広告モデル</text>
<text x="22" y="282" class="tm">払う人：広告主 → 事業者</text>
<text x="22" y="301">広告の掲載（利用者は無料）</text>
<rect x="12" y="312" width="296" height="70" class="fas sa" stroke-width="1"/>
<text x="22" y="332" class="tb">成果報酬</text>
<text x="22" y="352" class="tm">払う人：依頼した側 → 受けた側</text>
<text x="22" y="371">成果が出たときに払う</text>
<rect x="12" y="382" width="296" height="70" class="fs sb" stroke-width="1"/>
<text x="22" y="402" class="tb">レベニューシェア</text>
<text x="22" y="422" class="tm">払う人：提携した双方</text>
<text x="22" y="441">事前に決めた率で収益を分ける</text>
<rect x="12" y="452" width="296" height="70" class="fas sa" stroke-width="1"/>
<text x="22" y="472" class="tb">ライセンシング</text>
<text x="22" y="492" class="tm">払う人：使う側 → 持ち主</text>
<text x="22" y="511">知的財産の使用料（ライセンス料）</text>
<rect x="12" y="522" width="296" height="70" class="fs sb" stroke-width="1"/>
<text x="22" y="542" class="tb">投げ銭</text>
<text x="22" y="562" class="tm">払う人：ファン・視聴者 → 作り手</text>
<text x="22" y="581">応援のための少額・アイテム</text>
<rect x="12" y="592" width="296" height="70" class="fas sa" stroke-width="1"/>
<text x="22" y="612" class="tb">部分所有</text>
<text x="22" y="632" class="tm">払う人：複数の所有者</text>
<text x="22" y="651">1つの資産を分けて持ち、負担を分ける</text>
</svg>
