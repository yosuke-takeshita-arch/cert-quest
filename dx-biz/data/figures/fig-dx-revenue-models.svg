<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 990" role="img" aria-labelledby="fig-dx-revenue-models-t fig-dx-revenue-models-d">
<title id="fig-dx-revenue-models-t">収益モデルの比較：誰が、何に、お金を払うか</title>
<desc id="fig-dx-revenue-models-d">9つの収益モデルを、誰が誰に何のために払うかで並べた表。サブスクリプションは、利用者が定額（月額・年額）で使い放題にする。フリーミアムは、基本は無料で、一部の利用者が有料の追加機能に払う。アドオンは、利用者が追加の機能やオプションに別料金を払う。広告モデルは、広告主が広告の掲載に払い、利用者は無料で使う。成果報酬は、依頼した側が成果が出たときにだけ払う。レベニューシェアは、提携した双方が、事前に決めた率で収益を分ける。ライセンシングは、使う側が知的財産の使用料を持ち主に払う。投げ銭は、ファンや視聴者が応援のために少額やアイテムを送る。部分所有は、複数の人が1つの資産の所有権や利用権を分けて持つ。各モデルを、お金を払う人から受け取る人への矢印で描いた。成果報酬とライセンシングは払う側と受け取る側の向きがはっきりしている。広告モデルは広告主が事業者に払い、利用者は払わない（破線）。レベニューシェアは、収益を提携した双方に事前に決めた率で分ける。部分所有は、複数の所有者が1つの資産の負担を分ける。</desc>
