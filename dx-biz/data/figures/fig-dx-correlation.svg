<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 608" role="img" aria-labelledby="fig-dx-correlation-t fig-dx-correlation-d">
<title id="fig-dx-correlation-t">相関と疑似相関</title>
<desc id="fig-dx-correlation-d">上：散布図の4つの形。点が右上がりにそろえば正の相関、右下がりなら負の相関、ばらばらなら相関なし。曲線状に並ぶ点は、相関係数が0に近くても関係がある例で、相関係数は直線状の関係を測る尺度なので散布図も描いて確かめる。相関係数は-1から1の値をとり、絶対値が1に近いほど強い相関。下：因果の図。暑さ（気温）が、アイスの販売数と溺死数の両方を増やす。アイスの販売数と溺死数には高い相関があるが、一方が原因ではない。このように、直接の関係がないのに相関があるように見えることを疑似相関という。相関関係と因果関係は別の概念。</desc>
<text x="12" y="22" class="tb">散布図で見る（イメージ）</text>
<text x="12" y="46" class="tb">正の相関</text>
<rect x="12" y="54" width="146" height="98" class="fs sb" stroke-width="1"/>
<circle cx="34" cy="135.4" r="3.2" class="fa"/>
<circle cx="48" cy="126.4" r="3.2" class="fa"/>
<circle cx="60" cy="121" r="3.2" class="fa"/>
<circle cx="72" cy="110.2" r="3.2" class="fa"/>
<circle cx="86" cy="104.8" r="3.2" class="fa"/>
<circle cx="98" cy="92.2" r="3.2" class="fa"/>
<circle cx="112" cy="88.6" r="3.2" class="fa"/>
<circle cx="128" cy="77.8" r="3.2" class="fa"/>
<text x="12" y="170" class="tm">右上がり</text>
<text x="162" y="46" class="tb">負の相関</text>
<rect x="162" y="54" width="146" height="98" class="fs sb" stroke-width="1"/>
<circle cx="184" cy="79.6" r="3.2" class="fa"/>
<circle cx="198" cy="86.8" r="3.2" class="fa"/>
<circle cx="212" cy="97.6" r="3.2" class="fa"/>
<circle cx="224" cy="101.2" r="3.2" class="fa"/>
<circle cx="238" cy="113.8" r="3.2" class="fa"/>
<circle cx="250" cy="117.4" r="3.2" class="fa"/>
<circle cx="264" cy="128.2" r="3.2" class="fa"/>
<circle cx="278" cy="133.6" r="3.2" class="fa"/>
<text x="162" y="170" class="tm">右下がり</text>
<text x="12" y="202" class="tb">相関なし</text>
<rect x="12" y="210" width="146" height="98" class="fs sb" stroke-width="1"/>
<circle cx="36" cy="250" r="3.2" class="fa"/>
<circle cx="50" cy="284.2" r="3.2" class="fa"/>
<circle cx="64" cy="235.6" r="3.2" class="fa"/>
<circle cx="78" cy="269.8" r="3.2" class="fa"/>
<circle cx="92" cy="244.6" r="3.2" class="fa"/>
<circle cx="106" cy="286" r="3.2" class="fa"/>
<circle cx="118" cy="255.4" r="3.2" class="fa"/>
<circle cx="130" cy="277" r="3.2" class="fa"/>
<text x="12" y="326" class="tm">ばらばら</text>
<text x="162" y="202" class="tb">曲線の関係</text>
<rect x="162" y="210" width="146" height="98" class="fs sb" stroke-width="1"/>
<circle cx="184" cy="235.6" r="3.2" class="fa"/>
<circle cx="198" cy="257.2" r="3.2" class="fa"/>
<circle cx="212" cy="275.2" r="3.2" class="fa"/>
<circle cx="226" cy="286" r="3.2" class="fa"/>
<circle cx="240" cy="287.8" r="3.2" class="fa"/>
<circle cx="254" cy="275.2" r="3.2" class="fa"/>
<circle cx="268" cy="257.2" r="3.2" class="fa"/>
<circle cx="282" cy="235.6" r="3.2" class="fa"/>
<text x="162" y="326" class="tm">直線ではない</text>
<text x="12" y="358">相関係数：-1〜1。絶対値が1に近いほど強い</text>
<text x="12" y="378">直線の関係を測るので、散布図でも確かめる</text>
<line x1="12" y1="396" x2="308" y2="396" class="l sb w1"/>
<text x="12" y="420" class="tb">相関があっても、原因とは限らない</text>
<rect x="100" y="434" width="120" height="36" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="456.5" class="tb" text-anchor="middle">暑さ（気温）</text>
<line x1="130" y1="470" x2="70" y2="508" class="l swn w2"/>
<polyline points="73.85,501 70,508 77.97,507.51" class="l swn w2"/>
<line x1="190" y1="470" x2="250" y2="508" class="l swn w2"/>
<polyline points="242.03,507.51 250,508 246.15,501" class="l swn w2"/>
<rect x="12" y="508" width="120" height="44" class="fs sa" stroke-width="1.5"/>
<text x="72" y="525.5" text-anchor="middle">アイスの</text>
<text x="72" y="543.5" text-anchor="middle">販売数</text>
<rect x="188" y="508" width="120" height="44" class="fs sa" stroke-width="1.5"/>
<text x="248" y="534.5" text-anchor="middle">溺死数</text>
<line x1="136" y1="530" x2="184" y2="530" class="l sng w2 dsh"/>
<text x="12" y="576" class="tb">点線：相関は高いが、一方が原因ではない</text>
<text x="12" y="596" class="tm">（疑似相関＝見せかけの相関）</text>
</svg>
