<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-dx-freemium-t fig-dx-freemium-d">
<title id="fig-dx-freemium-t">フリーミアム：無料で集めて、一部の有料で全体をまかなう</title>
<desc id="fig-dx-freemium-d">数は図の例。上：利用者1,000人を、100人ずつの10本の帯で表した図。全員が基本の機能を無料で使う。そのうち3％の30人が、月500円の有料の追加機能を買う。中：計算。毎月の売上は、有料にする人数×月の料金。有料にする人数は1,000人×3％で30人。売上は30人×500円で月15,000円。下：意味。無料の970人の分も、30人の支払いでまかなう。デジタルのサービスは、利用者を1人増やす追加の費用がほぼゼロなので成り立ちやすい。注意：無料で使える範囲は、正確かつ明瞭に表示する（消費者庁）。</desc>
<text x="12" y="22" class="tb">利用者1,000人の場合（数は図の例）</text>
<text x="12" y="40" class="tm">帯1本＝100人。全員が基本機能を無料で使う</text>
<rect x="12" y="52" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="68" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="84" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="100" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="116" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="132" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="148" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="164" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="180" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="196" width="296" height="12" class="fs l sm w1"/>
<rect x="12" y="196" width="89" height="12" class="fa"/>
<text x="12" y="228" class="tb">塗った所＝有料の追加機能を買う30人</text>
<text x="12" y="246" class="tm">（1,000人のうち3％。月500円）</text>
<line x1="12" y1="262" x2="308" y2="262" class="l sb w1"/>
<text x="12" y="284" class="tb">毎月の売上を求める</text>
<text x="12" y="306">売上 ＝ 有料にする人数 × 月の料金</text>
<text x="12" y="330">有料にする人数 ＝ 1,000人 × 3％</text>
<text x="12" y="350" class="tb">　　　　　　　 ＝ 30人</text>
<text x="12" y="374">売上 ＝ 30人 × 500円</text>
<text x="12" y="394" class="tb">　　 ＝ 月15,000円</text>
<line x1="12" y1="410" x2="308" y2="410" class="l sb w1"/>
<text x="12" y="432" class="tb">無料の970人の分も、</text>
<text x="12" y="452" class="tb">30人の支払いでまかなう</text>
<text x="12" y="476">1人増やす追加の費用がほぼゼロの</text>
<text x="12" y="494">デジタルのサービスで成り立ちやすい</text>
<rect x="12" y="508" width="296" height="40" class="fwn l swn"/>
<text x="24" y="533">無料の範囲は、正確・明瞭に表示する</text>
</svg>
