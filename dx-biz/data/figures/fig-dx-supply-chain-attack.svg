<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="fig-dx-supply-chain-attack-t fig-dx-supply-chain-attack-d">
<title id="fig-dx-supply-chain-attack-t">サプライチェーン攻撃：守りの弱い所を足掛かりに回り込む</title>
<desc id="fig-dx-supply-chain-attack-d">攻撃者から標的の組織へ直接向かう矢印は、標的の守りが固いので×で止まる。代わりに攻撃者は、1 守りの弱い委託先・関連会社を先に攻め、2 そこを足掛かりにして標的に入り込む。手口の例は3つ。関連会社・委託先から入って標的の秘密情報を盗む。多くの組織が使うソフトウェアを改ざんし、インストールや更新のときに感染させる。運用・保守を請け負う事業者（MSP）が使う管理のソフトにマルウェアを仕込み、顧客の機器に感染させる。足掛かりにされた組織は、取引先に損害を与え、取引停止や損害賠償を求められることがある。対策は、信頼できる委託先の選定、契約で責任の範囲を定めて対策状況を定期的に確認すること、納品物に含まれるソフトウェアの把握（SBOM）。</desc>
<text x="12" y="22" class="tb">正面からではなく、つながりから入る</text>
<rect x="6" y="40" width="92" height="44" class="fng l sng"/>
<text x="52" y="67" class="tb tng" text-anchor="middle">攻撃者</text>
<rect x="210" y="40" width="104" height="60" class="fok l sok w3"/>
<text x="262" y="64" class="tb" text-anchor="middle">標的の組織</text>
<text x="262" y="84" text-anchor="middle">守りが固い</text>
<line x1="100" y1="62" x2="206" y2="62" class="l sm w1 dsh"/>
<line x1="146" y1="52" x2="166" y2="72" class="l sng w2"/>
<line x1="166" y1="52" x2="146" y2="72" class="l sng w2"/>
<text x="156" y="96" class="tm" text-anchor="middle">直接は入りにくい</text>
<rect x="94" y="168" width="132" height="48" class="fwn l swn"/>
<text x="160" y="188" class="tb" text-anchor="middle">委託先・関連会社</text>
<text x="160" y="207" text-anchor="middle">守りが弱い</text>
<line x1="52" y1="86" x2="112" y2="164" class="l sng w2"/>
<polyline points="104.6,161.1 112,164 110.8,156.2" class="l sng w2"/>
<line x1="208" y1="164" x2="252" y2="104" class="l sng w2"/>
<polyline points="244.6,107.1 252,104 251.0,111.8" class="l sng w2"/>
<circle cx="70" cy="132" r="11" class="fng l sng w1"/>
<text x="70" y="136.5" class="tb tng" text-anchor="middle">1</text>
<circle cx="250" cy="138" r="11" class="fng l sng w1"/>
<text x="250" y="142.5" class="tb tng" text-anchor="middle">2</text>
<text x="12" y="240">1 まず守りの弱い所を攻める</text>
<text x="12" y="260">2 そこを足掛かりに、標的に入り込む</text>
<line x1="12" y1="276" x2="308" y2="276" class="l sb w1"/>
<text x="12" y="300" class="tb">足掛かりになる「つながり」の例</text>
<text x="12" y="322">・委託先・関連会社から入り、秘密情報を盗む</text>
<text x="12" y="344">・多くの組織が使うソフトを改ざんし、</text>
<text x="12" y="362">　入れる・更新するときに感染させる</text>
<text x="12" y="384">・運用・保守の請負事業者（MSP）の管理</text>
<text x="12" y="402">　ソフトに仕込み、顧客の機器に感染させる</text>
<text x="12" y="428" class="tng">足掛かりにされた組織も、取引停止や</text>
<text x="12" y="446" class="tng">損害賠償を求められることがある</text>
<line x1="12" y1="462" x2="308" y2="462" class="l sb w1"/>
<text x="12" y="486" class="tb">対策は、つながりごと守る</text>
<text x="12" y="508">・信頼できる委託先を選び、契約で責任を</text>
<text x="12" y="526">　定め、対策状況を定期的に確かめる</text>
<text x="12" y="548">・納品物のソフトの中身を把握する（SBOM）</text>
</svg>
