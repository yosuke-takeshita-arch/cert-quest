<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 507" role="img" aria-labelledby="fig-dx-segment-one2one-t fig-dx-segment-one2one-d">
<title id="fig-dx-segment-one2one-t">マス・セグメント・ワントゥワン：誰にまとめて届けるか</title>
<desc id="fig-dx-segment-one2one-d">同じ8人の顧客に届ける方法を3つ比べた図。マスマーケティングは、全員に同じ内容を届ける。セグメントマーケティングは、年齢・地域・趣味・行動などで似た顧客のまとまりに分け、まとまりごとに違う内容を届ける。ワントゥワンマーケティングは、顧客を一人ひとりとして捉え、属性や購買履歴・行動履歴に合わせて、一人ひとりに違う内容を届ける。一人ひとりに合わせるには個人情報の取得が要る。属性を切り口にしたセグメント分析でも、効果的な施策につながる。</desc>
<rect x="12" y="14" width="296" height="118" class="fs sb" stroke-width="1.5"/>
<text x="24" y="36" class="tb">マス：全員に同じ内容</text>
<text x="24" y="122" class="tm">全員に、同じ広告・同じ案内</text>
<circle cx="48" cy="62" r="10" class="fa"/>
<circle cx="122" cy="62" r="10" class="fa"/>
<circle cx="196" cy="62" r="10" class="fa"/>
<circle cx="270" cy="62" r="10" class="fa"/>
<circle cx="48" cy="90" r="10" class="fa"/>
<circle cx="122" cy="90" r="10" class="fa"/>
<circle cx="196" cy="90" r="10" class="fa"/>
<circle cx="270" cy="90" r="10" class="fa"/>
<rect x="12" y="142" width="296" height="118" class="fs sb" stroke-width="1.5"/>
<text x="24" y="164" class="tb">セグメント：まとまりごとに変える</text>
<text x="24" y="250" class="tm">年齢・地域などで3つの群に分ける</text>
<rect x="24" y="174" width="124" height="60" class="fas sa" stroke-width="1.5"/>
<rect x="158" y="174" width="52" height="60" class="fwn swn" stroke-width="1.5"/>
<rect x="220" y="174" width="76" height="60" class="fok sok" stroke-width="1.5"/>
<circle cx="46" cy="190" r="10" class="fa"/>
<circle cx="96" cy="190" r="10" class="fa"/>
<circle cx="46" cy="218" r="10" class="fa"/>
<circle cx="96" cy="218" r="10" class="fa"/>
<circle cx="184" cy="190" r="10" class="fa"/>
<circle cx="184" cy="218" r="10" class="fa"/>
<circle cx="258" cy="190" r="10" class="fa"/>
<circle cx="258" cy="218" r="10" class="fa"/>
<rect x="12" y="270" width="296" height="118" class="fs sb" stroke-width="1.5"/>
<text x="24" y="292" class="tb">ワントゥワン：一人ひとりに変える</text>
<text x="24" y="378" class="tm">一人ひとりに違う内容を届ける</text>
<circle cx="48" cy="318" r="11" class="fa"/>
<text x="48" y="323" class="tb ton" text-anchor="middle">1</text>
<circle cx="122" cy="318" r="11" class="fa"/>
<text x="122" y="323" class="tb ton" text-anchor="middle">2</text>
<circle cx="196" cy="318" r="11" class="fa"/>
<text x="196" y="323" class="tb ton" text-anchor="middle">3</text>
<circle cx="270" cy="318" r="11" class="fa"/>
<text x="270" y="323" class="tb ton" text-anchor="middle">4</text>
<circle cx="48" cy="346" r="11" class="fa"/>
<text x="48" y="351" class="tb ton" text-anchor="middle">5</text>
<circle cx="122" cy="346" r="11" class="fa"/>
<text x="122" y="351" class="tb ton" text-anchor="middle">6</text>
<circle cx="196" cy="346" r="11" class="fa"/>
<text x="196" y="351" class="tb ton" text-anchor="middle">7</text>
<circle cx="270" cy="346" r="11" class="fa"/>
<text x="270" y="351" class="tb ton" text-anchor="middle">8</text>
<text x="12" y="412" class="tm">数字は、一人ひとりに違う内容を届ける印</text>
<line x1="12" y1="434" x2="308" y2="434" class="l sb w1"/>
<text x="12" y="456" class="tb">ワントゥワンには個人情報の取得が要る</text>
<text x="12" y="476">セグメント分析でも、効果的な施策に</text>
<text x="12" y="495">つながる</text>
