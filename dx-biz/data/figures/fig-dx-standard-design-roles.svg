<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="fig-dx-standard-design-roles-t fig-dx-standard-design-roles-d">
<title id="fig-dx-standard-design-roles-t">標準設計：基本設計は設計会社が共通に、建造に向けた設計と建造は各造船所、海運会社は出資</title>
<desc id="fig-dx-standard-design-roles-d">何のための図か：液化CO2の輸送船や新燃料船などの先進的な船について、7社が合意した標準設計の仕組みで、3つの主体が何を担うかを見る。設計会社 MILES が対象船の開発と基本設計を共通に行う。国内の各造船所は、その共通の基本設計に基づいて機能設計と生産設計を行い、建造する。海運3社（川崎汽船・商船三井・日本郵船）は MILES に出資し、標準設計を使う多くの国内造船所での建造を後押しする。造船会社も出資を決めた。基本設計を1か所で共通にすることで、開発と初期設計を効率よく進める。</desc>
<text x="12" y="20" class="tb">標準設計：誰が、何を担うか</text>
<text x="12" y="42" class="tm">対象：液化CO2の輸送船・新燃料船など</text>
<rect x="12" y="56" width="180" height="58" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="102" y="72" text-anchor="middle" class="tb">設計会社 MILES</text>
<text x="102" y="90" text-anchor="middle">開発と基本設計を</text>
<text x="102" y="108" text-anchor="middle">共通に行う</text>
<rect x="228" y="56" width="80" height="58" class="fas sa" stroke-width="1.5" rx="6"/>
<text x="268" y="72" text-anchor="middle" class="tb">海運3社</text>
<text x="268" y="90" text-anchor="middle">造船会社</text>
<text x="268" y="108" text-anchor="middle">も</text>
<line x1="226" y1="92" x2="200" y2="92" class="l sa w2"/>
<polyline points="201,87 194,92 201,97" class="l sa w2" fill="none"/>
<text x="210" y="82" class="tm" text-anchor="middle">出資</text>
<line x1="102" y1="114" x2="102" y2="138" class="l sa w2"/>
<line x1="58" y1="138" x2="262" y2="138" class="l sa w2"/>
<text x="112" y="132" class="tm">同じ基本設計を配る</text>
<line x1="58" y1="138" x2="58" y2="157" class="l sa w2"/>
<polyline points="53,156 58,163 63,156" class="l sa w2" fill="none"/>
<rect x="12" y="164" width="92" height="76" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="58" y="180" text-anchor="middle" class="tb">造船所A</text>
<text x="58" y="198" text-anchor="middle" class="tm">機能設計</text>
<text x="58" y="216" text-anchor="middle" class="tm">生産設計</text>
<text x="58" y="234" text-anchor="middle" class="tm">→ 建造</text>
<line x1="160" y1="138" x2="160" y2="157" class="l sa w2"/>
<polyline points="155,156 160,163 165,156" class="l sa w2" fill="none"/>
<rect x="114" y="164" width="92" height="76" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="160" y="180" text-anchor="middle" class="tb">造船所B</text>
<text x="160" y="198" text-anchor="middle" class="tm">機能設計</text>
<text x="160" y="216" text-anchor="middle" class="tm">生産設計</text>
<text x="160" y="234" text-anchor="middle" class="tm">→ 建造</text>
<line x1="262" y1="138" x2="262" y2="157" class="l sa w2"/>
<polyline points="257,156 262,163 267,156" class="l sa w2" fill="none"/>
<rect x="216" y="164" width="92" height="76" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="262" y="180" text-anchor="middle" class="tb">造船所C</text>
<text x="262" y="198" text-anchor="middle" class="tm">機能設計</text>
<text x="262" y="216" text-anchor="middle" class="tm">生産設計</text>
<text x="262" y="234" text-anchor="middle" class="tm">→ 建造</text>
<text x="12" y="266" class="tb tok">基本設計を1か所で共通にする</text>
<text x="12" y="284" class="tm">→ 開発と初期設計を効率よく進める</text>
<text x="12" y="306" class="tm">海運会社は、使う側として出資で後押し</text>
</svg>
