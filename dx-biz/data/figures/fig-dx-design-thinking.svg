<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="fig-dx-design-thinking-t fig-dx-design-thinking-d">
<title id="fig-dx-design-thinking-t">デザイン思考の5つのステージ</title>
<desc id="fig-dx-design-thinking-d">デザイン思考の5つのステージを、共感、問題定義、創造、プロトタイプ、テストの順に並べた図。共感は、行動観察やインタビューでユーザーを理解する。問題定義は、ユーザーが持つ真の問題を特定する。創造は、アイデアを広げる。プロトタイプは、試作する。テストは、プロトタイプを使ってユーザーからフィードバックを得る。基準となる順番はあるが、後ろのステージで新しい気付きがあれば、前のステージに戻ることが推奨される。出典はIPAのDX白書2021で、スタンフォード大学d.schoolの5つのステージ。</desc>
<text x="12" y="22" class="tb">5つのステージ（行き来しながら進む）</text>
<rect x="12" y="32" width="264" height="54" class="fas sa" stroke-width="1.5"/>
<text x="24" y="55" class="tb">1　共感</text>
<text x="24" y="74" class="tm">観察・インタビューでユーザーを理解</text>
<line x1="144" y1="88" x2="144" y2="100" class="l sa w2"/>
<polyline points="141.25,95 144,100 146.75,95" class="l sa w2"/>
<rect x="12" y="102" width="264" height="54" class="fas sa" stroke-width="1.5"/>
<text x="24" y="125" class="tb">2　問題定義</text>
<text x="24" y="144" class="tm">真の問題を特定する</text>
<line x1="144" y1="158" x2="144" y2="170" class="l sa w2"/>
<polyline points="141.25,165 144,170 146.75,165" class="l sa w2"/>
<rect x="12" y="172" width="264" height="54" class="fas sa" stroke-width="1.5"/>
<text x="24" y="195" class="tb">3　創造</text>
<text x="24" y="214" class="tm">アイデアを広げる</text>
<line x1="144" y1="228" x2="144" y2="240" class="l sa w2"/>
<polyline points="141.25,235 144,240 146.75,235" class="l sa w2"/>
<rect x="12" y="242" width="264" height="54" class="fas sa" stroke-width="1.5"/>
<text x="24" y="265" class="tb">4　プロトタイプ</text>
<text x="24" y="284" class="tm">試作する</text>
<line x1="144" y1="298" x2="144" y2="310" class="l sa w2"/>
<polyline points="141.25,305 144,310 146.75,305" class="l sa w2"/>
<rect x="12" y="312" width="264" height="54" class="fok sok" stroke-width="1.5"/>
<text x="24" y="335" class="tb">5　テスト</text>
<text x="24" y="354" class="tm">ユーザーのフィードバックを得る</text>
<line x1="276" y1="339" x2="304" y2="339" class="l swn w2"/>
<line x1="304" y1="339" x2="304" y2="59" class="l swn w2"/>
<line x1="304" y1="59" x2="278" y2="59" class="l swn w2"/>
<polyline points="285,55.15 278,59 285,62.85" class="l swn w2"/>
<line x1="304" y1="129" x2="278" y2="129" class="l swn w2"/>
<polyline points="285,125.15 278,129 285,132.85" class="l swn w2"/>
<line x1="304" y1="199" x2="278" y2="199" class="l swn w2"/>
<polyline points="285,195.15 278,199 285,202.85" class="l swn w2"/>
<line x1="304" y1="269" x2="278" y2="269" class="l swn w2"/>
<polyline points="285,265.15 278,269 285,272.85" class="l swn w2"/>
<text x="12" y="388">後ろのステージで新しい気付きがあれば、</text>
<text x="12" y="408" class="tb">前のステージに戻ることが推奨される</text>
</svg>
