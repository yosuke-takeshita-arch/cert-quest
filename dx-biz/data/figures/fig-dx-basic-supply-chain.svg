<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" role="img" aria-labelledby="fig-dx-basic-supply-chain-t fig-dx-basic-supply-chain-d">
<title id="fig-dx-basic-supply-chain-t">サプライチェーン＝作る・運ぶ・売るのつながり</title>
<desc id="fig-dx-basic-supply-chain-d">パンが買う人に届くまでのつながりを、上から下へ6つの箱で並べた図。小麦農家、製粉会社、パン工場、配送、スーパー、買う人の順。左の下向きの矢印は物の流れで、小麦が小麦粉になり、パンになって運ばれ、店に並ぶ。右の上向きの矢印は情報の流れで、注文や売れ行きが、買う人の側から農家の側へ逆向きに戻る。下の注記は、どこか1か所が止まるとその先が全部止まること、売れ行きのデータを上の会社まで早く伝えると、作りすぎや品切れを減らせること。</desc>
<text x="12" y="22" class="tl">サプライチェーン</text>
<text x="12" y="44" class="tm">例：パンが買う人に届くまで</text>
<text x="12" y="66" class="tb ta">物の流れ</text>
<line x1="40" y1="74" x2="40" y2="366" class="l sa w3"/>
<polygon points="40,378 33,366 47,366" class="fa"/>
<text x="308" y="66" class="tb tok" text-anchor="end">情報の流れ</text>
<line x1="280" y1="96" x2="280" y2="378" class="l sok w3"/>
<polygon points="280,84 273,96 287,96" class="fok sok" stroke-width="2"/>
<rect x="74" y="74" width="172" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="96" text-anchor="middle">小麦農家</text>
<rect x="74" y="124" width="172" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="146" text-anchor="middle">製粉会社（小麦粉）</text>
<rect x="74" y="174" width="172" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="196" text-anchor="middle">パン工場（パン）</text>
<rect x="74" y="224" width="172" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="246" text-anchor="middle">配送（運ぶ）</text>
<rect x="74" y="274" width="172" height="34" class="fs sm" stroke-width="1.5"/>
<text x="160" y="296" text-anchor="middle">スーパー（売る）</text>
<rect x="74" y="324" width="172" height="34" class="fok sok" stroke-width="1.5" rx="17"/>
<text x="160" y="346" text-anchor="middle">買う人</text>
<line x1="160" y1="108" x2="160" y2="124" class="l sm w1"/>
<line x1="160" y1="158" x2="160" y2="174" class="l sm w1"/>
<line x1="160" y1="208" x2="160" y2="224" class="l sm w1"/>
<line x1="160" y1="258" x2="160" y2="274" class="l sm w1"/>
<line x1="160" y1="308" x2="160" y2="324" class="l sm w1"/>
<text x="12" y="400" class="tm">小麦→小麦粉→パン</text>
<text x="308" y="400" class="tm" text-anchor="end">注文・売れ行き</text>
<line x1="12" y1="414" x2="308" y2="414" class="l sb w1"/>
<text x="12" y="436">1か所が止まると、その先が全部止まる</text>
<text x="12" y="458" class="tm">売れ行きを上まで早く伝える→作りすぎ・品切れ減</text>
</svg>
