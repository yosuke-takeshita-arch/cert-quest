<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 454" role="img" aria-labelledby="fig-dx-agent-mcp-a2a-t fig-dx-agent-mcp-a2a-d">
<title id="fig-dx-agent-mcp-a2a-t">AIエージェントとMCP・A2Aのつなぎ方</title>
<desc id="fig-dx-agent-mcp-a2a-d">中央にAIエージェント（目標を受けて、タスクに分け、実行する）。下向きにMCPで、ファイル・データベース・検索ツール・ワークフローといった外部のシステムにつながる。MCPはAIと道具（ツールやデータ）をつなぐ標準で、AIアプリケーションのためのUSB-Cポートにたとえられ、2024年11月にAnthropicが公開した。上向きにA2Aで、別の会社が作った経費・在庫などのAIエージェントとつながる。A2AはAIとAIをつなぐ規格で、2025年4月にGoogleが発表し、MCPを補完するものと位置づけられた。RAGは検索して参照する回答の作り方で、MCPやA2Aとは別のもの。</desc>
<rect x="12" y="14" width="296" height="56" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="36.5" class="tb" text-anchor="middle">別の会社のAIエージェント</text>
<text x="160" y="56.5" text-anchor="middle">（経費・在庫など）</text>
<line x1="40" y1="70" x2="40" y2="122" class="l swn w2 dsh"/>
<line x1="40" y1="110" x2="40" y2="122" class="l swn w2"/>
<polyline points="36.15,115 40,122 43.85,115" class="l swn w2"/>
<line x1="40" y1="82" x2="40" y2="70" class="l swn w2"/>
<polyline points="43.85,77 40,70 36.15,77" class="l swn w2"/>
<text x="56" y="101" class="tb">A2A：AIとAIをつなぐ</text>
<rect x="12" y="122" width="296" height="72" class="fa" stroke-width="1.5"/>
<text x="160" y="151.5" class="tb ton" text-anchor="middle">AIエージェント</text>
<text x="160" y="173.5" class="ton" text-anchor="middle">目標 → タスクに分ける → 実行</text>
<line x1="40" y1="194" x2="40" y2="240" class="l sa w2"/>
<polyline points="36.15,233 40,240 43.85,233" class="l sa w2"/>
<text x="56" y="222" class="tb">MCP：AIと道具をつなぐ</text>
<rect x="12" y="240" width="144" height="34" class="fas sa" stroke-width="1.5"/>
<text x="84" y="261.5" text-anchor="middle">ファイル</text>
<rect x="164" y="240" width="144" height="34" class="fas sa" stroke-width="1.5"/>
<text x="236" y="261.5" text-anchor="middle">データベース</text>
<rect x="12" y="280" width="144" height="34" class="fas sa" stroke-width="1.5"/>
<text x="84" y="301.5" text-anchor="middle">検索ツール</text>
<rect x="164" y="280" width="144" height="34" class="fas sa" stroke-width="1.5"/>
<text x="236" y="301.5" text-anchor="middle">ワークフロー</text>
<text x="12" y="338" class="tm">USB-Cポートのように、つなぎ方をそろえる規格</text>
<line x1="12" y1="356" x2="308" y2="356" class="l sb w1"/>
<text x="12" y="378">MCP：2024年11月 Anthropicが公開</text>
<text x="12" y="398">A2A：2025年4月 Googleが発表</text>
<text x="12" y="418">A2AはMCPを補完する位置づけ</text>
<text x="12" y="442" class="tm">RAG（検索して参照して答える方法）とは別もの</text>
</svg>
