<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 586" role="img" aria-labelledby="fig-dx-scale-t fig-dx-scale-d">
<title id="fig-dx-scale-t">スケールアップとスケールアウト</title>
<desc id="fig-dx-scale-d">上：スケールアップは、1台のサーバーをより大きなサーバーに替え、CPUやメモリなど1つのリソースの容量を増やす方法（垂直方向）。逆がスケールダウン。中：スケールアウトは、サーバーの台数を増やして処理を分け合う方法（水平方向）。減らすのがスケールイン。複数の可用性ゾーンにまたがると障害にも強くなる。下：スケールアウトはすべての性能問題を直す魔法ではない。バックエンドのデータベースがボトルネックなら、Webサーバーを足しても改善しない。データベースでは、RDBは通常スケールアップ（読み取りはレプリカでスケールアウト）、NoSQLは通常スケールアウトで伸ばす。</desc>
<text x="12" y="22" class="tb">スケールアップ：1台を大きくする（縦）</text>
<rect x="12" y="56" width="70" height="40" class="fs sa" stroke-width="1.5"/>
<text x="47" y="72" text-anchor="middle">サーバー</text>
<text x="47" y="89" text-anchor="middle">（小）</text>
<line x1="88" y1="76" x2="150" y2="76" class="l sa w2"/>
<polyline points="143,79.85 150,76 143,72.15" class="l sa w2"/>
<rect x="156" y="32" width="152" height="88" class="fa" stroke-width="1.5"/>
<text x="232" y="60.5" class="tb ton" text-anchor="middle">大きなサーバー</text>
<text x="232" y="80.5" class="ton" text-anchor="middle">CPU・メモリなど</text>
<text x="232" y="100.5" class="ton" text-anchor="middle">の容量を増やす</text>
<text x="12" y="140" class="tm">逆に小さくするのがスケールダウン</text>
<line x1="12" y1="154" x2="308" y2="154" class="l sb w1"/>
<text x="12" y="176" class="tb">スケールアウト：台数を増やす（横）</text>
<rect x="104" y="188" width="112" height="30" class="fwn swn" stroke-width="1.5"/>
<text x="160" y="207.5" text-anchor="middle">負荷を分ける装置</text>
<line x1="140" y1="218" x2="58" y2="240" class="l sa w2"/>
<polyline points="62.94,235.26 58,240 64.65,241.63" class="l sa w2"/>
<line x1="160" y1="218" x2="160" y2="240" class="l sa w2"/>
<polyline points="156.7,234 160,240 163.3,234" class="l sa w2"/>
<line x1="180" y1="218" x2="262" y2="240" class="l sa w2"/>
<polyline points="255.35,241.63 262,240 257.06,235.26" class="l sa w2"/>
<rect x="12" y="242" width="92" height="34" class="fas sa" stroke-width="1.5"/>
<text x="58" y="263.5" text-anchor="middle">サーバー</text>
<rect x="114" y="242" width="92" height="34" class="fas sa" stroke-width="1.5"/>
<text x="160" y="263.5" text-anchor="middle">サーバー</text>
<rect x="216" y="242" width="92" height="34" class="fas sa" stroke-width="1.5"/>
<text x="262" y="263.5" text-anchor="middle">サーバー</text>
<text x="12" y="296" class="tm">処理を分け合う。減らすのがスケールイン</text>
<text x="12" y="316" class="tm">複数のゾーンにまたがると障害に強い</text>
<line x1="12" y1="332" x2="308" y2="332" class="l sb w1"/>
<text x="12" y="354" class="tb">ただし、台数を足せば解決とは限らない</text>
<rect x="12" y="366" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="34" y="385.5" text-anchor="middle">Web</text>
<line x1="34" y1="396" x2="150" y2="418" class="l sm w1"/>
<polyline points="144.58,419.77 150,418 145.6,414.37" class="l sm w1"/>
<rect x="64" y="366" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="86" y="385.5" text-anchor="middle">Web</text>
<line x1="86" y1="396" x2="150" y2="418" class="l sm w1"/>
<polyline points="144.38,418.98 150,418 146.17,413.77" class="l sm w1"/>
<rect x="116" y="366" width="44" height="30" class="fas sa" stroke-width="1.5"/>
<text x="138" y="385.5" text-anchor="middle">Web</text>
<line x1="138" y1="396" x2="150" y2="418" class="l sm w1"/>
<polyline points="145.19,414.93 150,418 150.02,412.29" class="l sm w1"/>
<rect x="156" y="418" width="152" height="34" class="fng sng" stroke-width="1.5"/>
<text x="232" y="439.5" class="tb" text-anchor="middle">データベース（詰まる）</text>
<text x="12" y="474">データベースが詰まっていると、</text>
<text x="12" y="494">Webサーバーを足しても改善しない</text>
<text x="12" y="530" class="tb">RDB：通常はスケールアップ</text>
<text x="12" y="550" class="tm">（読み取りはレプリカでスケールアウト）</text>
<text x="12" y="574" class="tb">NoSQL：通常はスケールアウト</text>
</svg>
