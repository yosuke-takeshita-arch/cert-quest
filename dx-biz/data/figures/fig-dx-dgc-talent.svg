<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-labelledby="fig-dx-dgc-talent-t fig-dx-dgc-talent-d">
<title id="fig-dx-dgc-talent-t">デジタル人材：育てる・採る・借りる・動かす、に加えて評価して報いる</title>
<desc id="fig-dx-dgc-talent-d">何のための図か：デジタルガバナンス・コード3.0の「デジタル人材の育成・確保」の望ましい方向性を、確保の手段と、身につけた後の仕組みに分けて見る。確保の手段の例は、計画的な育成、中途採用、外部アドバイザー・パートナーの活用、事業部門とIT担当部門の間の人事異動。身につけた後の仕組みとして、専門知識の活用や試験・資格などのスキル証明で適性を評価し処遇する人事制度と、より実践的なスキルを身につけられる人材配置の仕組みを挙げる。D社のように、スキル証明を評価や処遇に反映せず、配置も従来どおりにするのは、この方向性と逆。</desc>
<text x="12" y="20" class="tb">デジタル人材：確保して、評価して報いる</text>
<text x="12" y="42" class="tm">デジタルガバナンス・コード3.0の方向性</text>
<text x="12" y="70" class="tb ta">① 確保する手段（コードが挙げる例）</text>
<rect x="12" y="80" width="70" height="88" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="47" y="111" text-anchor="middle" class="tb">育てる</text>
<text x="47" y="129" text-anchor="middle" class="tm">計画的に</text>
<text x="47" y="147" text-anchor="middle" class="tm">育成</text>
<rect x="87" y="80" width="70" height="88" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="122" y="120" text-anchor="middle" class="tb">採る</text>
<text x="122" y="138" text-anchor="middle" class="tm">中途採用</text>
<rect x="162" y="80" width="70" height="88" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="197" y="102" text-anchor="middle" class="tb">借りる</text>
<text x="197" y="120" text-anchor="middle" class="tm">外部の</text>
<text x="197" y="138" text-anchor="middle" class="tm">助言者・</text>
<text x="197" y="156" text-anchor="middle" class="tm">協力先</text>
<rect x="237" y="80" width="70" height="88" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="272" y="102" text-anchor="middle" class="tb">動かす</text>
<text x="272" y="120" text-anchor="middle" class="tm">事業部門</text>
<text x="272" y="138" text-anchor="middle" class="tm">とIT部門</text>
<text x="272" y="156" text-anchor="middle" class="tm">の異動</text>
<text x="12" y="198" class="tb ta">② 身につけた後の仕組み</text>
<rect x="12" y="206" width="296" height="110" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="22" y="230" class="tb tok">評価して報いる</text>
<text x="22" y="248">スキル証明（試験・資格など）で適性を</text>
<text x="22" y="266">評価し、処遇する人事制度</text>
<text x="22" y="286" class="tb tok">実践的なスキルが身につく配置</text>
<text x="22" y="304">学んだことを使える場所に置く</text>
<text x="12" y="346" class="tb tng">× D社</text>
<rect x="12" y="354" width="296" height="72" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="22" y="376">資格を取っても評価・処遇に反映しない</text>
<text x="22" y="394">配置も従来どおり</text>
<text x="22" y="414" class="tb tng">→ コードの望ましい方向性と逆</text>
</svg>
