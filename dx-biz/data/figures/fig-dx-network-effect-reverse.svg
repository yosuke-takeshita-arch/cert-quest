<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="fig-dx-network-effect-reverse-t fig-dx-network-effect-reverse-d">
<title id="fig-dx-network-effect-reverse-t">ネットワーク効果は逆向きにも働く：仲間が去ると、残る価値が下がる</title>
<desc id="fig-dx-network-effect-reverse-d">何のための図か：ネットワーク効果が、利用者を集める向きだけでなく、利用者が去る向きにも働くことを見る。上の段は集める向き。利用者が増えると、サービスの価値が上がり、さらに利用者が集まる。下の段は去る向き。家族や友人が別のサービスへ移ると、残ったサービスの価値が下がり、自分も移り、さらに利用者が去る。同じ仕組みが逆に回る。例は令和元年版情報通信白書の mixi と Facebook。mixi は2000年代後半に利用者が一時2000万人を超えたとされ、Facebook（2017年9月時点で2800万人）へ乗り換えた利用者が多いと考えられ、その背景には家族や友人が乗り換えたからというケースも多いとされる。利用者が多いことは強みだが、首位を保証しない。</desc>
<text x="12" y="20" class="tb">ネットワーク効果は、逆向きにも働く</text>
<text x="12" y="42" class="tm">同じ仕組みが、どちら向きにも回る</text>
<text x="12" y="70" class="tb tok">① 集める向き</text>
<rect x="12" y="80" width="88" height="50" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="56" y="101" text-anchor="middle">利用者が</text>
<text x="56" y="119" text-anchor="middle">増える</text>
<rect x="116" y="80" width="88" height="50" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="160" y="101" text-anchor="middle">価値が</text>
<text x="160" y="119" text-anchor="middle">上がる</text>
<rect x="220" y="80" width="88" height="50" class="fok sok" stroke-width="1.5" rx="6"/>
<text x="264" y="101" text-anchor="middle">さらに</text>
<text x="264" y="119" text-anchor="middle">集まる</text>
<line x1="101" y1="105" x2="109" y2="105" class="l sa w2"/>
<polyline points="108,100 115,105 108,110" class="l sa w2" fill="none"/>
<line x1="205" y1="105" x2="213" y2="105" class="l sa w2"/>
<polyline points="212,100 219,105 212,110" class="l sa w2" fill="none"/>
<text x="12" y="158" class="tb tng">② 去る向き</text>
<rect x="12" y="168" width="88" height="50" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="56" y="189" text-anchor="middle">仲間が</text>
<text x="56" y="207" text-anchor="middle">別へ移る</text>
<rect x="116" y="168" width="88" height="50" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="160" y="189" text-anchor="middle">残る価値</text>
<text x="160" y="207" text-anchor="middle">が下がる</text>
<rect x="220" y="168" width="88" height="50" class="fng sng" stroke-width="1.5" rx="6"/>
<text x="264" y="189" text-anchor="middle">自分も</text>
<text x="264" y="207" text-anchor="middle">移る</text>
<line x1="101" y1="193" x2="109" y2="193" class="l sa w2"/>
<polyline points="108,188 115,193 108,198" class="l sa w2" fill="none"/>
<line x1="205" y1="193" x2="213" y2="193" class="l sa w2"/>
<polyline points="212,188 219,193 212,198" class="l sa w2" fill="none"/>
<text x="12" y="242" class="tb tng">→ さらに利用者が去る（逆回りの輪）</text>
<line x1="12" y1="254" x2="308" y2="254" class="l sb w1"/>
<text x="12" y="278" class="tb">例（令和元年版 情報通信白書）</text>
<text x="12" y="296">mixi：利用者が一時2000万人を超えたとされる</text>
<text x="12" y="314">→ Facebook（2017年9月時点で2800万人）へ</text>
<text x="12" y="332" class="tm">乗り換えた利用者が多いと考えられる</text>
<text x="12" y="350" class="tm">背景には、家族や友人の乗り換えも多い</text>
<rect x="12" y="362" width="296" height="34" class="fs sb" stroke-width="1.5" rx="6"/>
<text x="22" y="384">利用者の多さは強み。でも首位の保証ではない</text>
</svg>
