<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" role="img" aria-labelledby="fig-dx-eventual-consistency-t fig-dx-eventual-consistency-d">
<title id="fig-dx-eventual-consistency-t">サービスごとにデータベースを分けたときの得と損</title>
<desc id="fig-dx-eventual-consistency-d">IPAのDX白書2023の説明を描いた図。注文・在庫・支払いを別々のサービスに分け、それぞれが自分のデータベース（DB）を持ち、ほかのサービスのデータはAPI経由でだけ扱う。得は、1つのDBを直しても他に響きにくく、改修の頻度を上げられること（疎結合）。損は、サービス間でデータが一時的に食い違いうること。説明のための例として、注文が1件入った直後は、注文DBには注文があるのに在庫DBはまだ3のままで、少し後に2に減って一致する。時間が経てば一致する（結果整合性）が、いつでも一致する（即時整合性）ことは保証されず、障害時には補償トランザクション（前の処理を打ち消す処理）など複雑な制御が要る。ほかのサービスのDBを直接読み書きする形に戻すと、分けた利点を失う。</desc>
<rect x="12" y="14" width="296" height="128" class="fs sb" stroke-width="1.5"/>
<text x="24" y="36" class="tb">注文・在庫・支払いを別のサービスに</text>
<rect x="24" y="48" width="72" height="28" class="fas sa" stroke-width="1.5"/>,<text x="60" y="66.5" text-anchor="middle">注文</text>,<line x1="60" y1="76" x2="60" y2="90" class="l sm w1"/>,<rect x="22" y="90" width="76" height="24" rx="8" class="fs sm" stroke-width="1.5"/>,<text x="60" y="106.5" class="tm" text-anchor="middle">注文のDB</text>
<rect x="124" y="48" width="72" height="28" class="fas sa" stroke-width="1.5"/>,<text x="160" y="66.5" text-anchor="middle">在庫</text>,<line x1="160" y1="76" x2="160" y2="90" class="l sm w1"/>,<rect x="122" y="90" width="76" height="24" rx="8" class="fs sm" stroke-width="1.5"/>,<text x="160" y="106.5" class="tm" text-anchor="middle">在庫のDB</text>
<rect x="224" y="48" width="72" height="28" class="fas sa" stroke-width="1.5"/>,<text x="260" y="66.5" text-anchor="middle">支払い</text>,<line x1="260" y1="76" x2="260" y2="90" class="l sm w1"/>,<rect x="222" y="90" width="76" height="24" rx="8" class="fs sm" stroke-width="1.5"/>,<text x="260" y="106.5" class="tm" text-anchor="middle">支払いのDB</text>
<line x1="98" y1="62" x2="122" y2="62" class="l sa w1"/>
<polyline points="116,65.3 122,62 116,58.7" class="l sa w1"/>
<line x1="122" y1="62" x2="98" y2="62" class="l sa w1"/>
<polyline points="104,58.7 98,62 104,65.3" class="l sa w1"/>
<line x1="198" y1="62" x2="222" y2="62" class="l sa w1"/>
<polyline points="216,65.3 222,62 216,58.7" class="l sa w1"/>
<line x1="222" y1="62" x2="198" y2="62" class="l sa w1"/>
<polyline points="204,58.7 198,62 204,65.3" class="l sa w1"/>
<text x="110" y="56" class="ta" text-anchor="middle">API</text>
<text x="210" y="56" class="ta" text-anchor="middle">API</text>
<text x="24" y="132" class="tm">他のサービスのDBには直接さわらない</text>
<rect x="12" y="154" width="296" height="70" class="fok sok" stroke-width="1.5"/>
<text x="24" y="176" class="tb">○ 得：独立して直せる</text>
<text x="24" y="196">1つのDBを直しても他に響きにくい</text>
<text x="24" y="214">→ 改修の頻度を上げられる</text>
<rect x="12" y="236" width="296" height="192" class="fng sng" stroke-width="1.5"/>
<text x="24" y="258" class="tb">△ 損：一時的に食い違いうる</text>
<text x="24" y="278" class="tm">説明のための例：注文が1件入った</text>
<text x="160" y="298" class="tb" text-anchor="middle">直後</text>
<text x="250" y="298" class="tb" text-anchor="middle">少し後</text>
<text x="24" y="318">注文のDB</text>
<text x="160" y="318" text-anchor="middle">注文あり</text>
<text x="250" y="318" text-anchor="middle">注文あり</text>
<text x="24" y="338">在庫のDB</text>
<text x="160" y="338" class="tb tng" text-anchor="middle">3のまま</text>
<text x="250" y="338" class="tb tok" text-anchor="middle">2に減る</text>
<text x="24" y="360">→ 時間が経てば一致（結果整合性）</text>
<text x="24" y="378">いつでも一致（即時整合性）は保証されない</text>
<text x="24" y="398">障害時は補償トランザクション（前の</text>
<text x="24" y="416">処理を打ち消す処理）など制御が複雑</text>
<rect x="12" y="440" width="296" height="50" class="fs sb" stroke-width="1.5"/>
<text x="24" y="462" class="tb">✕ 他のDBを直接読み書きに戻す</text>
<text x="24" y="480" class="tm">→ 分けた利点（独立して直せる）を失う</text>
</svg>
