<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 424" role="img" aria-labelledby="fig-dx-3v-t fig-dx-3v-d">
<title id="fig-dx-3v-t">ビッグデータの性質（3V）と、それを扱う仕組み</title>
<desc id="fig-dx-3v-d">上：ビッグデータの性質を4つの箱で示す。量（Volume）はデータの大きさ（例：数百台ぶんの記録）。速度（Velocity）は流れ込む速さ（例：1秒ごとに届く値）。多様性（Variety）は出どころ・種類の多さ（例：数値と画像）。この3つが3V。NISTはこれに変動性（Variability：速さ・形式・意味・品質が変わること）を加える（点線の箱）。下：こうした性質のデータを効率よく扱うには、拡張できる構成が要る。1台の性能を上げる垂直スケーリングだけでなく、計算機を足して並列に処理する水平スケーリングが中心になる（NIST）。</desc>
<text x="12" y="22" class="tb">ビッグデータの性質（3V）</text>
<rect x="12" y="30" width="296" height="46" class="fas sa" stroke-width="1.5"/>
<text x="24" y="49" class="tb">量（Volume）</text>
<text x="24" y="68">データの大きさ　例：数百台ぶんの記録</text>
<rect x="12" y="84" width="296" height="46" class="fas sa" stroke-width="1.5"/>
<text x="24" y="103" class="tb">速度（Velocity）</text>
<text x="24" y="122">流れ込む速さ　例：1秒ごとに届く値</text>
<rect x="12" y="138" width="296" height="46" class="fas sa" stroke-width="1.5"/>
<text x="24" y="157" class="tb">多様性（Variety）</text>
<text x="24" y="176">出どころ・種類の多さ　例：数値と画像</text>
<rect x="12" y="192" width="296" height="46" class="fs sm dsh" stroke-width="1.5"/>
<text x="24" y="211" class="tb">変動性（Variability）</text>
<text x="296" y="211" class="tm" text-anchor="end">NISTが加える</text>
<text x="24" y="230">速さ・形式・意味・品質が変わること</text>
<line x1="160" y1="242" x2="160" y2="262" class="l sa w2"/>
<polyline points="156.15,255 160,262 163.85,255" class="l sa w2"/>
<rect x="12" y="266" width="296" height="34" class="fs sa" stroke-width="1.5"/>
<text x="160" y="287.5" class="tb" text-anchor="middle">効率よく扱うには、拡張できる構成が要る</text>
<rect x="12" y="314" width="142" height="54" class="fs sm" stroke-width="1.5"/>
<text x="83" y="336" text-anchor="middle">1台の性能を上げる</text>
<text x="83" y="356" class="tm" text-anchor="middle">（垂直スケーリング）</text>
<rect x="166" y="314" width="142" height="54" class="fok sok" stroke-width="1.5"/>
<text x="237" y="336" class="tb" text-anchor="middle">計算機を足して並列に</text>
<text x="237" y="356" class="tm" text-anchor="middle">（水平スケーリング）</text>
<text x="12" y="392">1台を強くするだけでなく、計算機を足して</text>
<text x="12" y="411" class="tb">並列に処理するのが中心（NIST）</text>
</svg>
