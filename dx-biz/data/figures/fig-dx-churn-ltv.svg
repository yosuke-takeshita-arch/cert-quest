<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 445" role="img" aria-labelledby="fig-dx-churn-ltv-t fig-dx-churn-ltv-d">
<title id="fig-dx-churn-ltv-t">解約率と顧客生涯価値（LTV）</title>
<desc id="fig-dx-churn-ltv-d">上：毎月の解約率が5%と2%のとき、顧客100人が12か月でどれだけ残るかの2本の線（数値は例）。解約率5%では約54人、2%では約78人に減る。解約率の小さな差が、大きな差になる。下：サブスクリプションのLTV（顧客生涯価値）は、ARPA（顧客あたりの平均売上）を解約率（チャーンレート）で割って求める。顧客あたりの平均売上が月1,000円のとき、解約率5%ならLTVは20,000円、2%なら50,000円（数値は例）。解約しにくくしてLTVを上げるのは問題で、違約金や店頭でしか解約できない仕組みは、見かけのロイヤルティにすぎない。</desc>
<text x="12" y="22" class="tb">解約率が違うと、顧客はこう減る（例）</text>
<line x1="56" y1="32" x2="56" y2="162" class="l sm w1"/>
<line x1="56" y1="162" x2="216" y2="162" class="l sm w1"/>
<text x="12" y="42" class="tm">100人</text>
<text x="28" y="166" class="tm">0</text>
<polyline points="56,32 69.33,38.5 82.67,44.67 96,50.54 109.33,56.11 122.67,61.41 136,66.44 149.33,71.22 162.67,75.76 176,80.07 189.33,84.16 202.67,88.06 216,91.75" class="l sng w3"/>
<polyline points="56,32 69.33,34.6 82.67,37.15 96,39.65 109.33,42.09 122.67,44.49 136,46.84 149.33,49.14 162.67,51.4 176,53.61 189.33,55.78 202.67,57.9 216,59.99" class="l sok w3"/>
<text x="222" y="63.99" class="tb">2%：約78</text>
<text x="222" y="95.75" class="tb">5%：約54</text>
<text x="56" y="182" class="tm">0か月</text>
<text x="172" y="182" class="tm">12か月</text>
<text x="12" y="202">毎月の解約率：細い差が、大きな差になる</text>
<line x1="12" y1="224" x2="308" y2="224" class="l sb w1"/>
<text x="12" y="246" class="tb">LTV＝ARPA ÷ 解約率（サブスク）</text>
<text x="12" y="272" class="tm">ARPA：顧客あたりの平均売上</text>
<rect x="12" y="282" width="140" height="50" class="fng sng" stroke-width="1.5"/>
<text x="82" y="302" class="tb" text-anchor="middle">解約率5%</text>
<text x="82" y="321" text-anchor="middle">LTV 20,000円</text>
<rect x="168" y="282" width="140" height="50" class="fok sok" stroke-width="1.5"/>
<text x="238" y="302" class="tb" text-anchor="middle">解約率2%</text>
<text x="238" y="321" text-anchor="middle">LTV 50,000円</text>
<text x="12" y="352" class="tm">平均売上が月1,000円のとき（例）</text>
<line x1="12" y1="372" x2="308" y2="372" class="l sb w1"/>
<text x="12" y="394" class="tb">解約しにくくしてLTVを上げるのは問題</text>
<text x="12" y="414">違約金・店頭でしか解約できない仕組みは、</text>
<text x="12" y="433">見かけのロイヤルティにすぎない</text>
</svg>
