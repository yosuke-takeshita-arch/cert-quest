<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 416" role="img" aria-labelledby="fig-dx-blockchain-t fig-dx-blockchain-d">
<title id="fig-dx-blockchain-t">ブロックチェーン：取引の記録を参加者で分散して持ち合う</title>
<desc id="fig-dx-blockchain-d">ブロックチェーンは、暗号・P2P・分散合意形成などの技術を基盤に、取引の記録を参加者が分散して持ち合う仕組み。5人の参加者が同じ記録を持ち合う網の図。特徴は、情報を共有しても改ざんされにくいこと、価値流通の仕組みを作れること、価値のトレーサビリティ（産地や流通経路の追跡）を担保できること。</desc>
<text x="12" y="22" class="tb">参加者が、同じ記録を持ち合う</text>
