<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 428" role="img" aria-labelledby="fig-dx-lean-startup-t fig-dx-lean-startup-d">
<title id="fig-dx-lean-startup-t">リーンスタートアップ：MVPを作って、測って、学ぶ</title>
<desc id="fig-dx-lean-startup-d">輪の図。作る（Build）：必要最小限の製品（MVP）を素早く作る。測る（Measure）：顧客の反応を計測する。学ぶ（Learn）：反応から学び、改良するか方向転換（ピボット）するかを決める。そして、また作る。比較として、最初から完璧に作り込む長い一本道では、顧客の反応が分かるのは完成してからになる。MVPは、実用的で最小限の範囲で動くプロダクト。</desc>
<text x="12" y="22" class="tb">小さな輪を何度も回す</text>
<rect x="12" y="32" width="276" height="56" class="fwn swn" stroke-width="1.5"/>
<text x="24" y="56" class="tb">作る（Build）</text>
<text x="24" y="76">必要最小限の製品（MVP）を作る</text>
<line x1="150" y1="90" x2="150" y2="106" class="l sa w2"/>
<polyline points="146.7,100 150,106 153.3,100" class="l sa w2"/>
<rect x="12" y="108" width="276" height="56" class="fas sa" stroke-width="1.5"/>
<text x="24" y="132" class="tb">測る（Measure）</text>
<text x="24" y="152">顧客の反応を計測する</text>
<line x1="150" y1="166" x2="150" y2="182" class="l sa w2"/>
<polyline points="146.7,176 150,182 153.3,176" class="l sa w2"/>
<rect x="12" y="184" width="276" height="56" class="fok sok" stroke-width="1.5"/>
<text x="24" y="208" class="tb">学ぶ（Learn）</text>
<text x="24" y="228">改良か、方向転換（ピボット）かを決める</text>
<line x1="288" y1="212" x2="304" y2="212" class="l sa w2"/>
<line x1="304" y1="212" x2="304" y2="60" class="l sa w2"/>
<line x1="304" y1="60" x2="290" y2="60" class="l sa w2"/>
<polyline points="297,56.15 290,60 297,63.85" class="l sa w2"/>
<text x="12" y="262" class="tm">MVP：実用的で最小限の範囲で動く製品</text>
<line x1="12" y1="282" x2="308" y2="282" class="l sb w1"/>
<text x="12" y="306" class="tb">比べると：最初から完璧に作り込む</text>
<rect x="12" y="320" width="296" height="40" class="fs sm" stroke-width="1.5"/>
<text x="160" y="344.5" text-anchor="middle">長い時間をかけて、全部を作り込む</text>
<line x1="160" y1="360" x2="160" y2="378" class="l sm w2"/>
<polyline points="156.7,372 160,378 163.3,372" class="l sm w2"/>
<rect x="12" y="380" width="296" height="40" class="fs sm" stroke-width="1.5"/>
<text x="160" y="404.5" text-anchor="middle">完成してから、初めて反応が分かる</text>
</svg>
